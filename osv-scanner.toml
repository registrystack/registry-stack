[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-01-31
reason = "atomic-polyfill is selected through Crosswalk -> phonenumber -> postcard -> heapless only for unsupported embedded targets. Registry Stack builds service targets, and the crate is not compiled into those binaries. Review when the chain removes it or before supporting AVR, riscv32i/riscv32imc, thumbv6m, or xtensa-esp32s2."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-01-31
reason = "paste is an unmaintained build-time procedural macro in the DataFusion and Parquet graph, not request-facing runtime code, and no patched release exists. Review when DataFusion or Parquet removes it or before upgrading those major versions."

[[IgnoredVulns]]
id = "GHSA-2f9f-gq7v-9h6m"
ignoreUntil = 2026-10-31
reason = "Parquet 58 retains thrift 0.17 only for its deprecated public format compatibility module and CLI. Registry Stack does not import those APIs; its Parquet paths use Parquet's internal slice protocol. Review when DataFusion supports Parquet 59, which removes the thrift dependency, or before using parquet::format or parquet::thrift."
