<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img"
     font-family="'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
     text-rendering="geometricPrecision">
  <title>Country evidence mesh</title>
  <desc>At country scale several authorities each keep custody of their own data. Clinical health systems expose bounded outputs through a reviewed FHIR integration, public-health programme systems such as DHIS2 through a reviewed Rhai script, and civil registration, social protection, agriculture, and education systems keep their own authoritative stores. Two bounded surfaces sit over them: Registry Relay keeps source credentials and returns only reviewed typed outputs, and Evidence returns only the values a reviewed requirement declares. Consuming systems such as a social-protection management information system receive those answers and do not become raw-record readers.</desc>

  <text x="16" y="22" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">AUTHORITIES</text>
  <rect x="16" y="30" width="32" height="2" fill="#000091"/>
  <text x="16" y="54" fill="#3a3a3a" font-size="12.5">Each authority keeps custody of its own data and exposes bounded outputs.</text>

  <g fill="#161616" font-size="13" font-weight="700">
    <text x="16" y="88">Clinical health</text>
    <text x="250" y="88">Public health (DHIS2)</text>
    <text x="484" y="88">Civil registration</text>
    <text x="16" y="140">Social protection</text>
    <text x="250" y="140">Agriculture</text>
    <text x="484" y="140">Education</text>
  </g>

  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="106">Reviewed FHIR integration.</text>
    <text x="250" y="106">Reviewed Rhai script.</text>
    <text x="484" y="106">Own authoritative store.</text>
    <text x="16" y="158">Own authoritative store.</text>
    <text x="250" y="158">Own authoritative store.</text>
    <text x="484" y="158">Own authoritative store.</text>
  </g>

  <g stroke="#000091" stroke-width="1" fill="none">
    <line x1="24" y1="180" x2="24" y2="208"/>
    <polyline points="20,202 24,208 28,202"/>
    <line x1="384" y1="180" x2="384" y2="208"/>
    <polyline points="380,202 384,208 388,202"/>
  </g>
  <g fill="#6a6a6a" font-size="11">
    <text x="38" y="200">bounded outputs</text>
    <text x="398" y="200">bounded outputs</text>
  </g>

  <line x1="360" y1="222" x2="360" y2="352" stroke="#e5e5e5" stroke-width="1"/>

  <g fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">
    <text x="16" y="236">PROTECTED READ</text>
    <text x="376" y="236">MINIMUM DISCLOSURE</text>
  </g>
  <g fill="#000091">
    <rect x="16" y="244" width="32" height="2"/>
    <rect x="376" y="244" width="32" height="2"/>
  </g>

  <g fill="#161616" font-size="14" font-weight="700">
    <text x="16" y="270">Registry Relay</text>
    <text x="376" y="270">Evidence</text>
  </g>
  <g fill="#6a6a6a" font-size="11.5"
     font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">
    <text x="16" y="288">registry-relay</text>
    <text x="376" y="288">registry-evidence</text>
  </g>

  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="318">Keeps source credentials and</text>
    <text x="16" y="336">returns only reviewed typed outputs.</text>
    <text x="376" y="318">Returns only the values a reviewed</text>
    <text x="376" y="336">requirement declares.</text>
  </g>

  <g stroke="#000091" stroke-width="1" fill="none">
    <line x1="24" y1="356" x2="24" y2="384"/>
    <polyline points="20,378 24,384 28,378"/>
    <line x1="384" y1="356" x2="384" y2="384"/>
    <polyline points="380,378 384,384 388,378"/>
  </g>
  <g fill="#6a6a6a" font-size="11">
    <text x="38" y="376">reviewed typed outputs</text>
    <text x="398" y="376">declared values only</text>
  </g>

  <text x="16" y="414" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">CONSUMING SYSTEMS</text>
  <rect x="16" y="422" width="32" height="2" fill="#000091"/>
  <text x="16" y="448" fill="#161616" font-size="14" font-weight="700">Social-protection MIS and other consumers</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="478">Receive the answers these surfaces return, and do not become</text>
    <text x="16" y="496">raw-record readers.</text>
  </g>
</svg>
