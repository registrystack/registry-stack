<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img"
     font-family="'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
     text-rendering="geometricPrecision">
  <title>Historical Solmara Lab compose topology, the Evidence Gateway path</title>
  <desc>The retired five-hop demo topology. One, your shell signs a request with the demo caller's own key and sends it to Registry Mint on host port 4341. Two, Mint returns a short-lived access token. Three, your shell presents that token to Evidence Gateway on host port 4343 and asks one question: is this subject an adult. Four, the historical Evidence Gateway deployment reads two fields of one row, uin and birth_date, from the Civil Registration Authority's records Relay on host port 4342, under the recorded purpose adult-status-verification. Five, Evidence Gateway returns a signed answer carrying true or false and no record. Evidence Gateway does not require Registry Relay as a source.</desc>

  <text x="16" y="22" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">HISTORICAL SOLMARA LAB · EVIDENCE GATEWAY PATH</text>
  <rect x="16" y="30" width="32" height="2" fill="#000091"/>

  <!-- The caller: your shell -->
  <rect x="16" y="132" width="160" height="80" fill="#ffffff" stroke="#161616" stroke-width="1"/>
  <rect x="16" y="132" width="4" height="80" fill="#000091"/>
  <text x="32" y="158" fill="#161616" font-size="10.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">curl</text>
  <g fill="#3a3a3a" font-size="11">
    <text x="32" y="178">Your shell, holding</text>
    <text x="32" y="194">the caller's own key</text>
  </g>

  <!-- Registry Mint -->
  <rect x="280" y="76" width="180" height="64" fill="#ffffff" stroke="#161616" stroke-width="1"/>
  <text x="296" y="102" fill="#161616" font-size="10.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">mint</text>
  <text x="444" y="102" fill="#6a6a6a" font-size="10.5" text-anchor="end"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">:4341</text>
  <text x="296" y="122" fill="#3a3a3a" font-size="11">Registry Mint</text>

  <!-- Evidence Gateway -->
  <rect x="280" y="196" width="180" height="84" fill="#ffffff" stroke="#161616" stroke-width="1"/>
  <rect x="280" y="196" width="4" height="84" fill="#000091"/>
  <text x="296" y="222" fill="#000091" font-size="10.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">evidence</text>
  <text x="444" y="222" fill="#6a6a6a" font-size="10.5" text-anchor="end"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">:4343</text>
  <g fill="#3a3a3a" font-size="11">
    <text x="296" y="244">Evidence Gateway:</text>
    <text x="296" y="262">is this subject an adult?</text>
  </g>

  <!-- The records Relay -->
  <rect x="508" y="196" width="196" height="84" fill="#ffffff" stroke="#161616" stroke-width="1"/>
  <text x="524" y="222" fill="#161616" font-size="10.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">cra-records-relay</text>
  <text x="688" y="240" fill="#6a6a6a" font-size="10.5" text-anchor="end"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">:4342</text>
  <g fill="#3a3a3a" font-size="11">
    <text x="524" y="242">Registry Relay over</text>
    <text x="524" y="258">the civil register:</text>
    <text x="524" y="274">two fields of one row</text>
  </g>

  <!-- 1: the caller signs with its own key -->
  <g stroke="#000091" stroke-width="1" fill="none">
    <polyline points="176,156 212,156 212,96 280,96"/>
    <polyline points="274,92 280,96 274,100"/>
  </g>
  <text x="190" y="150" fill="#000091" font-size="11" font-weight="700">1</text>

  <!-- 2: Mint returns an access token -->
  <g stroke="#000091" stroke-width="1" fill="none">
    <polyline points="280,124 244,124 244,184 176,184"/>
    <polyline points="182,180 176,184 182,188"/>
  </g>
  <text x="190" y="178" fill="#000091" font-size="11" font-weight="700">2</text>

  <!-- 3: the caller asks Evidence one question -->
  <g stroke="#000091" stroke-width="1" fill="none">
    <polyline points="176,200 280,200"/>
    <polyline points="274,196 280,200 274,204"/>
  </g>
  <text x="224" y="194" fill="#000091" font-size="11" font-weight="700">3</text>

  <!-- 4: The historical Gateway reads the Relay -->
  <g stroke="#000091" stroke-width="1" fill="none">
    <polyline points="460,238 508,238"/>
    <polyline points="502,234 508,238 502,242"/>
  </g>
  <text x="480" y="230" fill="#000091" font-size="11" font-weight="700">4</text>

  <!-- 5: the signed answer goes back -->
  <g stroke="#000091" stroke-width="1" fill="none">
    <polyline points="280,266 200,266 200,212"/>
    <polyline points="196,218 200,212 204,218"/>
  </g>
  <text x="236" y="260" fill="#000091" font-size="11" font-weight="700">5</text>

  <!-- What each hop is -->
  <g font-size="11" fill="#3a3a3a">
    <text x="16" y="312">1 The caller signs a request with its own key. 2 Mint returns a short-lived access token.</text>
    <text x="16" y="328">3 The caller presents that token and asks one question. 4 Evidence reads two fields under one</text>
    <text x="16" y="344">recorded purpose. 5 Evidence returns a signed answer: true or false, and no record.</text>
  </g>

  <!-- The rest of the lab -->
  <text x="16" y="374" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">THE REST OF THE LAB</text>
  <rect x="16" y="382" width="24" height="2" fill="#000091"/>
  <rect x="16" y="394" width="688" height="52" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <g fill="#161616" font-size="10.5"
     font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">
    <text x="32" y="414">6 authority relays</text>
    <text x="240" y="414">portal</text>
    <text x="336" y="414">home</text>
    <text x="440" y="414">static-metadata</text>
    <text x="592" y="414">postgres</text>
  </g>
  <g fill="#6a6a6a" font-size="10.5"
     font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">
    <text x="150" y="414">:4311-:4316</text>
    <text x="283" y="414">:4300</text>
    <text x="366" y="414">:4301</text>
    <text x="540" y="414">:4331</text>
    <text x="647" y="414">:54329</text>
  </g>
  <g fill="#3a3a3a" font-size="11">
    <text x="32" y="432">one per ministry authority</text>
    <text x="240" y="432">citizen portal</text>
    <text x="336" y="432">Visitor's Center</text>
    <text x="440" y="432">metadata bundle</text>
  </g>

  <text x="16" y="464" fill="#6a6a6a" font-size="12">All 41 long-running services start from one</text>
  <text x="272" y="464" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">just up-evidence</text>
  <text x="382" y="464" fill="#6a6a6a" font-size="12">; host ports shown are the compose defaults.</text>
</svg>
