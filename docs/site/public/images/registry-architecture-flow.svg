<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 608" role="img"
     font-family="'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
     text-rendering="geometricPrecision">
  <title>Registry architecture flow</title>
  <desc>Registry Platform provides shared primitives to both runtime services. Registry Manifest produces portable metadata contracts describing what a registry exposes. Registry Relay independently compiles a reviewed registry contract and serves protected read-only operations over one local read-only SQLite source; it does not read a Registry Manifest document. Evidence Gateway independently answers one bounded question about one subject from its own configured authoritative sources, reached over a fixed HTTP JSON request or one reviewed SQL statement against a read-only SQLite extract, and returns a signed assertion carrying the answer and not the record. Registry Mint is a supporting service that issues the short-lived access tokens Evidence Gateway verifies, for deployments with no identity provider. The external Solmara Lab adopter demo provides synthetic registry data.</desc>

  <text x="16" y="22" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">SHARED PRIMITIVES</text>
  <rect x="16" y="30" width="32" height="2" fill="#000091"/>

  <text x="16" y="64" fill="#161616" font-size="14" font-weight="700">Registry Platform</text>
  <text x="16" y="82" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">registry-platform</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="112">Shared auth, OIDC, audit, HTTP security, crypto, SD-JWT, and test crates.</text>
    <text x="16" y="130">Composed by both runtime services.</text>
  </g>

  <line x1="0" y1="156" x2="720" y2="156" stroke="#e5e5e5" stroke-width="1"/>

  <g fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">
    <text x="16" y="178">CONTRACTS</text>
    <text x="240" y="178">RUNTIME</text>
    <text x="520" y="178">EXTERNAL DEMO</text>
  </g>
  <g fill="#000091">
    <rect x="16" y="186" width="32" height="2"/>
    <rect x="240" y="186" width="32" height="2"/>
    <rect x="520" y="186" width="32" height="2"/>
  </g>

  <text x="16" y="220" fill="#161616" font-size="14" font-weight="700">Registry Manifest</text>
  <text x="16" y="238" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">registry-manifest</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="268">Portable metadata</text>
    <text x="16" y="286">contracts and</text>
    <text x="16" y="304">renderers for DCAT,</text>
    <text x="16" y="322">SHACL, JSON Schema,</text>
    <text x="16" y="340">OGC Records, and SKOS.</text>
  </g>

  <text x="240" y="220" fill="#161616" font-size="14" font-weight="700">Registry Relay</text>
  <text x="240" y="238" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">registry-relay</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="240" y="268">Compiles a reviewed registry</text>
    <text x="240" y="286">contract. Serves read-only</text>
    <text x="240" y="304">operations over one local</text>
    <text x="240" y="322">read-only SQLite source.</text>
  </g>

  <text x="240" y="392" fill="#161616" font-size="14" font-weight="700">Evidence Gateway</text>
  <text x="240" y="410" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">registry-evidence</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="240" y="440">Answers one bounded question</text>
    <text x="240" y="458">about one subject. Returns a</text>
    <text x="240" y="476">signed assertion carrying the</text>
    <text x="240" y="494">answer, not the record.</text>
  </g>

  <g stroke="#000091" stroke-width="1" fill="none">
    <line x1="476" y1="268" x2="512" y2="268"/>
    <polyline points="506,264 512,268 506,272"/>
  </g>

  <text x="520" y="220" fill="#161616" font-size="14" font-weight="700">Solmara Lab</text>
  <text x="520" y="238" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">solmara-lab</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="520" y="268">External adopter demo</text>
    <text x="520" y="286">with generated synthetic</text>
    <text x="520" y="304">registry data and demo</text>
    <text x="520" y="322">configuration.</text>
  </g>

  <line x1="0" y1="520" x2="720" y2="520" stroke="#e5e5e5" stroke-width="1"/>
  <text x="16" y="542" fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">SUPPORTING SERVICE</text>
  <rect x="16" y="550" width="32" height="2" fill="#000091"/>

  <text x="16" y="574" fill="#161616" font-size="14" font-weight="700">Registry Mint</text>
  <text x="144" y="574" fill="#6a6a6a" font-size="11.5"
        font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">registry-mint</text>
  <g fill="#3a3a3a" font-size="12.5">
    <text x="260" y="574">Issues the short-lived access tokens Evidence Gateway verifies,</text>
    <text x="260" y="592">for deployments with no identity provider.</text>
  </g>
</svg>
