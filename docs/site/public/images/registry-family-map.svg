<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img"
     font-family="'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
     text-rendering="geometricPrecision">
  <title>Registry family map</title>
  <desc>The four formal Registry Stack products, arranged left to right by structural role, followed by Registry Mint as a supporting service and the external Solmara Lab adopter demo. Registry Platform provides shared primitives; Registry Manifest defines portable metadata contracts; Registry Relay and Evidence Gateway are independent runtime services, Relay serving protected read-only APIs over sensitive registry sources and Evidence Gateway answering one bounded question about one subject with a signed assertion. Registry Mint issues the short-lived access tokens Evidence Gateway verifies, for deployments with no identity provider. Solmara Lab provides synthetic registry data and demo configuration.</desc>

  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="180" y1="16" x2="180" y2="232"/>
    <line x1="360" y1="16" x2="360" y2="232"/>
    <line x1="540" y1="16" x2="540" y2="232"/>
  </g>

  <g fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">
    <text x="16" y="30">PLATFORM</text>
    <text x="196" y="30">CONTRACTS</text>
    <text x="376" y="30">RUNTIME</text>
    <text x="556" y="30">RUNTIME</text>
  </g>

  <g fill="#000091">
    <rect x="16" y="38" width="32" height="2"/>
    <rect x="196" y="38" width="32" height="2"/>
    <rect x="376" y="38" width="32" height="2"/>
    <rect x="556" y="38" width="32" height="2"/>
  </g>

  <g fill="#000091" font-size="16" font-weight="700">
    <text x="16" y="76">1</text>
    <text x="196" y="76">2</text>
    <text x="376" y="76">3</text>
    <text x="556" y="76">4</text>
  </g>

  <g fill="#161616" font-size="13" font-weight="700">
    <text x="16" y="100">Registry Platform</text>
    <text x="196" y="100">Registry Manifest</text>
    <text x="376" y="100">Registry Relay</text>
    <text x="556" y="100">Evidence Gateway</text>
  </g>

  <g fill="#6a6a6a" font-size="11.5"
     font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">
    <text x="16" y="118">registry-platform</text>
    <text x="196" y="118">registry-manifest</text>
    <text x="376" y="118">registry-relay</text>
    <text x="556" y="118">registry-evidence</text>
  </g>

  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="150">Shared auth, audit,</text>
    <text x="16" y="168">HTTP, crypto, SD-JWT,</text>
    <text x="16" y="186">and test crates.</text>

    <text x="196" y="150">Portable metadata</text>
    <text x="196" y="168">contracts, validation,</text>
    <text x="196" y="186">and renderers.</text>

    <text x="376" y="150">Protected read-only</text>
    <text x="376" y="168">APIs over sensitive</text>
    <text x="376" y="186">registry sources.</text>

    <text x="556" y="150">One bounded question</text>
    <text x="556" y="168">about one subject,</text>
    <text x="556" y="186">answered with a</text>
    <text x="556" y="204">signed assertion.</text>
  </g>

  <line x1="0" y1="256" x2="720" y2="256" stroke="#e5e5e5" stroke-width="1"/>
  <line x1="360" y1="264" x2="360" y2="384" stroke="#e5e5e5" stroke-width="1"/>

  <g fill="#6a6a6a" font-size="11" font-weight="700" letter-spacing="0.08em">
    <text x="16" y="286">SUPPORTING SERVICE</text>
    <text x="376" y="286">EXTERNAL DEMO</text>
  </g>

  <g fill="#000091">
    <rect x="16" y="294" width="32" height="2"/>
    <rect x="376" y="294" width="32" height="2"/>
  </g>

  <g fill="#161616" font-size="13" font-weight="700">
    <text x="16" y="318">Registry Mint</text>
    <text x="376" y="318">Solmara Lab</text>
  </g>

  <g fill="#6a6a6a" font-size="11.5"
     font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace">
    <text x="16" y="336">registry-mint</text>
    <text x="376" y="336">solmara-lab</text>
  </g>

  <g fill="#3a3a3a" font-size="12.5">
    <text x="16" y="360">Issues the short-lived access tokens</text>
    <text x="16" y="378">Evidence Gateway verifies.</text>

    <text x="376" y="360">External adopter demo with synthetic</text>
    <text x="376" y="378">registry data and configuration.</text>
  </g>
</svg>
