extends:
  - recommended
apis:
  registry-casework:
    root: openapi/registry-casework.openapi.json
  registry-scheduling:
    root: openapi/registry-scheduling.openapi.json
  registry-messaging:
    root: openapi/registry-messaging.openapi.json
  registry-coordinator:
    root: openapi/registry-coordinator.openapi.json
  registry-evidence:
    root: openapi/registry-evidence.openapi.json
  registry-evidence-oid4vci:
    root: openapi/registry-evidence-oid4vci.openapi.json
  # The facility template's compiled document. The compiler emits no operation
  # summaries yet, a recorded product gap, so their absence warns rather than
  # failing the docs lint.
  registry-breg:
    root: openapi/registry-breg.openapi.json
    rules:
      operation-summary: warn
rules:
  no-empty-servers: off
  no-unused-components: warn
  operation-operationId: warn
  security-defined: warn
