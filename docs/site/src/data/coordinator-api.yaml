- id: problem-codes
  title: Problem codes
  columns: [Code, Status, When]
  rows:
    - ['`admission.held`', '409', 'Starts stay held after a restore until an operator releases the admission hold.']
    - ['`admission.recovery-only`', '409', 'This instance runs in recovery-only mode and admits no runs. Send starts to the ordinary service.']
    - ['`audit.response-unavailable`', '503', 'The operation may have completed, but its audited result could not be released. Inspect the run before repeating the operation.']
    - ['`authentication.refused`', '401', 'The bearer credential is missing, invalid, or expired.']
    - ['`binding.conflict`', '409', 'The run''s original connection settings differ from this service''s runtime configuration.']
    - ['`binding.live-conflict`', '409', 'Connection settings that runs in progress use differ from this service''s runtime configuration.']
    - ['`definition.refused`', '409', 'The workflow definition, one of its mappings or one of its functions refused the request.']
    - ['`deployment.activation-changed`', '409', 'An apply changed the active packages after this service started. Restart it with the runtime file that apply used.']
    - ['`deployment.refused`', '409', 'The deployment''s activation, runtime configuration or state key custody check failed.']
    - ['`evaluation.uncertain`', '409', 'An evaluation may have completed at its provider, so the run is never evaluated again.']
    - ['`event.invalid`', '400', 'The event envelope, source, type, schema, or trigger mapping does not match the authored contract.']
    - ['`event.source-unavailable`', '503', 'The configured event source key cannot be read. Restore that binding before redelivery.']
    - ['`event.unauthenticated`', '401', 'The delivery signature, signed metadata, or delivery time cannot be verified.']
    - ['`execution.held`', '409', 'Execution is under restore hold until an operator releases it.']
    - ['`workflow.not-served`', '404', 'This deployment does not serve the named workflow.']
    - ['`workflow.revision-mismatch`', '409', 'The expected workflow revision is not active. Discover the active contract before a new start; preserve the original revision for unknown-admission recovery.']
    - ['`idempotency.key-invalid`', '400', 'Supply an Idempotency-Key header of 1 to 256 bytes.']
    - ['`idempotency.key-reused`', '409', 'This idempotency key already names a different workflow revision or input.']
    - ['`input.invalid`', '400', 'The start input does not satisfy the workflow''s declared input schema and value bounds.']
    - ['`operation.not-authorized`', '403', 'The caller''s policy does not allow this operation.']
    - ['`receipt.expired`', '409', 'The original command''s receipt can no longer be recovered. This is not evidence that the command was not sent.']
    - ['`reconcile.raced`', '409', 'The run''s progress changed while it was being reconciled. Inspect it again.']
    - ['`reconcile.refused`', '409', 'Reconcile applies only to a held mutation with a prepared command, its original binding and no active lease.']
    - ['`reconcile.unsupported`', '409', 'The held operation has no original-result lookup.']
    - ['`request.body-too-large`', '413', 'The request body exceeds the accepted size: 65536 bytes for a JSON request, or 1048576 bytes for a signed event delivery.']
    - ['`request.invalid`', '400', 'The request could not be read as a Coordinator request.']
    - ['`request.limit-out-of-range`', '400', 'The list limit must be between 1 and 100.']
    - ['`request.method-not-allowed`', '405', 'The route exists but not for this method.']
    - ['`request.not-found`', '404', 'The requested route does not exist.']
    - ['`request.reason-invalid`', '400', 'The reason or recovery reference must be a bounded reference without personal data or control characters.']
    - ['`request.retention-invalid`', '400', 'The retention cutoff must be in the past and the limit between 1 and 100.']
    - ['`request.unprocessable`', '422', 'The request body could not be processed.']
    - ['`request.unsupported-media-type`', '415', 'The request body is not JSON.']
    - ['`restore.hold-required`', '409', 'This recovery action requires execution to be under restore hold.']
    - ['`restore.lease-incompatible`', '409', 'Held work no longer matches its protected definition or prepared command.']
    - ['`restore.review-required`', '409', 'Execution history must be complete and the prior deployment fenced before recovery is reviewed.']
    - ['`restore.unresolved`', '409', 'Held work remains unresolved, so the restore hold cannot be released.']
    - ['`retry.refused`', '409', 'Retry-same applies only to held work before its original deadline.']
    - ['`review.result-expired`', '410', 'The retained Review result is no longer available for this operation.']
    - ['`run.definition-incompatible`', '409', 'This service''s Coordinator version cannot interpret the run''s pinned definition.']
    - ['`run.not-visible`', '404', 'No run with this identifier is visible to the caller.']
    - ['`run.payload-erased`', '409', 'Retention erased this run''s payloads, so it can no longer be retried or reconciled.']
    - ['`runtime.failure`', '500', 'Coordinator could not complete the request.']
    - ['`service.unavailable`', '503', 'A dependency of the Coordinator, such as its database, audit stream or token verifier, is unavailable. Try again after the service recovers.']
- id: routes
  title: Routes
  columns: [Method, Path, Authentication, Purpose]
  rows:
    - ['`GET`', '`/health`', 'None', '`200` with `{"live":true}` while the process answers.']
    - ['`GET`', '`/ready`', 'None', '`200` with `{"ready":true}`, or `503` with `{"ready":false}` while the service cannot accept work.']
    - ['`GET`', '`/v1/workflows/{workflow}`', 'Bearer, `start` on the named workflow', 'Discover the active revision, input schema, and declared outcomes.']
    - ['`POST`', '`/v1/runs`', 'Bearer, `start` on the named workflow', 'Start one run with the expected `workflowRevision` and an `Idempotency-Key`.']
    - ['`GET`', '`/v1/runs`', 'Bearer, `status`', 'List at most 100 of the most recently admitted runs the caller may see, newest first.']
    - ['`GET`', '`/v1/runs/{run}`', 'Bearer, `status`', 'Read one run''s progress and its reviewed terminal output.']
    - ['`GET`', '`/v1/runs/{run}/inspect`', 'Bearer, `inspect`', 'Read bounded steps, accepted or unknown effects, durable wait budgets, and available recovery actions.']
    - ['`POST`', '`/v1/runs/{run}/cancel`', 'Bearer, `cancel`', 'Stop future dispatch where possible, without rolling back an accepted effect.']
    - ['`POST`', '`/v1/runs/{run}/reconcile`', 'Bearer, `reconcile`', 'Settle an uncertain call from the receiving product''s original-key receipt.']
    - ['`POST`', '`/v1/runs/{run}/retry-same`', 'Bearer, `retry-same`', 'Schedule held work again with its original command, key, binding, and authority.']
    - ['`GET`', '`/v1/doctor`', 'Bearer, operator', 'Report activation, audit readiness, holds, and run counts.']
    - ['`POST`', '`/v1/restore-hold`', 'Bearer, operator', 'Place the restore hold, which stops dispatch and admissions.']
    - ['`POST`', '`/v1/release-restore-hold`', 'Bearer, operator', 'Release the restore hold once no held work is unresolved.']
    - ['`POST`', '`/v1/release-admission-hold`', 'Bearer, operator', 'Reopen admissions after a restore, with audited attestations.']
    - ['`POST`', '`/v1/complete-execution-recovery`', 'Bearer, operator', 'Attest complete execution history and prior fencing while the restore hold remains.']
    - ['`POST`', '`/v1/retention`', 'Bearer, operator', 'Erase eligible terminal payloads that ended before a cutoff.']
    - ['`POST`', '`/v1/review-completions`', 'A Casework connection''s completion token and recipient binding', 'Bring forward the next result read of a run waiting on that review request.']
    - ['`POST`', '`/v1/review-requests`', 'Bearer, `review-create` and Review producer profile', 'Accept a frozen subject for the selected policy and persist the exact accepted policy. Exact retries retain the original acceptance.']
    - ['`GET`', '`/v1/review-requests/{request}`', 'Bearer, `review-read` and Review producer profile', 'Read the current state of an owned Review request.']
    - ['`GET`', '`/v1/review-requests/{request}/result`', 'Bearer, `review-read` and Review producer profile', 'Read the immutable result within its availability window; pending, concealed, and expired replies have no body.']
    - ['`POST`', '`/v1/review-requests/{request}/cancel`', 'Bearer, `review-cancel` and Review producer profile', 'Request cancellation with an idempotency key under the original request deadline.']
    - ['`GET`', '`/v1/review-results`', 'Bearer, `review-read` and Review producer profile', 'Read a bounded page of currently authorized Review results.']
    - ['`POST`', '`/v1/events/{workflow}/{trigger}`', 'Configured event source signature', 'Admit one run per exact authenticated event and trigger; exact redelivery returns the same run.']
