- id: registry-evidence
  name: Registry Evidence API
  owner: registry-evidence
  source: Pulled by `scripts/fetch-openapi.mjs` from `products/evidence/generated/registry-evidence.openapi.json` in the checked-out source for the development docset, or at the release ref selected by an archived docset. The document is generated by `cargo run -p registry-evidence --example evidence-contracts` and byte-drift-checked in root CI by the `evidence-contracts` job.
  artifact: openapi/registry-evidence.openapi.json
  status: current checked-out source on the development site; release-ref source in archived docsets. A running Registry Evidence service publishes the same generated document at `GET /openapi.json` with no authentication required.
  reference_path: /reference/apis/evidence/
- id: registry-evidence-oid4vci
  name: Evidence OID4VCI delivery API
  owner: registry-evidence
  source: Pulled by `scripts/fetch-openapi.mjs` from `products/evidence/generated/registry-evidence-oid4vci.openapi.json` at the same ref as the Registry Evidence document. The document is generated by `evidence-oid4vci openapi` and byte-drift-checked in root CI.
  artifact: openapi/registry-evidence-oid4vci.openapi.json
  status: current checked-out source on the development site; release-ref source in archived docsets from v0.20.0. The wallet-facing supporting service publishes it beside Registry Evidence, which signs every credential it delivers.
  reference_path: /reference/apis/evidence-oid4vci/
