- id: registry-platform
  name: Registry Platform
  repo_path: ../registry-platform
  target_repo_path: ../registry-platform
  role: Shared Rust workspace for security and operational primitives consumed by Registry Relay, Evidence Gateway, and related registry services, including auth helpers, OIDC verification, JWKS fetching, audit envelopes, HTTP security, outbound HTTP policy, crypto, SD-JWT VC support, and test fixtures.
  owns:
    - Shared auth, OIDC, JWKS fetching, audit, HTTP security, outbound HTTP, crypto, SD-JWT, and testing primitives.
    - Cross-service crate APIs that must behave consistently in Relay, Evidence Gateway, and other registry services.
    - Shared Rust hygiene templates and supported integration-test fixtures.
  does_not_own:
    - Registry Relay runtime data access, entity routing, metadata publication, or scope policy semantics.
    - Evidence Gateway requirement definitions, authorization grants, disclosure decisions, service routes, assertion construction, or signing policy.
    - Product-level authorization policy, tenant isolation, audit retention, secret provisioning, or deployment configuration.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/platform/README.md
    - label: Registry Platform crates
      url: https://github.com/registrystack/registry-stack/tree/v0.16.3/crates
  rename_status: New shared workspace; not part of the 2026-05-23 rename wave.
- id: registry-manifest
  name: Registry Manifest
  repo_path: ../registry-manifest
  target_repo_path: ../registry-manifest
  role: Renders standards-shaped catalog, service, schema, form, policy, evidence-offering, OGC Records, and embedded SKOS-shaped codelist metadata from a single YAML metadata manifest, so a registry's published surface stays consistent across formats.
  owns:
    - Metadata manifest model and compiled metadata model.
    - Pure renderers for catalog, DCAT, CPSV-AP service catalogues, CCCEV requirements and evidence type lists, BRegDCAT-AP, SHACL, JSON Schema, form JSON Schema, OGC Records, policies, evidence offerings, and embedded SKOS-shaped codelist nodes.
    - CLI validation, rendering, static publication, and profile fixture validation.
  does_not_own:
    - Registry Relay runtime data access.
    - Auth, audit, observability, DataFusion, Postgres, Axum, or secret handling.
    - Production source configuration.
    - Evidence Gateway deployment configuration. An Evidence Gateway process loads one immutable governed bundle and one closed runtime file mounted read-only at startup, and reads no portable manifest.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/manifest/README.md
    - label: Local examples
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/manifest/examples/README.md
  rename_status: Already using the target repo name locally.
- id: registry-relay
  name: Registry Relay
  repo_path: ../registry-relay
  target_repo_path: ../registry-relay
  role: Read-only HTTP gateway that fronts a sensitive registry database. Exposes entity-shaped query routes, caller-scoped metadata, evidence-offering discovery, and optional OGC API adapters while composing shared auth, OIDC, audit, HTTP security, and crypto primitives from Registry Platform.
  owns:
    - Runtime configuration and source binding.
    - Entity-shaped Registry Data API routes.
    - Relay-specific API key and OIDC resource-server configuration, scope checks, and route enforcement.
    - Caller-scoped metadata publication.
    - Relay-native evidence offering discovery and publication.
  does_not_own:
    - Source-registry provisioning, write-back, or domain-data mutation paths in v1.
    - Portable metadata schema ownership.
    - Assertion evaluation, disclosure policy, and signing owned by Evidence Gateway.
    - Shared security and operational primitives owned by Registry Platform.
    - Storage table ids or arbitrary SQL in public APIs.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/crates/registry-relay/README.md
    - label: Local API docs
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/crates/registry-relay/docs/api.md
    - label: Local metadata docs
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/crates/registry-relay/docs/metadata.md
  rename_status: Local checkout renamed to `registry-relay`; old worktrees under `registry_relay-*` remain for historical evidence.
- id: registry-evidence
  name: Evidence Gateway
  repo_path: ../registry-stack
  target_repo_path: ../registry-stack
  role: Minimum-disclosure assertion service. Given authenticated authority, an authorized purpose, a predefined requirement, and the selector data an authoritative provider needs, it answers one bounded question about one subject and returns the smallest sufficient signed assertion, composing shared audit, crypto, HTTP security, OIDC, and SD-JWT primitives from Registry Platform.
  owns:
    - Requirement definitions, bounded evaluation, and the acquisition posture recorded with every answer.
    - Authorization grants, purpose and audience checks, and the disclosure decision that releases an assertion.
    - Fixed bounded HTTP JSON source execution, and bounded script-owned request preparation, extraction, and derivation.
    - Assertion construction, signing, response format selection, and redacted audit events.
    - The `evidence` binary, one serving process, and one operator-controlled trust domain.
  does_not_own:
    - General source access, protocol adaptation, or Registry Relay runtime internals.
    - Record lookup or identity resolution beyond a provider outcome of match, no match, or ambiguous.
    - Portable metadata renderers owned by Registry Manifest.
    - Shared security and operational primitives owned by Registry Platform.
    - Token issuance, end-user authentication, or identity proofing.
    - A credential lifecycle. No issuance workflow, holder binding, status list, revocation, delegated evaluation, or federation. SD-JWT VC adds a response format under a frozen profile, never a lifecycle.
    - How a consumer acts on a returned assertion.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/HEAD/products/evidence/README.md
    - label: Operator contract
      url: https://github.com/registrystack/registry-stack/blob/HEAD/products/evidence/OPERATOR-CONTRACT.md
  rename_status: Developed in the Registry Stack monorepo as one `registry-evidence` crate beside the portable `registry-evidence-verifier` verification library; no separate repository.
- id: registry-mint
  name: Registry Mint
  repo_path: ../registry-stack
  target_repo_path: ../registry-stack
  role: Supporting service rather than a product line. Issues short-lived, audience-bound access tokens to registered machine clients, so a resource server such as Evidence Gateway can require signed expiring tokens without the deployment first standing up a general purpose identity provider.
  owns:
    - The client registry that binds a client id to that client's own public keys and to the authority Mint asserts for it.
    - The `client_credentials` grant with `private_key_jwt` client authentication, verifying an assertion against the keys of the client it claims to be, selected before signature verification.
    - Token signing, lifetime, and audience binding, and the `mint` binary.
  does_not_own:
    - End-user authentication, identity proofing, or consent.
    - Caller-declared authority. Authority is written from the client registry, never from the assertion payload.
    - Evidence Gateway requirement definitions, authorization grants, or disclosure decisions.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/HEAD/crates/registry-mint/README.md
  rename_status: Developed in the Registry Stack monorepo as one `registry-mint` crate; no separate repository.
- id: solmara-lab
  name: Solmara Lab
  repo_path: ../solmara-lab
  target_repo_path: ../solmara-lab
  role: Standalone Registry Stack adopter demo for the fictional Republic of Solmara. Runs a whole country's worth of registry services over generated synthetic data, with purpose-limited Relay APIs per authority, a citizen portal, and a public Visitor's Center.
  owns:
    - End-to-end local and hosted demo topologies for Relay, workload identity agents, Postgres, static metadata, scenario services, the citizen portal, and the Visitor's Center.
    - Deterministic synthetic data, authority-owned demo configuration, purpose catalogues, and fictional country stories.
    - Demo orchestration, smoke checks, browser journeys, hosted deployment wrappers, and release-pin checks.
  does_not_own:
    - Production deployment guidance.
    - Normative API or metadata contracts.
    - Evidence Gateway deployment or integration.
    - Real product integrations for OpenCRVS, OpenSPP, DHIS2, OpenIMIS, MOSIP, or other systems.
  source_docs:
    - label: README
      url: https://github.com/registrystack/solmara-lab/blob/00cd51a2be4a405ef75d337ddcede0f9de134b1f/README.md
  rename_status: Standalone replacement for the historical Registry Lab; not part of the Registry Stack monorepo.
