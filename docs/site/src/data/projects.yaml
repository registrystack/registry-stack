- id: registry-platform
  name: Registry Platform
  repo_path: ../registry-platform
  target_repo_path: ../registry-platform
  role: Shared Rust workspace for security and operational primitives consumed by Evidence Gateway and related registry services, including auth helpers, OIDC verification, JWKS fetching, audit envelopes, HTTP security, outbound HTTP policy, the bounded read-only SQLite boundary, crypto, SD-JWT VC support, and test fixtures.
  owns:
    - Shared auth, OIDC, JWKS fetching, audit, HTTP security, outbound HTTP, crypto, SD-JWT, and testing primitives.
    - The bounded read-only SQLite access boundary Evidence Gateway opens its sources through.
    - Cross-service crate APIs that must behave consistently in Evidence Gateway and other registry services.
    - Shared Rust hygiene templates and supported integration-test fixtures.
  does_not_own:
    - Evidence Gateway requirement definitions, authorization grants, disclosure decisions, service routes, assertion construction, or signing policy.
    - Product-level authorization policy, tenant isolation, audit retention, secret provisioning, or deployment configuration.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/platform/README.md
    - label: Registry Platform crates
      url: https://github.com/registrystack/registry-stack/tree/v0.16.3/crates
  rename_status: New shared workspace; not part of the 2026-05-23 rename wave.
- id: registry-manifest
  name: Registry Manifest
  repo_path: ../registry-manifest
  target_repo_path: ../registry-manifest
  role: Renders standards-shaped catalog, service, schema, form, policy, evidence-offering, OGC Records, and embedded SKOS-shaped codelist metadata from a single YAML metadata manifest, so a registry's published surface stays consistent across formats.
  owns:
    - Metadata manifest model and compiled metadata model.
    - Pure renderers for catalog, DCAT, CPSV-AP service catalogues, CCCEV requirements and evidence type lists, BRegDCAT-AP, SHACL, JSON Schema, form JSON Schema, OGC Records, policies, evidence offerings, and embedded SKOS-shaped codelist nodes.
    - CLI validation, rendering, static publication, and profile fixture validation.
  does_not_own:
    - Runtime data access.
    - Auth, audit, observability, DataFusion, Postgres, Axum, or secret handling.
    - Production source configuration.
    - Evidence Gateway deployment configuration. An Evidence Gateway process loads one immutable governed bundle and one closed runtime file mounted read-only at startup, and reads no portable manifest.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/manifest/README.md
    - label: Local examples
      url: https://github.com/registrystack/registry-stack/blob/v0.16.3/products/manifest/examples/README.md
  rename_status: Already using the target repo name locally.
- id: registry-evidence
  name: Evidence Gateway
  repo_path: ../registry-stack
  target_repo_path: ../registry-stack
  role: Minimum-disclosure assertion service. Given authenticated authority, an authorized purpose, a predefined requirement, and the selector data an authoritative provider needs, each evaluation answers one bounded question about one complete subject-role set and returns the smallest sufficient signed assertion. Its request-batch route groups up to sixteen independent audience-scoped evaluations under one common requirement and purpose. Evidence Gateway composes shared audit, crypto, HTTP security, OIDC, and SD-JWT primitives from Registry Platform.
  owns:
    - Requirement definitions, bounded evaluation, and the acquisition posture recorded with every answer.
    - Authorization grants, purpose and audience checks, and the disclosure decision that releases an assertion.
    - Fixed bounded HTTP JSON source execution, sequential request-batch fanout, and an optional fixed-path source-batch optimization with bounded script-owned preparation and extraction.
    - Assertion construction, signing, response format selection, and redacted audit events.
    - The `evidence` binary, one serving process, and one operator-controlled trust domain.
  does_not_own:
    - General source access or protocol adaptation.
    - Record lookup or identity resolution beyond a provider outcome of match, no match, or ambiguous.
    - Portable metadata renderers owned by Registry Manifest.
    - Shared security and operational primitives owned by Registry Platform.
    - Token issuance, end-user authentication, or identity proofing.
    - A credential lifecycle or delivery protocol. Evidence Gateway supports the declared holder-bound subject-binding mode and its bounded issuance envelope, but no OID4VCI, interactive holder-binding ceremony, issuance session, status list, revocation, delegated evaluation, or federation. SD-JWT VC remains a response format under a frozen profile, never a lifecycle.
    - How a consumer acts on a returned assertion.
  source_docs:
    - label: README
      url: https://github.com/registrystack/registry-stack/blob/HEAD/products/evidence/README.md
    - label: Operator contract
      url: https://github.com/registrystack/registry-stack/blob/HEAD/products/evidence/OPERATOR-CONTRACT.md
  rename_status: Developed in the Registry Stack monorepo as one `registry-evidence` crate beside the portable `registry-evidence-verifier` verification library; no separate repository.
