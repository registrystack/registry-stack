- id: registry-platform.crate-apis
  name: Registry Platform Crate APIs
  owner: registry-platform
  status: current-source
  surface: Shared Rust crate APIs for auth helpers, OIDC verification, audit envelopes and sinks, HTTP security middleware, outbound HTTP policy, Ed25519 JWK and DID helpers, SD-JWT VC issuance, and testing fixtures.
  source_of_truth:
    label: Registry Platform crates
    url: https://github.com/registrystack/registry-stack/tree/d45761a0104bd3d9c2e4b4db391d4223f289bd44/crates
  consumer_note: Relay, Evidence Gateway, Registry Mint, and future registry services should consume these primitives instead of reimplementing security or operational behavior locally.
- id: registry-platform.ops-posture-v1
  name: Registry Ops Posture v1
  owner: registry-platform
  status: current-source
  surface: Versioned JSON Schema for protected Registry Relay operations posture observations, including the shared envelope, component sections, default and restricted sensitivity tiers, deployment findings, audit state, and standards-artifact references. The frozen v1 shape still models the retired Registry Notary component so that a consumer can validate a document it already holds.
  source_of_truth:
    label: Registry Ops Posture v1 JSON Schema
    url: https://github.com/registrystack/registry-stack/blob/c84b1b9288b925e7c9cc89c47c33cc1f50753d8c/crates/registry-platform-ops/schemas/registry.ops.posture.v1.schema.json
  consumer_note: >-
    Validate every document against `registry.ops.posture.v1` before use. The
    schema is closed: every post-1.0 shape change, including an additive field,
    requires a new schema identifier. Use the default tier for the emit-only
    allowlisted projection; restricted output remains protected operational data.
- id: registry-relay.registry-contract
  name: Relay Registry Contract Grammar
  owner: registry-relay
  status: current-source
  surface: "Closed YAML grammar `relay.registrystack.org/v2alpha1` for the two documents an adopter authors: `registry.yaml` (`kind: RegistryContract`), declaring registry identity, resources, operations, access profiles, and disclosure; and `runtime.yaml` (`kind: RelayRuntime`), binding one deployment's package, SQLite source, authentication, audit, secrets, and listener."
  source_of_truth:
    label: Relay V2 contract and runtime types
    url: https://github.com/registrystack/registry-stack/blob/v0.19.0/crates/registry-relay-v2/src/contract.rs
  consumer_note: >-
    Both documents are closed shapes: an unrecognized key is a parse failure,
    not an ignored field, so a document that compiles today cannot silently
    change meaning under a later runtime. The grammar is pre-1.0 and can change
    with a documented migration in a release note. A deployment's HTTP surface
    is compiled from its own `registry.yaml`, so no product-level OpenAPI
    document describes Relay; fetch `GET /openapi.json` from the deployment.
- id: registry-relay.package
  name: Relay Sealed Package Format
  owner: registry-relay
  status: current-source
  surface: "Versioned sealed directory `relay.registrystack.org/package/v1alpha3`: the `relay-package.json` manifest with its governed-file digests, media types, and artifact visibility, alongside the compiled registry, the governed inputs, and the generated artifacts a Relay process verifies before it activates."
  source_of_truth:
    label: Relay V2 package manifest
    url: https://github.com/registrystack/registry-stack/blob/v0.19.0/crates/registry-relay-v2/src/package.rs
  consumer_note: >-
    `relayctl package` produces the directory and Relay verifies it before it
    opens the database, audit file, token issuer, or listener. Its
    `packageRevision` is an integrity digest over canonical JSON, not an
    authenticity proof: packages are unsigned, so the operator's own transport
    and storage are what bind a package to its author.

- id: registry-manifest.metadata-yaml
  name: Metadata Manifest
  owner: registry-manifest
  status: current-source
  surface: Portable `metadata.yaml` documents, compiled metadata model, public services, forms, policies, requirements, evidence type lists, evidence offering metadata, public federation metadata, and evaluation profile metadata.
  source_of_truth:
    label: Registry Manifest core
    url: https://github.com/registrystack/registry-stack/tree/d45761a0104bd3d9c2e4b4db391d4223f289bd44/crates/registry-manifest-core
  consumer_note: Runtime source paths, scopes, table names, backend URLs, peer allowlists, replay storage, and federation secrets belong in runtime service config, not manifests.
- id: registry-manifest.cpsv-ap-service-catalogue
  name: CPSV-AP Service Catalogue Render Contract
  owner: registry-manifest
  status: current-source
  surface: CPSV-AP JSON-LD service catalogue, CCCEV requirements, grouped evidence type lists, local form-definition links, DCAT data services, and form JSON Schemas.
  source_of_truth:
    label: Registry Manifest CPSV-AP fixture
    url: https://github.com/registrystack/registry-stack/tree/d45761a0104bd3d9c2e4b4db391d4223f289bd44/products/manifest/fixtures/cpsv-ap
  consumer_note: Each CCCEV evidence type list is one grouped option; multiple lists on a requirement are alternatives.
- id: registry-manifest.static-publication
  name: Static Metadata Publication Bundle
  owner: registry-manifest
  status: current-source
  surface: Static index, catalog JSON, evidence offerings, policies, DCAT, CPSV-AP, BRegDCAT-AP, SHACL, OGC Records item collection, entity JSON Schemas, form JSON Schemas, and embedded SKOS-shaped codelist nodes.
  source_of_truth:
    label: Registry Manifest CLI
    url: https://github.com/registrystack/registry-stack/tree/d45761a0104bd3d9c2e4b4db391d4223f289bd44/crates/registry-manifest-cli
  consumer_note: The bundle can be hosted as static files without running Registry Relay.
