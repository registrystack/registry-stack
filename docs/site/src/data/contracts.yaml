- id: registry-relay.registry-contract
  name: Relay Registry Contract Grammar
  owner: registry-relay
  status: current-source
  surface: "Closed YAML grammars for the two documents an adopter authors: `registry.yaml` (`apiVersion: relay.registrystack.org/v2alpha1`, `kind: RegistryContract`), declaring registry identity, resources, operations, access profiles, disclosure, and the closed public discovery publication; and `runtime.yaml` (`apiVersion: registry.registrystack.org/relay-runtime/v1alpha1`, `kind: RelayRuntimeConfig`), binding one deployment's package, SQLite source, authentication, audit, secret providers, and listener."
  source_of_truth:
    label: Registry Stack contract reference
    url: /reference/contracts/
  consumer_note: >-
    Both documents are closed shapes: an unrecognized key is a parse failure,
    not an ignored field. Compatibility for recognized keys follows the release
    policy. The grammar is pre-1.0 and can change with a documented migration in
    a release note. A deployment's HTTP surface is compiled from its own
    `registry.yaml`, so no product-level OpenAPI document describes Relay; fetch
    `GET /openapi.json` from the deployment.
- id: registry-relay.package
  name: Relay Sealed Package Format
  owner: registry-relay
  status: current-source
  surface: "Sealed directory in the shared Registry Stack package format: a `SHA256SUMS` file listing the digest of every other file, alongside the authored registry, the governed inputs, the compiled registry, and the generated artifacts a Relay process verifies and re-derives before it activates."
  source_of_truth:
    label: Relay adopter tooling specification
    url: /spec/rs-pr-relayctl/
  consumer_note: >-
    `relayctl package` produces the directory and Relay verifies it before it
    opens the database, audit file, token issuer, or listener. Its package
    digest, the `sha256:` digest of `SHA256SUMS`, is an integrity digest, not
    an authenticity proof: packages are unsigned, so the operator's own
    transport and storage are what bind a package to its author.

- id: registry-manifest.metadata-yaml
  name: Metadata Manifest
  owner: registry-manifest
  status: current-source
  surface: Portable `metadata.yaml` documents, compiled metadata model, public services, forms, policies, requirements, evidence type lists, evidence offering metadata, and evaluation profile metadata.
  source_of_truth:
    label: Registry Manifest data model specification
    url: /spec/rs-dm-manifest/
  consumer_note: Runtime source paths, scopes, table or view names, endpoint locations, credentials, and other deployment bindings belong in consuming service configuration, not manifests.
- id: registry-manifest.cpsv-ap-service-catalogue
  name: CPSV-AP Service Catalogue Render Contract
  owner: registry-manifest
  status: current-source
  surface: CPSV-AP JSON-LD service catalogue, CCCEV requirements, grouped evidence type lists, local form-definition links, DCAT data services, and form JSON Schemas.
  source_of_truth:
    label: Registry Manifest CPSV-AP fixture
    url: https://github.com/registrystack/registry-stack/tree/v0.23.0/products/manifest/fixtures/cpsv-ap
  consumer_note: Each CCCEV evidence type list is one grouped option; multiple lists on a requirement are alternatives.
- id: registry-manifest.static-publication
  name: Static Discovery Bundle
  owner: registry-manifest
  status: current-source
  surface: Static index, catalog JSON, evidence offerings, policies, DCAT, CPSV-AP, BRegDCAT-AP, SHACL, OGC Records item collection, entity JSON Schemas, form JSON Schemas, and embedded SKOS-shaped codelist nodes.
  source_of_truth:
    label: Registry Manifest data model specification
