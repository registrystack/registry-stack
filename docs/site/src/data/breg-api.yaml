- id: routes
  title: Base Registry Engine HTTP routes
  columns: [Route, Operation, Available when, Response]
  rows:
    - ['`GET /v1/registry`', 'metadata', 'The caller reaches at least one route', 'Caller-filtered Record types, operations, Action descriptors, and native Proposal capabilities. A caller with no visible route gets the concealed 404.']
    - ['`GET /v1/schemas/{record_type_id}`', 'metadata', 'The caller reaches the Record type', 'JSON Schema for one record of the Record type named by its ID, the target of the `describedby` link.']
    - ['`GET /openapi.json`', 'metadata', 'The caller reaches at least one route', 'The compiled OpenAPI document, filtered to the caller''s routes.']
    - ['`GET /health` and `GET /healthz`', 'liveness', 'Always', '`{"status":"alive"}`.']
    - ['`GET /ready`', 'readiness', 'Always', '`{"status":"ready"}`, or 503 `runtime.not_ready` until the package and database are usable.']
    - ['`POST /v1/records/{route}`', '`create`', 'Configured Record type with this granted operation', '201 with the record envelope, `Location`, and `ETag`.']
    - ['`GET /v1/records/{route}`', '`list`', 'Configured Record type with this granted operation', 'Collection.']
    - ['`GET /v1/records/{route}/{record_id}`', '`get`', 'Configured Record type with this granted operation', 'Record envelope with `ETag`.']
    - ['`GET /v1/records/{route}/{record_id}/access-log`', '`get`', 'Record type declares `accessLog`; the authenticated caller reaches the record through `get` and is its current subject', 'A bounded page of the record''s retained subject-facing access events. `limit` defaults to 50 and is at most 100; `cursor` continues from an event ID.']
    - ['`PATCH /v1/records/{route}/{record_id}`', '`patch`', '`mutationMode: mutable`', 'Record envelope. Requires `If-Match`.']
    - ['`DELETE /v1/records/{route}/{record_id}`', '`tombstone`', '`tombstone: true`', 'Envelope of the final revision. Requires `If-Match`.']
    - ['`POST /v1/records/{route}:lookup`', '`lookup`', 'Record type declares `selectorProfiles`', 'Record envelope, or 404 `lookup.unresolved`.']
    - ['`POST /v1/records/{route}:batch`', '`batch`', 'Record type declares `batch`', '`{"snapshot", "results": [...]}`.']
    - ['`POST /v1/records/{route}/ingestion-runs`', '`batch`', 'Record type declares `batch`', '201 `{"run"}`: the run document with the binding, the announced counts and bounds, and `nextChunkIndex`.']
    - ['`GET /v1/records/{route}/ingestion-runs`', '`batch`', 'Record type declares `batch`', '`{"runs", "hasMore", "nextCursor"}` over the runs the caller created. Accepts `accessProfile`, `limit` (1 to 100, default 25), the keyset `cursor` from `nextCursor`, `status`, and `inputDigest`. `after` answers 400 `query.invalid`; any other key answers the concealed 404.']
    - ['`GET /v1/records/{route}/ingestion-runs/{run_id}`', '`batch`', 'Record type declares `batch`', '`{"run"}`. Another caller''s run and an unknown run are the same 404.']
    - ['`POST /v1/records/{route}/ingestion-runs/{run_id}/chunks`', '`batch`', 'Record type declares `batch`', '`{"run", "receipt"}` after a commit or an exact replay. Takes no `Idempotency-Key`.']
    - ['`POST /v1/records/{route}/ingestion-runs/{run_id}/cancel`', '`batch`', 'Record type declares `batch`', '`{"run"}` after cancelling an open or blocked run. Empty body, no `Content-Type`, no `Idempotency-Key`.']
    - ['`GET /v1/records/{route}/ingestion-runs/{run_id}/chunks/{chunk_index}/receipt`', '`batch`', 'Record type declares `batch`', 'The chunk receipt, or 410 `ingestion.receipt_erased` once the record history it describes is erased.']
    - ['`GET /v1/records/{route}/{record_id}/revisions`', '`revisions`', 'Configured Record type with this granted operation', 'Collection of the record''s revisions, at most 100 per read.']
    - ['`GET /v1/records/{route}/{record_id}/revisions/{revision}`', '`revisions`', 'Configured Record type with this granted operation', 'Record envelope for one revision.']
    - ['`GET /v1/records/{route}:snapshot`', '`snapshot`', 'Configured Record type with this granted operation', 'Collection as recorded at a saved snapshot.']
    - ['`GET /v1/records/{route}:current`', '`list`', 'Record type declares `temporal`', 'Collection of the records valid now.']
    - ['`GET /v1/records/{route}:as-of`', '`list`', 'Record type declares `temporal`', 'Collection of the records valid at `asOf`.']
    - ['`GET /v1/records/{route}/{record_id}/{read_path}`', '`list` through `readPaths[]`', 'Record type declares `readPaths`', 'Collection of related records.']
    - ['`POST /v1/actions/{action}/target-conditions`', '`invoke`', 'Immediate Action advertises required target conditions', '`{"preconditions": {...}}` for the targets the input names.']
    - ['`POST /v1/actions/{action}/availability`', '`invoke`', 'Immediate Action has at least one reference input', 'Advisory availability for one referenced target: `true` or `false` with its observed revision, or `null` when more input is required or the current profile cannot inspect the guard safely.']
    - ['`POST /v1/actions/{action}`', '`invoke`', 'Action mode is immediate and the caller holds Invoke', '`{"action", "applicationId", "results"}`. Requires `Idempotency-Key`.']
    - ['`POST /v1/review-completions`', 'review completion receiver', 'A review authority configures a completion token and recipient binding', '204 after durable acceptance or an exact replay. Requires bearer authentication, `Registry-Recipient-Binding`, and an `Idempotency-Key` equal to the completion event ID.']
    - ['`GET /v1/gis`', 'GIS adapter', '`listener.publicOrigin` is configured; the response includes only GIS collections visible to the caller', 'Landing document with links to the service description, conformance document, and collection inventory.']
    - ['`GET /v1/gis/api`', 'GIS adapter', '`listener.publicOrigin` is configured; the response includes only GIS collections visible to the caller', 'Caller-filtered OpenAPI 3.0 description for the visible collection item routes.']
    - ['`GET /v1/gis/conformance`', 'GIS adapter', '`listener.publicOrigin` is configured', 'An empty `conformsTo` array; the bounded adapter makes no OGC conformance claim.']
    - ['`GET /v1/gis/collections`', 'GIS adapter', '`listener.publicOrigin` is configured; the response includes only GIS collections visible to the caller', 'Collection inventory for direct `list` profiles with readable primary geometry and an explicit `bbox` grant.']
    - ['`GET /v1/gis/collections/{collection}`', 'GIS adapter', '`listener.publicOrigin` is configured and the caller reaches the governed GIS collection', 'Collection detail with the Record type, access profile, primary geometry, page bound, fields, and item link.']
    - ['`GET /v1/gis/collections/{collection}/items`', '`list` through the GIS adapter', '`listener.publicOrigin` is configured and the caller reaches the governed GIS collection', 'Authorized GeoJSON FeatureCollection page. Accepts `bbox`, `limit`, `cursor`, and `f=json`.']
    - ['`POST /v1/actions/{action}/proposals`', '`start`', 'Action mode is proposal and the caller holds Start with target authority', 'Durable Proposal with its current revision and promoted links. Requires `Idempotency-Key`.']
    - ['`GET /v1/proposals`', '`list`', 'Caller holds explicit Proposal List authority', '`{"items", "nextCursor"}` page of the Proposals the caller may see. Accepts only `accessProfile`, `action`, `owner=caller`, `state`, `turn`, `pendingManualApplication` (`true` or `false`), `target` (a record UUID), `cursor`, and `limit` (1 to 100, default 50), each at most once. `pendingManualApplication=true` selects locally pending manual applications before pagination, without a remote Review read. `top` answers 400 `query.invalid`; any other key, a repeated key, or a bad value answers the concealed 404. `action` and `state` narrow the candidates before the scan budget is spent. A page may hold fewer than `limit` items.']
    - ['`GET /v1/proposals/{proposal_id}`', '`get`', 'Caller holds Proposal Get and current ownership/target scope', 'Proposal with its frozen binding, application status, authorized links, and `ETag`.']
    - ['`GET /v1/proposals/{proposal_id}/submissions/{submission_version}`', '`get`', 'Caller holds Proposal Get and current ownership/target scope', 'One exact submission: its frozen `effectDigest`, its `review` result, its `decision` when one was made, and its `application` outcome as separate members, or 410 `proposal.submission_expired` once its result window has lapsed and no application receipt remains.']
    - ['`POST /v1/proposals/{proposal_id}/{transition}`', 'Promoted transition', 'Proposal promotes the exact authorized transition', 'Updated Proposal with a new `ETag`. Requires `Content-Type: application/json`, `Idempotency-Key`, and `If-Match` carrying the Proposal `ETag`.']
    - ['`GET /v1/proposals/{proposal_id}/review-status`', '`get-review-status`', 'Caller holds a matching Proposal review-status grant', 'Closed review-status document; service grants are authority-scoped and value-free.']
    - ['`GET /v1/proposals/{proposal_id}/review-context`', '`get-review-context`', 'Caller holds Proposal context and current record disclosure', 'Only permitted review context fields.']
    - ['`GET /v1/proposals/review-context`', '`get-review-context`', 'Each item requires current Proposal context and Record disclosure authority under the selected profile', 'Pass 1 to 100 distinct canonical Proposal UUIDs in comma-separated `ids` and select `accessProfile`. Ordered `items` contain each ID with `status: visible` and its `context`, or `status: concealed` without a document. Operational failures refuse the whole batch; the response is bounded at 8 MiB.']
    - ['`POST /v1/proposals/{proposal_id}/task-grant-context`', '`get-task-grant-context`', 'Service profile holds a matching Proposal task-grant context grant and current record disclosure for the requested fields', 'Review document wrapped with the exact request binding; `context.fields` holds only the requested keys. Select `accessProfile`; task identifiers and fields stay in the JSON body. Any mismatch with the frozen identity, contract, accepted review binding, or current source acceptance is concealed.']
    - ['`GET /v1/proposals/{proposal_id}/attachments/{slot_id}`', 'Attachment download', 'Proposal declares the slot and promotes its caller-authorized download', 'Retained bytes under current Proposal disclosure and retention.']
    - ['`PATCH /v1/proposals/{proposal_id}/attachments/{slot_id}`', 'Attachment upload', 'Draft Proposal declares the slot and promotes its caller-authorized upload', 'Updated Proposal after bounded upload. Requires `Idempotency-Key` and `If-Match` carrying the Proposal `ETag`.']
    - ['`DELETE /v1/proposals/{proposal_id}/attachments/{slot_id}`', 'Attachment removal', 'Draft Proposal declares the slot and promotes its caller-authorized removal', 'Updated Proposal after removal. Requires `Idempotency-Key` and `If-Match` carrying the Proposal `ETag`.']
- id: query-options
  title: Read query options
  columns: [Option, Routes, Meaning, Bound]
  rows:
    - ['`accessProfile`', 'Every record route', 'Evaluate the request under a profile other than the route default. The caller must satisfy that profile.', 'One profile identifier.']
    - ['`$select`', 'Collection reads', 'Comma-separated domain fields to return. Envelope members are never selectable.', '128 fields.']
    - ['`$filter`', 'Collection reads', 'Predicate over `filterableFields`: `eq`, `ne`, `lt`, `le`, `gt`, `ge`, `in`, `startswith()`, `contains()`, combined with `and`, `or`, `not`.', '32 predicates, depth 16, 128 nodes, 100 `in` values, 1024-byte literals.']
    - ['`$orderby`', 'Collection reads', 'One field from `sortableFields`, ascending. A `desc` direction is refused with `query.invalid`.', 'One field.']
    - ['`$top`', 'Collection reads', 'Page size.', '100.']
    - ['`$count`', 'Collection reads', 'Adds the matching count. Refused unless the grant sets `allowCount`.', 'Grant flag.']
    - ['`$skiptoken`', 'Collection reads', 'Continuation from `pageInfo.nextCursor`. It carries the original query, so repeating `snapshot` or `validAt` beside it is refused.', 'Expires after `cursor.maximumAgeSeconds`.']
    - ['`bbox`', '`list` on Record types with a `crs84-point` field', '`west,south,east,north` in CRS84 degrees, permitted by `spatialQueries.bbox` on the grant.', '256 bytes, plus the span limits on the grant.']
    - ['`asOf`', '`:as-of`', 'The valid-time instant to evaluate, in the type of the Record type''s valid-time fields.', 'One value.']
    - ['`snapshot`', '`:snapshot`', 'A `snapshot` value from a Batch response or an earlier `:snapshot` read.', '4096 bytes.']
    - ['`validAt`', '`:snapshot`', 'The valid-time instant to evaluate inside the snapshot, for temporal Record types.', 'One value.']
    - ['Whole query string', 'Every route', 'Decoded size of all options together.', '16 KiB.']
- id: problem-codes
  title: Problem codes
  columns: [Code, Status, When]
  rows:
    - ['`authentication.refused`', '401', 'A bearer token is missing or rejected: bad signature, wrong issuer or audience, expired, denied key, or a claim outside policy.']
    - ['`resource.not_found`', '404', 'A verified token that does not satisfy the profile, a route the profile cannot reach, or a record outside the caller''s row boundary. The server does not distinguish these cases.']
    - ['`lookup.unresolved`', '404', 'A lookup matched zero records or more than one.']
    - ['`request.invalid`', '400', 'The body, headers, or path did not match the compiled contract. `fieldPath` names the body member or header at fault when one is, and never a field name the grant does not admit. A lookup against a selector whose values come from a verified claim answers `fieldPath` `/values` when the body sends `values`.']
    - ['`query.invalid`', '400', 'A query option was malformed, over a bound, or not permitted by the grant. `fieldPath` names the query parameter, such as `$select`, when one is at fault.']
    - ['`query.cursor_invalid`', '400', 'A `$skiptoken` that is malformed, was issued for a different query, or has expired.']
    - ['`action.refused`', '422', 'An Action function intentionally refused the operation. `refusalCode` identifies a declared reason, `detail` contains its static label, and optional `fieldPath` names an input. No effects commit.']
    - ['`action.guard_failed`', '412', 'An immediate Action, or a Proposal Submit or Apply, failed a field guard and the selected profile can safely read every guard and row-boundary fact for the selected target. Optional `guardReason` carries its authored copy key. Hidden guard fields, failed authority, stale conditions, and Record revision mismatches remain `precondition.failed`. No effects commit.']
    - ['`action.handler_failed`', '500', 'An activated Action function failed to produce an accepted result. Operators use the trace identifier and safe server diagnostics to repair the package. A function deadline returns `503 service.unavailable` instead.']
    - ['`action.evidence_failed`', '503', 'An immediate-action handler declared an Evidence dependency that could not be acquired or accepted: the provider did not answer, or the assertion was refused, failed verification, or exceeded the retention bound. `fieldPath` names the declared Evidence alias when the failure is bound to one. No effects commit.']
    - ['`unsupported.media_type`', '415', 'A body without the required `Content-Type`.']
    - ['`precondition.required`', '428', 'A route that requires `If-Match` was called without it.']
    - ['`precondition.failed`', '412', '`If-Match` did not match the current revision, a Patch target was hidden or absent, or an ingestion item, immediate Action effect, or Proposal target or effect failed its boundary check. The response is value-free.']
    - ['`write.outside-boundary`', '403', 'A direct Create, direct Batch item, or Patch of a visible Record would put the resulting Record outside the selected access profile''s row boundary. The response has no field, value, claim, or location extension, and no item commits.']
    - ['`proposal.rejected`', '409', 'A Review rejected the Proposal, and a rejection is final: Submit, Edit, Revise, Rebase, Apply, Retry and Cancel are refused. Start a new Proposal to try again.']
    - ['`proposal.review_result_mismatch`', '412', 'The current Review result differs from the retained approval. Apply commits no effects. Reconcile the review result before attempting application again.']
    - ['`proposal.submission_expired`', '410', 'The submission''s review result window has lapsed or its detail was erased, and it has no application receipt. The Proposal itself stays readable.']
    - ['`mutation.conflict`', '409', 'A constraint or workflow rule refused the write. A storage-pattern failure includes the declared `recordType` and `fieldId`; correct the input before retrying. A 409 does not imply that retrying an unchanged request can succeed.']
    - ['`idempotency.key-reused`', '409', 'The caller reused the `Idempotency-Key` with a different request, another write included, or retried a key whose held response a retention erase removed. A byte-identical body also conflicts when the first attempt committed under a different package activation, access profile, or claims.']
    - ['`idempotency.expired`', '410', 'The caller''s exact retry arrived after the receipt horizon (`retention.receiptRetentionDays`, 7 days by default). The first attempt committed and the key stays spent, so the request is never executed again.']
    - ['`ingestion.profile_mismatch`', '403', 'The selected profile is not the one the run bound, or does not satisfy the compiled batch route for the bound operation. A run id grants nothing on its own.']
    - ['`ingestion.run_not_open`', '409', 'The run completed or was cancelled, so it accepts no chunk and no cancel. The run stays readable.']
    - ['`ingestion.run_blocked`', '409', 'The run is blocked: the active package revision or schema fingerprint no longer matches the run binding, or the import authority the run consumes closed, expired, or has too little volume left for the chunk. The run''s `blockedReason` names which. The run stays blocked and inspectable; continue in a successor run.']
    - ['`ingestion.chunk_mismatch`', '409', 'The chunk index, chunk digest, or rolling prefix digest does not match the run''s expected next chunk. Nothing was written; reread the run and resubmit the exact chunk.']
    - ['`ingestion.receipt_erased`', '410', 'The chunk receipt was erased with the record history it describes. The chunk and its counts stay visible in the run.']
    - ['`request.timeout`', '504', 'The request exceeded `operationalTimeouts.httpRequestMilliseconds`.']
    - ['`source.unavailable`', '503', 'The database refused or timed out while the request held it.']
    - ['`service.unavailable`', '503', 'The runtime could not complete the mutation for a reason other than the request itself.']
    - ['`runtime.not_ready`', '503', 'The readiness probe before the package and database are usable.']
    - ['`runtime.field_encryption.unavailable`', '503', 'The route reaches a Record type with encrypted fields while the field-encryption key state is not usable. Record types without encrypted fields keep serving.']
    - ['`statistical_dataset.domain_violation`', '500', 'A non-null source value falls outside a declared dimension domain; the value is not disclosed.']
    - ['`statistical_dataset.release_refused`', '422', 'The period or lifecycle state is ineligible; `refusalCode` names a closed reason.']
    - ['`statistical_dataset.version_conflict`', '409', 'The active package changed or a fresher computation superseded this publication.']
    - ['`statistical_dataset.version_withdrawn`', '410', 'The directly requested version was withdrawn; `reasonCode` names the recorded reason.']
- id: read-refusals
  title: Read refusals outside the caller's boundary
  columns: [Read, Answer]
  rows:
    - ['`get`, `lookup`, or `access-log` of a record outside the row, membership, or consent boundary', '404 `resource.not_found`, or 404 `lookup.unresolved` for a lookup, identical to an absent record.']
    - ['Collection, `:snapshot`, `$count`, or `$skiptoken` continuation over such records', '200 with those records left out and the count taken over the visible records only. A cursor replay re-evaluates the boundary.']
    - ['Revisions of such a record', '404 `resource.not_found`, identical to an absent record.']
    - ['`GET /v1/records/{route}/{record_id}/{read_path}` for a path the selected profile holds no read-path grant for', '404 `resource.not_found`, identical to an unknown path.']
    - ['A read path rooted at a record outside the boundary', '200 with no items, identical to an absent root record. No related record is disclosed.']
    - ['`$select`, `$filter`, or `$orderby` naming a field outside the read-path grant', '400 `query.invalid`; the field is not named.']
- id: proposal-transitions
  title: Promoted Proposal transitions
  columns: [Operation, Purpose, Authority]
  rows:
    - ['`edit`', 'Update the caller-owned draft inputs.', 'Explicit Edit and current draft/target scope.']
    - ['`submit`', 'Freeze the exact plan and queue required review or application.', 'Explicit Submit and current author-stage target authority.']
    - ['`revise`', 'Retire the frozen submission and return to an editable draft. Refused once a Review rejected the Proposal.', 'Currently promoted Revise; old approval cannot authorize changed contents.']
    - ['`rebase`', 'Create a new draft binding after target/package evolution.', 'Current Start and Rebase; requires resubmission and fresh review when required.']
    - ['`retry`', 'Retry eligible recoverable application work.', 'Explicit Retry; automatic work additionally requires a verified human for external recovery.']
    - ['`cancel`', 'Cancel currently cancellable durable work.', 'Explicit Cancel under current ownership and target scope.']
    - ['`apply`', 'Apply only the exact frozen effects.', 'Separate Apply with current guards and required fresh approval; automatic system authority is restricted to its frozen binding.']
- id: field-encodings
  title: Field type encodings
  columns: [Field type, JSON encoding, Notes]
  rows:
    - ['`boolean`', '`true` or `false`', '']
    - ['`string`', 'string', '`minimumLength` and `maximumLength` from the field.']
    - ['`text`', 'string', '`maximumLength` from the field.']
    - ['`int64`', 'integer', 'Full 64-bit range; clients that parse JSON numbers as doubles lose precision above 2^53.']
    - ['`decimal`', 'string', 'Decimal digits with the declared `precision` and `scale`, never a JSON number.']
    - ['`date`', 'string', 'RFC 3339 full date.']
    - ['`timestamp`', 'string', 'RFC 3339 date-time.']
    - ['`uuid`', 'string', 'Lower-case UUID.']
    - ['`vocabulary-code`', 'string', 'One of the vocabulary values; the schema carries them as an enum with `x-registry-vocabulary`.']
    - ['`reference`', 'string', 'The target record identifier as a UUID.']
    - ['`crs84-point`', 'object', 'GeoJSON Point, `{"type": "Point", "coordinates": [longitude, latitude]}`.']
    - ['`structured`', 'object', 'Validated against the declared schema, bounded by `maximumBytes`, advertised as `x-registry-maxBytes`.']
- id: statistical-dataset-routes
  title: Statistical dataset routes
  columns: [Route, Profile grant, Result]
  rows:
    - ['`GET /v1/statistics/{dataset}:live`', 'Live profile with count-capable source list grant', 'Exact JSON or CSV; optional `from` and `to`.']
    - ['`GET /v1/statistics/{dataset}/releases`', 'Released-data reader, publisher, or live profile', 'Version headers and `pageInfo`; `$top` and opaque `$skiptoken`.']
    - ['`GET /v1/statistics/{dataset}/releases:series`', 'Released-data access', 'Latest eligible document per period; required `from` and `to`, optional `status=final`.']
    - ['`GET /v1/statistics/{dataset}/releases/{period}`', 'Released-data access', 'Latest eligible JSON or CSV; optional `status=final`.']
    - ['`GET /v1/statistics/{dataset}/releases/{period}/versions/{version}`', 'Released-data access', 'Immutable JSON or CSV; 410 after withdrawal.']
    - ['`POST /v1/statistics/{dataset}/releases/{period}/versions`', 'Publisher', '201 version header; `{"status":"provisional"}` or `{"status":"final"}`; `Idempotency-Key` required.']
    - ['`POST /v1/statistics/{dataset}/releases/{period}/versions/{version}/withdrawal`', 'Publisher', '200 header with withdrawal; closed `reason`; `Idempotency-Key` required.']
