            standards_referenced: [govstack-digital-registries, sdmx, openapi, json-schema, shacl, json-ld]
            last_reviewed: unreviewed
        description: Approved Relay V2 product concept covering the registry contract, the compiler, the read-only source boundary, and the acceptance set.
