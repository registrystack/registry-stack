# Every docs entry requires last_reviewed and standards_referenced. The
# last_reviewed value is unreviewed until an evidenced human source review
# supplies a YYYY-MM-DD date. Use [] when the source references no registered
# standards. Every archived source has a complete docset_overrides snapshot for
# standards_referenced and last_reviewed so future current-page reviews cannot
# rewrite historical metadata.
repos:
  # Relay's product source moved to products/relay-v2 with the V2 rebuild. The
  # V1 runtime docs under crates/registry-relay/docs described capabilities the
  # V2 runtime does not have, so they are retired rather than retargeted: every
  # retired dest carries an explicit redirect in
  # src/lib/relay-v2-retirement-redirects.mjs. Only the two adopter-facing V2
  # product documents are pulled. CONFIGURATION-EXAMPLES.md, IMPLEMENTATION.md,
  # and DEFINITION-OF-DONE.md stay unpublished: they are design probes and
  # internal engineering contracts, not adopter documentation.
  #
  # Relay V2 first enters the versioned documentation archive at v0.20.0.
  # Earlier archived docsets stay excluded and retain their frozen Relay V1
  # product documentation.
  registry-relay:
    remote: https://github.com/registrystack/registry-stack
    ref: HEAD
    version: main source (unreleased)
    local: ../..
    docs:
      - src: products/relay-v2/CONCEPT.md
        dest: products/registry-relay/index
        label: Registry Relay
        nav_order: 0
        doc_type: explanation
        last_reviewed: unreviewed
        standards_referenced: [govstack-digital-registries, sdmx, openapi, json-schema, shacl, json-ld]
        exclude_docsets: [v0.18.0, v0.17.0, v0.16.3, v0.16.2, v0.16.1, v0.16.0, v0.15.2, v0.15.1, v0.15.0, v0.13.0, v0.12.2, v0.12.1, v0.12.0, v0.11.0, v0.10.0, v0.9.0, v0.8.4, v0.8.3, v0.8.2, v0.8.1, beta-5, beta-4, beta-3, beta-2026-06-12]
        docset_overrides:
