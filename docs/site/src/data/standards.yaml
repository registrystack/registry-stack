      url: /explanation/known-limitations/
  last_checked: 2026-08-11
  notes: No maintained Registry Stack surface parses or serves FHIR. The bounded R4 search-set parser was exposed to Rhai scripts by the retired Relay V1 runtime, and the pinned helper and authoring fixture are the record of it. The contract-compiled Relay runs no script and reads only local read-only SQLite sources with no outbound request, so a FHIR server is not a source it reaches. Evidence Gateway's frozen fixed-source contract accepts `application/json`, not `application/fhir+json`, so FHIR compatibility runs through a local read-through adapter the operator writes, which requests and validates FHIR JSON and exposes the bounded result as ordinary JSON. That adapter and its profile-specific matching are project code, not a Registry Stack surface. Registry Stack has never claimed to implement a FHIR server or broad FHIR conformance.
