- id: sdmx
  name: Statistical Data and Metadata eXchange (SDMX)
  standards_body: SDMX
  official_url: https://sdmx.org/standards-2/
  version_or_profile: REST 2.2.2 read subset; SDMX-JSON and SDMX-CSV 2.1.0
  status: used
  claim_level: aligns_with
  adoption_mode: profiled
  used_by:
    - registry-relay
  surfaces:
    - statistical dataflow reads
    - dataflow and data structure definition reads
  evidence_docs:
    - label: Relay V2 SDMX read routes
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/crates/registry-relay-v2/src/sdmx_http.rs
    - label: Relay V2 SDMX representation profile
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/crates/registry-relay-v2/src/sdmx/representation.rs
    - label: Relay V2 authoring guide
      url: /configure/relay/
  last_checked: 2026-08-11
  notes: >-
    Relay defines a read profile over governed, pre-aggregated snapshots: keyed
    or omitted-key dataflow data plus dataflow and data structure definition
    reads. Data JSON, data CSV, and structure JSON use version 2.1.0. The
    profile has one fixed dataset access rule, not Record access profiles, and
    omits schema and availability placeholders, other structure types,
    maintenance routes, and dynamic aggregation. It claims no full SDMX
    conformance or certification. The retired Relay V1 runtime served a
    different and unrelated surface, experimental SDMX-JSON 2.1 data messages
    through aggregate content negotiation, and it implemented no SDMX REST
    route.
