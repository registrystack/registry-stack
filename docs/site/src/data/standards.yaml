  notes: >-
    The separate `registry-evidence-oid4vci` supporting service implements a
    frozen subset of OID4VCI 1.0 Final for holder-bound Evidence credentials.
    The profile permits issuer-initiated anonymous pre-authorized-code delivery,
    a stateless nonce, ES256 JWT proofs with an inline public JWK or self-contained
    `did:jwk#0`, and plural `dc+sd-jwt` credentials. It excludes authorization
    code, PAR, DPoP, remote DID resolution, other credential formats, deferred
    issuance, notifications, status or revocation, persistence, and multiple
    replicas. This is a profile implementation claim, not full issuer
    certification or conformance. Exact pinned source-level interoperability and
    the sanitized Registry flow passed. This is not OpenID certification, device
    or UI evidence, compatibility with other revisions, or general Inji
    compatibility.
- id: sd-jwt-vc
  name: SD-JWT VC
  standards_body: IETF
  official_url: https://datatracker.ietf.org/doc/draft-ietf-oauth-sd-jwt-vc/
  version_or_profile: RFC 9901 and `draft-ietf-oauth-sd-jwt-vc-18`, under the frozen Evidence audience-scoped and holder-bound profiles
  status: used
  claim_level: emits
  adoption_mode: profiled
  used_by:
    - registry-platform
    - registry-evidence
  surfaces:
    - credential issuance
    - selective disclosure contracts
    - shared SD-JWT VC issuance and holder-proof helpers
    - Evidence Gateway SD-JWT VC response format
    - holder-bound subject binding and key-binding JWT presentation verification
  evidence_docs:
    - label: Evidence Gateway audience-scoped profile
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/products/evidence/contracts/sd-jwt-vc-profile.yaml
    - label: Evidence Gateway holder-bound profile
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/products/evidence/contracts/holder-bound-profile.yaml
    - label: Evidence Gateway strict verification policy schema
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/products/evidence/contracts/verification-policy.schema.yaml
    - label: Evidence Gateway portable SD-JWT VC verifier
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/crates/registry-evidence-verifier/src/sdjwt_vc.rs
    - label: Registry Notary SD-JWT VC conformance profile
      url: https://github.com/registrystack/registry-stack/blob/d45761a0104bd3d9c2e4b4db391d4223f289bd44/products/notary/docs/sd-jwt-vc-conformance-profile.md
    - label: Registry Notary format constants
      url: https://github.com/registrystack/registry-stack/blob/d45761a0104bd3d9c2e4b4db391d4223f289bd44/crates/registry-notary-core/src/model.rs
    - label: Registry Platform SD-JWT crate
      url: https://github.com/registrystack/registry-stack/blob/v0.20.0/crates/registry-platform-sdjwt/src/lib.rs
  last_checked: 2026-08-08
  notes: >-
    Registry Platform owns reusable SD-JWT VC issuance and holder-proof helpers.
    Evidence Gateway serializes its stateless assertion as an SD-JWT VC under its
    own frozen profile, and that profile is the source of truth for the claim set
    it emits. Two subject binding modes exist. Under the default audience-scoped
    mode the credential is meaningful only to the relying party the assertion
    names, and a caller-supplied holder key is echoed into `cnf` unverified.
    Under the declared holder-bound mode the binding derives from the RFC 7638
    thumbprint of the holder key, `cnf` is required, and possession is proven at
    presentation by a key-binding JWT under RFC 9901 section 4.3 rather than by
    the audience at issuance. Verifying a key-binding JWT proves possession at
    signing time over the presented bytes; comparing its nonce is not consuming
    it, so nothing here is replay prevention. Both profiles and the strict
    verification policy are frozen and citable. Evidence signs issuer JWTs with
    ES256 over P-256. Evidence confirmation keys, RFC 9901 key-binding JWTs, and
    OID4VCI proofs use ES256 over P-256. Registry Platform also retains a generic
    EdDSA holder-proof helper, but that is not the Evidence holder-bound
    presentation path. Registry Notary is retired; its pinned conformance profile
    and format constants remain historical evidence. Full SD-JWT VC conformance
    is not claimed. Wallet-facing OID4VCI delivery belongs to the separate
    `registry-evidence-oid4vci` front end.
