# Human-owned publication state for the generated CLI reference.
# The command content is crates/registry-cli-docs/catalog.json, whose diff is
# reviewed with the change that alters a command line. Set last_reviewed to the
# date of that review; a version-only release bump leaves this record alone.
# Starlight excludes the pages while this record is a draft, because the
# generator emits `draft: true`.
# New binary trees listed in unreviewed_binaries stay draft and out of the
# published index until human review.
# Binaries listed in source_build_only_binaries have no numbered-release asset,
# installer component, rstack component, or container image.
status: current
last_reviewed: 2026-10-28
unreviewed_binaries:
  [adapter, adapter-job, adapterctl, coordinator, coordinatorctl, documents, documentsctl, manifest, registry-mcp, rstack]
source_build_only_binaries: [adapter, adapter-job, adapterctl, registry-mcp]
