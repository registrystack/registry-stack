extends: substitution
message: "Use British spelling in prose: '%s' instead of '%s'."
level: warning
ignorecase: true
# Report-only. Replacements are listed word by word because a substitution
# rule cannot compute a replacement. The patterns skip identifiers and paths
# (an adjoining underscore, slash, at sign or dot-and-letter), the
# Authorization header and OAuth terms such as "authorization server", and
# the names of standards bodies. Inline code is skipped by Vale itself.
