[extend]
useDefault = true

[[allowlists]]
description = "Ignore generated Rust build output."
paths = ["(^|/)target/"]

[[allowlists]]
description = "Ignore the generated, gitignored docs repository cache."
paths = ["^docs/site/\\.repo-docs-cache/"]

[[allowlists]]
description = "Ignore the generated, gitignored VS Code test installation."
paths = ["^editors/vscode/\\.vscode-test/"]

[[allowlists]]
description = "Allow synthetic JWT fixtures used only by the Evidence fuzz harnesses."
paths = [
  "^products/evidence/fuzz/corpus/verifier_holder_proof/holder_proof\\.jwt$",
  "^products/evidence/fuzz/corpus/verifier_holder_proof/valid-holder-proof-jwt$",
]

[[allowlists]]
description = "Allow fixed non-secret values used by tests and configuration examples."
regexTarget = "line"
regexes = [
  '''let key = Pkcs1RsaPrivateKey''',
  '''chain_key_epoch_id:\s*[a-z0-9-]+-chain-1''',
  '''"dci_crvs_api":\s*"5e31d1e381d4bd8c7c74112d714fd49d263c6df7"''',
  '''"AKIAABCDEFGHIJKLMNOP"''',
  '''"eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJzdWJqZWN0In0\.abcdefghijklmnop"''',
  '''"eyJhbGciOiJFUzI1NiJ9\.eyJzdWIiOiJzdGFmZi1zdWJqZWN0In0\.c2lnbmF0dXJlLWJ5dGVzLXZhbHVl"''',
  '''"eyJhbGciOiJFUzI1NiJ9\.eyJncmFudCI6InRhc2sifQ\.Z3JhbnQtc2lnbmF0dXJl"''',
]

[[allowlists]]
description = "Allow the throwaway ECDSA client key generated for the Adapter mTLS unit tests; it exists only under #[cfg(test)] and no deployment has trusted its self-signed certificate."
condition = "AND"
paths = ["^crates/registry-adapter-engine/src/auth/tls\\.rs$"]
regexTarget = "line"
regexes = ['''const CLIENT_PRIVATE_KEY_PEM: &str = "-----BEGIN PRIVATE KEY-----\\nMIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgcu64hV3YOzpMTbrA''']

[[allowlists]]
description = "Allow the throwaway OpenSSH host and client keys in the Adapter job SFTP tests; they exist only in the #[cfg(test)] module and the test-support server, and each is pinned by its embedded public key."
condition = "AND"
paths = [
  "^crates/registry-adapter-job/src/sftp_source\\.rs$",
  "^crates/registry-adapter-job/tests/support/sftp_source_server\\.rs$",
]
regexes = [
  '''AAAAIN\+Wjn4\+4Fcvl2Jl''',
  '''AAAAQQQ/i\+HCsmZZPy0JhtT64vW7EmeA1DeA''',
  '''AAAAIHeLC1lWiCYrXsf/''',
]

[[allowlists]]
description = "Allow the ODK Central repeat instance ids in the odk-central repeats fixture; they are 40-character hex row ids the source route uses as item keys, not credentials."
condition = "AND"
paths = ["^products/adapter/packs/odk-central/fixtures/odk-central-repeats-page\\.yaml$"]
regexTarget = "line"
regexes = ['''^\s*(- )?(key|__id): [0-9a-f]{40}$''']

[[allowlists]]
description = "Allow the reconstructed GraphQL page-state token in the Adapter GraphQL cursor source-shape fixture; it is a documented synthetic value, not a credential."
condition = "AND"
paths = ["^products/adapter/fixtures/source-shapes/graphql-cursor-source/fixtures/find-first-page\\.yaml$"]
regexTarget = "line"
regexes = ['''^\s*pageStateToken: AQGTVIRecXOAHQpErfOzhEknm-j2T4eSa5osZDxhcPxbjL4ZWsi_fwuEmekmwe3pJzk7HzaQ5NkeOQEeCryW2cQXdLeGuRw25_eLYQ$''']

[[allowlists]]
description = "Allow the derived native idempotency key in the adapterctl GovStack Create replay test; it is the SHA-256 hex the Adapter derives from a synthetic request, not a credential."
condition = "AND"
paths = ["^crates/registry-adapterctl/tests/fixtures_replay\\.rs$"]
regexTarget = "line"
regexes = ['''^\s*idempotency-key: [0-9a-f]{64}$''']

[[allowlists]]
description = "Allow the deterministic flow identifier in the generated ThunderID fixture; it references a synthetic flow in the same fixture, not an API credential."
condition = "AND"
paths = ["^crates/registry-thunderid-tooling/fixtures/identity/expected/resources/resources\\.yaml$"]
regexTarget = "line"
regexes = ['''^authFlowId: 2abacd42-1674-7da5-8f7c-19c2f8c262f0$''']

[[allowlists]]
description = "Allow the OpenID4VP refusal codes in the client identifier module; they are diagnostic code strings that name a secret or key, not credentials."
condition = "AND"
paths = ["^crates/registry-evidence-oid4vp/src/client_identifier\\.rs$"]
regexTarget = "line"
regexes = ['''=> "evidence\.oid4vp\.[a-z0-9-]+",$''']

[[allowlists]]
description = "Allow the SD-JWT VC presentations in the SD-JWT test vectors: the RFC 9901 section 5.2 example, and a vector generated with the OpenWallet Foundation library from a throwaway issuer key whose public half the vector pins; neither is a credential any deployment trusts."
condition = "AND"
paths = [
  "^crates/registry-platform-sdjwt/tests/data/rfc-9901-section-5-2-presentation\\.txt$",
  "^crates/registry-evidence-presentation/tests/vectors/es256-pinned-key\\.json$",
]
regexTarget = "line"
regexes = ['''^(\s*"presentation": ")?eyJhbGciOiAiRVMyNTYiLCAidHlwIjogI(mV4YW1wbGUrc2Qtand0In0\.|mRjK3NkLWp3dCIsICJraWQiOiAi)''']
