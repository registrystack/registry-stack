# Registry Stack configuration format registry (CFG-SCHEMA-1).
#
# One entry per configuration format a Registry Stack tool reads or writes:
# authored files, operator files, read-back formats (generated files a tool
# reads again), and output formats (`reader: none`, written for people or for
# tools we do not own). The conventions every entry is held to are in
# products/platform/CONFIG-CONVENTIONS.md. Repository tooling metadata is
# out of scope: this file, config-conventions-exceptions.yaml, and the
# contract records under products/*/contracts that only repository scripts
# read. So are API payloads. `outOfScope` lists the schema and file patterns
# the lint would otherwise expect to find registered.
#
# products/platform/scripts/check-config-conventions.py reads this file. It
# checks every entry against the code (header constants, reader functions and
# types, schema paths and `$id`s, examples and conformance members) and then
# lints every registered schema and reader type against the conventions. A
# deviation it finds must be recorded in config-conventions-exceptions.yaml.
#
# Adding a format:
#
#   1. Add an entry under `formats:` beside its product's other entries. `id`
#      is `<product>/<format>`, where `<format>` is derived from `target.kind`
#      (strip the product prefix and a trailing `Config`, split before each
#      capital, lowercase, join with `-`). `target.apiVersion` is
#      `id.registrystack.org/formats/<product>/<format>/<version>`.
#   2. Record what the code does today under `current` (the header the reader
#      accepts and the constant that holds it, or `none`), and the reader
#      (`crate`, `file`, `function`, and the decoded `type`, or `untyped`).
#   3. Record the schema (`origin: generated` with its `generator` command and
#      `driftCheck` file, `frozen-contract` or `hand-written` with its
#      `differentialTest` file), the offline `check` command, the minimal valid
#      `example`, a `conformance` member per typed case (an example JSON
#      pointer, or `none`), `securityMembers`, and `restrictingMembers`.
#      Pointers use `*` for every list item or map value.
#   4. Run products/platform/scripts/check-config-conventions.py. Fix what it
#      reports, or record a classified exception for it.
#
# Field values:
#
#   audience       authored | operator | generated
#   stability      promised | experimental | unpromised
#   syntax         yaml | json | jsonl | text
#   topLevel       project | bundle (the product's top-level authored file,
#                  CFG-ENV-6)
#   exceptionClass external-format | exchange-model (the whole format is
#                  outside the naming rules; see the convention's Exceptions)
#   whenOmitted    refused (the reader requires the member) | open (omitting
#                  it widens access today) | closed (omitting it narrows
#                  access) | unclassified (review owes the classification,
#                  CFG-EMPTY-3)

apiVersion: id.registrystack.org/formats/platform/config-format-registry/v1alpha1
kind: PlatformConfigFormatRegistry

sharedSchemas:
  - id: platform/runtime-config-blocks
    path: products/platform/generated/runtime-config-blocks.schema.json
    origin: generated
    driftCheck: products/platform/scripts/check-config-conformance.py

formats:

  # breg
  - id: breg/project
    product: breg
    title: Registry project
    files: [registry.yaml]
    syntax: yaml
    audience: authored
    stability: promised
    topLevel: project
    current:
      apiVersion: registry.registrystack.org/v1alpha1
      kind: RegistryProject
      checkedBy:
        file: crates/registry-breg/src/compiler.rs
        symbol: AUTHORING_API_VERSION
    target:
      apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
      kind: BRegProject
    schema:
      path: products/breg/generated/authoring/registry-project.schema.json
      id: https://id.registrystack.org/schemas/breg/project/project.v1alpha1.schema.json
      origin: generated
      generator: cargo run -p registry-breg --features schema --example authoring-schema -- --output products/breg/generated/authoring
      driftCheck: products/breg/scripts/check-generated.sh
    reader:
      crate: registry-breg
      file: crates/registry-breg/src/contract.rs
      function: parse_project_yaml
      type: RegistryProject
    check: bregctl check {project}
    example: products/breg/examples/minimal/registry.yaml
    conformance:
      requiredText: /registry/id
      optionalText: /manifestProjection/catalog/description
      integer: /entities/0/batch/maximumItems
      boolean: /accessProfiles/0/default
      idList: /entities
      set: /accessProfiles/0/requiredPurposes
      reference: /accessProfiles/0/permissions/0/entity
    securityMembers:
      - pointer: /accessProfiles/*/anonymous
        whenOmitted: closed
      - pointer: /accessProfiles/*/requiredScopes
        whenOmitted: open
      - pointer: /accessProfiles/*/requiredPurposes
        whenOmitted: open
      - pointer: /accessProfiles/*/requesterClients
        whenOmitted: unclassified
      - pointer: /entities/*/accessRequirements/requiredScopes
        whenOmitted: open
    restrictingMembers: [/accessProfiles/*/requiredScopes, /accessProfiles/*/requiredPurposes, /accessProfiles/*/requesterClients, /entities/*/accessRequirements/requiredScopes]
