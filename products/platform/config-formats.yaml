outOfScope:
  - files: products/breg/generated/*/generated/**
    reason: Compiled package content; the registry/package format governs the envelope.
  - files: products/evidence/contracts/{audit-event,authority-context,definitions,evidence,request,request-batch,request-batch-response,request-batch-audit-event}.schema.yaml
    reason: Evidence wire and audit contracts, governed by the API contract.
  - files: products/evidence/generated/*.schema.json
    reason: Generated Evidence wire schemas, governed by the API contract.
  - files: products/discovery/profile/schema/*.schema.json
    reason: Discovery provider description, a published wire resource.
  - files: products/identifiers/contracts/*.schema.json
    reason: Identifier catalog, repository tooling metadata.
  - files: '**/*.jsonl'
    reason: Record data (JSONL imports), an exchange of data, not configuration.
  - files: '**/examples/inputs/*.json'
    reason: API request payloads, governed by the API contract.
  - files: release/**
    reason: Release manifests and tooling metadata.
  - files: docs/site/src/data/cli-reference.yaml
    reason: Docs tooling metadata.
  - files: '**/PIN.yaml'
    reason: Repository pin metadata.
  - files: products/messaging/examples/providers/*/connection.example.yaml
    reason: Fragment of messaging/runtime providers.<id>; governed by that format.
  - files: products/casework/examples/*/sources/*.breg-runtime.yaml
    reason: Fragment of breg/runtime pasted by caseworkctl source add; governed by that format.
  - files: products/evidence/fixtures/conformance/**
    reason: Evidence conformance vectors, governed by the Evidence contracts.
  - files: products/render/bundles/*/schemas/*.schema.json
    reason: Render data schemas; registered as render/data-schema (external-format).
