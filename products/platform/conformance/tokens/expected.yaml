# Expected results of the token fixture corpus, per product.
#
# A cell with `basis: inferred` is a reading of the product's authentication code.
# A cell with `basis: observed` was run through the product's own verifier by its
# characterisation test (`token_characterisation` in each product crate), and
# `main` holds the result that test observed.
#
# Cell fields
#   main       the result at the commit the corpus was written against. It changes only
#              when a characterisation test observes a different result, and then the
#              cell's `basis` becomes `observed`
#   target     the result the caller-contract work is meant to give
#   changedBy  the change that alters the result, or `none`
#   landed     false until that change makes `target` true. A test asserts `target`
#              where `landed` is true and `main` otherwise
#   basis      inferred or observed
#   reason     why `main` is `unknown` or `n-a`
#   targetReason  why `target` is `unknown`
#
# Values
#   admitted, admitted/<actor kind>, admitted/unspecified (the token names no kind
#   and the product admits that), refused/<stage>, none (the configuration needs a
#   setting the product does not have), n-a (the product has no such concept),
#   unknown (not determined, with a reason).
#   Stages: header, algorithm, token-type, key, signature, issuer, audience, time,
#   client, scope, profile, unavailable (the shared verifier's labels), claims
#   (a product's own claim extraction) and actor-kind (the caller's kind claim
#   cannot be read, contradicts the declared kind, or the token grants no scope
#   and has no declared kind).
#
# How the fixtures are run (what a driver sets up for each row)
#   1. Issuer and audience are the product's own. A fixture with a literal aud is
#      checked against that literal only in the `recipe` configuration of a
#      positive fixture, where the configured audience line names it.
#   2. Every product holds an allowed client list that names the fixture's client.
#      The `recipe` configuration of a fixture with no client claim leaves the list
#      unrestricted where the product allows it.
#   3. The product's read scope is the first scope the fixture carries, read from
#      the scope claim the configuration names.
#   4. The principal claim is `sub`. Every lifetime the fixtures use is within each
#      product's maximum.
#   5. Algorithm settings, where a product has one, are set to the fixture's.
#   6. `against: human-only-profile` selects a profile that admits only people.
#   7. An identity-only token grants no scope and has no declared actor kind. The
#      OpenID Connect scopes openid, profile, email, address, phone and
#      offline_access grant nothing, and a kind the token claims is not a
#      declaration. Every product refuses it at authentication, so its targets
#      outside `recipe-declared-kind` are `refused/actor-kind`. Under `recipe-declared-kind` BReg admits it on a profile
#      that requires no scope. A product that requires a scope refuses at `scope`.
#      A product that chooses its profile by client keeps its rule that a profile
#      pinning a kind admits only that kind.
#   8. Documents requires an actor kind of `service` or `human` on every profile,
#      so no Documents cell targets `admitted/unspecified`.

schema: registry.token-fixture-expectations/v1
products: [breg, casework, messaging, scheduling, documents, coordinator, adapter, evidence, render, mcp-edge, evidence-oid4vci]
configurations:
  default: the issuer block as the product's starter writes it
  recipe: the documented lines for the fixture's provider, which name the token type, the scope claim, the client rule and an audience that a fixture states literally. none where main has no such setting
  jwt-accepted: the default block with token type JWT accepted, for the ID token fixtures. none where main has no such setting
  recipe-declared-kind: the recipe block plus an actor kind the operator declares for the fixture's client, or for the whole issuer where the token names no client. The declared kind follows the fixture's subject kind, human for a user and service for a service. none where main has no such setting
rows:
