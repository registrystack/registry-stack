# How products/platform/scripts/run-config-conformance.py stages a format
# whose check command needs more than a copy of its example's directory.
# A format not listed here is staged as a copy of its example's directory.
# The members are documented at the top of the runner.
formats:
  breg/module:
    project: products/platform/conformance/projects/breg
    prepare: ["bregctl project lock {project}"]
  # Journeys are checked against the project whose routes they call, and a
  # reviewed migration file at its place in the project tree.
  breg/journeys:
    project: products/breg/acceptance/asset-site-placement
    init: {command: "bregctl init {directory}", file: tests/journeys.yaml}
  # The scenario reader needs its enclosing development project, which
  # names the scenarios file in its `scenarioFile`.
  rstack/scenarios:
    project: products/platform/conformance/projects/breg-project-dev
  breg/migration-descriptor:
    project: products/breg/examples/formats/reviewed-migrations
  breg/migration-rehearsal-receipt:
    project: products/breg/examples/formats/reviewed-migrations

  casework/fixture:
    project: products/casework/examples/standalone-decision
    init: {command: "caseworkctl init --template standalone-decision {directory}", file: fixtures/standalone-decision.yaml}
  casework/holiday-set:
    project: products/casework/examples/multi-stage-routing-clocks
  casework/runtime:
    init: {command: "caseworkctl init --template standalone-decision {directory}", file: runtime.example.yaml}

  scheduling/project:
    init: {command: "schedulingctl init --template standalone-exact-time {directory}", file: scheduling.yaml}
  scheduling/fixture:
    project: products/scheduling/examples/standalone-arrival-window
    init: {command: "schedulingctl init --template standalone-exact-time {directory}", file: fixtures/counter-stations.yaml}
  scheduling/runtime:
    init: {command: "schedulingctl init --template standalone-exact-time {directory}", file: runtime.example.yaml}

  messaging/project:
    project: products/messaging/examples/starter
    init: {command: "messagingctl init {directory}", file: messaging.yaml}
  messaging/template:
    project: products/messaging/examples/starter
    init: {command: "messagingctl init {directory}", file: templates/appointment-reminder/1/template.yaml}
  messaging/provider:
    project: products/messaging/examples/starter
    init: {command: "messagingctl init {directory}", file: providers/sms-gateway/provider.yaml}
  # The runtime file is checked against the editable project, with no built
  # package.
  messaging/runtime:
    project: products/messaging/examples/starter
    init: {command: "messagingctl init {directory}", file: runtime.example.yaml}

  discovery/evidence-mapping:
    project: products/discovery/fixtures/project

  manifest/profile:
    project: products/manifest/profiles

  # The maintained bundles are packages, so the staged copy's SHA256SUMS is
  # refreshed after each mutation.
  render/bundle:
    digests: SHA256SUMS
    init: {command: "registry-render init {directory}", file: manifest.yaml}
  render/labels:
    project: products/render/bundles/certificate
    digests: SHA256SUMS
    init: {command: "registry-render init {directory}", file: labels/en.yaml}

  # The normalized example ships without private key material. Generate a
  # disposable signer for the complete local target before fixture evaluation.
  evidence/fixture:
    postureWarningArtifacts:
      evidence.posture.local-assurance: EvidenceBundle
    project: products/evidence/examples/standalone
    prepare:
      - evidencectl keygen signing --output-dir {project}/.generated/secrets
    init: {command: "evidencectl init --profile local --transport sqlite-extract {directory}", file: fixtures/record-status.yaml}
  evidence/project:
    project: products/evidence/examples/standalone
  evidence/target:
    project: products/evidence/examples/standalone
  evidence/target-authority:
    project: products/evidence/examples/standalone
  evidence/access-client:
    project: products/evidence/examples/standalone
  evidence/mock-plan:
    project: products/evidence/examples/formats/source-mock

  # The bundle is checked through its deployment project's runtime
  # configuration, pointed at the staged copy, and its SHA256SUMS is refreshed
  # after each mutation.
  evidence/bundle:
    copies:
      runtime:
        from: products/evidence/reference/request-adapter/deployment-projects/opencrvs-family-evidence/runtime.yaml
        set:
          /package/root: "{project}"
    digests: SHA256SUMS

  # A code list is checked the same way, through the bundle that holds it.
  evidence/codelist:
    project: products/evidence/reference/request-adapter/deployment-projects/protected-read-evidence/bundle
    copies:
      runtime:
        from: products/evidence/reference/request-adapter/deployment-projects/protected-read-evidence/runtime.yaml
        set:
          /package/root: "{project}"
    digests: SHA256SUMS

  # The runtime configuration is checked against the bundle its staged
  # deployment project holds.
  evidence/runtime:
    set:
      /package/root: "{project}/bundle"

  # The command each product documents for starting a project, and the file
  # of the format it writes there (CFG-SCHEMA-7: its first line is the schema
  # modeline). Formats with an entry above carry their `init` there.
  breg/project:
    init: {command: "bregctl init {directory}", file: registry.yaml, association: native-kind}
  breg/runtime:
    init: {command: "bregctl init {directory}", file: runtime.example.yaml}
  breg/dev-clients:
    init: {command: "bregctl init {directory}", file: dev-clients.yaml}
  casework/project:
    init: {command: "caseworkctl init --template standalone-decision {directory}", file: casework.yaml}
  scheduling/records:
    init: {command: "schedulingctl init --template standalone-exact-time {directory}", file: records.yaml}
  documents/project:
    init: {command: "documentsctl init {directory}", file: documents.yaml}
  documents/runtime:
    init: {command: "documentsctl init {directory}", file: runtime.example.yaml}
  # Coordinator checks the staged three-file portable project. Its init output
  # carries the same project and runtime envelopes the readers accept.
  coordinator/project:
    # Isolate the path role: other functions keep their shared source file
    # when the corpus moves or symlinks this one outside the project.
    set:
      /functions/notice-route/source: notice-route.rhai
    write:
      notice-route.rhai: |
        fn notice_route(args) {
            let record = args["record"];
            if record.data.domainData.noticeAllowed { "send" } else { "skip" }
        }
    init: {command: "coordinatorctl init --directory {directory}", file: workflow.yaml}
  coordinator/runtime:
    init: {command: "coordinatorctl init --directory {directory}", file: runtime.yaml}
  # The adapter's check reads a whole authored workspace: the example stages
  # the project directory, and copies land the pinned profile, pack, and
  # fixtures beside it where the check's flags name them. A profile or pack
  # mutation changes the bytes the project pins, so those two formats run
  # the lock after each write; the project format never does, so its
  # pin-tampering cases keep their meaning.
  adapter/project:
    project: products/adapter/examples/dhis2-tracker
    copies:
      profile: {from: products/adapter/profiles/breg-records}
      pack: {from: products/adapter/packs/dhis2-tracker}
      fixtures: {from: products/adapter/fixtures/dhis2-tracker}
  adapter/profile:
    project: products/adapter/examples/dhis2-tracker
    copies:
      profile: {from: products/adapter/profiles/breg-records}
      pack: {from: products/adapter/packs/dhis2-tracker}
      fixtures: {from: products/adapter/fixtures/dhis2-tracker}
    afterWrite: ["adapterctl project lock {project} --profile {profile}/profile.yaml --pack {pack}/pack.yaml"]
  adapter/pack:
    project: products/adapter/examples/dhis2-tracker
    copies:
      profile: {from: products/adapter/profiles/breg-records}
      pack: {from: products/adapter/packs/dhis2-tracker}
      fixtures: {from: products/adapter/fixtures/dhis2-tracker}
    afterWrite: ["adapterctl project lock {project} --profile {profile}/profile.yaml --pack {pack}/pack.yaml"]
  # `adapterctl job check` compiles the job's workspace, which resolves
  # the endpoint credential references; the staged runtime points them at
  # the variable the runner sets for every check.
  adapter/job:
    copies:
      pack: {from: products/adapter/packs/kobotoolbox}
      runtime:
        from: products/adapter/examples/kobotoolbox-job/job-runtime.example.yaml
        set:
          /endpoints/0/credential/tokenRef: secret:env/REGISTRY_CONFORMANCE_VALUE
  # The expectations are read beside the samples they judge, so the example
  # stages the whole job directory, whose mapping the check previews.
  adapter/preview-expectations:
    project: products/adapter/examples/kobotoolbox-job
  adapter/fixture:
    project: products/adapter/examples/dhis2-tracker
    copies:
      profile: {from: products/adapter/profiles/breg-records}
      pack: {from: products/adapter/packs/dhis2-tracker}
      fixtures: {from: products/adapter/fixtures/dhis2-tracker}
  adapter/payment-provider-pack:
    copies:
      payments: {from: products/adapter/examples/payment-collections/payments.example.yaml}
  adapter/payment-provider-fixture:
    copies:
      payments: {from: products/adapter/examples/payment-collections/payments.example.yaml}
    values:
      pack: "{project}/payment-provider-fixture-pack.yaml"
    write:
      payment-provider-fixture-pack.yaml: |
        apiVersion: id.registrystack.org/formats/adapter/payment-provider-pack/v1alpha1
        kind: AdapterPaymentProviderPack
        id: mifos-legacy-fixture
        version: '1'
        connector: mifos-ph-ee-legacy/v1
        capabilities: [collection]
  # `adapterctl job check` compiles the job's workspace, which resolves
  # the endpoint credential references; the staged runtime points them at
  # the variable the runner sets for every check.
  adapter/job:
    copies:
      pack: {from: products/adapter/packs/kobotoolbox}
      runtime:
        from: products/adapter/examples/kobotoolbox-job/job-runtime.example.yaml
        set:
          /endpoints/0/credential/tokenRef: secret:env/REGISTRY_CONFORMANCE_VALUE
  adapter/job-runtime:
    copies:
      pack: {from: products/adapter/packs/kobotoolbox}
    set:
      /endpoints/0/credential/tokenRef: secret:env/REGISTRY_CONFORMANCE_VALUE
  adapter/runtime:
    project: products/adapter/examples/dhis2-tracker
    copies:
      profile: {from: products/adapter/profiles/breg-records}
      pack: {from: products/adapter/packs/dhis2-tracker}
      fixtures: {from: products/adapter/fixtures/dhis2-tracker}
  adapter/job-runtime:
    copies:
      pack: {from: products/adapter/packs/kobotoolbox}
    set:
      /endpoints/0/credential/tokenRef: secret:env/REGISTRY_CONFORMANCE_VALUE
