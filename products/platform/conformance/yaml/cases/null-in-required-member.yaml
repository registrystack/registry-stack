id: null-in-required-member
rules: [CFG-EMPTY-1, CFG-DIAG-6]
summary: A `null` in a required text member is refused at the value, never read as absent or as the text "null".
mutation:
  member:
    role: requiredText
    value: "null"
expect:
  exit: 1
  diagnostics:
    - code: config.null-value
      path: "{pointer}"
      at: {line: 1, column: 1}
      suggestedAction: Remove the key to use the default, or give a value.
