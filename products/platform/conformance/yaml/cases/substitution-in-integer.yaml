id: substitution-in-integer
rules: [CFG-SEC-2, CFG-VAL-3, CFG-DIAG-6, CFG-SEC-3]
summary: A substitution expression in an integer member is refused with the fix to write the value or template the whole file.
appliesTo:
  audiences: [operator]
mutation:
  member:
    role: integer
    value: '"${REGISTRY_CONFORMANCE_VALUE}"'
expect:
  exit: 1
  diagnostics:
    - code: config.expected-integer
      path: "{pointer}"
      at: {line: 1, column: 1}
      suggestedAction: Write the value, or template the whole file.
