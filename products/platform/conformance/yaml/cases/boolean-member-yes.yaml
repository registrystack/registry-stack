id: boolean-member-yes
rules: [CFG-VAL-1, CFG-DIAG-6]
summary: A plain `yes` in a boolean member is text, refused with the fix to write true or false.
mutation:
  member:
    role: boolean
    value: "yes"
expect:
  exit: 1
  diagnostics:
    - code: config.expected-boolean
      path: "{pointer}"
      at: {line: 1, column: 1}
      suggestedAction: Write true or false.
