id: missing-kind
rules: [CFG-ENV-1]
summary: A document with an apiVersion and no kind is refused as a missing envelope.
appliesTo:
  envelope: true
mutation:
  envelope:
    kind: remove
expect:
  exit: 1
  diagnostics:
    - code: config.missing-envelope
      path: ""
      from: root
      at: {line: 1, column: 1}
