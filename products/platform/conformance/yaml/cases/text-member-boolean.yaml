id: text-member-boolean
rules: [CFG-VAL-2, CFG-DIAG-6]
summary: A plain `true` in a text member is refused, not read as the text "true".
mutation:
  member:
    role: requiredText
    value: "true"
expect:
  exit: 1
  diagnostics:
    - code: config.expected-string
      path: "{pointer}"
      at: {line: 1, column: 1}
      suggestedAction: Quote the value to make it text.
