id: structural-problems-together
rules: [CFG-DIAG-5]
summary: Every structural problem in a document is reported in one run.
mutation:
  append: |
    conformanceDuplicate: first
    conformanceDuplicate: second
    conformanceAnchor: &conformance text
    conformanceNumber: 0x1F
expect:
  exit: 1
  diagnostics:
    - code: yaml.duplicate-key
      path: /conformanceDuplicate
      at: {line: 2, column: 1}
      related:
        - path: /conformanceDuplicate
          at: {line: 1, column: 1}
    - code: yaml.anchor
      path: /conformanceAnchor
      at: {line: 3, column: 20}
    - code: yaml.ambiguous-number
      path: /conformanceNumber
      at: {line: 4, column: 20}
