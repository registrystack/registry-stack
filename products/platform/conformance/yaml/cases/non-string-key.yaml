id: non-string-key
rules: [CFG-YAML-5]
summary: A plain key that resolves to an integer is refused at the key.
mutation:
  append: |
    7: seven
expect:
  exit: 1
  diagnostics:
    - code: yaml.non-string-key
      path: /7
      at: {line: 1, column: 1}
      suggestedAction: Quote the key to make it text.
