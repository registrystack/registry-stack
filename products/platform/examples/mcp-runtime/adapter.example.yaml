# yaml-language-server: $schema=https://id.registrystack.org/schemas/platform/mcp-runtime/mcp-runtime.v1alpha1.schema.json
# Experimental: requires a separately built matching Live Adapter producer.
# Export its effective contract, set ADAPTER_CONTRACT_FILE and ADAPTER_CONTRACT_DIGEST,
# then run check --environment. dataClass is an unchecked operator attestation.
apiVersion: id.registrystack.org/formats/platform/mcp-runtime/v1alpha1
kind: PlatformMcpRuntimeConfig
name: Facility information assistant
listener:
  bind: 127.0.0.1:8122
  tlsTermination: operator-controlled-upstream
secretProviders:
  environment: {}
resourceServer:
  resource: https://facility-assistant.example.invalid/mcp
  issuer: https://login.example.invalid
  algorithms: [EdDSA]
  allowedClients: [facility-chat-host]
  requiredScopes: [facilities:read]
audit:
  hashKeyRef: secret:env/MCP_AUDIT_KEY
  destination: stdout
rateLimits:
  perPrincipal: {requestsPerMinute: 30, burst: 10}
  perClient: {requestsPerMinute: 600, burst: 100}
bindings:
  - name: facility-adapter
    tools: [list_facilities]
    provider:
      type: adapter
      baseUrl: https://adapter.example.invalid/
      contractFile: ${ADAPTER_CONTRACT_FILE}
      contractDigest: ${ADAPTER_CONTRACT_DIGEST}
      dataClass: non-personal
      audience: adapter-example
      machineTokenRef: secret:env/MCP_ADAPTER_TOKEN
      operations:
        list_facilities:
          operation: records-list.facilities
          description: List the facilities exposed by this institution's reviewed Adapter connection.
