# Migration refusal fixture: this historical template lacks the required
# authority: delegated-staff-read selector. Offline check must refuse it.
# Use casework.example.yaml with a matching backend delegated-reader policy.
apiVersion: id.registrystack.org/formats/platform/mcp-runtime/v1alpha1
kind: PlatformMcpRuntimeConfig
name: Staff review assistant
logLevel: info
listener:
  bind: 127.0.0.1:8111
  tlsTermination: operator-controlled-upstream
secretProviders:
  file:
    root: /run/secrets/staff-mcp
resourceServer:
  resource: https://staff-assistant.example.invalid/mcp
  issuer: https://login.example.invalid
  algorithms: [EdDSA, ES256]
  allowedClients: [staff-chat-host]
  requiredScopes: [casework:staff]
  maximumTokenLifetimeSeconds: 3600
audit:
  hashKeyRef: secret:file/audit-key
  destination: file
  path: /var/lib/staff-mcp/audit/audit.jsonl
rateLimits:
  perPrincipal:
    requestsPerMinute: 30
    burst: 10
  perClient:
    requestsPerMinute: 600
    burst: 100
bindings:
  - name: assigned-review-tasks
    tools: [list_my_review_tasks, get_review_task_context]
    provider:
      type: casework
      baseUrl: https://casework.example.invalid/
      readerPolicy: assistant-reader
      sourceProfile: assistant-source
      pageSize: 20
      authorization:
        exchange:
          tokenEndpoint: https://login.example.invalid/token
          clientId: staff-gateway
          privateKeyRef: secret:file/gateway-key
        audience: urn:example:casework
        scopes: [casework:staff]
