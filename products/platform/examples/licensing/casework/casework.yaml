apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project: {id: licensing-review, version: "1"}
accessProfiles:
  administrator:
    principalClaim: registry_principal
    requiredScopes: ["casework:admin"]
    actsAs: administrator
  reviewer:
    principalClaim: sub
    requiredScopes: ["casework:review"]
    actsAs: staff
  supervisor:
    principalClaim: sub
    requiredScopes: ["casework:supervise"]
    actsAs: supervisor
  intake:
    principalClaim: producer_identity
    requiredScopes: ["casework:intake"]
    actsAs: requester
  applicant:
    principalClaim: sub
    requiredScopes: ["casework:history"]
    actsAs: requester
queues:
  applications:
    label: Applications awaiting review
contextProviders:
  licensing:
    capabilities: [human-display, service-status]
    sourceNamespace: licensing
    deploymentRef: licensing
    serviceProfiles: {service-status: review-status}
reviewPolicies:
  licensing-approval:
    version: "1"
    purpose: approval
    context:
      mode: current-source
      provider: licensing
      contract:
        id: urn:registry:breg:review-context:licensing:submit-application:application-context
        revision: sha256:379c74fbde7aa7670861fb5fef1d7d7919cc4e9c4a8d7c384cfb1860bd43e351
        schemaDigest: sha256:691f4fcb9d28e93ad3c96fb23920824a8d91040094aa2fe82db53b10995a2b7d
    stages:
      - id: review
        queue: applications
        decidingProfiles: [reviewer]
        requiredApprovals: 1
        excludeInitiator: true
    retention:
      terminalRetentionDays: 30
      accountabilityRetentionDays: 90
    displaySchema: {$ref: schemas/application-context.schema.json}
    outcomes:
      approved:
        label: Approve application
        settlement: approved
        reasonRequired: false
        publicReason: optional
trustedProducers:
  licensing-intake:
    profile: intake
    initiatorProfile: applicant
    issuer: https://identity.licensing.example.test
    subject: intake
    trustedInitiatorIssuer: https://identity.licensing.example.test
    sourceNamespaces: [licensing]
    reviewPolicies: [licensing-approval]
    retention: {receiptRetentionDays: 7}
