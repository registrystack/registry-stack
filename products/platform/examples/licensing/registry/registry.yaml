apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: licensing
  canonicalBaseIri: https://licensing.example.test
  version: 0.1.0
  defaultLanguage: en
  display: {label: Licensing registry, description: Synthetic professional licence applications.}
package:
  sourceRevision: licensing-example-0.1.0
datasets:
  - id: licensing
    display: {label: Licensing, description: Applications awaiting an independent review.}
recordTypes:
  - id: application
    route: applications
    primaryDataset: licensing
    mutationMode: mutable
    display: {label: Application, description: One licence application.}
    fields:
      - {id: reference, type: string, required: true, minimumLength: 1, maximumLength: 80, classification: internal}
      - {id: profession, type: string, required: true, minimumLength: 1, maximumLength: 80, classification: internal}
      - {id: status, type: vocabulary-code, vocabulary: application-status, classification: internal}
    mutationPolicy: {patch: proposal-required}
vocabularies:
  - id: application-status
    values: [submitted]
reviewAuthorities:
  - id: casework
    protocol: id.registrystack.org/protocols/review/v1
actions:
  - id: submit-application
    execution:
      mode: proposal
      proposal:
        review:
          type: required
          authority: casework
          source: licensing
          policy: {id: licensing-approval}
        reviewContext:
          id: application-context
          fields:
            reference: {type: record, input: application, field: reference}
            profession: {type: record, input: application, field: profession}
        retention: {mode: retain}
    inputs:
      - {id: application, type: reference, target: application, required: true, classification: internal}
      - {id: status, type: vocabulary-code, vocabulary: application-status, required: true, classification: internal}
    commitGuards:
      targets:
        - {input: application, revision: unchanged}
    plan:
      type: fixed
      effects:
        - id: mark-submitted
          target: {fromInput: application}
          operation: patch
          set:
            status: {fromInput: status}
accessProfiles:
  - id: applicant
    default: true
    principalClaim: registry_principal
    requiredScopes: ["licensing:apply"]
    permissions:
      records:
        - recordType: application
          operations: [create, get, list]
          readableFields: [reference, profession, status]
          writableFields: [reference, profession]
          rowBoundaries:
            - {field: reference, claim: application_reference, operator: equals}
      actions:
        - action: submit-application
          operations: [start]
          targets:
            - recordType: application
              rowBoundaries:
                - {field: reference, claim: application_reference, operator: equals}
      proposals:
        - action: submit-application
          operations: [get, list, submit]
          ownership: caller
          readableInputs: [application, status]
          targets:
            - recordType: application
              rowBoundaries:
                - {field: reference, claim: application_reference, operator: equals}
  - id: auditor
    principalClaim: registry_principal
    actorKind: human
    requesterClients: [licensing-auditor]
    requiredScopes: ["licensing:audit"]
    permissions:
      records:
        - recordType: application
          operations: [get]
          readableFields: [reference, profession, status]
          rowBoundaries:
            - {field: reference, claim: application_reference, operator: equals}
      proposals:
        - action: submit-application
          operations: [get-review-context]
          readableContextFields: [reference, profession]
          targets:
            - recordType: application
              rowBoundaries:
                - {field: reference, claim: application_reference, operator: equals}
  - id: review-status
    actorKind: service
    principalClaim: registry_principal
    requesterClients: [licensing-context]
    requiredScopes: ["licensing:review-status"]
    permissions:
      proposals:
        - action: submit-application
          operations: [get-review-status]
          reviewAuthority: casework
