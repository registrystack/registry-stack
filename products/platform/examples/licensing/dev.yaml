# yaml-language-server: $schema=https://id.registrystack.org/schemas/breg/project-dev/project-dev.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/breg/project-dev/v1alpha1
kind: BRegProjectDev
issuer: https://identity.licensing.example.test
products:
  - {product: breg, project: registry, audience: "urn:example:licensing:registry"}
  - {product: casework, project: casework, audience: "urn:example:licensing:review"}
  - {product: messaging, project: messaging, audience: "urn:example:licensing:messaging"}
bindings:
  bregReviewAuthority: {id: casework, producer: licensing-intake, identity: intake}
  caseworkContextProvider: {id: licensing, identity: context-status, action: submit-application}
people:
  applicant:
    subject: applicant
    client: applicant-portal
    grants:
      breg:
        profile: applicant
        scopes: ["licensing:apply"]
        claims: {application_reference: application-001, registry_actor_kind: human}
      casework:
        profile: applicant
        scopes: ["casework:history"]
        claims: {registry_actor_kind: human}
  applicant-other:
    subject: applicant-other
    client: applicant-portal
    grants:
      breg:
        profile: applicant
        scopes: ["licensing:apply"]
        claims: {application_reference: application-002, registry_actor_kind: human}
      casework:
        profile: applicant
        scopes: ["casework:history"]
        claims: {registry_actor_kind: human}
  intake:
    subject: intake
    client: licensing-intake
    grants:
      casework:
        profile: intake
        scopes: ["casework:intake"]
        claims: {registry_actor_kind: service}
  context-status:
    subject: context-status
    client: licensing-context
    grants:
      breg:
        profile: review-status
        scopes: ["licensing:review-status"]
        claims: {registry_actor_kind: service}
  notifier:
    subject: licensing-service
    client: licensing-service
    grants:
      messaging:
        profile: licensing-sender
        scopes: ["messaging:send"]
        claims: {registry_actor_kind: service}
  administrator:
    subject: administrator
    client: licensing-workbench
    grants:
      casework:
        profile: administrator
        scopes: ["casework:admin"]
        claims: {registry_actor_kind: human}
  reviewer:
    subject: reviewer
    client: licensing-auditor
    caseworkContext: true
    grants:
      breg:
        profile: auditor
        scopes: ["licensing:audit", "casework:review"]
        claims: {application_reference: application-001, registry_actor_kind: human}
      casework:
        profile: reviewer
        scopes: ["licensing:audit", "casework:review"]
        claims: {application_reference: application-001, registry_actor_kind: human}
workloads:
  registry-script:
    product: breg
    default: true
    subject: licensing-service
    client: licensing-service
    grant:
      profile: applicant
      scopes: ["licensing:apply"]
      claims: {application_reference: application-001, registry_actor_kind: service}
  messaging-service:
    product: messaging
    default: true
    subject: licensing-service
    client: licensing-service
    grant:
      profile: licensing-sender
      scopes: ["messaging:send"]
      claims: {registry_actor_kind: service}
developmentPickers:
  holder:
    people: [applicant, applicant-other]
    personProducts: [breg, casework]
    workloads: [registry-script, messaging-service]
  staff:
    people: [reviewer]
    personProducts: [breg, casework]
    workloads: [registry-script, messaging-service]
schemaTestPeople:
  submit-application:
    submit: applicant
    start-reviewed-submission: applicant
journey:
  id: licensing-approval
  steps:
    - id: create-application
      product: breg
      as: applicant
      method: POST
      path: /v1/records/applications
      headers: {Idempotency-Key: create-application}
      body: {data: {reference: application-001, profession: Surveyor}}
      expect: {status: 201}
      capture: {application: {type: pointer, pointer: /data/recordIdentifier}}
    - id: create-other-application
      product: breg
      as: applicant-other
      method: POST
      path: /v1/records/applications
      headers: {Idempotency-Key: create-other-application}
      body: {data: {reference: application-002, profession: Surveyor}}
      expect: {status: 201}
    - id: send-application-receipt
      product: messaging
      as: notifier
      method: POST
      path: /v1/messages
      headers: {Idempotency-Key: application-received}
      body:
        senderProfile: licensing-email
        to: {email: applicant@example.test}
        template: {id: application-received, version: "1"}
        locale: en
        data: {reference: application-001}
        correlationId: application-001
      expect: {status: 202, json: {/status: queued}}
      capture: {message: {type: pointer, pointer: /id}}
    - id: read-application-receipt
      product: messaging
      as: notifier
      method: POST
      path: /v1/messages/receipt
      headers: {Idempotency-Key: application-received}
      body:
        senderProfile: licensing-email
        to: {email: applicant@example.test}
        template: {id: application-received, version: "1"}
        locale: en
        data: {reference: application-001}
        correlationId: application-001
      expect: {status: 200, json: {/id: "{{message}}", /status: queued}}
    - id: staff-review-queue
      product: casework
      as: administrator
      method: POST
      path: /v1/directory/bootstrap
      headers: {If-Match: '"0"', Idempotency-Key: staff-review-queue}
      body:
        teamId: licensing-reviewers
        staff: [{issuer: https://identity.licensing.example.test, subject: reviewer}]
        supervisors: []
        queueId: applications
      expect: {status: 200}
    - id: start-reviewed-submission
      product: breg
      as: applicant
      method: POST
      path: /v1/actions/submit-application/proposals
      headers: {Idempotency-Key: start-reviewed-submission}
      body: {input: {application: "{{application}}", status: submitted}}
      expect: {status: 201}
      capture:
        proposal: {type: pointer, pointer: /id}
        draft-etag: {type: header, header: etag}
    - id: submit-reviewed-application
      product: breg
      as: applicant
      method: POST
      path: "/v1/proposals/{{proposal}}/submit"
      headers: {If-Match: "{{draft-etag}}", Idempotency-Key: submit-reviewed-application}
      body: {}
      expect: {status: 200, json: {/state: submitted}}
    - id: find-review-task
      product: casework
      as: reviewer
      method: GET
      path: /v1/review-tasks?queue=applications
      headers: {Registry-Source-Profile: auditor}
      expect: {status: 200}
      poll: {maximumWaitMilliseconds: 60000, pollIntervalMilliseconds: 500}
      capture:
        task: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /taskId}
        request: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /requestId}
        task-revision: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /revision}
    - id: claim-review
      product: casework
      as: reviewer
      method: POST
      path: "/v1/review-tasks/{{task}}/claim"
      headers: {If-Match: '"{{task-revision}}"', Idempotency-Key: claim-review, Registry-Source-Profile: auditor}
      expect: {status: 200}
      capture: {claim-revision: {type: pointer, pointer: /revision}}
    - id: approve-application
      product: casework
      as: reviewer
      method: POST
      path: "/v1/review-tasks/{{task}}/decisions"
      headers: {If-Match: '"{{claim-revision}}"', Idempotency-Key: approve-application, Registry-Source-Profile: auditor}
      body: {decision: {type: approve, outcome: approved}}
      expect: {status: 204}
    - id: read-approval
      product: casework
      as: intake
      method: GET
      path: "/v1/review-requests/{{request}}/result"
      expect:
        status: 200
        json:
          /subject/id: "{{proposal}}"
          /status: approved
          /outcome: approved
