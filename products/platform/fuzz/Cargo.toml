[package]
name = "registry-platform-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
libfuzzer-sys = "0.4"
registry-platform-authcommon = { path = "../../../crates/registry-platform-authcommon" }
registry-platform-crypto = { path = "../../../crates/registry-platform-crypto" }
registry-platform-oidc = { path = "../../../crates/registry-platform-oidc" }
registry-platform-sdjwt = { path = "../../../crates/registry-platform-sdjwt" }
registry-platform-sqlite = { path = "../../../crates/registry-platform-sqlite" }
registry-platform-yaml = { path = "../../../crates/registry-platform-yaml" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "authcommon_parsers"
path = "fuzz_targets/authcommon_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdjwt_holder_proof"
path = "fuzz_targets/sdjwt_holder_proof.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdjwt_issuance"
path = "fuzz_targets/sdjwt_issuance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sqlite_statement"
path = "fuzz_targets/sqlite_statement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_decode"
path = "fuzz_targets/yaml_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_reader"
path = "fuzz_targets/yaml_reader.rs"
test = false
doc = false
bench = false
