- rule: "CFG-ID-1"
  format: "casework/project"
  location: "products/casework/generated/project/project.schema.json#/$defs/ReviewContextContract/properties/id"
  class: "exchange-model"
  reason: "ReviewContextContract.id is the native producer's exact opaque identifier under the Casework v1alpha1 review-context exchange model. Valid producer URNs are not authored LocalId values; the owning reader bounds and validates text without reshaping the identity."
  resolution: "Permanent for the Casework v1alpha1 review-context contract. Current-source compiler, provider-agreement, and strict context tests verify exact producer identity and binding."

- rule: "CFG-ID-7"
  format: "casework/project"
  location: "products/casework/generated/project/project.schema.json#/$defs/ReviewContextPolicy"
  class: "exchange-model"
  reason: "The published Casework v1alpha1 review-context exchange model uses mode: submitted or current-source across authored policy, compiled closure, and inspection output. The shared positioned tagged-union reader enforces the closed alternatives; adding type would introduce a second wire spelling."
  resolution: "Permanent for the Casework v1alpha1 context-mode exchange model. Strict context and CLI schema-parity tests verify the accepted tags and unknown-member refusal."

