# Registry Stack configuration conventions exceptions register.
#
# Every deviation from a MUST rule in products/platform/CONFIG-CONVENTIONS.md
# that products/platform/scripts/check-config-conventions.py finds is recorded
# here with its rule, format (an id from config-formats.yaml), location (the
# lint's `file#pointer`, or `file#Type/field` for the source lint), class,
# reason, and resolution. The lint fails on an unrecorded deviation and on an
# entry that no longer deviates, so fixing a deviation means deleting its
# entry in the same change.
#
# Classes:
#
#   protocol-constant  a value another specification defines, written as it
#                      defines it; permanent
#   external-format    a grammar another project owns; permanent
#   exchange-model     member names a published data model fixes; permanent
#                      for that specification version
#   stable-move        a respelling of something a correct file in a promised
#                      format already writes; applied in the release that
#                      moves promised formats to stable
#   decision           waiting on a named, dated decision (the resolution
#                      names it, with its date)
#   pending            a deviation in work the configuration conventions
#                      program has not reached yet; `wp` names the work
#                      package that removes it. `--strict` refuses every
#                      pending entry.
#
# Whole formats in an external grammar or a published exchange model carry
# `exceptionClass` in config-formats.yaml instead of one entry per finding.
#
# CFG-CHANGE-5: the register only shrinks. On a pull request the lint compares
# it with the base, entry by entry (rule, format, location), and fails when an
# entry outside protocol-constant, external-format, and exchange-model is added
# or when an entry changes class. Deleting an entry is the only other change; a
# moved entry is a deletion and an addition. An explicit --base whose tree
# lacks this register fails.
#
# The entries were seeded from the lint's `--list --format json` output and
# classified by rule, format stability, and schema origin; edit them by hand.

