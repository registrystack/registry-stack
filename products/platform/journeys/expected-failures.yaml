    reason: "prepare and issuer pass (adapterctl check of the facade-recovery example with the breg-records profile). adapterctl provision --runtime-config R --admin-url-file A is refused as an unrecognized subcommand, so roles, the database and grants are made by hand."
  - journey: own-provider
    product: evidence
    step: issuer
    code: product.evidence.bundle.invalid-authentication
    finding: X1
    removedBy: M1
    basis: observed
    observedOn: "bin-4eb643d6 (runtime code equals origin/main cd83550e), journey run 20261127021546-ddef"
    reason: "evidencectl check refuses the local target (outer code evidence.target.publication-invalid): the local profile takes only a canonical 127.0.0.1 HTTP origin with a port, and a Keycloak issuer carries the /realms/<realm> path, so any such issuer needs allowInsecureHttp: true. The loopback transport class of M1 (A2) removes the URL-shape rule. Behind it the call is predicted to stop at token-type, because Keycloak sends typ JWT."
  - journey: own-provider
    product: render
    step: call
    code: product.render.unauthorized
    finding: G3
    removedBy: M7
    basis: observed
    observedOn: "bin-4eb643d6 (runtime code equals origin/main cd83550e), journey run 20261127021546-ddef"
    reason: "No database. Start, ready and the client-credentials token pass (RS256, audience urn:example:render, scope render:render, client portal). POST /v1/render/letter answers 401 with problem render.unauthorized. Render logs no authentication stage, so the code is the problem code. Inferred cause: the token type fixed at at+jwt (registry-render/src/auth.rs:71 on main) against Keycloak's typ JWT."

