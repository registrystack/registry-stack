    product: casework
    step: issuer
    code: product.casework.posture.unrestricted-clients
    removedBy: posture
    basis: observed
    observedOn: "2014c191ee, journey run 20261128101428-4465"
    reason: "prepare passes, and caseworkctl init writes runtime.example.yaml with allowedClients: unrestricted. Under the default production posture (7c2c6140a, updated to issuer entries in d4c61e994), caseworkctl check refuses unrestricted clients at /authentication/oidc/issuers/main/allowedClients unless development is declared."
