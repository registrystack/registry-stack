# The ratchet table of the acceptance journeys: where each journey stops for
# each product on `main`, and which change removes the stop.
#
# A cell is one journey and one product. Every cell of the journeys and products
# in this folder appears exactly once, as an expected failure or as unreached,
# or in `passes` once a cell passes. A cell fails at its first failing step with
# one code. In ratchet mode a journey exits 0 when every cell equals this table.
# A cell that fails differently, or no longer fails while still listed, fails
# the run. A change that fixes a cell deletes its row in the same commit and
# adds the cell to `passes`.
#
# basis: predicted    inferred from reading code. The first journey run on
#                     `main` replaces it with the code the run observed and sets
#                     basis: observed.
# basis: observed     seen in a journey run against the tree named in `observedOn`.
#
# A harness failure (a container that did not start, an occupied name, a
# timeout) is never a row here.
#
# Code forms:
#   journey.needs.<thing>    the only way past the step is one of the things the
#                            journeys forbid a reader to do
#   journey.promote.<thing>  a promote step with no input or nothing to refuse
#   journey.keep.<thing>     the keep step lost the written record
#   journey.attach.<thing>   the attach step refused the reader's own setup
#   http.<status>.<stage>    a refused call: the HTTP status and the stage word
#                            mapped from the operator log's failed_check
#   product.<dotted code>    the diagnostic code a product prints for a refused
#                            check or start

schema: registry.journey-expected-failures/v1

journeys:
  own-provider:
    steps: [prepare, issuer, database.provision, database.connect, start, ready, token, call, hook, stop]
  rstack-dev:
    steps: [init, plan, start, issuer, token, call, hook, keep, attach, stop]
  promote:
    steps: [input, start-as-production, refusals, fix, start, call, same-contract]

# Words the code forms above accept. The journeys' own list is closed so a typo
# cannot pass as a new failure.
journeyCodeSuffixes:
  needs: [certificate, claim-mapper, hand-written-sql, image-build, signature-verifier, hand-written-plan]
  promote: [no-input, nothing-refused]
  keep: [state-lost]
  attach: [issuer-refused]
authenticationStages: [header, algorithm, token-type, key, signature, issuer, audience, time, client, scope, profile, unavailable]

# Changes that can remove a row.
changes: [posture, rstack-dev-products, caller-contract]

expectedFailures:
  - journey: own-provider
    product: breg
    step: database.provision
    code: product.breg.runtime.package-root-unavailable
    removedBy: rstack-dev-products
    basis: observed
    observedOn: "2014c191ee, journey run 20261128101428-4465"
    reason: "prepare and issuer pass (bregctl check accepts the loopback Keycloak issuer with RS256 and JWT access tokens). bregctl provision now exists (c722c8f35) and loads the runtime file with load_runtime_config, which requires package.root to be an existing readable directory (breg.runtime.package-root-unavailable) even though provision reads nothing from it; own-provider points package.root at work/breg/package without creating it because bregctl package needs a bregctl test receipt."
