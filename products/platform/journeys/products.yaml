    tier: primary
    binary: breg
    crate: registry-breg
    ctl: registry-bregctl
    cargoPackages: [registry-breg, registry-bregctl]
    cargoFeatures: [registry-breg/runtime]
    usesPostgres: true
    verifiesTokens: true
    rstackDevPlan: true
