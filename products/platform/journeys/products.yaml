# The product column of the acceptance journeys: every runtime binary that loads
# a runtime file on `main`, one row each. The list matches the sixteen runtime
# formats in products/platform/config-formats.yaml.
#
# tier: primary    the journeys start it and walk it to a first call.
# tier: supporting it runs beside a parent product and shares that product's
#                  setup, so each journey records it as unreached until its
#                  parent's cell passes.
#
# ctl names the crate of the matching tool. It is null where the tool is a
# binary of the runtime's own crate (coordinatorctl) or where none exists.
#
# usesPostgres, verifiesTokens and rstackDevPlan describe `main`. A change
# that changes one edits the row in the same commit.

schema: registry.journey-products/v1

# The identity provider the own-provider journey starts. The image reference is
# the one products/breg/scripts/test-issuer-portability.py pins, and the static
# check fails when the two differ.
ownProviderIssuer:
  name: keycloak
  image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54

products:
