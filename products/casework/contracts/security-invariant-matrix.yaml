apiVersion: registry.registrystack.org/product-contract/v1
product: casework
scope: first-full-mvp
evidenceStatus: source-mapped-not-executed
evidenceNote: Test references identify maintained proof obligations. This file does not assert that any test ran or passed in a particular review.
deferredInvariants:
  - {number: 12, targetWave: post-mvp, reason: Automatic outcomes require a separately justified pilot need.}
invariants:
  - {id: CASEWORK-SEC-01, invariants: [1, 14], state: enforced, targetWave: checkpoint, threat: A service credential or locally assigned role acts through another Casework profile., enforcementPoint: trusted issuer human assertion plus an independently selectable Casework profile and current directory membership, refusal: Require the configured human identity value for Staff Supervisor and Administrator; keep Requester exempt from that assertion without granting its service profile any human-role authority; require every profile to have a scope absent from the union of every other same-role or lower-role profile; never union profiles or membership., negativeId: CASEWORK-NEG-01, negativeTest: {path: crates/registry-casework/tests/human_identity_auth.rs, name: same_role_profiles_with_distinct_principals_require_distinct_scopes}}
  - {id: CASEWORK-SEC-02, invariants: [3], state: enforced, targetWave: checkpoint, threat: Administrator membership or one profile silently grants BReg review or application authority., enforcementPoint: distinct selected Casework and source profiles with source-side action discovery under the human token, refusal: Refuse when either selected profile lacks its own authority and never infer BReg authority from Casework role., negativeId: CASEWORK-NEG-02, negativeTest: {path: crates/registry-casework/tests/service_visibility.rs, name: http_authentication_and_directory_authority_are_enforced}}
  - {id: CASEWORK-SEC-03, invariants: [9, 17], state: enforced, targetWave: checkpoint, threat: Reader content source-context review history or source-context review clocks are disclosed or a source-context review note is added without current source visibility; alternatively a retained reference candidate is disclosed without current source visibility., enforcementPoint: caller-scoped source read on every item on each source-context review history or clock request and before each source-context review note mutation plus bounded holdings or reference-filtered inbox pagination, refusal: Conceal an item or refuse review history clock disclosure and note mutation the current caller cannot read; release a reference only when the caller projection currently contains the matching value; and distinguish source outage or an incomplete page from an empty result., negativeId: CASEWORK-NEG-03, negativeTest: {path: crates/registry-casework-breg/tests/source_boundary.rs, name: current_caller_disclosure_controls_the_display_reference}}
  - {id: CASEWORK-SEC-04, invariants: [5, 9, 17], state: enforced, targetWave: checkpoint, threat: One actor reads or mutates another actor's private draft or applies it to a changed proposal., enforcementPoint: draft author key and exact source binding, refusal: Return absence for another or missing draft and retain the private draft when the proposal binding changes., negativeId: CASEWORK-NEG-04, negativeTest: {path: crates/registry-casework/tests/service_visibility.rs, name: service_visibility_boundaries}}
  - {id: CASEWORK-SEC-05, invariants: [18], state: enforced, targetWave: checkpoint, threat: Competing or stale claim mutations both succeed., enforcementPoint: PostgreSQL revision fence and current membership checks in one transaction, refusal: Commit one winner and reject stale or no-longer-authorized mutations without partial history., negativeId: CASEWORK-NEG-05, negativeTest: {path: crates/registry-casework/tests/postgres_transactions.rs, name: transactional_checkpoint_invariants_hold_in_postgresql}}
  - {id: CASEWORK-SEC-06, invariants: [3, 4, 5], state: enforced, targetWave: checkpoint, threat: A cached source action or service reader token is promoted into human mutation authority., enforcementPoint: exact source binding at caller-visible item assembly and fresh action discovery under the acting person's token, refusal: Refuse moved bindings before coordination and source mutation; preserve caller-owned live attempt recovery and exact completed-receipt replay without actions; refuse source actions not currently offered., negativeId: CASEWORK-NEG-06, negativeTest: {path: crates/registry-casework-breg/tests/source_boundary.rs, name: stale_source_generation_is_refused_before_any_read_or_write}}
  - {id: CASEWORK-SEC-07, invariants: [6, 14, 17], state: enforced, targetWave: checkpoint, threat: A lost response causes a second decision or lets another actor recover the original attempt., enforcementPoint: durable attempt reservation and actor-bound exact-attempt recovery, refusal: Return recovery-pending with only the entitled original attempt reference and never repeat source execution under a new attempt., negativeId: CASEWORK-NEG-07, negativeTest: {path: crates/registry-casework/tests/service_visibility.rs, name: recovery_problem_discloses_only_the_entitled_original_attempt}}
  - {id: CASEWORK-SEC-08, invariants: [7, 8], state: enforced, targetWave: checkpoint, threat: A webhook event grants authority or supplies caller-visible content., enforcementPoint: bounded signature verification and readback from the authoritative source, refusal: Reject invalid events and treat accepted payloads only as synchronization hints., negativeId: CASEWORK-NEG-08, negativeTest: {path: crates/registry-casework/tests/service_visibility.rs, name: source_event_diagnostics_are_bounded_and_payload_free}}
  - {id: CASEWORK-SEC-09, invariants: [10], state: enforced, targetWave: checkpoint, threat: Approval implicitly applies a request., enforcementPoint: closed operation state machine and separately discovered application action, refusal: Complete review without applying and require a later human application action., negativeId: CASEWORK-NEG-09, negativeTest: {path: crates/registry-casework-breg/tests/source_boundary.rs, name: external_review_projection_controls_only_source_application_state}}
  - {id: CASEWORK-SEC-10, invariants: [13, 15, 16], state: enforced, targetWave: checkpoint, threat: Source-specific protocol types enter the source-neutral core or generic client or Casework becomes a dependency of BReg., enforcementPoint: Cargo metadata dependency-direction guard, refusal: Fail the product contract check on a direct or transitive forbidden dependency., negativeId: CASEWORK-NEG-10, negativeTest: {path: products/casework/scripts/test_dependency_direction.py, name: test_transitive_breg_dependency_from_generic_client_is_rejected}}
  - {id: CASEWORK-SEC-11, invariants: [3, 5, 10, 18], state: enforced, targetWave: checkpoint, threat: A store path applies a lifecycle state change that the source-neutral occurrence rules refuse., enforcementPoint: exhaustive pure transition table evaluated before local state mutation, refusal: Refuse invalid state and event pairs including every transition out of a terminal occurrence., negativeId: CASEWORK-NEG-11, negativeTest: {path: crates/registry-casework-core/src/transition.rs, name: terminal_occurrences_cannot_be_reopened}}
  - {id: CASEWORK-SEC-12, invariants: [6, 14, 17], state: enforced, targetWave: checkpoint, threat: A live source attempt is forgotten after a fresh session or disclosed across actor or profile boundaries., enforcementPoint: caller and both-profile-bound live attempt projection after current source visibility succeeds, refusal: Omit another caller's attempt and conceal the entire item when current source visibility is refused., negativeId: CASEWORK-NEG-12, negativeTest: {path: crates/registry-casework/tests/service_visibility.rs, name: caller_owned_live_attempt_survives_a_fresh_session_without_cross_actor_disclosure}}
  - {id: CASEWORK-SEC-13, invariants: [14, 17], state: enforced, targetWave: checkpoint, threat: Casework credentials or refusal details cross a public plaintext browser edge cache or unbounded framework response., enforcementPoint: explicit private listener and TLS-termination mode plus one HTTP response boundary for problem JSON tracing cache and security headers, refusal: Reject public listeners and normalize route method extraction media-type body-size authentication and outage failures without enabling CORS., negativeId: CASEWORK-NEG-13, negativeTest: {path: crates/registry-casework/src/http.rs, name: http_edge_returns_closed_problems_with_request_trace_and_security_headers}}
  - {id: CASEWORK-SEC-14, invariants: [2, 3, 17, 18], state: enforced, targetWave: mvp, threat: Absence cover crosses an unsupervised team impersonates the absent person or a stale assignment grants decision authority., enforcementPoint: transactional supervisor-team intersection plus explicit assignment context with current serving-team membership and unchanged caller source authority, refusal: Refuse a cover available only through an unsupervised shared team; keep an ineligible cover unassigned and recheck current queue control on assignment and replay., negativeId: CASEWORK-NEG-14, negativeTest: {path: crates/registry-casework/tests/assignment_postgres.rs, name: supervisor_cannot_record_cover_from_an_unsupervised_shared_team}}
  - {id: CASEWORK-SEC-15, invariants: [11, 18], state: enforced, targetWave: mvp, threat: A stale timer or recompute fires an effect for completed work repeats an effect after restart or lets one review kind consume another kind's subject budget., enforcementPoint: pinned clock calculation and generation with review-kind-bound subject occurrence identity plus transactional source revision and occurrence fences, refusal: Keep concurrent review kinds on separate subject occurrences while continuing one kind across its versions; cancel terminal or superseded clocks and reject stale claims or recompute previews before recording reminders or local reassignment., negativeId: CASEWORK-NEG-15, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: subject_clocks_are_independent_across_concurrent_review_kinds}}
  - {id: CASEWORK-SEC-16, invariants: [1, 3, 17, 18], state: enforced, targetWave: mvp, threat: A producer or former team member records an outcome or replays a protected response; cancellation and a final decision both settle one request; one selected profile crosses into another profile's authority; or a non-exact receiver response marks completion delivered., enforcementPoint: pinned unified review policy with exact producer admission; one request-row transaction fence for terminal settlement; exact-role membership and selected-profile checks against the addressed pinned stage before mutation replay disclosure; and an empty 204 completion acknowledgement., refusal: Commit one cancellation-or-decision winner with one result and terminal event; require the selected Supervisor role and supervisor membership for assignment; require a pinned deciding profile with its matching membership for reviewer mutations and cached response replay; and retry any completion response other than an empty 204 under the bounded attempt policy., negativeId: CASEWORK-NEG-16, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: cancellation_and_final_decision_commit_exactly_one_terminal_result}}
  - {id: CASEWORK-SEC-17, invariants: [6, 9, 17, 18], state: enforced, targetWave: mvp, threat: Retained payloads or cached replay responses disclose erased source or review data or allow rediscovery to restore it., enforcementPoint: explicit source erasure and unified review retention with transactional tombstones and bounded cursor cleanup, refusal: Preserve live recovery before erasure and refuse expired replay without returning retained payloads or rehydrating erased source items., negativeId: CASEWORK-NEG-17, negativeTest: {path: crates/registry-casework/tests/source_retention_postgres.rs, name: source_erasure_scrubs_payloads_fences_rehydration_and_preserves_expired_replay}}
  - {id: CASEWORK-SEC-18, invariants: [1, 3, 14, 17, 18], state: enforced, targetWave: contextual-authorization, threat: A local bootstrap credential manufactures task bounds or reads the source as a human, an approved task loses accountable approver attribution, or restart extends approved authority., enforcementPoint: explicit single-issuer resource group with separate source profiles plus real source-derived Casework approval, closed Evidence, BREG, or Scheduling bounds, a keyed pseudonymous approver claim, standard token exchange, and a process-boundary proof that the exact exchanged Scheduling bearer passes Scheduling's real authenticator, refusal: Refuse bootstrap and status clients at the source human profile, malformed product bounds at template activation, and revoked grants before a new BREG write while retaining the original grant deadline across restart., negativeId: CASEWORK-NEG-18, negativeTest: {path: crates/registry-casework/src/task_grants/local_session_tests.rs, name: source_backed_dev_approves_exchanges_and_revokes_on_stock_issuer}}
  - {id: CASEWORK-SEC-19, invariants: [1, 9, 17, 18], state: enforced, targetWave: mvp, threat: A producer narrows a field the review kind never declared or a decision carries a result outside the pinned schema or request constraints., enforcementPoint: unified review create and decide validation against the pinned kind result schema and stored constraints with bounded instance paths, refusal: Accept a result only inside the pinned schema and constraints and bind changed constraints to a conflicting submission digest., negativeId: CASEWORK-NEG-19, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: prior_stage_identity_and_invalid_structured_result_emit_nothing}}
  - {id: CASEWORK-SEC-20, invariants: [9, 17], state: enforced, targetWave: mvp, threat: Any review result or private draft or history event or replay payload or constraint or clock occurrence bound to the round outlives terminal retention or survives as content inside accountability., enforcementPoint: bounded lock-skipping unified review retention erases private work and non-accountability payloads at terminalDays while retaining only minimized accountability through accountabilityDays anchored to terminal settlement, refusal: Scrub private content and replay responses at terminalDays then delete review-owned tombstones and minimized accountability at accountabilityDays., negativeId: CASEWORK-NEG-20, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: terminal_retention_scrubs_private_work_and_expires_owned_idempotency}}
  - {id: CASEWORK-SEC-21, invariants: [6, 17, 18], state: enforced, targetWave: mvp, threat: Raw reviewer identity or a private decision reason is released after accountability expiry or without a durable record of the disclosure., enforcementPoint: the audit writer accepts the accountability-read request entry before one PostgreSQL transaction checks live retention and current Supervisor queue authority and then accepts the response entry before protected fields are returned, refusal: Return absence for expired or unauthorized accountability and return service.unavailable without protected fields when the audit writer refuses either entry., negativeId: CASEWORK-NEG-21, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: accountability_read_requires_live_retention_and_a_committed_audit}}
