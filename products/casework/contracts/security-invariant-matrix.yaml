apiVersion: registry.registrystack.org/product-contract/v1
product: casework
scope: review-only-beta
evidenceStatus: source-mapped-not-executed
evidenceNote: Test references name maintained proof obligations and do not claim a particular execution.
invariants:
  - {id: CASEWORK-SEC-01, invariants: [1, 14], state: enforced, targetWave: beta, threat: "A service or delegated token selects a human profile or combines unrelated profiles.", enforcementPoint: "Trusted human assertion and independent selected profile scopes with live Directory membership.", refusal: "Refuse missing human assertions and cross-profile scope unions.", negativeId: CASEWORK-NEG-01, negativeTest: {path: crates/registry-casework/tests/human_identity_auth.rs, name: same_role_profiles_with_distinct_principals_require_distinct_scopes}}
