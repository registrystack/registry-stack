apiVersion: registry.registrystack.org/product-contract/v1
product: casework
scope: review-only-beta
evidenceStatus: source-mapped-not-executed
evidenceNote: Test references name maintained proof obligations and do not claim a particular execution.
invariants:
  - {id: CASEWORK-SEC-01, invariants: [1, 14], state: enforced, targetWave: beta, threat: "A service or delegated token selects a human profile or combines unrelated profiles.", enforcementPoint: "Trusted human assertion and independent selected profile scopes with live Directory membership.", refusal: "Refuse missing human assertions and cross-profile scope unions.", negativeId: CASEWORK-NEG-01, negativeTest: {path: crates/registry-casework/tests/human_identity_auth.rs, name: same_role_profiles_on_one_principal_claim_are_selected_by_their_own_scope}}
  - {id: CASEWORK-SEC-02, invariants: [3], state: enforced, targetWave: beta, threat: "A producer records human decisions or a review answer becomes external mutation authority.", enforcementPoint: "Separate producer admission, reviewer eligibility and source-owned application.", refusal: "Refuse human task operations under a producer identity and submission under reviewer authority.", negativeId: CASEWORK-NEG-02, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: exact_policy_admission_and_independent_producer_authority}}
  - {id: CASEWORK-SEC-03, invariants: [9, 17], state: enforced, targetWave: beta, threat: "Reference selection or sorting reveals a caller-concealed current-source subject.", enforcementPoint: "Fresh exact human display read before matching, ordering, counts or released metadata.", refusal: "Conceal hidden candidates and refuse changed live continuation.", negativeId: CASEWORK-NEG-03, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: reference_selection_conceals_before_sort_and_rejects_stale_continuation}}
  - {id: CASEWORK-SEC-04, invariants: [5, 9, 17], state: enforced, targetWave: beta, threat: "Another person reads a private decision draft or a changed binding reuses it.", enforcementPoint: "Private author keys, pinned subject and policy closure, current reviewer/source authority.", refusal: "Return absence for another draft and refuse mutation outside current authority.", negativeId: CASEWORK-NEG-04, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: review_task_coordination_preserves_exclusions_drafts_history_and_absence_cover}}
  - {id: CASEWORK-SEC-05, invariants: [18], state: enforced, targetWave: beta, threat: "A stale caseload preview moves changed tasks or moves only a subset.", enforcementPoint: "Exact task revisions, Directory revision for a pending apply and one locked apply transaction.", refusal: "Refuse the entire move set without partial movement.", negativeId: CASEWORK-NEG-05, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: caseload_preview_apply_is_atomic_revision_fenced_and_recoverable}}
  - {id: CASEWORK-SEC-06, invariants: [3, 4, 5], state: enforced, targetWave: beta, threat: "A service projection widens or replaces human disclosure.", enforcementPoint: "Separate human display, status and purpose-bound minimized service projections.", refusal: "Forward only the exact caller bearer/profile; status carries no fields.", negativeId: CASEWORK-NEG-06, negativeTest: {path: crates/registry-casework-breg/tests/context_provider.rs, name: human_display_uses_exact_caller_bearer_and_status_discloses_no_values}}
  - {id: CASEWORK-SEC-07, invariants: [6, 14, 17], state: enforced, targetWave: beta, threat: "Lost responses create another request or disclose recovery to another producer.", enforcementPoint: "Producer-bound original policy selector and exact submission digest; policy selection and concrete acceptance committed under the subject lock.", refusal: "Recover only the original exact request under current producer authority.", negativeId: CASEWORK-NEG-07, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: current_policy_selection_recovers_before_updates_and_requires_live_authority}}
  - {id: CASEWORK-SEC-08, invariants: [7, 8], state: enforced, targetWave: beta, threat: "A completion signal independently conveys a result or destination authority.", enforcementPoint: "Closed completion envelope without decision payload, stable at-least-once delivery identity, and authenticated result fetch/feed.", refusal: "Reject result and destination members in the notification envelope.", negativeId: CASEWORK-NEG-08, negativeTest: {path: crates/registry-review-protocol/src/lib.rs, name: completion_envelope_contains_no_result_or_destination}}
  - {id: CASEWORK-SEC-09, invariants: [10], state: enforced, targetWave: beta, threat: "An optional source dependency becomes necessary for independent review.", enforcementPoint: "Submitted context uses the same review lifecycle without any provider.", refusal: "Keep submitted work usable when a source provider fails.", negativeId: CASEWORK-NEG-09, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: provider_failure_refuses_affected_work_while_submitted_review_remains_usable}}
  - {id: CASEWORK-SEC-10, invariants: [13, 15, 16], state: enforced, targetWave: beta, threat: "Source product types enter the neutral protocol/core/client or reverse dependency.", enforcementPoint: "Resolved Cargo dependency-direction checks.", refusal: "Fail direct or transitive forbidden product dependencies.", negativeId: CASEWORK-NEG-10, negativeTest: {path: products/casework/scripts/test_dependency_direction.py, name: test_transitive_breg_dependency_from_generic_client_is_rejected}}
  - {id: CASEWORK-SEC-11, invariants: [3, 5, 10, 18], state: enforced, targetWave: beta, threat: "Cancellation and a final decision both settle or revive terminal work.", enforcementPoint: "One request-row fence stores result, receipt and terminal feed event atomically.", refusal: "Commit exactly one terminal winner.", negativeId: CASEWORK-NEG-11, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: cancellation_and_final_decision_commit_exactly_one_terminal_result}}
  - {id: CASEWORK-SEC-12, invariants: [6, 14, 17], state: enforced, targetWave: beta, threat: "A retained reviewer receipt is disclosed to another reviewer.", enforcementPoint: "Exact retained author, selected profile, live queue/source authorization and retention.", refusal: "Return only the callers retained pinned decision receipt.", negativeId: CASEWORK-NEG-12, negativeTest: {path: crates/registry-casework/tests/review_http.rs, name: decision_receipts_disclose_only_the_callers_retained_pinned_outcome_over_http}}
  - {id: CASEWORK-SEC-13, invariants: [14, 17], state: enforced, targetWave: beta, threat: "Credentials or refusal details escape through an unbounded HTTP response.", enforcementPoint: "Private listener policy and one bounded problem/trace/cache/security boundary.", refusal: "Normalize extraction/media/body/auth failures without CORS or private values.", negativeId: CASEWORK-NEG-13, negativeTest: {path: crates/registry-casework/src/http.rs, name: http_edge_returns_closed_problems_with_request_trace_and_security_headers}}
  - {id: CASEWORK-SEC-14, invariants: [2, 3, 17, 18], state: enforced, targetWave: beta, threat: "A caseload administrator loses current team or source authority after preview.", enforcementPoint: "Independent live Directory and source checks at apply plus exact move fencing.", refusal: "Refuse newly concealed or unauthorized movement without any partial effect.", negativeId: CASEWORK-NEG-14, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: source_visibility_and_directory_authority_are_both_live_at_caseload_apply}}
  - {id: CASEWORK-SEC-15, invariants: [11, 18], state: enforced, targetWave: beta, threat: "Clock recompute upgrades policy or accepts newly published inputs after preview.", enforcementPoint: "Pinned closure, original anchor, explicit holiday revision and task/occurrence fences.", refusal: "Require a new preview when holiday inputs change and preserve pinned policy.", negativeId: CASEWORK-NEG-15, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: clock_recompute_uses_pinned_calendar_and_fences_changed_holiday_inputs}}
  - {id: CASEWORK-SEC-16, invariants: [1, 3, 17, 18], state: enforced, targetWave: beta, threat: "One reviewer satisfies independent stage decisions or invalid results settle a request.", enforcementPoint: "Pinned stage thresholds and negative-decision mode, issuer-qualified reviewer exclusions, one principal claim for every human access profile and schema validation.", refusal: "Refuse duplicate or prior-stage identity and invalid structured result without emitting work.", negativeId: CASEWORK-NEG-16, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: prior_stage_identity_and_invalid_structured_result_emit_nothing}}
  - {id: CASEWORK-SEC-17, invariants: [9, 17], state: enforced, targetWave: beta, threat: "A retention job leaves private context, decisions or recovery payloads indefinitely.", enforcementPoint: "Bounded review retention and exact request-owned erasure.", refusal: "Scrub private work and expire owned idempotency without changing terminal meaning.", negativeId: CASEWORK-NEG-17, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: terminal_retention_scrubs_private_work_and_expires_owned_idempotency}}
  - {id: CASEWORK-SEC-18, invariants: [3, 5, 18], state: enforced, targetWave: beta, threat: "A task grant survives responsibility changes or is revived after reassignment.", enforcementPoint: "Current holder/profile/Directory/template/subject checks and durable assignment generation.", refusal: "Invalidate authority monotonically while draft-only edits preserve deferred responsibility.", negativeId: CASEWORK-NEG-18, negativeTest: {path: crates/registry-casework/src/task_grants/http_tests.rs, name: deferred_review_grants_ignore_drafts_but_never_revive_after_responsibility_changes}}
  - {id: CASEWORK-SEC-19, invariants: [4, 5, 9, 17], state: enforced, targetWave: beta, threat: "A provider returns unrequested routing fields or silently reroutes existing tasks.", enforcementPoint: "Exact request/task/policy/contract purpose binding and compiled field set at task creation.", refusal: "Reject extra fields and retain only the derived queue.", negativeId: CASEWORK-NEG-19, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: current_source_routing_is_purpose_bound_once_and_never_persists_fields}}
  - {id: CASEWORK-SEC-20, invariants: [9, 17], state: enforced, targetWave: beta, threat: "A hidden live reference query is reported complete without bounded evaluation.", enforcementPoint: "Configured candidate, source-read and time budgets with exact opaque subject narrowing.", refusal: "Refuse broad queries and require a narrower complete query.", negativeId: CASEWORK-NEG-20, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: live_read_budget_requires_narrowing_and_exact_subject_narrows_before_scan}}
  - {id: CASEWORK-SEC-21, invariants: [9, 17], state: enforced, targetWave: beta, threat: "Accountability escapes retention or is released before its audit is accepted.", enforcementPoint: "Live authorization/retention checks and committed audit release gate.", refusal: "Refuse unavailable audit and expired accountability.", negativeId: CASEWORK-NEG-21, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: accountability_read_requires_live_retention_and_a_committed_audit}}
  - {id: CASEWORK-SEC-22, invariants: [9, 17, 18], state: enforced, targetWave: beta, threat: "A lost-response decision replay bypasses the audit release gate.", enforcementPoint: "Durable exact replay under current authority followed by acknowledged audit response.", refusal: "Withhold the replay while its response audit cannot be accepted.", negativeId: CASEWORK-NEG-22, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: a_retained_decision_replay_is_withheld_until_its_response_entry_is_accepted}}
  - {id: CASEWORK-SEC-23, invariants: [3, 14, 18], state: enforced, targetWave: beta, threat: "A runtime role gains activation-ledger authority through grants, ownership or triggers.", enforcementPoint: "Measured split-role privileges at apply/startup and read-only runtime ledgers.", refusal: "Refuse weakened role boundaries and require explicit apply recovery.", negativeId: CASEWORK-NEG-23, negativeTest: {path: crates/registry-casework/tests/review_migration_postgres.rs, name: a_runtime_role_that_gained_ledger_authority_is_refused_at_startup_until_apply_records_it}}
  - {id: CASEWORK-SEC-24, invariants: [14, 18], state: enforced, targetWave: beta, threat: "Activation changes durable state after an audit request is refused.", enforcementPoint: "Audit request admission before the activation transaction and acknowledged response after commit.", refusal: "Leave the database untouched on request refusal and report committed-but-unaudited separately.", negativeId: CASEWORK-NEG-24, negativeTest: {path: crates/registry-casework/tests/review_migration_postgres.rs, name: a_refused_audit_request_leaves_the_database_untouched}}
  - {id: CASEWORK-SEC-25, invariants: [3, 18], state: enforced, targetWave: beta, threat: "Activation or migration orphans open reviews or alters a retired database.", enforcementPoint: "Exact bound producer identity and pre-ledger retired-schema refusal.", refusal: "Preserve old data and drain/cancel pinned work before incompatible activation.", negativeId: CASEWORK-NEG-25, negativeTest: {path: crates/registry-casework/tests/review_migration_postgres.rs, name: retired_schema_refusal_preserves_data_before_any_ledger_write}}
  - {id: CASEWORK-SEC-26, invariants: [3, 4], state: enforced, targetWave: beta, threat: "Changed producer export bytes retain an old contract pin.", enforcementPoint: "Exact local schema bytes, producer contract identity/revision and authenticated live observations.", refusal: "Reject schema drift before compilation and refuse changed producer observations.", negativeId: CASEWORK-NEG-26, negativeTest: {path: crates/registry-casework-core/tests/policy_compiler.rs, name: local_schema_checks_exact_export_bytes_and_drift_before_compilation}}
  - {id: CASEWORK-SEC-27, invariants: [3, 5, 18], state: enforced, targetWave: beta, threat: "Deferred Evidence authorization becomes an unrevocable long-lived credential.", enforcementPoint: "Explicit mode ceiling, short assertion TTL and signer refusal of deferred Evidence bounds.", refusal: "Refuse deferred Evidence assertions even for stored grants.", negativeId: CASEWORK-NEG-27, negativeTest: {path: crates/registry-casework/src/task_grants.rs, name: task_assertion_refuses_a_deferred_evidence_grant}}
  - {id: CASEWORK-SEC-28, invariants: [14, 17, 18], state: enforced, targetWave: beta, threat: "Request creation, absence changes or background retention bypass an unavailable audit destination.", enforcementPoint: "Existing audit admission before writes and acknowledged minimized response after commit.", refusal: "Refuse stopped writers and withhold success after response failure without duplicating committed effects.", negativeId: CASEWORK-NEG-28, negativeTest: {path: crates/registry-casework/tests/support/creation_audit_regressions.rs, name: producer_supersession_cannot_bypass_an_unavailable_audit_writer}}
  - {id: CASEWORK-SEC-29, invariants: [3, 18], state: enforced, targetWave: beta, threat: "Activation changes the authority needed by an accepted review or pins unrelated optional capabilities.", enforcementPoint: "Pinned semantic access profiles and only policy-reachable provider dependencies.", refusal: "Refuse authority changes while allowing unrelated drained capabilities to be removed.", negativeId: CASEWORK-NEG-29, negativeTest: {path: crates/registry-casework/tests/support/authority_closure_regressions.rs, name: assignment_roles_stay_pinned_and_activation_refuses_changed_deciding_authority}}
  - {id: CASEWORK-SEC-30, invariants: [2, 17, 18], state: enforced, targetWave: beta, threat: "A supervisor appoints absence cover through a shared team they do not supervise.", enforcementPoint: "Current Directory supervision over a team shared by the absent person and cover before creating the absence.", refusal: "Refuse cover outside the supervisor's current team authority.", negativeId: CASEWORK-NEG-30, negativeTest: {path: crates/registry-casework/tests/review_directory_postgres.rs, name: supervisor_cannot_record_cover_from_an_unsupervised_shared_team}}
  - {id: CASEWORK-SEC-31, invariants: [9, 17], state: enforced, targetWave: beta, threat: "A reviewer's private reason or an advisory finding reaches the producer or audit journal, or a decision uses an outcome outside its stage or one another approver in its stage did not choose.", enforcementPoint: "The frozen policy catalogue, current stage's outcome subset, per-outcome publicReason rule and stage outcome agreement are checked in the decision transaction; result built only from the settling decision; audit allow-list carries publicReasonGiven.", refusal: "Refuse undeclared or unavailable outcomes, an approval naming another outcome than its stage already chose, and missing, undeclared or oversized public reasons; never copy a private reason or advisory payload into the producer result or audit.", negativeId: CASEWORK-NEG-31, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: advisory_rejection_advances_to_final_approval_without_releasing_its_reason}}
  - {id: CASEWORK-SEC-32, invariants: [5, 9, 17], state: enforced, targetWave: beta, threat: "A retained terminal Casework read leaks source context after the source conceals it, or loses the Casework-owned decision with that context; or, once the source stops calling the subject reviewable, it releases still-disclosed context to anyone other than the author of that task's decision on a request that has left review.", enforcementPoint: "Separate live source context disclosure from retained terminal task and history authorization. For a still-disclosed but non-reviewable subject, release context only once the request has left review, only to the recorded author of that task's decision, with authorship and current Casework membership, profile and retention checked before the provider read and re-checked after it; the source decides disclosure for the caller's own token and source profile in that read.", refusal: "Release only Casework-owned retained records under current Casework authority; keep concealed source context not found; keep non-reviewable context not found for other reviewers, for the authors of other tasks and for any author while the request is still reviewing; refuse expired or erased results as expired.", negativeId: CASEWORK-NEG-32, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: decided_current_source_context_is_retained_only_for_its_author}}
  - {id: CASEWORK-SEC-33, invariants: [4, 5, 9, 17], state: enforced, targetWave: beta, threat: "Task-grant evaluation borrows another source profile or accepts substituted request identity or unrequested source fields.", enforcementPoint: "Separately selected BReg task-context service profile, exact request echo and policy/subject/context binding, field-limited schema and current source disclosure.", refusal: "Refuse missing task profile, status or human-context fallback, malformed requests, mismatched responses and unrequested fields before deriving task authority; RoutingContext remains unsupported.", negativeId: CASEWORK-NEG-33, negativeTest: {path: crates/registry-casework-breg/tests/context_provider.rs, name: task_context_uses_only_its_distinct_profile_and_echoes_the_exact_request}}
  - {id: CASEWORK-SEC-34, invariants: [1, 3, 5, 9, 14, 17, 18], state: enforced, targetWave: beta, threat: "A gateway delegation impersonates a human, reads another person's assignment, reuses a cursor across reader policies, reaches a Casework mutation, promises current-source work without an exchange, leaks internal policy machinery, or leaks downstream failure values.", enforcementPoint: "Named delegated reader policy with exact client, actor subject, assertion issuer, audience, human assertion, required scope subset and lifetime; optional actor issuer must match the verified token issuer and nested actors are refused; delegated cursors are partitioned by reader policy; startup cross-check of policy-reachable current-source providers; dedicated read-only routes; one configured downstream request; one bulk post-source list recheck and before/after context holder and revision checks; model-visible context omits the internal policy closure while retaining the policy binding and review context; distinct OAuth clients separate unattended status authority from subject delegation; static gateway failure classes with a validated trace identifier; terminal minimized audit.", refusal: "Keep ordinary human authentication closed to delegated-reader act or scope, require source profiles and exchange only for policy-reachable current-source work, expose only assigned due list and assigned context without internal routing, clock or retention policy, expire cursors crossing reader policies, refuse changed holder/revision without probing or retrying, and withhold results until person plus gateway/client audit is accepted.", negativeId: CASEWORK-NEG-34, negativeTest: {path: crates/registry-casework/src/auth.rs, name: delegated_staff_read_negative_cases_name_their_check_and_write_no_log_line}}
  - {id: CASEWORK-SEC-35, invariants: [3, 9, 17], state: enforced, targetWave: beta, threat: "An applicant progress read exposes an internal stage or accepts progress for another request, subject, policy or submission.", enforcementPoint: "Explicit producer query, bounded policy-authored code from the accepted digest-pinned closure, reviewing-only projection and exact accepted tuple verification in the shared client.", refusal: "Omit progress on plain, unmapped and terminal reads; refuse malformed codes and every substituted accepted binding member.", negativeId: CASEWORK-NEG-35, negativeTest: {path: crates/registry-review-client/tests/http_boundary.rs, name: request_progress_rejects_each_substituted_binding_member}}
  - {id: CASEWORK-SEC-36, invariants: [3], state: enforced, targetWave: beta, threat: "Synthetic run preparation silently changes producer identity or broadens initiator trust.", enforcementPoint: "The development runner's run issuer binding (bind_casework_run_issuer and checked_casework_run_issuer in crates/registry-rstack-dev/src/products.rs): exact producer issuer, profile, subject and grant-scope comparison, an existing initiator pin, a closed initiator trust member, and a change limited to the producer issuer members of a private project copy before the public caseworkctl check and package.", refusal: "Refuse mismatched producer pins, an absent initiator pin and an initiator trust other than run-test-people, each at its dev.yaml pointer.", negativeId: CASEWORK-NEG-36, negativeTest: {path: crates/registry-rstack/tests/dev_run.rs, name: casework_run_issuer_mismatch_names_the_dev_yaml_pointer}}
  - {id: CASEWORK-SEC-37, invariants: [1, 3, 9, 14], state: enforced, targetWave: beta, threat: "A separate source bearer substitutes another human or leaks through inbox filtering or retained recovery.", enforcementPoint: "Independent provider-bound cryptographic same-human authentication before output, explicit source profile and invocation-local source credential.", refusal: "Refuse invalid or ambiguous pairs before source I/O; BReg still owns source client/profile admission.", negativeId: CASEWORK-NEG-37, negativeTest: {path: crates/registry-casework/tests/review_http.rs, name: separate_human_source_credentials_bind_before_empty_inbox_and_guard_mutations}}
  - {id: CASEWORK-SEC-38, invariants: [9, 17], state: enforced, targetWave: beta, threat: "The operator metrics listener becomes a second disclosure channel: a reachable address, a socket shared with the API listener, or a sampled value carrying record content lets a reader learn review state or record values without authentication.", enforcementPoint: "Metrics are absent unless the runtime file configures metricsListener. The bind is read through the shared platform rule: public, link-local, multicast and IPv4-mapped addresses and port 0 are refused, the unspecified address is permitted only under metricsListener.networkExposure container-private, and a bind that shares the API listener's socket, wildcard included, is refused. The listener has no authentication, so it must stay on a private network. Sampled series carry counts and ages only, never record content.", refusal: "Refuse the runtime file with casework.runtime.invalid-metrics-listener, never echoing the configured address. Serve no metrics route on the API listener.", negativeId: CASEWORK-NEG-38, negativeTest: {path: crates/registry-casework/src/config.rs, name: metrics_listener_wildcard_needs_container_private_exposure}}
  - {id: CASEWORK-SEC-39, invariants: [7, 8], state: enforced, targetWave: beta, threat: "A forged completion wake is accepted or a substituted recipient binding selects the same signing key.", enforcementPoint: "Standard Webhooks verification over the exact request bytes and distinct current and previous signing keys across completion destinations.", refusal: "Refuse unauthenticated wakes at the receiver and refuse completion destinations that share signing key bytes.", negativeId: CASEWORK-NEG-39, negativeTest: {path: crates/registry-casework/src/runtime.rs, name: completion_destinations_cannot_share_a_current_or_previous_signing_key}}
  - {id: CASEWORK-SEC-40, invariants: [3, 9, 17], state: enforced, targetWave: beta, threat: "A producer answers another producer's ask, replays or reopens an ask, carries applicant text to Casework, or backdates the answer.", enforcementPoint: "The answer call loads the request under the calling producer's identity, requires the request's own subject binding, and locks the request and ask. Only open asks or expired asks with an on-time answeredAt become answered. The body type admits a subject and an answer time and no other member. The answer time must lie between the ask time and a short skew ahead of Casework's clock.", refusal: "Answer an unknown, another producer's or mismatched ask with an empty 404, an answered or closed ask with review.ask-not-open, a time outside the window with review.ask-answer-time-invalid, and an extra member with 422. Replay the stored response for the same idempotency key.", negativeId: CASEWORK-NEG-40, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: the_producer_answer_marks_the_task_answered_and_obeys_its_rules}}
  - {id: CASEWORK-SEC-41, invariants: [3, 9, 17], state: enforced, targetWave: beta, threat: "A reviewer asks the applicant without holding the task, from a stage or producer that does not offer asks, or leaves ask text beyond the review's retention.", enforcementPoint: "The ask command runs in one transaction under the task revision: the caller must hold the task at the active stage of a reviewing request, the stage must declare asks, the producer must read asks, and no ask may be open. The history row and audit record carry the ask id and never its text, and the ask rows and feed events are erased with the request's history.", refusal: "Refuse a caller who does not hold the task with review.task-not-held, a stale revision with precondition-failed, and each other missing condition with its own review.ask-* problem.", negativeId: CASEWORK-NEG-41, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: an_ask_is_refused_unless_every_condition_holds}}
  - {id: CASEWORK-SEC-42, invariants: [3, 9, 17], state: enforced, targetWave: beta, threat: "Delivery lag or the clock runner's ordering admits an answer given after the ask deadline, or rejects an on-time answer.", enforcementPoint: "The producer answer transaction compares answeredAt with the stored absolute dueAt under the same request lock as expiry. An expired ask can become answered only at or before dueAt while its task and request remain active. Closing preserves expired state and time.", refusal: "Return 409 review.ask-not-open for answeredAt after dueAt or an inactive task or request without changing the ask, task revision, history or feed.", negativeId: CASEWORK-NEG-42, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: c2_a_late_answer_is_refused_before_the_expiry_runner_runs}}
  - {id: CASEWORK-SEC-43, invariants: [9, 17], state: enforced, targetWave: beta, threat: "An ask without a due date pauses all request clocks indefinitely.", enforcementPoint: "Review policy validation requires answerWithin wherever pauseClocks is true.", refusal: "Refuse the policy with casework.review-policy.ask-pause-requires-answer-within at the stage's asks/answerWithin pointer.", negativeId: CASEWORK-NEG-43, negativeTest: {path: crates/registry-casework-core/src/review.rs, name: pausing_asks_require_a_due_date}}
  - {id: CASEWORK-SEC-44, invariants: [1, 3, 17, 18], state: enforced, targetWave: beta, threat: "A reviewer who decided a stage of an earlier round decides a later stage of the resumed round, or the exclusion lapses when the earlier round is erased.", enforcementPoint: "A request that resumes at the returning stage stores each earlier-round reviewer up to and including that stage with the stage index they decided, carried into later rounds. Decision, claim, assignment and absence-cover eligibility, the staffing shortfall and advisory accountability reads exclude them from every stage above that index that sets excludePreviousStageReviewers. A later round erased first stops an older round from resuming.", refusal: "Refuse the claim, assignment or decision with the separation-of-duties check, report insufficient-distinct-approvers when only excluded staff remain, and withhold advisory accountability.", negativeId: CASEWORK-NEG-44, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: c2_sod2_returning_stage_reviewers_stay_out_of_later_stages_across_rounds}}
