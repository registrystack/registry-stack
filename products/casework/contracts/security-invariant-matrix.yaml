  - {id: CASEWORK-SEC-30, invariants: [2, 17, 18], state: enforced, targetWave: beta, threat: "A supervisor appoints absence cover through a shared team they do not supervise.", enforcementPoint: "Current Directory supervision over a team shared by the absent person and cover before creating the absence.", refusal: "Refuse cover outside the supervisor's current team authority.", negativeId: CASEWORK-NEG-30, negativeTest: {path: crates/registry-casework/tests/review_directory_postgres.rs, name: supervisor_cannot_record_cover_from_an_unsupervised_shared_team}}
  - {id: CASEWORK-SEC-31, invariants: [9, 17], state: enforced, targetWave: beta, threat: "A reviewer's private reason or an advisory finding reaches the producer or audit journal, or a decision settles on an undeclared outcome or on one another approver in its stage did not choose.", enforcementPoint: "Declared outcome, per-outcome publicReason rule and stage outcome agreement checked in the decision transaction; result built only from the settling decision; audit allow-list carries publicReasonGiven.", refusal: "Refuse undeclared outcomes, an approval naming another outcome than its stage already chose, and missing, undeclared or oversized public reasons; never copy a private reason or advisory payload into the producer result or audit.", negativeId: CASEWORK-NEG-31, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: advisory_rejection_advances_to_final_approval_without_releasing_its_reason}}
