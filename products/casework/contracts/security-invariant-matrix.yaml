  - {id: CASEWORK-SEC-03, invariants: [9, 17], state: enforced, targetWave: beta, threat: "Reference selection or sorting reveals a caller-concealed current-source subject.", enforcementPoint: "Fresh exact human display read before matching, ordering, counts or released metadata.", refusal: "Conceal hidden candidates and refuse changed live continuation.", negativeId: CASEWORK-NEG-03, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: reference_selection_conceals_before_sort_and_rejects_stale_continuation}}
  - {id: CASEWORK-SEC-04, invariants: [5, 9, 17], state: enforced, targetWave: beta, threat: "Another person reads a private decision draft or a changed binding reuses it.", enforcementPoint: "Private author keys, pinned subject and policy closure, current reviewer/source authority.", refusal: "Return absence for another draft and refuse mutation outside current authority.", negativeId: CASEWORK-NEG-04, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: review_task_coordination_preserves_exclusions_drafts_history_and_absence_cover}}
  - {id: CASEWORK-SEC-05, invariants: [18], state: enforced, targetWave: beta, threat: "A stale caseload preview moves changed tasks or moves only a subset.", enforcementPoint: "Exact task revisions, Directory revision for a pending apply and one locked apply transaction.", refusal: "Refuse the entire move set without partial movement.", negativeId: CASEWORK-NEG-05, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: caseload_preview_apply_is_atomic_revision_fenced_and_recoverable}}
  - {id: CASEWORK-SEC-06, invariants: [3, 4, 5], state: enforced, targetWave: beta, threat: "A service projection widens or replaces human disclosure.", enforcementPoint: "Separate human display, status and purpose-bound minimized service projections.", refusal: "Forward only the exact caller bearer/profile; status carries no fields.", negativeId: CASEWORK-NEG-06, negativeTest: {path: crates/registry-casework-breg/tests/context_provider.rs, name: human_display_uses_exact_caller_bearer_and_status_discloses_no_values}}
  - {id: CASEWORK-SEC-07, invariants: [6, 14, 17], state: enforced, targetWave: beta, threat: "Lost responses create another request or disclose recovery to another producer.", enforcementPoint: "Producer-bound original policy selector and exact submission digest; policy selection and concrete acceptance committed under the subject lock.", refusal: "Recover only the original exact request under current producer authority.", negativeId: CASEWORK-NEG-07, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: current_policy_selection_recovers_before_updates_and_requires_live_authority}}
  - {id: CASEWORK-SEC-08, invariants: [7, 8], state: enforced, targetWave: beta, threat: "A completion signal independently conveys a result or destination authority.", enforcementPoint: "Closed completion envelope without decision payload, stable at-least-once delivery identity, and authenticated result fetch/feed.", refusal: "Reject result and destination members in the notification envelope.", negativeId: CASEWORK-NEG-08, negativeTest: {path: crates/registry-review-protocol/src/lib.rs, name: completion_envelope_contains_no_result_or_destination}}
  - {id: CASEWORK-SEC-09, invariants: [10], state: enforced, targetWave: beta, threat: "An optional source dependency becomes necessary for independent review.", enforcementPoint: "Submitted context uses the same review lifecycle without any provider.", refusal: "Keep submitted work usable when a source provider fails.", negativeId: CASEWORK-NEG-09, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: provider_failure_refuses_affected_work_while_submitted_review_remains_usable}}
  - {id: CASEWORK-SEC-10, invariants: [13, 15, 16], state: enforced, targetWave: beta, threat: "Source product types enter the neutral protocol/core/client or reverse dependency.", enforcementPoint: "Resolved Cargo dependency-direction checks.", refusal: "Fail direct or transitive forbidden product dependencies.", negativeId: CASEWORK-NEG-10, negativeTest: {path: products/casework/scripts/test_dependency_direction.py, name: test_transitive_breg_dependency_from_generic_client_is_rejected}}
  - {id: CASEWORK-SEC-11, invariants: [3, 5, 10, 18], state: enforced, targetWave: beta, threat: "Cancellation and a final decision both settle or revive terminal work.", enforcementPoint: "One request-row fence stores result, receipt and terminal feed event atomically.", refusal: "Commit exactly one terminal winner.", negativeId: CASEWORK-NEG-11, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: cancellation_and_final_decision_commit_exactly_one_terminal_result}}
  - {id: CASEWORK-SEC-12, invariants: [6, 14, 17], state: enforced, targetWave: beta, threat: "A retained reviewer receipt is disclosed to another reviewer.", enforcementPoint: "Exact retained author, selected profile, live queue/source authorization and retention.", refusal: "Return only the callers retained pinned decision receipt.", negativeId: CASEWORK-NEG-12, negativeTest: {path: crates/registry-casework/tests/review_http.rs, name: decision_receipts_disclose_only_the_callers_retained_pinned_outcome_over_http}}
  - {id: CASEWORK-SEC-13, invariants: [14, 17], state: enforced, targetWave: beta, threat: "Credentials or refusal details escape through an unbounded HTTP response.", enforcementPoint: "Private listener policy and one bounded problem/trace/cache/security boundary.", refusal: "Normalize extraction/media/body/auth failures without CORS or private values.", negativeId: CASEWORK-NEG-13, negativeTest: {path: crates/registry-casework/src/http.rs, name: http_edge_returns_closed_problems_with_request_trace_and_security_headers}}
  - {id: CASEWORK-SEC-14, invariants: [2, 3, 17, 18], state: enforced, targetWave: beta, threat: "A caseload administrator loses current team or source authority after preview.", enforcementPoint: "Independent live Directory and source checks at apply plus exact move fencing.", refusal: "Refuse newly concealed or unauthorized movement without any partial effect.", negativeId: CASEWORK-NEG-14, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: source_visibility_and_directory_authority_are_both_live_at_caseload_apply}}
  - {id: CASEWORK-SEC-15, invariants: [11, 18], state: enforced, targetWave: beta, threat: "Clock recompute upgrades policy or accepts newly published inputs after preview.", enforcementPoint: "Pinned closure, original anchor, explicit holiday revision and task/occurrence fences.", refusal: "Require a new preview when holiday inputs change and preserve pinned policy.", negativeId: CASEWORK-NEG-15, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: clock_recompute_uses_pinned_calendar_and_fences_changed_holiday_inputs}}
  - {id: CASEWORK-SEC-16, invariants: [1, 3, 17, 18], state: enforced, targetWave: beta, threat: "One reviewer satisfies independent stage decisions or invalid results settle a request.", enforcementPoint: "Pinned stage thresholds and negative-decision mode, issuer-qualified reviewer exclusions and schema validation.", refusal: "Refuse duplicate or prior-stage identity and invalid structured result without emitting work.", negativeId: CASEWORK-NEG-16, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: prior_stage_identity_and_invalid_structured_result_emit_nothing}}
