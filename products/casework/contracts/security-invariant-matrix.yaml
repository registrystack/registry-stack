  - {id: CASEWORK-SEC-18, invariants: [3, 5, 18], state: enforced, targetWave: beta, threat: "A task grant survives responsibility changes or is revived after reassignment.", enforcementPoint: "Current holder/profile/Directory/template/subject checks and durable assignment generation.", refusal: "Invalidate authority monotonically while draft-only edits preserve deferred responsibility.", negativeId: CASEWORK-NEG-18, negativeTest: {path: crates/registry-casework/src/task_grants/http_tests.rs, name: deferred_review_grants_ignore_drafts_but_never_revive_after_responsibility_changes}}
  - {id: CASEWORK-SEC-19, invariants: [4, 5, 9, 17], state: enforced, targetWave: beta, threat: "A provider returns unrequested routing fields or silently reroutes existing tasks.", enforcementPoint: "Exact request/task/policy/contract purpose binding and compiled field set at task creation.", refusal: "Reject extra fields and retain only the derived queue.", negativeId: CASEWORK-NEG-19, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: current_source_routing_is_purpose_bound_once_and_never_persists_fields}}
  - {id: CASEWORK-SEC-20, invariants: [9, 17], state: enforced, targetWave: beta, threat: "A hidden live reference query is reported complete without bounded evaluation.", enforcementPoint: "Configured candidate, source-read and time budgets with exact opaque subject narrowing.", refusal: "Refuse broad queries and require a narrower complete query.", negativeId: CASEWORK-NEG-20, negativeTest: {path: crates/registry-casework/tests/review_acceptance_postgres.rs, name: live_read_budget_requires_narrowing_and_exact_subject_narrows_before_scan}}
  - {id: CASEWORK-SEC-21, invariants: [9, 17], state: enforced, targetWave: beta, threat: "Accountability escapes retention or is released before its audit is accepted.", enforcementPoint: "Live authorization/retention checks and committed audit release gate.", refusal: "Refuse unavailable audit and expired accountability.", negativeId: CASEWORK-NEG-21, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: accountability_read_requires_live_retention_and_a_committed_audit}}
  - {id: CASEWORK-SEC-22, invariants: [9, 17, 18], state: enforced, targetWave: beta, threat: "A lost-response decision replay bypasses the audit release gate.", enforcementPoint: "Durable exact replay under current authority followed by acknowledged audit response.", refusal: "Withhold the replay while its response audit cannot be accepted.", negativeId: CASEWORK-NEG-22, negativeTest: {path: crates/registry-casework/tests/review_postgres.rs, name: a_retained_decision_replay_is_withheld_until_its_response_entry_is_accepted}}
  - {id: CASEWORK-SEC-23, invariants: [3, 14, 18], state: enforced, targetWave: beta, threat: "A runtime role gains activation-ledger authority through grants, ownership or triggers.", enforcementPoint: "Measured split-role privileges at apply/startup and read-only runtime ledgers.", refusal: "Refuse weakened role boundaries and require explicit apply recovery.", negativeId: CASEWORK-NEG-23, negativeTest: {path: crates/registry-casework/tests/review_migration_postgres.rs, name: a_runtime_role_that_gained_ledger_authority_is_refused_at_startup_until_apply_records_it}}
