  - {id: CASEWORK-SEC-27, invariants: [3, 5, 18], state: enforced, targetWave: beta, threat: "Deferred Evidence authorization becomes an unrevocable long-lived credential.", enforcementPoint: "Explicit mode ceiling, short assertion TTL and signer refusal of deferred Evidence bounds.", refusal: "Refuse deferred Evidence assertions even for stored grants.", negativeId: CASEWORK-NEG-27, negativeTest: {path: crates/registry-casework/src/task_grants.rs, name: task_assertion_refuses_a_deferred_evidence_grant}}
