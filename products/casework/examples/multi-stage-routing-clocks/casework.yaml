apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project: {id: regional-review, version: "1"}
accessProfiles:
  staff: {principalClaim: sub, requiredScopes: [casework:staff], role: staff}
  supervisor: {principalClaim: sub, requiredScopes: [casework:supervisor], role: supervisor}
  administrator: {principalClaim: sub, requiredScopes: [casework:admin], role: administrator}
  requester: {principalClaim: sub, requiredScopes: [casework:request], role: requester}
queues:
  triage: {label: Regional triage}
  northern-review: {label: Northern reviews}
  overdue-review: {label: Overdue reviews}
  signoff: {label: Supervisor signoff}
teams:
  regional-team:
    label: Regional review team
    serves: [triage, northern-review, overdue-review, signoff]
    memberProfiles: [staff]
    supervisorProfiles: [supervisor]
reviewPolicies:
  regional-review:
    version: "1"
    purpose: approval
    context: {mode: submitted}
    routing:
      - id: northern-requests
        because: The submitted region is north.
        when:
          stage: technical
          fields: {region: {equals: north}}
        queue: northern-review
    stages:
      - id: technical
        queue: triage
        decidingProfiles: [staff]
        requiredApprovals: 1
      - id: signoff
        queue: signoff
        decidingProfiles: [supervisor]
        requiredApprovals: 1
        excludePreviousStageReviewers: true
    clocks: [review-deadline, response-budget]
    retention:
      terminalRetentionDays: 30
      accountabilityRetentionDays: 365
    displaySchema:
      type: object
      additionalProperties: false
      required: [summary, region]
      properties:
        summary: {type: string, maxLength: 160}
        region: {type: string, enum: [north, south, islands]}
    outcomes:
      approved: {label: Approve, settlement: approved, reasonRequired: false, publicReason: optional}
      rejected: {label: Return for correction, settlement: rejected, reasonRequired: true, publicReason: required}
trustedProducers:
  regional-service:
    profile: requester
    issuer: https://identity.example.test
    subject: regional-review-producer
    sourceNamespaces: [regional-register]
    reviewPolicies: [regional-review]
    retention: {receiptRetentionDays: 7}
calendars:
  office:
    timezone: Asia/Bangkok
    workingWeekdays: [monday, tuesday, wednesday, thursday, friday]
    holidaySet: office-holidays
clocks:
  response-budget:
    type: subject
    anchor: {type: request-accepted}
    after: {hours: 48}
  review-deadline:
    type: stage
    anchor: {type: stage-entered}
    calendar: office
    after: {workingDays: 5}
    dueTime: "17:00"
    atRisk: {before: {workingDays: 1}}
    reminders:
      due-soon: {before: {workingDays: 1}}
    steps:
      - id: supervisor-at-deadline
        because: The review deadline passed while the review remained active.
        at: due
        action: {reassign: {queue: overdue-review}}
