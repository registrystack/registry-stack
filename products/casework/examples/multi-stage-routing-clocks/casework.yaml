apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project: {id: regional-review, version: "1"}
accessProfiles:
  - {id: staff, principalClaim: sub, requiredScopes: [casework:staff], role: staff}
  - {id: supervisor, principalClaim: sub, requiredScopes: [casework:supervisor], role: supervisor}
  - {id: administrator, principalClaim: sub, requiredScopes: [casework:admin], role: administrator}
  - {id: requester, principalClaim: sub, requiredScopes: [casework:request], role: requester}
queues:
  - {id: triage, label: Regional triage}
  - {id: northern-review, label: Northern reviews}
  - {id: overdue-review, label: Overdue reviews}
  - {id: signoff, label: Supervisor signoff}
teams:
  - id: regional-team
    label: Regional review team
    serves: [triage, northern-review, overdue-review, signoff]
    memberProfiles: [staff]
    supervisorProfiles: [supervisor]
reviewPolicies:
  - id: regional-review
    version: "1"
    purpose: approval
    context: {mode: submitted}
    routing:
      - id: northern-requests
        because: The submitted region is north.
        when:
          activity: review
          stage: technical
          fields: {region: {equals: north}}
        queue: northern-review
    stages:
      - id: technical
        queue: triage
        decidingProfiles: [staff]
        requiredApprovals: 1
      - id: signoff
        queue: signoff
        decidingProfiles: [supervisor]
        requiredApprovals: 1
        excludePreviousStageReviewers: true
    clocks: [review-deadline, response-budget]
    retention:
      terminalDays: 30
      accountabilityDays: 365
    displaySchema:
      type: object
      additionalProperties: false
      required: [summary, region]
      properties:
        summary: {type: string, maxLength: 160}
        region: {type: string, enum: [north, south, islands]}
    outcomes:
      - {id: approved, label: Approve, settlement: approved, reasonRequired: false}
      - {id: rejected, label: Return for correction, settlement: rejected, reasonRequired: true}
trustedProducers:
  - id: regional-service
    profile: requester
    issuer: https://identity.example.test
    subject: regional-review-producer
    sourceNamespaces: [regional-register]
    reviewPolicies: [regional-review]
    recoveryDays: 7
calendars:
  - id: office
    timezone: Asia/Bangkok
    workingWeekdays: [monday, tuesday, wednesday, thursday, friday]
    holidaySet: office-holidays
clocks:
  - id: response-budget
    type: subject
    anchor: request-accepted-at
    completeOn: result-terminal
    after: {elapsed: PT48H}
  - id: review-deadline
    type: activity
    anchor: stage-entered-at
    calendar: office
    after: {workingDays: 5}
    dueTime: "17:00"
    atRisk: {workingDaysBefore: 1}
    reminders: [{id: due-soon, workingDaysBefore: 1}]
    steps:
      - id: supervisor-at-deadline
        because: The review deadline passed while the review remained active.
        at: due
        action: {reassign: {queue: overdue-review}}
