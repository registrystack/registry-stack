apiVersion: registry.registrystack.org/casework/v1alpha1
kind: CaseworkProject
casework:
  id: payment-review
  version: "1"
accessProfiles:
  - id: reviewer
    principalClaim: sub
    requiredScopes: [casework:reviewer]
    role: staff
  - id: supervisor
    principalClaim: sub
    requiredScopes: [casework:supervisor]
    role: supervisor
  - id: administrator
    principalClaim: sub
    requiredScopes: [casework:admin]
    role: administrator
  - id: payments
    principalClaim: sub
    requiredScopes: [casework:payments]
    role: requester
queues:
  - id: payment-review
    label: Payment batches awaiting verification
reviewKinds:
  - id: payment-batch
    version: "1"
    purpose: approval
    contextStrategy: submitted
    stages:
      - id: verification
        queue: payment-review
        decidingProfiles: [reviewer]
        requiredApprovals: 1
    retention:
      terminalDays: 30
      accountabilityDays: 90
    displaySchema:
      type: object
      additionalProperties: false
      required: [batchId, amountMinor, currency]
      properties:
        batchId: {type: string, maxLength: 80}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string, enum: [USD]}
reviewProducers:
  - id: payments
    profile: payments
    issuer: https://identity.example.test/realms/payments
    subject: payment-service
    sourceNamespaces: [payments]
    kinds: [payment-batch]
    recoveryDays: 7
    completion:
      destinationId: payment-results
      recipientBinding: payment-processor-v1
