# yaml-language-server: $schema=.casework/schemas/dev-clients.schema.json
apiVersion: id.registrystack.org/formats/casework/dev-clients/v1alpha1
kind: CaseworkDevClients
# Synthetic local teaching callers. Source integration is configured separately.
clients:
  - id: administrator
    accessProfile: administrator
    scopes: [casework:admin]
    claims: {registry_actor_kind: human}
  - id: supervisor
    accessProfile: supervisor
    scopes: [casework:supervisor]
    claims: {registry_actor_kind: human}
  - id: staff
    accessProfile: staff
    scopes: [casework:staff]
    claims: {registry_actor_kind: human}
  - id: requester
    accessProfile: requester
    scopes: [casework:request]
directory:
  - team: decisions-team
    queue: decisions
    staff: [staff]
    supervisors: [supervisor]
  - team: facility-addresses-team
    queue: facility-addresses
    staff: [staff]
    supervisors: [supervisor]
