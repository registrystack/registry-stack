apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project:
  id: standalone-decision
  version: "1"
accessProfiles:
  - id: staff
    principalClaim: sub
    requiredScopes: [casework:staff]
    role: staff
  - id: supervisor
    principalClaim: sub
    requiredScopes: [casework:supervisor]
    role: supervisor
  - id: administrator
    principalClaim: sub
    requiredScopes: [casework:admin]
    role: administrator
  - id: requester
    principalClaim: sub
    requiredScopes: [casework:request]
    role: requester
queues:
  - id: decisions
    label: Decisions awaiting review
reviewPolicies:
  - id: decision
    version: "1"
    purpose: answer
    context: {mode: submitted}
    stages:
      - id: answer
        queue: decisions
        decidingProfiles: [staff]
        requiredApprovals: 1
    retention:
      terminalDays: 90
      accountabilityDays: 365
    displaySchema:
      type: object
      additionalProperties: false
      required: [summary, reference]
      properties:
        summary: {type: string, maxLength: 160}
        reference: {type: string, maxLength: 120}
    outcomes:
      - id: confirmed
        label: Confirm
        settlement: answered
        reasonRequired: false
      - id: rejected
        label: Return for correction
        settlement: answered
        reasonRequired: true
trustedProducers:
  - id: requester
    profile: requester
    issuer: http://127.0.0.1:8093
    subject: b75315b2-5854-70f3-8867-511dd771a6da
    sourceNamespaces: [standalone]
    reviewPolicies: [decision]
    recoveryDays: 30
