apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project:
  id: two-level-grant-review
  version: "1"
accessProfiles:
  local-reviewer:
    principalClaim: sub
    requiredScopes: [casework:local-review]
    actsAs: staff
  final-reviewer:
    principalClaim: sub
    requiredScopes: [casework:final-review]
    actsAs: staff
  supervisor:
    principalClaim: sub
    requiredScopes: [casework:supervise]
    actsAs: supervisor
  administrator:
    principalClaim: sub
    requiredScopes: [casework:admin]
    actsAs: administrator
  requester:
    principalClaim: sub
    requiredScopes: [casework:request]
    actsAs: requester
queues:
  local-review:
    label: Local grant reviews
  final-review:
    label: Final grant reviews
reviewPolicies:
  grant-review:
    version: "1"
    purpose: approval
    context: {mode: submitted}
    stages:
      - id: local-review
        label: Local review
        queue: local-review
        decidingProfiles: [local-reviewer]
        requiredApprovals: 1
        outcomes: [approved, changes-requested, rejected]
      - id: final-review
        label: Final review
        queue: final-review
        decidingProfiles: [final-reviewer]
        requiredApprovals: 1
        outcomes: [approved, rejected]
        excludePreviousStageReviewers: true
    retention:
      terminalRetentionDays: 30
      accountabilityRetentionDays: 365
    displaySchema:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: {type: string, maxLength: 160}
    outcomes:
      approved:
        label: Approve
        settlement: approved
        reasonRequired: false
        publicReason: optional
      changes-requested:
        label: Request changes
        settlement: changes-requested
        reasonRequired: true
        publicReason: optional
      rejected:
        label: Reject
        settlement: rejected
        reasonRequired: true
        publicReason: optional
trustedProducers:
  grant-service:
    profile: requester
    issuer: https://identity.example.test
    subject: grant-service.example.test
    sourceNamespaces: [grant-register]
    reviewPolicies: [grant-review]
    retention: {receiptRetentionDays: 30}
