# SPDX-License-Identifier: Apache-2.0
apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: membership-example
  version: '1'
  defaultLanguage: en
  canonicalBaseIri: https://membership.example.test
entities:
- id: organization
  primaryDataset: test-dataset
  route: organizations
  mutationMode: mutable
  classification: internal
  fields:
  - id: name
    type: string
    maximumLength: 80
    classification: internal
- id: membership
  primaryDataset: test-dataset
  route: memberships
  mutationMode: mutable
  classification: restricted
  fields:
  - id: organization
    type: reference
    target: organization
    required: true
    classification: internal
  - id: principal
    type: string
    maximumLength: 80
    required: true
    classification: restricted
  - id: active
    type: boolean
    required: true
    classification: internal
  - id: private-note
    type: string
    maximumLength: 80
    classification: restricted
  indexes:
  - id: membership-principal-key
    fields:
    - principal
    - organization
    - active
  accessRequirements:
    requiredScopes:
    - membership:use
- id: facility
  primaryDataset: test-dataset
  route: facilities
  mutationMode: mutable
  classification: internal
  fields:
  - id: organization
    type: reference
    target: organization
    required: true
    classification: internal
  - id: label
    type: string
    maximumLength: 80
    required: true
    classification: internal
  selectorProfiles:
  - id: label
    fields:
    - label
accessProfiles:
- id: member
  default: true
  principalClaim: principal
  requiredScopes:
  - records:read
  - membership:use
  permissions:
    entities:
    - entity: facility
      rowBoundaries: unrestricted
      operations:
      - get
      - list
      - lookup
      - snapshot
      - revisions
      readableFields:
      - label
      filterableFields:
      - label
      sortableFields:
      - label
      allowCount: true
      revisionAccess: true
      lookups:
      - selector: label
        valueOrigin: request
      membershipBoundaries:
      - field: organization
        membershipEntity: membership
        membershipKeyField: organization
        principalField: principal
        activeField: active
- id: steward
  principalClaim: principal
  requiredScopes:
  - records:manage
  - membership:use
  permissions:
    entities:
    - entity: organization
      rowBoundaries: unrestricted
      operations:
      - create
      - get
      readableFields:
      - name
      writableFields:
      - name
    - entity: membership
      rowBoundaries: unrestricted
      operations:
      - create
      - get
      - patch
      readableFields:
      - organization
      - principal
      - active
      writableFields:
      - organization
      - principal
      - active
      - private-note
    - entity: facility
      rowBoundaries: unrestricted
      operations:
      - create
      - get
      - patch
      readableFields:
      - organization
      - label
      writableFields:
      - organization
      - label
