{
  "apiVersion": "id.registrystack.org/formats/breg/project/v1alpha1",
  "kind": "BRegProject",
  "project": {
    "id": "asset-registration-actions",
    "canonicalBaseIri": "https://asset-registration-actions.example.gov",
    "version": "0.1.0",
    "defaultLanguage": "en"
  },
  "package": {
    "sourceRevision": "asset-registration-actions-fixture-0.1.0"
  },
  "manifestProjection": {
    "accessProfile": "asset-auditor",
    "classificationCeiling": "internal",
    "catalog": {
      "baseUrl": "https://asset-registration-actions.example.gov",
      "title": "Asset Registration Actions Catalog",
      "description": "Portable metadata for the asset registration action fixture.",
      "publisher": {
        "id": "asset-registration-actions-authority",
        "name": "Asset Registration Authority",
        "iri": "https://asset-registration-actions.example.gov/authority"
      }
    },
    "publicService": {
      "id": "asset-registration-actions-service",
      "title": "Asset Registration Actions Catalog"
    },
    "datasets": [
      {
        "id": "asset-registration-actions",
        "title": "Asset Registration Actions Registry",
        "description": "Asset records and initial inspection events created by one configured immediate action.",
        "owner": "Asset Registration Authority",
        "status": "active"
      }
    ],
    "dataServices": [
      {
        "id": "asset-registration-actions-data-service",
        "title": "Asset Registration Actions Catalog",
        "endpointUrl": "https://asset-registration-actions.example.gov",
        "servesDatasets": [
          "asset-registration-actions"
        ]
      }
    ],
    "distributions": []
  },
  "modules": [
    {
      "id": "asset-registration-actions-core",
      "version": "0.1.0",
      "digest": "sha256:7ce4dd6c7efcae0a3500d533f4d4622a899c2a5ac31f14be80139b2c823e1964"
    }
  ],
  "recordTypes": [],
  "accessProfiles": [
    {
      "id": "asset-action-registrar",
      "default": true,
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:asset:register"
      ],
      "requiredPurposes": [
        "asset-registration"
      ],
      "permissions": {
        "actions": [
          {
            "action": "register-asset-with-inspection",
            "operations": [
              "invoke"
            ],
            "targets": [
              {
                "recordType": "asset",
                "rowBoundaries": [
                  {
                    "field": "jurisdiction",
                    "claim": "jurisdiction",
                    "operator": "equals"
                  }
                ]
              },
              {
                "recordType": "asset-inspection",
                "rowBoundaries": [
                  {
                    "field": "jurisdiction",
                    "claim": "jurisdiction",
                    "operator": "equals"
                  }
                ]
              }
            ],
            "results": [
              "asset"
            ]
          }
        ]
      }
    },
    {
      "id": "asset-auditor",
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:asset:audit"
      ],
      "requiredPurposes": [
        "asset-audit"
      ],
      "permissions": {
        "records": [
          {
            "recordType": "asset",
            "operations": [
              "get",
              "list"
            ],
            "readableFields": [
              "asset-code",
              "label",
              "asset-type",
              "jurisdiction"
            ],
            "filterableFields": [
              "asset-code",
              "jurisdiction"
            ],
            "rowBoundaries": [
              {
                "field": "jurisdiction",
                "claim": "jurisdiction",
                "operator": "equals"
              }
            ]
          },
          {
            "recordType": "asset-inspection",
            "operations": [
              "get",
              "list"
            ],
            "readableFields": [
              "asset",
              "observed-at",
              "result",
              "jurisdiction"
            ],
            "filterableFields": [
              "asset",
              "jurisdiction"
            ],
            "rowBoundaries": [
              {
                "field": "jurisdiction",
                "claim": "jurisdiction",
                "operator": "equals"
              }
            ]
          }
        ]
      }
    }
  ],
  "vocabularies": [
    {
      "id": "asset-type",
      "values": [
        "equipment",
        "vehicle",
        "furniture"
      ]
    },
    {
      "id": "inspection-result",
      "values": [
        "passed",
        "failed",
        "needs-follow-up"
      ]
    }
  ],
  "datasets": [
    {
      "id": "asset-registration-actions"
    }
  ]
}
