apiVersion: id.registrystack.org/formats/breg/module/v1alpha1
kind: BRegModule
id: consent-land-registry-core
version: 0.1.0
entities:
  - id: parcel
    primaryDataset: consent-land-registry
    route: parcels
    mutationMode: mutable
    classification: internal
    fields:
      - {id: parcel-code, apiName: parcelCode, type: string, required: true, maximumLength: 64, classification: internal}
      - {id: district, type: string, required: true, maximumLength: 80, classification: internal}
      - {id: area-square-metres, apiName: areaSquareMetres, type: int64, required: true, classification: internal}
    constraints:
      - {type: unique, fields: [parcel-code]}
  - id: tenure-right
    primaryDataset: consent-land-registry
    route: tenure-rights
    mutationMode: mutable
    classification: restricted
    fields:
      - {id: parcel, type: reference, target: parcel, required: true, classification: internal}
      - {id: holder-name, apiName: holderName, type: string, required: true, maximumLength: 160, classification: restricted}
      - {id: tenure-kind, apiName: tenureKind, type: string, required: true, maximumLength: 40, classification: internal}
      - {id: encumbered, type: boolean, required: true, classification: restricted}
