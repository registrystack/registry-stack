{
  "apiVersion": "id.registrystack.org/formats/breg/project/v1alpha1",
  "kind": "BRegProject",
  "project": {
    "id": "facility-registry-actions",
    "canonicalBaseIri": "https://facility-registry-actions.example.gov",
    "version": "0.1.0",
    "defaultLanguage": "en"
  },
  "package": {
    "sourceRevision": "facility-registry-actions-fixture-0.1.0"
  },
  "manifestProjection": {
    "accessProfile": "facility-owner",
    "classificationCeiling": "internal",
    "catalog": {
      "baseUrl": "https://facility-registry-actions.example.gov",
      "title": "Facility Registry Actions Catalog",
      "description": "Facilities with initial operator assignments and governed ownership transfer.",
      "publisher": {
        "id": "facility-registry-authority",
        "name": "Facility Registry Authority",
        "iri": "https://facility-registry-actions.example.gov/authority"
      }
    },
    "authorities": [
      {
        "id": "facility-registry-authority",
        "name": "Facility Registry Authority",
        "iri": "https://facility-registry-actions.example.gov/authority"
      }
    ],
    "publicService": {
      "id": "facility-registry-service",
      "title": "Facility Registry Actions Catalog",
      "competentAuthority": "facility-registry-authority"
    },
    "datasets": [
      {
        "id": "facility-registry-actions",
        "title": "Facility Registry",
        "description": "Configured facility registrations and initial operator assignments.",
        "owner": "Facility Registry Authority",
        "status": "active"
      }
    ],
    "dataServices": [
      {
        "id": "facility-registry-data-service",
        "title": "Facility Registry Actions Catalog",
        "endpointUrl": "https://facility-registry-actions.example.gov",
        "servesDatasets": [
          "facility-registry-actions"
        ]
      }
    ],
    "distributions": []
  },
  "modules": {"facility-registry-actions-core":{"digest":"sha256:e6d5fdbec2d2807621c59a8123b4d4f8405d5bbb3974c51b2ef2b5a331ca8b8d","version":"0.1.0"}},
  "recordTypes": {},
  "accessProfiles": {
    "facility-registrar": {
      "default": true,
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:facility:register"
      ],
      "requiredPurposes": [
        "facility-administration"
      ],
      "permissions": {
        "actions": [
          {
            "action": "register-facility",
            "operations": [
              "invoke"
            ],
            "targets": [
              {
                "recordType": "facility",
                "rowBoundaries": [
                  {
                    "field": "owner",
                    "claim": "registry_principal",
                    "operator": "equals"
                  }
                ]
              },
              {
                "recordType": "initial-operator-assignment",
                "rowBoundaries": "unrestricted"
              },
              {
                "recordType": "operator",
                "rowBoundaries": "unrestricted"
              }
            ],
            "results": [
              "facility",
              "initial-assignment"
            ]
          }
        ]
      }
    },
    "facility-transfer": {
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:facility:transfer"
      ],
      "requiredPurposes": [
        "facility-administration"
      ],
      "permissions": {
        "actions": [
          {
            "action": "transfer-facility",
            "operations": [
              "invoke"
            ],
            "targets": [
              {
                "recordType": "facility",
                "rowBoundaries": [
                  {
                    "field": "owner",
                    "claim": "allowed_owners",
                    "operator": "in"
                  }
                ]
              }
            ],
            "results": [
              "facility"
            ]
          }
        ]
      }
    },
    "facility-owner": {
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:facility:read"
      ],
      "requiredPurposes": [
        "facility-administration"
      ],
      "permissions": {
        "records": [
          {
            "recordType": "facility",
            "operations": [
              "get",
              "list"
            ],
            "readableFields": [
              "facility-code",
              "label",
              "owner"
            ],
            "filterableFields": [
              "facility-code"
            ],
            "rowBoundaries": [
              {
                "field": "owner",
                "claim": "registry_principal",
                "operator": "equals"
              }
            ]
          }
        ]
      }
    },
    "operator-administrator": {
      "principalClaim": "registry_principal",
      "requiredScopes": [
        "registry:operator:manage"
      ],
      "requiredPurposes": [
        "facility-administration"
      ],
      "permissions": {
        "records": [
          {
            "recordType": "operator",
            "rowBoundaries": "unrestricted",
            "operations": [
              "create",
              "get",
              "patch"
            ],
            "readableFields": [
              "operator-code",
              "status"
            ],
            "writableFields": [
              "operator-code",
              "status"
            ]
          }
        ]
      }
    }
  },
  "vocabularies": {
    "operator-status": {
      "values": [
        "active",
        "inactive"
      ]
    }
  },
  "datasets": {
    "facility-registry-actions": {}
  }
}
