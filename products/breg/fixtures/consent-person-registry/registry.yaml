apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: consent-person-registry
  canonicalBaseIri: https://consent-person-registry.example.gov
  version: 0.1.0
  defaultLanguage: en
package:
  sourceRevision: consent-person-registry-fixture-0.1.0
manifestProjection:
  accessProfile: person-registry-operator
  classificationCeiling: restricted
  catalog:
    baseUrl: https://consent-person-registry.example.gov
    title: Consent Person Registry Catalog
    description: Portable metadata for the person registry consent fixture.
    publisher:
      id: consent-person-registry-authority
      name: Person Registry Authority
      iri: https://consent-person-registry.example.gov/authority
  publicService: {id: consent-person-registry-service, title: Consent Person Registry Catalog}
  datasets:
    - id: consent-person-registry
      title: Consent Person Registry
      description: Person records a recipient reads only while the person's consent is in force.
      owner: Person Registry Authority
      status: active
    - id: consent
      title: Person Consent Decisions
      description: Privacy notices, notice clauses, consent links, and the append-only consent decisions over persons.
      owner: Person Registry Authority
      status: active
      accessProfile: person-consent-steward
  dataServices:
    - id: consent-person-registry-data-service
      title: Consent Person Registry Catalog
      endpointUrl: https://consent-person-registry.example.gov
      servesDatasets: [consent-person-registry, consent]
  distributions: []
modules:
  - id: "consent-person"
    version: "0.1.0"
    digest: "sha256:56aab6818a19d5ee6eba43ab04d9dc86b9cb0ed57b698061de216203f35fc8d0"
  - id: "consent-person-registry-core"
    version: "0.1.0"
    digest: "sha256:152e3a291a2f7c19845250012b5d8f082a83bcb22ba6ae9b377b7d440a83e3ab"

recipients:
  organizations:
    - id: food-agency
      name: Food Assistance Agency
      contact: privacy@food-agency.example.gov
      clients: [food-agency-portal]
    - id: health-ngo
      name: Health Referral NGO
      contact: dpo@health-ngo.example.org
      clients: [health-ngo-portal]
  groups:
    - id: referral-network
      name: Referral network
      members: [food-agency, health-ngo]
vocabularies:
  - id: data-use-purpose
    values: [food-assistance, health-referral]
  - id: consent-decision
    values: [given, refused, withdrawn, invalidated]
  - id: consent-channel
    values: [self-service, assisted, steward-review, import]
  - id: consent-invalidation-reason
    values: [captured-in-error, identity-mismatch, notice-withdrawn, controller-decision]

recordTypes: []
accessProfiles:
  - id: person-registry-operator
    default: true
    principalClaim: registry_principal
    actorKind: human
    requesterClients: [person-registry-console]
    requiredScopes: [registry:person:operate]
    permissions:
      records:
        - recordType: person
          operations: [create, get, list]
          readableFields: [person-code, legal-name, district]
          writableFields: [person-code, legal-name, district]
          rowBoundaries: unrestricted
  - id: food-targeting
    principalClaim: registry_principal
    actorKind: service
    requesterClients: [food-agency-portal, health-ngo-portal]
    requiredScopes: [registry:person:read]
    requiredPurposes: [food-assistance]
    permissions:
      records:
        - recordType: person
          operations: [get, list]
          readableFields: [person-code, legal-name, district]
          allowCount: true
          rowBoundaries: unrestricted
          requireConsent:
            - {record: person-consent-decision, on: id}
  - id: person-consent-self
    principalClaim: registry_principal
    requiredScopes: ['consent:person:self']
    permissions:
      records:
      - recordType: person-consent-decision
        rowBoundaries: unrestricted
        membershipBoundaries:
        - {field: subject, membershipRecordType: person-consent-link, membershipKeyField: subject, principalField: principal, activeField: active}
        operations: [get, list]
        readableFields: [subject, notice, clause, recipient, purpose, scope, decision, effective-at, expires-at, channel]
      - recordType: person-consent-link
        rowBoundaries:
        - {field: principal, claim: registry_principal, operator: equals}
        operations: [get, list]
        readableFields: [subject, active]
      - recordType: person-privacy-notice
        rowBoundaries: unrestricted
        operations: [get, list]
        readableFields: [notice-version, language, title, text, text-uri, controller-name, controller-contact, jurisdiction, legal-basis, rights-statement, rights-uri, withdrawal-method, published-at]
      - recordType: person-notice-clause
        rowBoundaries: unrestricted
        operations: [get, list]
        readableFields: [notice, recipient, purpose, scope, data-life, description]
      actions:
      - action: give-person-consent
        operations: [invoke]
        targets:
        - {recordType: person-consent-link, rowBoundaries: [{field: principal, claim: registry_principal, operator: equals}]}
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-notice-clause, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
      - action: refuse-person-consent
        operations: [invoke]
        targets:
        - {recordType: person-consent-link, rowBoundaries: [{field: principal, claim: registry_principal, operator: equals}]}
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-notice-clause, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
      - action: withdraw-person-consent
        operations: [invoke]
        targets:
        - {recordType: person-consent-link, rowBoundaries: [{field: principal, claim: registry_principal, operator: equals}]}
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-notice-clause, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
  - id: person-consent-assisted-capture
    principalClaim: registry_principal
    requiredScopes: ['consent:person:capture']
    permissions:
      records:
      - recordType: person-notice-clause
        rowBoundaries: unrestricted
        operations: [get, list]
        readableFields: [notice, recipient, purpose, scope, data-life, description]
      actions:
      - action: record-person-consent-assisted
        operations: [invoke]
        targets:
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-notice-clause, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
  - id: person-consent-steward
    principalClaim: registry_principal
    requiredScopes: ['consent:person:steward']
    permissions:
      records:
      - recordType: person-privacy-notice
        rowBoundaries: unrestricted
        operations: [create, get, list]
        readableFields: [notice-version, language, title, text, text-uri, controller-name, controller-contact, jurisdiction, legal-basis, rights-statement, rights-uri, withdrawal-method, published-at]
        writableFields: [notice-version, language, title, text, text-uri, controller-name, controller-contact, jurisdiction, legal-basis, rights-statement, rights-uri, withdrawal-method, published-at]
      - recordType: person-notice-clause
        rowBoundaries: unrestricted
        operations: [create, get, list]
        readableFields: [notice, recipient, purpose, scope, data-life, description]
        writableFields: [notice, recipient, purpose, scope, data-life, description]
      - recordType: person-consent-decision
        rowBoundaries: unrestricted
        operations: [get, list]
        readableFields: [subject, link, notice, clause, recipient, purpose, scope, decision, effective-at, expires-at, channel, evidence, witness, invalidation-reason, source-reference]
      actions:
      - action: invalidate-person-consent
        operations: [invoke]
        targets:
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
      - action: import-person-consent
        operations: [invoke]
        targets:
        - {recordType: person, rowBoundaries: unrestricted}
        - {recordType: person-consent-decision, rowBoundaries: unrestricted}
        results: [decision]
  - id: person-consent-link-steward
    principalClaim: registry_principal
    requiredScopes: ['consent:person:link']
    permissions:
      records:
      - recordType: person-consent-link
        rowBoundaries: unrestricted
        operations: [create, get, list, patch]
        readableFields: [subject, principal, active]
        writableFields: [subject, principal, active]
  - id: person-consent-recipient
    principalClaim: registry_principal
    requiredScopes: ['consent:person:read']
    permissions:
      records:
      - recordType: person-consent-decision
        rowBoundaries:
        - {field: recipient, claim: 'registry:recipients', operator: in}
        operations: [get, list]
        readableFields: [subject, recipient, purpose, scope, decision, effective-at, expires-at]

datasets:
- id: consent-person-registry
- id: consent
