apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: starter-model-policy
    steps:
      - id: seed-variety-a
        entity: plant-variety
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: SYNTHETIC-VARIETY-A
            varietyDenomination: Example Amber
        expect:
          outcome: success
          status: 201
        capture: variety-a
      - id: seed-variety-b
        entity: plant-variety
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: SYNTHETIC-VARIETY-B
            varietyDenomination: Example Blue
        expect:
          outcome: success
          status: 201
        capture: variety-b
      - id: seed-source
        entity: seed-lot
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: SYNTHETIC-LOT-SOURCE
            lotNumber: SYN-2026-001
            quantityKg: '100.000'
            producedOn: '2026-01-15'
            variety:
              recordCapture: variety-a
        expect:
          outcome: success
          status: 201
        capture: source
      - id: seed-derived
        entity: seed-lot
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: SYNTHETIC-LOT-DERIVED
            lotNumber: SYN-2026-002
            quantityKg: '25.000'
            producedOn: '2026-01-20'
            variety:
              recordCapture: variety-a
            sourceLot:
              recordCapture: source
        expect:
          outcome: success
          status: 201
        capture: derived
      - id: seed-other
        entity: seed-lot
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: SYNTHETIC-LOT-OTHER
            lotNumber: SYN-2026-003
            quantityKg: '50.000'
            variety:
              recordCapture: variety-b
        expect:
          outcome: success
          status: 201
        capture: other
      - id: first-record
        entity: seed-lot
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            localIdentifier: JOURNEY-FIRST-001
            lotNumber: LOT-2026-010
            quantityKg: '25.000'
        expect:
          outcome: success
          status: 201
        capture: first-record
      - id: draft-correction
        entity: lot-number-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: create
          data:
            record:
              recordCapture: first-record
            reason: Synthetic spelling correction
            supportingReference: SYNTHETIC-SUPPORT-001
            lotNumber: LOT-2026-100
        expect:
          outcome: success
          status: 201
        capture: draft
      - id: before-submit
        entity: lot-number-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: get
          recordCapture: draft
        expect:
          outcome: success
          status: 200
        capture: before-submit
      - id: submit-correction
        entity: lot-number-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          type: submit-request
          etagCapture: before-submit
          recordCapture: before-submit
        expect:
          outcome: success
          status: 200
      - id: review
        entity: lot-number-correction
        accessProfile: reviewer
        claims:
          principal: synthetic-reviewer
          scopes:
            - starter:reviewer
          purpose: starter-learning
        request:
          type: get
          recordCapture: draft
        expect:
          outcome: success
          status: 200
        capture: review
      - id: approval-does-not-apply
        entity: seed-lot
        accessProfile: reader
        claims:
          principal: synthetic-reader
          scopes:
            - starter:reader
          purpose: starter-learning
        request:
          type: get
          recordCapture: first-record
        expect:
          outcome: success
          status: 200
          fields:
            localIdentifier: JOURNEY-FIRST-001
            lotNumber: LOT-2026-010
        capture: approval-does-not-apply
