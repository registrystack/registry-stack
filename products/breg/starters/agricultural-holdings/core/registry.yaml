# Registry project for the agricultural-holdings starter: the entities,
# access profiles, and catalogue description that `bregctl check`
# compiles into a running registry. Read MODEL.md alongside it for
# the reasoning behind these choices. canonicalBaseIri below is a
# reserved example.org name standing in for your registry's real
# identity; replace it before you build a production package.
apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: agricultural-holdings
  canonicalBaseIri: https://agricultural-holdings.example.org
  version: 0.1.0
  defaultLanguage: en
package:
  environment: local
  instanceId: agricultural-holdings-starter
  sequence: 1
  sourceRevision: agricultural-holdings-core-0.1.0
manifestProjection:
  accessProfile: editor
  classificationCeiling: restricted
  catalog:
    baseUrl: https://agricultural-holdings.example.org
    title: Agricultural holding register
    description: Maintain agricultural production units and separately asserted holder responsibilities.
    publisher:
      id: synthetic-custodian
      name: Synthetic example custodian
  publicService:
    id: directory-service
    title: Agricultural holding register
  datasets:
    - id: directory
      title: Agricultural holding register
      description: Maintain agricultural production units and separately asserted holder responsibilities.
      owner: Synthetic example custodian
      status: active
  dataServices:
    - id: directory-api
      title: Agricultural holding register
      endpointUrl: https://agricultural-holdings.example.org
      servesDatasets:
        - directory
  distributions: []
  entities:
    - id: farm
      title: Farm
      conceptUri: https://publicschema.org/agri/Farm
      identifiers:
        - field: local-identifier
          kind: local
      fields:
        - id: name
          concepts:
            - https://publicschema.org/name
    - id: person
      title: Person
      conceptUri: https://publicschema.org/Person
      identifiers:
        - field: local-identifier
          kind: local
      fields:
        - id: name
          concepts:
            - https://publicschema.org/name
    - id: organization
      title: Organization
      conceptUri: https://publicschema.org/Organization
      identifiers:
        - field: local-identifier
          kind: local
      fields:
        - id: name
          concepts:
            - https://publicschema.org/name
    - id: informal-group
      title: Informal Group
      conceptUri: https://publicschema.org/InformalGroup
      identifiers:
        - field: local-identifier
          kind: local
      fields:
        - id: name
          concepts:
            - https://publicschema.org/name
    - id: person-agricultural-holder-role
      title: Person Agricultural Holder Role
      conceptUri: https://publicschema.org/agri/PersonAgriculturalHolderRole
      identifiers: []
      fields:
        - id: holder-farm
          relationshipRole: holder-farm
          relationshipConceptUri: https://publicschema.org/agri/holder_farm
        - id: holder-person
          relationshipRole: holder-person
          relationshipConceptUri: https://publicschema.org/agri/holder_person
        - id: start-date
          concepts:
            - https://publicschema.org/start_date
        - id: end-date
          concepts:
            - https://publicschema.org/end_date
    - id: organization-agricultural-holder-role
      title: Organization Agricultural Holder Role
      conceptUri: https://publicschema.org/agri/OrganizationAgriculturalHolderRole
      identifiers: []
      fields:
        - id: holder-farm
          relationshipRole: holder-farm
          relationshipConceptUri: https://publicschema.org/agri/holder_farm
        - id: holder-organization
          relationshipRole: holder-organization
          relationshipConceptUri: https://publicschema.org/agri/holder_organization
        - id: start-date
          concepts:
            - https://publicschema.org/start_date
        - id: end-date
          concepts:
            - https://publicschema.org/end_date
    - id: group-agricultural-holder-role
      title: Group Agricultural Holder Role
      conceptUri: https://publicschema.org/agri/GroupAgriculturalHolderRole
      identifiers: []
      fields:
        - id: holder-farm
          relationshipRole: holder-farm
          relationshipConceptUri: https://publicschema.org/agri/holder_farm
        - id: holder-group
          relationshipRole: holder-group
          relationshipConceptUri: https://publicschema.org/agri/holder_group
        - id: start-date
          concepts:
            - https://publicschema.org/start_date
        - id: end-date
          concepts:
            - https://publicschema.org/end_date
entities:
  - id: farm
    primaryDataset: directory
    route: farms
    mutationMode: mutable
    classification: restricted
    fields:
      - id: local-identifier
        type: string
        required: true
        classification: restricted
        apiName: localIdentifier
        maxLength: 160
        minLength: 1
      - id: name
        type: string
        required: true
        classification: restricted
        maxLength: 160
        minLength: 1
    changeControl:
      requiredFor:
        - patch
    constraints:
      - kind: unique
        fields:
          - local-identifier
  - id: person
    primaryDataset: directory
    route: persons
    mutationMode: mutable
    classification: restricted
    fields:
      - id: local-identifier
        type: string
        required: true
        classification: restricted
        apiName: localIdentifier
        maxLength: 160
        minLength: 1
      - id: name
        type: string
        required: true
        classification: restricted
        maxLength: 160
        minLength: 1
    constraints:
      - kind: unique
        fields:
          - local-identifier
  - id: organization
    primaryDataset: directory
    route: organizations
    mutationMode: mutable
    classification: restricted
    fields:
      - id: local-identifier
        type: string
        required: true
        classification: restricted
        apiName: localIdentifier
        maxLength: 160
        minLength: 1
      - id: name
        type: string
        required: true
        classification: restricted
        maxLength: 160
        minLength: 1
    constraints:
      - kind: unique
        fields:
          - local-identifier
  - id: informal-group
    primaryDataset: directory
    route: informal-groups
    mutationMode: mutable
    classification: restricted
    fields:
      - id: local-identifier
        type: string
        required: true
        classification: restricted
        apiName: localIdentifier
        maxLength: 160
        minLength: 1
      - id: name
        type: string
        required: true
        classification: restricted
        maxLength: 160
        minLength: 1
    constraints:
      - kind: unique
        fields:
          - local-identifier
  - id: person-agricultural-holder-role
    primaryDataset: directory
    route: person-agricultural-holder-roles
    mutationMode: mutable
    classification: restricted
    fields:
      - id: holder-farm
        type: reference
        required: true
        classification: restricted
        target: farm
        apiName: holderFarm
      - id: holder-person
        type: reference
        required: true
        classification: restricted
        target: person
        apiName: holderPerson
      - id: start-date
        type: date
        required: false
        classification: restricted
        apiName: startDate
      - id: end-date
        type: date
        required: false
        classification: restricted
        apiName: endDate
    constraints:
      - kind: compare
        left: start-date
        operator: less_than_or_equal
        right: end-date
  - id: organization-agricultural-holder-role
    primaryDataset: directory
    route: organization-agricultural-holder-roles
    mutationMode: mutable
    classification: restricted
    fields:
      - id: holder-farm
        type: reference
        required: true
        classification: restricted
        target: farm
        apiName: holderFarm
      - id: holder-organization
        type: reference
        required: true
        classification: restricted
        target: organization
        apiName: holderOrganization
      - id: start-date
        type: date
        required: false
        classification: restricted
        apiName: startDate
      - id: end-date
        type: date
        required: false
        classification: restricted
        apiName: endDate
    constraints:
      - kind: compare
        left: start-date
        operator: less_than_or_equal
        right: end-date
  - id: group-agricultural-holder-role
    primaryDataset: directory
    route: group-agricultural-holder-roles
    mutationMode: mutable
    classification: restricted
    fields:
      - id: holder-farm
        type: reference
        required: true
        classification: restricted
        target: farm
        apiName: holderFarm
      - id: holder-group
        type: reference
        required: true
        classification: restricted
        target: informal-group
        apiName: holderGroup
      - id: start-date
        type: date
        required: false
        classification: restricted
        apiName: startDate
      - id: end-date
        type: date
        required: false
        classification: restricted
        apiName: endDate
    constraints:
      - kind: compare
        left: start-date
        operator: less_than_or_equal
        right: end-date
  - id: name-correction
    primaryDataset: directory
    route: name-corrections
    mutationMode: mutable
    classification: restricted
    fields:
      - id: record
        type: reference
        required: true
        classification: restricted
        target: farm
      - id: name
        type: string
        required: true
        classification: restricted
        maxLength: 160
        minLength: 1
      - id: reason
        type: string
        required: true
        classification: restricted
        maxLength: 500
        minLength: 1
      - id: supporting-reference
        type: string
        required: true
        classification: restricted
        apiName: supportingReference
        maxLength: 500
        minLength: 1
    changeRequest:
      effects:
        - target:
            fromField: record
          operation: patch
          set:
            name:
              fromField: name
      review:
        authority: casework
        policyId: name-correction
      onApproved:
        mode: manual
      retention:
        mode: operator_erase
accessProfiles:
  - id: reader
    default: false
    principalClaim: registry_principal
    requiredScopes:
      - starter:reader
    requiredPurposes:
      - starter-learning
    permissions:
      - entity: farm
        operations:
          - get
          - list
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
  - id: editor
    default: true
    principalClaim: registry_principal
    requiredScopes:
      - starter:editor
    requiredPurposes:
      - starter-learning
    permissions:
      - entity: farm
        operations:
          - get
          - list
          - revisions
          - create
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - local-identifier
          - name
      - entity: person
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - local-identifier
          - name
      - entity: organization
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - local-identifier
          - name
      - entity: informal-group
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - local-identifier
          - name
      - entity: person-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - holder-farm
          - holder-person
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - holder-farm
          - holder-person
          - start-date
          - end-date
      - entity: organization-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - holder-farm
          - holder-organization
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - holder-farm
          - holder-organization
          - start-date
          - end-date
      - entity: group-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
          - create
          - patch
        readableFields:
          - holder-farm
          - holder-group
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
        writableFields:
          - holder-farm
          - holder-group
          - start-date
          - end-date
      - entity: name-correction
        operations:
          - create
          - get
          - patch
          - submit_request
          - revise_request
          - cancel_request
        readableFields:
          - record
          - name
          - reason
          - supporting-reference
        writableFields:
          - record
          - name
          - reason
          - supporting-reference
        requestVisibility: owner
        rowBoundaries: []
        readableRequestFields:
          - reason
          - review_state
  - id: reviewer
    default: false
    principalClaim: registry_principal
    requiredScopes:
      - starter:reviewer
    requiredPurposes:
      - starter-learning
    permissions:
      - entity: farm
        operations:
          - get
          - list
          - revisions
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
      - entity: person
        operations:
          - get
          - list
          - revisions
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
      - entity: organization
        operations:
          - get
          - list
          - revisions
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
      - entity: informal-group
        operations:
          - get
          - list
          - revisions
        readableFields:
          - local-identifier
          - name
        rowBoundaries: []
        revisionAccess: true
      - entity: person-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
        readableFields:
          - holder-farm
          - holder-person
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
      - entity: organization-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
        readableFields:
          - holder-farm
          - holder-organization
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
      - entity: group-agricultural-holder-role
        operations:
          - get
          - list
          - revisions
        readableFields:
          - holder-farm
          - holder-group
          - start-date
          - end-date
        rowBoundaries: []
        revisionAccess: true
      - entity: name-correction
        operations:
          - get
          - apply_request
        readableFields:
          - record
          - name
          - reason
          - supporting-reference
        rowBoundaries: []
        applyTargets:
          - entity: farm
            rowBoundaries: []
        readableRequestFields:
          - reason
          - review_state
