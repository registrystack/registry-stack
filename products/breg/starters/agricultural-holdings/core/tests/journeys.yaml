apiVersion: registry.registrystack.org/breg-journeys/v1
journeys:
  - id: starter-model-policy
    steps:
      - id: seed-river
        entity: farm
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-RIVER
            name: River Holding
        expect:
          outcome: success
          status: 201
        capture: river
      - id: seed-landless
        entity: farm
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-LANDLESS
            name: Landless Cooperative Holding
        expect:
          outcome: success
          status: 201
        capture: landless
      - id: seed-collective
        entity: farm
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-COLLECTIVE
            name: Hill Collective Holding
        expect:
          outcome: success
          status: 201
        capture: collective
      - id: seed-ana
        entity: person
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-ANA
            name: Ana Example
        expect:
          outcome: success
          status: 201
        capture: ana
      - id: seed-bo
        entity: person
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-BO
            name: Bo Example
        expect:
          outcome: success
          status: 201
        capture: bo
      - id: seed-cooperative
        entity: organization
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-COOPERATIVE
            name: Example Agricultural Cooperative
        expect:
          outcome: success
          status: 201
        capture: cooperative
      - id: seed-group
        entity: informal-group
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: SYNTHETIC-GROUP
            name: Hill Growers Group
        expect:
          outcome: success
          status: 201
        capture: group
      - id: seed-ana-role
        entity: person-agricultural-holder-role
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            holderFarm:
              recordRef: river
            holderPerson:
              recordRef: ana
            startDate: '2026-01-01'
        expect:
          outcome: success
          status: 201
        capture: ana-role
      - id: seed-bo-role
        entity: person-agricultural-holder-role
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            holderFarm:
              recordRef: river
            holderPerson:
              recordRef: bo
            startDate: '2026-01-01'
        expect:
          outcome: success
          status: 201
        capture: bo-role
      - id: seed-cooperative-role
        entity: organization-agricultural-holder-role
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            holderFarm:
              recordRef: landless
            holderOrganization:
              recordRef: cooperative
            startDate: '2026-01-01'
        expect:
          outcome: success
          status: 201
        capture: cooperative-role
      - id: seed-group-role
        entity: group-agricultural-holder-role
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            holderFarm:
              recordRef: collective
            holderGroup:
              recordRef: group
            startDate: '2026-01-01'
        expect:
          outcome: success
          status: 201
        capture: group-role
      - id: first-record
        entity: farm
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            localIdentifier: JOURNEY-FIRST-001
            name: Frist Record
        expect:
          outcome: success
          status: 201
        capture: first-record
      - id: draft-correction
        entity: name-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: create
          data:
            record:
              recordRef: first-record
            name: First Record
            reason: Synthetic spelling correction
            supportingReference: SYNTHETIC-SUPPORT-001
        expect:
          outcome: success
          status: 201
        capture: draft
      - id: before-submit
        entity: name-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: get
          recordRef: draft
        expect:
          outcome: success
          status: 200
        capture: before-submit
      - id: submit-correction
        entity: name-correction
        accessProfile: editor
        claims:
          principal: synthetic-editor
          scopes:
            - starter:editor
          purpose: starter-learning
        request:
          operation: submit_request
          etagRef: before-submit
          recordRef: before-submit
        expect:
          outcome: success
          status: 200
      - id: review
        entity: name-correction
        accessProfile: reviewer
        claims:
          principal: synthetic-reviewer
          scopes:
            - starter:reviewer
          purpose: starter-learning
        request:
          operation: get
          recordRef: draft
        expect:
          outcome: success
          status: 200
        capture: review
      - id: approval-does-not-apply
        entity: farm
        accessProfile: reader
        claims:
          principal: synthetic-reader
          scopes:
            - starter:reader
          purpose: starter-learning
        request:
          operation: get
          recordRef: first-record
        expect:
          outcome: success
          status: 200
          fields:
            name: Frist Record
            localIdentifier: JOURNEY-FIRST-001
        capture: approval-does-not-apply
