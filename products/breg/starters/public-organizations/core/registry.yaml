        {
          "id": "supporting-reference",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "apiName": "supportingReference",
          "maxLength": 500,
          "minLength": 1
        }
      ],
      "changeRequest": {
        "effects": [
          {
            "target": {
              "fromField": "record"
            },
            "operation": "patch",
            "set": {
              "institution-from": {
                "fromField": "institution-from"
              },
              "institution-to": {
                "fromField": "institution-to"
              },
              "relationship-type": {
                "fromField": "relationship-type"
              },
              "start-date": {
                "fromField": "start-date"
              }
            }
          }
        ],
        "review": {
          "stages": [
            {
              "id": "review",
              "approvals": 1,
              "excludeSubmitter": true
            }
          ]
        },
        "application": {
          "mode": "manual"
        },
        "retention": {
          "mode": "operator_erase"
        }
      }
    }
