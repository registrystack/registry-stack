{
  "apiVersion": "registry.registrystack.org/v1alpha1",
  "kind": "RegistryProject",
  "registry": {
    "id": "public-organizations",
    "canonicalBaseIri": "https://public-organizations.example.org",
    "version": "0.1.0",
    "defaultLanguage": "en"
  },
  "package": {
    "environment": "local",
    "instanceId": "public-organizations-starter",
    "sequence": 1,
    "sourceRevision": "public-organizations-core-0.1.0"
  },
  "manifestProjection": {
    "accessProfile": "reader",
    "classificationCeiling": "restricted",
    "catalog": {
      "baseUrl": "https://public-organizations.example.org",
      "title": "Public organization directory",
      "description": "Maintain a small authenticated directory of public organizations and dated institutional links.",
      "publisher": {
        "id": "synthetic-custodian",
        "name": "Synthetic example custodian"
      }
    },
    "publicService": {
      "id": "directory-service",
      "title": "Public organization directory"
    },
    "datasets": [
      {
        "id": "directory",
        "title": "Public organization directory",
        "description": "Maintain a small authenticated directory of public organizations and dated institutional links.",
        "owner": "Synthetic example custodian",
        "status": "active"
      }
    ],
    "dataServices": [
      {
        "id": "directory-api",
        "title": "Public organization directory",
        "endpointUrl": "https://public-organizations.example.org",
        "servesDatasets": [
          "directory"
        ]
      }
    ],
    "distributions": [],
    "entities": [
      {
        "id": "public-organization",
        "title": "Public Organization",
        "conceptUri": "https://publicschema.org/PublicOrganization",
        "identifiers": [
          {
            "field": "local-identifier",
            "kind": "local"
          }
        ],
        "fields": [
          {
            "id": "name",
            "concepts": [
              "https://publicschema.org/name"
            ]
          },
          {
            "id": "description",
            "concepts": [
              "https://publicschema.org/public_mandate"
            ]
          }
        ]
      },
      {
        "id": "institutional-relationship",
        "title": "Institutional Relationship",
        "conceptUri": "https://publicschema.org/InstitutionalRelationship",
        "identifiers": [],
        "fields": [
          {
            "id": "institution-from",
            "relationshipRole": "institution-from",
            "relationshipConceptUri": "https://publicschema.org/institution_from"
          },
          {
            "id": "institution-to",
            "relationshipRole": "institution-to",
            "relationshipConceptUri": "https://publicschema.org/institution_to"
          },
          {
            "id": "relationship-type",
            "concepts": [
              "https://publicschema.org/institutional_relationship_type"
            ]
          },
          {
            "id": "start-date",
            "concepts": [
              "https://publicschema.org/start_date"
            ]
          },
          {
            "id": "end-date",
            "concepts": [
              "https://publicschema.org/end_date"
            ]
          }
        ]
      }
    ]
  },
  "entities": [
    {
      "id": "public-organization",
      "primaryDataset": "directory",
      "route": "public-organizations",
      "mutationMode": "mutable",
      "classification": "restricted",
      "fields": [
        {
          "id": "local-identifier",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "apiName": "localIdentifier",
          "maxLength": 160,
          "minLength": 1
        },
        {
          "id": "name",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "maxLength": 160,
          "minLength": 1
        },
        {
          "id": "description",
          "type": "string",
          "required": false,
          "classification": "restricted",
          "maxLength": 500,
          "minLength": 1
        }
      ],
      "changeControl": {
        "requiredFor": [
          "patch"
        ]
      },
      "constraints": [
        {
          "kind": "unique",
          "fields": [
            "local-identifier"
          ]
        }
      ]
    },
    {
      "id": "institutional-relationship",
      "primaryDataset": "directory",
      "route": "institutional-relationships",
      "mutationMode": "mutable",
      "classification": "restricted",
      "fields": [
        {
          "id": "institution-from",
          "type": "reference",
          "required": true,
          "classification": "restricted",
          "target": "public-organization",
          "apiName": "institutionFrom"
        },
        {
          "id": "institution-to",
          "type": "reference",
          "required": true,
          "classification": "restricted",
          "target": "public-organization",
          "apiName": "institutionTo"
        },
        {
          "id": "relationship-type",
          "type": "vocabulary-code",
          "required": true,
          "classification": "restricted",
          "apiName": "relationshipType",
          "vocabulary": "https://public-organizations.example.org/relationship-types",
          "values": [
            "reports-to"
          ]
        },
        {
          "id": "start-date",
          "type": "date",
          "required": true,
          "classification": "restricted",
          "apiName": "startDate"
        },
        {
          "id": "end-date",
          "type": "date",
          "required": false,
          "classification": "restricted",
          "apiName": "endDate"
        }
      ],
      "changeControl": {
        "requiredFor": [
          "patch"
        ]
      },
      "constraints": [
        {
          "kind": "compare",
          "left": "start-date",
          "operator": "less_than_or_equal",
          "right": "end-date"
        }
      ]
    },
    {
      "id": "name-correction",
      "primaryDataset": "directory",
      "route": "name-corrections",
      "mutationMode": "mutable",
      "classification": "restricted",
      "fields": [
        {
          "id": "record",
          "type": "reference",
          "required": true,
          "classification": "restricted",
          "target": "public-organization"
        },
        {
          "id": "name",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "maxLength": 160,
          "minLength": 1
        },
        {
          "id": "reason",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "maxLength": 500,
          "minLength": 1
        },
        {
          "id": "supporting-reference",
          "type": "string",
          "required": true,
          "classification": "restricted",
          "apiName": "supportingReference",
          "maxLength": 500,
          "minLength": 1
        }
      ],
      "changeRequest": {
        "effects": [
          {
            "target": {
              "fromField": "record"
            },
            "operation": "patch",
            "set": {
              "name": {
                "fromField": "name"
              }
            }
          }
        ],
        "review": {
          "stages": [
            {
              "id": "review",
              "approvals": 1,
              "excludeSubmitter": true
            }
          ]
        },
        "application": {
          "mode": "manual"
        },
        "retention": {
          "mode": "operator_erase"
        }
      }
    },
    {
      "id": "relationship-correction",
      "primaryDataset": "directory",
      "route": "relationship-corrections",
      "mutationMode": "mutable",
      "classification": "restricted",
      "fields": [
        {
          "id": "record",
          "type": "reference",
          "required": true,
          "classification": "restricted",
          "target": "institutional-relationship"
        },
        {
          "id": "institution-from",
          "type": "reference",
