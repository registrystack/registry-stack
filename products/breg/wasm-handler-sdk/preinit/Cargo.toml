[package]
name = "breg-wasm-preinit"
description = "Build-time pre-initializer for BREG WASM handler modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Version-matched pre-initializer from the pinned Wasmtime release line; the
# wasmtime feature enables the run() wrapper that drives our own Store.
wasmtime-wizer = { version = "=48.0.2", features = ["wasmtime"] }
wasmtime = "=48.0.2"
tokio = { version = "1", features = ["rt"] }
