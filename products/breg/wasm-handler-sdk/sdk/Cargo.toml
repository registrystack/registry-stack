[package]
name = "registry-breg-wasm-sdk"
description = "Rust SDK for authoring Base Registry Engine WASM action handlers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The package follows the registry- naming convention; handler authors
# import the short name.
name = "breg_wasm_sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
