  - {id: BREG-SEC-01, state: enforced, targetWave: W4, threat: Deployment bindings alter governed behavior after package review., enforcementPoint: package loader and runtime binding parser, refusal: Reject a package or runtime binding that mixes governed model bytes with deployment-only values., negativeId: BREG-NEG-01, negativeTest: {path: crates/registry-breg/tests/postgres_package.rs, name: package_binding_refuses_wrong_environment_instance_database_sequence_and_prior}}
