apiVersion: registry.registrystack.org/product-contract/v1
product: breg
invariants:
  - {id: BREG-SEC-01, state: enforced, targetWave: W4, threat: Deployment bindings alter governed behavior after package review., enforcementPoint: package loader and runtime binding parser, refusal: Reject a package or runtime binding that mixes governed model bytes with deployment-only values., negativeId: BREG-NEG-01, negativeTest: {path: crates/registry-breg/tests/postgres_package.rs, name: package_binding_refuses_wrong_environment_instance_database_sequence_and_prior}}
  - {id: BREG-SEC-02, state: enforced, targetWave: W4, threat: "A tampered, wrong-environment, stale, or wrong-database package becomes active.", enforcementPoint: package verification and activation ledger, refusal: "Refuse activation before readiness when identity, signature, environment, sequence, or database binding is invalid.", negativeId: BREG-NEG-02, negativeTest: {path: crates/registry-breg/tests/postgres_package.rs, name: real_postgres_package_startup_apply_failure_and_old_process_are_closed}}
  - {id: BREG-SEC-03, state: enforced, targetWave: W2, threat: Records change while migrations or activation are incomplete., enforcementPoint: advisory locks and durable maintenance state, refusal: Refuse record operations while maintenance is active or the active package differs., negativeId: BREG-NEG-03, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-04, state: enforced, targetWave: W2, threat: The runtime can alter schema or bypass row-security administration., enforcementPoint: PostgreSQL role bootstrap and startup verification, refusal: "Refuse startup when runtime or migration roles violate ownership, privilege, or extension boundaries.", negativeId: BREG-NEG-04, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-05, state: enforced, targetWave: W3, threat: A caller selects an ungranted profile or learns protected resource existence or Registry Record contract metadata., enforcementPoint: compiled route and access inventory, refusal: Treat unknown or unauthorized profile and resource combinations as the same value-free absence outcome before record I/O without profile schema context or link hints., negativeId: BREG-NEG-05, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: profile_and_resource_concealment_complete_before_record_io}}
  - {id: BREG-SEC-06, state: enforced, targetWave: W3, threat: Fallback claims or mismatched row rules grant authority., enforcementPoint: verified-claim mapper and generated RLS policy, refusal: Deny absent or malformed direct authority claims before record I/O and deny rows outside the matching RLS boundary., negativeId: BREG-NEG-06, negativeTest: {path: crates/registry-breg/tests/http_auth.rs, name: missing_malformed_or_fallback_only_principal_is_refused_before_record_io}}
  - {id: BREG-SEC-07, state: enforced, targetWave: W2, threat: Transaction-local claim context leaks through a reused database connection., enforcementPoint: pool checkout cleanup and transaction-local context installation, refusal: Abort the request and discard an unsafe connection rather than reuse stale context., negativeId: BREG-NEG-07, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-08, state: enforced, targetWave: W3, threat: Classified metadata or non-public fields become public inputs or outputs., enforcementPoint: compiler classification and profile projection checks, refusal: Reject an unsafe package and refuse an operation that crosses the public-processing floor., negativeId: BREG-NEG-08, negativeTest: {path: crates/registry-breg/tests/compiler_contract.rs, name: public_profile_cannot_process_an_internal_field}}
  - {id: BREG-SEC-09, state: enforced, targetWave: W3, threat: Constraint failures disclose hidden rows or values., enforcementPoint: mutation problem mapping and database diagnostic filter, refusal: Return a stable value-free conflict or absence problem without physical names or values., negativeId: BREG-NEG-09, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-10, state: enforced, targetWave: W3, threat: "A partial mutation commits record state without its revision, audit, idempotency, or event history.", enforcementPoint: single record transaction coordinator, refusal: Roll back every mutation component and release no success response when any terminal component fails., negativeId: BREG-NEG-10, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-11, state: enforced, targetWave: W3, threat: Protected response bytes or Registry Record metadata are released before an accountable attempt and terminal audit exist., enforcementPoint: protected-read and mutation response-release gate, refusal: Assemble the exact media-specific response before terminal audit then return service unavailable without releasing it if the audit cannot commit., negativeId: BREG-NEG-11, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: BREG-SEC-12, state: enforced, targetWave: W3, threat: "An ETag or idempotency result is replayed under a different access context or response representation.", enforcementPoint: authenticated ETag and idempotency binding, refusal: "Reject a replay whose package, profile, principal, purpose, row boundary, projection, negotiated representation, or canonical request context differs.", negativeId: BREG-NEG-12, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-13, state: enforced, targetWave: W3, threat: "Problems, logs, metrics, traces, or database diagnostics disclose data, credentials, or physical structure.", enforcementPoint: closed diagnostic vocabulary and telemetry boundary, refusal: Replace unsafe detail with a stable value-free problem and suppress unsafe telemetry fields., negativeId: BREG-NEG-13, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: BREG-SEC-14, state: enforced, targetWave: W1, threat: Different generated surfaces or physical names diverge from the reviewed configuration., enforcementPoint: canonical compiler and artifact inventory comparison, refusal: Reject non-deterministic or inconsistent compilation before package creation., negativeId: BREG-NEG-14, negativeTest: {path: crates/registry-breg/tests/compiler_contract.rs, name: duplicate_routes_fail_before_artifact_generation}}
  - {id: BREG-SEC-15, state: enforced, targetWave: W5, threat: "A condition leaks a more-classified field through event presence, captured values reach widened or substituted egress, erased data is replayed, or an upgrade strands retained delivery work.", enforcementPoint: "compiler-derived event classification, exact activated destination authority, transactional capture, durable CloudEvents delivery and retention, and activation compatibility interlock", refusal: "Reject underclassified conditions, widened runtime ceilings, mismatched destination bindings or payloads, stale, non-dead-letter, or erased replay, and changed or removed bindings with deliverable retained work before egress or activation.", negativeId: BREG-NEG-15, negativeTest: {path: crates/registry-breg/tests/postgres_webhook_delivery.rs, name: real_postgres_webhook_delivery_retry_dead_letter_replay_is_package_bound_audited_and_confined}}
  - {id: BREG-SEC-16, state: enforced, targetWave: W5, threat: A domain fixture gains hidden production behavior through a hard-coded runtime concept., enforcementPoint: self-tested source-neutrality gate over production source and public kernel contracts, refusal: Reject any acceptance-fixture identifier planted in the runtime source or public kernel contract., negativeId: BREG-NEG-16, negativeTest: {path: products/breg/scripts/test_check_source_neutrality.py, name: test_fixture_identifier_in_production_source_is_rejected}}
  - {id: BREG-SEC-17, state: enforced, targetWave: W3, threat: An encrypted cursor is replayed under a different authorized query context., enforcementPoint: fresh HTTP authorization plus authenticated cursor opening and PostgreSQL ReadPlan binding recomputation, refusal: "Reject before SQL when package, route, operation, profile, principal, purpose, row boundary, projection, filter, sort, temporal instant, page size, or expiry differs.", negativeId: BREG-NEG-17, negativeTest: {path: crates/registry-breg/tests/postgres_read.rs, name: real_postgres_temporal_keyset_and_cursor_binding_edges_are_enforced}}
  - {id: BREG-SEC-18, state: enforced, targetWave: W5, threat: A bulk request bypasses per-item authority or commits a valid prefix after a later item fails., enforcementPoint: configured Batch route and single-transaction mutation coordinator, refusal: "Refuse the complete request before record I/O when its bounds, operation, profile, or mutation mode is invalid; otherwise roll back every item and release nothing when any item or terminal component fails.", negativeId: BREG-NEG-18, negativeTest: {path: crates/registry-breg/tests/postgres_batch.rs, name: real_postgres_batch_is_bounded_authorized_atomic_and_exactly_replayable}}
  - {id: BREG-SEC-19, state: enforced, targetWave: W5, threat: "A malformed, private, ambiguous, denied, or wrong-algorithm operator-pinned JWKS selects unintended verification material or leaks key metadata.", enforcementPoint: static JWKS validation before verifier construction in production startup and schema-test execution, refusal: "Reject the complete bounded document unless it is a strict duplicate-free set of valid public keys exactly bound to the configured algorithm, signature use, verification operation, and kid policy.", negativeId: BREG-NEG-19, negativeTest: {path: crates/registry-breg/tests/runtime_config.rs, name: static_jwks_validation_refuses_unsafe_documents_value_free}}
  - {id: BREG-SEC-20, state: enforced, targetWave: W3, threat: "A lookup selector accepts partial, extra, mistyped, caller-supplied claim values, queries unbounded rows, or otherwise becomes an enumeration oracle.", enforcementPoint: compiled selector grant bounded lookup request parser and two-row PostgreSQL limit, refusal: "Require the selector's exact configured field set and origin, query at most two rows, and collapse unknown, ungranted, missing-claim, zero-match, and multiple-match outcomes to one value-free unresolved response without audit cardinality.", negativeId: BREG-NEG-20, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: lookup_body_exactness_origin_types_and_unresolved_equivalence_are_value_free}}
  - {id: BREG-SEC-21, state: enforced, targetWave: W3, threat: "A relationship traversal inherits direct target rights or widens its configured target projection, filtering, ordering, or count authority.", enforcementPoint: compiled named read-path grant and route-specific query plan, refusal: "Require an independently granted path and enforce only that path's target fields and query capabilities; conceal unknown and ungranted paths identically before record I/O.", negativeId: BREG-NEG-21, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: relationship_route_uses_path_grant_not_direct_target_rights}}
  - {id: BREG-SEC-22, state: enforced, targetWave: W5, threat: A new profile or relationship grant omits mandatory entity access restrictions., enforcementPoint: compiler access requirements after module composition and before artifact generation, refusal: Reject profiles missing mandatory scopes or row bindings or widening allowed purposes; reject relationship grants whose target or join row requirements cannot be enforced., negativeId: BREG-NEG-22, negativeTest: {path: crates/registry-breg/tests/access_configuration.rs, name: requirements_are_mandatory_not_grants_and_cannot_be_weakened_by_profiles}}
  - {id: BREG-SEC-23, state: enforced, targetWave: W5, threat: A caller uses map membership to query a Point without explicit spatial authority., enforcementPoint: compiled direct-list bbox grant and HTTP query admission, refusal: Reject malformed or undeclared bbox queries before record-service entry and retain the exact selected profile., negativeId: BREG-NEG-23, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: bbox_reaches_record_service_only_with_declared_spatial_grant}}
  - {id: BREG-SEC-24, state: enforced, targetWave: W5, threat: Spatial predicates resolve through caller-controlled objects or a bbox role with excess authority., enforcementPoint: qualified PostGIS prerequisite verification and bbox role validation, refusal: Reject missing or misplaced extension prerequisites and bbox role privilege or membership drift before spatial execution., negativeId: BREG-NEG-24, negativeTest: {path: crates/registry-breg/tests/postgres_spatial_storage.rs, name: real_postgres_postgis_prerequisites_are_role_bound_and_shadow_resistant}}
  - {id: BREG-SEC-25, state: enforced, targetWave: W5, threat: A Rhai planner widens its package-declared entity target binding operation or field ceiling and turns script output into record authority., enforcementPoint: compiler-owned effect ceiling and the shared canonical proposal verifier before target locks or writes, refusal: Reject every undeclared write dimension before target locking and grant no authority from planner output., negativeId: BREG-NEG-25, negativeTest: {path: crates/registry-breg/src/request_prepare/tests.rs, name: rhai_planner_refuses_authority_ceiling_escape_before_target_locks}}
  - {id: BREG-SEC-26, state: enforced, targetWave: W5, threat: A Rhai planner bypasses configured review or fabricates a human decision through its result or application disposition., enforcementPoint: closed planner result ABI frozen separately from the static review policy and the canonical lifecycle transition engine, refusal: Reject planner-owned review fields and keep application unavailable until every configured stage is satisfied without synthesizing approval for a no-review policy., negativeId: BREG-NEG-26, negativeTest: {path: crates/registry-breg/src/request_workflow.rs, name: rhai_planner_review_policy_cannot_be_forged_or_bypassed}}
  - {id: BREG-SEC-27, state: enforced, targetWave: W5, threat: Changed omitted swapped or tampered Rhai bytes reinterpret a reviewed or queued proposal., enforcementPoint: package script capture and activation rederivation plus immutable proposal binding to ABI script digest contract fingerprint canonical effects target revisions and effect digest, refusal: Refuse invalid package activation and never rerun a changed script during review application retry activation history or receipt replay; use the exact frozen plan or refuse., negativeId: BREG-NEG-27, negativeTest: {path: crates/registry-breg/src/request_workflow.rs, name: rhai_planner_package_and_frozen_proposal_bind_exact_script}}
  - {id: BREG-SEC-28, state: enforced, targetWave: W5, threat: A Rhai planner observes undeclared request fields target rows claims credentials secrets or ambient process state., enforcementPoint: package-declared request-field projection and a closed fresh Rhai engine without I/O environment clock randomness imports debug or target-read capabilities, refusal: Refuse undeclared input or engine capabilities and make protected canary values unreachable from planner input and output., negativeId: BREG-NEG-28, negativeTest: {path: crates/registry-breg/tests/compiler_rhai_planner.rs, name: rhai_planner_input_and_engine_capabilities_are_closed}}
  - {id: BREG-SEC-29, state: enforced, targetWave: W5, threat: A buggy or hostile Rhai planner exhausts CPU stack memory proposal capacity or its request deadline and leaves the service unhealthy., enforcementPoint: package and runtime operation depth string collection input output proposal and deadline limits with fresh per-invocation state, refusal: Terminate over-budget execution with no frozen proposal lock or mutation allow no late commit and keep subsequent planner requests healthy., negativeId: BREG-NEG-29, negativeTest: {path: crates/registry-breg/tests/compiler_rhai_planner.rs, name: rhai_planner_resource_limits_and_deadline_leave_runtime_healthy}}
  - {id: BREG-SEC-30, state: enforced, targetWave: W5, threat: Rhai exceptions script fragments runtime values or dynamic queue reasons disclose request or operational data., enforcementPoint: value-free planner error mapping closed package-declared queue-reason catalog and minimized response log metric and audit vocabulary, refusal: Return one stable value-free failure for planner errors and reject undeclared reason strings without rendering script source dynamic values internal paths or canaries., negativeId: BREG-NEG-30, negativeTest: {path: crates/registry-breg/tests/compiler_rhai_planner.rs, name: rhai_planner_errors_and_queue_reasons_are_value_free}}
  - {id: BREG-SEC-31, state: enforced, targetWave: W5, threat: Automatic planner application unions actor profiles creates service authority falls back silently to a queue or commits a request transition separately from its effects., enforcementPoint: selected-profile application authorization and the canonical single-transaction lifecycle and mutation coordinator under the authenticated readiness actor, refusal: Refuse automatic application unless the same selected profile has ordinary application and target authority and roll back the transition effects receipt revision event outbox and audit together on denial stale state or failure., negativeId: BREG-NEG-31, negativeTest: {path: crates/registry-breg/tests/postgres_rhai_planner.rs, name: rhai_planner_automatic_transition_requires_same_profile_and_is_atomic}}
  - {id: BREG-SEC-32, state: enforced, targetWave: W5, threat: "An omitted row declaration silently grants all records.", enforcementPoint: "authoring deserialization and generated schema", refusal: "Reject every row-bearing grant without an explicit rowBoundaries declaration; an empty array grants all rows only within mandatory requirements.", negativeId: BREG-NEG-32, negativeTest: {path: crates/registry-breg/tests/explicit_row_authority.rs, name: every_row_bearing_grant_requires_an_explicit_declaration}}
  - {id: BREG-SEC-33, state: enforced, targetWave: W5, threat: "A request with an ambiguous profile selects broader authority implicitly.", enforcementPoint: "compiled optional route default and HTTP profile selection", refusal: "Require an explicit profile when multiple profiles serve a route without a default; refuse before record I/O without searching for a qualifying profile.", negativeId: BREG-NEG-33, negativeTest: {path: crates/registry-breg/tests/http_auth.rs, name: ambiguous_route_without_default_requires_explicit_selection_without_guessing_authority}}
  - {id: BREG-SEC-34, state: enforced, targetWave: W5, threat: "One actor satisfies successive review stages that require independent reviewers.", enforcementPoint: "frozen review policy and canonical workflow transition", refusal: "When excludePreviousReviewers is configured reject a prior-stage actor for the same proposal version including after workflow restoration.", negativeId: BREG-NEG-34, negativeTest: {path: crates/registry-breg/src/request_workflow.rs, name: prior_stage_actor_is_excluded_only_when_the_stage_requires_independence}}
