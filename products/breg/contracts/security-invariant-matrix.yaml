  - {id: BREG-SEC-103, state: enforced, targetWave: W5, threat: "An ingestion run is cancelled, blocked, or has a replayed receipt released while the audit writer is unavailable.", enforcementPoint: "cancel_ingestion_run appends a correlated ingestion request entry before its first run read or write; submit_ingestion_chunk already reads the run and the active package binding to select a branch, and its blocked and replayed-release branches append a correlated request entry before the write that follows, not before that earlier read. A chunk-mismatch branch moves the attempt marker through a best-effort call with no request entry, the same audit posture as an ordinary mutation refusal.", refusal: "Refuse the cancellation, blocking, or replayed release as unavailable and leave the run's status and attempt marker unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-103, negativeTest: {path: crates/registry-breg/tests/postgres_ingestion_runs.rs, name: run_cancellation_closes_nothing_when_the_audit_writer_refuses_its_request_entry}}
