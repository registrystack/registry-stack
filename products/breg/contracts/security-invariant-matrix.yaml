  - {"id": "BREG-SEC-179", "state": "enforced", "targetWave": "W5", "threat": "A Proposal read discloses who applied work without dedicated authority, borrows wider authority from a selected profile or sibling delegated bound, or correlates the actor across issuer or database boundaries.", "enforcementPoint": "Proposal Get authorization plus the supplemental get-application-actor operation in the same selected profile and, for delegated reads, the exact Proposal task-grant bound; keyed breg-proposal-actor-v1 derivation scoped to database and verified issuer; closed Get, List and per-version application projections.", "refusal": "Serve appliedBy and appliedAt together only on Proposal Get and the per-version submission read when the selected Get profile also holds get-application-actor and any task grant carries that operation for the exact Proposal; omit both from every List item, ungranted read and lifecycle response; serve no raw issuer or subject, and derive a different pseudonym for another issuer.", "negativeId": "BREG-NEG-179", "negativeTest": {"path": "crates/registry-breg/tests/postgres_proposal.rs", "name": "application_actor_requires_its_dedicated_get_grant_and_is_issuer_scoped"}}
