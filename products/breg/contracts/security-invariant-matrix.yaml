  - {id: BREG-SEC-130, state: enforced, targetWave: W5, threat: 'A read made under delegated authority, or a delegated attempt at an immediate action, is journaled as though the principal acted directly, so the agent or task grant behind it cannot be traced.', enforcementPoint: authorization audit projection on read terminal records and immediate-action records, refusal: 'Carry the authorization object from the verified claims into the read and action claim contexts and write it on read terminal records and immediate-action records, with the grant fields for a task grant, a keyed actor pseudonym for a trusted actor, and no object for a direct token.', negativeId: BREG-NEG-130, negativeTest: {path: crates/registry-breg/tests/postgres_action_task_grants.rs, name: task_action_scope_subjects_replay_and_fresh_revocation_are_enforced}}
  - {id: BREG-SEC-131, state: enforced, targetWave: W5, threat: "A standing agent invokes an immediate Action that commits effects without an authorized task grant.", enforcementPoint: "compiler validation of project actorKind agent profiles without taskGrant and current Invoke admission", refusal: "Refuse an Invoke grant with breg.access-profile.standing-agent-action-forbidden; a permitted Proposal Start remains available and does not confer immediate mutation authority.", negativeId: BREG-NEG-131, negativeTest: {path: crates/registry-breg/tests/standing_agent_ceiling.rs, name: standing_agent_cannot_hold_an_immediate_action}}
  - {id: BREG-SEC-132, state: enforced, targetWave: W5, threat: "A module contributes an access profile with a taskGrant, so it escapes the standing-agent ceiling and meets no task-grant ceiling, because task-grant ceilings are checked only on project accessProfiles.", enforcementPoint: "compiler validation of module-contributed entity access profiles before project access expansion", refusal: "Refuse the package with breg.access-profile.task-grant-module-forbidden when a module entity or entity extension contributes an access profile declaring a taskGrant.", negativeId: BREG-NEG-132, negativeTest: {path: crates/registry-breg/tests/standing_agent_ceiling.rs, name: module_contributed_profiles_cannot_declare_a_task_grant}}
  - {id: BREG-SEC-133, state: enforced, targetWave: W5, threat: "A caller with record-read authority reads another subject's access history.", enforcementPoint: "current GET authorization and stored subjectField equality inside the guarded PostgreSQL transaction", refusal: "Conceal a log unless the current verified principal owns the currently visible record.", negativeId: BREG-NEG-133, negativeTest: {path: crates/registry-breg/tests/postgres_access_log.rs, name: subject_access_log_requires_current_record_ownership_and_records_each_read_hit}}
