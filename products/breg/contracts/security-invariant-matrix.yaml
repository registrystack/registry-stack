  - {id: BREG-SEC-24, state: enforced, targetWave: W5, threat: Spatial predicates resolve through caller-controlled objects or a bbox role with excess authority., enforcementPoint: qualified PostGIS prerequisite verification and bbox role validation, refusal: Reject missing or misplaced extension prerequisites and bbox role privilege or membership drift before spatial execution., negativeId: BREG-NEG-24, negativeTest: {path: crates/registry-breg/tests/postgres_spatial_storage.rs, name: real_postgres_postgis_prerequisites_are_role_bound_and_shadow_resistant}}
  - {id: BREG-SEC-25, state: enforced, targetWave: W5, threat: A Rhai planner widens its package-declared entity target binding operation or field ceiling and turns script output into record authority., enforcementPoint: compiler-owned effect ceiling and the shared canonical proposal verifier before target locks or writes, refusal: Reject every undeclared write dimension before target locking and grant no authority from planner output., negativeId: BREG-NEG-25, negativeTest: {path: crates/registry-breg/src/request_prepare/tests.rs, name: rhai_planner_refuses_authority_ceiling_escape_before_target_locks}}
