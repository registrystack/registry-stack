  - {id: BREG-SEC-96, state: enforced, targetWave: W5, threat: "A read path from an ungated root reaches a gated intermediate or target entity without its consent check.", enforcementPoint: "compiler read-path consent validation", refusal: "Reject a read path whose intermediate or target entity is gated with breg.consent.require-read-path-target.", negativeId: BREG-NEG-96, negativeTest: {path: crates/registry-breg/tests/consent_access.rs, name: read_paths_cannot_reach_a_gated_entity}}
