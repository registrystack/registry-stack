  - {id: BREG-SEC-142, state: enforced, targetWave: W5, threat: "A revision an immediate action creates or patches is journaled under provenance the history reader refuses, leaving the record's history unreadable, or a forged or foreign operation identifier, including an effect identifier an action declares, passes as action provenance.", enforcementPoint: "MutationTransaction journals each create or patch effect revision under records.<entity>.create or records.<entity>.patch, and valid_revision_provenance accepts only that canonical record operation for the read entity and mutation kind, or a request journal operation on a request lifecycle revision, and never an effect or action identifier", refusal: "Read an action-written revision through the revisions route like any direct write, and answer 503 source.unavailable for an effect identifier the writing action declares, an undeclared effect, an effect declared against another entity, a declared effect with another mutation kind, an action identifier, or another entity's record operation.", negativeId: BREG-NEG-142, negativeTest: {path: crates/registry-breg/tests/postgres_immediate_actions.rs, name: action_written_revisions_are_readable_through_revision_history}}
  - {id: BREG-SEC-143, state: enforced, targetWave: W3, threat: "Reviewed derived SQL admits unreviewed grammar that reshapes related record values.", enforcementPoint: "derived_sql raw-node allowlist and explicit JSON_VALUE and JSON_EXISTS descendant validation", refusal: "Refuse every unlisted raw node and unsafe function or relation, including inside SQL/JSON expressions, before compilation.", negativeId: BREG-NEG-143, negativeTest: {path: crates/registry-breg/src/derived_sql.rs, name: raw_node_allowlist_refuses_unreviewed_sql_json_xml_and_hidden_descendants}}
  - {id: BREG-SEC-144, state: enforced, targetWave: W3, threat: "A derived value silently truncates or rounds, or violates its published field contract.", enforcementPoint: "generated_ddl derived-view projection guards before target casts", refusal: "Refuse invalid derived values with a row-dependent field-identifying error that contains no source value; release no reshaped answer.", negativeId: BREG-NEG-144, negativeTest: {path: crates/registry-breg/tests/postgres_derived_values.rs, name: real_postgres_derived_values_enforce_declared_contracts}}
