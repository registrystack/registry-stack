  - {id: BREG-SEC-105, state: enforced, targetWave: W5, threat: "History coverage is rebaselined while the audit writer is unavailable.", enforcementPoint: "rebaseline_history_coverage appends a minimized rebaseline request entry before its coverage transaction opens", refusal: "Refuse the rebaseline as unavailable and leave coverage unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-105, negativeTest: {path: crates/registry-breg/tests/postgres_history_rebaseline.rs, name: rebaseline_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-106, state: enforced, targetWave: W5, threat: "Operator request-detail erasure erases change-request detail while the audit writer is unavailable.", enforcementPoint: "the request retention erase path appends a minimized retention request entry before its verified transaction opens", refusal: "Refuse the erasure as unavailable and leave the request detail unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-106, negativeTest: {path: crates/registry-breg/tests/postgres_request_read_retention.rs, name: request_detail_erasure_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-107, state: enforced, targetWave: W5, threat: "Migration reconciliation completes or reverts a pinned target while the audit writer is unavailable.", enforcementPoint: "reconcile_under_lock appends a minimized reconciliation request entry before activating or reverting the pinned target", refusal: "Refuse the reconciliation as unavailable and leave the maintenance state, ledger, and steps unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-107, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_reconciliation_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-108, state: enforced, targetWave: W5, threat: "The field-encryption erase-history lifecycle scrubs request snapshots or erases history while the audit writer is unavailable.", enforcementPoint: "scrub_plaintext_request_snapshots appends a minimized lifecycle request entry once a recorded erase-and-rebaseline flip makes the run a lifecycle and before its first scrub", refusal: "Refuse the lifecycle as unavailable and leave request snapshots, record history, lifecycle progress, and coverage unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-108, negativeTest: {path: crates/registry-breg/tests/postgres_history_erasure.rs, name: field_encryption_erasure_resumes_rebaseline_after_final_erase_crash}}
  - {id: BREG-SEC-109, state: enforced, targetWave: W5, threat: "An import grant writes a governed entity with no operator-opened window, bypassing change control.", enforcementPoint: "import run creation in the run-creation transaction (import_authority::admit_run)", refusal: "Refuse an import run with precondition.failed unless the entity holds an open, unexpired, current-revision import authority for the selected profile whose remaining volume covers the announced item count and whose pinned digests, when present, list the input digest the run announces (a client-supplied label the server records and does not recompute); the refused run never exists.", negativeId: BREG-NEG-109, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: an_import_run_is_refused_without_an_open_authority}}
  - {id: BREG-SEC-110, state: enforced, targetWave: W5, threat: "An import run keeps writing after its authority closed, expired, ran out, or was superseded by a package activation.", enforcementPoint: "the ingestion chunk transaction, after the run lock and before item writes (import_authority::admit_chunk under a row lock)", refusal: "Block the run with importAuthorityClosed and commit nothing from the refused chunk; committed chunks stay.", negativeId: BREG-NEG-110, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: closing_the_authority_blocks_the_next_chunk_and_keeps_committed_ones}}
  - {id: BREG-SEC-111, state: enforced, targetWave: W5, threat: "A chunk writes more items than the operator approved for the window.", enforcementPoint: "the ingestion chunk transaction counting committed items against the authority under a row lock", refusal: "Refuse a chunk whose items exceed the authority's remaining volume and record the authority exhausted.", negativeId: BREG-NEG-111, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: every_chunk_counts_against_the_authority_until_it_is_exhausted}}
