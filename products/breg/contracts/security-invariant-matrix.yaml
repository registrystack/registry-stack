  - {"id": "BREG-SEC-162", "state": "enforced", "targetWave": "W5", "threat": "Rotating audit.hashKeyRef orphans a spent idempotency key, so an exact retry of a committed write executes it a second time.", "enforcementPoint": "spent-key identity and request binding derived with SHA-256 from the verified caller, key scope, key, and exact request, never from the audit hash key", "refusal": "After a rotation, replay the held response of an exact retry and refuse a changed request as idempotency.key-reused; the rotation changes audit pseudonyms only and never re-executes a committed write.", "negativeId": "BREG-NEG-162", "negativeTest": {"path": "crates/registry-breg/tests/postgres_mutation.rs", "name": "real_postgres_exact_retry_after_audit_key_rotation_replays_and_never_reexecutes"}}
  - {"id": "BREG-SEC-163", "state": "enforced", "targetWave": "W5", "threat": "One caller's idempotency key replays another caller's held response or blocks another caller's request.", "enforcementPoint": "spent-key lookup by verified issuer, subject, key scope, and key under a per-caller advisory lock", "refusal": "Find a held response only for the caller that spent the key; the same key from another caller is that caller's own unspent key and never reads or conflicts with the first caller's response.", "negativeId": "BREG-NEG-163", "negativeTest": {"path": "crates/registry-breg/tests/postgres_mutation.rs", "name": "real_postgres_idempotency_keys_are_scoped_per_caller"}}
  - {"id": "BREG-SEC-164", "state": "enforced", "targetWave": "W5", "threat": "A retry after the receipt horizon, or after the operator drops held responses, executes a committed write again.", "enforcementPoint": "receipt horizon checked when the spent key is read, and an operator-only sweep under migration authority that drops held bytes and keeps the spent row", "refusal": "Answer 410 idempotency.expired past the horizon without executing, whether or not the held response was dropped, except that a key whose response an erasure removed answers 409 idempotency.key-reused on either side of the horizon; the sweep keeps the key reference, binding, and times so the key stays spent.", "negativeId": "BREG-NEG-164", "negativeTest": {"path": "crates/registry-breg/tests/postgres_mutation.rs", "name": "real_postgres_retry_after_receipt_horizon_is_refused_and_the_sweep_keeps_the_key_spent"}}
  - {"id": "BREG-SEC-165", "state": "enforced", "targetWave": "W5", "threat": "The raw issuer, principal value, and idempotency key of every spent key stay stored for as long as the registry keeps the spent row, long after the receipt that needed them.", "enforcementPoint": "the operator-only receipt sweep under migration authority, and a table check that holds the raw caller and key exactly while the receipt is held", "refusal": "Clear the raw issuer, subject, and key with the held response of every spent key past its horizon, including keys whose response an erasure already removed, and keep the key spent by its digest: every key answers as it did before the sweep (the exact retry of a key no erasure reached 410 idempotency.expired, a changed retry 409 idempotency.key-reused, any retry of a key whose response an erasure removed 409 idempotency.key-reused), and no row keeps a raw caller once its receipt is dropped.", "negativeId": "BREG-NEG-165", "negativeTest": {"path": "crates/registry-breg/tests/postgres_mutation.rs", "name": "real_postgres_receipt_sweep_clears_the_raw_caller_of_every_expired_spent_key"}}
  - {"id": "BREG-SEC-166", "state": "enforced", "targetWave": "W5", "threat": "A configured caller issuer inside the engine's own issuer namespace lets a verified caller reserve, replay, or block the keys the engine spends itself, such as a hook delivery's proposal application.", "enforcementPoint": "IdempotencyPolicy construction from runtime configuration", "refusal": "Refuse an empty issuer and every issuer under urn:registry-breg:, the namespace of the embedded and hook-delivery issuers, before the policy exists.", "negativeId": "BREG-NEG-166", "negativeTest": {"path": "crates/registry-breg/src/idempotency.rs", "name": "a_policy_refuses_every_issuer_the_engine_reserves"}}
