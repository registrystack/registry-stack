  - {id: BREG-SEC-130, state: enforced, targetWave: W5, threat: "A read made under delegated authority, or a delegated attempt at an immediate action, is journaled as though the principal acted directly, so the agent or task grant behind it cannot be traced.", enforcementPoint: "authorization audit projection on read terminal records and immediate-action records", refusal: "Carry the authorization object from the verified claims into the read and action claim contexts and write it on read terminal records and immediate-action records, with the grant fields for a task grant, a keyed actor pseudonym for a trusted actor, and no object for a direct token.", negativeId: BREG-NEG-130, negativeTest: {path: crates/registry-breg/tests/postgres_task_grants.rs, name: standing_agent_audit_records_the_delegated_actor_by_pseudonym}}
  - {id: BREG-SEC-131, state: enforced, targetWave: W5, threat: "A standing agent profile, which carries no human approval, invokes an immediate action that commits its effects with no draft for the person to confirm.", enforcementPoint: "compiler validation of every project access profile declaring actorKind agent without a taskGrant; module-contributed entity profiles cannot grant invoke", refusal: "Refuse the package with access_profile.standing_agent.action_forbidden when such a profile holds an action permission.", negativeId: BREG-NEG-131, negativeTest: {path: crates/registry-breg/tests/standing_agent_ceiling.rs, name: standing_agent_cannot_hold_an_immediate_action}}
  - {id: BREG-SEC-132, state: enforced, targetWave: W5, threat: "A module contributes an access profile with a taskGrant, so it escapes the standing-agent ceiling and meets no task-grant ceiling, because task-grant ceilings are checked only on project accessProfiles.", enforcementPoint: "compiler validation of module-contributed entity access profiles before project access expansion", refusal: "Refuse the package with access_profile.task_grant.module_forbidden when a module entity or entity extension contributes an access profile declaring a taskGrant.", negativeId: BREG-NEG-132, negativeTest: {path: crates/registry-breg/tests/standing_agent_ceiling.rs, name: module_contributed_profiles_cannot_declare_a_task_grant}}
