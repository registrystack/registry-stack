  - {id: BREG-SEC-140, state: enforced, targetWave: W5, threat: "An operator discard races a live delivery, targets stale state, silently replays work under a replacement binding, erases payload still needed by a sibling, or commits without an answered audit request.", enforcementPoint: "the owned webhook discard task under the verified delivery transaction, generation and lease guards, the shared outbox lock, and correlated discard audit", refusal: "Discard only retained pending work, a dead letter with retained payload, or an expired lease at its exact generation; never send it under another binding, preserve payload while a sibling needs it, refuse active leases and stale state, and answer every accepted discard request after commit recovery even when the caller leaves.", negativeId: BREG-NEG-140, negativeTest: {path: crates/registry-breg/tests/postgres_webhook_delivery.rs, name: real_postgres_webhook_delivery_retry_dead_letter_replay_is_package_bound_audited_and_confined}}
