  - {id: BREG-SEC-127, state: enforced, targetWave: W5, threat: An agent selects an untyped action profile and gains an immediate mutation without delegated task authority., enforcementPoint: selected-profile actor-kind and Action authority admission, refusal: Refuse an agent at an untyped immediate-action profile before entering the mutation service., negativeId: BREG-NEG-127, negativeTest: {path: crates/registry-breg/src/api/tests/immediate_action_tests.rs, name: standing_agent_cannot_use_an_untyped_immediate_profile}}
  - {id: BREG-SEC-128, state: enforced, targetWave: W5, threat: "An agent invokes an immediate Action through an ordinary profile without explicit task authority.", enforcementPoint: "Action admission after actor-kind, selected-profile and TaskGrant binding checks", refusal: "Refuse a trusted actor or actorKind agent without a grant at Invoke. A grant requires the selected agent profile's own taskGrant declaration, exact source/client/principal/purpose and requested action:id/invoke bound; an ordinary or human profile cannot admit it.", negativeId: BREG-NEG-128, negativeTest: {path: crates/registry-breg/src/api/tests/immediate_action_tests.rs, name: delegated_token_is_refused_at_immediate_action_admission}}
