  - {id: BREG-SEC-145, state: enforced, targetWave: W3, threat: "Reviewed derived SQL invokes an unlisted cast or attribute-notation function, or captures a whole source row under one derived value.", enforcementPoint: "derived_sql cast-target admission and SELECT-scoped resolution against compiler-known source, CTE, and subquery columns", refusal: "Refuse unreviewed cast targets, row expressions, whole-row names, and names that do not resolve to a column of their exact range before compilation.", negativeId: BREG-NEG-145, negativeTest: {path: crates/registry-breg/src/derived_sql.rs, name: casts_rows_and_attribute_notation_stay_inside_the_reviewed_scalar_surface}}
  - {id: BREG-SEC-146, state: enforced, targetWave: W5, threat: "A background worker or the metrics listener panics or returns while the process keeps serving, so webhook delivery, attachment verification, review submission and application, or subject access log retention halts with nothing to show it.", enforcementPoint: "serve supervises every background task it spawns: a task that panics or returns before shutdown is requested emits its closed value-free panicked or returned operational event, triggers graceful shutdown of the rest, and returns StartupError::BackgroundTaskStopped, which the breg binary turns into exit status 1", refusal: "Stop serving and exit nonzero for the supervisor to restart rather than answer requests without the stopped task; a requested shutdown reports no stop.", negativeId: BREG-NEG-146, negativeTest: {path: crates/registry-breg/tests/startup_http.rs, name: a_panicking_background_task_stops_serve_with_a_distinct_error}}
  - {id: BREG-SEC-147, state: enforced, targetWave: W5, threat: "A migration lock another session holds passes as an unreachable database, or a reconciliation acts on an identity an apply, an adoption, or another reconciliation is changing, or one assessed without the lock.", enforcementPoint: "acquire_inner and lock_registry, which history, action Evidence retention, request retention, import authority, and instance claim maintenance take the lock through, map a lock wait ended by the lock or statement timeout to MigrationLockHeld; refusal_before_maintenance keeps it apart from DatabaseUnavailable; reconcile_failed_migration takes the exclusive migration lock and re-reads the maintenance snapshot under it before assessing, and refuses a snapshot whose identity differs from the one its caller read", refusal: "Report a held lock as in progress: assessment answers in_progress, execution refuses as NotExecutable(InProgress), apply refuses before maintenance, and history erasure and rebaseline, action Evidence retention, request retention, import authority, and instance claim maintenance refuse before their transaction changes anything, each changing nothing; refuse a changed identity rather than reconcile it.", negativeId: BREG-NEG-147, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_reconciliation_reports_a_held_migration_lock_as_in_progress}}
  - {id: BREG-SEC-148, state: enforced, targetWave: W5, threat: "An apply or plan activates or assesses another package than the one the operator reviewed, because the directory --package names was replaced or rebuilt between review and activation.", enforcementPoint: "apply_lifecycle execute compares the verified target package digest with the operator's --expected-digest right after load_package and before DatabaseAccess::resolve; parse_expected_digest admits only a sha256 label", refusal: "Refuse with apply.package.digest_mismatch, naming the expected and the found package digest, before any database authority is resolved or contacted, so nothing changes; refuse a value that is not sha256: and 64 lowercase hex digits as a usage error.", negativeId: BREG-NEG-148, negativeTest: {path: crates/registry-bregctl/tests/cli.rs, name: apply_and_plan_refuse_a_package_other_than_the_expected_digest_before_database_contact}}
  - {id: BREG-SEC-149, state: enforced, targetWave: W5, threat: "A build without WASM support compiles or loads a package with a WASM hook handler, so a hook the reviewed package declares is activated but can never run, and its event fails only when it fires.", enforcementPoint: "validate_hook_assets in a build without the wasm feature refuses every WASM hook handler before its module is looked up; package loading rederives through the same compiler, so activation refuses the package too", refusal: "Refuse compilation with hook.handler.wasm_build_unsupported at entities[].hooks[].handler.kind, naming the build rather than the module, and emit no module diagnostic.", negativeId: BREG-NEG-149, negativeTest: {path: crates/registry-breg/tests/hook_declaration.rs, name: a_wasm_hook_is_refused_by_a_build_without_wasm_support}}
