  - {id: BREG-SEC-137, state: enforced, targetWave: W5, threat: "A relationship read inherits the exemption of an unrelated same-named target profile or loses its governed source-profile delay.", enforcementPoint: "compiled exemption sourceEntity and verified source entity/profile matching when each target access is recorded", refusal: "Apply a visibility delay only for the declared source entity and profile; an unrelated profile name cannot conceal an access.", negativeId: BREG-NEG-137, negativeTest: {path: crates/registry-breg/tests/postgres_access_log.rs, name: relationship_exemptions_bind_the_source_entity_without_profile_name_collisions}}
