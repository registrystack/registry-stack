  - {id: BREG-SEC-135, state: enforced, targetWave: W5, threat: "A delayed entry is silently omitted or a runtime deletes unexpired subject access history.", enforcementPoint: "immutable access entries with governed visibility delay and expiring rows; bounded expiry-only PostgreSQL function", refusal: "Persist exempt reads and audit their policy reference; conceal delayed and expired entries and refuse arbitrary runtime updates or deletes.", negativeId: BREG-NEG-135, negativeTest: {path: crates/registry-breg/tests/postgres_access_log.rs, name: access_log_exemptions_are_delayed_audited_and_expire_without_runtime_delete_authority}}
  - {id: BREG-SEC-136, state: enforced, targetWave: W5, threat: "A protected record is returned without its required subject access entry.", enforcementPoint: "access log insertion inside the materialized read transaction before response release", refusal: "Refuse the complete read when its access log insertion fails.", negativeId: BREG-NEG-136, negativeTest: {path: crates/registry-breg/tests/postgres_access_log.rs, name: a_failed_subject_access_log_insert_prevents_record_release}}
  - {id: BREG-SEC-137, state: enforced, targetWave: W5, threat: "A relationship read inherits the exemption of an unrelated same-named target profile or loses its governed source-profile delay.", enforcementPoint: "compiled exemption sourceRecordType and verified source record type/profile matching when each target access is recorded", refusal: "Apply a visibility delay only for the declared source entity and profile; an unrelated profile name cannot conceal an access.", negativeId: BREG-NEG-137, negativeTest: {path: crates/registry-breg/tests/postgres_access_log.rs, name: relationship_exemptions_bind_the_source_entity_without_profile_name_collisions}}
  - {id: BREG-SEC-138, state: enforced, targetWave: W5, threat: "A direct create or patch writes a row outside the caller's row boundary, or its refusal discloses the prospective value.", enforcementPoint: "prospective-row boundary check in the mutation transaction before any write, with the generated RLS policy as the storage backstop", refusal: "Refuse a direct create or patch whose prospective row violates the caller's row boundary with a value-free 412 precondition.failed response before any write, audit it as a refusal, and keep a genuine PostgreSQL privilege failure an unavailable response.", negativeId: BREG-NEG-138, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_row_boundary_write_refusals_are_safe_audited_and_atomic}}
