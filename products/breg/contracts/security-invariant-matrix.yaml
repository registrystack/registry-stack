  - {id: BREG-SEC-51, state: enforced, targetWave: W5, threat: An attachment slot hash media type or size changes without changing proposal integrity., enforcementPoint: immutable attachment manifest in the Proposal digest and exact slot meaning in the acyclic review-context schema digest, refusal: A changed attachment manifest cannot reuse the existing proposal digest and a remapped document or changed slot policy cannot reuse the context contract., negativeId: BREG-NEG-51, negativeTest: {path: crates/registry-breg/src/proposal_workflow.rs, name: proposal_digest_binds_attachment_hash_type_size_and_slot}}
  - {id: BREG-SEC-52, state: enforced, targetWave: W5, threat: Scoped Proposal detail erasure deletes content still required by another retained Proposal., enforcementPoint: native Proposal attachment reference erasure and shared-content locks, refusal: Revoke only the erased Proposal reference and retain shared bytes until the final live reference is erased., negativeId: BREG-NEG-52, negativeTest: {path: crates/registry-breg/tests/postgres_native_retention.rs, name: shared_attachment_bytes_survive_until_the_last_native_proposal_erasure}}
