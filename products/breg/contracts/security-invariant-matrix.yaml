  - {id: BREG-SEC-103, state: enforced, targetWave: W5, threat: "An ingestion run is cancelled, blocked, or has a replayed receipt released while the audit writer is unavailable.", enforcementPoint: "cancel_ingestion_run appends a correlated ingestion request entry before its first run read or write; submit_ingestion_chunk already reads the run and the active package binding to select a branch, and its blocked and replayed-release branches append a correlated request entry before the write that follows, not before that earlier read. A chunk-mismatch branch moves the attempt marker through a best-effort call with no request entry, the same audit posture as an ordinary mutation refusal.", refusal: "Refuse the cancellation, blocking, or replayed release as unavailable and leave the run's status and attempt marker unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-103, negativeTest: {path: crates/registry-breg/tests/postgres_ingestion_runs.rs, name: run_cancellation_closes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-104, state: enforced, targetWave: W5, threat: "Standalone record history erasure deletes retained history while the audit writer is unavailable.", enforcementPoint: "erase_record_history appends a minimized erasure request entry before its erasure transaction opens", refusal: "Refuse the erasure as unavailable and leave every retained revision and the commit head unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-104, negativeTest: {path: crates/registry-breg/tests/postgres_history_erasure.rs, name: erasure_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-105, state: enforced, targetWave: W5, threat: "History coverage is rebaselined while the audit writer is unavailable.", enforcementPoint: "rebaseline_history_coverage appends a minimized rebaseline request entry before its coverage transaction opens", refusal: "Refuse the rebaseline as unavailable and leave coverage unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-105, negativeTest: {path: crates/registry-breg/tests/postgres_history_rebaseline.rs, name: rebaseline_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-106, state: enforced, targetWave: W5, threat: Operator Proposal detail erasure changes retained data while its request audit is unavailable., enforcementPoint: verified ProposalRetentionOperatorService erasure with request audit accepted before the mutation transaction, refusal: Leave retained detail and attachments unchanged if the audit writer refuses the request entry., negativeId: BREG-NEG-106, negativeTest: {path: crates/registry-breg/tests/postgres_native_retention.rs, name: native_proposal_erasure_refuses_a_failed_request_audit_without_changing_detail}}
  - {id: BREG-SEC-107, state: enforced, targetWave: W5, threat: "Migration reconciliation completes or reverts a pinned target while the audit writer is unavailable.", enforcementPoint: "reconcile_under_lock appends a minimized reconciliation request entry before activating or reverting the pinned target", refusal: "Refuse the reconciliation as unavailable and leave the maintenance state, ledger, and steps unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-107, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_reconciliation_changes_nothing_when_the_audit_writer_refuses_its_request_entry}}
  - {id: BREG-SEC-108, state: enforced, targetWave: W5, threat: "The field-encryption erase-history lifecycle scrubs Proposal snapshots or erases history while the audit writer is unavailable.", enforcementPoint: "scrub_plaintext_proposal_snapshots appends a minimized lifecycle request entry once a recorded erase-and-rebaseline flip makes the run a lifecycle and before its first scrub", refusal: "Refuse the lifecycle as unavailable and leave Proposal snapshots, record history, lifecycle progress, and coverage unchanged when the audit writer does not accept the request entry.", negativeId: BREG-NEG-108, negativeTest: {path: crates/registry-breg/tests/postgres_history_erasure.rs, name: field_encryption_erasure_resumes_rebaseline_after_final_erase_crash}}
  - {id: BREG-SEC-109, state: enforced, targetWave: W5, threat: "An import grant writes a governed entity with no operator-opened window, bypassing change control.", enforcementPoint: "import run creation in the run-creation transaction (import_authority::admit_run)", refusal: "Refuse an import run with precondition.failed unless the entity holds an open, unexpired, current-revision import authority for the selected profile whose remaining volume covers the announced item count and whose pinned digests, when present, list the input digest the run announces (a client-supplied label the server records and does not recompute); the refused run never exists.", negativeId: BREG-NEG-109, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: an_import_run_is_refused_without_an_open_authority}}
  - {id: BREG-SEC-110, state: enforced, targetWave: W5, threat: "An import run keeps writing after its authority closed, expired, ran out, or was superseded by a package activation.", enforcementPoint: "the ingestion chunk transaction, after the run lock and before item writes (import_authority::admit_chunk under a row lock)", refusal: "Block the run with importAuthorityClosed and commit nothing from the refused chunk; committed chunks stay.", negativeId: BREG-NEG-110, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: closing_the_authority_blocks_the_next_chunk_and_keeps_committed_ones}}
  - {id: BREG-SEC-111, state: enforced, targetWave: W5, threat: "A chunk writes more items than the operator approved for the window.", enforcementPoint: "the ingestion chunk transaction counting committed items against the authority under a row lock", refusal: "Refuse a chunk whose items exceed the authority's remaining volume and record the authority exhausted.", negativeId: BREG-NEG-111, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: every_chunk_counts_against_the_authority_until_it_is_exhausted}}
  - {id: BREG-SEC-112, state: enforced, targetWave: W5, threat: "The runtime role opens, closes, or reopens an import authority for itself.", enforcementPoint: "row-level security and column grants on registry_import_authorities", refusal: "Grant the runtime role only SELECT and an UPDATE of the counter and terminal status of an open row; opening and closing remain with the migration role.", negativeId: BREG-NEG-112, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: the_runtime_role_cannot_open_close_or_reopen_an_authority}}
  - {id: BREG-SEC-113, state: enforced, targetWave: W5, threat: "A separately granted batch operation bypasses Proposal-required Record creation policy and writes outside the governed application path.", enforcementPoint: "native Record route authorization and Proposal-required mutation policy", refusal: "Refuse direct batch creation when the Record mutation policy requires a Proposal, including a separately granted batch operation.", negativeId: BREG-NEG-113, negativeTest: {path: crates/registry-breg/tests/postgres_batch.rs, name: a_batch_grant_cannot_bypass_proposal_required_create_policy}}
  - {id: BREG-SEC-114, state: enforced, targetWave: W5, threat: "A restored copy of the database serves beside its original, so the two become divergent writers of one Registry: both accept writes, admit imports, and deliver outbox work from the same history.", enforcementPoint: "startup and readiness, against the instance claim recorded in registry_state; the system identifier is compared when both the claim and the live database expose it, and the database oid alone otherwise", refusal: "Refuse to start and answer readiness 503 with startup.instance-claim.mismatch until an operator adopts the copy under the migration role.", negativeId: BREG-NEG-114, negativeTest: {path: crates/registry-breg/tests/postgres_startup.rs, name: a_restored_copy_refuses_to_serve_until_adopted}}
  - {id: BREG-SEC-115, state: enforced, targetWave: W5, threat: "The runtime role rewrites, inserts, or removes the instance claim so a copy adopts itself.", enforcementPoint: "table grants on registry_state, which records the instance claim", refusal: "Grant the runtime role only SELECT; adopting remains with the migration role.", negativeId: BREG-NEG-115, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: the_runtime_role_cannot_rewrite_or_remove_the_instance_claim}}
  - {id: BREG-SEC-116, state: enforced, targetWave: W5, threat: "A restored copy brings back an import authority the operator closed after the backup was taken, so an import grant writes through a window that no longer exists.", enforcementPoint: "InstanceClaimService::adopt, inside the adopt transaction (import_authority::supersede_every_open)", refusal: "Supersede every open import authority in the transaction that moves the claim, appending each transition record once it commits, so an import run on the adopted copy is refused until an operator opens a new authority.", negativeId: BREG-NEG-116, negativeTest: {path: crates/registry-breg/tests/postgres_import_authority.rs, name: adopting_a_restored_copy_supersedes_every_open_authority}}
  - {id: BREG-SEC-117, state: enforced, targetWave: W5, threat: "A restored copy of a claimed registry records itself as the claim on its next apply and serves beside its original.", enforcementPoint: "instance_claim record_if_unclaimed, in the activation transaction that commits the ledger row", refusal: "An activation records the claim only into a state row that carries none, as a registry upgraded from a release before the claim does; a recorded claim is kept, so a restored copy keeps its original's claim and refuses to serve until an operator runs `bregctl instance-claim adopt`.", negativeId: BREG-NEG-117, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_an_activation_keeps_a_claim_that_names_another_database}}
  - {id: BREG-SEC-118, state: enforced, targetWave: W4, threat: "A split-role runtime role writes the activation ledger or the registry state, directly, through membership in the migration role, through ownership of a registry object (a deferred constraint trigger that runs as the migration role when apply commits), through CREATE on a registry schema, or through a trigger no compiled migration creates, and so changes which package the runtime serves.", enforcementPoint: "postgres roles find_runtime_write_authority, called by split apply under the apply lock before the registry enters maintenance", refusal: "Refuse the apply, writing nothing, and name the one statement that removes the authority: ALTER ROLE .. NOSUPERUSER, a REVOKE, REASSIGN OWNED BY followed by `bregctl apply`, or DROP TRIGGER.", negativeId: BREG-NEG-118, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_split_apply_names_the_fix_for_every_runtime_write_authority}}
  - {id: BREG-SEC-119, state: enforced, targetWave: W4, threat: "A registry serves under split roles with a runtime role that can write the activation ledger or the registry state, without the grants the active package gives it, or under a one-role runtime file on a database last activated for a separate runtime role.", enforcementPoint: "startup verify_configured_runtime_role, verify_runtime_grants, and verify_single_role_activation, before readiness", refusal: "Refuse to start, bind no listener, write nothing, and name the apply that names or reissues the fix.", negativeId: BREG-NEG-119, negativeTest: {path: crates/registry-breg/tests/postgres_startup.rs, name: split_startup_refuses_a_runtime_role_that_can_write_the_ledger_and_writes_nothing}}
  - {id: BREG-SEC-120, state: enforced, targetWave: W4, threat: "An activation changes the registry with no audit trace, because the audit destination refuses or is unavailable.", enforcementPoint: "migration ActivationAttempt::begin appends the breg-activation-audit/v1 request entry before any activation state changes, and the terminal response follows the verified durable outcome", refusal: "Refuse the activation as ActivationAuditUnavailable and leave the database as apply found it when the audit does not accept the request entry; answer every accepted request with applied, refused, failed, or the registered unfinished response. Report a response refused after the commit as ActivationAuditIncomplete; report an unrecorded pre-maintenance refusal as ActivationRefusalAuditIncomplete while the registry stays ready with no pinned target.", negativeId: BREG-NEG-120, negativeTest: {path: crates/registry-breg/tests/support/hook_activation.rs, name: retained_hook_refusal_audit_failures_preserve_ready_state}}
  - {id: BREG-SEC-121, state: enforced, targetWave: W4, threat: "The operator reference given to an activation is disclosed through the activation ledger, the activation audit, or command output.", enforcementPoint: "migration activate: offline operator reference checks before any connection, and operator_reference_hash keyed under breg-activation-operator-reference-v1 with the activation id as context", refusal: "Refuse an empty, oversized, or control-bearing reference, or any reference under an unkeyed audit profile, before any connection; store and audit only the keyed hash, and never repeat the raw reference.", negativeId: BREG-NEG-121, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_an_operator_reference_is_recorded_only_as_its_keyed_hash}}
  - {id: BREG-SEC-122, state: enforced, targetWave: W4, threat: "A database holding registry state this release does not recognise, such as the kernel a release before the activation ledger installed, is served, planned, applied over, or read as though the activation ledger recorded it, so the runtime or an activation trusts state no ledger row describes.", enforcementPoint: "postgres registry_state_shape, read from the catalog before startup, status, plan, or apply reads or writes registry state", refusal: "Refuse startup as UnrecognizedDatabase and status, plan, and apply as MigrationError::UnrecognizedDatabase, with one generic refusal that names no recorded value, binding no listener and changing nothing; a release reads only the state its immediate predecessor wrote.", negativeId: BREG-NEG-122, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: real_postgres_an_unrecognised_registry_state_is_refused_and_changes_nothing}}
  - {id: BREG-SEC-123, state: enforced, targetWave: W5, threat: "An institutional agent without a task grant gains Proposal operations beyond starting and editing its caller-owned draft.", enforcementPoint: "compiled Proposal grants and current operation admission, including an actorKind agent token without an act claim", refusal: "Refuse no-task agent Proposal grants other than caller-owned Edit; permit only Start and caller-owned draft Edit at runtime. Other lifecycle and inspection operations require explicit delegated or human authority.", negativeId: BREG-NEG-123, negativeTest: {path: crates/registry-breg/tests/standing_agent_ceiling.rs, name: standing_agent_cannot_hold_a_proposal_lifecycle_decision}}
