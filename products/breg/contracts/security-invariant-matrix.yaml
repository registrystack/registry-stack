  - {"id": "BREG-SEC-177", "state": "enforced", "targetWave": "W5", "threat": "A per-version or current Proposal read serves reviewer text beyond the public reason (the private result, notes, internal reason or reviewer identity), discloses a version's review state or decision to a caller without current Proposal Get authority, or outlives the result and receipt retention windows.", "enforcementPoint": "Proposal Get authorization and document authorization shared with the ordinary Proposal read; a closed submission projection; a decision read through the review protocol's ReviewResult that projects only status, completedAt as decidedAt and publicReason; a fixed audit marker when a public reason is served; and the review result availableUntil and receipt erasure checks.", "refusal": "Conceal the submission without Get authority or for a non-canonical or unknown version; disclose review state, resultId, completedAt, availableUntil and decision of every retained version to every Get holder by design, with no separate grant to withhold them; never serve the reviewer's private result, notes, internal reason or identity; record the public reason as a marker, never its text; and answer proposal.submission_expired with a zero result count once neither the review result nor the receipt is retained.", "negativeId": "BREG-NEG-177", "negativeTest": {"path": "crates/registry-breg/tests/postgres_proposal.rs", "name": "submission_read_reports_each_version_separately_and_is_gone_after_its_windows"}}
