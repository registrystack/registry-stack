apiVersion: registry.registrystack.org/product-contract/v1
product: breg
invariants:
  - {id: BREG-SEC-01, state: enforced, targetWave: W4, threat: Deployment bindings alter governed behavior after package review., enforcementPoint: package loader and runtime binding parser, refusal: Reject a package or runtime binding that mixes governed model bytes with deployment-only values., negativeId: BREG-NEG-01, negativeTest: {path: crates/registry-breg/tests/compiler_contract.rs, name: deployment_identity_keys_in_the_project_are_refused_as_unknown_fields}}
  - {id: BREG-SEC-02, state: enforced, targetWave: W4, threat: "A tampered, stale, older, wrong-registry, or wrong-database package becomes active.", enforcementPoint: "package verification (SHA256SUMS and the optional package.expectedDigest pin) and the activation ledger: apply requires migrationPlan.fromPackageDigest to name the ledger's active package digest, and startup requires identity.databaseId and the package digest to equal what the ledger recorded", refusal: "Refuse activation and startup before readiness when the package bytes, its predecessor digest, its registry, the database id, or the active package digest does not match; no signature or trust anchor is consulted.", negativeId: BREG-NEG-02, negativeTest: {path: crates/registry-breg/tests/postgres_package.rs, name: real_postgres_package_startup_apply_failure_and_old_process_are_closed}}
  - {id: BREG-SEC-03, state: enforced, targetWave: W2, threat: Records change while migrations or activation are incomplete., enforcementPoint: advisory locks and durable maintenance state, refusal: "Refuse record operations while maintenance is active or the active package differs. A read linearizes at query time: its read transaction checks maintenance status and active package identity, and a result materialized under that authority may still be released after a later activation or maintenance start, because the terminal response entry is not a second package or maintenance fence.", negativeId: BREG-NEG-03, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-04, state: enforced, targetWave: W2, threat: The runtime can alter schema or bypass row-security administration., enforcementPoint: PostgreSQL role bootstrap and startup verification, refusal: "Refuse startup when runtime or migration roles violate ownership, privilege, or extension boundaries.", negativeId: BREG-NEG-04, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-05, state: enforced, targetWave: W3, threat: A caller selects an ungranted profile or learns protected resource existence or Registry Record contract metadata., enforcementPoint: compiled route and access inventory, refusal: Treat unknown or unauthorized profile and resource combinations as the same value-free absence outcome before record I/O without profile schema context or link hints., negativeId: BREG-NEG-05, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: profile_and_resource_concealment_complete_before_record_io}}
  - {id: BREG-SEC-06, state: enforced, targetWave: W3, threat: Fallback claims or mismatched row rules grant authority., enforcementPoint: verified-claim mapper and generated RLS policy, refusal: Deny absent or malformed direct authority claims before record I/O and deny rows outside the matching RLS boundary., negativeId: BREG-NEG-06, negativeTest: {path: crates/registry-breg/tests/http_auth.rs, name: missing_malformed_or_fallback_only_principal_is_refused_before_record_io}}
  - {id: BREG-SEC-07, state: enforced, targetWave: W2, threat: Transaction-local claim context leaks through a reused database connection., enforcementPoint: pool checkout cleanup and transaction-local context installation, refusal: Abort the request and discard an unsafe connection rather than reuse stale context., negativeId: BREG-NEG-07, negativeTest: {path: crates/registry-breg/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: BREG-SEC-08, state: enforced, targetWave: W3, threat: Classified metadata or non-public fields become public inputs or outputs., enforcementPoint: compiler classification and profile projection checks, refusal: Reject an unsafe package and keep every protected entity and field out of the public manifest bytes., negativeId: BREG-NEG-08, negativeTest: {path: crates/registry-breg/tests/compiler_contract.rs, name: manifest_projection_excludes_every_protected_resource_from_public_bytes}}
  - {id: BREG-SEC-09, state: enforced, targetWave: W3, threat: Constraint failures disclose hidden rows or values., enforcementPoint: mutation problem mapping and database diagnostic filter, refusal: Return a stable value-free conflict or absence problem without physical names or values., negativeId: BREG-NEG-09, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-10, state: enforced, targetWave: W3, threat: "A partial mutation commits record state without its revision, idempotency, or event history, or releases success without its audit response entry.", enforcementPoint: single record transaction coordinator, refusal: Roll back every mutation component when any transactional component fails and release no success response when the audit writer refuses the response entry after commit., negativeId: BREG-NEG-10, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-11, state: enforced, targetWave: W3, threat: Protected response bytes or Registry Record metadata are released before an accountable attempt and terminal audit exist., enforcementPoint: protected-read and mutation response-release gate, refusal: Assemble the exact media-specific response before terminal audit then return service unavailable without releasing it if the audit writer refuses the response entry., negativeId: BREG-NEG-11, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: BREG-SEC-12, state: enforced, targetWave: W3, threat: "An ETag or idempotency result is replayed under a different access context or response representation.", enforcementPoint: authenticated ETag and idempotency binding, refusal: "Find a held result only under the verified caller that spent the key, and reject a replay whose package, profile, purpose, row boundary, projection, negotiated representation, or canonical request context differs.", negativeId: BREG-NEG-12, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: BREG-SEC-13, state: enforced, targetWave: W3, threat: "Problems, logs, metrics, traces, or database diagnostics disclose data, credentials, or physical structure.", enforcementPoint: closed diagnostic vocabulary and telemetry boundary, refusal: Replace unsafe detail with a stable value-free problem and suppress unsafe telemetry fields., negativeId: BREG-NEG-13, negativeTest: {path: crates/registry-breg/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: BREG-SEC-14, state: enforced, targetWave: W1, threat: Different generated surfaces or physical names diverge from the reviewed configuration., enforcementPoint: canonical compiler and artifact inventory comparison, refusal: Reject non-deterministic or inconsistent compilation before package creation., negativeId: BREG-NEG-14, negativeTest: {path: crates/registry-breg/tests/compiler_contract.rs, name: duplicate_routes_fail_before_artifact_generation}}
  - {id: BREG-SEC-15, state: enforced, targetWave: W5, threat: "A condition leaks a more-classified field through event presence, captured values reach widened or substituted egress, erased data is replayed, or an upgrade strands retained delivery work.", enforcementPoint: "compiler-derived event classification, exact activated destination authority, transactional capture, durable CloudEvents delivery and retention, and activation compatibility interlock", refusal: "Reject underclassified conditions, widened runtime ceilings, mismatched destination bindings or payloads, stale, non-dead-letter, or erased replay, and changed or removed bindings with deliverable retained work before egress or activation.", negativeId: BREG-NEG-15, negativeTest: {path: crates/registry-breg/tests/postgres_webhook_delivery.rs, name: real_postgres_webhook_delivery_retry_dead_letter_replay_is_package_bound_audited_and_confined}}
  - {id: BREG-SEC-16, state: enforced, targetWave: W5, threat: A domain fixture gains hidden production behavior through a hard-coded runtime concept., enforcementPoint: self-tested source-neutrality gate over production source and public kernel contracts, refusal: Reject any acceptance-fixture identifier planted in the runtime source or public kernel contract., negativeId: BREG-NEG-16, negativeTest: {path: products/breg/scripts/test_check_source_neutrality.py, name: test_fixture_identifier_in_production_source_is_rejected}}
  - {id: BREG-SEC-17, state: enforced, targetWave: W3, threat: An encrypted cursor is replayed under a different authorized query context., enforcementPoint: fresh HTTP authorization plus authenticated cursor opening and PostgreSQL ReadPlan binding recomputation, refusal: "Reject before SQL when package, route, operation, profile, principal, purpose, row boundary, projection, filter, sort, temporal instant, page size, or expiry differs.", negativeId: BREG-NEG-17, negativeTest: {path: crates/registry-breg/tests/postgres_read.rs, name: real_postgres_temporal_keyset_and_cursor_binding_edges_are_enforced}}
  - {id: BREG-SEC-18, state: enforced, targetWave: W5, threat: A bulk request bypasses per-item authority or commits a valid prefix after a later item fails., enforcementPoint: configured Batch route and single-transaction mutation coordinator, refusal: "Refuse the complete request before record I/O when its bounds, operation, profile, or mutation mode is invalid; otherwise roll back every item and release nothing when any item or terminal component fails.", negativeId: BREG-NEG-18, negativeTest: {path: crates/registry-breg/tests/postgres_batch.rs, name: real_postgres_batch_is_bounded_authorized_atomic_and_exactly_replayable}}
  - {id: BREG-SEC-19, state: enforced, targetWave: W5, threat: "A malformed, private, ambiguous, denied, or wrong-algorithm operator-pinned JWKS selects unintended verification material or leaks key metadata.", enforcementPoint: static JWKS validation before verifier construction in production startup and schema-test execution, refusal: "Reject the complete bounded document unless it is a strict duplicate-free set of valid public keys exactly bound to the configured algorithm, signature use, verification operation, and kid policy.", negativeId: BREG-NEG-19, negativeTest: {path: crates/registry-breg/tests/runtime_config.rs, name: static_jwks_validation_refuses_unsafe_documents_value_free}}
  - {id: BREG-SEC-20, state: enforced, targetWave: W3, threat: "A lookup selector accepts partial, extra, mistyped, caller-supplied claim values, queries unbounded rows, or otherwise becomes an enumeration oracle.", enforcementPoint: compiled selector permission bounded lookup request parser and two-row PostgreSQL limit, refusal: "Require the selector's exact configured field set and origin, query at most two rows, and collapse unknown, ungranted, missing-claim, zero-match, and multiple-match outcomes to one value-free unresolved response without audit cardinality.", negativeId: BREG-NEG-20, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: lookup_body_exactness_origin_types_and_unresolved_equivalence_are_value_free}}
  - {id: BREG-SEC-21, state: enforced, targetWave: W3, threat: "A relationship traversal inherits direct target rights or widens its configured target projection, filtering, ordering, or count authority.", enforcementPoint: compiled named read-path permission and route-specific query plan, refusal: "Require an independently granted path and enforce only that path's target fields and query capabilities; conceal unknown and ungranted paths identically before record I/O.", negativeId: BREG-NEG-21, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: relationship_route_uses_path_grant_not_direct_target_rights}}
  - {id: BREG-SEC-22, state: enforced, targetWave: W5, threat: A new profile or relationship grant omits mandatory entity access restrictions., enforcementPoint: compiler access requirements after module composition and before artifact generation, refusal: Reject profiles missing mandatory scopes or row bindings or widening allowed purposes; reject relationship grants whose target or join row requirements cannot be enforced., negativeId: BREG-NEG-22, negativeTest: {path: crates/registry-breg/tests/access_configuration.rs, name: requirements_are_mandatory_not_grants_and_cannot_be_weakened_by_profiles}}
  - {id: BREG-SEC-23, state: enforced, targetWave: W5, threat: A caller uses map membership to query a Point without explicit spatial authority., enforcementPoint: compiled direct-list bbox permission and HTTP query admission, refusal: Reject malformed or undeclared bbox queries before record-service entry and retain the exact selected profile., negativeId: BREG-NEG-23, negativeTest: {path: crates/registry-breg/tests/http_read_only.rs, name: bbox_reaches_record_service_only_with_declared_spatial_grant}}
  - {id: BREG-SEC-24, state: enforced, targetWave: W5, threat: Spatial predicates resolve through caller-controlled objects or a bbox role with excess authority., enforcementPoint: qualified PostGIS prerequisite verification and bbox role validation, refusal: Reject missing or misplaced extension prerequisites and bbox role privilege or membership drift before spatial execution., negativeId: BREG-NEG-24, negativeTest: {path: crates/registry-breg/tests/postgres_spatial_storage.rs, name: real_postgres_postgis_prerequisites_are_role_bound_and_shadow_resistant}}
  - {id: BREG-SEC-25, state: enforced, targetWave: W5, threat: A Rhai planner widens its package-declared entity target binding operation or field ceiling and turns script output into record authority., enforcementPoint: compiler-owned effect ceiling and the shared canonical proposal verifier before target locks or writes, refusal: Reject every undeclared write dimension before target locking and grant no authority from planner output., negativeId: BREG-NEG-25, negativeTest: {path: crates/registry-breg/src/proposal_prepare/tests.rs, name: rhai_plan_refuses_authority_ceiling_escape_before_target_locks}}
  - {id: BREG-SEC-26, state: enforced, targetWave: W5, threat: A Rhai planner bypasses configured external review or fabricates approved evidence through its result., enforcementPoint: closed planner result ABI frozen separately from the source-owned review requirement and exact approved-result binding, refusal: Reject planner-owned review fields and keep application unavailable until exact approval evidence from the configured authority is retained., negativeId: BREG-NEG-26, negativeTest: {path: crates/registry-breg/src/proposal_workflow.rs, name: required_review_applies_only_with_exact_approved_result_binding}}
  - {id: BREG-SEC-27, state: enforced, targetWave: W5, threat: Changed or swapped native function bytes reinterpret a previously admitted executable plan., enforcementPoint: named function source digest and compiled program identity validation, refusal: Refuse evaluation of a cached program with different hash-covered function source; application and receipt recovery use retained exact effects., negativeId: BREG-NEG-27, negativeTest: {path: crates/registry-breg/src/tests/action_handler_benchmark_tests.rs, name: cached_program_refuses_evaluation_for_a_different_handler_source}}
  - {id: BREG-SEC-28, state: enforced, targetWave: W5, threat: 'A native plan function observes unbound action inputs, target rows, claims, secrets, or ambient process state.', enforcementPoint: explicit plan input projection and fresh closed Rhai engine, refusal: 'Refuse ambient I/O, environment, clock, randomness, imports, and undeclared context capabilities; expose only the bound action inputs.', negativeId: BREG-NEG-28, negativeTest: {path: crates/registry-breg/tests/native_plan_security.rs, name: named_function_inputs_and_ambient_capabilities_are_closed}}
  - {id: BREG-SEC-29, state: enforced, targetWave: W5, threat: A native plan function exhausts its execution budget or deadline and leaves subsequent requests unhealthy., enforcementPoint: compiled function and runtime Rhai resource limits with fresh invocation state, refusal: Terminate execution that exceeds its operation or deadline budget and admit a later bounded invocation with fresh state., negativeId: BREG-NEG-29, negativeTest: {path: crates/registry-breg/tests/native_plan_security.rs, name: native_function_resource_and_deadline_refusals_leave_fresh_calls_healthy}}
  - {id: BREG-SEC-30, state: enforced, targetWave: W5, threat: Native function exceptions disclose authored source or action input values., enforcementPoint: closed ActionHandlerError vocabulary, refusal: 'Return stable error kinds without rendering exception values, source text, or protected input canaries.', negativeId: BREG-NEG-30, negativeTest: {path: crates/registry-breg/tests/native_plan_security.rs, name: native_function_errors_do_not_render_source_or_input_values}}
  - {id: BREG-SEC-31, state: enforced, targetWave: W5, threat: Automatic application borrows source profiles creates ambient authority or duplicates an application after the source already committed it., enforcementPoint: 'bounded builtin system executor with exact action revision, digest, grant, and durable application claim', refusal: 'Refuse stale digest, action revision, system grant, or lease ownership before new effects; exact committed receipts recover without reapplication.', negativeId: BREG-NEG-31, negativeTest: {path: crates/registry-breg/tests/postgres_proposal.rs, name: automatic_claim_pins_digest_grant_and_lease_before_any_effect}}
  - {id: BREG-SEC-32, state: enforced, targetWave: W5, threat: "An omitted row declaration silently grants all records.", enforcementPoint: "authoring deserialization and generated schema", refusal: "Reject every row-bearing permission without an explicit rowBoundaries declaration; an empty array grants all rows only within mandatory requirements.", negativeId: BREG-NEG-32, negativeTest: {path: crates/registry-breg/tests/explicit_row_authority.rs, name: every_row_bearing_grant_requires_an_explicit_declaration}}
  - {id: BREG-SEC-33, state: enforced, targetWave: W5, threat: "A request with an ambiguous profile selects broader authority implicitly.", enforcementPoint: "compiled optional route default and HTTP profile selection", refusal: "Require an explicit profile when multiple profiles serve a route without a default; refuse before record I/O without searching for a qualifying profile.", negativeId: BREG-NEG-33, negativeTest: {path: crates/registry-breg/tests/http_auth.rs, name: ambiguous_route_without_default_requires_explicit_selection_without_guessing_authority}}
  - {id: BREG-SEC-34, state: enforced, targetWave: W5, threat: "Approval from another authority request policy subject proposal version submission or terminal status is substituted for the configured review result.", enforcementPoint: "frozen source policy selection checked by the Review client and submission worker; immutable accepted binding and exact result correlation before application", refusal: "Require the configured authority and policy ID; compare explicit bounded provider producer metadata before accepting the exact submission digest. An explicit disagreement is a distinct configuration failure and never proof that the remote mutation rolled back. ID-only selection delegates concrete version and digest to the provider at first durable acceptance throughout pending delivery and recovery (30 days by default; operator resubmit restarts the window); optional complete pins require an exact match before acceptance. Refuse mismatched acceptance without retaining a binding, preserve an existing exact acceptance across recovery, and require every retained request subject policy proposal submission and approved-status binding before application.", negativeId: BREG-NEG-34, negativeTest: {path: crates/registry-breg/tests/postgres_proposal_review_delivery.rs, name: first_acceptance_refuses_wrong_policy_id_or_exact_pin}}
  - {id: BREG-SEC-35, state: enforced, targetWave: W5, threat: A related-record acceptance decision races with a referenced record update or bypasses its declared processing authority., enforcementPoint: compiled action requirements and existing ordered target locks before effects, refusal: Refuse an unmet requirement without committing any action effects and preserve its original acceptance result on exact replay., negativeId: BREG-NEG-35, negativeTest: {path: crates/registry-breg/tests/postgres_immediate_action_requirements.rs, name: action_requirements_hold_reference_lock_against_concurrent_inactivation}}
  - {id: BREG-SEC-36, state: enforced, targetWave: W5, threat: A revoked membership retains protected read access or a membership probe discloses its processing rows., enforcementPoint: compiled read-only membership boundaries and generated RLS helpers plus explicit historical predicates, refusal: Deny new protected reads after committed revocation and keep membership processing separate from record disclosure., negativeId: BREG-NEG-36, negativeTest: {path: crates/registry-breg/tests/postgres_membership_access.rs, name: real_postgres_membership_reads_recheck_live_membership_and_hide_processing_inputs}}
  - {id: BREG-SEC-37, state: enforced, targetWave: W5, threat: A computed action widens a compiled write slot or commits effects outside the caller authority and transaction boundary., enforcementPoint: compiled action candidate verification target contexts native RLS and atomic mutation evidence, refusal: Refuse undeclared effects or authority and recover the original committed receipt without rerunning the handler., negativeId: BREG-NEG-37, negativeTest: {path: crates/registry-breg/tests/postgres_action_handlers.rs, name: action_handlers_compute_refuse_retry_recover_and_preserve_compiled_authority}}
  - {id: BREG-SEC-38, state: enforced, targetWave: W5, threat: A handler leaks script values through a dynamic business refusal or mixes a refusal with writes., enforcementPoint: exclusive effects-or-refusal decoder and governed code label catalogue, refusal: Refuse unknown codes fields or output details and keep script errors value-free., negativeId: BREG-NEG-38, negativeTest: {path: crates/registry-breg/tests/immediate_action_handler.rs, name: handler_business_refusal_is_exclusive_bounded_and_governed}}
  - {id: BREG-SEC-39, state: enforced, targetWave: W5, threat: Stored field format integrity is bypassed or activation accepts violating existing rows., enforcementPoint: native PostgreSQL field checks and governed validated migration with retained maintenance recovery, refusal: Refuse invalid stored values and preserve exact-target recovery after a failed activation., negativeId: BREG-NEG-39, negativeTest: {path: crates/registry-breg/tests/postgres_migration.rs, name: native_patterns_validate_empty_tables_existing_rows_and_exact_target_recovery}}
  - {id: BREG-SEC-40, state: enforced, targetWave: W5, threat: A governed action widens an imported Evidence requirement profile origin or output contract., enforcementPoint: offline Evidence catalog validation and exact compiled capability fingerprint, refusal: Refuse unknown ambiguous or widened capabilities before runtime access., negativeId: BREG-NEG-40, negativeTest: {path: crates/registry-breg/tests/action_evidence_compiler.rs, name: refuses_origin_profile_output_ambiguity_and_budget_widening}}
  - {id: BREG-SEC-41, state: enforced, targetWave: W5, threat: Imported Evidence contract bytes change outside the reviewed package closure., enforcementPoint: sealed project Evidence assets and deterministic package rederivation, refusal: Refuse missing or altered imported contracts and mismatched derived artifacts., negativeId: BREG-NEG-41, negativeTest: {path: crates/registry-breg/tests/action_evidence_compiler.rs, name: imported_contract_is_sealed_and_rederived}}
  - {id: BREG-SEC-42, state: enforced, targetWave: W5, threat: An unverified stale or wrongly bound assertion influences Registry writes., enforcementPoint: native Evidence client verification and final observation acceptance, refusal: Refuse invalid signatures bindings outputs and expired or stale assertions without an accepted acquisition., negativeId: BREG-NEG-42, negativeTest: {path: crates/registry-breg/src/action_evidence_client.rs, name: real_signed_wrong_expectations_fail_without_a_verified_acquisition}}
  - {id: BREG-SEC-43, state: enforced, targetWave: W5, threat: Computed selectors replace authenticated origins or escape the declared subject schema., enforcementPoint: actual argument validation before credential acquisition and outbound I/O, refusal: Refuse unknown roles profiles fields types and bounds before any remote request., negativeId: BREG-NEG-43, negativeTest: {path: crates/registry-breg/src/action_evidence_client.rs, name: wrong_selector_origins_roles_and_shapes_make_zero_requests}}
  - {id: BREG-SEC-44, state: enforced, targetWave: W5, threat: Cancelled or queued evaluation releases capacity early or makes late external requests., enforcementPoint: owned evaluation permits cancellation-aware worker and resolver deadline, refusal: Retain capacity until worker exit and refuse further requests after cancellation or deadline., negativeId: BREG-NEG-44, negativeTest: {path: crates/registry-breg/tests/support/action_evidence_runtime.rs, name: queued_worker_retains_capacity_after_request_cancellation}}
  - {id: BREG-SEC-45, state: enforced, targetWave: W5, threat: External acquisition retains PostgreSQL locks or retries reacquire evidence or retention commits separately from writes., enforcementPoint: preflight connection release frozen candidate and atomic evidence retention finalization, refusal: "Hold no PostgreSQL resource during acquisition, roll back writes when retention or any step before commit fails, and release no result when the audit writer refuses the terminal response entry after commit.", negativeId: BREG-NEG-45, negativeTest: {path: crates/registry-breg/tests/postgres_action_evidence.rs, name: signed_evidence_actions_release_postgres_and_commit_atomic_transcripts}}
  - {id: BREG-SEC-46, state: enforced, targetWave: W5, threat: A script catches a failed Evidence helper and commits fallback effects or makes another disclosure., enforcementPoint: host-owned poisoned evaluation state independent of Rhai exception handling, refusal: Refuse all effects and subsequent helper I/O after any failed acquisition., negativeId: BREG-NEG-46, negativeTest: {path: crates/registry-breg/tests/postgres_action_evidence.rs, name: caught_failed_helper_cannot_commit_or_make_another_disclosure}}
  - {id: BREG-SEC-47, state: enforced, targetWave: W5, threat: Dependency failures expose provider response values or acquire business refusal semantics., enforcementPoint: closed public dependency problem code status static detail and safe capability location schema, refusal: Return the static action.evidence_failed service-unavailable problem with only an optional known capability location and no provider values., negativeId: BREG-NEG-47, negativeTest: {path: crates/registry-breg/src/artifacts.rs, name: evidence_dependency_problem_is_static_and_has_service_unavailable_status}}
  - {id: BREG-SEC-48, state: enforced, targetWave: W5, threat: Evidence erasure targets a different Registry or races catalog changes., enforcementPoint: verified migration target and transaction-scoped Registry interlock with catalog and readiness checks, refusal: Refuse mismatched identity or changed catalog and keep the Registry lock through deletion and commit., negativeId: BREG-NEG-48, negativeTest: {path: crates/registry-breg/tests/postgres_action_evidence_retention.rs, name: retention_refuses_misbound_database_with_identical_roles_and_catalog_drift}}
  - {id: BREG-SEC-49, state: enforced, targetWave: W5, threat: Proposal ownership is used to target an unreadable record or to retain target authority after it changes., enforcementPoint: current selected-profile reference admission and ordered reference-target locks at submission and application, refusal: Refuse unreadable or changed reference-only targets before submission or application and commit no partial effects., negativeId: BREG-NEG-49, negativeTest: {path: crates/registry-breg/tests/postgres_proposal.rs, name: reference_only_targets_are_locked_and_readmitted_at_submit_and_apply}}
  - {id: BREG-SEC-50, state: enforced, targetWave: W5, threat: A caller reads hidden attachment content or receives bytes despite a failed audit gate., enforcementPoint: exclusive selected-profile ordinary Get or mapped GetReviewContext admission followed by the shared frozen-reference verification storage integrity and terminal audit pipeline, refusal: 'Conceal hidden or mismapped slots, stale submission/effect/schema bindings, revoked current context disclosure, quarantine and erasure before transport; release no bytes on integrity or audit failure.', negativeId: BREG-NEG-50, negativeTest: {path: crates/registry-breg/tests/postgres_proposal_s3.rs, name: review_document_binding_refusals_precede_s3_and_revise_never_follows_successor}}
