  - {id: BREG-SEC-27, state: enforced, targetWave: W5, threat: Changed omitted swapped or tampered Rhai bytes reinterpret a frozen proposal., enforcementPoint: package script capture and activation rederivation plus immutable proposal binding to ABI script digest contract fingerprint canonical effects target revisions and effect digest, refusal: Refuse invalid package activation and never rerun a changed script during application retry activation history or receipt replay; use the exact frozen plan or refuse., negativeId: BREG-NEG-27, negativeTest: {path: crates/registry-breg/tests/package_change_plan.rs, name: project_rhai_planner_package_is_deterministic_and_rederives_exact_source}}
