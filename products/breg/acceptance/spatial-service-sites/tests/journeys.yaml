apiVersion: registry.registrystack.org/breg-journeys/v1
journeys:
  - id: service-site-source-profile-smoke
    steps:
      - id: create-central-service-site
        entity: service-site
        accessProfile: service-site-admin
        claims: &admin_claims
          principal: synthetic-service-site-admin
          purpose: service-site-administration
          scopes: [service-sites:seed]
        request:
          operation: create
          data:
            native-id: 11111111-1111-4111-8111-111111111111
            site-code: SVC-SYNTH-CENTRAL-001
            label: Synthetic central clinic
            zone: central
            service-kind: clinic
            installation-client-id: qgis-installation-central
            location: {type: Point, coordinates: [100.550000000, 13.750000000]}
        expect:
          outcome: success
          status: 201
          fields:
            site-code: SVC-SYNTH-CENTRAL-001
            label: Synthetic central clinic
            zone: central
            service-kind: clinic
            location: {type: Point, coordinates: [100.550000000, 13.750000000]}
        capture: central-site
      - id: create-null-geometry-service-site
        entity: service-site
        accessProfile: service-site-admin
        claims: *admin_claims
        request:
          operation: create
          data:
            native-id: 22222222-2222-4222-8222-222222222222
            site-code: SVC-SYNTH-NULL-001
            label: Synthetic call-in desk
            zone: central
            service-kind: depot
            installation-client-id: qgis-installation-central
        expect:
          outcome: success
          status: 201
          fields:
            site-code: SVC-SYNTH-NULL-001
            label: Synthetic call-in desk
            zone: central
            service-kind: depot
        capture: null-geometry-site
      - id: create-edge-service-site
        entity: service-site
        accessProfile: service-site-admin
        claims: *admin_claims
        request:
          operation: create
          data:
            native-id: 33333333-3333-4333-8333-333333333333
            site-code: SVC-SYNTH-EDGE-001
            label: Synthetic exact edge water point
            zone: edge
            service-kind: water-point
            installation-client-id: qgis-installation-edge
            location: {type: Point, coordinates: [100.700000000, 13.900000000]}
        expect:
          outcome: success
          status: 201
          fields:
            site-code: SVC-SYNTH-EDGE-001
            zone: edge
            location: {type: Point, coordinates: [100.700000000, 13.900000000]}
        capture: edge-site
      - id: public-map-reader-lists-public-point-fields
        entity: service-site
        accessProfile: map-reader
        claims: {}
        request:
          operation: query
          count: true
          top: 10
          select: [native-id, site-code, label, zone, service-kind, location]
        expect:
          outcome: success
          status: 200
          count: 3
      - id: public-map-reader-bbox-finds-central-site
        entity: service-site
        accessProfile: map-reader
        claims: {}
        request:
          operation: query
          count: true
          top: 10
          bbox: {west: "100.540000000", south: "13.740000000", east: "100.560000000", north: "13.760000000"}
          select: [native-id, site-code, label, zone, service-kind, location]
        expect:
          outcome: success
          status: 200
          count: 1
      - id: directory-reader-lists-without-geometry
        entity: service-site
        accessProfile: directory-reader
        claims: {}
        request:
          operation: query
          count: true
          top: 10
          select: [native-id, site-code, label, zone, service-kind]
        expect:
          outcome: success
          status: 200
          count: 3
      - id: directory-reader-bbox-is-refused
        entity: service-site
        accessProfile: directory-reader
        claims: {}
        request:
          operation: query
          bbox: {west: "100.540000000", south: "13.740000000", east: "100.560000000", north: "13.760000000"}
          select: [native-id, site-code, label, zone, service-kind]
        expect:
          outcome: refusal
          status: 400
          problemCode: query.invalid
      - id: installation-client-sees-own-central-row
        entity: service-site
        accessProfile: installation-map-reader
        claims:
          principal: synthetic-qgis-installation
          purpose: service-site-map
          scopes: [service-sites:map.read]
          directClaims: {service_zones: central}
        request: {operation: get, recordRef: central-site}
        expect:
          outcome: success
          status: 200
          fields: {site-code: SVC-SYNTH-CENTRAL-001, zone: central}
      - id: installation-client-cannot-see-other-installation-row
        entity: service-site
        accessProfile: installation-map-reader
        claims:
          principal: synthetic-qgis-installation
          purpose: service-site-map
          scopes: [service-sites:map.read]
          directClaims: {service_zones: central}
        request: {operation: get, recordRef: edge-site}
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
      - id: hidden-geometry-profile-gets-directory-fields
        entity: service-site
        accessProfile: hidden-geometry-reader
        claims:
          principal: synthetic-directory-reader
          purpose: service-site-directory
          scopes: [service-sites:directory.read]
        request: {operation: get, recordRef: central-site}
        expect:
          outcome: success
          status: 200
          fields: {site-code: SVC-SYNTH-CENTRAL-001, label: Synthetic central clinic}
      - id: get-only-profile-gets-site
        entity: service-site
        accessProfile: get-only-map-reader
        claims:
          principal: synthetic-site-reader
          purpose: service-site-map
          scopes: [service-sites:site.read]
        request: {operation: get, recordRef: central-site}
        expect:
          outcome: success
          status: 200
          fields: {site-code: SVC-SYNTH-CENTRAL-001, location: {type: Point, coordinates: [100.550000000, 13.750000000]}}
      - id: admin-refuses-coordinate-outside-authored-bounds
        entity: service-site
        accessProfile: service-site-admin
        claims: *admin_claims
        request:
          operation: create
          data:
            native-id: 44444444-4444-4444-8444-444444444444
            site-code: SVC-SYNTH-OUTSIDE-001
            label: Synthetic outside point
            zone: edge
            service-kind: depot
            installation-client-id: qgis-installation-edge
            location: {type: Point, coordinates: [100.700000001, 13.900000000]}
        expect:
          outcome: refusal
          status: 400
          problemCode: request.invalid
