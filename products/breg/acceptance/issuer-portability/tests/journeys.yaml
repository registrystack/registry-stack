apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: issuer-portability-package
    steps:
      - id: list-empty-registry
        entity: record
        accessProfile: clerk
        claims:
          principal: urn:institution:service-clerk
          scopes: [registry:read]
          purpose: registry-administration
          directClaims: {districts: district-a}
        request:
          type: list
        expect:
          outcome: success
          status: 200
          count: 0
