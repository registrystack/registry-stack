apiVersion: registry.registrystack.org/breg-journeys/v1
journeys:
  - id: issuer-portability-package
    steps:
      - id: list-empty-registry
        entity: record
        accessProfile: clerk
        claims:
          principal: urn:institution:service-clerk
          scopes: [registry:read]
          purpose: registry-administration
          directClaims: {districts: district-a}
        request:
          operation: list
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
