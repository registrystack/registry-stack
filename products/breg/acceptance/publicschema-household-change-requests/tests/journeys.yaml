apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: household-contact-registration-request-flow
    steps:
      - id: create-household
        entity: household
        accessProfile: household-operator
        claims:
          principal: household-operator
          scopes: [registry:household:operate]
          purpose: household-administration
        request:
          type: create
          data:
            household-code: hh-001
            local-household-number: 1001
            household-name: Ortega household
            administrative-area: district-9
            household-type: private
        expect:
          outcome: success
          status: 201
          fields:
            household-code: hh-001
            local-household-number: 1001
            household-name: Ortega household
            administrative-area: district-9
            household-type: private
        capture: household
      - id: create-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request:
          type: create
          data:
            household: {recordCapture: household}
            person-code: person-001
            legal-name: Ana Ortega
            family-name: Ortega
            person-sex: female
            residency-status: usual-resident
            relationship: head
            valid-from: "2026-01-01"
            reason: registration packet verified
        expect:
          outcome: success
          status: 201
          fields:
            person-code: person-001
            legal-name: Ana Ortega
            family-name: Ortega
            person-sex: female
            residency-status: usual-resident
            relationship: head
            valid-from: "2026-01-01"
            reason: registration packet verified
        capture: contact-request
      - id: edit-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request:
          type: patch
          recordCapture: contact-request
          etagCapture: contact-request
          changes:
            - {field: reason, value: registration packet and field visit verified}
        expect:
          outcome: success
          status: 200
          fields:
            reason: registration packet and field visit verified
        capture: edited-contact-request
      - id: get-before-submit
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request: {type: get, recordCapture: edited-contact-request}
        expect:
          outcome: success
          status: 200
          fields: {reason: registration packet and field visit verified}
        capture: contact-before-submit
      - id: submit-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request: {type: submit-request, recordCapture: contact-before-submit, etagCapture: contact-before-submit}
        expect: {outcome: success, status: 200}
      - id: external-review-reader-sees-submission
        entity: register-household-contact-request
        accessProfile: household-contact-reviewer
        claims:
          principal: household-contact-reviewer
          scopes: [registry:household-contact:review]
          purpose: household-contact-review
        request: {type: get, recordCapture: contact-request}
        expect:
          outcome: success
          status: 200
          fields: {reason: registration packet and field visit verified}
      - id: submitter-reads-submitted-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request: {type: get, recordCapture: contact-request}
        expect: {outcome: success, status: 200}
        capture: submitted-contact-request
      - id: submitter-cancels-external-review
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request: {type: cancel-request, recordCapture: submitted-contact-request, etagCapture: submitted-contact-request}
        expect: {outcome: success, status: 200}
