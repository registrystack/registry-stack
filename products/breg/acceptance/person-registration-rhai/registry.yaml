apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: person-registration-rhai
  canonicalBaseIri: https://person-registration-rhai.example.gov
  version: 0.1.0
  defaultLanguage: en
package:
  sourceRevision: person-registration-rhai-acceptance-0.1.0
manifestProjection:
  accessProfile: person-reader
  classificationCeiling: internal
  catalog:
    baseUrl: https://person-registration-rhai.example.gov
    title: Synthetic Person Registration Catalog
    description: Input-only Rhai immediate actions with native stored identifier integrity.
    publisher:
      id: person-registration-authority
      name: Synthetic Person Registration Authority
      iri: https://person-registration-rhai.example.gov/authority
  publicService: {id: person-registration-service, title: Synthetic Person Registration Service}
  datasets:
    - id: person-registration-rhai
      title: Synthetic Person Registration Registry
      description: Synthetic people, registrations and registration registers for action acceptance tests.
      owner: Synthetic Person Registration Authority
      status: active
  dataServices:
    - id: person-registration-data-service
      title: Synthetic Person Registration Service
      endpointUrl: https://person-registration-rhai.example.gov
      servesDatasets: [person-registration-rhai]
  distributions: []
datasets: [{id: person-registration-rhai}]
recordTypes:
  - id: person
    primaryDataset: person-registration-rhai
    route: people
    mutationMode: mutable
    fields:
      - {id: identifier, type: string, required: true, maximumLength: 13, pattern: '^[0-9]{13}$', classification: internal}
      - {id: display-name, apiName: displayName, type: string, required: true, minimumLength: 1, maximumLength: 200, classification: internal}
    constraints:
      - {type: unique, fields: [identifier]}
    hooks:
      - id: person-registered-v1
        phase: after
        trigger: created
        projection: [identifier]
        handler: {type: url, destinationId: person-events}
  - id: registration
    primaryDataset: person-registration-rhai
    route: registrations
    mutationMode: create-only
    fields:
      - {id: registration-code, apiName: registrationCode, type: string, required: true, maximumLength: 64, classification: internal}
      - {id: person, type: reference, target: person, required: true, classification: internal}
      - {id: register, type: reference, target: register, required: true, classification: internal}
    constraints:
      - {type: unique, fields: [registration-code]}
    hooks:
      - id: registration-recorded-v1
        phase: after
        trigger: created
        projection: [registration-code]
        handler: {type: url, destinationId: person-events}
  - id: register
    primaryDataset: person-registration-rhai
    route: registers
    mutationMode: mutable
    fields:
      - {id: register-code, apiName: registerCode, type: string, required: true, maximumLength: 64, classification: internal}
      - {id: active, type: boolean, required: true, classification: internal}
      - {id: last-person, apiName: lastPerson, type: reference, target: person, required: false, classification: internal}
    constraints:
      - {type: unique, fields: [register-code]}
functions:
  - {id: register-person-plan, runtime: rhai, source: scripts/register-person.rhai, entrypoint: plan, abi: registry.action-plan/v1}
  - {id: register-with-registration-plan, runtime: rhai, source: scripts/register-person-with-registration.rhai, entrypoint: plan, abi: registry.action-plan/v1}
actions:
  - id: register-person
    execution: {mode: immediate}
    inputs:
      - {id: identifier, type: string, required: true, maximumLength: 13, classification: internal}
      - {id: given-name, apiName: givenName, type: string, required: false, maximumLength: 80, classification: internal}
      - {id: family-name, apiName: familyName, type: string, required: false, maximumLength: 80, classification: internal}
    plan:
      type: function
      function: register-person-plan
      inputs: [identifier, given-name, family-name]
      refusals:
        - {code: blank-name, label: At least one name part is required.}
      writes:
        - id: person
          target: {recordType: person}
          operation: create
          fields: [identifier, display-name]
  - id: register-person-with-registration
    execution: {mode: immediate}
    inputs:
      - {id: identifier, type: string, required: true, maximumLength: 13, classification: internal}
      - {id: given-name, apiName: givenName, type: string, required: false, maximumLength: 80, classification: internal}
      - {id: family-name, apiName: familyName, type: string, required: false, maximumLength: 80, classification: internal}
      - {id: register, apiName: registerId, type: reference, target: register, required: true, classification: internal}
      - {id: registration-code, apiName: registrationCode, type: string, required: true, maximumLength: 64, classification: internal}
      - {id: record-registration, apiName: recordRegistration, type: boolean, required: true, classification: internal}
      - {id: update-register, apiName: updateRegister, type: boolean, required: true, classification: internal}
    commitGuards:
      targets:
        - {input: register, field: active, equals: true}
    plan:
      type: function
      function: register-with-registration-plan
      inputs: [identifier, given-name, family-name, register, registration-code, record-registration, update-register]
      refusals:
        - {code: blank-name, label: At least one name part is required.}
      writes:
        - id: person
          target: {recordType: person}
          operation: create
          fields: [identifier, display-name]
        - id: registration
          target: {recordType: registration}
          operation: create
          fields: [registration-code, person, register]
        - id: register
          target: {fromInput: register}
          operation: patch
          fields: [last-person]
accessProfiles:
  - id: person-registrar
    default: true
    principalClaim: registry_principal
    requiredScopes: [registry:person:register]
    requiredPurposes: [person-registration]
    permissions:
      actions:
        - action: register-person
          operations: [invoke]
          targets: [{recordType: person, rowBoundaries: unrestricted}]
          results: [person]
        - action: register-person-with-registration
          operations: [invoke]
          targets: [{recordType: person, rowBoundaries: unrestricted}, {recordType: registration, rowBoundaries: unrestricted}, {recordType: register, rowBoundaries: unrestricted}]
          results: [person, registration, register]
  - id: person-reader
    default: true
    principalClaim: registry_principal
    requiredScopes: [registry:person:read]
    requiredPurposes: [person-registration-audit]
    permissions:
      records:
        - {recordType: person, operations: [get], readableFields: [identifier, display-name], rowBoundaries: unrestricted}
        - {recordType: registration, operations: [get], readableFields: [registration-code, person, register], rowBoundaries: unrestricted}
        - {recordType: register, operations: [get], readableFields: [register-code, active, last-person], rowBoundaries: unrestricted}
  - id: person-administrator
    principalClaim: registry_principal
    requiredScopes: [registry:person:manage]
    requiredPurposes: [person-maintenance]
    permissions:
      records:
        - {recordType: person, operations: [create, get, patch], readableFields: [identifier, display-name], writableFields: [identifier, display-name], rowBoundaries: unrestricted}
        - {recordType: register, operations: [create, get, patch], readableFields: [register-code, active, last-person], writableFields: [register-code, active, last-person], rowBoundaries: unrestricted}
