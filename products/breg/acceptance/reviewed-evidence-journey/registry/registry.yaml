apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: registry
  canonicalBaseIri: https://registry.example.test
  version: 0.1.0
  defaultLanguage: en
package:
  sourceRevision: synthetic-reviewed-evidence-v1
manifestProjection:
  accessProfile: operator
  classificationCeiling: internal
  catalog:
    baseUrl: https://registry.example.test
    title: Synthetic record registry
    publisher:
      id: example-authority
      name: Example institution
  publicService:
    id: registry-service
    title: Synthetic record registry
  datasets:
  - id: registry
    title: Synthetic records
    owner: Example institution
    status: active
  dataServices:
  - id: registry-data
    title: Synthetic records
    endpointUrl: https://registry.example.test
    servesDatasets:
    - registry
  distributions: []
datasets:
- id: registry
recordTypes:
- id: record
  primaryDataset: registry
  route: records
  mutationMode: mutable
  classification: internal
  fields:
  - id: code
    type: string
    required: true
    minimumLength: 1
    maximumLength: 64
    classification: internal
  - id: registration-number
    apiName: registrationNumber
    type: string
    required: true
    minimumLength: 1
    maximumLength: 64
    classification: internal
  - id: status
    type: vocabulary-code
    vocabulary: record-status
    classification: internal
  - id: label
    type: string
    required: true
    maximumLength: 100
    classification: internal
  constraints:
  - type: unique
    fields:
    - code
  - type: unique
    fields:
    - registration-number
  selectorProfiles:
  - id: by-code
    fields:
    - code
  - id: by-registration-number
    fields:
    - registration-number
  mutationPolicy:
    patch: proposal-required
accessProfiles:
- id: operator
  default: true
  principalClaim: registry_principal
  requiredScopes:
  - registry:generic:operate
  requiredPurposes:
  - registry-operations
  permissions:
    records:
    - recordType: record
      operations:
      - create
      - get
      - patch
      readableFields:
      - code
      - registration-number
      - status
      - label
      writableFields:
      - code
      - registration-number
      - status
      - label
      rowBoundaries: unrestricted
    actions:
    - action: correct-status
      operations:
      - start
      targets:
      - recordType: record
        rowBoundaries: unrestricted
    proposals:
    - action: correct-status
      operations:
      - get
      - submit
      ownership: caller
      readableInputs:
      - record
      - status
      targets:
      - recordType: record
        rowBoundaries: unrestricted
- id: evidence-source
  principalClaim: registry_principal
  requiredScopes:
  - registry:evidence:lookup
  requiredPurposes:
  - evidence-source-read
  permissions:
    records:
    - recordType: record
      operations:
      - lookup
      readableFields:
      - code
      - registration-number
      - status
      lookups:
      - selector: by-code
        valueOrigin: request
      - selector: by-registration-number
        valueOrigin: request
      rowBoundaries: unrestricted
- id: applier
  actorKind: human
  principalClaim: registry_principal
  requiredScopes:
  - registry:apply
  requiredPurposes:
  - registry-operations
  permissions:
    proposals:
    - action: correct-status
      operations:
      - get
      - apply
      readableInputs:
      - record
      - status
      targets:
      - recordType: record
        rowBoundaries: unrestricted
  requesterClients:
  - applier
- id: reviewer
  actorKind: human
  principalClaim: registry_principal
  requiredScopes:
  - registry:review
  requiredPurposes:
  - registry-operations
  permissions:
    records:
    - recordType: record
      operations:
      - get
      readableFields:
      - status
      rowBoundaries: unrestricted
    proposals:
    - action: correct-status
      operations:
      - get-review-context
      readableContextFields:
      - subjectId
      - currentStatus
      - proposedStatus
      targets:
      - recordType: record
        rowBoundaries: unrestricted
  requesterClients:
  - staff
- id: review-status
  actorKind: service
  principalClaim: registry_principal
  requiredScopes:
  - registry:review-status
  requiredPurposes:
  - registry-operations
  permissions:
    proposals:
    - action: correct-status
      operations:
      - get-review-status
      reviewAuthority: casework
  requesterClients:
  - context-status
vocabularies:
- id: record-status
  values:
  - active
  - retired
reviewAuthorities:
- id: casework
  protocol: id.registrystack.org/protocols/review/v1
actions:
- id: correct-status
  execution:
    mode: proposal
    proposal:
      review:
        type: required
        authority: casework
        source: registry
        policy:
          id: status-review
      reviewContext:
        id: status-context
        fields:
          subjectId:
            type: input
            input: record
          currentStatus:
            type: record
            input: record
            field: status
          proposedStatus:
            type: input
            input: status
      application:
        mode: manual
      retention:
        mode: retain
  inputs:
  - id: record
    apiName: subjectId
    type: reference
    target: record
    required: true
    classification: internal
  - id: status
    type: vocabulary-code
    vocabulary: record-status
    required: true
    classification: internal
  commitGuards:
    targets:
    - input: record
      revision: unchanged
  plan:
    type: fixed
    effects:
    - id: status
      target:
        fromInput: record
      operation: patch
      set:
        status:
          fromInput: status
