# yaml-language-server: $schema=https://id.registrystack.org/schemas/rstack/scenarios/scenarios.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/rstack/scenarios/v1alpha1
kind: RStackScenarios
scenarios:
  - id: native-review-ask-answer-handoff
    steps:
      - id: staff-queue
        product: casework
        as: administrator
        method: POST
        path: /v1/directory/bootstrap
        headers: {If-Match: '"0"', Idempotency-Key: staff-queue}
        body:
          teamId: reviewers
          staff: [{issuer: https://issuer.example.test, subject: staff}]
          supervisors: []
          queueId: reviews
        expect: {status: 200}
      - id: create-record
        product: breg
        as: operator
        method: POST
        path: /v1/records/records
        headers: {Idempotency-Key: create-record}
        body:
          data: {code: DEV-PROOF, registrationNumber: DEV-REG, status: retired, label: Synthetic record}
        expect: {status: 201}
        capture: {record: {type: pointer, pointer: /data/recordIdentifier}}
      - id: start-proposal
        product: breg
        as: operator
        method: POST
        path: /v1/actions/correct-status/proposals
        headers: {Idempotency-Key: start-proposal}
        body: {input: {subjectId: "{{record}}", status: active}}
        expect: {status: 201}
        capture:
          proposal: {type: pointer, pointer: /id}
          draftEtag: {type: header, header: etag}
      - id: submit-proposal
        product: breg
        as: operator
        method: POST
        path: "/v1/proposals/{{proposal}}/submit"
        headers: {If-Match: "{{draftEtag}}", Idempotency-Key: submit-proposal}
        body: {}
        expect: {status: 200, json: {/state: submitted}}
        capture:
          submissionVersion: {type: pointer, pointer: /submissionVersion}
          effectDigest: {type: pointer, pointer: /effectDigest}
      - id: find-task
        product: casework
        as: reviewer
        method: GET
        path: /v1/review-tasks?queue=reviews
        headers: {Registry-Source-Profile: reviewer}
        expect: {status: 200}
        poll: {maximumWaitMilliseconds: 60000, pollIntervalMilliseconds: 500}
        capture:
          task: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /taskId}
          request: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /requestId}
          taskRevision: {type: find, find: /items, where: {pointer: /subject/id, equals: "{{proposal}}"}, pointer: /revision}
      - id: read-context-from-breg
        product: casework
        as: reviewer
        method: GET
        path: "/v1/review-tasks/{{task}}/context"
        headers: {Registry-Source-Profile: reviewer}
        expect:
          status: 200
          json:
            /context/projection/display/currentStatus: retired
            /context/projection/display/proposedStatus: active
      - id: claim-task
        product: casework
        as: reviewer
        method: POST
        path: "/v1/review-tasks/{{task}}/claim"
        headers: {If-Match: '"{{taskRevision}}"', Idempotency-Key: claim-task, Registry-Source-Profile: reviewer}
        expect: {status: 200}
        capture: {claimRevision: {type: pointer, pointer: /revision}}
      - id: ask-for-document
        product: casework
        as: reviewer
        method: POST
        path: "/v1/review-tasks/{{task}}/asks"
        headers: {If-Match: '"{{claimRevision}}"', Idempotency-Key: ask-document, Registry-Source-Profile: reviewer}
        body: {text: Please provide one supporting document., wants: [{kind: document}]}
        expect: {status: 200, json: {/task/marker: waiting, /ask/state: open}}
        capture:
          ask: {type: pointer, pointer: /ask/askId}
          due: {type: pointer, pointer: /ask/dueAt}
      - id: await-mirrored-ask
        product: breg
        as: operator
        method: GET
        path: "/v1/proposals/{{proposal}}"
        expect: {status: 200, json: {/status: awaiting-party, /turn: party, /asks/0/id: "{{ask}}"}}
        poll: {maximumWaitMilliseconds: 60000, pollIntervalMilliseconds: 500}
        capture: {askedEtag: {type: header, header: etag}}
      - id: find-party-turn
        product: breg
        as: operator
        method: GET
        path: /v1/proposals?turn=party
        expect: {status: 200, json: {/items/0/id: "{{proposal}}"}}
      - id: add-supporting-document
        product: breg
        as: operator
        method: POST
        path: "/v1/proposals/{{proposal}}/additions/supporting"
        headers: {If-Match: "{{askedEtag}}", Idempotency-Key: supporting-document}
        raw: {contentType: text/plain, base64: U3ludGhldGljIHN1cHBvcnRpbmcgZG9jdW1lbnQuCg==}
        expect: {status: 200}
        capture:
          addition: {type: pointer, pointer: /additions/supporting/items/0/id}
          addedEtag: {type: header, header: etag}
      - id: answer-through-source
        product: breg
        as: operator
        method: POST
        path: "/v1/proposals/{{proposal}}/asks/{{ask}}/answer"
        headers: {If-Match: "{{addedEtag}}", Idempotency-Key: answer-document}
        body: {text: Synthetic explanation for this correction., additions: ["{{addition}}"]}
        expect: {status: 200, json: {/status: in-review, /submissionVersion: "{{submissionVersion}}", /effectDigest: "{{effectDigest}}"}}
      - id: await-answer-delivery
        product: casework
        as: reviewer
        method: GET
        path: "/v1/review-tasks/{{task}}"
        headers: {Registry-Source-Profile: reviewer}
        expect: {status: 200, json: {/taskId: "{{task}}", /requestId: "{{request}}", /marker: answered}}
        poll: {maximumWaitMilliseconds: 60000, pollIntervalMilliseconds: 500}
        capture: {answerTaskRevision: {type: pointer, pointer: /revision}}
      - id: read-live-answer
        product: casework
        as: reviewer
        method: GET
        path: "/v1/review-tasks/{{task}}/context"
        headers: {Registry-Source-Profile: reviewer}
        expect:
          status: 200
          json:
            /asks/0/askId: "{{ask}}"
            /asks/0/taskId: "{{task}}"
            /asks/0/answer/text: Synthetic explanation for this correction.
            /asks/0/answer/documents/0/id: "{{addition}}"
        capture:
          downloadEffect: {type: value, pointer: /asks/0/answer/documents/0/download/path, query: effectDigest}
          downloadSchema: {type: value, pointer: /asks/0/answer/documents/0/download/path, query: contextSchemaDigest}
      - id: download-cited-file
        product: breg
        as: reviewer
        method: GET
        path: "/v1/proposals/{{proposal}}/additions/{{addition}}?accessProfile=reviewer&submissionVersion={{submissionVersion}}&reviewAskId={{ask}}&effectDigest={{downloadEffect}}&contextSchemaDigest={{downloadSchema}}"
        expect: {status: 200}
      - id: approve-correction
        product: casework
        as: reviewer
        method: POST
        path: "/v1/review-tasks/{{task}}/decisions"
        headers: {If-Match: '"{{answerTaskRevision}}"', Idempotency-Key: approve-correction, Registry-Source-Profile: reviewer}
        body: {decision: {type: approve, outcome: approved}}
        expect: {status: 204}
      - id: read-review-result
        product: casework
        as: producer
        method: GET
        path: "/v1/review-requests/{{request}}/result"
        expect: {status: 200, json: {/subject/id: "{{proposal}}", /status: approved}}
      - id: await-source-decision
        product: breg
        as: applier
        method: GET
        path: "/v1/proposals/{{proposal}}"
        expect: {status: 200, json: {/decision/status: approved}}
        poll: {maximumWaitMilliseconds: 60000, pollIntervalMilliseconds: 500}
        capture: {approvalEtag: {type: header, header: etag}}
      - id: apply-correction
        product: breg
        as: applier
        method: POST
        path: "/v1/proposals/{{proposal}}/apply"
        headers: {If-Match: "{{approvalEtag}}", Idempotency-Key: apply-correction}
        body: {submissionVersion: "{{submissionVersion}}", effectDigest: "{{effectDigest}}"}
        expect: {status: 200, json: {/state: applied}}
