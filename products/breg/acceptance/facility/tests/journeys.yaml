apiVersion: registry.registrystack.org/breg-journeys/v1
journeys:
  - id: bounded-facility-and-batch-validation
    steps:
      - id: create-north-district-facility
        entity: facility
        accessProfile: facility-operator
        claims: &north_operator_claims
          principal: synthetic-facility-operator
          purpose: facility-registry
          directClaims:
            administrative_boundaries: north-district
        request:
          operation: create
          data:
            facility-code: FACILITY-SYNTH-001
            display-name: Synthetic North District Facility
            administrative-boundary: north-district
        expect:
          outcome: success
          status: 201
          fields:
            facility-code: FACILITY-SYNTH-001
            display-name: Synthetic North District Facility
            administrative-boundary: north-district
        capture: north-facility
      - id: get-north-district-facility
        entity: facility
        accessProfile: facility-operator
        claims: *north_operator_claims
        request:
          operation: get
          recordRef: north-facility
        expect:
          outcome: success
          status: 200
          fields:
            facility-code: FACILITY-SYNTH-001
            administrative-boundary: north-district
      - id: rename-north-district-facility
        entity: facility
        accessProfile: facility-operator
        claims: *north_operator_claims
        request:
          operation: patch
          recordRef: north-facility
          etagRef: north-facility
          changes:
            - field: display-name
              value: Synthetic North District Producer
        expect:
          outcome: success
          status: 200
          fields:
            facility-code: FACILITY-SYNTH-001
            display-name: Synthetic North District Producer
            administrative-boundary: north-district
        capture: updated-north-facility
      - id: list-north-district-facilities
        entity: facility
        accessProfile: facility-operator
        claims: *north_operator_claims
        request:
          operation: list
        expect:
          outcome: success
          status: 200
          count: 1
      - id: south-district-claim-cannot-see-north-record
        entity: facility
        accessProfile: facility-operator
        claims:
          principal: synthetic-facility-operator
          purpose: facility-registry
          directClaims:
            administrative_boundaries: south-district
        request:
          operation: get
          recordRef: updated-north-facility
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
      - id: batch-refuses-out-of-bounds-installation
        entity: installation
        accessProfile: facility-operator
        claims: *north_operator_claims
        request:
          operation: batch
          items:
            - operation: create
              data:
                installation-code: INSTALLATION-SYNTH-INVALID-001
                permit: 00000000-0000-0000-0000-000000000001
                administrative-boundary: north-district
                centroid:
                  type: Point
                  coordinates:
                    - 200.0
                    - -9.5
                area-value: "1.2500"
                area-unit: hectare
                import-source: synthetic-survey
                source-record-id: installation-synth-invalid-001
        expect:
          outcome: refusal
          status: 400
          problemCode: request.invalid
