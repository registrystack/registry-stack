# yaml-language-server: $schema=https://id.registrystack.org/schemas/rstack/dev/dev.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/rstack/dev/v1alpha1
kind: RStackDev
# BReg alone. The scenario file sits under dev/, not tests/, because bregctl
# check reads every YAML file directly under tests/ as a BReg test.
issuer: https://identity.facility.example.test
products:
  - {product: breg, project: ., audience: "urn:example:facility-registry"}
people:
  facility-operator:
    subject: synthetic-facility-operator
    client: facility-operator
    grants:
      breg:
        profile: facility-operator
        scopes: []
        claims:
          administrative_boundaries: [north-district]
          registry_actor_kind: human
          registry_purpose: facility-registry
  facility-south-operator:
    subject: synthetic-facility-operator
    client: facility-operator
    grants:
      breg:
        profile: facility-operator
        scopes: []
        claims:
          administrative_boundaries: [south-district]
          registry_actor_kind: human
          registry_purpose: facility-registry
  statistics-publisher:
    subject: synthetic-statistics-publisher
    client: statistics-publisher
    grants:
      breg:
        profile: statistics-publisher
        scopes: ["registry:facility:statistics:publish"]
        claims: {registry_actor_kind: human, registry_purpose: facility-registry}
  statistics-reader:
    subject: synthetic-statistics-reader
    client: statistics-reader
    grants:
      breg:
        profile: statistics-reader
        scopes: ["registry:facility:statistics:read"]
        claims: {registry_actor_kind: human, registry_purpose: facility-registry}
# Both operators match the facility-operator profile, so each schema-test step names its person.
schemaTestPeople:
  bounded-facility-and-batch-validation:
    create-north-district-facility: facility-operator
    get-north-district-facility: facility-operator
    rename-north-district-facility: facility-operator
    list-north-district-facilities: facility-operator
    south-district-claim-cannot-see-north-record: facility-south-operator
    batch-refuses-out-of-bounds-installation: facility-operator
scenarioFile: dev/scenarios.yaml
