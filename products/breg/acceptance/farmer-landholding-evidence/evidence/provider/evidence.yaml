apiVersion: id.registrystack.org/formats/evidence/project/v1alpha1
kind: EvidenceProject
id: farmer-provider
selectorProfiles:
  farmer-number-v1:
    maximumAggregateBytes: 128
    fields:
      farmer-number:
        type: string
        minimumBytes: 3
        maximumBytes: 77
functions:
- id: derive-status
  interface: assertion-derive/v1
  source: functions/status.rhai
- id: derive-category
  interface: assertion-derive/v1
  source: functions/category.rhai
sources:
  source-status:
    pack: {id: farmer-facts, version: '1'}
    route: status
    connection: farmer-facts
    acquisitionPosture: field-projected
    inputs:
      reference:
        selector:
          role: farmer
          profile: farmer-number-v1
          field: farmer-number
  source-category:
    pack: {id: farmer-facts, version: '1'}
    route: category
    connection: farmer-facts
    acquisitionPosture: field-projected
    inputs:
      reference:
        selector:
          role: farmer
          profile: farmer-number-v1
          field: farmer-number
assertionDefinitions:
  farmer-status:
    question: Is the farmer record active?
    semantics:
      requirement: urn:example:farmer:status-v1
      kind: information-requirement
      evidenceType: urn:example:farmer:status-evidence
      referenceFrameworks:
      - urn:example:farmer:framework
    purpose: land-registration
    grantCeiling:
      authorities: [statutory]
      actorKinds: [service]
      valueOrigins: [request]
      audiences: [urn:example:landholding]
    subjects:
    - role: farmer
      selectors: [farmer-number-v1]
    acquisition:
      source: source-status
    derive:
      function: derive-status
    outputs:
      active:
        concept: urn:example:farmer:active
        type: boolean
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations: [signed-jws]
    observationTimezone: Asia/Bangkok
    fixtures: fixtures/status.yaml
    disclosureGuard:
      families: [urn:example:farmer:status]
    existenceDisclosure: collapse-unresolved
  farmer-category:
    question: What is the farmer category?
    semantics:
      requirement: urn:example:farmer:category-v1
      kind: information-requirement
      evidenceType: urn:example:farmer:category-evidence
      referenceFrameworks:
      - urn:example:farmer:framework
    purpose: land-registration
    grantCeiling:
      authorities: [statutory]
      actorKinds: [service]
      valueOrigins: [request]
      audiences: [urn:example:landholding]
    subjects:
    - role: farmer
      selectors: [farmer-number-v1]
    acquisition:
      source: source-category
    derive:
      function: derive-category
    outputs:
      category:
        concept: urn:example:farmer:category
        type: controlled-category
        categoryScheme: urn:example:farmer:categories
        schemeVersion: '1'
        maximumBytes: 32
        codelist: codelists/categories.yaml
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations: [signed-jws]
    observationTimezone: Asia/Bangkok
    fixtures: fixtures/category.yaml
    disclosureGuard:
      families: [urn:example:farmer:category]
    existenceDisclosure: collapse-unresolved
