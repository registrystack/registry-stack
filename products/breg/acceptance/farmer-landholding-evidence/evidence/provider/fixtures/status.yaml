apiVersion: id.registrystack.org/formats/evidence/fixture/v1alpha1
kind: EvidenceFixture
syntheticOnly: true
common:
  observedAt: '2026-09-08T00:00:00Z'
  selectors:
    farmer:
      profile: farmer-number-v1
      values:
        farmer-number: TH-00042
cases:
- id: positive
  acquisition:
    intercepts: [{type: endpoint, endpoint: provider}]
    exchanges:
    - request:
        endpoint: provider
        method: POST
        path: /v1/facts
        headers: {accept: application/json}
        body: {reference: TH-00042, fields: [reference, active], limit: 2}
      response:
        status: 200
        body: {total: 1, reference: TH-00042, active: true, category: smallholder}
  expected: {lookup: match, derivationRuns: true, signed: true, value: true}
