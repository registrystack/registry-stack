apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: placement-correction-request-flow
    steps:
      - id: create-asset
        entity: asset-item
        accessProfile: asset-operator
        claims:
          principal: asset-operator
          purpose: asset-management
        request:
          type: create
          data: {asset-code: pump-001, label: Pump 001, asset-class: equipment}
        expect:
          outcome: success
          status: 201
          fields: {asset-code: pump-001, label: Pump 001, asset-class: equipment}
        capture: asset
      - id: create-original-site
        entity: asset-site
        accessProfile: asset-operator
        claims:
          principal: asset-operator
          purpose: asset-management
        request:
          type: create
          data: {site-code: north-yard, label: North Yard}
        expect:
          outcome: success
          status: 201
          fields: {site-code: north-yard, label: North Yard}
        capture: original-site
      - id: create-corrected-site
        entity: asset-site
        accessProfile: asset-operator
        claims:
          principal: asset-operator
          purpose: asset-management
        request:
          type: create
          data: {site-code: south-yard, label: South Yard}
        expect:
          outcome: success
          status: 201
          fields: {site-code: south-yard, label: South Yard}
        capture: corrected-site
      - id: create-placement
        entity: asset-placement
        accessProfile: asset-operator
        claims:
          principal: asset-operator
          purpose: asset-management
        request:
          type: create
          data: {asset: {recordCapture: asset}, site: {recordCapture: original-site}, valid-from: "2026-01-01"}
        expect:
          outcome: success
          status: 201
          fields: {valid-from: "2026-01-01"}
        capture: placement
      - id: submitter-lists-placement-options
        entity: asset-placement
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: list}
        expect: {outcome: success, status: 200, count: 1}
      - id: submitter-lists-site-options
        entity: asset-site
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: list}
        expect: {outcome: success, status: 200, count: 2}
      - id: submitter-reads-placement-asset-label
        entity: asset-item
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: get, recordCapture: asset}
        expect:
          outcome: success
          status: 200
          fields: {asset-code: pump-001, label: Pump 001}
      - id: create-correction-request
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request:
          type: create
          data: {placement: {recordCapture: placement}, proposed-site: {recordCapture: corrected-site}, reason: site correction after field audit}
        expect:
          outcome: success
          status: 201
          fields: {reason: site correction after field audit}
        capture: correction-request
      - id: submitter-lists-own-requests
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: list}
        expect: {outcome: success, status: 200, count: 1}
      - id: edit-correction-request
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request:
          type: patch
          recordCapture: correction-request
          etagCapture: correction-request
          changes:
            - {field: reason, value: site correction after supervisor field audit}
        expect:
          outcome: success
          status: 200
          fields: {reason: site correction after supervisor field audit}
        capture: edited-correction-request
      - id: get-before-submit
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: get, recordCapture: edited-correction-request}
        expect:
          outcome: success
          status: 200
          fields: {reason: site correction after supervisor field audit}
        capture: correction-before-submit
      - id: submit-correction-request
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: submit-request, recordCapture: correction-before-submit, etagCapture: correction-before-submit}
        expect: {outcome: success, status: 200}
      - id: external-review-reader-sees-submission
        entity: placement-correction-request
        accessProfile: correction-reviewer
        claims:
          principal: correction-reviewer
          scopes: [registry:corrections:review]
          purpose: asset-correction-review
        request: {type: get, recordCapture: correction-request}
        expect:
          outcome: success
          status: 200
          fields: {reason: site correction after supervisor field audit}
      - id: submitter-reads-submitted-request
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: get, recordCapture: correction-request}
        expect: {outcome: success, status: 200}
        capture: submitted-correction
      - id: submitter-cancels-external-review
        entity: placement-correction-request
        accessProfile: correction-submitter
        claims:
          principal: correction-submitter
          scopes: [registry:corrections:submit]
          purpose: asset-correction
        request: {type: cancel-request, recordCapture: submitted-correction, etagCapture: submitted-correction}
        expect: {outcome: success, status: 200}
