resource_type: flow
id: 01990000-0000-7000-8000-000000000064
name: Citizen SMS registration
handle: citizen-sms-registration
flowType: REGISTRATION
nodes:
  - id: start
    type: START
    onSuccess: user_type_resolver
  - id: user_type_resolver
    type: TASK_EXECUTION
    executor:
      name: UserTypeResolver
    onSuccess: prompt_mobile
    onIncomplete: prompt_mobile
  - id: prompt_mobile
    type: PROMPT
    prompts:
      - inputs:
          - ref: input_mobile
            identifier: mobile_number
            type: PHONE_INPUT
            required: true
          - ref: input_actor_kind
            identifier: registry_actor_kind
            type: HIDDEN
            required: true
            validation:
              - type: regex
                value: '^human$'
        action:
          ref: action_send_otp
          nextNode: generate_otp
  - id: generate_otp
    type: TASK_EXECUTION
    executor:
      name: OTPExecutor
      mode: generate
      inputs:
        - ref: input_mobile
          identifier: mobile_number
          type: PHONE_INPUT
          required: true
    onSuccess: send_sms
  - id: send_sms
    type: TASK_EXECUTION
    properties:
      senderId: 01990000-0000-7000-8000-000000000080
      smsTemplate: OTP
    executor:
      name: SMSExecutor
    onSuccess: prompt_otp
  - id: prompt_otp
    type: PROMPT
    prompts:
      - inputs:
          - ref: input_otp
            identifier: otp
            type: OTP_INPUT
            required: true
        action:
          ref: action_verify_otp
          nextNode: verify_otp
  - id: verify_otp
    type: TASK_EXECUTION
    executor:
      name: OTPExecutor
      mode: verify
    onSuccess: provision
    onIncomplete: prompt_otp
  - id: provision
    type: TASK_EXECUTION
    properties:
      assignRole: 01990000-0000-7000-8000-000000000050
    executor:
      name: ProvisioningExecutor
      inputs:
        - ref: input_mobile
          identifier: mobile_number
          type: PHONE_INPUT
          required: true
        - ref: input_actor_kind
          identifier: registry_actor_kind
          type: HIDDEN
          required: true
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: end
    type: END
