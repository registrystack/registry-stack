apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project:
  id: citizen-self-registration-review
  version: "1"
accessProfiles:
  - id: registration-reviewer
    principalClaim: registry_principal
    requiredScopes: [registration:review]
    role: staff
  - id: registration-supervisor
    principalClaim: registry_principal
    requiredScopes: [registration:casework-supervisor]
    role: supervisor
  - id: registration-administrator
    principalClaim: registry_principal
    requiredScopes: [registration:casework-admin]
    role: administrator
  - id: registration-producer
    principalClaim: registry_principal
    requiredScopes: [casework:reviews:request]
    role: requester
sources:
  - id: citizen-self-registration
    adapter: breg
    description: sources/citizen-self-registration.json
    requests:
      - entity: registration-application
        queue: registration-review
        # The create-only BReg request has no existing-record field to carry
        # its lifecycle event, so source-add carries the first projected field.
        projection: [owner, given-name, family-name, date-of-birth, program-code]
        contextProjection:
          - owner
          - given-name
          - family-name
          - date-of-birth
          - program-code
queues:
  - id: registration-review
    label: Citizen registrations awaiting review
reviewKinds:
  - id: citizen-registration
    version: "1"
    purpose: approval
    contextStrategy: source
    stages:
      - id: review
        queue: registration-review
        decidingProfiles: [registration-reviewer]
        excludeInitiator: true
        requiredApprovals: 1
    outcomes:
      - id: changes-requested
        label: Request changes
        settlement: changes-requested
        reasonRequired: true
      - id: rejected
        label: Reject registration
        settlement: rejected
        reasonRequired: true
    retention:
      terminalDays: 30
      accountabilityDays: 365
    displaySchema:
      type: object
      additionalProperties: false
      properties:
        owner: {type: string, maxLength: 128}
        givenName: {type: string, minLength: 1, maxLength: 120}
        familyName: {type: string, minLength: 1, maxLength: 120}
        dateOfBirth: {type: string, format: date}
        programCode:
          type: string
          enum: [synthetic-citizen-program]
reviewProducers:
  - id: registration-producer
    profile: registration-producer
    issuer: http://127.0.0.1:8091
    subject: registration-producer
    trustedInitiatorIssuer: http://127.0.0.1:8091
    sourceNamespaces: [citizen-self-registration]
    kinds: [citizen-registration]
    recoveryDays: 7
