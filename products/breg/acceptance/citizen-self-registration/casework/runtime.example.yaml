apiVersion: id.registrystack.org/formats/casework/runtime/v1alpha1
kind: CaseworkRuntimeConfig
identity:
  databaseId: citizen-self-registration-casework
package:
  root: "${CASEWORK_PACKAGE_ROOT:?set CASEWORK_PACKAGE_ROOT to the absolute packaged Casework directory}"
listener:
  bind: 127.0.0.1:8096
  tlsTermination: development-loopback
  networkExposure: private-address
secretProviders:
  file:
    root: /REPLACE_WITH_OWNER_ONLY_CASEWORK_SECRET_ROOT
database:
  runtimeUrlRef: secret:file/runtime-database-url
  migrationUrlRef: secret:file/migration-database-url
authentication:
  oidc:
    issuer: "${THUNDERID_ISSUER:?set THUNDERID_ISSUER to the exact BReg dev issuer}"
    audience: "${REGISTRY_RESOURCE:?set REGISTRY_RESOURCE to the shared Casework and BReg resource audience}"
    allowedClients:
      - "${REGISTRATION_CONSOLE_CLIENT_ID:?set REGISTRATION_CONSOLE_CLIENT_ID to its ThunderID client_id}"
      - "${REGISTRATION_PRODUCER_CLIENT_ID:?set REGISTRATION_PRODUCER_CLIENT_ID to its ThunderID client_id}"
    scopeClaim: scope
    humanIdentity:
      claim: registry_actor_kind
      value: human
audit:
  path: "${CASEWORK_AUDIT_PATH:?set CASEWORK_AUDIT_PATH to an absolute owner-only path}"
  hashKeyRef: secret:file/casework-audit-key
sources:
  citizen-self-registration:
    baseUrl: "${BREG_BASE_URL:?set BREG_BASE_URL to the numeric-loopback BReg origin}"
    readerProfile: casework-reader
    tokenEndpoint: "${THUNDERID_TOKEN_ENDPOINT:?set THUNDERID_TOKEN_ENDPOINT from BReg dev status}"
    clientAssertionAudience: "${THUNDERID_ASSERTION_AUDIENCE:?set THUNDERID_ASSERTION_AUDIENCE from BReg dev status}"
    resource: "${REGISTRY_RESOURCE:?set REGISTRY_RESOURCE to the BReg resource audience}"
    scopes: [casework:source-reader]
    clientIdRef: secret:file/casework-reader-client-id
    clientAssertionKeyRef: secret:file/casework-reader-private-jwk
    webhookSecretRef: secret:file/breg-casework-webhook
    eventSource: "${BREG_EVENT_SOURCE:?set BREG_EVENT_SOURCE to the active registry instance event source}"
