apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: business-establishments
  canonicalBaseIri: "https://business-establishments.example.gov"
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: business-establishments-acceptance
  sequence: 1
  sourceRevision: business-establishments-acceptance-0.1.0
manifestProjection:
  accessProfile: business-operator
  classificationCeiling: restricted
  catalog:
    baseUrl: https://business-establishments.example.gov
    title:
      en: Business Establishments Registry Catalog
      fr: Catalogue du registre des entreprises et établissements
    description: &a1
      en: Business, establishment, and dated operator assignment metadata.
      fr: Métadonnées des entreprises, des établissements et de leurs exploitants successifs.
    publisher:
      id: "business-establishments-authority"
      name: Business Registration Authority
      iri: https://business-establishments.example.gov/authority
    conformsTo:
      - https://www.w3.org/TR/vocab-dcat-3/
    standards:
      dcat: "3.0"
      jsonSchema: 2020-12
  datasets:
    -
      id: business-registry
      title:
        en: Business Establishments Registry
        fr: Registre des entreprises et établissements
      description: *a1
      owner: Business Registration Authority
      status: active
      version: "2026.1"
    - id: registered-businesses
      iri: https://business-establishments.example.gov/datasets/registered-businesses
      title:
        en: Registered businesses
        fr: Entreprises enregistrées
      description:
        en: Authoritative business identities and registration attributes.
        fr: Identités et attributs d’enregistrement des entreprises faisant autorité.
      owner: Business Registration Authority
      status: active
      accessProfile: business-operator
      classificationCeiling: restricted
  dataServices:
    -
      id: business-registry-api
      iri: https://business-establishments.example.gov/services/registry-api
      title:
        en: Business Establishments Registry REST API
        fr: API REST du registre des entreprises et établissements
      endpointUrl: https://business-establishments.example.gov/v1
      endpointDescription: https://business-establishments.example.gov/openapi.json
      conformsTo: https://spec.openapis.org/oas/v3.1.0
      servesDatasets:
        - "business-registry"
        - registered-businesses
  entities:
    - id: establishment
      title:
        en: Establishment
        fr: Établissement
      description:
        en: A establishment recorded in this synthetic registry.
      conceptUri: https://business-establishments.example.gov/model/establishment
      identifiers:
        - field: establishment-code
          kind: local
      fields:
        - id: establishment-code
          concepts:
            - https://business-establishments.example.gov/model/establishment-code
        - id: site-name
          concepts:
            - https://business-establishments.example.gov/model/site-name
        - id: locality
          concepts:
            - https://business-establishments.example.gov/model/locality
        - id: opened-on
          concepts:
            - https://business-establishments.example.gov/model/opened-on
        - id: establishment-kind
          concepts:
            - https://business-establishments.example.gov/model/establishment-kind
    - id: business
      title:
        en: Business
        fr: Entreprise
      description:
        en: A business recorded in this synthetic registry.
      conceptUri: https://business-establishments.example.gov/model/business
      identifiers:
        - field: business-code
          kind: local
      fields:
        - id: business-code
          concepts:
            - https://business-establishments.example.gov/model/business-code
        - id: local-registration-number
          concepts:
            - https://business-establishments.example.gov/model/local-registration-number
        - id: registered-name
          concepts:
            - https://business-establishments.example.gov/model/registered-name
    - id: operator-assignment
      title:
        en: Operator assignment
        fr: Affectation à un exploitant
      description:
        en: A dated assignment of an establishment to its operating business.
      conceptUri: https://business-establishments.example.gov/model/operator-assignment
      fields:
        - id: establishment
          relationshipRole: establishment
          relationshipConceptUri: https://business-establishments.example.gov/model/establishment
        - id: business
          relationshipRole: operator
          relationshipConceptUri: https://business-establishments.example.gov/model/business
        - id: relationship
          concepts:
            - https://business-establishments.example.gov/model/relationship
        - id: valid-from
          concepts:
            - https://business-establishments.example.gov/model/valid-from
        - id: valid-to
          concepts:
            - https://business-establishments.example.gov/model/valid-to
  vocabularies:
    - id: establishment-role
      schemeIri: https://business-establishments.example.gov/model/establishment-role
    - id: business-type
      schemeIri: https://business-establishments.example.gov/model/business-type
    - id: operating-status
      schemeIri: https://business-establishments.example.gov/model/operating-status
    - id: preferred-language
      schemeIri: https://business-establishments.example.gov/model/preferred-language
    - id: establishment-kind
      schemeIri: https://business-establishments.example.gov/model/establishment-kind
  publicService:
    id: "business-establishments-service"
    title:
      en: Business Establishments Registry Catalog
      fr: Catalogue du registre des entreprises et établissements
  distributions:
    - id: registered-businesses-api
      dataset: registered-businesses
      accessService: business-registry-api
      accessUrl: https://business-establishments.example.gov/v1/businesses
      mediaType: application/json
modules:
  - id: business-establishment-summary
    version: 0.1.0
    digest: "sha256:fff64050110b870b6ecdda5ec48ec85d6950ca77f6e7fd6b50157da9ea92672c"
  - id: business-establishments-core
    version: 0.1.0
    digest: sha256:105de8fd3754b8dbd79ec7fd0e896d9fb5231bfbfd4d3cdc3595eb626af524b6

accessProfiles:
  - id: business-operator
    default: true
    principalClaim: registry_principal
    requiredScopes:
      - registry:business:operate
    requiredPurposes:
      - business-administration
    grants:
      - entity: establishment
        rowBoundaries: []
        operations:
          - create
          - get
          - list
          - patch
          - batch
        readableFields:
          - establishment-code
          - site-name
          - locality
          - opened-on
          - establishment-kind
          - operating-status
          - preferred-language
        writableFields:
          - establishment-code
          - site-name
          - locality
          - opened-on
          - establishment-kind
          - operating-status
          - preferred-language
        filterableFields:
          - establishment-code
          - establishment-kind
          - operating-status
        sortableFields:
          - establishment-code
      - entity: business
        rowBoundaries: []
        operations:
          - create
          - get
          - lookup
          - list
          - patch
          - batch
        readableFields:
          - business-code
          - local-registration-number
          - registered-name
          - administrative-area
          - business-type
          - head-office-count
          - branch-count
          - production-site-count
          - suspended-site-count
          - has-head-office
          - has-production-site
        writableFields:
          - business-code
          - local-registration-number
          - registered-name
          - administrative-area
          - business-type
        filterableFields:
          - business-code
          - local-registration-number
          - administrative-area
          - business-type
          - head-office-count
          - branch-count
          - production-site-count
          - suspended-site-count
          - has-head-office
          - has-production-site
        sortableFields:
          - local-registration-number
          - business-code
          - branch-count
        allowCount: true
        lookups:
          - selector: by-local-reference
            valueOrigin: request
          - selector: by-business-code
            valueOrigin: request
        readPaths:
          - path: establishments
            readableFields:
              - establishment-code
              - site-name
              - locality
              - opened-on
              - establishment-kind
              - operating-status
            filterableFields:
              - establishment-kind
              - operating-status
            sortableFields:
              - establishment-code
            allowCount: true
      - entity: operator-assignment
        rowBoundaries: []
        operations:
          - create
          - get
          - list
          - patch
          - batch
        readableFields:
          - establishment
          - business
          - relationship
          - valid-from
          - valid-to
        writableFields:
          - establishment
          - business
          - relationship
          - valid-from
          - valid-to
        filterableFields:
          - establishment
          - business
          - relationship
          - valid-from
  - id: business-viewer
    principalClaim: registry_principal
    requiredScopes:
      - registry:business:view
    requiredPurposes:
      - business-view
    grants:
      - entity: business
        operations:
          - get
          - lookup
        readableFields:
          - business-code
          - local-registration-number
          - registered-name
          - administrative-area
          - business-type
        rowBoundaries:
          - field: id
            claim: business_id
            operator: equals
        lookups:
          - selector: by-business-code
            valueOrigin: verified_claim
            claimMapping:
              business-code: business_code
vocabularies:
  - id: establishment-role
    values:
      - head-office
      - regional-office
      - branch
      - depot
      - other
  - id: business-type
    values:
      - private
      - cooperative
      - public-enterprise
  - id: operating-status
    values:
      - operating
      - suspended
      - closed
  - id: preferred-language
    values:
      - en
      - es
      - fr
  - id: establishment-kind
    values:
      - production
      - warehouse
      - office
