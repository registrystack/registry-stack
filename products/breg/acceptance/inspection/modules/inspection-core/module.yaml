apiVersion: id.registrystack.org/formats/breg/module/v1alpha1
kind: BRegModule
id: inspection-core
version: 0.1.0
entities:
  - id: public-authority
    primaryDataset: "inspection"
    route: authorities
    mutationMode: mutable
    classification: restricted
    fields:
      - id: authority-code
        type: string
        required: true
        maximumLength: 64
        classification: restricted
      - id: name
        type: string
        required: true
        maximumLength: 160
        classification: restricted
      - id: jurisdiction
        type: string
        required: true
        maximumLength: 80
        classification: restricted
    constraints:
      - type: unique
        fields:
          - authority-code
