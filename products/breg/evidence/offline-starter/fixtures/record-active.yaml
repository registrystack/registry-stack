# The fixture set `evidencectl test` replays offline. It is the proof that the
# source, statement, schemas, extraction, and derivation still agree with each
# other, so it is edited with them rather than after them.
fixture: registry.evidence.reference.breg-offline-record-active/v1

# Every value below is invented. `synthetic_only` says so, and the run refuses
# to reach a real source.
synthetic_only: true

# What every case starts from: the observation time, the caller input, and the
# extract the statement runs against. A case overrides only what it is about.
common:
  observed_at: "2026-09-01T00:00:00Z"
  selectors:
    subject:
      profile: record-by-code-v1
      values: {code: SYNTHETIC-ACTIVE}
  extract: |
    CREATE TABLE evidence_extract (
      published_at TEXT NOT NULL,
      publisher    TEXT NOT NULL,
      extract_id   TEXT NOT NULL
    );
    INSERT INTO evidence_extract (published_at, publisher, extract_id) VALUES
      ('2026-08-31T00:00:00Z',
       'urn:example:publisher:synthetic-register',
       'synthetic-record-status-2026-08-31');

    CREATE TABLE records (
      record_id     TEXT NOT NULL PRIMARY KEY,
      code          TEXT NOT NULL,
      status        TEXT NOT NULL,
      private_label TEXT NOT NULL
    );
    INSERT INTO records
      (record_id, code, status, private_label)
    VALUES
      ('ROW-0001', 'SYNTHETIC-ACTIVE', 'active', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0002', 'SYNTHETIC-RETIRED', 'retired', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0003', 'SYNTHETIC-DUPLICATE', 'active', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0004', 'SYNTHETIC-DUPLICATE', 'retired', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0005', 'SYNTHETIC-POPULAR', 'active', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0006', 'SYNTHETIC-POPULAR', 'active', 'PRIVATE-SYNTHETIC-LABEL'),
      ('ROW-0007', 'SYNTHETIC-POPULAR', 'retired', 'PRIVATE-SYNTHETIC-LABEL');
  # The request the source is expected to make. A change that would send more
  # than this, or send it somewhere else, fails here rather than in a
  # deployment.
  expectedRequestParts:
    parameters: {}
  expectedTransport:
    statement: queries/record-status.sql

# One case per behaviour the question has to keep. Each names the input it
# varies and the outcome it expects, so a case that starts passing for a new
# reason is as visible as one that starts failing.
cases:
  - id: positive
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-ACTIVE}
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      facts: {status: active}
      value: true

  - id: negative-retired
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-RETIRED}
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      facts: {status: retired}
      value: false

  # No match and ambiguity are reported to a caller identically, so neither
  # answers whether a record exists.
  - id: no-match
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-MISSING}
    expected:
      lookup: no_match
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false

  - id: ambiguous
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-DUPLICATE}
    expected:
      lookup: ambiguous
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false

  # The bounds hold: a result past `maximumRows` and an extract past its age
  # limit both fail the request instead of returning a partial or stale answer.
  - id: result-past-row-bound
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-POPULAR}
    expected:
      publicProblem: source.unavailable
      signed: false
      sourceRequestCount: 1

  - id: boundary-extract-at-age-bound
    observed_at: "2026-09-07T00:00:00Z"
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-ACTIVE}
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      value: true

  - id: stale-extract
    observed_at: "2026-09-07T00:00:01Z"
    selectors:
      subject:
        profile: record-by-code-v1
        values: {code: SYNTHETIC-ACTIVE}
    expected:
      publicProblem: source.unavailable
      signed: false
      sourceRequestCount: 1

  - id: source-failure
    sourceFailure: timeout
    expected:
      publicProblem: source.unavailable
      signed: false
      sourceRequestCount: 1

  - id: missing-statement-parameter
    sourceFailure: statement-parameter
    expected:
      publicProblem: source.unavailable
      signed: false
      sourceRequestCount: 1

  # The refusals: a mutated statement, a hostile code that stays a bound
  # value, a derivation returning something the disclosure list forbids, and a
  # bundle that would let two disclosures be recombined.
  - id: statement-refused
    statementMutation: attach-external-database
    expected: {bundle: rejected}

  - id: hostile-code-remains-data
    selectorOverrides:
      subject:
        values: {code: "X' OR '1'='1"}
    expected:
      sourceRequestCount: 1
      expectedTransport:
        statement: queries/record-status.sql
        parameters:
          code: "X' OR '1'='1"

  - id: output-gate-rejects-a-raw-reference
    derivationMutation: return-raw-reference
    expected:
      outputGate: rejected
      signed: false

  - id: anti-reconstruction
    bundleMutation: duplicate-disclosure-family
    expected: {bundle: rejected}
# What must never appear in a signed assertion or in diagnostics. The canary
# strings are unrelated source values, present so that a leak of the whole row
# fails a case instead of passing quietly.
privacyExpectation:
  evidenceContains: [urn:example:concept:record-active:active]
  evidenceExcludes:
    - status
    - code
    - SYNTHETIC-ACTIVE
    - SYNTHETIC-RETIRED
    - ROW-0001
    - records
    - private_label
    - PRIVATE-SYNTHETIC-LABEL
  diagnosticsExclude: [SYNTHETIC-ACTIVE, ROW-0001, PRIVATE-SYNTHETIC-LABEL]
