- id: positive
  acquisition:
    intercepts:
    - type: endpoint
      endpoint: registry
    - type: token-endpoint
      endpoint: registry
    exchanges:
    - request:
        endpoint: registry
        tokenRequest: true
        method: POST
        path: /oauth2/token
      response:
        status: 200
        body:
          access_token: synthetic-registry-replay-token
          token_type: Bearer
          expires_in: 60
    - request:
        endpoint: registry
        method: POST
        path: /v1/records/records:lookup
        query: '%24select=checkCode%2Ccode%2Cstatus&accessProfile=evidence-source'
        headers:
          accept: application/json
        body:
          selector: by-code
          values:
            code: SYNTHETIC-ACTIVE
      response:
        status: 200
        headers:
          content-type: application/json
        body: {"data": {"domainData": {"code": "SYNTHETIC-ACTIVE", "status": "active", "checkCode": "K7QWM4XRT5PZ3NB6VHJYDC2A", "label": "SYNTHETIC-PRIVATE-LABEL"}}}
  expected:
    lookup: match
    derivationRuns: true
    signed: true
    facts:
      status: active
      check-code: K7QWM4XRT5PZ3NB6VHJYDC2A
    values:
