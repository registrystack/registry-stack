# yaml-language-server: $schema=https://id.registrystack.org/schemas/breg/dev-clients/dev-clients.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/breg/dev-clients/v1alpha1
kind: BRegDevClients
# Synthetic local callers. Keys and tokens are generated by `bregctl dev`.
clients:
  - id: operator-editor
    accessProfiles: [operator-editor]
    scopes: [registry:operator:write]
    claims: {registry_principal: synthetic-operator-editor, registry_purpose: facility-administration, jurisdiction: zone-a}
  - id: registrar
    accessProfiles: [facility-registrar]
    scopes: [registry:facility:register]
    claims: {registry_principal: synthetic-registrar, registry_purpose: facility-administration, jurisdiction: zone-a}
  - id: reader
    accessProfiles: [facility-reader]
    scopes: [registry:facility:read]
    claims: {registry_principal: synthetic-reader, registry_purpose: facility-administration, jurisdiction: zone-a}
  - id: foreign-reader
    accessProfiles: [facility-reader]
    scopes: [registry:facility:read]
    claims: {registry_principal: synthetic-foreign-reader, registry_purpose: facility-administration, jurisdiction: zone-b}
    testBindings:
      - {journeyId: register-facility, stepId: conceal-foreign-facility}
  - id: author
    accessProfiles: [facility-correction-author]
    scopes: [registry:facility:correction:submit]
    allowHumanFixture: true
    claims: {registry_actor_kind: human, registry_principal: synthetic-author, registry_purpose: facility-administration, jurisdiction: zone-a}
  - id: applier
    accessProfiles: [facility-correction-applier]
    scopes: [registry:facility:correction:apply]
    allowHumanFixture: true
    claims: {registry_actor_kind: human, registry_principal: synthetic-applier, registry_purpose: facility-administration, jurisdiction: zone-a}
  - id: reviewer
    accessProfiles: [proposal-reviewer]
    scopes: [registry:proposal:review]
    allowHumanFixture: true
    claims: {registry_actor_kind: human, registry_principal: synthetic-reviewer, registry_purpose: facility-review, jurisdiction: zone-a}
  - id: directory-editor
    accessProfiles: [directory-editor]
    scopes: [registry:directory:write]
    claims: {registry_principal: synthetic-directory-editor, registry_purpose: directory-administration, jurisdiction: zone-a}
  - id: other-author
    accessProfiles: [facility-correction-author]
    scopes: [registry:facility:correction:submit]
    allowHumanFixture: true
    claims: {registry_actor_kind: human, registry_principal: synthetic-other-author, registry_purpose: facility-administration, jurisdiction: zone-a}
    testBindings:
      - {journeyId: register-facility, stepId: conceal-other-author-proposal}
