# yaml-language-server: $schema=https://id.registrystack.org/schemas/breg/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: reviewed-directory
  canonicalBaseIri: https://directory.example.gov
  version: 0.1.0
  defaultLanguage: en
  display: {label: Reviewed directory, description: A contact directory with reviewed name corrections.}

datasets:
  - id: directory
    display: {label: Directory, description: Institutional contact records.}

reviewAuthorities:
  - id: local-review
    protocol: id.registrystack.org/protocols/review/v1
    display: {label: Directory review, description: External review authority bound by deployment configuration.}

recordTypes:
  - id: contact
    route: contacts
    primaryDataset: directory
    mutationMode: mutable
    mutationPolicy: {patch: proposal-required}
    display: {label: Contact, description: A contact whose name changes require review.}
    fields:
      - {id: name, type: string, required: true, minimumLength: 1, maximumLength: 160, classification: internal}
      - {id: jurisdiction, type: string, required: true, minimumLength: 1, maximumLength: 40, classification: internal}

actions:
  - id: correct-name
    display: {label: Correct contact name, description: Freeze one correction for independent review and automatic application.}
    execution:
      mode: proposal
      proposal:
        review:
          type: required
          authority: local-review
          source: reviewed-directory
          # Optional exact-pin variant, with synthetic test values. Usually select by ID only.
          # To require an exact policy, replace these values with its compiled PolicyBinding.
          policy: {id: directory-name-review, version: '1', digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}
        reviewContext:
          id: directory-name-context
          fields:
            contactId: {type: input, input: contact}
            currentName: {type: record, input: contact, field: name}
            proposedName: {type: input, input: name}
        # Omitted application uses the automatic built-in executor after fresh approval.
        retention: {mode: retain}
    inputs:
      - {id: contact, apiName: contactId, type: reference, target: contact, required: true, classification: internal}
      - {id: name, type: string, required: true, minimumLength: 1, maximumLength: 160, classification: internal}
    commitGuards:
      targets:
        - {input: contact, revision: unchanged}
    plan:
      type: fixed
      effects:
        - id: contact-name
          target: {fromInput: contact}
          operation: patch
          set:
            name: {fromInput: name}

accessProfiles:
  - id: directory-editor
    default: true
    principalClaim: registry_principal
    requiredScopes: ["registry:directory:write"]
    requiredPurposes: [directory-administration]
    permissions:
      records:
        - recordType: contact
          operations: [create, get, list]
          readableFields: [name, jurisdiction]
          writableFields: [name, jurisdiction]
          rowBoundaries:
            - {field: jurisdiction, claim: jurisdiction, operator: equals}
      actions:
        - action: correct-name
          operations: [start]
          targets:
            - recordType: contact
              rowBoundaries:
                - {field: jurisdiction, claim: jurisdiction, operator: equals}
      proposals:
        - action: correct-name
          operations: [get, list, submit, cancel]
          readableInputs: [contact, name]
          ownership: caller
          targets:
            - recordType: contact
              rowBoundaries:
                - {field: jurisdiction, claim: jurisdiction, operator: equals}
  - id: directory-reviewer
    principalClaim: registry_principal
    requiredScopes: ["registry:directory:review"]
    requiredPurposes: [directory-administration]
    permissions:
      records:
        - recordType: contact
          operations: [get]
          readableFields: [name]
          rowBoundaries:
            - {field: jurisdiction, claim: jurisdiction, operator: equals}
      proposals:
        - action: correct-name
          operations: [get-review-context]
          readableContextFields: [contactId, currentName, proposedName]
          targets:
            - recordType: contact
              rowBoundaries:
                - {field: jurisdiction, claim: jurisdiction, operator: equals}
