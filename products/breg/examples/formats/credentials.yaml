# The credentials `bregctl test --credentials` reads: one binding for every
# step of the packaged journeys. A bearer token is named by secret reference,
# never written here.
apiVersion: id.registrystack.org/formats/breg/schema-test-credentials/v1
kind: BRegSchemaTestCredentials
bindings:
  - journeyId: asset-and-site-caller-surfaces
    stepId: create-asset
    credential:
      type: bearer
      tokenRef: secret:file/operator-token
  - journeyId: asset-and-site-caller-surfaces
    stepId: planner-gets-asset
    credential:
      type: bearer
      tokenRef: secret:env/PLANNER_TOKEN
  - journeyId: asset-and-site-caller-surfaces
    stepId: planner-without-purpose-is-concealed
    credential:
      type: bearer
      tokenRef: secret:file/planner-no-purpose-token
