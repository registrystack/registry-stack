# Example HTTP provider package for a generic JSON gateway that carries email
# and SMS, deduplicates on an idempotency key, and reports delivery through a
# signed JSON callback. Local development points it at a loopback mock.
# The package ships it as providers/<providerId>/, and the provider's entry in
# messaging.yaml declares `idempotentSubmit: true`, which is what puts the
# key in the prepare script's view.
prepareScript: scripts/prepare.rhai
interpretScript: scripts/interpret.rhai
receiptScript: scripts/receipt.rhai
request:
  method: post
  headers: [idempotency-key, x-request-id]
responseHeaders: [x-request-id]
capabilities:
  receipts: callback
  concurrencyLimit: 8
