  - id: MESSAGING-DEC-28
    subject: Provider callbacks are charged to a fixed per-provider rate before they are verified
    decision: >-
      Each provider the runtime configuration gives a callbackVerifier has a
      token bucket of 6000 callbacks a minute with a burst of 600, held in
      the runtime process and keyed by the configured provider id. Every
      other callback path, an unknown provider or one that receives no
      callbacks, shares a single bucket of the same size. A callback is
      charged before its signature or token is verified and before its
      receipt script or the store is reached; past the burst it is refused
      with 429 rate-limit.exceeded and Retry-After, counted in
      messaging_limit_refusals_total{limit="callback"} and not in
      messaging_provider_callbacks_total, and a limiter that cannot decide
      answers 503 service.unavailable. The rate is fixed, not configured.
    reasoning: >-
      The callback routes are the only public routes that take no bearer
      token, so the request rate is the only bound on the verification,
      receipt-script, and store work an anonymous sender can cause.
      Charging before verification is what makes it a bound, which means a
      flood naming a provider spends that provider's budget and delays its
      genuine callbacks; the bucket is per provider so it cannot delay
      another provider's, and a provider retries a 429. The unrouted paths
      share one bucket so that the refusal, like 403 callback.unverified,
      does not tell which providers receive callbacks. The figure is fixed
      because the runtime configuration has no place for a limit and 100
      callbacks a second per provider stays above the delivery reports one
      replica's dispatch produces in ordinary use; a deployment whose
      provider reports faster than that is the trigger to make it
      configurable.
    evidence:
      - {path: crates/registry-messaging/src/http.rs, name: callbacks_past_the_rate_are_refused_before_they_are_verified}
      - {path: crates/registry-messaging/src/limits.rs, name: each_callback_provider_and_the_unrouted_paths_have_separate_budgets}
