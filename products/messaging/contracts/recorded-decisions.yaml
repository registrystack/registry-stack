apiVersion: registry.registrystack.org/product-contract/v1
product: messaging
scope: mvp
purpose: >-
  Behaviour a reader could reasonably mistake for an oversight, recorded as a
  deliberate choice with the reasoning that settled it. A later change may
  overturn any of these, but it overturns the entry in the same commit rather
  than rediscovering the question.
decisions:
  - id: MESSAGING-DEC-01
    subject: The status route answers message.not-visible for a missing message
    decision: >-
      Every authenticated read of a message the caller may not see answers
      404 message.not-visible, and so does a read of a message that does not
      exist. The cancel route answers a caller the same way.
    reasoning: >-
      A distinct not-found answer would let any authenticated caller probe
      which identifiers exist. One answer for both keeps the status route from
      being an existence oracle.
    evidence:
      - {path: crates/registry-messaging-core/src/visibility.rs, name: a_missing_message_answers_exactly_like_an_invisible_one}
      - {path: crates/registry-messaging/src/http.rs, name: an_authenticated_caller_is_told_an_unknown_message_is_not_visible}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_message_is_visible_to_its_submitter_and_an_operator_only}
  - id: MESSAGING-DEC-02
    subject: Authentication refusals are counted, not audited
    decision: >-
      A refused credential increments a closed-label counter on the private
      metrics listener and writes no audit record.
    reasoning: >-
      An unauthenticated request names no caller the journal could attribute
      it to, and journaling every refusal would let anyone who can reach the
      listener grow the journal without bound. The counter carries the route
      template and the refusal reason, never the message identifier or a
      token value.
    evidence:
      - {path: crates/registry-messaging/src/http.rs, name: the_metrics_listener_serves_counters_and_nothing_else}
      - {path: crates/registry-messaging/src/metrics.rs, name: labels_are_closed}
  - id: MESSAGING-DEC-03
    subject: One client resolves to exactly one access profile
    decision: >-
      A client identifier listed in two access profiles is refused when the
      package loads, and a token resolves to the one profile its client is
      listed in.
    reasoning: >-
      Choosing between two matching profiles at request time would need a
      precedence rule a reviewer cannot see beside the templates. Refusing the
      overlap keeps who may send what readable from the package alone.
    evidence:
      - {path: crates/registry-messaging-core/src/access.rs, name: a_client_in_two_profiles_is_refused}
      - {path: crates/registry-messaging-core/src/access.rs, name: a_token_resolves_to_the_profile_its_client_is_listed_in}
  - id: MESSAGING-DEC-04
    subject: Operators read and act on messages but never submit them
    decision: >-
      The operator role sees every message and will settle, retry, and cancel
      them; submission belongs to the sender role only.
    reasoning: >-
      An operator credential is broad by design. Letting it also send would
      make the widest credential the one that can reach any recipient through
      any template, which is the opposite of what an access profile is for.
    evidence:
      - {path: crates/registry-messaging-core/src/access.rs, name: a_submission_outside_the_callers_sender_profiles_or_templates_is_refused}
  - id: MESSAGING-DEC-05
    subject: Environment expressions are refused in credential references
    decision: >-
      The runtime configuration uses the shared RuntimeConfigLoader. It
      parses YAML first, then substitutes expressions inside string values;
      keys remain literal, and expressions in credential references and
      secret-provider declarations are refused. This supersedes the pre-parse mechanism
      reviewed before the shared loader transition, preserving the secret
      reference and document-shape invariants.
    reasoning: >-
      A secret reference already names where the secret lives. Expanding
      into it would let an environment variable redirect the runtime to a
      different secret, and would put the reference outside review. The
      shared loader keeps an expanded value from changing the document's
      shape, so one expansion grammar holds across the stack.
    evidence:
      - {path: crates/registry-messaging/src/config.rs, name: shared_runtime_loader_refuses_environment_expressions_in_secret_references}
      - {path: crates/registry-messaging/src/config.rs, name: an_environment_expression_reaching_a_credential_field_through_an_alias_is_refused}
      - {path: crates/registry-platform-config/src/loader_tests.rs, name: substitution_is_refused_in_every_reference_field}
  - id: MESSAGING-DEC-06
    subject: The shared activation ledger binds the database and package the runtime serves
    decision: >-
      messagingctl plan reads the schema, shared activation ledger, and
      effective runtime grants without writing. messagingctl apply uses the
      migration credential to migrate, bind identity.databaseId, record the
      package digest in messaging_activations, and establish split runtime
      grants in one transaction. The runtime starts and remains ready only
      while that identity, digest, schema, and role boundary match. A pinned
      package.expectedDigest must match before any database operation, and a
      package change takes effect when the runtime restarts.
    reasoning: >-
      One shared activation contract avoids a product-local authority while
      preserving the digest every later message was accepted under. Exact
      database identity prevents a valid package from serving against another
      deployment's data, and read-only runtime grants prevent the serving
      credential from rewriting its own activation history. Restart keeps one
      package per process; the pin binds deployment to reviewed bytes.
    evidence:
      - {path: crates/registry-messaging/src/config.rs, name: runtime_package_digest_pin_reports_expected_and_found}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: plan_is_read_only_and_apply_records_once_and_is_idempotent}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: the_runtime_refuses_a_package_the_ledger_does_not_name_active}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: a_pinned_digest_must_match_the_package_before_any_ledger_write}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: a_template_version_renders_the_same_bytes_across_a_package_upgrade}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: split_role_activation_binds_identity_and_withholds_both_ledgers}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: reapplying_the_active_package_over_stale_grants_records_the_repair}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: an_unchanged_apply_answers_its_own_request_and_names_the_active_activation}
      - {path: crates/registry-messaging/tests/postgres_package.rs, name: a_post_migration_role_refusal_rolls_back_the_whole_activation_and_is_audited}
  - id: MESSAGING-DEC-07
    subject: A replay is authorized and rendered again before its key is looked up
    decision: >-
      POST /v1/messages authorizes the caller, validates the body, and renders
      the template on every request, including one that repeats an
      idempotency key, and only then consults the key. An expired key answers
      idempotency.expired before its request hash is compared, and a key is
      scoped to the issuer and subject of the caller that used it
      (MESSAGING-DEC-17). An exact retry refused with 403 or 422 therefore
      says nothing about the first attempt, which may have been accepted
      under the package or profile active then.
    reasoning: >-
      A replay answered from the key alone would let a caller whose profile
      lost a template keep sending it by repeating an old key, and would let
      a different caller probe another caller's keys. The request hash covers
      the canonical request body, so one key never stands for two different
      requests. An operator drains senders before activating a package that
      removes what an in-flight retry needs; a retry meets the refusal only
      when the operator skips that drain.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: an_idempotency_key_replays_one_request_and_refuses_another}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: concurrent_submissions_under_one_key_record_one_message}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: an_idempotency_key_is_scoped_to_the_issuer_as_well_as_the_subject}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: an_exact_retry_the_caller_may_no_longer_send_is_refused_while_the_first_attempt_stands}
  - id: MESSAGING-DEC-08
    subject: The recipient is masked for every reader, the operator included
    decision: >-
      The message view names the recipient's kind and replaces the contact
      with the literal redacted, for the submitter, for an operator on the
      status route, and in messagingctl messages show. No read returns the
      body or the template data.
    reasoning: >-
      The submitter already holds the contact, and an operator acts on
      dispatch state, not on who was written to. One masked shape for every
      reader keeps the status route from being a way to recover contacts,
      and keeps the operator tool from printing them into a terminal log.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_message_is_visible_to_its_submitter_and_an_operator_only}
      - {path: crates/registry-messagingctl/tests/postgres_messages_cli.rs, name: list_and_show_report_messages_with_the_contact_masked}
  - id: MESSAGING-DEC-09
    subject: Only a message nothing may have sent cancels; unknown answers dispatch-started
    decision: >-
      Cancellation applies to a queued message only when no attempt of its
      current generation may have reached its provider: a message never
      attempted, or one waiting to retry after attempts that all ended
      transient, cancels. A message being sent, submitted to its provider,
      in an unknown outcome, or waiting to retry after an attempt that ended
      maybe-sent or was interrupted by a lapsed lease answers 409
      message.dispatch-started, and one in any other final state answers 409
      message.terminal.
    reasoning: >-
      A maybe-sent or interrupted attempt, like an unknown outcome, may
      already have reached the recipient, so calling the message cancelled
      would tell the caller something nobody knows. Its retry carries the
      same provider idempotency key, so letting it run is no second
      delivery, and if it cannot run, because its attempts are spent or its
      expiry passes first, the message stops unknown for the operator to
      settle, never expired. A transient attempt is known not to have left, so
      withdrawing its retry is still the truth.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_queued_message_cancels_once_and_a_claimed_one_does_not}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_cancellation_racing_a_claim_has_one_winner}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_message_retrying_after_transient_failures_cancels}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_message_retrying_after_an_attempt_that_may_have_been_sent_does_not_cancel}
      - {path: crates/registry-messagingctl/tests/postgres_messages_cli.rs, name: cancel_refuses_a_queued_message_whose_earlier_attempt_may_have_been_sent}
  - id: MESSAGING-DEC-10
    subject: The transport classifies its own timeout; an overrun is maybe-sent
    decision: >-
      Every attempt has a budget of its transport's timeout, between 1 and 60
      seconds. The transport enforces the budget itself: an attempt that runs
      out of time before anything left is transient, and one cut off after
      the request was written is maybe-sent. The dispatcher stops waiting one
      second after the budget is spent and records a transport that overruns
      it as maybe-sent, which the default hold policy moves to unknown and the
      retry policy retries while attempts and time remain, then moves to
      unknown.
    reasoning: >-
      Only the transport knows whether its request was written, so only it
      can call a timed-out attempt not sent; an outer cut-off alone would turn
      a connection that never opened into an unknown message an operator must
      settle. The dispatcher cannot tell whether an overrunning transport's
      request reached the provider, and treating that as transient would
      retry a send that may have been delivered, which is the duplicate
      MESSAGING-SEC-06 exists to stop.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_hanging_send_is_cut_off_and_held_as_unknown}
      - {path: crates/registry-messaging/src/providers/tests.rs, name: a_dispatched_http_attempt_classifies_its_own_timeout_before_the_worker_stops_waiting}
      - {path: crates/registry-messaging/src/providers/tests.rs, name: a_dispatched_smtp_attempt_classifies_its_own_timeout_before_the_worker_stops_waiting}
      - {path: crates/registry-messaging/src/dispatch.rs, name: a_transport_timeout_outside_one_to_sixty_seconds_is_refused}
  - id: MESSAGING-DEC-11
    subject: The provider idempotency key changes with the generation
    decision: >-
      The idempotency key a transport sends its provider is derived from the
      message, its generation, and a digest of the rendered content, so every
      attempt of one generation carries the same key and an operator requeue
      starts a new one.
    reasoning: >-
      An operator who retries a failed message or settles an unknown one as
      not sent is asking for another delivery; a provider that deduplicates
      on the old key would silently drop it. Because that requeue sends
      without deduplication, a message whose attempt may have reached its
      provider never ends failed, expired, or cancelled on the dispatcher's
      own decision: when `onUncertain: retry` has no attempt or time left,
      its expiry passes while its retry waits, or the row is quarantined, it
      stops unknown, and only an operator who settles it decides whether
      another delivery is wanted. That holds when a later attempt failed
      transiently or was refused permanently, since the later answer does
      not prove the earlier attempt did not land. A message never attempted,
      or whose attempts all ended transient or permanent, is known not to
      have left and still fails or expires.
    evidence:
      - {path: crates/registry-messaging/src/dispatch.rs, name: the_provider_key_is_stable_per_generation_and_binds_the_content}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_that_spends_its_attempts_maybe_sent_ends_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_spent_by_transient_failures_after_a_maybe_sent_attempt_ends_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_refused_permanently_after_a_maybe_sent_attempt_ends_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_without_a_maybe_sent_attempt_still_fails}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_lapsed_lease_that_cannot_be_recovered_is_quarantined_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_poisoned_retry_after_a_maybe_sent_attempt_is_quarantined_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_past_its_expiry_after_a_maybe_sent_attempt_ends_unknown}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_retrying_message_past_its_expiry_without_a_maybe_sent_attempt_expires}
  - id: MESSAGING-DEC-12
    subject: A provider without a transport fails its messages permanently
    decision: >-
      A message whose provider has no transport registered in the running
      binary is failed with the attempt failure code provider-unconfigured,
      without a send, and a warning names the code. A message whose payload
      retention already erased fails permanently with payload-erased, also
      without a send.
    reasoning: >-
      Holding such a message queued would hide a deployment defect behind a
      growing backlog. Failing it is visible in the status, the journal, and
      the log, and an operator retries it once the provider is configured.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_message_for_an_unconfigured_provider_fails_without_a_send}
  - id: MESSAGING-DEC-13
    subject: Operator actions preview by default and use a separate audit stream
    decision: >-
      messagingctl messages retry, settle, and cancel report what they would
      do and change nothing unless --apply is given; an action the message is
      not in the state for is refused either way. An applied action writes
      request to its process audit writer before the protected change and
      records the outcome after the commit is established, attributed to the
      operator tool. A failed response append after commit reports unavailable
      without undoing or replaying the committed effect.
    reasoning: >-
      Each process has one writer and its own stream. File acceptance is
      durable, but audit and PostgreSQL are separate systems: an unmatched
      request or unknown outcome is honest when a commit cannot be proven.
      Runtime and operator streams have no total order. Operator stdout stays
      reserved for command results.
    evidence:
      - {path: crates/registry-messagingctl/tests/postgres_messages_cli.rs, name: actions_preview_by_default_and_change_the_message_only_with_apply}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: operator_actions_preview_by_default_and_apply_on_request}
  - id: MESSAGING-DEC-14
    subject: The provider reference is never journaled
    decision: >-
      An attempt record says whether the provider returned a reference, and
      the reference itself stays in the message store for receipt matching.
    reasoning: >-
      A provider reference is provider data that can be joined to the
      provider's own logs, which carry the contact. The journal only needs to
      know that one exists.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: no_contact_content_data_or_credential_reaches_the_dispatch_journal_or_log}
  - id: MESSAGING-DEC-15
    subject: Status reads are not journaled
    decision: >-
      GET /v1/messages/{message_id} and messagingctl messages list and show
      answer from the message store and write no audit record, whether the
      caller sees the message or not.
    reasoning: >-
      The sibling runtimes journal changes, not ordinary reads: Scheduling's
      get_appointment and Casework's review_request and review_task answer
      without an audit record, and Casework journals only the accountability
      read that releases a raw reviewer identity. A message view releases no
      contact, part, template data, or provider reference, so it is an
      ordinary read, and journaling every poll would grow the journal with
      the callers' polling rate rather than with what happened.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_status_read_writes_no_audit_record}
  - id: MESSAGING-DEC-16
    subject: Retention periods count from the terminal state
    decision: >-
      A payload is erased retention.payloadDays, and a record deleted
      retention.recordDays, after the message's dispatch job reached a
      terminal state, not after acceptance. A message's expiresAt stays
      capped at acceptance plus payloadDays, so a message never waits to
      send past the point its payload could be erased.
    reasoning: >-
      Counting from acceptance erased the payload of a message still waiting
      in a retry, which then failed without a send. The terminal instant is
      the first moment the payload has no further use, and it is already on
      the job row, so the sweep needs no stored deadline.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_retention.rs, name: a_payload_is_erased_payload_days_after_a_terminal_state_and_never_while_sending_or_unknown}
  - id: MESSAGING-DEC-17
    subject: A spent idempotency key belongs to the caller's issuer and subject
    decision: >-
      An idempotency row is keyed by the caller's verified issuer and
      subject, the operation, and the key, as Scheduling and Casework key
      theirs, and never by the caller's keyed audit pseudonym. When a record
      is deleted its row stays with the message, the request hash, and any
      stored receipt nulled, holding only the issuer, the subject, the key,
      and its times, so a repeat of the key after recordDays is refused with
      idempotency.expired, the refusal every spent key gets. Rotating
      audit.hashKeyRef changes pseudonyms only: an exact retry after the
      rotation replays its receipt or is refused as expired, and never sends
      again. The audit journal keeps naming the caller by pseudonym. Schema
      version 3 discarded every idempotency record written under the
      pseudonym scope, so those keys are free again.
    reasoning: >-
      Freeing a key would turn a caller's mistaken retry into a second message
      sent to the same recipient, which is the duplicate the key exists to
      prevent. A key scoped to the pseudonym was freed by every audit key
      rotation, so routine key hygiene reopened that duplicate for every
      caller with a retry in flight. Keeping the raw issuer and subject in a
      spent-key row is the accepted cost, and no command erases them:
      neither the runtime's retention sweep nor messagingctl retention
      erase-expired deletes the row, because the row is what keeps its key
      spent. They name the authenticated caller, not a recipient, and under a
      profile that admits a human or agent actor or reads the principal from
      a claim other than sub they may identify a person, such as a staff
      member's email address. The cost is accepted because the message row
      already held them for recordDays and the tombstone holds no request
      hash, receipt, or message. Version 3 discarded the records it replaced
      rather than re-keying them because no deployment held Messaging records
      worth keeping, and a key attributed to the wrong caller would replay one
      caller's receipt to another.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: an_exact_retry_across_an_audit_key_rotation_replays_and_never_sends_again}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: an_idempotency_key_is_scoped_to_the_issuer_as_well_as_the_subject}
      - {path: crates/registry-messaging/tests/postgres_migrate.rs, name: version_3_discards_pseudonym_scoped_records_and_the_runtime_scopes_keys_to_the_caller}
      - {path: crates/registry-messaging/tests/postgres_retention.rs, name: a_record_is_deleted_record_days_after_a_terminal_state_with_everything_it_holds}
      - {path: crates/registry-messaging/tests/postgres_retention.rs, name: a_submission_receipt_expires_after_its_period_and_its_key_stays_spent}
  - id: MESSAGING-DEC-18
    subject: The runtime sweeps hourly and journals only what it erased
    decision: >-
      The runtime runs retention once at start and then every hour under its
      own credential, with the database's clock as the cutoff, and writes a
      messaging.retention.erased record only when a run erased something. A
      failed run is logged once until a run succeeds again and does not stop
      the runtime.
    reasoning: >-
      Retention that depends on an operator's cron is retention that stops
      when the cron does. An hour is fine grain against periods counted in
      days, and a record for every empty run would grow the journal with the
      clock rather than with what happened.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_retention.rs, name: the_runtime_sweep_erases_on_its_interval}
      - {path: crates/registry-messaging/tests/postgres_retention.rs, name: a_retention_run_is_journaled_with_its_counts_only}
  - id: MESSAGING-DEC-19
    subject: messagingctl retention erase-expired previews by default
    decision: >-
      messagingctl retention erase-expired --before <instant> reports what is
      due and erases nothing unless --apply is given, like every other
      messagingctl action. It connects with the migration credential, takes
      the same advisory lock as the runtime's sweep for each batch, journals
      every applied run, batch by batch, through its process audit writer as
      operator-tool, and refuses a cutoff later
      than the local clock before any input or output and later than the
      database's clock inside the run.
    reasoning: >-
      Base Registry Engine's bregctl evidence-retention erase-expired erases
      directly; messagingctl keeps its own convention (MESSAGING-DEC-13) so
      one tool does not mix previewing and immediate actions. The lock and
      each batch's database transaction keep an operator run and the runtime's
      sweep from interleaving within a batch or forking the journal.
    evidence:
      - {path: crates/registry-messagingctl/tests/postgres_messages_cli.rs, name: retention_previews_by_default_and_erases_only_expired_terminal_messages_with_apply}
      - {path: crates/registry-messagingctl/src/lib.rs, name: a_malformed_or_future_cutoff_is_refused_before_any_file_or_database}
  - id: MESSAGING-DEC-20
    subject: A caller's request rate is per process and charged before the body
    decision: >-
      An access profile's requestsPerMinute and burst are a token bucket per
      caller, keyed by the caller's keyed principal pseudonym and held in
      the runtime process. A submission is charged after the role check and
      before the body is read, a replay included; past the burst it is
      refused with 429 rate-limit.exceeded and Retry-After, and a limiter
      that cannot decide answers 503 service.unavailable.
    reasoning: >-
      One replica is the supported topology, and the platform token bucket
      is the primitive Evidence already uses. Charging before the
      body keeps rendering behind the budget, and keying by the pseudonym
      keeps the raw subject out of the limiter.
    evidence:
      - {path: crates/registry-messaging/src/http.rs, name: a_caller_past_its_profile_rate_is_refused_with_the_wait_needed}
      - {path: crates/registry-messaging/src/limits.rs, name: callers_and_profiles_have_separate_budgets}
  - id: MESSAGING-DEC-21
    subject: A profile's daily limit is counted from its accepted messages
    decision: >-
      dailyLimit bounds the messages one access profile, all its callers
      together, accepted in the last 24 hours. The acceptance transaction
      counts them under a transaction advisory lock of the profile; past the
      limit the submission is refused with 429 quota.exceeded and
      Retry-After set to when the oldest counted message leaves the window.
      A replay is not counted again.
    reasoning: >-
      A daily limit that a restart or a second replica resets is not a
      limit. The accepted messages already are the count, so no counter
      table can drift from them, and a record is deleted only well after it
      leaves the window.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: a_profile_past_its_daily_limit_is_refused_across_a_restart}
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: concurrent_submissions_never_take_more_than_the_daily_limit}
  - id: MESSAGING-DEC-22
    subject: A provider's send rate paces the worker inside the lease
    decision: >-
      An http provider's capabilities.ratePerSecond is enforced in-process by
      the worker: a leased attempt holds one of the connection's
      concurrencyLimit sends in flight and then waits in turn for the
      provider's next send slot, with a ten-second allowance added to its
      time budget that never runs past the message's expiresAt, and an
      attempt whose slot does not open in time is a transient failure with
      nothing sent.
    reasoning: >-
      Pacing before the claim would hold the rate by delaying claims that a
      second provider's messages need. Pacing inside the lease keeps other
      providers moving, and the allowance keeps the wait from shortening
      the send's own budget. Pacing only once an in-flight slot is held
      spaces the requests as they leave: attempts paced first and then
      queued behind a slow send would leave back to back.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_paced_provider_starts_one_send_per_interval}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_paced_provider_below_the_worker_concurrency_still_sends_one_per_interval}
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: a_message_that_expires_before_its_pacing_slot_expires_unsent}
      - {path: crates/registry-messaging/src/limits.rs, name: an_attempt_takes_its_turn_only_once_it_holds_an_in_flight_slot}
      - {path: crates/registry-messaging/src/limits.rs, name: a_slot_that_opens_after_the_deadline_is_refused_without_waiting}
  - id: MESSAGING-DEC-23
    subject: Readiness includes the package ledger
    decision: >-
      /ready answers 200 only while the store carries the expected schema
      and its package ledger names active the package digest the runtime
      loaded at start. After messagingctl apply records another
      package, a running runtime answers 503 service.unavailable until it
      is restarted. /health stays 200 while the process serves.
    reasoning: >-
      A package change applies on restart (MESSAGING-DEC-06). A runtime
      still serving the previous package after the operator recorded a new
      one is running content the deployment no longer names, and readiness
      is how an orchestrator learns to stop routing to it and roll it.
      Liveness stays unaffected, so nothing restarts the process on its
      own; the operator's restart is the apply.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_messages.rs, name: the_runtime_is_ready_only_while_the_ledger_names_its_package_active}
  - id: MESSAGING-DEC-24
    subject: Symbolic links in the package stay refused
    decision: >-
      The package loader refuses a symbolic link anywhere under
      package.root, including the ones a Kubernetes ConfigMap or Secret
      volume uses to publish its files. Operators copy the package into
      place, for example from an init container, before the runtime starts.
    reasoning: >-
      A link can point outside package.root, and the target can change
      between the digest and the read without the ledger seeing it.
      Scheduling and Casework refuse links in their packages the same way,
      and allowing only a ConfigMap's link shape would be a special case
      the loader has to get exactly right.
    evidence:
      - {path: crates/registry-messaging/src/package.rs, name: a_symbolic_link_anywhere_in_the_package_is_refused}
  - id: MESSAGING-DEC-25
    subject: The dispatch queue is sampled from the store at scrape
    decision: >-
      messaging_dispatch_jobs reports the pending, leased, and unknown
      dispatch jobs by reading the store on each scrape of the metrics
      listener, in one read-only transaction with a two-second statement
      timeout, over the partial indexes the schema keeps for each of the
      three states. Terminal states are not counted. A scrape the store cannot
      answer has no samples for the gauge and logs a warning. Attempt,
      limit, and retention counters are in-process and start at zero.
    reasoning: >-
      The queue is shared by every replica and outlives a restart, so only
      the store knows its depth; a per-process count would drift and reset.
      Sampling at scrape follows the Base Registry Engine's pool gauges and
      adds no background task. Terminal jobs grow until retention and would
      need a scan; the operator question is what is waiting. An absent
      sample goes stale in Prometheus, which an alert can see, where a zero
      would read as an empty queue.
    evidence:
      - {path: crates/registry-messaging/tests/postgres_dispatch.rs, name: the_metrics_sample_the_queue_and_count_attempts_by_outcome}
      - {path: crates/registry-messaging/src/metrics.rs, name: the_dispatch_queue_is_exposed_only_when_it_was_sampled}
  - id: MESSAGING-DEC-26
    subject: A plaintext loopback relay is accepted behind a development listener
    decision: >-
      SMTP `tls: development-loopback` is accepted by a build carrying a test
      feature, and by any build whose runtime listener is itself
      `tlsTermination: development-loopback`. Behind an
      `operator-controlled-upstream` listener a release build refuses it at
      `messagingctl check` and at startup. The loopback-only host, the
      explicit port that is neither 587 nor 465, and the refusal of every
      non-loopback answer are unchanged.
    reasoning: >-
      `messagingctl dev` runs the runtime of a release build against a local
      Mailpit, which speaks no TLS, so a test-build-only rule would make the
      local development path impossible without a second binary. Tying the
      relaxation to the listener keeps the production posture whole: a
      runtime that serves callers through an operator TLS edge still cannot
      reach a plaintext relay, and a development listener is already refused
      on any non-loopback bind. The HTTP provider accepts a plain `http`
      loopback base URL in every build; SMTP stays stricter because a relay
      credential travels on that connection.
    evidence:
      - {path: crates/registry-messagingctl/src/lib.rs, name: a_development_listener_admits_a_plaintext_loopback_relay}
      - {path: crates/registry-messagingctl/src/lib.rs, name: a_plaintext_loopback_relay_is_refused_behind_a_production_listener}
  - id: MESSAGING-DEC-27
    subject: The development session is foreground, in-process, and owns everything it starts
    decision: >-
      `messagingctl dev` runs in the foreground until Ctrl-C or SIGTERM. It
      starts a pinned PostgreSQL container and a pinned Mailpit container,
      each publishing on 127.0.0.1 only and labelled with the session's
      random owner, runs a mock HTTP gateway and the Messaging runtime inside
      the `messagingctl` process on a `development-loopback` listener, and
      removes both containers with their volumes when it stops. Its secrets,
      generated runtime configuration, audit journal, and log live in the
      project's owner-only `.messaging/dev` directory, which the next start
      removes, together with any container the previous record names, before
      it generates everything again. `messagingctl dev token CLIENT` signs a
      one-hour ES256 token with the session's key for a client one access
      profile names, carrying that profile's scopes and actor kind.
    reasoning: >-
      Casework's retained, supervised session keeps a database across
      restarts because its tutorials build state over several sessions.
      Messaging's local path is one send and one look at the result, and a
      session that keeps no database cannot leave a rendered payload or a
      recipient behind, so the simpler ephemeral shape serves it. Running the
      runtime in process needs no second binary on `PATH` and no supervisor;
      the runtime is the same library `messaging serve` runs, reading a
      generated configuration that `messagingctl check` would accept. A
      static key set generated with the session replaces a local issuer
      container: the runtime already accepts a static JWKS, and the signing
      key never leaves the session directory.
    evidence:
      - {path: crates/registry-messagingctl/src/dev/tests.rs, name: the_generated_configuration_is_one_the_runtime_accepts}
      - {path: crates/registry-messagingctl/src/dev/tests.rs, name: every_session_file_is_owner_only}
      - {path: crates/registry-messagingctl/src/dev/tests.rs, name: a_token_verifies_under_the_session_key_set_with_the_profile_claims}
      - {path: crates/registry-messagingctl/src/dev/tests.rs, name: a_second_start_in_the_same_project_is_refused_while_the_first_runs}
  - id: MESSAGING-DEC-28
    subject: Provider callbacks are charged to a fixed per-provider rate before they are verified
    decision: >-
      Each provider the runtime configuration gives a callbackVerifier has a
      token bucket of 6000 callbacks a minute with a burst of 600, held in
      the runtime process and keyed by the configured provider id. Every
      other callback path, an unknown provider or one that receives no
      callbacks, shares a single bucket of the same size. A callback is
      charged before its signature or token is verified and before its
      receipt script or the store is reached; past the burst it is refused
      with 429 rate-limit.exceeded and Retry-After, counted in
      messaging_limit_refusals_total{limit="callback"} and not in
      messaging_provider_callbacks_total, and a limiter that cannot decide
      answers 503 service.unavailable. The rate is fixed, not configured.
    reasoning: >-
      The callback routes are the only public routes that take no bearer
      token, so the request rate is the only bound on the verification,
      receipt-script, and store work an anonymous sender can cause.
      Charging before verification is what makes it a bound, which means a
      flood naming a provider spends that provider's budget and delays its
      genuine callbacks; the bucket is per provider so it cannot delay
      another provider's, and a provider retries a 429. The unrouted paths
      share one bucket so that the refusal, like 403 callback.unverified,
      does not tell which providers receive callbacks. The figure is fixed
      because the runtime configuration has no place for a limit and 100
      callbacks a second per provider stays above the delivery reports one
      replica's dispatch produces in ordinary use; a deployment whose
      provider reports faster than that is the trigger to make it
      configurable.
    evidence:
      - {path: crates/registry-messaging/src/http.rs, name: callbacks_past_the_rate_are_refused_before_they_are_verified}
      - {path: crates/registry-messaging/src/limits.rs, name: each_callback_provider_and_the_unrouted_paths_have_separate_budgets}
