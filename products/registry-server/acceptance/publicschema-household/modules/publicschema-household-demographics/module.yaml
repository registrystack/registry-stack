id: publicschema-household-demographics
version: 0.1.0
dependencies: [publicschema-household-core]
extendEntities:
  - entity: person
    fields:
      - {id: residency-status, type: vocabulary-code, vocabulary: residency-status, required: true, classification: restricted}
      - {id: preferred-language, type: vocabulary-code, vocabulary: preferred-language, required: false, classification: restricted}
  - entity: household
    derived:
      - id: household-demographics
        sql: sql/household-demographics.sql
        key: id
        execution: live
        fields:
          - {id: head-count, type: int64, classification: restricted}
          - {id: child-count, type: int64, classification: restricted}
          - {id: child-under-5-count, type: int64, classification: restricted}
          - {id: elderly-count, type: int64, classification: restricted}
          - {id: single-headed, type: boolean, classification: restricted}
          - {id: woman-headed, type: boolean, classification: restricted}
