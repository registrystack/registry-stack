apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: asset-site-placement
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: asset-site-placement-acceptance
  sequence: 1
  sourceRevision: asset-site-placement-acceptance-0.1.0
manifestProjection:
  accessProfile: asset-operator
  classificationCeiling: internal
  catalog:
    baseUrl: https://asset-site-placement.example.gov
    title: Asset Site Placement Catalog
    description: Portable metadata for the asset site placement registry.
    publisher:
      name: Asset Site Placement Authority
      iri: https://asset-site-placement.example.gov/authority
  dataset:
    title: Asset Site Placement Registry
    description: Asset placement, site, item, and inspection metadata.
    owner: Asset Site Placement Authority
    status: active
modules:
  - id: asset-site-placement-core
    version: 0.1.0
    digest: sha256:6bfb23a7780219187d3f30fab0a37d51e739bb0a26669e4c162b59c1f502ebf3
entities:
  - id: asset-item
    route: assets
    mutationMode: mutable
    batch: {maximumItems: 4, maximumBytes: 16384}
    fields:
      - {id: asset-code, type: string, required: true, maxLength: 64, classification: internal}
      - {id: label, type: string, required: true, maxLength: 200, classification: internal}
      - {id: asset-class, type: vocabulary-code, vocabulary: asset-classification, required: true, classification: internal}
    constraints:
      - {kind: unique, fields: [asset-code]}
  - id: asset-site
    route: sites
    mutationMode: mutable
    fields:
      - {id: site-code, type: string, required: true, maxLength: 64, classification: internal}
      - {id: label, type: string, required: true, maxLength: 200, classification: internal}
    constraints:
      - {kind: unique, fields: [site-code]}
  - id: asset-placement
    route: placements
    mutationMode: mutable
    fields:
      - {id: asset, type: reference, target: asset-item, required: true, classification: internal}
      - {id: site, type: reference, target: asset-site, required: true, classification: internal}
      - {id: valid-from, type: date, required: true, classification: internal}
      - {id: valid-to, type: date, required: false, classification: internal}
    temporal:
      startField: valid-from
      endField: valid-to
      scopeFields: [asset]
    constraints:
      - {kind: temporal-non-overlap, scopeFields: [asset], startField: valid-from, endField: valid-to}
  - id: inspection-event
    route: inspections
    mutationMode: create_only
    fields:
      - {id: asset, type: reference, target: asset-item, required: true, classification: internal}
      - {id: observed-at, type: timestamp, required: true, classification: internal}
      - {id: result, type: vocabulary-code, vocabulary: inspection-result, required: true, classification: internal}
accessProfiles:
  - id: asset-operator
    default: true
    principalClaim: registry_principal
    purposes: [asset-management]
    grants:
      - {entity: asset-item, actions: [create, get, list, patch, batch], readableFields: [asset-code, label, asset-class], writableFields: [asset-code, label, asset-class]}
      - {entity: asset-site, actions: [create, get, list, patch], readableFields: [site-code, label], writableFields: [site-code, label]}
      - {entity: asset-placement, actions: [create, get, list, patch], readableFields: [asset, site, valid-from, valid-to], writableFields: [asset, site, valid-from, valid-to]}
      - {entity: inspection-event, actions: [create, get, list], readableFields: [asset, observed-at, result], writableFields: [asset, observed-at, result]}
  - id: site-planner
    principalClaim: registry_principal
    purposes: [site-planning]
    grants:
      - {entity: asset-item, actions: [get, list], readableFields: [asset-code, label], filterableFields: [asset-code]}
      - {entity: asset-site, actions: [get, list], readableFields: [site-code, label], filterableFields: [site-code]}
      - {entity: asset-placement, actions: [create, get, list, patch], readableFields: [asset, site, valid-from, valid-to], writableFields: [asset, site, valid-from, valid-to], filterableFields: [asset, site, valid-from]}
vocabularies:
  - {id: asset-classification, values: [equipment, vehicle, furniture]}
  - {id: inspection-result, values: [passed, failed]}
