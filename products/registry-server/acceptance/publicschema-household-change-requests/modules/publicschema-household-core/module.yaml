id: publicschema-household-core
version: 0.1.0
entities:
  - id: person
    primaryDataset: "household-registry"
    route: persons
    mutationMode: mutable
    classification: restricted
    changeControl:
      requiredFor: [create]
    fields:
      - {id: person-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: legal-name, type: string, required: true, maxLength: 160, classification: restricted}
      - {id: family-name, type: string, required: false, maxLength: 120, classification: restricted}
      - {id: date-of-birth, type: date, required: false, classification: restricted}
      - {id: person-sex, type: vocabulary-code, vocabulary: person-sex, required: true, classification: restricted}
    constraints:
      - {kind: unique, fields: [person-code]}
  - id: household
    primaryDataset: "household-registry"
    route: households
    mutationMode: mutable
    classification: restricted
    changeControl:
      requiredFor: [patch]
    fields:
      - {id: household-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: local-household-number, type: int64, required: true, classification: restricted}
      - {id: household-name, type: string, required: true, maxLength: 160, classification: restricted}
      - {id: administrative-area, type: string, required: true, maxLength: 80, classification: restricted}
      - {id: household-type, type: vocabulary-code, vocabulary: household-type, required: true, classification: restricted}
      - {id: contact-person, type: reference, target: person, required: false, classification: restricted}
    constraints:
      - {kind: unique, fields: [household-code]}
      - {kind: unique, fields: [administrative-area, local-household-number]}
    selectorProfiles:
      - {id: by-local-reference, fields: [administrative-area, local-household-number]}
      - {id: by-household-code, fields: [household-code]}
    readPaths:
      - {id: people, through: group-membership, to: person, route: people}
  - id: group-membership
    primaryDataset: "household-registry"
    route: group-memberships
    mutationMode: mutable
    classification: restricted
    changeControl:
      requiredFor: [create]
    fields:
      - {id: person, type: reference, target: person, required: true, classification: restricted}
      - {id: household, type: reference, target: household, required: true, classification: restricted}
      - {id: relationship, type: vocabulary-code, vocabulary: household-relationship, required: true, classification: restricted}
      - {id: valid-from, type: date, required: true, classification: restricted}
      - {id: valid-to, type: date, required: false, classification: restricted}
    temporal:
      startField: valid-from
      endField: valid-to
      scopeFields: [person]
    constraints:
      - {kind: unique, fields: [person, household, valid-from]}
      - {kind: temporal-non-overlap, scopeFields: [person], startField: valid-from, endField: valid-to}
