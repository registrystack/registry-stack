apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: farmer
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: farmer-acceptance
  sequence: 1
  sourceRevision: farmer-acceptance-0.1.0
manifestProjection:
  accessProfile: farmer-operator
  classificationCeiling: restricted
  catalog:
    baseUrl: https://farmer-registry.example.gov
    title: Farmer Registry Catalog
    description: Portable metadata for farmer, holding, plot, and seasonal activity records.
    publisher:
      name: Farmer Registry Authority
      iri: https://farmer-registry.example.gov/authority
  dataset:
    title: Farmer Registry
    description: Farmer registration, holdings, plots, and seasonal activity metadata.
    owner: Farmer Registry Authority
    status: active
modules:
  - id: farmer-core
    version: 0.1.0
    digest: sha256:abcdafff8a686fb17ae9d4c3aa8d4fed13a94c5c6bfdff9172131a2c90d8a159
entities:
  - id: farmer
    route: farmers
    mutationMode: mutable
    accessRequirements:
      allowedPurposes: [farmer-registry]
      rowBoundaries:
        - {field: administrative-boundary, claim: administrative_boundaries, operator: in}
    fields:
      - {id: farmer-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: display-name, type: string, required: true, maxLength: 160, classification: restricted}
      - {id: administrative-boundary, type: vocabulary-code, vocabulary: administrative-boundary, required: true, classification: internal}
    constraints:
      - {kind: unique, fields: [farmer-code]}
  - id: holding
    route: holdings
    mutationMode: mutable
    fields:
      - {id: holding-code, type: string, required: true, maxLength: 64, classification: internal}
      - {id: farmer, type: reference, target: farmer, required: true, classification: restricted}
      - {id: tenure-type, type: vocabulary-code, vocabulary: tenure-type, required: true, classification: internal}
      - {id: tenure-start, type: date, required: true, classification: internal}
      - {id: tenure-end, type: date, required: false, classification: internal}
      - {id: administrative-boundary, type: vocabulary-code, vocabulary: administrative-boundary, required: true, classification: internal}
      - {id: import-source, type: string, required: true, maxLength: 80, classification: internal}
      - {id: source-record-id, type: string, required: true, maxLength: 120, classification: internal}
    temporal:
      startField: tenure-start
      endField: tenure-end
      scopeFields: [holding-code]
    constraints:
      - {kind: unique, fields: [holding-code, tenure-start]}
      - {kind: unique, fields: [import-source, source-record-id]}
      - {kind: temporal-non-overlap, scopeFields: [holding-code], startField: tenure-start, endField: tenure-end}
  - id: plot
    route: plots
    mutationMode: mutable
    batch: {maximumItems: 4, maximumBytes: 16384}
    fields:
      - {id: plot-code, type: string, required: true, maxLength: 64, classification: internal}
      - {id: holding, type: reference, target: holding, required: true, classification: restricted}
      - {id: administrative-boundary, type: vocabulary-code, vocabulary: administrative-boundary, required: true, classification: internal}
      - {id: centroid, type: crs84-point, precision: 7, bbox: {west: "30.0000000", south: "-10.0000000", east: "31.0000000", north: "-9.0000000"}, required: true, classification: internal}
      - {id: area-value, type: decimal, precision: 12, scale: 4, minimum: "0.0000", required: true, classification: internal}
      - {id: area-unit, type: vocabulary-code, vocabulary: area-unit, required: true, classification: internal}
      - {id: import-source, type: string, required: true, maxLength: 80, classification: internal}
      - {id: source-record-id, type: string, required: true, maxLength: 120, classification: internal}
    constraints:
      - {kind: unique, fields: [plot-code]}
      - {kind: unique, fields: [import-source, source-record-id]}
  - id: seasonal-activity
    route: seasonal-activities
    mutationMode: mutable
    fields:
      - {id: plot, type: reference, target: plot, required: true, classification: restricted}
      - {id: administrative-boundary, type: vocabulary-code, vocabulary: administrative-boundary, required: true, classification: internal}
      - {id: activity-type, type: vocabulary-code, vocabulary: activity-type, required: true, classification: internal}
      - {id: season-start, type: date, required: true, classification: internal}
      - {id: season-end, type: date, required: false, classification: internal}
      - {id: quantity-value, type: decimal, precision: 12, scale: 3, minimum: "0.000", required: false, classification: internal}
      - {id: quantity-unit, type: vocabulary-code, vocabulary: quantity-unit, required: false, classification: internal}
    temporal:
      startField: season-start
      endField: season-end
      scopeFields: [plot, activity-type]
    constraints:
      - {kind: temporal-non-overlap, scopeFields: [plot, activity-type], startField: season-start, endField: season-end}
accessProfiles:
  - id: farmer-operator
    principalClaim: registry_principal
    requiredPurposes: [farmer-registry]
    grants:
      - {entity: farmer, operations: [create, get, list, patch], readableFields: [farmer-code, display-name, administrative-boundary], writableFields: [farmer-code, display-name, administrative-boundary], filterableFields: [farmer-code, administrative-boundary], rowBoundaries: [{field: administrative-boundary, claim: administrative_boundaries, operator: in}]}
      - {entity: holding, operations: [create, get, list, patch], readableFields: [holding-code, farmer, tenure-type, tenure-start, tenure-end, administrative-boundary, import-source, source-record-id], writableFields: [holding-code, farmer, tenure-type, tenure-start, tenure-end, administrative-boundary, import-source, source-record-id], filterableFields: [farmer, administrative-boundary, import-source, tenure-start], rowBoundaries: [{field: administrative-boundary, claim: administrative_boundaries, operator: in}]}
      - {entity: plot, operations: [create, get, list, patch, batch], readableFields: [plot-code, holding, administrative-boundary, centroid, area-value, area-unit, import-source, source-record-id], writableFields: [plot-code, holding, administrative-boundary, centroid, area-value, area-unit, import-source, source-record-id], filterableFields: [holding, administrative-boundary, import-source], rowBoundaries: [{field: administrative-boundary, claim: administrative_boundaries, operator: in}]}
      - {entity: seasonal-activity, operations: [create, get, list, patch], readableFields: [plot, administrative-boundary, activity-type, season-start, season-end, quantity-value, quantity-unit], writableFields: [plot, administrative-boundary, activity-type, season-start, season-end, quantity-value, quantity-unit], filterableFields: [plot, administrative-boundary, activity-type, season-start], rowBoundaries: [{field: administrative-boundary, claim: administrative_boundaries, operator: in}]}
vocabularies:
  - {id: administrative-boundary, values: [north-district, south-district, central-district]}
  - {id: tenure-type, values: [owned, leased, communal]}
  - {id: area-unit, values: [hectare, square-meter]}
  - {id: activity-type, values: [planting, harvest, irrigation]}
  - {id: quantity-unit, values: [kilogram, litre, headcount]}
