apiVersion: registry.registrystack.org/server-journeys/v1
journeys:
  - id: bounded-farmer-and-batch-validation
    steps:
      - id: create-north-district-farmer
        entity: farmer
        accessProfile: farmer-operator
        claims: &north_operator_claims
          principal: synthetic-farmer-operator
          purpose: farmer-registry
          directClaims: {administrative_boundaries: north-district}
        request:
          operation: create
          data:
            farmer-code: FARMER-SYNTH-001
            display-name: Synthetic North District Farmer
            administrative-boundary: north-district
        expect:
          outcome: success
          status: 201
          fields:
            farmer-code: FARMER-SYNTH-001
            display-name: Synthetic North District Farmer
            administrative-boundary: north-district
        capture: north-farmer
      - id: get-north-district-farmer
        entity: farmer
        accessProfile: farmer-operator
        claims: *north_operator_claims
        request: {operation: get, recordRef: north-farmer}
        expect:
          outcome: success
          status: 200
          fields: {farmer-code: FARMER-SYNTH-001, administrative-boundary: north-district}
      - id: rename-north-district-farmer
        entity: farmer
        accessProfile: farmer-operator
        claims: *north_operator_claims
        request:
          operation: patch
          recordRef: north-farmer
          etagRef: north-farmer
          changes:
            - {field: display-name, value: Synthetic North District Producer}
        expect:
          outcome: success
          status: 200
          fields:
            farmer-code: FARMER-SYNTH-001
            display-name: Synthetic North District Producer
            administrative-boundary: north-district
        capture: updated-north-farmer
      - id: list-north-district-farmers
        entity: farmer
        accessProfile: farmer-operator
        claims: *north_operator_claims
        request: {operation: list}
        expect: {outcome: success, status: 200, count: 1}
      - id: south-district-claim-cannot-see-north-record
        entity: farmer
        accessProfile: farmer-operator
        claims:
          principal: synthetic-farmer-operator
          purpose: farmer-registry
          directClaims: {administrative_boundaries: south-district}
        request: {operation: get, recordRef: updated-north-farmer}
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
      - id: batch-refuses-out-of-bounds-plot
        entity: plot
        accessProfile: farmer-operator
        claims: *north_operator_claims
        request:
          operation: batch
          items:
            - operation: create
              data:
                plot-code: PLOT-SYNTH-INVALID-001
                holding: 00000000-0000-0000-0000-000000000001
                administrative-boundary: north-district
                centroid: {type: Point, coordinates: [200.0, -9.5]}
                area-value: "1.2500"
                area-unit: hectare
                import-source: synthetic-survey
                source-record-id: plot-synth-invalid-001
        expect:
          outcome: refusal
          status: 400
          problemCode: request.invalid
