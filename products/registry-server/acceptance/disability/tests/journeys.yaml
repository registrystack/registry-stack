apiVersion: registry.registrystack.org/server-journeys/v1
journeys:
  - id: assessment-and-schema-validation
    steps:
      - id: create-assessment-episode
        entity: assessment-episode
        accessProfile: disability-caseworker
        claims: &disability_caseworker_claims
          principal: synthetic-disability-caseworker
          purpose: disability-assessment
        request:
          operation: create
          data:
            episode-code: EPISODE-SYNTH-001
            subject-code: SUBJECT-SYNTH-001
            opened-on: 2026-01-10
            assessment-source: synthetic-case-management
        expect:
          outcome: success
          status: 201
          fields:
            episode-code: EPISODE-SYNTH-001
            subject-code: SUBJECT-SYNTH-001
            opened-on: 2026-01-10
            assessment-source: synthetic-case-management
        capture: first-assessment
      - id: close-assessment-episode
        entity: assessment-episode
        accessProfile: disability-caseworker
        claims: *disability_caseworker_claims
        request:
          operation: patch
          recordRef: first-assessment
          etagRef: first-assessment
          changes:
            - {field: closed-on, value: 2026-01-20}
        expect:
          outcome: success
          status: 200
          fields:
            episode-code: EPISODE-SYNTH-001
            opened-on: 2026-01-10
            closed-on: 2026-01-20
        capture: closed-assessment
      - id: get-closed-assessment
        entity: assessment-episode
        accessProfile: disability-caseworker
        claims: *disability_caseworker_claims
        request: {operation: get, recordRef: closed-assessment}
        expect:
          outcome: success
          status: 200
          fields: {episode-code: EPISODE-SYNTH-001, closed-on: 2026-01-20}
      - id: list-assessments
        entity: assessment-episode
        accessProfile: disability-caseworker
        claims: *disability_caseworker_claims
        request: {operation: list}
        expect: {outcome: success, status: 200, count: 1}
      - id: refuse-undeclared-observation-metadata
        entity: functioning-observation
        accessProfile: disability-caseworker
        claims: *disability_caseworker_claims
        request:
          operation: create
          data:
            assessment-episode: 00000000-0000-0000-0000-000000000001
            observed-at: 2026-01-11T09:00:00Z
            functioning-domain: mobility
            severity-score: 3
            observation-schema-metadata:
              schemaVersion: "1"
              vocabularyRelease: 2026-01
              scoringScale: zero-to-four
              undeclared: refused
        expect:
          outcome: refusal
          status: 400
          problemCode: request.invalid
      - id: caseworker-without-purpose-is-concealed
        entity: assessment-episode
        accessProfile: disability-caseworker
        claims:
          principal: synthetic-disability-caseworker
        request: {operation: get, recordRef: closed-assessment}
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
