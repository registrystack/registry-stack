apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: disability
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: disability-acceptance
  sequence: 1
  sourceRevision: disability-acceptance-0.1.0
manifestProjection:
  accessProfile: disability-caseworker
  classificationCeiling: restricted
  catalog:
    baseUrl: https://disability-registry.example.gov
    title: Disability Assessment Registry Catalog
    description: Portable metadata for disability assessment and certification records.
    publisher:
      name: Disability Assessment Authority
      iri: https://disability-registry.example.gov/authority
  dataset:
    title: Disability Assessment Registry
    description: Assessment episode, functioning observation, and certification metadata.
    owner: Disability Assessment Authority
    status: active
modules:
  - id: disability-core
    version: 0.1.0
    digest: sha256:420b18a2b8db11fb96675c0a720788ea3a127d69e50fdf90143b795c71f9b56b
entities:
  - id: assessment-episode
    route: assessment-episodes
    mutationMode: mutable
    classification: restricted
    fields:
      - {id: episode-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: subject-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: opened-on, type: date, required: true, classification: restricted}
      - {id: closed-on, type: date, required: false, classification: restricted}
      - {id: assessment-source, type: string, required: true, maxLength: 80, classification: restricted}
    constraints:
      - {kind: unique, fields: [episode-code]}
  - id: functioning-observation
    route: functioning-observations
    mutationMode: create_only
    classification: restricted
    fields:
      - {id: assessment-episode, type: reference, target: assessment-episode, required: true, classification: restricted}
      - {id: observed-at, type: timestamp, required: true, classification: restricted}
      - {id: functioning-domain, type: vocabulary-code, vocabulary: functioning-domain, required: true, classification: restricted}
      - {id: severity-score, type: int64, required: true, classification: restricted}
      - id: observation-schema-metadata
        type: structured
        required: true
        maxBytes: 2048
        classification: restricted
        schema:
          type: object
          additionalProperties: false
          required: [schemaVersion, vocabularyRelease, scoringScale]
          properties:
            schemaVersion:
              type: string
              minLength: 1
              maxLength: 32
            vocabularyRelease:
              type: string
              minLength: 1
              maxLength: 32
            scoringScale:
              type: string
              enum: [zero-to-four]
      - {id: observation-note, type: text, required: false, maxLength: 4000, classification: restricted}
    constraints:
      - {kind: int_range, field: severity-score, minimum: 0, maximum: 4}
  - id: certification
    route: certifications
    mutationMode: create_only
    classification: restricted
    fields:
      - {id: certification-code, type: string, required: true, maxLength: 64, classification: restricted}
      - {id: assessment-episode, type: reference, target: assessment-episode, required: true, classification: restricted}
      - {id: certification-status, type: vocabulary-code, vocabulary: certification-status, required: true, classification: restricted}
      - {id: valid-from, type: date, required: true, classification: restricted}
      - {id: valid-to, type: date, required: false, classification: restricted}
      - {id: corrected-certification, type: reference, target: certification, required: false, classification: restricted}
      - {id: correction-reason, type: text, required: false, maxLength: 2000, classification: restricted}
      - {id: validity-source, type: string, required: true, maxLength: 120, classification: restricted}
      - {id: provenance-note, type: text, required: false, maxLength: 4000, classification: restricted}
    temporal:
      startField: valid-from
      endField: valid-to
      scopeFields: [assessment-episode]
    constraints:
      - {kind: unique, fields: [certification-code]}
      - {kind: temporal-non-overlap, scopeFields: [assessment-episode], startField: valid-from, endField: valid-to}
accessProfiles:
  - id: disability-caseworker
    principalClaim: registry_principal
    purposes: [disability-assessment]
    grants:
      - {entity: assessment-episode, actions: [create, get, list, patch], readableFields: [episode-code, subject-code, opened-on, closed-on, assessment-source], writableFields: [episode-code, subject-code, opened-on, closed-on, assessment-source], filterableFields: [episode-code, subject-code]}
      - {entity: functioning-observation, actions: [create, get, list], readableFields: [assessment-episode, observed-at, functioning-domain, severity-score, observation-schema-metadata, observation-note], writableFields: [assessment-episode, observed-at, functioning-domain, severity-score, observation-schema-metadata, observation-note], filterableFields: [assessment-episode, functioning-domain]}
      - {entity: certification, actions: [create, get, list], readableFields: [certification-code, assessment-episode, certification-status, valid-from, valid-to, corrected-certification, correction-reason, validity-source, provenance-note], writableFields: [certification-code, assessment-episode, certification-status, valid-from, valid-to, corrected-certification, correction-reason, validity-source, provenance-note], filterableFields: [assessment-episode, certification-status, valid-from]}
vocabularies:
  - {id: functioning-domain, values: [mobility, cognition, self-care, communication]}
  - {id: certification-status, values: [draft, active, corrected, withdrawn]}
