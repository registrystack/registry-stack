id: inspection-core
version: 0.1.0
entities:
  - id: public-authority
    route: authorities
    mutationMode: mutable
    classification: restricted
    fields:
      - id: authority-code
        type: string
        required: true
        maxLength: 64
        classification: restricted
      - id: name
        type: string
        required: true
        maxLength: 160
        classification: restricted
      - id: jurisdiction
        type: string
        required: true
        maxLength: 80
        classification: restricted
    constraints:
      - kind: unique
        fields:
          - authority-code
