apiVersion: registry.registrystack.org/product-contract/v1
product: registry-server
invariants:
  - {id: RS-SEC-01, state: enforced, targetWave: W4, threat: Deployment bindings alter governed behavior after package review., enforcementPoint: package loader and runtime binding parser, refusal: Reject a package or runtime binding that mixes governed model bytes with deployment-only values., negativeId: RS-NEG-01, negativeTest: {path: crates/registry-server/tests/postgres_package.rs, name: package_binding_refuses_wrong_environment_instance_database_sequence_and_prior}}
  - {id: RS-SEC-02, state: enforced, targetWave: W4, threat: "A tampered, wrong-environment, stale, or wrong-database package becomes active.", enforcementPoint: package verification and activation ledger, refusal: "Refuse activation before readiness when identity, signature, environment, sequence, or database binding is invalid.", negativeId: RS-NEG-02, negativeTest: {path: crates/registry-server/tests/postgres_package.rs, name: real_postgres_package_startup_apply_failure_and_old_process_are_closed}}
  - {id: RS-SEC-03, state: enforced, targetWave: W2, threat: Records change while migrations or activation are incomplete., enforcementPoint: advisory locks and durable maintenance state, refusal: Refuse record operations while maintenance is active or the active package differs., negativeId: RS-NEG-03, negativeTest: {path: crates/registry-server/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: RS-SEC-04, state: enforced, targetWave: W2, threat: The runtime can alter schema or bypass row-security administration., enforcementPoint: PostgreSQL role bootstrap and startup verification, refusal: "Refuse startup when runtime or migration roles violate ownership, privilege, or extension boundaries.", negativeId: RS-NEG-04, negativeTest: {path: crates/registry-server/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: RS-SEC-05, state: enforced, targetWave: W3, threat: A caller selects an ungranted profile or learns protected resource existence., enforcementPoint: compiled route and access inventory, refusal: Treat unknown or unauthorized profile and resource combinations as the same value-free absence outcome before record I/O., negativeId: RS-NEG-05, negativeTest: {path: crates/registry-server/tests/http_read_only.rs, name: profile_and_resource_concealment_complete_before_record_io}}
  - {id: RS-SEC-06, state: enforced, targetWave: W3, threat: Fallback claims or mismatched row rules grant authority., enforcementPoint: verified-claim mapper and generated RLS policy, refusal: Deny absent or malformed direct authority claims before record I/O and deny rows outside the matching RLS boundary., negativeId: RS-NEG-06, negativeTest: {path: crates/registry-server/tests/http_auth.rs, name: missing_malformed_or_fallback_only_principal_is_refused_before_record_io}}
  - {id: RS-SEC-07, state: enforced, targetWave: W2, threat: Transaction-local claim context leaks through a reused database connection., enforcementPoint: pool checkout cleanup and transaction-local context installation, refusal: Abort the request and discard an unsafe connection rather than reuse stale context., negativeId: RS-NEG-07, negativeTest: {path: crates/registry-server/tests/postgres_kernel.rs, name: real_postgres_kernel_proves_roles_rls_interlock_and_pool_isolation}}
  - {id: RS-SEC-08, state: enforced, targetWave: W3, threat: Classified metadata or non-public fields become public inputs or outputs., enforcementPoint: compiler classification and profile projection checks, refusal: Reject an unsafe package and refuse an operation that crosses the public-processing floor., negativeId: RS-NEG-08, negativeTest: {path: crates/registry-server/tests/compiler_contract.rs, name: public_profile_cannot_process_an_internal_field}}
  - {id: RS-SEC-09, state: enforced, targetWave: W3, threat: Constraint failures disclose hidden rows or values., enforcementPoint: mutation problem mapping and database diagnostic filter, refusal: Return a stable value-free conflict or absence problem without physical names or values., negativeId: RS-NEG-09, negativeTest: {path: crates/registry-server/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: RS-SEC-10, state: enforced, targetWave: W3, threat: "A partial mutation commits record state without its revision, audit, idempotency, or event history.", enforcementPoint: single record transaction coordinator, refusal: Roll back every mutation component and release no success response when any terminal component fails., negativeId: RS-NEG-10, negativeTest: {path: crates/registry-server/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: RS-SEC-11, state: enforced, targetWave: W3, threat: Protected data is released before an accountable attempt and terminal audit exist., enforcementPoint: protected-read and mutation response-release gate, refusal: Persist the value-free attempt first and return service unavailable if terminal audit cannot commit., negativeId: RS-NEG-11, negativeTest: {path: crates/registry-server/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: RS-SEC-12, state: enforced, targetWave: W3, threat: "An ETag or idempotency result is replayed under a different access context.", enforcementPoint: authenticated ETag and idempotency binding, refusal: "Reject a replay whose package, profile, principal, purpose, row boundary, projection, or canonical request context differs.", negativeId: RS-NEG-12, negativeTest: {path: crates/registry-server/tests/postgres_mutation.rs, name: real_postgres_mutation_is_audited_atomic_typed_and_exactly_replayable}}
  - {id: RS-SEC-13, state: enforced, targetWave: W3, threat: "Problems, logs, metrics, traces, or database diagnostics disclose data, credentials, or physical structure.", enforcementPoint: closed diagnostic vocabulary and telemetry boundary, refusal: Replace unsafe detail with a stable value-free problem and suppress unsafe telemetry fields., negativeId: RS-NEG-13, negativeTest: {path: crates/registry-server/tests/postgres_mutation.rs, name: real_postgres_http_mutations_are_guarded_and_exactly_replayable}}
  - {id: RS-SEC-14, state: enforced, targetWave: W1, threat: Different generated surfaces or physical names diverge from the reviewed configuration., enforcementPoint: canonical compiler and artifact inventory comparison, refusal: Reject non-deterministic or inconsistent compilation before package creation., negativeId: RS-NEG-14, negativeTest: {path: crates/registry-server/tests/compiler_contract.rs, name: duplicate_routes_fail_before_artifact_generation}}
  - {id: RS-SEC-15, state: enforced, targetWave: W5, threat: "A condition leaks a more-classified field through event presence, captured values reach widened or substituted egress, erased data is replayed, or an upgrade strands retained delivery work.", enforcementPoint: "compiler-derived event classification, exact activated destination authority, transactional capture, durable CloudEvents delivery and retention, and activation compatibility interlock", refusal: "Reject underclassified conditions, widened runtime ceilings, mismatched destination bindings or payloads, stale, non-dead-letter, or erased replay, and changed or removed bindings with deliverable retained work before egress or activation.", negativeId: RS-NEG-15, negativeTest: {path: crates/registry-server/tests/postgres_webhook_delivery.rs, name: real_postgres_webhook_delivery_retry_dead_letter_replay_is_package_bound_audited_and_confined}}
  - {id: RS-SEC-16, state: enforced, targetWave: W5, threat: A domain fixture gains hidden production behavior through a hard-coded runtime concept., enforcementPoint: self-tested source-neutrality gate over production source and public kernel contracts, refusal: Reject any acceptance-fixture identifier planted in the runtime source or public kernel contract., negativeId: RS-NEG-16, negativeTest: {path: products/registry-server/scripts/test_check_source_neutrality.py, name: test_fixture_identifier_in_production_source_is_rejected}}
  - {id: RS-SEC-17, state: enforced, targetWave: W3, threat: An encrypted cursor is replayed under a different authorized query context., enforcementPoint: fresh HTTP authorization plus authenticated cursor opening and PostgreSQL ReadPlan binding recomputation, refusal: "Reject before SQL when package, route, operation, profile, principal, purpose, row boundary, projection, filter, sort, temporal instant, page size, or expiry differs.", negativeId: RS-NEG-17, negativeTest: {path: crates/registry-server/tests/postgres_read.rs, name: real_postgres_temporal_keyset_and_cursor_binding_edges_are_enforced}}
  - {id: RS-SEC-18, state: enforced, targetWave: W5, threat: A bulk request bypasses per-item authority or commits a valid prefix after a later item fails., enforcementPoint: configured Batch route and single-transaction mutation coordinator, refusal: "Refuse the complete request before record I/O when its bounds, operation, profile, or mutation mode is invalid; otherwise roll back every item and release nothing when any item or terminal component fails.", negativeId: RS-NEG-18, negativeTest: {path: crates/registry-server/tests/postgres_batch.rs, name: real_postgres_batch_is_bounded_authorized_atomic_and_exactly_replayable}}
  - {id: RS-SEC-19, state: enforced, targetWave: W5, threat: "A malformed, private, ambiguous, denied, or wrong-algorithm operator-pinned JWKS selects unintended verification material or leaks key metadata.", enforcementPoint: static JWKS validation before verifier construction in production startup and schema-test execution, refusal: "Reject the complete bounded document unless it is a strict duplicate-free set of valid public keys exactly bound to the configured algorithm, signature use, verification operation, and kid policy.", negativeId: RS-NEG-19, negativeTest: {path: crates/registry-server/tests/runtime_config.rs, name: static_jwks_validation_refuses_unsafe_documents_value_free}}
  - {id: RS-SEC-20, state: enforced, targetWave: W3, threat: "A lookup selector accepts partial, extra, mistyped, caller-supplied claim values, or otherwise becomes an enumeration oracle.", enforcementPoint: compiled selector grant and bounded lookup request parser, refusal: "Require the selector's exact configured field set and origin, then collapse unknown, ungranted, missing-claim, zero-match, and multiple-match outcomes to one value-free unresolved response.", negativeId: RS-NEG-20, negativeTest: {path: crates/registry-server/tests/http_read_only.rs, name: lookup_body_exactness_origin_types_and_unresolved_equivalence_are_value_free}}
  - {id: RS-SEC-21, state: enforced, targetWave: W3, threat: "A relationship traversal inherits direct target rights or widens its configured target projection, filtering, ordering, or count authority.", enforcementPoint: compiled named read-path grant and route-specific query plan, refusal: "Require an independently granted path and enforce only that path's target fields and query capabilities; conceal unknown and ungranted paths identically before record I/O.", negativeId: RS-NEG-21, negativeTest: {path: crates/registry-server/tests/http_read_only.rs, name: relationship_route_uses_path_grant_not_direct_target_rights}}
  - {id: RS-SEC-22, state: enforced, targetWave: W5, threat: A new profile or relationship grant omits mandatory entity access restrictions., enforcementPoint: compiler access requirements after module composition and before artifact generation, refusal: Reject profiles missing mandatory scopes or row bindings or widening allowed purposes; reject relationship grants whose target or join row requirements cannot be enforced., negativeId: RS-NEG-22, negativeTest: {path: crates/registry-server/tests/access_configuration.rs, name: requirements_are_mandatory_not_grants_and_cannot_be_weakened_by_profiles}}
