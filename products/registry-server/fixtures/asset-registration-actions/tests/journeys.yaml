apiVersion: registry.registrystack.org/server-journeys/v1
journeys:
  - id: create-asset-and-initial-inspection
    steps:
      - id: invoke-registration-action
        action: register-asset-with-inspection
        accessProfile: asset-action-registrar
        claims: &registrar_claims
          principal: synthetic-asset-registrar
          scopes: [registry:asset:register]
          purpose: asset-registration
          directClaims:
            jurisdiction: north-district
        request:
          operation: invoke
          idempotencyKey: asset-registration-actions-001
          input:
            assetCode: ASSET-ACTION-001
            label: Synthetic generator
            assetType: equipment
            jurisdiction: north-district
            observedAt: "2026-09-01T08:30:00Z"
            initialResult: passed
        expect:
          outcome: success
          status: 200
        capture: registered-asset-application
        captureResults:
          asset: registered-asset
      - id: retry-lost-registration-response
        action: register-asset-with-inspection
        accessProfile: asset-action-registrar
        claims: *registrar_claims
        request:
          operation: invoke
          idempotencyKey: asset-registration-actions-001
          input:
            assetCode: ASSET-ACTION-001
            label: Synthetic generator
            assetType: equipment
            jurisdiction: north-district
            observedAt: "2026-09-01T08:30:00Z"
            initialResult: passed
        expect:
          outcome: success
          status: 200
        capture: replayed-asset-application
        captureResults:
          asset: replayed-asset
      - id: reused-key-with-different-body-is-refused
        action: register-asset-with-inspection
        accessProfile: asset-action-registrar
        claims: *registrar_claims
        request:
          operation: invoke
          idempotencyKey: asset-registration-actions-001
          input:
            assetCode: ASSET-ACTION-002
            label: Different generator
            assetType: equipment
            jurisdiction: north-district
            observedAt: "2026-09-01T08:45:00Z"
            initialResult: passed
        expect:
          outcome: refusal
          status: 409
          problemCode: idempotency.conflict
      - id: boundary-escape-is-refused
        action: register-asset-with-inspection
        accessProfile: asset-action-registrar
        claims: *registrar_claims
        request:
          operation: invoke
          idempotencyKey: asset-registration-actions-002
          input:
            assetCode: ASSET-ACTION-003
            label: Southern generator
            assetType: equipment
            jurisdiction: south-district
            observedAt: "2026-09-01T09:00:00Z"
            initialResult: passed
        expect:
          outcome: refusal
          status: 412
          problemCode: precondition.failed
