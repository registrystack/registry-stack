apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: asset-registration-actions
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: asset-registration-actions-fixture
  sequence: 1
  sourceRevision: asset-registration-actions-fixture-0.1.0
manifestProjection:
  accessProfile: asset-auditor
  classificationCeiling: internal
  catalog:
    baseUrl: https://asset-registration-actions.example.gov
    title: Asset Registration Actions Catalog
    description: Portable metadata for the asset registration action fixture.
    publisher:
      name: Asset Registration Authority
      iri: https://asset-registration-actions.example.gov/authority
  dataset:
    title: Asset Registration Actions Registry
    description: Asset records and initial inspection events created by one configured immediate action.
    owner: Asset Registration Authority
    status: active
modules:
  - id: "asset-registration-actions-core"
    version: "0.1.0"
    digest: "sha256:e13f162e06a076afeb03646454ef8e022f700967fef819101faab44b8a7ca172"

entities: []
accessProfiles:
  - id: asset-action-registrar
    default: true
    principalClaim: registry_principal
    requiredScopes: [registry:asset:register]
    requiredPurposes: [asset-registration]
    grants:
      - action: register-asset-with-inspection
        operations: [invoke]
        targets:
          - entity: asset
            rowBoundaries:
              - {field: jurisdiction, claim: jurisdiction, operator: equals}
          - entity: asset-inspection
            rowBoundaries:
              - {field: jurisdiction, claim: jurisdiction, operator: equals}
        results: [asset]
  - id: asset-auditor
    principalClaim: registry_principal
    requiredScopes: [registry:asset:audit]
    requiredPurposes: [asset-audit]
    grants:
      - entity: asset
        operations: [get, list]
        readableFields: [asset-code, label, asset-type, jurisdiction]
        filterableFields: [asset-code, jurisdiction]
        rowBoundaries:
          - {field: jurisdiction, claim: jurisdiction, operator: equals}
      - entity: asset-inspection
        operations: [get, list]
        readableFields: [asset, observed-at, result, jurisdiction]
        filterableFields: [asset, jurisdiction]
        rowBoundaries:
          - {field: jurisdiction, claim: jurisdiction, operator: equals}
vocabularies:
  - id: asset-type
    values: [equipment, vehicle, furniture]
  - id: inspection-result
    values: [passed, failed, needs-follow-up]
