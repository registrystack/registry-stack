apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry:
  id: household-contact-actions
  canonicalBaseIri: https://household-contact-actions.example.gov
  version: 0.1.0
  defaultLanguage: en
package:
  environment: acceptance
  instanceId: household-contact-actions-fixture
  sequence: 1
  sourceRevision: household-contact-actions-fixture-0.1.0
manifestProjection:
  accessProfile: household-operator
  classificationCeiling: restricted
  catalog:
    baseUrl: https://household-contact-actions.example.gov
    title: Household Contact Actions Catalog
    description: Portable metadata for the household contact immediate action fixture.
    publisher:
      id: household-contact-actions-authority
      name: Household Registry Authority
      iri: https://household-contact-actions.example.gov/authority
  publicService: {id: household-contact-actions-service, title: Household Contact Actions Catalog}
  datasets:
    - id: household-contact-actions
      title: Household Contact Actions Registry
      description: Household, person, membership, and service-center records used by the immediate action fixture.
      owner: Household Registry Authority
      status: active
  dataServices:
    - id: household-contact-actions-data-service
      title: Household Contact Actions Catalog
      endpointUrl: https://household-contact-actions.example.gov
      servesDatasets: [household-contact-actions]
  distributions: []
modules:
  - id: "household-contact-actions-core"
    version: "0.1.0"
    digest: "sha256:b1497bdb8d3ac367a2633a5ea2b8eb945ddd9dfe254d2576310caa3adea4517f"

entities: []
accessProfiles:
  - id: household-operator
    default: true
    principalClaim: registry_principal
    requiredScopes: [registry:household:operate]
    requiredPurposes: [household-administration]
    grants:
      - entity: household
        operations: [create, get]
        readableFields: [household-code, household-name, district, contact-person]
        writableFields: [household-code, household-name, district]
        rowBoundaries:
          - {field: district, claim: district, operator: equals}
      - entity: service-center
        operations: [create, get]
        readableFields: [center-code, label, district]
        writableFields: [center-code, label, district]
        rowBoundaries:
          - {field: district, claim: district, operator: equals}
      - entity: person
        operations: [get]
        readableFields: [person-code, legal-name, district]
        rowBoundaries:
          - {field: district, claim: district, operator: equals}
      - entity: group-membership
        operations: [get, list]
        readableFields: [person, household, registration-site, district]
        filterableFields: [household, person]
        rowBoundaries:
          - {field: district, claim: district, operator: equals}
  - id: household-maintainer
    principalClaim: registry_principal
    requiredScopes: [registry:household:maintain]
    requiredPurposes: [household-maintenance]
    grants:
      - entity: household
        operations: [get, patch]
        readableFields: [household-code, household-name, district, contact-person]
        writableFields: [household-name]
        rowBoundaries:
          - {field: district, claim: district, operator: equals}
  - id: contact-registrar
    principalClaim: registry_principal
    requiredScopes: [registry:contact:register]
    requiredPurposes: [contact-registration]
    grants:
      - action: register-household-contact
        operations: [invoke]
        targets:
          - entity: household
            rowBoundaries:
              - {field: district, claim: district, operator: equals}
          - entity: person
            rowBoundaries:
              - {field: district, claim: district, operator: equals}
          - entity: group-membership
            rowBoundaries:
              - {field: district, claim: district, operator: equals}
          - entity: service-center
            rowBoundaries:
              - {field: district, claim: district, operator: equals}
        results: [person, membership, household]
