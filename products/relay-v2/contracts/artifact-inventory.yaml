schemaVersion: relay.registrystack.org/artifact-inventory/v1alpha1
product: relay-v2
artifacts:
  - id: openapi-full
    mediaType: application/yaml
    visibility: operator-only
    source: compiled-registry
    generated: true
  - id: openapi-public
    mediaType: application/json
    visibility: public
    source: compiled-registry
    generated: true
  - id: access-profile-schema
    mediaType: application/schema+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
    invariant: One artifact exists per compiled operation access profile, validates mandatory Registry Core with every allowed selected-profile domainData subset, and carries the access-profile accessBinding with its exact profile identifier.
  - id: geojson-response-schema
    mediaType: application/schema+json
    visibility: operation-compatible
    source: compiled-operation-access-profile
    generated: true
    invariant: Exists only when the selected access profile discloses the primary Point property and validates its RFC 7946 or JSON-FG response shape.
  - id: sdmx-dataflow-structure
    mediaType: application/vnd.sdmx.structure+json;version=2.1.0
    visibility: statistical-dataset-compatible
    source: compiled-statistical-dataset
    generated: true
    invariant: One exact canonical artifact exists per SDMX-bound statistical dataset at artifacts/<dataset>.sdmx.dataflow.json, carries the fixed-operation accessBinding, and is the byte source for its dataflow structure route.
  - id: sdmx-datastructure-structure
    mediaType: application/vnd.sdmx.structure+json;version=2.1.0
    visibility: statistical-dataset-compatible
    source: compiled-statistical-dataset
    generated: true
    invariant: One exact canonical artifact exists per SDMX-bound statistical dataset at artifacts/<dataset>.sdmx.datastructure.json, carries the fixed-operation accessBinding, and is the byte source for its datastructure route.
  - id: access-profile-shacl
    mediaType: text/turtle
    visibility: operation-compatible
    source: compiled-operation-access-profile
    generated: true
    invariant: One shape exists per compiled operation access profile; public projection never inventories protected profile identifiers.
  - id: full-record-schema
    mediaType: application/schema+json
    visibility: operator-only
    source: compiled-resource
    generated: true
    invariant: Validates the complete reviewed source Record, including an undisclosed Point property, before field minimization.
  - id: full-record-shacl
    mediaType: text/turtle
    visibility: operator-only
    source: compiled-resource
    generated: true
    invariant: Retains full source requiredness for pre-disclosure validation.
  - id: semantic-model
    mediaType: application/ld+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
    invariant: Defines the local vocabulary; it is not only a JSON-LD context.
  - id: jsonld-context
    mediaType: application/ld+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
  - id: shacl-shape
    mediaType: text/turtle
    visibility: operation-compatible
    source: compiled-resource
    generated: true
  - id: codelists
    mediaType: application/yaml
    visibility: operation-compatible
    source: governed-contract-closure
    generated: false
  - id: capability-inventory
    mediaType: application/json
    visibility: discovery-policy
    source: compiled-operations
    generated: true
  - id: audit-event-schema
    mediaType: application/schema+json
    visibility: operator-only
    source: relay-audit-vocabulary
    generated: true
    invariant: Records categorical access-profile, format-profile, statistical data-or-structure surface, SDMX wire format, and query-shape identity without bbox, SDMX keys or constraints, principal, carrier, or source values.
  - id: identification-report
    mediaType: application/json
    visibility: operator-only
    source: schema-observation-and-digest-pinned-rule-pack
    generated: true
    invariant: Deterministic, schema-only, value-free candidates remain suggested or uncertain.
  - id: classification-inventory
    mediaType: application/json
    visibility: operator-only
    source: compiled-classifications
    generated: true
    invariant: Accounts for every processed source column and disclosed property.
  - id: access-profile-report
    mediaType: application/json
    visibility: operator-only
    source: compiled-operation-access-profiles
    generated: true
    invariant: Separates per-access-profile processed columns and processing handling from disclosed properties and disclosure handling.
  - id: contextual-review-findings
    mediaType: application/json
    visibility: operator-only
    source: compiled-classification-context
    generated: true
    invariant: Value-free prompts are review aids, not runtime policy.
  - id: classification-review
    mediaType: application/yaml
    visibility: operator-only
    source: reviewed-governance-sidecar
    generated: false
    invariant: Binds Registry identity and classification inventory; generated review also binds its exact report and rule pack.
  - id: sdmx-profile-lock
    mediaType: application/yaml
    visibility: operator-only
    source: product-contract
    generated: false
    invariant: Pins the aligned REST read subset, JSON and CSV formats, and exact external JSON-schema digests; upstream schema bytes are fetched only by an explicit validation option or supplied through an external cache and are never committed.
