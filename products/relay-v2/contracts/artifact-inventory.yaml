schemaVersion: relay.registrystack.org/artifact-inventory/v1alpha1
product: relay-v2
artifacts:
  - id: openapi-full
    mediaType: application/yaml
    visibility: operator-only
    source: compiled-registry
    generated: true
  - id: openapi-public
    mediaType: application/json
    visibility: public
    source: compiled-registry
    generated: true
  - id: representation-schema
    mediaType: application/schema+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
    invariant: One artifact exists per compiled operation representation and validates mandatory Registry Core with every allowed selected-profile domainData subset.
  - id: representation-shacl
    mediaType: text/turtle
    visibility: operation-compatible
    source: compiled-operation-representation
    generated: true
    invariant: One shape exists per compiled operation representation; public projection never inventories protected profile identifiers.
  - id: full-record-schema
    mediaType: application/schema+json
    visibility: operator-only
    source: compiled-resource
    generated: true
    invariant: Validates the complete reviewed source representation before field minimization.
  - id: full-record-shacl
    mediaType: text/turtle
    visibility: operator-only
    source: compiled-resource
    generated: true
    invariant: Retains full source requiredness for pre-disclosure validation.
  - id: semantic-model
    mediaType: application/ld+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
    invariant: Defines the local vocabulary; it is not only a JSON-LD context.
  - id: jsonld-context
    mediaType: application/ld+json
    visibility: operation-compatible
    source: compiled-resource
    generated: true
  - id: shacl-shape
    mediaType: text/turtle
    visibility: operation-compatible
    source: compiled-resource
    generated: true
  - id: codelists
    mediaType: application/yaml
    visibility: operation-compatible
    source: governed-contract-closure
    generated: false
  - id: capability-inventory
    mediaType: application/json
    visibility: discovery-policy
    source: compiled-operations
    generated: true
  - id: audit-event-schema
    mediaType: application/schema+json
    visibility: operator-only
    source: relay-audit-vocabulary
    generated: true
  - id: identification-report
    mediaType: application/json
    visibility: operator-only
    source: schema-observation-and-digest-pinned-rule-pack
    generated: true
    invariant: Deterministic, schema-only, value-free candidates remain suggested or uncertain.
  - id: classification-inventory
    mediaType: application/json
    visibility: operator-only
    source: compiled-classifications
    generated: true
    invariant: Accounts for every processed source column and disclosed property.
  - id: representation-report
    mediaType: application/json
    visibility: operator-only
    source: compiled-operation-representations
    generated: true
    invariant: Separates per-representation processed columns and processing handling from disclosed properties and disclosure handling.
  - id: contextual-review-findings
    mediaType: application/json
    visibility: operator-only
    source: compiled-classification-context
    generated: true
    invariant: Value-free prompts are review aids, not runtime policy.
  - id: classification-review
    mediaType: application/yaml
    visibility: operator-only
    source: reviewed-governance-sidecar
    generated: false
    invariant: Binds Registry identity and classification inventory; generated review also binds its exact report and rule pack.
