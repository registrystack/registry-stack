schemaVersion: relay.registrystack.org/http-journey/v1alpha1
registry: urn:example:registry:social-assistance-enrolments
authorizations:
  social-lookup-area-a:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {purpose: benefit-delivery, service_area: AREA-A}
  social-caseworker-area-a:
    principal: synthetic-social-caseworker
    scopes: [registry:social-assistance:caseworker]
    claims: {purpose: benefit-delivery, service_area: AREA-A}
  social-caseworker-wrong-scope:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {purpose: benefit-delivery, service_area: AREA-A}
  social-lookup-wrong-purpose:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {purpose: unpermitted-purpose, service_area: AREA-A}
  social-lookup-missing-purpose:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {service_area: AREA-A}
  social-lookup-missing-binding:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {purpose: benefit-delivery}
  social-lookup-wrong-binding:
    principal: synthetic-social-client
    scopes: [registry:social-assistance:limited]
    claims: {purpose: benefit-delivery, service_area: AREA-B}
steps:
  - id: readiness
    request: {method: GET, path: /ready}
    expect: {status: 200}
  - id: lookup-success
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: "enrolmentStatus,validThrough"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect:
      status: 200
      registryCoreRequired: true
      domainDataKeys: [enrolmentStatus, validThrough]
      absentEverywhere: [caseReference, personReference, service_area_code]
  - id: lookup-default
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect:
      status: 200
      registryCoreRequired: true
      domainDataKeys: [maskedEnrolmentReference, enrolmentStatus, validThrough]
      domainDataValues: {maskedEnrolmentReference: "***0001"}
  - id: caseworker-representation
    authorizationFixture: social-caseworker-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {representation: caseworker, fields: "enrolmentReference,programmeCode"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect:
      status: 200
      registryCoreRequired: true
      domainDataKeys: [enrolmentReference, programmeCode]
  - id: unauthorized-representation
    authorizationFixture: social-caseworker-wrong-scope
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {representation: caseworker}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 404, code: resource.not_found}
  - id: unknown-representation
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {representation: unknown-profile}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 404, code: resource.not_found}
  - id: duplicate-representation
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {representation: "limited,caseworker"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 400, code: request.representation_invalid}
  - id: lookup-second-subset
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: maskedEnrolmentReference}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 200, registryCoreRequired: true, domainDataKeys: [maskedEnrolmentReference]}
  - id: lookup-jsonld
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      headers: {accept: application/ld+json}
      query: {fields: "enrolmentStatus,validThrough"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect:
      status: 200
      registryCoreRequired: true
      domainDataKeys: [enrolmentStatus, validThrough]
      recordsEquivalentTo: lookup-success
  - id: route-confinement
    authorizationFixture: social-lookup-area-a
    request: {method: GET, path: /v2/resources/assistance-enrolment/records}
    expect: {status: 404, routeAbsent: true}
  - id: wrong-purpose
    authorizationFixture: social-lookup-wrong-purpose
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 403, code: consultation.denied}
  - id: missing-purpose
    authorizationFixture: social-lookup-missing-purpose
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 403, code: consultation.denied}
  - id: missing-binding
    authorizationFixture: social-lookup-missing-binding
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 403, code: consultation.denied}
  - id: wrong-binding
    authorizationFixture: social-lookup-wrong-binding
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 404, code: consultation.unresolved, equivalenceClass: unresolved}
  - id: unknown-field
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: notGoverned}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 400, code: request.fields_invalid}
  - id: duplicate-field
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: "programmeCode,programmeCode"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 400, code: request.fields_invalid}
  - id: source-column-field
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: programme_code}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 400, code: request.fields_invalid}
  - id: malformed-field
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      query: {fields: ",programmeCode"}
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 400, code: request.fields_invalid}
  - id: no-match
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-NONE, personReference: PERSON-SYNTH-NONE}
    expect: {status: 404, code: consultation.unresolved, equivalenceClass: unresolved}
  - id: ambiguous
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-AMBIG, personReference: PERSON-SYNTH-AMBIG}
    expect: {status: 404, code: consultation.unresolved, equivalenceClass: unresolved}
  - id: row-hidden
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0002, personReference: PERSON-SYNTH-0002}
    expect: {status: 404, code: consultation.unresolved, equivalenceClass: unresolved}
  - id: invalid-row
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-BAD1, personReference: PERSON-SYNTH-BAD1}
    expect: {status: 503, code: source.unavailable}
  - id: excessive-row
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-BAD2, personReference: PERSON-SYNTH-BAD2}
    expect: {status: 503, code: source.unavailable}
  - id: invalid-transform-input
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-XFORM, personReference: PERSON-SYNTH-XFORM}
    expect: {status: 503, code: source.unavailable}
  - id: quota-exhausted
    authorizationFixture: social-lookup-area-a
    request:
      method: POST
      path: /v2/resources/assistance-enrolment/lookups/by-case-and-person
      body: {caseReference: CASE-SYNTH-0001, personReference: PERSON-SYNTH-0001}
    expect: {status: 429, code: consultation.rate_limited}
