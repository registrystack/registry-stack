apiVersion: relay.registrystack.org/v2alpha1
kind: RelayRuntime
server:
  bind: 127.0.0.1:18081
packagePath: package
sources:
  assistance:
    path: fixture.sqlite
authentication:
  issuer:
    id: synthetic-external-issuer
    discoveryUrl: https://identity.example.invalid/.well-known/openid-configuration
    audience: relay-social-assistance
    tokenTypes: [at+jwt]
    algorithms: [ES256]
audit:
  sink: var/audit.jsonl
  integrityKeyRef: secret:env/RELAY_TEST_AUDIT_KEY
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 16
quotas:
  requestsPerMinute: 1
  burst: 12
