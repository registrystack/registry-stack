apiVersion: relay.registrystack.org/v2alpha1
kind: RelayRuntime
server:
  bind: 127.0.0.1:18083
packagePath: package
sources:
  events:
    path: fixture.sqlite
authentication:
  issuer:
    id: institutional-issuer
    discoveryUrl: https://issuer.example.invalid/.well-known/openid-configuration
    audience: relay-civil-events
    tokenTypes: [at+jwt]
    algorithms: [ES256]
audit:
  destination: file
  path: var/audit.jsonl
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 16
quotas:
  requestsPerMinute: 1
  burst: 8
