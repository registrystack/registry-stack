apiVersion: registry.registrystack.org/relay-runtime/v1alpha1
kind: RelayRuntimeConfig
listener:
  bind: 127.0.0.1:18083
package:
  root: /srv/relay/package
secretProviders:
  environment: {}
sources:
  events:
    path: fixture.sqlite
authentication:
  oidc:
    issuer: https://issuer.example.invalid
    jwksSource:
      kind: discovery
    audience: relay-civil-events
    tokenTypes: [at+jwt]
    algorithms: [ES256]
audit:
  destination: file
  path: var/audit.jsonl
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 16
quotas:
  requestsPerMinute: 1
  burst: 8
