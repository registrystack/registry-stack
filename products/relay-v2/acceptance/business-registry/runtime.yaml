apiVersion: registry.registrystack.org/relay-runtime/v1alpha1
kind: RelayRuntimeConfig
listener:
  bind: 127.0.0.1:18082
package:
  root: /srv/relay/package
secretProviders:
  environment: {}
sources:
  companies:
    path: fixture.sqlite
authentication:
  oidc:
    issuer: https://identity.example.invalid
    jwksSource:
      kind: discovery
    audience: relay-business-registry
    tokenTypes: [at+jwt]
    algorithms: [ES256]
audit:
  destination: file
  path: var/audit.jsonl
cursor:
  integrityKeyRef: secret:env/RELAY_TEST_CURSOR_KEY
  maximumAgeSeconds: 300
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 32
quotas:
  requestsPerMinute: 10000
  burst: 1000
shutdown:
  gracePeriodMilliseconds: 1000
