apiVersion: relay.registrystack.org/v2alpha1
kind: RelayRuntime
server:
  bind: 127.0.0.1:18082
packagePath: package
sources:
  companies:
    path: fixture.sqlite
authentication:
  issuer:
    id: synthetic-business-issuer
    discoveryUrl: https://identity.example.invalid/.well-known/openid-configuration
    audience: relay-business-registry
    tokenTypes: [at+jwt]
    algorithms: [ES256]
audit:
  sink: var/audit.jsonl
  integrityKeyRef: secret:env/RELAY_TEST_AUDIT_KEY
cursor:
  integrityKeyRef: secret:env/RELAY_TEST_CURSOR_KEY
  maximumAgeSeconds: 300
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 32
quotas:
  requestsPerMinute: 10000
  burst: 1000
shutdown:
  gracePeriodMilliseconds: 1000
