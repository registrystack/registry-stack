apiVersion: registry.registrystack.org/relay-runtime/v1alpha1
kind: RelayRuntimeConfig
listener:
  bind: 127.0.0.1:18084
package:
  root: /srv/relay/package
secretProviders:
  environment: {}
sources:
  labour-statistics:
    path: fixture.sqlite
authentication:
  oidc:
    issuer: https://identity.example.invalid
    jwksSource:
      kind: discovery
    audience: relay-labour-statistics
    tokenTypes: [at+jwt]
    algorithms: [EdDSA]
audit:
  destination: file
  path: var/audit.jsonl
cursor: null
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 16
quotas:
  requestsPerMinute: 10000
  burst: 1000
shutdown:
  gracePeriodMilliseconds: 1000
