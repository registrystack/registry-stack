apiVersion: relay.registrystack.org/v2alpha1
kind: RelayRuntime
server:
  bind: 127.0.0.1:18084
packagePath: package
sources:
  labour-statistics:
    path: fixture.sqlite
authentication:
  issuer:
    id: synthetic-statistics-issuer
    discoveryUrl: https://identity.example.invalid/.well-known/openid-configuration
    audience: relay-labour-statistics
    tokenTypes: [at+jwt]
    algorithms: [EdDSA]
audit:
  sink: var/audit.jsonl
  integrityKeyRef: secret:env/RELAY_TEST_AUDIT_KEY
cursor: null
limits:
  requestTimeoutMilliseconds: 1500
  concurrentQueries: 16
quotas:
  requestsPerMinute: 10000
  burst: 1000
shutdown:
  gracePeriodMilliseconds: 1000
