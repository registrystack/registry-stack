{
  "schemaVersion": "registry-discovery/implementation-schedule/v1alpha1",
  "phases": [
    {"id": "phase-0", "name": "Contract reset", "exit": "The salvage ledger, future-work ledger, product boundary, and supported public surface are reviewed."},
    {"id": "phase-1", "name": "Profile and publication", "exit": "Evidence generates deterministic closed profile bytes from validated public inputs and packages them. The unchanged published profile resources retain historical Relay validation only."},
    {"id": "phase-2", "name": "Immutable package", "exit": "discoveryctl validates origins and mappings offline, performs a bounded one-shot collection, and emits a verified package containing the canonical index."},
    {"id": "phase-3", "name": "Read-only discovery", "exit": "The runtime serves only probes, OpenAPI, exact service search, and evidence-type resolution from one immutable index."},
    {"id": "phase-4", "name": "Native journeys", "exit": "The Evidence journey proves explicit selection, existing local trust, and direct native invocation; retirement regressions prove historical Relay input and mixed indexes are refused."}
  ]
}
