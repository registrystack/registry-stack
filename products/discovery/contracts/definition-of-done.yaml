  "completionRule": "Every requirement has concrete tracked evidence. A command or test path is not completion evidence until its named gate passes in the final verification record.",
  "requirements": [
    {"id": "discovery-dod-16-1-product-scope", "section": "16.1", "requirement": "Registry Discovery naming, the five-route public surface, and the absence of scheduler, writable catalog, proxy, trust store, procedure, ranking, and mutation concerns are consistent.", "requiredEvidence": [{"path": "products/discovery/DECISIONS.md"}, {"path": "products/discovery/PR-DESCRIPTION.md"}, {"path": "crates/registry-discovery/openapi.json"}, {"path": "products/discovery/SALVAGE-LEDGER.md"}]},
    {"id": "discovery-dod-16-2-standards-profile", "section": "16.2", "requirement": "One pinned JSON-LD context, schema, deterministic renderer, independently verified RDF projection, and selected offline SHACL subset implement the accurately recorded selected standards terms without a full application-profile claim.", "requiredEvidence": [{"path": "products/discovery/contracts/standards-profile.yaml"}, {"path": "products/discovery/profile/rdf/provenance.json"}, {"path": "products/discovery/scripts/validate_profile_rdf.py"}, {"path": "crates/registry-discovery-profile/src/lib.rs", "name": "render_and_parse_are_deterministic"}, {"path": "products/discovery/scripts/test_standards_oracle.py", "name": "test_json_ld_and_shacl_oracles_validate_every_profile_fixture"}, {"path": "products/discovery/scripts/test_standards_oracle.py", "name": "test_distinct_binding_nodes_preserve_repeated_service_id_capability_correlation"}]},
    {"id": "discovery-dod-16-3-provider-publication", "section": "16.3", "requirement": "Evidence and Relay derive deterministic public descriptions, preserve exact capability correlation under distinct binding identities, package exact bytes, exclude private or protected data through closed public projections, reject invalid authored projection values, and serve no dynamically reconstructed provider data.", "requiredEvidence": [{"path": "crates/registry-evidence/src/discovery.rs", "name": "provider_discovery_description_preserves_evidence_type_profile_correlation"}, {"path": "crates/registry-relay-v2/src/artifacts.rs", "name": "provider_discovery_description_preserves_semantic_class_operation_family_correlation"}, {"path": "products/discovery/contracts/security-test-traceability.yaml"}]},
    {"id": "discovery-dod-16-4-origin-build", "section": "16.4", "requirement": "The offline checked origin and mapping project feeds one bounded exact-target build that preserves provenance, origin isolation, and atomic, durably synced output replacement. Production builtAt is captured after all origin fetches complete. catalogRevision covers the normalized semantic service projection and excludes per-build originContentDigest, originFetchedAt, and builtAt values, so identical semantic inputs preserve record identities, semantic fields, and revisions while provenance timestamps may change. Every authored and compiled fixture satisfies its Draft 2020-12 schema and closed Rust parser.", "requiredEvidence": [{"path": "products/discovery/schemas/origins.schema.json"}, {"path": "products/discovery/schemas/evidence-mapping.schema.json"}, {"path": "products/discovery/schemas/runtime.schema.json"}, {"path": "products/discovery/schemas/index.schema.json"}, {"path": "products/discovery/fixtures/project/origins.yaml"}, {"path": "products/discovery/fixtures/project/discovery-index.json"}, {"path": "products/discovery/fixtures/schema-negative-corpus.json"}, {"path": "crates/registry-discoveryctl/tests/schema_contract.rs", "name": "every_positive_fixture_satisfies_draft_2020_12_and_the_closed_rust_parser"}, {"path": "crates/registry-discoveryctl/tests/schema_contract.rs", "name": "shared_negative_corpus_is_refused_by_both_schema_and_rust"}, {"path": "crates/registry-discoveryctl/src/project.rs", "name": "check_is_offline_and_accepts_an_unreachable_https_origin"}, {"path": "crates/registry-discoveryctl/tests/build.rs", "name": "build_fetches_each_origin_once_and_preserves_semantic_revisions"}, {"path": "crates/registry-discoveryctl/tests/build.rs", "name": "production_build_time_is_captured_after_origin_collection"}, {"path": "crates/registry-discoveryctl/tests/build.rs", "name": "failed_origin_fetch_leaves_the_previous_output_untouched"}, {"path": "crates/registry-discoveryctl/tests/build.rs", "name": "write_failure_preserves_previous_output_and_leaves_no_visible_temporary_file"}]},
    {"id": "discovery-dod-16-5-evidence-resolver", "section": "16.5", "requirement": "Requirement resolution preserves exact jurisdiction, AND within a list, OR between alternatives, mapping provenance, empty success, and complete-or-refused bounds without provider resolution.", "requiredEvidence": [{"path": "crates/registry-discovery/src/query.rs", "name": "resolver_preserves_and_within_lists_or_across_alternatives_and_refuses_over_bound"}, {"path": "crates/registry-discovery/src/model.rs"}]},
    {"id": "discovery-dod-16-6-runtime-query-api", "section": "16.6", "requirement": "Startup loads one strict immutable index and the runtime exposes only value-free probes, deterministic generated OpenAPI, exact bounded service search, and evidence-type resolution, with no metrics route. Runtime admission bounds request bodies before buffering, rejects malformed form encoding and request media parameters, and bounds synchronous query work.", "requiredEvidence": [{"path": "crates/registry-discovery/src/startup.rs", "name": "runtime_is_closed_and_contains_no_origin_mapping_trust_or_fetch_configuration"}, {"path": "crates/registry-discovery/src/server.rs", "name": "request_body_capacity_is_acquired_before_buffering_and_recovers"}, {"path": "crates/registry-discovery/src/server.rs", "name": "request_media_type_accepts_only_bare_or_utf8_json"}, {"path": "crates/registry-discovery/src/query.rs", "name": "malformed_percent_encoding_and_invalid_utf8_are_refused"}, {"path": "crates/registry-discovery/src/server.rs", "name": "real_trace_and_problem_output_exclude_request_canaries"}, {"path": "crates/registry-discovery/src/server.rs", "name": "real_router_exposes_only_the_fixed_read_only_surface"}, {"path": "crates/registry-discovery/src/openapi.rs", "name": "committed_openapi_is_the_deterministic_generator_output"}, {"path": "crates/registry-discovery/openapi.json"}]},
    {"id": "discovery-dod-16-7-client-trust-invocation", "section": "16.7", "requirement": "The Rust, Node, and Python clients resolve, search, and explicitly select public metadata only. Structural validation proves closed shape and capability binding, not trust or currentness. An ephemeral accepted handoff exists only after adopter-owned local acceptance; credentials and native product I/O occur only after that acceptance. Online renewal may refresh provenance only for unchanged trust-relevant service semantics, and every semantic change requires a new local acceptance decision.", "requiredEvidence": [{"path": "crates/registry-discovery-client/src/selection.rs", "name": "structural_validation_does_not_turn_descriptive_metadata_into_binding_authority"}, {"path": "crates/registry-discovery-client/src/selection.rs", "name": "unchanged_renewal_refreshes_provenance_but_requires_new_acceptance_for_semantic_change"}, {"path": "crates/registry-discovery-client/src/selection.rs", "name": "discovery_metadata_has_no_trust_or_native_io_capability"}, {"path": "crates/registry-discovery-client/tests/native_journey.rs", "name": "complete_evidence_and_relay_journeys_build_select_trust_and_invoke_natively"}, {"path": "crates/registry-discovery-client-node/__test__/surface.test.js"}, {"path": "crates/registry-discovery-client-py/tests/python/test_client.py", "name": "test_exact_local_acceptance_precedes_credentials_and_native_io"}, {"path": "crates/registry-discovery-client-py/tests/python/test_client.py", "name": "test_renewal_only_updates_provenance_for_the_same_accepted_subject"}, {"path": "products/discovery/scripts/test-adopter-tutorial.sh"}, {"path": "crates/registry-discovery-client/src/client.rs", "name": "response_bytes_are_bounded"}]},
    {"id": "discovery-dod-16-8-adopter-maintenance-ux", "section": "16.8", "requirement": "Provider, catalog operator, and consumer/verifier adoption is documented and exercised from a clean source tree as a small public publication block, origins and mappings, offline check, explicit build, exact selection, native trust handoff, deployment, and restart loop.", "requiredEvidence": [{"path": "products/discovery/README.md"}, {"path": "products/discovery/ACCEPTANCE-JOURNEYS.md"}, {"path": "products/discovery/contracts/implementation-schedule.yaml"}, {"path": "docs/site/src/content/docs/tutorials/publish-and-consume-discovery-index.mdx"}, {"path": "products/discovery/scripts/test-adopter-tutorial.sh"}]},
    {"id": "discovery-dod-16-9-acceptance-journeys", "section": "16.9", "requirement": "Evidence and Relay publication, build, exact selection, existing local trust, and direct native invocation are exercised as deterministic local journeys, including invalid origin and untrusted selection failures.", "requiredEvidence": [{"path": "products/discovery/ACCEPTANCE-JOURNEYS.md"}, {"path": "products/discovery/scripts/test-http.sh"}, {"path": "products/discovery/fixtures/descriptions/evidence.jsonld"}, {"path": "products/discovery/fixtures/descriptions/relay.jsonld"}]},
    {"id": "discovery-dod-16-10-security-ci", "section": "16.10", "requirement": "Every named Discovery security threat has a refusal and executable traceability; profile, schema, standards, contract, publication, build, runtime, and client gates are selected and run without secrets or live network fixtures.", "requiredEvidence": [{"path": "products/discovery/contracts/security-invariant-matrix.yaml"}, {"path": "products/discovery/contracts/security-test-traceability.yaml"}, {"path": "products/discovery/scripts/check-contracts.sh"}, {"path": "products/discovery/scripts/test-http.sh"}, {"path": "crates/registry-discoveryctl/tests/schema_contract.rs", "name": "shared_negative_corpus_is_refused_by_both_schema_and_rust"}, {"path": "products/discovery/scripts/test_standards_oracle.py", "name": "test_shacl_oracle_rejects_missing_endpoint"}]},
    {"id": "discovery-dod-16-11-pr-reduction", "section": "16.11", "requirement": "Wrong-boundary Federation registration, routing, trust, procedures, bindings, release surfaces, and dormant code are removed while useful deferred work remains recoverable outside production scope.", "requiredEvidence": [{"path": "products/discovery/SALVAGE-LEDGER.md"}, {"path": "products/discovery/FUTURE-WORK.md"}, {"path": "products/discovery/PR-DESCRIPTION.md"}]}
  ]
