apiVersion: registry.registrystack.org/product-contract/v1
product: scheduling
scope: mvp
purpose: >-
  Behaviour a reader could reasonably mistake for an oversight, recorded as
  deliberate. Each entry states what the product does or refuses, and cites
  the tests that hold it. A change that alters one of these behaviours
  updates or removes its entry in the same commit.
decisions:
  - id: SCHEDULING-DEC-01
    subject: Releasing a hold whose lifetime has passed answers 204
    decision: >-
      A release names the hold's state, not its clock. The release path admits
      any claim that is still a hold in the active state and closes it as
      released, so a hold whose lifetime has passed but whose row the sweeper
      has not yet touched releases cleanly and answers 204 No Content.
    alsoTrue: >-
      A release carries no caller-chosen idempotency key: the hold's own
      identifier is the key, so a retried release replays the first answer.
      A hold that is still a hold but no longer in the active state answers
      hold.released rather than a not-found, so a caller watching one id
      across its lifetime sees a released outcome, not a new refusal,
      whether a background sweep has already run. An id that never named a
      hold at all, or that names something else, answers
      operation.not-authorized before the transaction opens and before any
      permission is checked, the same answer a hold the caller's grant does
      not reach would give, so a caller cannot learn the id's existence from
      its own authorization. Confirmation resolves a hold by the same rule.
      A hold belonging to another caller is refused inside the transaction,
      where the refusal is audited. A hold consumes capacity only while its
      state is active and its expiry is still ahead of the transaction's
      clock, so an expired hold consumes nothing everywhere capacity is
      computed, whether or not any process has written the expired state
      yet.
    evidence:
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: an_expired_hold_returns_capacity_and_refuses_confirmation}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_release_returns_capacity_answers_replay_and_blocks_confirmation}
      - {path: crates/registry-scheduling-core/src/admission.rs, name: an_expired_hold_consumes_nothing_and_cannot_be_confirmed}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: release_hold_refuses_indistinguishably_for_missing_and_unauthorized_holds}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: confirm_appointment_refuses_indistinguishably_for_missing_and_unauthorized_holds}
  - id: SCHEDULING-DEC-02
    subject: Cancellation never answers policy.changed
    decision: >-
      The cancel path does not read the policy revision at all. It is guarded
      by the observed appointment revision, the caller's ownership, and the
      cancellation cutoff, and by nothing else.
    alsoTrue: >-
      An appointment stays cancellable under whatever policy currently
      governs its offering, including after the operator republishes the
      policy.
    contrast: >-
      Reschedule does check, and lets the policy guard outrank the revision
      guard. Hold creation, direct appointment creation, and hold
      confirmation check too.
    evidence:
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: cancellation_respects_the_cutoff_and_replays_its_verdict}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_reschedule_moves_under_the_observed_revision_and_refuses_stale_ones}
      - {path: crates/registry-scheduling-core/src/admission.rs, name: policy_change_outranks_a_window_revision_mismatch}
  - id: SCHEDULING-DEC-03
    subject: The commit-error projection lives in the service, not beside the enum
    decision: >-
      CommitError is declared in the runtime's store module, where the
      transaction raises it, and the single projection from it to a public
      problem code lives in the service module, in one exhaustive match with no
      wildcard arm.
    alsoTrue: >-
      The source-neutral core stays free of every HTTP library and owns only
      the numeric status pinned to each problem code, so one binding cannot
      answer a different status from another.
    safeguard: >-
      The match is exhaustive over a closed enum that is not marked
      non-exhaustive, so a tenth variant fails the build rather than falling
      through to a wrong status, and there is exactly one projection site.
    evidence:
      - {path: crates/registry-scheduling/src/service.rs, name: commit_errors_project_to_their_public_codes}
      - {path: crates/registry-scheduling/src/service.rs, name: problem_receipts_carry_the_pinned_problem_without_a_trace}
  - id: SCHEDULING-DEC-04
    subject: Subquotas are ceilings, not reserved floors
    decision: >-
      A channel subquota caps how much of a published window that channel may
      take. It reserves nothing for that channel: an unclaimed subquota is
      available to the window's other channels up to the published total.
    alsoTrue: >-
      Reserved floors are not implemented.
    evidence:
      - {path: crates/registry-scheduling-core/src/admission.rs, name: subquota_channels_are_checked_before_the_total}
      - {path: crates/registry-scheduling-core/src/policy.rs, name: subquota_slices_may_not_overdraw_the_window}
  - id: SCHEDULING-DEC-05
    subject: One staffing pool cannot back independently counted overlapping supply
    decision: >-
      The authoring check refuses a resource pool that serves an exact-time
      offering and a published window at the same time. It also refuses two
      overlapping windows backed by the same pool, whatever reservedMembers
      either window declares. Those are not supported configurations;
      disjoint windows may reuse the pool.
    alsoTrue: >-
      Exact-time commitments count pool members while arrival commitments
      count window units, and two windows count separate window ids. The
      ledger does not enforce staffing partitions, and reservedMembers
      records operator intent without creating that enforcement.
    evidence:
      - {path: crates/registry-scheduling-core/src/policy.rs, name: an_unpartitioned_shared_staffing_block_is_rejected}
      - {path: crates/registry-scheduling-core/src/policy.rs, name: overlapping_windows_may_not_share_a_staffing_pool}
  - id: SCHEDULING-DEC-06
    subject: Listing cursors carry no actor binding field
    decision: >-
      A stored cursor holds its identity, its listing context, its position,
      and its expiry. It is not keyed by the caller.
    alsoTrue: >-
      Catalogue availability is public to any reader with the read scope.
      Appointment history sits behind the ownership check, which is
      re-applied before the cursor is honoured rather than trusted from the
      cursor. A listing that is neither public nor ownership-checked must
      add the binding.
    evidence:
      - {path: crates/registry-scheduling/src/cursors.rs, name: a_cursor_binds_to_its_listing_context_and_expires}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: cursors_page_their_own_listing_and_refuse_foreign_contexts}
  - id: SCHEDULING-DEC-07
    subject: Member selection reads under the pool lock without SKIP LOCKED
    decision: >-
      Selecting a member for an exact-time commitment locks the pool row the
      offering anchors on, then reads the pool's members and their occupancy
      with plain queries inside that lock. The member rows themselves are
      never locked.
    alsoTrue: >-
      The pool row is the serialization point for every offering that sells
      that pool, so every commitment against the pool runs one at a time and
      member selection cannot race another selection. Members are not
      independently selectable, and a hot pool serializes every commitment
      on one row.
    evidence:
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_direct_create_books_without_a_hold_and_exhausts_capacity}
      - {path: crates/registry-scheduling-core/src/admission.rs, name: the_second_caller_against_the_last_unit_is_refused}
  - id: SCHEDULING-DEC-08
    subject: Source facts preserve commitment truth and guard changes to occupied supply
    decision: >-
      `records apply` replaces the environment facts wholesale, but not
      unconditionally. The swap takes every supply anchor in the anchor's own
      order before it reads a claim, and refuses the whole apply when any
      active booking, or any hold whose lifetime is still ahead, occupies a
      pool member the incoming records move between pools, or when incoming window
      records remove, move, or reduce capacity below standing commitments.
      Physical inventory loss and dated unavailability remain representable:
      existing allocation rows survive and continue to consume the same
      resource identity if it returns. New allocation and hold confirmation
      recheck actual supply. Nothing partial is written and source updates
      never silently cancel commitments.
    alsoTrue: >-
      Window facts and their lock anchors are replaced in the same
      transaction as locations, pools, members, and exceptions. An expired
      hold occupies nothing, matching the live-predicate rule the rest of
      the ledger uses, so it never blocks a swap. A capacity transaction
      holds its own anchor from its snapshot until it commits, so no
      commitment is mid-evaluation against a member about to be deleted, and
      a claim written a moment later is seen by the guard. Exact, bundle,
      and window transactions lock their supply anchors in order before the
      revision guard, and the swap reserves window resources while it holds
      every anchor.
    residual: >-
      Applying physical loss does not resolve its operational impact. The
      institution still arranges replacement resources or explicitly changes
      affected appointments; source publication performs neither action.
    evidence:
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_records_swap_preserves_an_active_allocation_when_physical_inventory_is_lost}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_records_swap_waits_for_the_capacity_transaction_holding_the_pool}
      - {path: crates/registry-scheduling/tests/postgres_commitments/multi_window.rs, name: window_admission_and_records_publication_follow_one_lock_order}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_records_swap_refuses_to_move_an_occupied_resource_between_pools}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: records_replacement_refuses_to_move_a_window_with_standing_commitments}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_records_swap_waits_for_the_capacity_transaction_holding_the_pool}
      - {path: crates/registry-schedulingctl/tests/records_apply_postgres.rs, name: records_apply_replaces_facts_wholesale_and_audits_each_write}
  - id: SCHEDULING-DEC-09
    subject: Any valid package applies, an earlier one included, but the active one does not
    decision: >-
      schedulingctl apply accepts any package that verifies and checks,
      including one this database served before, and records each as a new
      ledger row with the package it replaced as its predecessor. Applying the
      package that is already active, with no schema version pending, under
      the runtime role and role mode the ledger recorded, is refused with
      nothing needs applying and writes no row.
    alsoTrue: >-
      Applying an earlier package advances the policy revision, and the
      ledger records the choice in order rather than rewriting history. The
      refusal of the active package carries an exit code that lets a
      pipeline tell a no-op from an activation. When a schema version is
      pending, as after an upgrade, the active package applies, because the
      apply is what migrates and adopts. When the runtime role was rotated
      or its role mode changed, it applies, because the apply is what issues
      the grants.
    evidence:
      - {path: crates/registry-schedulingctl/tests/activation_postgres.rs, name: apply_records_one_row_per_activation_and_a_previous_package_is_a_new_row, features: [postgres-test]}
      - {path: crates/registry-schedulingctl/tests/activation_postgres.rs, name: apply_refuses_the_active_package_and_a_foreign_database_without_writing, features: [postgres-test]}
      - {path: crates/registry-schedulingctl/tests/activation_postgres.rs, name: rotating_the_runtime_role_reapplies_the_active_package, features: [postgres-test]}
  - id: SCHEDULING-DEC-10
    subject: The runtime role keeps write access to the product tables
    decision: >-
      In split role mode apply revokes the runtime role's writes only on the
      activation ledger and the schema history. The runtime keeps SELECT,
      INSERT, UPDATE, and DELETE on every other Scheduling table, including
      the policy revisions and scheduling_meta.
    alsoTrue: >-
      The runtime writes claims, receipts, outbox rows, and delivery state
      on every request. Startup refuses whatever the ledger does not name,
      so a runtime that rewrote a policy row still cannot make a restart
      serve a package no operator applied.
    residual: >-
      A compromised runtime credential can still corrupt product data it
      serves from; the ledger and the audit stream are where that is
      detected, not prevented.
    evidence:
      - {path: crates/registry-schedulingctl/tests/activation_postgres.rs, name: split_roles_deny_the_runtime_a_ledger_write_and_the_service_still_serves, features: [postgres-test]}
  - id: SCHEDULING-DEC-11
    subject: Clear terminal claim owners without deleting the ledger
    decision: >-
      claimOwnerRetentionDays bounds the raw issuer and subject from 1 through
      365 days after the earliest applicable terminal instant, with a placeholder
      default of seven days. Keep a per-claim digest and erasure time, never
      authority. Keep the claim, its history, and audit unchanged.
    alsoTrue: >-
      Live ownership survives audit-key rotation. Receipt observation and
      replay check the current owner, so a longer receipt window cannot
      bypass erasure. Mutation reads are locked against erasure.
    residual: >-
      A digest permits candidate matching, and existing keyed actor pseudonyms
      remain under the separate history and audit retention contracts.
    evidence:
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: claim_owner_retention_clears_only_elapsed_claims_and_preserves_the_ledger}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_cleared_claim_owner_cannot_read_list_or_observe_a_retained_receipt}
      - {path: crates/registry-scheduling/tests/postgres_commitments.rs, name: a_mutation_waiting_on_owner_erasure_rechecks_ownership_before_writing}
