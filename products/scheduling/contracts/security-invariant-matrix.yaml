apiVersion: registry.registrystack.org/product-contract/v1
product: scheduling
scope: mvp
evidenceStatus: source-mapped-not-executed
evidenceNote: >-
  Test references identify maintained proof obligations. This file does not
  assert that any test ran or passed in a particular review. Rows whose named
  test lives in a PostgreSQL suite are proven only when that suite runs against
  a disposable database under the postgres-test feature.
reviewRule: >-
  This matrix is the baseline every later Scheduling change is reviewed
  against. A change that weakens a row rewrites the row in the same commit and
  says why. A row may not lose its negative test, and a deferred entry may not
  be quietly promoted to an enforced row without the test that earns it.
invariants:
  - id: SCHEDULING-SEC-01
    state: enforced
    threat: >-
      Two callers competing for the last unit both commit, or a hold and a
      direct booking consume the same member, so the deployment oversells
      capacity it cannot serve.
    enforcementPoint: >-
      One PostgreSQL capacity transaction per commitment that reads the ledger
      snapshot, evaluates admission against it, and writes the claim before it
      commits.
    refusal: >-
      Commit exactly one winner and refuse every competing claim with
      capacity.exhausted; never write a partial claim.
    negativeTest:
      path: crates/registry-scheduling-core/src/admission.rs
      name: the_second_caller_against_the_last_unit_is_refused
  - id: SCHEDULING-SEC-02
    state: enforced
    threat: >-
      Capacity is committed over supply no operator anchored, so the runtime
      books a pool or window that does not exist in this deployment.
    enforcementPoint: >-
      Offering anchors resolved from runtime records inside the capacity
      transaction, not from the authored policy alone.
    refusal: >-
      Refuse the commitment loudly rather than inventing supply, and name the
      unanchored reference in the operator's diagnostics, never to the caller.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: an_arrival_offering_without_its_window_record_is_an_operator_gap
  - id: SCHEDULING-SEC-03
    state: enforced
    threat: >-
      A deferred task grant already inactive or mismatched at the fresh status
      observation commits capacity, or a request that waited on a lock commits
      after its access token or grant expired.
    enforcementPoint: >-
      The runtime file must state taskGrantStatus, and startup refuses a file
      that omits it or lists no authority. When it lists authorities,
      require_current_task_grant obtains a fresh exact status before every
      capacity transaction and receipt replay, without holding a database
      lock, and refuses a grant from an unlisted source rather than falling
      back to the offline path. The unchecked-final-fifteen-minutes keyword
      admits only grants with at most 900 seconds remaining. The transaction
      re-checks the earlier of the verified access-token and grant
      deadlines after every lock wait and immediately before commit. Status is
      an observation, not a distributed transaction: withdrawal after a
      positive answer can race the local commit until that earlier deadline.
    refusal: >-
      Answer operation.not-authorized for an inactive, mismatched, unlisted, or
      incompletely bound grant and leave no claim behind. Answer
      service.unavailable and leave no claim behind when the authority or
      service credential is unavailable or its response is unusable. A
      deadline refusal rolls back every capacity write.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: configured_task_status_is_fresh_for_a_capacity_commit_and_its_replay
  - id: SCHEDULING-SEC-04
    state: enforced
    threat: >-
      A catalogue read scope, an explain scope, or a partially formed grant
      reaches a commitment route and books capacity.
    enforcementPoint: >-
      Three disjoint authority profiles in auth.rs: a read scope, a separately
      configured explain scope that is never the read scope, and a complete
      task grant bound to the verified client and this deployment's audience.
    refusal: >-
      Refuse an incomplete grant set as a credentials problem and never honour
      it partially; refuse a grant naming another resource as a profile
      refusal.
    negativeTest:
      path: crates/registry-scheduling/src/auth.rs
      name: a_partial_grant_is_refused_as_invalid_claims
  - id: SCHEDULING-SEC-05
    state: enforced
    threat: >-
      A grant for a neighbouring service, location, or action covers this
      offering because the match widens.
    enforcementPoint: >-
      require_permission in service.rs, matching one permission whose service
      and location both equal the offering's own and whose action list contains
      the requested action, followed by bound_window requiring the operator
      record to name that same offering and location before any window capacity
      is exposed or consumed.
    refusal: >-
      Answer operation.not-authorized when the grant does not match, or fail
      closed as service.unavailable when the operator record is misbound. A
      broader service or location never covers a narrower one and no action is
      inferred from another.
    negativeTest:
      path: crates/registry-scheduling/src/auth.rs
      name: a_grant_naming_another_resource_is_a_profile_refusal
  - id: SCHEDULING-SEC-06
    state: enforced
    threat: >-
      A grant minted for one product is spent on another because the grant
      union leaks across product boundaries.
    enforcementPoint: >-
      The closed GrantBounds tagged union in registry-platform-oidc, with
      deny_unknown_fields, pinned value and cardinality bounds, and a redacting
      Debug.
    refusal: >-
      Parse a foreign grant as a grant that carries no permission for this
      product and refuse it before any authorization decision or store access.
    negativeTest:
      path: crates/registry-breg/src/task_grant/tests.rs
      name: a_scheduling_grant_is_refused_by_the_breg_binding
      features: [runtime]
  - id: SCHEDULING-SEC-07
    state: enforced
    threat: >-
      A public availability or refusal answer names the member, the resource,
      or the neighbouring booking that caused it, letting a caller enumerate
      supply or other people's appointments.
    enforcementPoint: >-
      problem_of projecting every admission refusal through public_code, and a
      separately authorized explain path for the member-level cause.
    refusal: >-
      Answer the public code for the same state and name no member; keep the
      detailed code behind the explain scope.
    negativeTest:
      path: crates/registry-scheduling/src/service.rs
      name: the_detailed_code_stays_behind_the_explain_path
  - id: SCHEDULING-SEC-08
    state: enforced
    threat: >-
      One caller reads or pages another caller's appointment, history, or
      listing by guessing an identifier or replaying a cursor.
    enforcementPoint: >-
      owned_booking on the appointment read and history paths; verified owner
      predicates on filtered appointment listings; and cursors that are opaque
      version 4 UUIDs bound to their listing context, owner, and exact filter
      and expiring
      fifteen minutes out, with ownership re-checked before a cursor is
      honoured.
    refusal: >-
      Answer the same value-free absence for a foreign record as for a missing
      one, and refuse a cursor presented against a different context.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: external_references_survive_the_lifecycle_and_filter_only_owned_appointments
  - id: SCHEDULING-SEC-09
    state: enforced
    threat: >-
      A retried commitment books twice, or a replayed key under a different
      body commits a second decision under the first one's answer.
    enforcementPoint: >-
      A caller-chosen Idempotency-Key bounded to 128 graphical bytes on the
      four caller-driven commitments, hashed with the canonical request, and
      the hold's own identifier as the key for a release.
    refusal: >-
      Replay the stored first answer for the same key and body, refuse the same
      key under a different body with idempotency.key-reused, and answer the
      expired code once the receipt has been tombstoned.
    negativeTest:
      path: crates/registry-scheduling/src/http.rs
      name: the_idempotency_key_is_present_bounded_and_graphical
  - id: SCHEDULING-SEC-10
    state: enforced
    threat: >-
      A caller commits against a policy, published window, or appointment that
      changed under it, so the booking rests on supply or terms the operator
      has withdrawn.
    enforcementPoint: >-
      The policy revision the request names, the published-window revision for
      arrival commitments, and the observed appointment revision carried in
      the request body. Records replacement requires changed window terms to
      advance that public revision, and the request revisions are fenced inside
      the capacity transaction after the supply anchor is locked and before the
      claim is written.
    refusal: >-
      Refuse a stale policy revision with policy.changed ahead of any narrower
      mismatch, and refuse a stale window or appointment revision with
      revision.mismatch.
    scopeNote: >-
      Cancellation is deliberately outside this row: it releases capacity and
      is guarded by the observed appointment revision and the cutoff, never by
      the policy revision, so an appointment stays cancellable under whatever
      policy currently governs its offering. See recorded-decisions.yaml,
      SCHEDULING-DEC-02.
    negativeTest:
      path: crates/registry-scheduling-core/src/admission.rs
      name: policy_change_outranks_a_window_revision_mismatch
  - id: SCHEDULING-SEC-11
    state: enforced
    threat: >-
      An expired hold keeps consuming capacity, or is confirmed into an
      appointment after its window has passed.
    enforcementPoint: >-
      Hold lifetime evaluated in the ledger, never against a sweeper having
      already run. Capacity snapshots use the commitment's clock; confirmation
      re-checks expiry against a fresh clock observation after it locks the
      supply anchor, before transferring the reservation into an appointment.
    refusal: >-
      Count an expired hold as consuming nothing and refuse its confirmation;
      the sweeper is housekeeping, not the authority on expiry.
    negativeTest:
      path: crates/registry-scheduling-core/src/admission.rs
      name: an_expired_hold_consumes_nothing_and_cannot_be_confirmed
  - id: SCHEDULING-SEC-12
    state: enforced
    threat: >-
      Credentials or refusal details cross a public plaintext edge, a browser
      cache, or an unbounded framework response.
    enforcementPoint: >-
      A listener that must be private or an explicitly declared container
      network, mandatory TLS termination, a 1 MiB body ceiling, security
      headers without CORS, Cache-Control no-store on every answer, and one
      problem rendering path that stamps the caller's trace.
    refusal: >-
      Refuse to start on a public listener, and normalize every framework
      rejection into a closed problem rather than a framework error page.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: listener_requires_a_private_address_or_explicit_container_network
  - id: SCHEDULING-SEC-13
    state: enforced
    threat: >-
      A submitted value, a secret, or a grant's contents is echoed back into a
      problem document, a log line, a trace, or a configuration error.
    enforcementPoint: >-
      A closed problem vocabulary whose detail is fixed per code, value-free
      Display implementations, a redacting Debug on the grant bounds, and a
      configuration parse path that names the field without the value.
    refusal: >-
      Emit the closed category and nothing else; no field of a problem document
      repeats a submitted value.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: typed_parse_path_does_not_echo_the_rejected_value
  - id: SCHEDULING-SEC-14
    state: enforced
    threat: >-
      A commitment decision leaves no accountable record, so a booking or a
      refusal cannot be attributed afterwards, and grant-scope enumeration
      against the edge passes unseen.
    enforcementPoint: >-
      An authorization record built with a pseudonymized principal and written
      through the platform audit writer under registry-scheduling-audit/v1. A
      commitment's request entry is accepted before the capacity transaction
      opens, and its response entry, stamped with the request's correlation as
      its identity exactly once, is written after the transaction commits for
      the allowed case and after it rolls back for every commitment it
      refuses. A permission mismatch the service refuses before that
      transaction opens is one response entry. A refused commitment is one
      the ledger decided: an admission refusal, the hold ceiling, a lapsed
      grant, a stale observed revision, or a cancellation past its cutoff.
      Every request entry is answered. A commitment nothing decided, because
      its transaction rolled back on a failure, the environment records were
      replaced under it, or its idempotency key was refused as reused or
      expired, writes one response entry with the outcome unfinished and a
      closed reason, and never an authorization verdict. A capacity commit
      that is not acknowledged is read back by its transaction identifier on
      a separate connection that mutates nothing: one that took effect is
      answered and recorded as committed, one that rolled back is recorded
      commitment.failed, and one whose status cannot be read is recorded
      commitment.unfinished, never failed. One that returns or is canceled
      before it answers writes the commitment.unfinished response when its
      request handle is dropped. The match that selects between them is exhaustive,
      so a new outcome states its side. A replayed receipt, including one a
      concurrent identical request won, is answered only after its own
      response entry is accepted, and that entry records the
      decision the receipt carries: allowed for a success, denied with the
      original reason for a refusal.
    refusal: >-
      Record authorization.allowed or authorization.refused as an audit reason,
      never as a problem code, and never carry the caller's raw identifier. A
      refused request entry opens no transaction, and a refused response entry
      for a committed commitment, a replayed receipt, a refusal, or a
      commitment nothing decided answers service.unavailable without releasing
      the receipt, so no answer leaves without its audit.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: a_replayed_receipt_is_released_only_after_its_response_entry_is_accepted
  - id: SCHEDULING-SEC-15
    state: enforced
    threat: >-
      An unverified, drifted, or failing policy package is served, so the
      deployment answers under terms nobody reviewed.
    enforcementPoint: >-
      Startup verification of the shared package against its SHA256SUMS in
      every listener mode, and the authoring checks re-run before the policy
      reaches the runtime.
    refusal: >-
      Refuse to start rather than serve an unverified package or a policy that
      carries findings.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: every_listener_mode_verifies_the_package_without_a_pin
  - id: SCHEDULING-SEC-16
    state: enforced
    threat: >-
      An operator-pinned JWKS selects unintended verification material because
      two keys share a name or a symmetric key slips in.
    enforcementPoint: >-
      Static JWKS validation before the verifier is constructed.
    refusal: >-
      Refuse the document unless every key is asymmetric and uniquely named.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: static_jwks_requires_unique_named_asymmetric_keys
  - id: SCHEDULING-SEC-17
    state: enforced
    threat: >-
      A caller supplies a field the wire contract does not declare, such as the
      reschedule exclusion the store owns, and changes how the request is
      evaluated.
    enforcementPoint: >-
      Strict request parsing across the core's ledger and request shapes, with
      unknown fields refused rather than ignored.
    refusal: >-
      Refuse the request as malformed; the exclusion is supplied by the store
      from inside the reschedule transaction and never by the caller.
    negativeTest:
      path: crates/registry-scheduling-core/src/model.rs
      name: an_admission_request_refuses_a_caller_supplied_exclusion
  - id: SCHEDULING-SEC-18
    state: enforced
    threat: >-
      A scheduling crate reaches a Base Registry Engine, Casework, or Evidence
      crate, or one of those products reaches a scheduling crate, and the
      capacity ledger acquires a second writer or a foreign protocol type.
    enforcementPoint: >-
      The dependency-direction gate over the Cargo metadata forward closure of
      every scheduling crate, in both directions.
    refusal: >-
      Fail the product check on a direct or transitive forbidden dependency.
    negativeTest:
      path: products/scheduling/scripts/test_dependency_direction.py
      name: test_product_dependency_on_scheduling_is_rejected
  - id: SCHEDULING-SEC-19
    state: enforced
    threat: >-
      Caller strings stored verbatim in the ledger entry, the idempotency
      receipt, and the audit entries are bounded only by the body ceiling, and
      an unbounded duplicate key can be varied at will to slip the duplicate
      guard.
    enforcementPoint: >-
      Edge bounds at the authoring grammar's own identifier, reference,
      collection, and idempotency-key limits, plus a cancellation reason
      bounded to the column that stores it.
    refusal: >-
      Answer request.invalid at the edge rather than passing the value to a
      database CHECK that surfaces as a service problem on the caller's own
      request.
    negativeTest:
      path: crates/registry-scheduling/src/http.rs
      name: an_admission_request_is_bounded_before_it_reaches_the_store
  - id: SCHEDULING-SEC-20
    state: enforced
    threat: >-
      The accepted token type set admits a plain JWT, so an identity token, or
      any other JWT the same issuer signs, satisfies the access-token profile
      and reaches a scheduling operation.
    enforcementPoint: >-
      The access-token profile built at configuration time, which admits the
      RFC 9068 media type and its case variants only. No configuration key
      widens it.
    refusal: >-
      Refuse the credential; a token that is not an access token never reaches
      authorization.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: the_access_token_profile_admits_only_the_rfc_9068_pair
  - id: SCHEDULING-SEC-21
    state: enforced
    threat: >-
      A deployment that names no clients admits every client the issuer
      verifies, so any application in the issuer's realm reaches the
      scheduling edge with a token the issuer minted for something else, and
      a development file copied toward production keeps doing so.
    enforcementPoint: >-
      Configuration validation at startup, which requires a named client list
      in every mode, development loopback included.
    refusal: >-
      Refuse to start rather than serve a deployment that admits an unnamed
      client.
    negativeTest:
      path: crates/registry-scheduling/src/config.rs
      name: every_deployment_must_name_the_clients_it_admits
  - id: SCHEDULING-SEC-22
    state: enforced
    threat: >-
      A credential exchanged from a third-party assertion is accepted on the
      strength of the issuer the token itself names, so any authority the
      identity provider will exchange from reaches the deployment.
    enforcementPoint: >-
      A declared assertion-issuer map binding each accepted authority to the
      client that may exchange from it, matched when the exchanged credential
      is authenticated, and bounded in the runtime schema.
    refusal: >-
      Refuse the credential until its authority is declared; an undeclared
      authority is a credentials problem, never a silent acceptance.
    negativeTest:
      path: crates/registry-scheduling/src/auth.rs
      name: an_exchanged_token_is_refused_until_its_authority_is_declared
  - id: SCHEDULING-SEC-23
    state: enforced
    threat: >-
      A clock the runtime cannot read yields a timestamp against which every
      grant compares as unexpired, so an expired credential commits.
    enforcementPoint: >-
      The expiry comparison in the authenticator, which propagates a clock
      failure rather than substituting a default instant.
    refusal: >-
      Refuse the request as an authentication failure; an unreadable clock
      never judges an expiry as passed.
    negativeTest:
      path: crates/registry-scheduling/src/auth.rs
      name: an_unreadable_clock_refuses_to_judge_an_expiry_rather_than_passing_it
  - id: SCHEDULING-SEC-24
    state: enforced
    threat: >-
      An appointment observer gains mutation authority, receives caller or
      capacity secrets, or observes an event not durably bound to the state
      change it describes.
    enforcementPoint: >-
      A closed policy compiler admitting only after-phase URL handlers for
      four appointment event triggers, with the url-only hook capability
      set re-checked when the runtime compiles the declarations; product-owned projections that
      cannot name actor, credential, capacity, duplicate-key, or cancellation
      reason fields; outbox capture in the appointment transaction; an
      attempt audit entry accepted before egress; and a delivery seam that
      refuses every proposal. Terminal metadata cleanup preserves active and
      uncertain work, requires completed expiry before dead-letter pruning,
      and deletes dependent metadata before unreferenced shared events in
      one bounded transaction. Audit entries remain under their own retention.
    refusal: >-
      Refuse unsupported declarations before startup, fail the appointment
      transaction if its matching event cannot be captured, and record a
      value-free proposal refusal without applying receiver output.
    negativeTest:
      path: crates/registry-scheduling/src/hooks.rs
      name: projections_disclose_only_the_requested_closed_fields
  - id: SCHEDULING-SEC-25
    state: enforced
    threat: >-
      An operator records replacement drops, moves, or reduces a published window
      below the bookings and live holds that already consume it.
    enforcementPoint: >-
      Records replacement locks every existing supply anchor, loads the current
      window records and standing window ledger, and assesses the proposal
      before atomically advancing the durable facts revision.
    refusal: >-
      Refuse replacement with an operator-facing deficit and leave all records
      and their revision unchanged.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: records_replacement_refuses_to_move_a_window_with_standing_commitments
  - id: SCHEDULING-SEC-26
    state: enforced
    threat: >-
      A deployment ends up holding a policy and window records that contradict
      each other, most consequentially a pool that staffs a published window
      while also backing an exact-time offering. The two modes anchor on
      different supply rows, so their capacity transactions never serialize
      and the ledger cannot observe that it sold the same staffing twice.
    enforcementPoint: >-
      Both database writes re-run the canonical combined check under the locks
      they already hold: policy publication loads the deployed window records
      before it writes a revision, and records replacement loads the deployed
      policy document before it swaps the records. The two findings that name
      an absence rather than a contradiction, a window not published yet and
      an offering this publication retires, are excluded so that ordinary
      operator sequencing in either order stays possible.
    refusal: >-
      Refuse the write, naming every contradicting field in the same authoring
      vocabulary the offline check uses, and leave the policy revision, the
      window records, and the facts revision unchanged.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: records_replacement_refuses_a_window_staffed_by_an_exact_time_pool
  - id: SCHEDULING-SEC-27
    state: enforced
    threat: >-
      A resource pool and a published window take the same supply identifier.
      Both anchor their capacity transactions on the one row keyed by it, and
      the two namespaces are authored separately, so nothing else makes them
      disjoint. The pool then serializes against a window's anchor, and the
      next records replacement deletes it, leaving every commitment against
      that pool refused until the policy is republished.
    enforcementPoint: >-
      The authoring checks refuse the collision on both sides, against the
      policy alone and against the policy with the window records it governs,
      so packaging reports it as well. The two anchor writes then share one
      insert that returns the kind it settled on, which makes a standing row
      of the other kind a named refusal rather than a primary key abort on one
      path and a silently skipped anchor on the other.
    refusal: >-
      Refuse the write, naming the identifier and the kind of supply that
      already holds it, and leave the standing anchor and its kind unchanged.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: a_supply_identifier_may_not_anchor_both_a_pool_and_a_window
  - id: SCHEDULING-SEC-28
    state: enforced
    threat: >-
      A caller probes release_hold or confirm_appointment with an id it
      chose. An id that names no claim at all, one whose claim is not a
      hold, and a hold that exists but that the caller's grant does not
      reach are three different facts about the store. If the first two
      were refused before authorization ran, while the third waited for
      require_permission and then answered with the same code a denied
      grant already uses elsewhere, an unauthorized caller could read the
      pre-authorization refusal as an oracle over which ids are live holds.
    enforcementPoint: >-
      release_hold and confirm_appointment resolve the claim through a
      shared hold lookup before they name an offering or call
      require_permission. That lookup answers None alike for an id that
      resolves no claim and one whose claim is not a hold, and both
      handlers turn that None into the same operation.not-authorized
      problem require_permission already returns for a hold outside the
      caller's grant. Whether an existing hold has already been released or
      expired stays a decision the store makes deeper in the same
      transaction, where it is authorized and auditable rather than
      exposed ahead of permission.
    refusal: >-
      Refuse the request with operation.not-authorized (403) for an
      unknown id, a non-hold id, and a hold outside the caller's grant
      alike, and take no store action for any of the three.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: release_hold_refuses_indistinguishably_for_missing_and_unauthorized_holds
  - id: SCHEDULING-SEC-29
    state: enforced
    threat: >-
      A package reaches the serving runtime without an operator's recorded
      activation: a package swapped under package.root, a configuration
      pointed at another database, or a startup that adopts the database and
      publishes the policy on its own, so the deployment answers under terms
      nobody applied and no record says who applied them.
    enforcementPoint: >-
      scheduling serve reads the activation ledger with the runtime
      credential before it binds the listener, compares the ledger's
      identity.databaseId and active package digest with the verified
      package, and writes no activation state. package.expectedDigest still
      pins the package at package.root. serve is the runtime's only command.
    refusal: >-
      Refuse to start when the ledger holds no row, names another package, or
      belongs to another identity.databaseId, and refuse records apply when
      another package is active, naming schedulingctl plan
      --runtime-config FILE then schedulingctl apply --runtime-config FILE;
      refuse a pin mismatch naming package.expectedDigest; exit 2 as a usage
      error for any command other than serve.
    negativeTest:
      path: crates/registry-schedulingctl/tests/activation_postgres.rs
      name: startup_refuses_a_database_the_ledger_does_not_name_for_this_package
  - id: SCHEDULING-SEC-30
    state: partial
    threat: >-
      The service credential rewrites the activation ledger or the schema
      history, so a compromised runtime can name itself a package no operator
      applied or erase the record of one that was.
    enforcementPoint: >-
      schedulingctl apply compares current_user on the runtime and migration
      connections. When they differ it grants the runtime role its schema,
      table, sequence, and function access, then revokes INSERT, UPDATE,
      DELETE, and TRUNCATE on scheduling_activations and
      scheduling_schema_migrations, in the activation transaction. It never
      grants or revokes TRIGGER; before any migration it refuses a default
      privilege of the migration role that grants the runtime role TRIGGER
      on the tables it creates. The row
      records the runtime role and the role mode it holds after the grants,
      read from its table and column privileges on the ledger and the
      schema history, ownership,
      membership in the migration role (inherited or only permitting SET
      ROLE), and superuser or BYPASSRLS
      attributes. A runtime role that owns or is a member of an owner of the
      schema or any scheduling_* relation or function, holds TRIGGER on a
      scheduling_* relation, or holds CREATE on the schema, holds single
      mode, and so does any runtime role other than the ledger owner while a
      non-internal trigger is attached to a scheduling_* table, which no
      Scheduling migration creates. scheduling serve compares that recorded
      mode with the one its credential holds, and in split mode checks that
      the runtime role still holds every grant apply issues.
    refusal: >-
      PostgreSQL refuses every runtime-role write to the ledger and the
      schema history with insufficient_privilege, while the service still
      starts and serves. Startup refuses a ledger that recorded split mode
      for a credential that can now write it, naming schedulingctl apply
      --runtime-config FILE to reissue the grants, and a split runtime role
      missing a grant apply issues, naming the same command. In configured
      split mode, plan, apply, and startup refuse a runtime role whose
      ownership, TRIGGER privilege, or schema CREATE privilege weakens the
      split, or an attached trigger on a scheduling_* table, naming REASSIGN
      OWNED BY then schedulingctl apply, or REVOKE TRIGGER, REVOKE CREATE ON
      SCHEMA (from the grantee it is held through, PUBLIC included), or DROP
      TRIGGER then a rerun of the refused command. Split-mode apply refuses a
      TRIGGER default privilege naming ALTER DEFAULT PRIVILEGES FOR ROLE
      <migrator> REVOKE TRIGGER ON TABLES FROM <grantee> then a rerun. Plan
      refuses a runtime role that cannot read the ledger it would compare,
      without USAGE on its schema or SELECT on scheduling_activations or
      scheduling_schema_migrations, as
      schedulingctl.activation.ledger-unreadable naming schedulingctl apply
      --runtime-config FILE then plan again, rather than read the database
      as empty.
    partialNote: >-
      In single role mode both credentials are one role that can write the
      ledger; plan, apply, and status report the mode and do not refuse it,
      and a runtime role holding the migration role's authority is recorded
      as single.
      In split mode the runtime role keeps ordinary write access to the
      product tables it serves from (SCHEDULING-DEC-10).
    negativeTest:
      path: crates/registry-schedulingctl/tests/activation_postgres.rs
      name: split_roles_deny_the_runtime_a_ledger_write_and_the_service_still_serves
  - id: SCHEDULING-SEC-31
    state: enforced
    threat: >-
      Two deployments pointed at one database by mistake activate over each
      other, or two concurrent applies interleave their schema, adoption, and
      publication writes, so the ledger names a package whose state was only
      partly written.
    enforcementPoint: >-
      schedulingctl apply runs its whole activation in one transaction under
      pg_advisory_xact_lock on the migration key, and compares the ledger's
      recorded identity.databaseId with the configuration's before any
      statement changes the database; records apply makes the same identity
      and active-package check inside its swap, after it holds every supply
      anchor and the meta row an apply takes before recording its row.
    refusal: >-
      Refuse an apply or records apply under another identity.databaseId,
      naming only the key and leaving the ledger, schema, and policy
      unchanged; a second apply waits for the lock and then runs against the
      state the first committed. An apply takes every supply anchor and the
      meta row before it migrates or records its activation, so no migration
      lock is held while it waits on a capacity transaction and it never
      publishes a package over one.
    negativeTest:
      path: crates/registry-schedulingctl/tests/activation_postgres.rs
      name: apply_refuses_the_active_package_and_a_foreign_database_without_writing
  - id: SCHEDULING-SEC-32
    state: enforced
    threat: >-
      A package is activated with no accountability record, or the record
      names the operator's change reference in the clear, so an activation
      cannot be attributed, or its attribution leaks an operator identifier
      into the audit stream and the database.
    enforcementPoint: >-
      schedulingctl apply writes a scheduling-activation-audit/v1 request
      entry to the schedulingctl audit destination before it opens the
      activation transaction and a response entry with the outcome after it
      commits or refuses. --operator-reference is stored and audited only as
      a keyed hash under audit.hashKeyRef, scoped by the activation id.
    refusal: >-
      Apply nothing when the audit destination cannot be opened or the
      request entry is refused; record a refused or failed activation as a
      response entry with its closed reason, and one whose commit was not
      acknowledged and could not be read back as unfinished with
      schedulingctl.activation.unacknowledged; report a response entry refused
      after the commit as schedulingctl.activation.applied-unaudited, exit 3,
      naming schedulingctl status --runtime-config FILE.
    negativeTest:
      path: crates/registry-schedulingctl/tests/activation_postgres.rs
      name: apply_refuses_to_activate_without_its_audit_destination
  - id: SCHEDULING-SEC-33
    state: enforced
    threat: >-
      A spent idempotency key keeps the verified issuer, subject, and raw key
      in the database for as long as the row exists, so the identifier a
      caller presented outlives the receipt it was retained for; or clearing
      them frees the key, so a retry after the horizon books a second time.
    enforcementPoint: >-
      An attempt is identified and kept unique by a SHA-256 key reference over
      a domain separator and the length-prefixed issuer, subject, command
      scope, and key. The retention sweep that erases a receipt clears the
      raw issuer, subject, and key in the same statement, and a check
      constraint holds all three present exactly while the receipt is.
    refusal: >-
      Answer the same caller's exact retry after the horizon with
      idempotency.expired and a changed retry with idempotency.key-reused,
      treat another caller's identical key as fresh, leave a row inside its
      horizon untouched, and refuse any write that keeps a raw caller on an
      erased row or clears one from a live row.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: a_spent_key_forgets_its_raw_caller_after_the_receipt_horizon_and_stays_spent
  - id: SCHEDULING-SEC-34
    state: enforced
    threat: >-
      Claim ownership keyed on the audit pseudonym detaches every hold and
      appointment from its booker when the audit hash key rotates, so an
      orchestrator reads an empty page as no booking and books again, and the
      per-caller hold ceiling stops counting holds the caller already has; or
      the owner leaks into a receipt, outbox payload, or observer projection;
      or a terminal claim retains its raw owner indefinitely or discloses
      data through a retained receipt after owner erasure.
    enforcementPoint: >-
      Original receipt observation matches the verified issuer and subject,
      original operation key and canonical request hash, reads only retained
      successful receipts, and never replays a capacity command.
      The receipt route authenticates before media-type checks and JSON
      decoding, under the router's existing request-body ceiling.
      A claim stores the verified issuer and subject that booked it under a
      check constraint holding both present and non-empty or both absent.
      ClaimRow::is_owned_by, owned_booking, the external reference listing,
      the hold-ceiling lock and count, and the listing cursor context all
      decide on that pair; the pseudonym decides nothing. The owner is never
      serialized. A separate bounded claimOwnerRetentionDays window atomically
      clears the raw pair after the terminal instant, keeping an inert digest.
      Receipt observation and successful replay check current ownership;
      mutation reads lock the claim before deciding ownership.
    refusal: >-
      Keep the booker's listing, cursor, read, reschedule, cancel, release,
      and hold ceiling across a rotation; answer another principal with an
      empty page, cursor.invalid, and operation.not-authorized; own no claim
      without a stored owner pair; refuse a partial or empty owner or raw
      restoration on a tombstone; and refuse reads, listings, receipt observation,
      and mutations after owner erasure while preserving history and live holds.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: rotating_the_audit_key_keeps_existing_claims_with_their_owner
  - id: SCHEDULING-SEC-35
    state: enforced
    threat: >-
      A booking ignores a resource absence during setup or cleanup, or a live
      hold confirms after its resource becomes physically unavailable.
    enforcementPoint: >-
      Availability and admission share the complete occupied-interval supply
      predicate. Facts replacement validates bounded dated intervals and
      advances the facts revision while holding supply anchors. Exact-time
      confirmation rechecks current member capabilities, static and dated
      availability, and required opening coverage without reallocating the
      held capacity or re-running new-request grid and lead-time rules.
    refusal: >-
      Refuse new commitments and affected hold confirmation. Preserve existing
      claims for authorized remediation and expose only a bounded current
      operator impact result for dated and static resource unavailability,
      removed resources and stock below simultaneous physical commitments.
      Impacts include secondary allocations and each window's resource
      reservation once, without treating window units or individual window
      bookings as physical resources.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/resource_availability.rs
      name: dated_resource_supply_persists_blocks_new_capacity_and_reports_existing_bookings
  - id: SCHEDULING-SEC-36
    state: enforced
    threat: >-
      An assisted booking confuses the submitting actor with its manager,
      accepts a caller-supplied manager identifier, or treats party metadata
      or a broad read scope as management authority.
    enforcementPoint: >-
      The explicit selector names only identity.schedulingManager in verified
      signed claims. Creation requires its exact create-for action. Every
      assisted operation binds the retained source issuer and manager, exact
      service/location permission and fresh online grant status. Detail-only
      authority opens no catalogue, list, history or operational route.
      Original command recovery remains actor-bound and requires retained
      claim ownership; erasure closes both management and success replay.
    refusal: >-
      Refuse missing, mismatched, offline or expired manager authority and
      refuse source-manager changes through rescheduling. Typed beneficiary
      and organization references grant no authority. Source issuers must
      guarantee stable manager identifiers that are never reassigned.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/booking_party.rs
      name: an_assisted_manager_is_selected_only_from_fresh_exact_source_authority
  - id: SCHEDULING-SEC-37
    state: enforced
    threat: >-
      A staff work list expands from one authorized resource or historical
      service to another, combines unrelated role scopes, or discloses
      identities and fields the selected operational role did not permit.
    enforcementPoint: >-
      One explicitly configured profile bounds each verified caller's
      service, location, resources, time span and projection. Its continuation
      binds the caller, profile and normalized query. Retained scope labels
      follow the recorded policy revision, and the claim ledger refuses a
      claim without them.
    refusal: >-
      Refuse unselected or missing role authority and altered continuations.
      Omit unpermitted projections and unknown historical party counts; never
      derive people counts from capacity units. Catalogue and task authority
      confer no operational work-list access.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/operational_reads.rs
      name: operational_pages_require_one_profile_and_bind_every_authority_dimension
  - id: SCHEDULING-SEC-38
    state: enforced
    threat: >-
      A signed reminder is accepted under a different request target or loses
      its event identity on retry, causing forged or duplicate downstream work.
      A purpose override sends shared delivery credentials to another origin.
    enforcementPoint: >-
      When reminder HMAC is configured, the shared delivery signature binds
      method, target, content type, event metadata and canonical body. The
      closed purpose routing selects one same-origin fixed request template
      before rendering and signing, with the configured URL as fallback. The
      event identity and dispatch idempotency key remain stable while attempt
      number and canonical RFC 3339 signature time advance. Bearer authentication
      is independent.
    refusal: >-
      Refuse unsupported key providers, undersized keys, unknown purposes,
      cross-origin overrides and URLs outside the existing destination rules. A downstream
      event receiver verifies its exact configured source and signature;
      accepting an event never grants authority for a capacity mutation.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments.rs
      name: a_signed_reminder_uses_the_shared_event_delivery_contract
  - id: SCHEDULING-SEC-39
    state: enforced
    threat: >-
      A multi-resource booking commits only part of its requested capacity,
      a failed move releases the original allocation, or a work-list role
      learns a secondary resource outside its projection authority.
    enforcementPoint: >-
      One capacity transaction evaluates and commits the complete allocation
      bundle under ordered supply locks. Operational reads use one revision
      snapshot and attenuate each allocation under the selected profile. Occupied
      interval membership and pagination order use only selected authorized resources.
      Split activation and startup require the exact migration-owned allocation and
      attendance writer functions and unconditional triggers for the applied schema.
    refusal: >-
      Refuse the whole request if any required allocation cannot fit. Preserve
      every original allocation after a failed move and omit resource identity
      that the operational profile does not permit.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/atomic_allocations.rs
      name: failed_bundle_reschedule_keeps_every_prior_allocation
  - id: SCHEDULING-SEC-40
    state: enforced
    threat: >-
      A busy-time importer changes another source's facts, applies a stale
      snapshot, discloses external calendar content, or silently restores
      capacity when required coverage becomes unavailable.
    enforcementPoint: >-
      One configured import profile binds source and resource scope, and a
      caller reaches a profile only by holding its write scope. Profiles that
      share a write scope are not isolated from one another; per-source
      isolation requires a distinct scope for each profile. Bounded
      closed requests, coverage containment, source revision CAS and canonical
      replay digest control reconciliation. New revisions require strictly increasing
      source-global observation times. Exact replay uses the original stored bounded
      outcome, including its original impact summary. Capacity requires fresh coverage
      for every source configured as mandatory.
    refusal: >-
      Refuse a profile whose write scope the caller does not hold, resources
      outside the selected profile, inconsistent coverage and stale differing
      writes.
      Retain known busy intervals during source outages; block new capacity
      outside fresh required coverage without cancelling existing commitments.
      Return only the profile's minimized impact projection. A missing or invalid
      original outcome refuses with service.unavailable rather than reconstructing
      a receipt from later state.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/source_busy.rs
      name: source_owned_reconciliation_is_cas_bounded_private_and_capacity_effective
  - id: SCHEDULING-SEC-41
    state: enforced
    threat: >-
      Window bookings multiply a window's physical allocations, a window takes
      a resource an exact booking or another window already holds, or a
      records change moves a window out from under its bookings.
    enforcementPoint: >-
      One parent claim per window owns the physical resources its record
      declares, written by records apply while it holds every supply anchor.
      Bookings in the window consume only the window's own units. A parent is
      recomputed only when its window record changes, so a policy publication
      never moves or re-refuses a standing reservation.
    refusal: >-
      Refuse the whole records apply when a window's reservation conflicts with
      exact bookings, another window, unavailable resources or busy-source
      time, or when it moves, removes or reduces a window below standing
      commitments. Refuse a records apply or policy publication that leaves a
      window's resource requirement without an exact-time offering able to
      reserve it. Count each parent's allocations once in resource and source
      busy impacts; never modify bookings implicitly.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/multi_window.rs
      name: a_window_cannot_reserve_a_resource_an_exact_booking_holds
  - id: SCHEDULING-SEC-42
    state: enforced
    threat: >-
      Read or ownership authority records attendance, a correction targets an
      obsolete visit, or a replay changes observation history, capacity or
      downstream event identity.
    enforcementPoint: >-
      attendance.record must name the stored service and location. The locked
      booking revision and current visit's attendance revision guard each
      append-only observation. A post-lock recording time, original receipt,
      minimized history and signed after-event are written atomically.
    refusal: >-
      Refuse missing task authority, stale revisions and future observations.
      Rescheduling starts a new visit; cancellation preserves the current visit.
      Exact replay returns the original receipt without another event. Current
      detail and explicitly selected operational projections omit staff identity
      and never derive people counts or capacity changes from attendance.
    negativeTest:
      path: crates/registry-scheduling/tests/postgres_commitments/attendance.rs
      name: only_the_exact_task_action_records_and_corrects_an_observation_idempotently
  - id: SCHEDULING-SEC-43
    state: enforced
    threat: >-
      Calendar export bypasses appointment read authority, reveals operational
      or personal fields by default, or silently truncates an incomplete feed.
    enforcementPoint: >-
      Export consumes authorized current appointment or explicitly projected
      operational documents. The default calendar projection contains only a
      stable opaque identity, revision, state and authoritative displayed time.
    refusal: >-
      Reject conflicting same-revision input and bounds violations. Never
      silently truncate, invent a timezone or include references, people counts,
      attendance or resource identities in the default projection.
    negativeTest:
      path: crates/registry-scheduling-client/tests/calendar_export.rs
      name: default_projection_omits_private_and_operational_details
deferred:
  - id: SCHEDULING-DEF-04
    subject: Channel bound to the verified caller
    state: deferred
    reason: >-
      The channel that selects a window subquota is asserted by the caller and
      persisted verbatim. It is not derived from the verified client or the
      grant, so a caller entitled to book at all may choose which subquota it
      draws from.
    compensatingControl: >-
      The policy declares a closed channel set, an undeclared channel is
      refused with a typed code, and every subquota is a ceiling inside the one
      published total, so a mis-chosen channel cannot oversell the window.
    recordedIn: products/scheduling/SECURITY-REVIEW-NOTES.md
  - id: SCHEDULING-DEF-05
    subject: Database backstop under the duplicate-key guard
    state: deferred
    reason: >-
      The duplicate guard is evaluated in the admission path against an
      offering-wide indexed read of active bookings. The supporting index is
      partial rather than unique, so the guard rests on the transaction rather
      than on a database constraint.
    compensatingControl: >-
      The offering's supply lock serializes the guard and the claim it protects,
      so a concurrent pair cannot straddle it even when their booking intervals
      lie under different published opening revisions.
    recordedIn: products/scheduling/SECURITY-REVIEW-NOTES.md
  - id: SCHEDULING-DEF-06
    subject: Appointment, history, and actionable outbox retention
    state: deferred
    reason: >-
      Retention windows for committed scheduling data are a product question
      this milestone does not answer. Idempotency receipts do expire and
      tombstone, and the sweep clears the raw caller and key with them
      (SCHEDULING-SEC-33). The claim owner's raw issuer and subject expire
      separately under claimOwnerRetentionDays (SCHEDULING-SEC-34), but the
      claim, history, and actionable or uncertain outbox rows remain. Delivered
      outbox intents of every purpose (confirmation, change, cancellation,
      reminder), reminders cancelled before any attempt or set aside as
      superseded, and terminal hook metadata use receiptRetentionDays in
      bounded transactions, preserving replay through payload expiry. Rotated audit files are removed
      after audit.retentionDays.
    compensatingControl: >-
      The configuration reference says so explicitly rather than implying a
      sweep that does not run.
    recordedIn: products/scheduling/RUNTIME-CONFIG.md
