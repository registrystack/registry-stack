# yaml-language-server: $schema=https://id.registrystack.org/schemas/scheduling/records/records.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/scheduling/records/v1alpha1
kind: SchedulingRecords
locations:
  - id: bangkok-counter
    timezone: Asia/Bangkok
  - id: new-york-hall
    timezone: America/New_York
pools:
  - id: update-stations
    members:
      - resourceId: station-1
        available: true
      - resourceId: station-2
        available: true
  - id: hall-stations
    members:
      - resourceId: hall-station-1
        available: true
exceptions:
  - id: hall-prep
    location: new-york-hall
    kind: closure
    date: "2026-11-01"
    startTime: "00:15"
    endTime: "00:45"
