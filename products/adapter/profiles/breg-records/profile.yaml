# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# The breg-records facade profile: the Registry Record v1 contract a caller
# sees, served over any upstream the bound pack reaches.
#
# Registry Record v1 shapes are the DTOs of `crates/registry-record`; BReg
# serves them from `crates/registry-breg/src/record_profile.rs`: one record
# under `data`, a collection under `items` with `pageInfo.nextCursor`, and
# `meta` naming the registry, the dataset, and the entity type. This profile
# serves the same shapes so a consumer of BReg output reads adapter output
# unchanged.
#
# The closed slot vocabulary carries `record`, `records`, `recordType`,
# `recordId`, `nextCursor`, and `requestId`. Record v1's
# `meta.registryIdentifier` and `meta.datasetIdentifier` are deployment
# values (BReg fills them from the service configuration and the entity's
# primary dataset), not engine slots, so they are declared as
# `parameterizedParts`: the engine writes the deployment's values over the
# envelope members of these names at instantiation. The envelope literals
# below carry the part names themselves as the stand-in text that names the
# binding point.
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: breg-records
version: "1"
operations:
  - id: records-search
    method: GET
    path: /v1/records/{type}
    pathParameters:
      - type
    recordTypeParameter: type
    responseEnvelope: '{"items": {{records}}, "pageInfo": {"nextCursor": "{{?nextCursor}}"}, "meta": {"registryIdentifier": "registryIdentifier", "datasetIdentifier": "datasetIdentifier", "entityTypeIdentifier": "{{recordType}}"}}'
    pagination:
      cursorParameter: cursor
      pageSizeParameter: limit
      pageSizeMinimum: 1
      pageSizeMaximum: 1000
  - id: records-get
    method: GET
    path: /v1/records/{type}/{record_id}
    pathParameters:
      - type
      - record_id
    recordTypeParameter: type
    recordIdParameter: record_id
    responseEnvelope: '{"data": {{record}}, "meta": {"registryIdentifier": "registryIdentifier", "datasetIdentifier": "datasetIdentifier", "entityTypeIdentifier": "{{recordType}}"}}'
  - id: records-create
    method: POST
    path: /v1/records/{type}
    pathParameters:
      - type
    recordTypeParameter: type
    successStatus: 201
    requestEnvelope: '{"data": {{record}}}'
    responseEnvelope: '{"data": {{record}}, "meta": {"registryIdentifier": "registryIdentifier", "datasetIdentifier": "datasetIdentifier", "entityTypeIdentifier": "{{recordType}}"}}'
  - id: records-update
    method: PUT
    path: /v1/records/{type}/{record_id}
    pathParameters:
      - type
      - record_id
    recordTypeParameter: type
    recordIdParameter: record_id
    requestEnvelope: '{"data": {{record}}}'
    responseEnvelope: '{"data": {{record}}, "meta": {"registryIdentifier": "registryIdentifier", "datasetIdentifier": "datasetIdentifier", "entityTypeIdentifier": "{{recordType}}"}}'
  - id: records-patch
    method: PATCH
    path: /v1/records/{type}/{record_id}
    pathParameters:
      - type
      - record_id
    recordTypeParameter: type
    recordIdParameter: record_id
    requestEnvelope: '{"data": {{record}}}'
    responseEnvelope: '{"data": {{record}}, "meta": {"registryIdentifier": "registryIdentifier", "datasetIdentifier": "datasetIdentifier", "entityTypeIdentifier": "{{recordType}}"}}'
problems:
  - code: source.upstream-error
    status: 502
    title: the source answered with an error
    classes: [upstream]
  - code: source.unavailable
    status: 504
    title: the source did not answer in time
    classes: [upstream.timeout]
  - code: source.breaker
    status: 503
    title: the circuit protecting the source is open
    classes: [breaker.open]
  - code: source.throttle
    status: 429
    title: the source is throttling requests
    classes: [throttle.rejected]
  - code: source.loop-bound
    status: 500
    title: the route exceeded its loop bound
    classes: [loop.maximum-iterations-reached]
  - code: source.validation
    status: 422
    title: the request failed validation
    classes: [validation]
  - code: source.conversion
    status: 500
    title: a value could not be converted
    classes: [conversion.unmapped]
  - code: source.aggregation
    status: 500
    title: the aggregation produced duplicates
    classes: [aggregation.duplicate]
  - code: source.script
    status: 500
    title: a route script failed
    classes: [script]
  - code: source.budget
    status: 500
    title: the upstream call budget was exhausted
    classes: [budget.exhausted]
  - code: source.credential
    status: 500
    title: the credential for the source was rejected
    classes: [credential.rejected]
  - code: source.disclosure
    status: 500
    title: the response would exceed its disclosure limits
    classes: [disclosure.violation]
  - code: source.egress
    status: 500
    title: the request was refused by egress policy
    classes: [egress.refused]
  - code: source.not-found
    status: 404
    title: the record could not be found
    classes: [outcome.not-found]
  - code: source.write-partial
    status: 409
    title: the write was only partially accepted
    classes: [outcome.conflict]
  - code: source.write-rejected
    status: 409
    title: the source refused the write
    classes: [outcome.rejected]
  - code: source.outcome
    status: 422
    title: the request could not be served
    classes: [outcome]
  - code: source.facade
    status: 400
    title: the facade request was not valid
    classes: [facade]
problemEnvelope: '{"title": "{{problemTitle}}", "status": {{status}}, "detail": "{{?problemDetail}}", "code": "{{problemCode}}"}'
parameterizedParts:
  - name: registryIdentifier
    description: >-
      The registry identifier this deployment serves in the Registry Record
      v1 meta block. The engine writes the deployment's declared value over
      the envelope members of this name at instantiation; the literal in the
      envelope template stands in for that member until then.
  - name: datasetIdentifier
    description: >-
      The dataset identifier this deployment serves in the Registry Record
      v1 meta block, as `registryIdentifier` above.
