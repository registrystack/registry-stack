# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# PACKS scratch: the minimal facade profile of the offline pack-reader
# harness. It exists only so `adapterctl check` loads the
# kobotoolbox and odk-central packs through the real reader (pack
# document, digest pins, source-route declarations); the packs bind no
# facade operations and this harness binds none either. The problems
# block covers the closed class roots so the profile totality check
# passes; its codes are harness placeholders, not a product profile.
#
# Check with (from the repository root):
#   target/debug/adapterctl check products/adapter/scratch/packs/check-harness/project-kobotoolbox.yaml \
#     --profile products/adapter/scratch/packs/check-harness/profile.yaml \
#     --pack products/adapter/packs/kobotoolbox/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: packs-check-harness
version: "1"
operations: []
problems:
  - code: harness.upstream
    status: 502
    title: the source could not be reached
    classes: [upstream, breaker.open, throttle.rejected, loop.maximum-iterations-reached]
  - code: harness.mapping
    status: 422
    title: the request or its mapping was refused
    classes: [validation, conversion.unmapped, aggregation.duplicate]
  - code: harness.exhausted
    status: 502
    title: the run exhausted a budget
    classes: [script, budget.exhausted]
  - code: harness.boundary
    status: 500
    title: the facade refused the call
    classes: [disclosure.violation, egress.refused, credential.rejected, outcome, facade]
problemEnvelope: '{"family": "{{problemCode}}"}'
