# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# PACKS scratch: the harness project that loads the kobotoolbox pack
# through the real reader. It binds no facade routes: the pack carries
# source routes only, which is the point being checked. The pack pin's
# digest is the sha256 of products/adapter/packs/kobotoolbox/pack.yaml;
# repin it if the pack changes.
#
# Check with:
#   target/debug/adapterctl check products/adapter/scratch/packs/check-harness/project-kobotoolbox.yaml \
#     --profile products/adapter/scratch/packs/check-harness/profile.yaml \
#     --pack products/adapter/packs/kobotoolbox/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: packs-check-harness-kobo
  version: "1"
profile:
  id: packs-check-harness
  version: "1"
  digest: sha256:4cbf78c96967b5a86ca1948f713c55c3805ee264a36916243e2cb08567137bbc
pack:
  id: kobotoolbox
  version: "1"
  digest: sha256:77026d1f9d836378cf8982b3e6b1a193d811a469c14b47ea1896af64c4ea4277
recordTypes: []
