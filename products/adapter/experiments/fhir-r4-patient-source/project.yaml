# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Experiment project: the breg-records profile bound to the
# fhir-r4-patient experiment pack over one record type, `patient`.
#
# Upstream-call budget (worst-case rule): loop bound 10 pages x (widest
# choice branch, 1 send) x (1 + 1 redelivery) = 20, plus the single
# resend after a refreshed 401 for the OAuth endpoint = 21; budget 24.
#
# Check with:
#   adapterctl check products/adapter/experiments/fhir-r4-patient-source/project.yaml \
#     --profile products/adapter/profiles/breg-records/profile.yaml \
#     --runtime products/adapter/experiments/fhir-r4-patient-source/runtime.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: fhir-r4-patient-experiment
  version: "1.0.0"
profile:
  id: breg-records
  version: "1"
  digest: sha256:2588ac9ec2b6ecc245cc1e345879d4f623eb48b155470555eeff1a22e2d5d34c
pack:
  id: fhir-r4-patient
  version: "1"
  digest: sha256:dc5c1e9e77082265157343a9953cb243e820863e21496ce2f4d4d499176794c9
recordTypes:
  - name: patient
    fields:
      - name: national_id
        type: string
      - name: family_name
        type: string
      - name: given_names
        type: string
      - name: birth_date
        type: date
      - name: gender
        type: string
templatedRoutes:
  - routeTemplate: search-patients
    routeId: patient-search
    parameters:
      identifier_system: https://id.example.invalid/national-id
      page_size: 50
bindings:
  - id: patient-search
    operation: records-search
    recordType: patient
    route: patient-search
    maximumUpstreamCalls: 24
accessProfiles:
  - id: patient-reader
    scopes:
      - records.read
    operations:
      - records-search
    recordTypes:
      - patient
parameterizedParts:
  registryIdentifier: fhir-r4-patient-source-registry
  datasetIdentifier: records
