# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Experiment project: the breg-records records-create operation bound to
# the FHIR conditional-create route.
#
# Upstream-call budget (worst-case rule): 2 sends (the transaction and the
# read-back) x (1 + 1 redelivery) = 4, plus the single resend after a
# refreshed 401 for the OAuth endpoint = 5; budget 6.
#
# Check with:
#   adapterctl check products/adapter/experiments/fhir-r4-conditional-create/project.yaml \
#     --profile products/adapter/profiles/breg-records/profile.yaml \
#     --runtime products/adapter/experiments/fhir-r4-conditional-create/runtime.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: fhir-r4-conditional-create-experiment
  version: "1.0.0"
profile:
  id: breg-records
  version: "1"
  digest: sha256:7563c52c2ab7dea583513d72b4a1b849d3886b209f8b50f4ab409cda7ef73533
pack:
  id: fhir-r4-conditional-create
  version: "1"
  digest: sha256:c1d4999238fd5067352681e39e3e6c9a4f8107ccb372c21bdf1a2bf8dcf1b7b5
recordTypes:
  - name: patient
    fields:
      - name: national_id
        type: string
        required: true
      - name: family_name
        type: string
      - name: given_names
        type: string
      - name: birth_date
        type: date
      - name: gender
        type: string
templatedRoutes:
  - routeTemplate: createPatient
    routeId: patientCreate
    parameters:
      identifier_system: https://id.example.invalid/national-id
bindings:
  - id: patient-create
    operation: records-create
    recordType: patient
    route: patientCreate
    maximumUpstreamCalls: 6
accessProfiles:
  - id: patient-writer
    scopes:
      - records.write
    operations:
      - records-create
    recordTypes:
      - patient
