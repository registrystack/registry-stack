# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# The dhis2-tracker example deployment: the breg-records facade profile
# bound to the dhis2-tracker pack over one declared record type. The
# program UID is the deployment's own DHIS2 program; every secret travels
# through the runtime config as a secret reference, never here.
#
# Deployment precondition of the pack's idempotency claim: this
# deployment's account must reach a program of the person tracked-entity
# type. Without such a program an accepted import's repeat is refused
# with E1323 (fixture no-program-type-import-repeat) and the entity
# reads back 404; the pack header carries the full captured behavior.
#
# Upstream-call budgets, under the worst-case rule (route body plus the
# widest exception-clause body; every send counts one plus the widest
# declared maximumRedeliveries; token requests none, the endpoint is
# basic):
#   - person-search: 1 send x (1 + 1 redelivery) = 2; budget 4. The search
#     answers one facade page from one upstream page (CONCEPT 8.11.2).
#   - person-fetch: 1 send x (1 + 1 redelivery) = 2; budget 4.
#   - person-import: 1 send x (1 + 1 redelivery) = 2; budget 4.
#
# Check with the plain command of DELIVERY-PLAN acceptance 2; the check
# resolves the profile and pack beside the project:
#   target/debug/adapterctl check products/adapter/examples/dhis2-tracker/project.yaml
#
# The profile.yaml, pack.yaml, and scripts/ beside this project are
# byte-identical copies of the maintained artifacts the pins name
# (products/adapter/profiles/breg-records/profile.yaml and
# products/adapter/packs/dhis2-tracker/pack.yaml with its scripts/).
# Refresh them with `cp` in the same commit that moves the maintained
# bytes: the digest pins refuse a stale copy, and the contract check
# (products/adapter/scripts/check-contracts.sh) also runs the
# explicit-path replay form below against the maintained bytes, so a
# drifted copy fails one of the two.
#
# The fixtures live in their own product directory, so replay passes them
# explicitly:
#   target/debug/adapterctl fixtures replay \
#     products/adapter/examples/dhis2-tracker/project.yaml \
#     --profile products/adapter/profiles/breg-records/profile.yaml \
#     --pack products/adapter/packs/dhis2-tracker/pack.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/search-page.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-found.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-soft-deleted.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-missing.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-server-error.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/import-accepted.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/import-rejected.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/import-server-error.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/no-program-type-import-repeat.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: dhis2-tracker-example
  version: "1.0.0"
profile:
  id: breg-records
  version: "1"
  digest: sha256:51c949cae55ba424d66ef7d4a3a82ab7a9c58e5097c6667f2ef04a14a57b8078
pack:
  id: dhis2-tracker
  version: "1"
  digest: sha256:4abd9c062ebbf04e2149109da5374457187dcfd49a11f6f445b393165c81740b
recordTypes:
  - name: person
    fields:
      - name: org_unit
        type: string
        required: true
      - name: tracked_entity_type
        type: string
        required: true
      - name: created_at
        type: date-time
      - name: updated_at
        type: date-time
templatedRoutes:
  - routeTemplate: search-tracked-entities
    routeId: person-search
    parameters:
      program: qyVpUaAYv2A
  - routeTemplate: fetch-tracked-entity
    routeId: person-fetch
  - routeTemplate: import-tracked-entity
    routeId: person-import
bindings:
  - id: person-search
    operation: records-search
    recordType: person
    route: person-search
    maximumUpstreamCalls: 4
  - id: person-get
    operation: records-get
    recordType: person
    route: person-fetch
    maximumUpstreamCalls: 4
  - id: person-create
    operation: records-create
    recordType: person
    route: person-import
    maximumUpstreamCalls: 4
accessProfiles:
  - id: records-reader
    scopes:
      - records.read
    operations:
      - records-search
      - records-get
    recordTypes:
      - person
  - id: records-writer
    scopes:
      - records.write
    operations:
      - records-create
      - records-update
      - records-patch
    recordTypes:
      - person
