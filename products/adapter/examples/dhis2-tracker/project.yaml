# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# The dhis2-tracker example deployment: the breg-records facade profile
# bound to the dhis2-tracker pack over one declared record type. The
# program UID is the deployment's own DHIS2 program; every secret travels
# through the runtime config as a secret reference, never here.
#
# Upstream-call budgets, under the worst-case rule (route body plus the
# widest exception-clause body; every send counts one plus the widest
# declared maximumRedeliveries; token requests none, the endpoint is
# basic):
#   - personSearch: loop bound 10 pages x (1 fetch per page) x
#     (1 + 1 redelivery) = 20; budget 24 leaves headroom.
#   - personFetch: 1 send x (1 + 1 redelivery) = 2; budget 4.
#   - personImport: 1 send x (1 + 1 redelivery) = 2; budget 4.
#
# Check with (the profile, pack, and fixtures live in their own product
# directories, so the paths are passed explicitly):
#   target/debug/adapterctl check \
#     products/adapter/examples/dhis2-tracker/project.yaml \
#     --profile products/adapter/profiles/breg-records/profile.yaml \
#     --pack products/adapter/packs/dhis2-tracker/pack.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/search-page.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-found.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/get-soft-deleted.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/import-accepted.yaml \
#     --fixtures products/adapter/fixtures/dhis2-tracker/import-error-200.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
id: dhis2-tracker-example
profile:
  id: breg-records
  version: "1"
  digest: sha256:e6df82d197926e6b54ce519e6f739f2a9db0b3e0469e7970577184020910799b
pack:
  id: dhis2-tracker
  version: "1"
  digest: sha256:1d91e5c77820400decb5b654ef94394c429413d625b14ac98be7c5f0b6cb983a
recordTypes:
  - name: person
    fields:
      - name: org_unit
        type: string
        required: true
      - name: tracked_entity_type
        type: string
        required: true
      - name: created_at
        type: date-time
      - name: updated_at
        type: date-time
templatedRoutes:
  - routeTemplateRef: searchTrackedEntities
    routeId: personSearch
    parameters:
      program: qyVpUaAYv2A
      pageSize: 50
  - routeTemplateRef: fetchTrackedEntity
    routeId: personFetch
  - routeTemplateRef: importTrackedEntity
    routeId: personImport
bindings:
  - id: person-search
    operation: records.search
    recordType: person
    route: personSearch
    maximumUpstreamCalls: 24
  - id: person-get
    operation: records.get
    recordType: person
    route: personFetch
    maximumUpstreamCalls: 4
  - id: person-create
    operation: records.create
    recordType: person
    route: personImport
    maximumUpstreamCalls: 4
accessProfiles:
  - id: records-reader
    scopes:
      - records.read
    operations:
      - records.search
      - records.get
    recordTypes:
      - person
  - id: records-writer
    scopes:
      - records.write
    operations:
      - records.create
      - records.update
      - records.patch
    recordTypes:
      - person
