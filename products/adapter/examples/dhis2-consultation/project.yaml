# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Two public Consultation views over the same source-native DHIS2 acquisition
# routes. The maintained pack returns captured DHIS2 entities as source items;
# this project owns the caller-visible transformations and closed schemas.
# Source attributes can therefore support another authorized projection, but
# neither maintained view below discloses them.
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: dhis2-consultation-example
  version: "1.0.0"
consultation:
  contract: https://registry.example/contracts/1.0.0-draft/openapi.yaml
  collections:
    - recordType: people
      registry: https://registry.example/registries/people
      view: person-public
      dataSchema: person-public
      lookup:
        selector: by-record-id
        inputSchema: record-id
      search:
        search: by-org-unit
        inputSchema: org-unit-search
    - recordType: people-summary
      registry: https://registry.example/registries/people
      view: person-summary
      dataSchema: person-summary
      lookup:
        selector: by-record-id
        inputSchema: record-id
      search:
        search: by-org-unit
        inputSchema: org-unit-search
pack:
  id: dhis2-tracker
  version: "1"
  digest: sha256:bbd86471556ab3d291ef2f8a45e362a44c919ea8b35c9078a8602bba5cceb006
artifacts:
  scripts:
    - id: person-public
      file: scripts/person-public.rhai
      digest: sha256:01dd14474a575c32abbd207e291741e7f791a2ed3aa8c5255e525b7cb238ca00
    - id: person-summary
      file: scripts/person-summary.rhai
      digest: sha256:5bf4bb3fc5c9b4b4a1512abf03cb0c98fab71791ce1cf8af99a68b88e1a17771
  schemas:
    - id: person-public
      file: schemas/person-public.schema.json
      digest: sha256:06e9aa068002bcb2d4b383334212b9c6de228de5a209ac6c45bd4cfe721f6bf3
    - id: person-summary
      file: schemas/person-summary.schema.json
      digest: sha256:d6711211303a00bb9317934934e7a50d69c2312917b542cccc941c4256ccf419
    - id: record-id
      file: schemas/record-id.schema.json
      digest: sha256:424032c763e42a6cc802240b62d448a7dfa409aed6bcb612adb62ec67d5c0c8e
    - id: org-unit-search
      file: schemas/org-unit-search.schema.json
      digest: sha256:376a510cfd70ed79f070156cc72d7ef4a152d63b89bc178c1337337c3070d2bc
recordTypes:
  - name: people
    fields: []
  - name: people-summary
    fields: []
templatedRoutes:
  - routeTemplate: read-tracked-entity
    routeId: person-read
  - routeTemplate: page-tracked-entities
    routeId: person-list
    parameters:
      program: qyVpUaAYv2A
  - routeTemplate: page-tracked-entities-by-org-unit
    routeId: person-search
    parameters:
      program: qyVpUaAYv2A
bindings:
  - id: people-retrieve
    operation: retrieve
    recordType: people
    route: person-read
    maximumUpstreamCalls: 4
  - id: people-lookup
    operation: lookup
    recordType: people
    route: person-read
    maximumUpstreamCalls: 4
  - id: people-list
    operation: list
    recordType: people
    route: person-list
    maximumUpstreamCalls: 4
  - id: people-search
    operation: search
    recordType: people
    route: person-search
    maximumUpstreamCalls: 4
  - id: people-summary-retrieve
    operation: retrieve
    recordType: people-summary
    route: person-read
    maximumUpstreamCalls: 4
  - id: people-summary-lookup
    operation: lookup
    recordType: people-summary
    route: person-read
    maximumUpstreamCalls: 4
  - id: people-summary-list
    operation: list
    recordType: people-summary
    route: person-list
    maximumUpstreamCalls: 4
  - id: people-summary-search
    operation: search
    recordType: people-summary
    route: person-search
    maximumUpstreamCalls: 4
bindingTransforms:
  people-retrieve: {script: person-public, entrypoint: project_person_public}
  people-lookup: {script: person-public, entrypoint: project_person_public}
  people-list: {script: person-public, entrypoint: project_person_public}
  people-search: {script: person-public, entrypoint: project_person_public}
  people-summary-retrieve: {script: person-summary, entrypoint: project_person_summary}
  people-summary-lookup: {script: person-summary, entrypoint: project_person_summary}
  people-summary-list: {script: person-summary, entrypoint: project_person_summary}
  people-summary-search: {script: person-summary, entrypoint: project_person_summary}
accessProfiles:
  - id: records-reader
    scopes: [records.read]
    operations: [retrieve, lookup, list, search]
    recordTypes: [people, people-summary]
