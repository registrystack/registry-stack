# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Three public Consultation views over the same source-native DHIS2 acquisition
# routes. The maintained pack returns captured DHIS2 entities as source items;
# this project owns the caller-visible transformations and closed schemas.
# Source attributes can therefore support another authorized projection, but
# neither of the first two views below discloses them. The third view,
# person-registration, is generated from person-registration.mapping.yaml and
# discloses exactly one attribute, the date of birth, selected by its UID.
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: dhis2-consultation-example
  version: "1.0.0"
consultation:
  contract: https://registry.example/contracts/1.0.0-draft/openapi.yaml
  collections:
    - recordType: people
      registry: https://registry.example/registries/people
      dataSchema: person-public
      transform: {script: person-public, entrypoint: project_person_public}
      lookup:
        selector: by-record-id
        inputSchema: record-id
      search:
        search: by-org-unit
        inputSchema: org-unit-search
    - recordType: people-summary
      registry: https://registry.example/registries/people
      dataSchema: person-summary
      transform: {script: person-summary, entrypoint: project_person_summary}
      lookup:
        selector: by-record-id
        inputSchema: record-id
      search:
        search: by-org-unit
        inputSchema: org-unit-search
    - recordType: people-registration
      registry: https://registry.example/registries/people
      dataSchema: person-registration
      transform: {script: person-registration, entrypoint: project_person_registration}
      lookup:
        selector: by-record-id
        inputSchema: record-id
      search:
        search: by-org-unit
        inputSchema: org-unit-search
pack:
  id: dhis2-tracker
  version: "1"
  digest: sha256:41df7eef899ee01b4af9f5b70c306ab04005e3c4dde21613118a720f8e482aa9
artifacts:
  scripts:
    - id: person-public
      file: scripts/person-public.rhai
      digest: sha256:01dd14474a575c32abbd207e291741e7f791a2ed3aa8c5255e525b7cb238ca00
    - id: person-summary
      file: scripts/person-summary.rhai
      digest: sha256:5bf4bb3fc5c9b4b4a1512abf03cb0c98fab71791ce1cf8af99a68b88e1a17771
    - id: person-registration
      file: scripts/person-registration.rhai
      digest: sha256:9d9eb23d11dd4475d4f783d45b2ed33e52e970b974b242915a02ac10e12bb72e
  schemas:
    - id: person-public
      file: schemas/person-public.schema.json
      digest: sha256:06e9aa068002bcb2d4b383334212b9c6de228de5a209ac6c45bd4cfe721f6bf3
    - id: person-summary
      file: schemas/person-summary.schema.json
      digest: sha256:d6711211303a00bb9317934934e7a50d69c2312917b542cccc941c4256ccf419
    - id: person-registration
      file: schemas/person-registration.schema.json
      digest: sha256:84438462a59f5c13ad50672296f1029405abcd6432281a3510fb01d2d83bc37d
    - id: record-id
      file: schemas/record-id.schema.json
      digest: sha256:424032c763e42a6cc802240b62d448a7dfa409aed6bcb612adb62ec67d5c0c8e
    - id: org-unit-search
      file: schemas/org-unit-search.schema.json
      digest: sha256:376a510cfd70ed79f070156cc72d7ef4a152d63b89bc178c1337337c3070d2bc
templatedRoutes:
  - routeTemplate: read-tracked-entity
    routeId: person-read
  - routeTemplate: page-tracked-entities
    routeId: person-list
    parameters:
      program: qyVpUaAYv2A
      tie_breaker_attribute: lZGmxYbs97q
  - routeTemplate: page-tracked-entities-by-org-unit
    routeId: person-search
    parameters:
      program: qyVpUaAYv2A
      tie_breaker_attribute: lZGmxYbs97q
bindings:
  - id: people-retrieve
    operation: retrieve
    recordType: people
    route: person-read
  - id: people-lookup
    operation: lookup
    recordType: people
    route: person-read
  - id: people-list
    operation: list
    recordType: people
    route: person-list
  - id: people-search
    operation: search
    recordType: people
    route: person-search
  - id: people-summary-retrieve
    operation: retrieve
    recordType: people-summary
    route: person-read
  - id: people-summary-lookup
    operation: lookup
    recordType: people-summary
    route: person-read
  - id: people-summary-list
    operation: list
    recordType: people-summary
    route: person-list
  - id: people-summary-search
    operation: search
    recordType: people-summary
    route: person-search
  - id: people-registration-retrieve
    operation: retrieve
    recordType: people-registration
    route: person-read
  - id: people-registration-lookup
    operation: lookup
    recordType: people-registration
    route: person-read
  - id: people-registration-list
    operation: list
    recordType: people-registration
    route: person-list
  - id: people-registration-search
    operation: search
    recordType: people-registration
    route: person-search
accessProfiles:
  - id: records-reader
    scopes: [records.read]
    operations: [retrieve, lookup, list, search]
    recordTypes: [people, people-summary, people-registration]
