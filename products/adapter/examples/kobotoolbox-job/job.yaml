# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# The direct-BReg kobotoolbox example job: the shared kobotoolbox pack's
# kobo-submissions source route, bounded by this profile. One page per run, 100
# submissions at most, the endpoint's 1 MiB response bound as the
# profile's response and page bound. The read bounds carry the job
# profile's documented members at their defaults; no pollEnrich read
# is in this route, so the file and row bounds stay at the format's
# widest values.
#
# The pack pin is exact (CFG-ID-4): id, version, and the sha256 of the
# pack document
# (products/adapter/packs/kobotoolbox/pack.yaml). If the pack changes,
# repin the digest.
#
# `adapterctl job check` compiles this job against the pack (pack.yaml
# with its scripts/), the profile, the project, and the runtime config
# beside this file (products/adapter/scripts/check-contracts.sh runs
# it). The pack's fixtures replay through the same compiler in
# crates/registry-adapter/tests/job_pack_replay.rs.
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobotoolbox-submissions-example
  version: "1"
source:
  pack:
    id: kobotoolbox
    version: "1"
    digest: sha256:cb1c31044611e3f23464291f6dd2697b00be427da0b9523d0b717fe776e5d667
  route: kobo-submissions
# Programme semantics stay beside the job, not in the reusable Kobo provider
# pack. This example maps one projected submission into a synthetic BReg
# Proposal Action, then starts and submits that Proposal with stable keys.
destination:
  type: direct-breg
  binding: household-registry
  accessProfile: ingestion
  action: register-household
  mode: proposal
  mapping:
    file: mappings/register-household.rhai
    entrypoint: map_submission
    digest: sha256:d910d0f72f70ea9dbf7dbb2e9f65ec3ad0a3231cf3baca7d96a1e03b2e54423e
  receiptRetentionDays: 7
# The projection names members every item value carries: the
# submission id, a top-level answer, and an answer inside a group (the
# pack nests Kobo's slash-separated names into objects).
projection:
  fields:
    - _id
    - respondent_name
    - household.household_size
triggers:
  - kind: interval
    delayMilliseconds: 60000
profile:
  # One route run: one send, one redelivery at most, well inside the
  # page deadline.
  pageDeadlineMilliseconds: 300000
  # The endpoint declares 1048576; the profile is never tighter than a
  # bound of an endpoint the source route reaches.
  maximumResponseBytes: 1048576
  # The pack's fixed page size.
  maximumPageItems: 100
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 8
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 100
