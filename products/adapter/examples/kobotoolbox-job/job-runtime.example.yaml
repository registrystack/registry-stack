# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job-runtime/job-runtime.v1alpha1.schema.json
#
# The kobotoolbox example job deployment's runtime configuration, in
# the example form: every secret is a reference into the operator's
# provider, never a value. A job runtime document carries the endpoint
# bindings alone beside its own blocks: no listener, no facade
# database, no OIDC issuer, no admitted clients, and no audit
# retention, which the facade's runtime document alone carries
# (CONCEPT 10.2, 17).
#
# The deployment-owned scoping lives in the base URL: the endpoint
# binding pins the origin plus the base path, and the pack's sends stay
# under it (CONCEPT 8.11.5). Bind `kobo-api` to the data URL of the
# deployment's own asset - origin, /api/v2/assets/<asset uid>/data, no
# trailing slash; the pack's `path: /` supplies the documented trailing
# slash. The asset uid below is an obviously synthetic stand-in.
#
# The `store` block names the item table's connection reference, the
# job host's own block of this document; the store runs its migrations
# on the same connection it serves from, so it carries no separate
# migration member.
apiVersion: id.registrystack.org/formats/adapter/job-runtime/v1alpha1
kind: AdapterJobRuntimeConfig
id: kobotoolbox-job-example
endpoints:
  - endpoint: kobo-api
    baseUrl: https://kobo.example.invalid/api/v2/assets/aFixtureUid0000000000000000000001/data
    credential:
      type: basic
      usernameRef: secret:env/KOBO_USERNAME
      passwordRef: secret:env/KOBO_PASSWORD
# A deployment whose source presents a private CA declares it under
# outboundTls.trustProfiles and names the profile on the endpoint
# binding; the example trusts the system roots, so the file resolves
# wherever the example is checked.
allowedPrivateCidrs:
  # The private ranges this deployment may call upstream. The example
  # range stands in for the deployment's own; private endpoints stay
  # refused unless their range is listed here.
  - 10.0.0.0/8
store:
  runtimeUrlRef: secret:env/ADAPTER_JOB_DB
