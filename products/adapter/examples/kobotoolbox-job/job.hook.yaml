# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# The webhook-enabled form of the direct KoboToolbox example. The hook only
# starts this same bounded source pass early. The interval remains the
# reconciliation authority when Kobo delivery is delayed or lost.
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobotoolbox-submissions-hook-example
  version: "1"
source:
  pack:
    id: kobotoolbox
    version: "1"
    digest: sha256:cb1c31044611e3f23464291f6dd2697b00be427da0b9523d0b717fe776e5d667
  route: kobo-submissions
destination:
  type: direct-breg
  binding: household-registry
  accessProfile: ingestion
  action: register-household
  mode: proposal
  mapping:
    file: mappings/register-household.rhai
    entrypoint: map_submission
    digest: sha256:6b7f1cbbccd57459e15f5ece6282b3ca96946f0525759adcf6acbcc925496da6
  receiptRetentionDays: 7
projection:
  fields:
    - _id
    - respondent_name
    - household.household_size
triggers:
  - kind: interval
    delayMilliseconds: 60000
    initialDelayMilliseconds: 60000
  - kind: hook
    path: /hooks/kobo-submissions
    binding: kobo-submissions
profile:
  pageDeadlineMilliseconds: 300000
  maximumResponseBytes: 1048576
  maximumPageItems: 100
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 8
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 100
