# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/fixture/fixture.v1alpha1.schema.json
#
# Synthetic fixture (NOT captured, and NOT from a real ODK Central
# server): refused credential: the entity set answers 401 without a
# WWW-Authenticate challenge, the engine raises credential.rejected
# before any route step.
# The upstream shape follows the documented Central OData page
# (https://docs.getodk.org/central-api-odata-endpoints/: `value`,
# `$filter` and `$orderby` on `__system/submissionDate`, `$top`;
# `__system/updatedAt` is null until a submission is edited,
# https://docs.getodk.org/central-api-submission-management/). Every
# value is a made-up stand-in; the reply's own `@odata.nextLink` is
# synthetic and unread by the route.
# The entry shape is the provisional job replay contract: `jobRun`
# carries the cursor the job restores, `upstream` the request the
# route sends and the scripted reply, `expected` the item page or
# problem class. crates/registry-adapter/tests/job_pack_replay.rs
# replays every entry through the job compiler.
apiVersion: id.registrystack.org/formats/adapter/fixture/v1alpha1
kind: AdapterFixture
id: odk-central-submissions-unauthorized
pack: odk-central
upstreamVersion: unverified
provenance:
  type: documented
  reference: https://docs.getodk.org/central-api-authentication/
intercepts:
- type: endpoint
  endpoint: odk-odata
entries:
- jobRun:
    cursor: null
  upstream:
  - request:
      endpoint: odk-odata
      method: GET
      path: /
      query: '%24orderby=__system%2FsubmissionDate%20asc&%24top=100'
    response:
      status: 401
      body:
        message: Could not authenticate with the provided credentials.
        code: 401.2
  expected:
    type: problem
    class: credential.rejected
