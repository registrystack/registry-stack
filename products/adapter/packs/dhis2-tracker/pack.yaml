# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# The dhis2-tracker pack: DHIS2 tracker export and import, ported from the
# DHIS2 Web API documentation (https://docs.dhis2.org/en/develop/using-the-api/
# dhis-core-version-241/), tested against DHIS2 2.41 documented behavior.
#
# Authentication (cited choices):
#   - User accounts authenticate over `Authorization: Basic
#     base64encode(username:password)`; the DHIS2 documentation recommends
#     Basic only over TLS. The endpoint below declares `basic`; the runtime
#     config binds usernameRef and passwordRef.
#   - Personal access tokens authenticate over `Authorization: ApiToken
#     <token>` (same page). A deployment that prefers a PAT swaps this
#     endpoint's kind to `static-authorization` with `scheme: ApiToken` and
#     binds tokenRef in the runtime config; both sides of the kind match
#     must move together.
#   - DHIS2's OAuth2 support carries the password, refresh, and
#     authorization-code grants, not the client-credentials grant, so no
#     `oauth2-client-credentials` or `oauth2-private-key-jwt` endpoint is
#     declared here.
#
# Upstream responses and their declared headers: the tracker endpoints'
# documented behavior carries no response header the facade consumes, so
# the allowlist stays empty and the engine copies nothing.
#
# Idempotency basis for `tracker-import` (idempotentUpstream: true): the
# tracker importer treats a payload object whose UID already exists as an
# update, and refuses a create whose UID collides (error E1002); repeating
# an import whose objects carry client-supplied UIDs therefore lands every
# object on the same one. Imports without client-supplied UIDs are NOT
# idempotent (each repeat would mint new UIDs or collide), so the claim
# holds only for the client-supplied-UID payload this pack's to-bundle
# mapping produces, and the script throws when a record carries no
# recordIdentifier.
#
# The 200-with-error-body quirk: the tracker importer reports its outcome
# in the summary body, not the status line; DHIS2 answers HTTP 200 with a
# summary whose `status` is ERROR in the field. Detecting that answer is
# this pack's concern (scripts/import-failed.rhai) through the grammar's
# choice step, never an inline check.
#
# Error clauses: the pack raises the closed error classes of CONCEPT 8.7
# and never names a profile's problem codes or writes a problem body
# (CONCEPT 8.11.6). A clause that translates a source answer ends with
# `throwException` carrying an `outcome.*` class (the 404 answer and the
# soft-deleted entity raise `outcome.not-found`, the ERROR import summary
# raises `outcome.rejected`); redelivery stays a clause of its own and
# every other error propagates as its own class. The bound profile's
# `problems` list decides the problem the caller sees, so the pack binds
# any profile; the example deploys breg-records, which maps
# `outcome.not-found` to its 404 and `outcome.rejected` to its 409.
#
# Code maps: the tracker import summary (OK, WARNING, ERROR) is read by
# scripts/import-failed.rhai today. A `convert` step over a code map
# returns with the core convert steps (CONCEPT 8.6); this pack declares
# none until then.
#
# Paging assumption, to be proven by a captured fixture: the tracker
# export reply's page block is read at $.page.totalPage; DHIS2 fills it
# only when the request carries totalPages=true, which the fetch-page route
# always sends (docs.dhis2.org tracker export parameters). The reviewed
# page bound is the loop's maximumIterations: 10.
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: dhis2-tracker
version: "1"
testedVersions:
  - "2.41"
endpoints:
  - id: tracker
    component: http
    authentication:
      type: basic
    operations:
      - id: tracker-export
      - id: tracker-import
        idempotentUpstream: true
    testedVersions:
      - "2.41"
routeTemplates:
  - id: search-tracked-entities
    parameters:
      - name: program
        type: string
        required: true
        description: The DHIS2 program the search narrows to.
      - name: page_size
        type: integer
        defaultValue: 50
        description: The DHIS2 page size each loop iteration fetches (DHIS2 default 50).
    steps:
      - onException:
          exception:
            - upstream.timeout
            - upstream.connection
          redeliveryPolicy:
            maximumRedeliveries: 1
            retryDelaySeconds: 2
      - setProperty:
          name: dhis2Program
          value:
            constant: "{{program}}"
      - setProperty:
          name: dhis2PageSize
          value:
            constant: "{{page_size}}"
      - setProperty:
          name: dhis2Page
          value:
            constant: 1
      - loop:
          rhai:
            file: scripts/has-more-pages.rhai
            entrypoint: has_more_pages
          doWhile: true
          maximumIterations: 10
          steps:
            - enrich:
                uri: direct:fetch-page
                aggregationStrategy:
                  type: json-array-append
                  from: pages
                  into: records
                  uniqueBy: trackedEntity
            - setProperty:
                name: dhis2Page
                value:
                  rhai:
                    file: scripts/next-page.rhai
                    entrypoint: next_page
      - setBody:
          rhai:
            file: scripts/shape-records.rhai
            entrypoint: shape_records
  - id: fetch-tracked-entity
    parameters:
      - name: id
        type: string
        required: false
        description: The tracked-entity identifier the lookup resolves from the request.
    steps:
      - onException:
          exception:
            - upstream.http
          onWhen:
            rhai:
              file: scripts/is-not-found.rhai
              entrypoint: is_not_found
          steps:
            - throwException:
                exceptionType: outcome.not-found
                message: No tracked entity with that identifier exists at the source.
      - onException:
          exception:
            - upstream.timeout
            - upstream.connection
          redeliveryPolicy:
            maximumRedeliveries: 1
            retryDelaySeconds: 2
      - to:
          uri: http:tracker
          parameters:
            httpMethod: GET
            path: /api/tracker/trackedEntities/{{id}}
            pathParameters:
              id:
                header: recordId
            operation: tracker-export
      - choice:
          when:
            - rhai:
                file: scripts/soft-deleted.rhai
                entrypoint: soft_deleted
              steps:
                - throwException:
                    exceptionType: outcome.not-found
                    message: The tracked entity is deleted or deactivated at the source.
          otherwise:
            steps:
              - setBody:
                  rhai:
                    file: scripts/to-record.rhai
                    entrypoint: to_record
  - id: import-tracked-entity
    parameters: []
    steps:
      - onException:
          exception:
            - upstream.http
            - upstream.timeout
            - upstream.connection
          redeliveryPolicy:
            maximumRedeliveries: 1
            retryDelaySeconds: 2
      - idempotentConsumer:
          expression:
            header: Idempotency-Key
          steps:
            # The send replaces the body with the import summary, so the
            # submitted record rides the exchange through the send in this
            # property; scripts/accepted-record.rhai returns it.
            - setProperty:
                name: dhis2SubmittedRecord
                value:
                  jsonpath: "$"
            - to:
                uri: http:tracker
                parameters:
                  httpMethod: POST
                  path: /api/tracker
                  query:
                    async:
                      constant: "false"
                  body:
                    rhai:
                      file: scripts/to-bundle.rhai
                      entrypoint: to_bundle
                  operation: tracker-import
            - choice:
                when:
                  - rhai:
                      file: scripts/import-failed.rhai
                      entrypoint: import_failed
                    steps:
                      - throwException:
                          exceptionType: outcome.rejected
                          message: The source refused the write.
                otherwise:
                  steps:
                    - setBody:
                        rhai:
                          file: scripts/accepted-record.rhai
                          entrypoint: accepted_record
routes:
  - id: fetch-page
    from:
      uri: direct:fetch-page
    steps:
      - to:
          uri: http:tracker
          parameters:
            httpMethod: GET
            path: /api/tracker/trackedEntities
            operation: tracker-export
            query:
              program:
                exchangeProperty: dhis2Program
              page:
                exchangeProperty: dhis2Page
              pageSize:
                exchangeProperty: dhis2PageSize
              totalPages:
                constant: true
              order:
                constant: "createdAt:desc"
scripts:
  - path: scripts/has-more-pages.rhai
    digest: sha256:1fe96b2aeb6c87828fdab1248b5e3ba1ec40d8db29089e14f3e9d1d97bff8788
  - path: scripts/next-page.rhai
    digest: sha256:34bb99208bbc6457180d6a28bda8715db34344596795b84ee7347172aeda5b48
  - path: scripts/soft-deleted.rhai
    digest: sha256:c5cb2eaf086c6b2a6156f17e5d50f6171ec95ecbd869e9b79d715b96fe0047a6
  - path: scripts/is-not-found.rhai
    digest: sha256:8f738dc51ecbd1641f8f512ff5d2edcc48408e438814179ea360cd4267dd34b0
  - path: scripts/to-record.rhai
    digest: sha256:2971163431db3510392b631edcf245baded3aa78ad2fcf187e9863b5c482cb30
  - path: scripts/shape-records.rhai
    digest: sha256:79b10588f18ab284ea7cae53c4312e45a1dc2e62bd5faa7330f0f97de89a4c62
  - path: scripts/to-bundle.rhai
    digest: sha256:d289269e36bf753e723a849f7cb192c070d925d4e991311d12dfb59f0a8e97bc
  - path: scripts/import-failed.rhai
    digest: sha256:2cf14b9227470f1e07944433a58fe06ba4c527a01af3e23e670049ca3eeeece3
  - path: scripts/accepted-record.rhai
    digest: sha256:951b0c03cd2771d1688f35661b1cf5f8e7a50dec6d0ac7b4283316fc8d5e1b7c
capabilities:
  components:
    - http
  languages:
    - constant
    - header
    - exchangeProperty
    - jsonpath
    - rhai
  eips:
    - choice
    - enrich
    - idempotentConsumer
    - loop
    - onException
    - setBody
    - setProperty
    - throwException
    - to
