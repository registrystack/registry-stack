# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/fixture/fixture.v1alpha1.schema.json
#
# Synthetic fixture (NOT captured, and NOT from a real KoboToolbox
# server): first run: no cursor, no `query` filter, the first 100 of
# 130 submissions in `_id` order, the cursor `{afterId: 100}` back.
# The upstream shape follows the documented v2 data endpoint ({count,
# next, previous, results} over GET /api/v2/assets/<uid>/data/ with
# format, limit, sort, and query;
# https://support.kobotoolbox.org/api.html and the kpi API
# documentation kpi/docs/api/v2/data/list.md). Every value is a
# made-up stand-in; the reply's own `next` URL is synthetic and unread
# by the route. Group and repeat answers arrive as slash-separated
# names (`household/household_size`) and the expected item value
# carries them nested.
# The entry shape is the provisional job replay contract: `jobRun`
# carries the cursor the job restores, `upstream` the request the
# route sends and the scripted reply, `expected` the item page or
# problem class. crates/registry-adapter/tests/job_pack_replay.rs
# replays every entry through the job compiler.
