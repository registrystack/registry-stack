# The Camel port table: one row per ported Camel concept (concept, reference, form, divergence, inc).
# check-port-table.py holds this table to the code.
rows:
- concept: Exchange, MEP
  reference: '`manual/exchange.html`, `manual/exchange-pattern.html`'
  form: '`exchange` module; InOut only'
  divergence: InOnly not ported
  inc: 1
- concept: Message
  reference: '`manual/message.html`'
  form: Bounded case-insensitive headers, JSON body
  divergence: Components marshal JSON themselves
  inc: 1
- concept: HeaderFilterStrategy
  reference: '`components/next/http-component.html` (its headerFilterStrategy option; the former manual page is gone)'
  form: '`responseHeaders` and `requestHeaders` allowlists per endpoint'
  divergence: Allowlists, not denylists; credential, cookie, host, and hop-by-hop headers can never be allowlisted
  inc: 1
- concept: Route, YAML DSL
  reference: '`manual/routes.html`, `components/next/others/yaml-dsl.html`'
  form: '`routes` in packs, externally tagged steps'
  divergence: '`direct:` `from` only; acyclic; bounded depth'
  inc: 0
- concept: Route template, templatedRoute
  reference: '`manual/route-template.html`'
  form: '`routeTemplates` in packs, `templatedRoutes` in projects'
  divergence: Typed parameters; no `from` in templates
  inc: 0
- concept: Kamelet catalog
  reference: '`camel-kamelets/next/index.html`'
  form: The pack as a reviewed catalog of templates
  divergence: Not Kubernetes resources; digest-pinned
  inc: 0
- concept: Property placeholders
  reference: '`manual/using-propertyplaceholder.html`'
  form: '`{{name}}`, `{{?name}}` for template parameters only'
  divergence: No environment placeholders in authored files
  inc: 0
- concept: REST DSL contract-first
  reference: '`manual/rest-dsl-openapi.html`, `manual/rest-dsl.html`'
  form: '`rest` consumer over the generated OpenAPI; facade inputs on the exchange under closed names'
  divergence: Validation always on; `missingOperation` fail only; profile-neutral input names, not the caller's parameter names; caller headers never enter
  inc: 1
- concept: '`direct`'
  reference: '`components/next/direct-component.html`'
  form: '`direct:<routeId>`, sharing the exchange'
  divergence: 'Depth bound; no redelivery of a `to: direct:` send'
  inc: 1
- concept: '`http`'
  reference: '`components/next/http-component.html`'
  form: '`http:<endpointId>` on `FixedDestinationPolicy`; `httpUri` for an origin-pinned link'
  divergence: Structured, engine-encoded path and query; `httpUri` pinned to the endpoint origin and base path; no redirects
  inc: 1
- concept: HTTP authentication
  reference: '`components/next/http-component.html` (authentication options)'
  form: '`authentication` on the pack endpoint, credentials bound in the runtime config'
  divergence: Closed kinds; secret references only; the token endpoint is a fixed destination too; `basic` is sent preemptively, with no challenge round trip; no NTLM, no Digest, no query-placed keys
  inc: 1
- concept: '`graphql`'
  reference: '`components/next/graphql-component.html`'
  form: '`graphql:<endpointId>`'
  divergence: Query from a pinned file only; `errors` fail the exchange; a mutation is non-safe
  inc: 3
- concept: Languages
  reference: '`components/next/languages/constant-language.html`, `header-language.html`, `exchangeProperty-language.html`, `jsonpath-language.html`'
  form: '`constant`, `header`, `exchangeProperty`, `jsonpath`'
  divergence: RFC 9535, not Jayway; singular-query result rule; header reads bounded to known headers
  inc: 1
- concept: Simple, bean, process
  reference: '`components/next/languages/simple-language.html`'
  form: '`rhai` files with the Rhai script ABI'
  divergence: Not ported; Rhai replaces them; scripts see a read-only exchange view
  inc: 1
- concept: '`to`'
  reference: '`components/next/eips/to-eip.html`'
  form: '`to`'
  divergence: No `toD`; `httpUri` is the only dynamic form
  inc: 1
- concept: '`setBody`, `transform`'
  reference: '`components/next/eips/setBody-eip.html`, `transform-eip.html`'
