# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.profile.problem-errors-slot-form: pins the exact sibling bytes; the profile carries the defect.
#
