#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.profile.problem-errors-slot-form/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:7ff154046aa549d2c5dc5b4867acea20db365c1587dc95970142e9284778d858
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:767af1e2819c23f50bb361a56a3f9ead28c8c03f2559c2adb579441d9207d93a
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
