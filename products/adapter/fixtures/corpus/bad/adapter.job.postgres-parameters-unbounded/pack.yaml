# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.postgres-parameters-unbounded: this artifact set must be refused with
# exactly adapter.job.postgres-parameters-unbounded. The source route's postgres send carries seventeen named parameters, one past the bound of sixteen.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.job.postgres-parameters-unbounded/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
  - id: ledger
    component: postgres
    authentication:
      type: none
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
    queryFile: queries/ledger.sql
queryFiles:
  - path: queries/ledger.sql
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{{type}}/{{case_id}}
            pathParameters:
              type:
                constant: welfare
              case_id:
                header: recordId
            query:
              _format:
                constant: json
sourceRoutes:
  - id: kobo-submissions
    scan: ongoing
    nextRecovery: exact-replay
    edits: ordered
    steps:
      - to:
          uri: postgres:ledger
          parameters:
            queryParameters:
              p00: {constant: 0}
              p01: {constant: 1}
              p02: {constant: 2}
              p03: {constant: 3}
              p04: {constant: 4}
              p05: {constant: 5}
              p06: {constant: 6}
              p07: {constant: 7}
              p08: {constant: 8}
              p09: {constant: 9}
              p10: {constant: 10}
              p11: {constant: 11}
              p12: {constant: 12}
              p13: {constant: 13}
              p14: {constant: 14}
              p15: {constant: 15}
              p16: {constant: 16}
capabilities: {}
