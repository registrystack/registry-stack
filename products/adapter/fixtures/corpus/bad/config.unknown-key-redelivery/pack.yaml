# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member config.unknown-key-redelivery: this artifact set must be refused with
# exactly config.unknown-key-redelivery. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/config.unknown-key-redelivery/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: findCases
    parameters: []
    steps:
      - errorHandler:
          defaultErrorHandler:
            redeliveryPolicy:
              maximumRedeliveries: 1
              bogusOption: 1
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{type}/{case_id}
            pathParameters:
              case_id:
                header: recordId
capabilities: {}
