# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.runtime.missing-endpoint: this artifact set must be refused with
# exactly adapter.runtime.missing-endpoint. The runtime config binds no endpoint, but the pack declares cases.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.runtime.missing-endpoint/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:a805755973f4d29c462a31355ce3304af27b110edc33f348c7707c8c68bb85b4
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:f30a63dda1d95dab65cf2b9e1578bf9ea8dc2947e1790dc2a32ace584bb1512c
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: findCases
    routeId: caseFind
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: caseFind
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
