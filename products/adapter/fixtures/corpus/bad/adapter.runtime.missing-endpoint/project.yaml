# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.runtime.missing-endpoint: this artifact set must be refused with
# exactly adapter.runtime.missing-endpoint. The runtime config binds no endpoint, but the pack declares cases.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.runtime.missing-endpoint/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:ff79c9dd4d6856cb0f959c6956592810f53391de17f3b4f912cd3268b83c8dd8
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:49c0d72a02cc6bf683b17a35eef9ee9a657b306bd98cbc67915fce4035c48366
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
