# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/runtime/runtime.v1alpha1.schema.json
#
# Bad-corpus member adapter.runtime.missing-endpoint, runtime half: checked with
# --runtime runtime.yaml. The runtime binding must be refused with
# exactly adapter.runtime.missing-endpoint. The runtime binding carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.runtime.missing-endpoint/project.yaml --runtime runtime.yaml
apiVersion: id.registrystack.org/formats/adapter/runtime/v1alpha1
kind: AdapterRuntimeConfig
id: case-deployment
endpoints: []
listener:
  bind: 127.0.0.1:8080
database:
  runtimeUrlRef: secret:env/DB_RUNTIME
  migrationUrlRef: secret:env/DB_MIGRATION
oidc:
  issuer: https://issuer.example.invalid
  audience: case-api
audit:
  retentionDays: 90
