apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: graphql
    authentication:
      type: basic
    queryFile: queries/find-cases.graphql
    operationName: FindCases
routeTemplates:
