#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.runtime.insecure-origin-token-endpoint/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:c7a6652dceca4eccf359d8f52d51025afc601ec83fd584a550a5874cd1b75b0c
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:cc1694089f992fa2d70f5738014bf3b97e8b85e77b4cf2aea4663bfd69b1dc77
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
