# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.runtime.insecure-origin-token-endpoint: this artifact set must be refused with
# exactly adapter.runtime.insecure-origin-token-endpoint. The credential's token endpoint is plain HTTP off the loopback exception; the binding's own base URL stays https.
