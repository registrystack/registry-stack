# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.profile-bound: this artifact set must be refused with
# exactly adapter.job.profile-bound. The profile's pageDeadlineMilliseconds lies above its 600000 bound.
#
# The job definition is refused by the job compiler's check_job over the
# pinned pack beside this file (the workspace itself stays clean):
#   job check products/adapter/fixtures/corpus/bad/adapter.job.profile-bound/job.yaml
#     --pack products/adapter/fixtures/corpus/bad/adapter.job.profile-bound/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobo-daily
  version: "1"
source:
  pack:
    id: case-api-pack
    version: "1"
    digest: sha256:a1ab282c264118f5b949a55d7a7c32b2288bd3264a713a8d0e2252110a1e65d1
  route: kobo-submissions
destination:
  type: signed-coordinator-event
  binding: coordinator-test
  workflow: case-ingestion
  trigger: submitted
  source: urn:registry-adapter:job:kobo-daily
  eventType: org.example.case-submitted.v1
  dataSchema: urn:example:schema:case-submitted:v1
projection:
  fields:
    - submission.id
    - submission.status
triggers:
  - kind: interval
    delayMilliseconds: 60000
profile:
  pageDeadlineMilliseconds: 600001
  maximumResponseBytes: 16777216
  maximumPageItems: 500
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 4
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 500
