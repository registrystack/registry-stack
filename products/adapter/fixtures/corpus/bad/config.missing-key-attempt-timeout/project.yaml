#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/config.missing-key-attempt-timeout/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:9994172a6d9021563bc94c72b5d5d658b96d21e8f0dddc5214719beace291ea4
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:5e32460decd68a18b13df16406703f73116b30b04a7c6f761e8ade667ca45e0b
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
