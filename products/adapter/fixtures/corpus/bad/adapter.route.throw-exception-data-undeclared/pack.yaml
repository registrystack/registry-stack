# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.throw-exception-data-undeclared: this artifact set must be refused with
# exactly adapter.route.throw-exception-data-undeclared. throwException supplies a data expression, but the resolved problem declares no dataFields.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.throw-exception-data-undeclared/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - throwException:
          exceptionType: outcome.conflict
          data:
            constant:
              accepted: 1
capabilities: {}

