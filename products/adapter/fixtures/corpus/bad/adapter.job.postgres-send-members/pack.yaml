# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.postgres-send-members: this artifact set must be refused with
# exactly adapter.job.postgres-send-members. The postgres send carries httpMethod, an HTTP-send member a postgres send never takes.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.job.postgres-send-members/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
  - id: ledger
    component: postgres
    authentication:
      type: none
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
    queryFile: queries/ledger.sql
    keyColumn: id
    parameterOrder: [p00]
queryFiles:
  - path: queries/ledger.sql
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{{type}}/{{case_id}}
            pathParameters:
              type:
                constant: welfare
              case_id:
                header: recordId
            query:
              _format:
                constant: json
sourceRoutes:
  - id: kobo-submissions
    scan: ongoing
    nextRecovery: exact-replay
    edits: ordered
    steps:
      - to:
          uri: postgres:ledger
          parameters:
            httpMethod: GET
            queryParameters:
              p00: {constant: 0}
capabilities: {}
