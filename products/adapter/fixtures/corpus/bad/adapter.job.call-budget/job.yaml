# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.call-budget: this artifact set must be refused with
# exactly adapter.job.call-budget. The job's upstream-call budget is 1, below its source route's worst case of 2 (a loop of two sends).
#
# The job definition is refused by the job compiler's check_job over the
# pinned pack beside this file (the workspace itself stays clean):
#   job check products/adapter/fixtures/corpus/bad/adapter.job.call-budget/job.yaml
#     --pack products/adapter/fixtures/corpus/bad/adapter.job.call-budget/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobo-daily
  version: "1"
source:
  pack:
    id: case-api-pack
    version: "1"
    digest: sha256:798215301d5a5507ca01c5d445a0b84521f129b257019b3b1766516ee337a085
  route: kobo-submissions
projection:
  fields:
    - submission.id
    - submission.status
triggers:
  - kind: interval
    delayMilliseconds: 60000
profile:
  pageDeadlineMilliseconds: 300000
  maximumResponseBytes: 16777216
  maximumPageItems: 500
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 1
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 500
