# Bad-corpus member adapter.route.convert-shape: convertBodyTo incorrectly names a source property.
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions: ["1.0"]
endpoints: []
routeTemplates:
  - id: find-cases
    parameters: []
    steps:
      - convertBodyTo:
          type: codeMap:statuses
          name: state
codeMaps:
  - id: statuses
    entries:
      active: ACTIVE
capabilities: {}
