# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.pack.read-support-invalid: pins the exact sibling bytes; the pack carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.pack.read-support-invalid/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:0b4ad5c9239626c442ad5f9af71bcf152bf94580c675e97fd22968b0c5cc68ad
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:d87a75bac095c4e1558801b46f3bcc6d2290d99a690b073fc20162175d8b4a68
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
