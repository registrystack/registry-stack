# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Refuse with exactly adapter.pack.sqlite-extract-invalid: the extract endpoint omits its reviewed SQLite declaration.
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.pack.sqlite-extract-invalid/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:522c321d9c8b193883c8d5ee227616c2596e2b631c345b66a8a6e5d7cfe3f81d
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:446e367d1e652515ffbaad1a72ca044393231d4c62e820fafcae4243187d910d
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
