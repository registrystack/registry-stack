#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.reserved-header-name/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:c49c1082b90d5427f570d65d28192fa707ddeffe2361c2f8f453004d557a049e
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:136c5d4a4a0634d068be011a65ff0a2b986b73b8d5ebf62afe427f5bf7fa3952
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
