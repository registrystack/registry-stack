# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.multiple-non-safe-sends: this artifact set must be refused with
# exactly adapter.route.multiple-non-safe-sends. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.multiple-non-safe-sends/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - idempotentConsumer:
          expression:
            header: Idempotency-Key
          steps:
            - to:
                uri: http:cases
                parameters:
                  httpMethod: POST
                  path: /v2/cases/{{type}}
                  pathParameters:
                    type:
                      header: recordType
                  body:
                    exchangeProperty: record
            - to:
                uri: http:cases
                parameters:
                  httpMethod: POST
                  path: /v2/cases/{{type}}
                  pathParameters:
                    type:
                      header: recordType
                  body:
                    exchangeProperty: record
capabilities:
  components:
    - http
  languages:
    - exchangeProperty
  eips:
    - idempotentConsumer
