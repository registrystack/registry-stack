  version: "1"
  digest: sha256:d2ac3f31182dc034f60b17dee070d09d647fe00dc2e42ff5f9106b0976ceb218
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:d42ac0d09905c41be725610b4cd915ffaa8b474a0b02788843a39d7fdaa6d889
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
