# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.transform-missing: The Consultation binding has no project transformation.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.transform-missing/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: consultation-corpus-base
  version: "1"
consultation:
  contract: https://registry.example/contracts/1.0.0/openapi.yaml
  collections:
    - recordType: case
      registry: urn:registry:case
      view: public
      dataSchema: case-public
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:b69e2ccd33d83741f826b1221950018f69f32d351a403eb595c9f2fc4d803614
artifacts:
  scripts:
    - id: case-public
      file: scripts/case-public.rhai
      digest: sha256:a32ad050ae78f7ca8e98e437a7d39dd4880eb1347056a4cb497f0be10bd6d434
  schemas:
    - id: case-public
      file: schemas/case-public.schema.json
      digest: sha256:60081fff29cdd336fc13179c48ee664625e95198013fb0d41b8be94de10cea5f
recordTypes:
  - name: case
    fields: []
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-retrieve
    operation: retrieve
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
bindingTransforms: {}
accessProfiles:
  - id: case-reader
    scopes: [cases.read]
    operations: [retrieve]
    recordTypes: [case]
