# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.throw-exception-message: this artifact set must be refused with
# exactly adapter.route.throw-exception-message. The route's throwException carries a constant message longer than
# the 512 bytes a raised message may carry.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.throw-exception-message/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - throwException:
          exceptionType: outcome.rejected
          message: The source refused the write. This message exists to overrun the bound, because a route may raise only a bounded constant message, and the checks refuse the step whose message runs longer than the ceiling, so this sentence keeps going past the limit on purpose, adding a few more words, a few more clauses, and one final note that the profile's problemDetail slot, not the route, carries detail to the caller; the message ends here, well past the point where a compliant pack would have stopped writing, and it keeps a little further still, because an off-by-a-few message is exactly the regression this member exists to catch.
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{{type}}/{{case_id}}
            pathParameters:
              type:
                constant: welfare
              case_id:
                header: recordId
            query:
              _format:
                constant: json
              filter[region]:
                constant: west
capabilities: {}
