# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.redelivery-without-upstream-send: this artifact set must be refused with
# exactly adapter.route.redelivery-without-upstream-send. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.redelivery-without-upstream-send/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - onException:
          exception:
            - upstream.timeout
          handled: true
          redeliveryPolicy:
            maximumRedeliveries: 1
          steps:
            - stop: {}
      - setBody:
          constant: "{}"
capabilities:
  languages:
    - constant
  eips:
    - onException
    - stop
