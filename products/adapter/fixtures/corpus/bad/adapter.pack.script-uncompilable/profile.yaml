# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# Bad-corpus member adapter.pack.script-uncompilable: this artifact set must be refused with
# exactly adapter.pack.script-uncompilable. Clean baseline profile.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.pack.script-uncompilable/project.yaml
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: case-api
version: "1"
operations:
  - id: cases.get
    method: GET
    path: /v2/cases/{type}/{case_id}
    responseEnvelope: '{"case": {{record}}, "fetchedAt": "{{requestId}}"}'
problemCodes:
  - cases.missing
problemEnvelope: '{"family": "{{problemCode}}"}'
