# Bad-corpus member adapter.job.destination-shape: the signed event source
# contains whitespace instead of one bounded printable identifier.
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: destination-shape
  version: "1"
source:
  pack:
    id: destination-corpus
    version: "1"
    digest: sha256:62694db0e609ac51191426cafe1e1f3a8e984c1d0d4bfc8833478393580d9420
  route: source
destination:
  type: signed-coordinator-event
  binding: coordinator-test
  workflow: case-ingestion
  trigger: submitted
  source: contains whitespace
  eventType: org.example.case-submitted.v1
  dataSchema: urn:example:schema:case-submitted:v1
projection:
  fields: [id]
triggers:
  - kind: interval
    delayMilliseconds: 60000
profile:
  pageDeadlineMilliseconds: 30000
  maximumResponseBytes: 1048576
  maximumPageItems: 100
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 1
  read:
    maximumFileBytes: 1048576
    maximumRowBytes: 65536
    maximumFieldBytes: 8192
    maximumRowsPerPage: 100
