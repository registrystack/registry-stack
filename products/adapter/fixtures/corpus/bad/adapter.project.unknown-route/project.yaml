  version: "1"
  digest: sha256:d474fc6037fa4a137af75498d143fc6569d328e126e698b69969f8284de68987
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:524acdb5538f5a2c95836ea51e1c831ce70ff8315e441f5d191831c1481d072e
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
