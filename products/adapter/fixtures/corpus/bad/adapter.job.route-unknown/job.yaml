# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.route-unknown: this artifact set must be refused with
# exactly adapter.job.route-unknown. The job names source route nope, which the pinned pack's sourceRoutes do not declare.
#
# The job definition is refused by the job compiler's check_job over the
# pinned pack beside this file (the workspace itself stays clean):
#   job check products/adapter/fixtures/corpus/bad/adapter.job.route-unknown/job.yaml
#     --pack products/adapter/fixtures/corpus/bad/adapter.job.route-unknown/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobo-daily
  version: "1"
source:
  pack:
    id: case-api-pack
    version: "1"
    digest: sha256:d1dc8ed6cd80487611ad137b9462b831a1caac70e1972a88ff51ca2082a7c6e6
  route: nope
projection:
  fields:
    - submission.id
    - submission.status
triggers:
  - kind: interval
    delayMilliseconds: 60000
profile:
  pageDeadlineMilliseconds: 300000
  maximumResponseBytes: 16777216
  maximumPageItems: 500
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 4
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 500
