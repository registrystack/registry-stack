  version: "1"
  digest: sha256:e1c5a4da374cb1e8a2315a405991525540233784f6c3bf5044e20d8eabc48f08
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:4c6d1561ce0252b1453ab42a693950699cb4987d2ae712c8f3c291fb3a5aae6d
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
