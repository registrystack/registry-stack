# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.fixture.unknown-operation: this artifact set must be refused with
# exactly adapter.fixture.unknown-operation. The fixture entry names operation nope, which the profile does not declare.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.fixture.unknown-operation/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:be778d805c62778ed8e00867aa0a7208249fe54c5be659bf34a4ad08556999d5
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:4066067065466f16856d9b8018ebc41f736094bb4c43b943438dd8f969a9574a
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
