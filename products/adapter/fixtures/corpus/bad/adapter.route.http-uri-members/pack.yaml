# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.http-uri-members: this artifact set must be refused with
# exactly adapter.route.http-uri-members. The send carries `httpUri` beside `path`, and a query beside it; an
# http send carries exactly one of path and httpUri, and no query
# beside httpUri.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.http-uri-members/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            httpUri:
              constant: /v2/cases
            path: /v2/cases/{{type}}/{{case_id}}
            pathParameters:
              type:
                constant: welfare
              case_id:
                header: recordId
            query:
              _format:
                constant: json
              filter[region]:
                constant: west
capabilities: {}
