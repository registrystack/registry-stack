# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.pin-digest-mismatch: this artifact set must be refused with
# exactly adapter.project.pin-digest-mismatch. The project pins a profile digest the profile bytes do not hash to (valid hex, wrong value).
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.pin-digest-mismatch/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:bb33e7a0a453504df7bb586384693d34a52c5d9759a8f2d935452d85a98d3022
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: findCases
    routeId: caseFind
bindings:
  - id: case-get
    operation: cases.get
    recordType: case
    route: caseFind
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases.get
    recordTypes:
      - case
