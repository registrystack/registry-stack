# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# Bad-corpus member adapter.runtime.async-wait-exceeds-retention: the checker must emit this exact code. All data is synthetic.
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: case-api
version: '1'
operations:
- id: cases-create
  method: POST
  path: /v2/cases/{type}
  pathParameters:
  - type
  recordTypeParameter: type
  responseEnvelope: '{"case": {{record}}, "fetchedAt": "{{requestId}}"}'
  successStatus: 202
  requestEnvelope: '{"record": {{record}}}'
  asyncCompletion:
    completedStatus: 200
    statusPath: /v2/case/{statusId}
    acceptedEnvelope: '{"link":"{{statusLink}}","expires":"{{statusExpiresAt}}","requestId":"{{requestId}}"}'
problems:
- code: cases.upstream
  status: 502
  title: the source could not be reached
  classes:
  - upstream
  - breaker.open
  - throttle.rejected
  - loop.maximum-iterations-reached
- code: cases.mapping
  status: 422
  title: the request or its mapping was refused
  classes:
  - validation
  - conversion.unmapped
  - aggregation.duplicate
- code: cases.exhausted
  status: 502
  title: the run exhausted a budget
  classes:
  - script
  - budget.exhausted
- code: cases.boundary
  status: 500
  title: the facade refused the call
  classes:
  - disclosure.violation
  - egress.refused
  - credential.rejected
  - outcome
  - facade
problemEnvelope: '{"family": "{{problemCode}}"}'
