# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.upstream-budget-exceeded: this artifact set must be refused with
# exactly adapter.project.upstream-budget-exceeded. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.upstream-budget-exceeded/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: find-cases
    parameters: []
    steps:
      - loop:
          constant: 2
          maximumIterations: 2
          steps:
            - to:
                uri: http:cases
                parameters:
                  httpMethod: GET
                  path: /v2/cases/{type}/{case_id}
                  pathParameters:
                    case_id:
                      header: recordId
capabilities:
  components:
    - http
  eips:
    - loop
