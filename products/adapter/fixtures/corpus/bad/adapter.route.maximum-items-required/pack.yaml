# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.maximum-items-required: this artifact set must be refused with
# exactly adapter.route.maximum-items-required. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.maximum-items-required/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: findCases
    parameters: []
    steps:
      - split:
          expression:
            constant: []
          steps:
            - setBody:
                constant: "{}"
capabilities:
  languages:
    - constant
  eips:
    - split
