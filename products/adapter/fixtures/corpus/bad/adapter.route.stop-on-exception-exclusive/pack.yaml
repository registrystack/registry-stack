# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.stop-on-exception-exclusive: this artifact set must be refused with
# exactly adapter.route.stop-on-exception-exclusive. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.stop-on-exception-exclusive/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - split:
          expression:
            constant: []
          maximumItems: 5
          stopOnException: true
          errorThreshold: 1
          steps:
            - to:
                uri: http:cases
                parameters:
                  httpMethod: GET
                  path: /v2/cases/{{type}}/{{case_id}}
                  pathParameters:
                    type:
                      constant: welfare
                    case_id:
                      header: recordId
capabilities:
  components:
    - http
  languages:
    - constant
    - header
  eips:
    - split
