#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.empty-exception-list/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:3fabf618809fee7ac923f201703aeebabc2cdbcea03797b6eddc49f3bfdde5e9
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:fba4b1df1c24251b7d1ec8eedc8baeee66da6acf5a92ced5a34594df54f53c2c
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
