  version: "1"
  digest: sha256:bb2e077fb81d85df83da6e959fd77e082416bd5c3580603617a1bcbb037af59e
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:fba4b1df1c24251b7d1ec8eedc8baeee66da6acf5a92ced5a34594df54f53c2c
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
