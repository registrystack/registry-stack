apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
id: case-api-example
profile:
  id: case-api
  version: "1"
  digest: sha256:db409e240307ce8164d62430d47adb945c11e25fc864331be94f131af1b0c595
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:c3a536130b278cd3734af6723ffc5ab6f68bf2d9f790acccaea2aa1078ebb825
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: findCases
    routeId: caseFind
bindings:
  - id: case-get
    operation: cases.get
    recordType: case
    route: caseFind
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases.get
    recordTypes:
      - case
