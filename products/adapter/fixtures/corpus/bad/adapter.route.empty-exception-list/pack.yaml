# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.empty-exception-list: this artifact set must be refused with
# exactly adapter.route.empty-exception-list. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.empty-exception-list/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: find-cases
    parameters: []
    steps:
      - onException:
          exception: []
          handled: true
          steps:
            - setBody:
                constant: "{}"
capabilities: {}
