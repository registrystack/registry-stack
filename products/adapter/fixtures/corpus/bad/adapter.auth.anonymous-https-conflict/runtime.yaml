apiVersion: id.registrystack.org/formats/adapter/runtime/v1alpha1
kind: AdapterRuntimeConfig
id: case-deployment
endpoints:
  - endpoint: cases
    baseUrl: https://cases.example.invalid
    anonymousHttps: operator-approved
    credential:
      type: basic
      usernameRef: secret:env/USER
      passwordRef: secret:env/PASS
allowedPrivateCidrs: [10.0.0.0/8]
listener:
  bind: 127.0.0.1:8080
database:
  runtimeUrlRef: secret:env/DB_RUNTIME
  migrationUrlRef: secret:env/DB_MIGRATION
oidc:
  issuer: https://issuer.example.invalid
  audience: case-api
allowedClients: [registry-adapter-example-client]
audit:
  retentionDays: 90
