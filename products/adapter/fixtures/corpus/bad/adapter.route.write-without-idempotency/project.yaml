# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.write-without-idempotency: this artifact set must be refused with
# exactly adapter.route.write-without-idempotency. The write binding dispatches to a route whose POST send sits outside any idempotentConsumer.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.write-without-idempotency/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:7b46f481cc9a3f7c8708a749f7a448be0b6f2e4d307c91103361dbdf7640fed9
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:9ca05af4599df1a1f6b8b5175887c34bb2f15ad2fd07b886326f0349fa27902d
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: findCases
    routeId: caseFind
bindings:
  - id: case-get
    operation: cases.file
    recordType: case
    route: caseFind
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases.get
    recordTypes:
      - case
