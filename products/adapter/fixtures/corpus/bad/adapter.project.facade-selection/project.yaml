# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.facade-selection: The project selects both profile and consultation facades.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.facade-selection/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: consultation-corpus-base
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:fff5366337fd4b83661574db6baf0848dbefc3766d8e569c7cccc5cc2b2524f6
consultation:
  contract: https://registry.example/contracts/1.0.0/openapi.yaml
  collections:
    - recordType: case
      registry: urn:registry:case
      view: public
      dataSchema: case-public
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:778a71f4eae600b2b17f6c6d571981078251dda1fa719b1532c8e0bad10341fa
artifacts:
  scripts:
    - id: case-public
      file: scripts/case-public.rhai
      digest: sha256:a32ad050ae78f7ca8e98e437a7d39dd4880eb1347056a4cb497f0be10bd6d434
  schemas:
    - id: case-public
      file: schemas/case-public.schema.json
      digest: sha256:60081fff29cdd336fc13179c48ee664625e95198013fb0d41b8be94de10cea5f
recordTypes:
  - name: case
    fields: []
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-retrieve
    operation: retrieve
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
bindingTransforms:
  case-retrieve: {script: case-public, entrypoint: project_case_public}
accessProfiles:
  - id: case-reader
    scopes: [cases.read]
    operations: [retrieve]
    recordTypes: [case]
