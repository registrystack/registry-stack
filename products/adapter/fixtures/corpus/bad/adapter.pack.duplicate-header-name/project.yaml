  version: "1"
  digest: sha256:44bdf36e18b03e2b3a5ad38310edd316769cb784ca21c571ef5aa661d16120be
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:2c6ca7d3b45952a09b766ffc64af02e12f56ecb6fd7f234515fd22318e627a2e
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
