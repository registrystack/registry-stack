# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.pack.duplicate-header-name: this artifact set must be refused with
# exactly adapter.pack.duplicate-header-name. The endpoint allowlists the same header name twice
