# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.fixture.empty-upstream: this artifact set must be refused with
# exactly adapter.fixture.empty-upstream. The recorded fixture entry carries no upstream exchange, so the replay
# would have nothing to answer the route's send. The fixture's expected facade response violates the operation's result schema: case_type is an integer where the project declares string.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.fixture.empty-upstream/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:4aabc9dffaa9548190b9ad72832583022265cb11434499b7f72456a5ee3304eb
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:c91d7ee7fe05a7d3cbc834762f369393cca95029804d3f70246aa0eb64f91aa0
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
