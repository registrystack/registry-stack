# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.route.direct-cycle: this artifact set must be refused with
# exactly adapter.route.direct-cycle. Clean baseline pack; another artifact carries the defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.route.direct-cycle/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: find-cases
    parameters: []
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{type}/{case_id}
            pathParameters:
              case_id:
                header: recordId
routes:
  - id: loop-a
    from:
      uri: direct:loop-a
    steps:
      - enrich:
          uri: direct:loop-b
  - id: loop-b
    from:
      uri: direct:loop-b
    steps:
      - enrich:
          uri: direct:loop-a
capabilities:
  components:
    - http
  eips:
    - enrich
