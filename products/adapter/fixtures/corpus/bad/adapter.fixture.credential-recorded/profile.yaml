# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# Bad-corpus member adapter.fixture.credential-recorded: this artifact set must be refused with
# exactly adapter.fixture.credential-recorded. Clean baseline profile; the defect sits in the
# recorded fixture, whose request carries the reserved header `authorization`.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.fixture.credential-recorded/project.yaml
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: case-api
version: "1"
operations:
  - id: cases-get
    method: GET
    path: /v2/cases/{type}
    pathParameters:
      - type
    responseEnvelope: '{"record": {{record}}}'
problems:
  - code: cases.upstream
    status: 502
    title: the source could not be reached
    classes: [upstream, breaker.open, throttle.rejected, loop.maximum-iterations-reached]
  - code: cases.mapping
    status: 422
    title: the request or its mapping was refused
    classes: [validation, conversion.unmapped, aggregation.duplicate]
  - code: cases.exhausted
    status: 502
    title: the run exhausted a budget
    classes: [script, budget.exhausted]
  - code: cases.boundary
    status: 500
    title: the facade refused the call
    classes: [disclosure.violation, egress.refused, credential.rejected, outcome, facade]
problemEnvelope: '{"code": "{{problemCode}}"}'
parameterizedParts: []
