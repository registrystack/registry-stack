apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:53c5f0f5438e0d2b6a90f31a4ae63ba9088371e2d8dbbc6b2ed1ee7c70cf89cb
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:54c650142af6a252a6c5d3c29d81227fdc1238f33bae8ca07ae21460b51f707b
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
