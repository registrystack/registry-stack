# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.parameter-type-mismatch: this artifact set must be refused with
# exactly adapter.project.parameter-type-mismatch. The pack declares integer parameter page_size; the instantiation binds a string.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.parameter-type-mismatch/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: find-cases
    parameters:
      - name: page_size
        type: integer
        required: false
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{type}/{case_id}
            pathParameters:
              case_id:
                header: recordId
routes: []
capabilities: {}
