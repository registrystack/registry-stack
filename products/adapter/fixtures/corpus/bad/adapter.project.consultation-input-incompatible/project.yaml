# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.project.consultation-input-incompatible: The lookup schema requires a name the source route does not support.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.project.consultation-input-incompatible/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: consultation-corpus-base
  version: "1"
consultation:
  contract: https://registry.example/contracts/1.0.0/openapi.yaml
  collections:
    - recordType: case
      registry: urn:registry:case
      view: public
      dataSchema: case-public
      lookup:
        selector: by-id
        inputSchema: lookup
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:18b64715c0ef8c5a78b6bf1aa906e9a6fa1cea026003a6b3cdc2719f8240041e
artifacts:
  scripts:
    - id: case-public
      file: scripts/case-public.rhai
      digest: sha256:a32ad050ae78f7ca8e98e437a7d39dd4880eb1347056a4cb497f0be10bd6d434
  schemas:
    - id: case-public
      file: schemas/case-public.schema.json
      digest: sha256:60081fff29cdd336fc13179c48ee664625e95198013fb0d41b8be94de10cea5f
    - id: lookup
      file: schemas/lookup.schema.json
      digest: sha256:f581697c379481de615e17482ebd3c80a1149a8638f27e89e15dd73999341f03
recordTypes:
  - name: case
    fields: []
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-retrieve
    operation: lookup
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
bindingTransforms:
  case-retrieve: {script: case-public, entrypoint: project_case_public}
accessProfiles:
  - id: case-reader
    scopes: [cases.read]
    operations: [lookup]
    recordTypes: [case]
