  version: "1"
  digest: sha256:9b1dbb5b811a96d1a323f14b2e704d43e0fc38c358d9a5b9144532359560d61b
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:9c49e4c810a1eb6000a3b02c1ec6339171f9dc02433fac9f55dffaae4dc6c1f8
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
