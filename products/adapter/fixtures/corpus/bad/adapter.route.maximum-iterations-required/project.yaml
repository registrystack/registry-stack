    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
