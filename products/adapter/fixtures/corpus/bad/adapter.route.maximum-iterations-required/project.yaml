  version: "1"
  digest: sha256:f5feedd2c2b0ee08886d19492dfcf21809cb415b3224efd4c8fc6f07c800b8d9
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:27206b46faa64d907c156999680494d142892b9ac2deed4a15df555c371fe031
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
