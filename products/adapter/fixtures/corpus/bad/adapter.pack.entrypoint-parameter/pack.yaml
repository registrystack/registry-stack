# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member adapter.pack.entrypoint-parameter: this artifact set must be refused with
# exactly adapter.pack.entrypoint-parameter. The pack carries the adapter.pack.entrypoint-parameter defect.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.pack.entrypoint-parameter/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - setBody:
          rhai:
            file: scripts/case-api.rhai
            entrypoint: shape
scripts:
  - path: scripts/case-api.rhai
    digest: sha256:d80914a831d9ced4c58164fd35eeb47a759a1e5f95456657245949297149d316
capabilities: {}
