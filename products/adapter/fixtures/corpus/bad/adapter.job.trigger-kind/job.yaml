# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/job/job.v1alpha1.schema.json
#
# Bad-corpus member adapter.job.trigger-kind: this artifact set must be refused with
# exactly adapter.job.trigger-kind. The job's only trigger names kind: timer, outside the closed interval-and-hook set.
#
# The job definition is refused by the job compiler's check_job over the
# pinned pack beside this file (the workspace itself stays clean):
#   job check products/adapter/fixtures/corpus/bad/adapter.job.trigger-kind/job.yaml
#     --pack products/adapter/fixtures/corpus/bad/adapter.job.trigger-kind/pack.yaml
apiVersion: id.registrystack.org/formats/adapter/job/v1alpha1
kind: AdapterJob
job:
  id: kobo-daily
  version: "1"
source:
  pack:
    id: case-api-pack
    version: "1"
    digest: sha256:ec42a4e386a15fabf5a75dac0584f1d808e59f803639429cbc180593cb532c87
  route: kobo-submissions
projection:
  fields:
    - submission.id
    - submission.status
triggers:
  - kind: timer
profile:
  pageDeadlineMilliseconds: 300000
  maximumResponseBytes: 16777216
  maximumPageItems: 500
  maximumPageBytes: 1048576
  maximumUpstreamCalls: 4
  read:
    maximumFileBytes: 1073741824
    maximumRowBytes: 1048576
    maximumFieldBytes: 65536
    maximumRowsPerPage: 500
