# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/pack/pack.v1alpha1.schema.json
#
# Bad-corpus member config.out-of-range-maximum-response-bytes: this artifact set must be refused with
# exactly config.out-of-range-maximum-response-bytes. The endpoint exceeds the
# 16 MiB platform format bound. The separate adapter.job.endpoint-response-bound
# member exercises the tighter 1 MiB facade ceiling.
#
# Verify with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/config.out-of-range-maximum-response-bytes/project.yaml
apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1"
testedVersions:
  - "1.0"
endpoints:
  - id: cases
    component: http
    authentication:
      type: basic
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 16777217
routeTemplates:
  - id: find-cases
    parameters:
      - name: type
        type: string
        required: false
      - name: case_id
        type: string
        required: false
    steps:
      - to:
          uri: http:cases
          parameters:
            httpMethod: GET
            path: /v2/cases/{{type}}/{{case_id}}
            pathParameters:
              type:
                constant: welfare
              case_id:
                header: recordId
            query:
              _format:
                constant: json
              filter[region]:
                constant: west
capabilities: {}
