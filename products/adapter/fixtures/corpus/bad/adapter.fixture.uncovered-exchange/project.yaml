# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus member adapter.fixture.uncovered-exchange: this artifact set must be refused with
# exactly adapter.fixture.uncovered-exchange. The recorded fixture's plain read send is covered by no intercept the
# suite declares, so no replay could ever produce the recording. The fixture's expected facade response violates the operation's result schema: case_type is an integer where the project declares string.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.fixture.uncovered-exchange/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:c48c425bd0eb724a11cd748bd692b4767c6d68403b7a7e29e1199aa6197373b7
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:98431e06c18bdf63e6d3183e60718e25d740e1157d29e8fa9c657097b4dd57ab
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
