# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# Bad-corpus member adapter.envelope.invalid-placeholder: this artifact set must be refused with
# exactly adapter.envelope.invalid-placeholder. The response envelope's second placeholder is malformed.
#
# Refuse with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/bad/adapter.envelope.invalid-placeholder/project.yaml
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: case-api
version: "1"
operations:
  - id: cases.get
    method: GET
    path: /v2/cases/{type}/{case_id}
    responseEnvelope: '{"case": {{record}}, "odd": "{{bogus"}'
problemCodes:
  - cases.missing
problemEnvelope: '{"family": "{{problemCode}}"}'
