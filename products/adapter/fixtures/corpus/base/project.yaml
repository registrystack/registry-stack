# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus control workspace (base): adapterctl check must pass
# with zero findings. The project is the clean baseline.
#
# Verify with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/base/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:306773db1d9e41659176699e6ca1bc7365b1751b811eb07933facd6bfd93d074
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:7a7f096f248a14f4c130ec044b8f991afd1fb53888a5c7a4dc32a24a94ff06fc
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: find-cases
    routeId: case-find
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: case-find
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
