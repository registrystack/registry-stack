# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/project/project.v1alpha1.schema.json
#
# Bad-corpus control workspace (base): adapterctl check must pass
# with zero findings. The project is the clean baseline.
#
# Verify with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/base/project.yaml
apiVersion: id.registrystack.org/formats/adapter/project/v1alpha1
kind: AdapterProject
project:
  id: case-api-example
  version: "1"
profile:
  id: case-api
  version: "1"
  digest: sha256:306773db1d9e41659176699e6ca1bc7365b1751b811eb07933facd6bfd93d074
pack:
  id: case-api-pack
  version: "1"
  digest: sha256:87ee6ba5e89ba5f7fa8e1275329c1bd21ab40b2025a0e3ab2aa7813845b1b267
recordTypes:
  - name: case
    fields:
      - name: case_type
        type: string
        required: true
templatedRoutes:
  - routeTemplate: findCases
    routeId: caseFind
bindings:
  - id: case-get
    operation: cases-get
    recordType: case
    route: caseFind
    maximumUpstreamCalls: 4
accessProfiles:
  - id: case-reader
    scopes:
      - cases.read
    operations:
      - cases-get
    recordTypes:
      - case
