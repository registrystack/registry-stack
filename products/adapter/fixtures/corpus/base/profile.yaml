# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/profile/profile.v1alpha1.schema.json
#
# Bad-corpus control workspace (base): adapterctl check must pass
# with zero findings. The profile is the clean baseline.
#
# Verify with:
#   target/debug/adapterctl check products/adapter/fixtures/corpus/base/project.yaml
apiVersion: id.registrystack.org/formats/adapter/profile/v1alpha1
kind: AdapterProfile
id: case-api
version: "1"
operations:
  - id: cases.get
    method: GET
    path: /v2/cases/{type}/{case_id}
    responseEnvelope: '{"case": {{record}}, "fetchedAt": "{{requestId}}"}'
problemCodes:
  - cases.missing
problemEnvelope: '{"family": "{{problemCode}}"}'
