# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/fixture/fixture.v1alpha1.schema.json
#
# Documented fixture (NOT captured): reconstructed from the DHIS2 tracker
# export documentation. In 2.41 the reply carries the entities under
# `trackedEntities` and a `pager` object that is always present with page
# and pageSize; totalPages=true adds total and pageCount (DOCS-T response
# example; dhis2-core 2.41 Page.java). A capture from a live or
# containerized DHIS2 2.41 replaces this reference once run; the 2.40 and
# 2.42 reply shapes differ and only 2.41 is targeted.
#
# The expected facade body echoes the profile envelope's literals: the
# meta registry and dataset identifiers are deployment values the engine
# writes at instantiation, so the replay expectation carries the envelope
# template's stand-in literals.
apiVersion: id.registrystack.org/formats/adapter/fixture/v1alpha1
kind: AdapterFixture
id: dhis2-tracker-search-page
pack: dhis2-tracker
upstreamVersion: "2.41"
provenance:
  type: documented
  reference: https://docs.dhis2.org/en/develop/using-the-api/dhis-core-version-241/tracker.html
intercepts:
  - type: endpoint
    endpoint: tracker
entries:
  - facadeRequest:
      operation: records-search
      path: /v1/records/person
      headers:
        pageSize: "50"
    upstream:
      - request:
          endpoint: tracker
          method: GET
          path: /api/tracker/trackedEntities
          query: order=createdAt%3Adesc&orgUnitMode=ACCESSIBLE&page=1&pageSize=50&program=qyVpUaAYv2A&totalPages=true
        response:
          status: 200
          body:
            pager:
              page: 1
              pageSize: 50
              total: 1
              pageCount: 1
            trackedEntities:
              - trackedEntity: Uid00000001
                trackedEntityType: person
                orgUnit: OqVpUaAYv2B
                createdAt: "2026-01-05T10:00:00.000"
                updatedAt: "2026-02-11T09:30:00.000"
                deleted: false
                inactive: false
                attributes: []
    expected:
      type: response
      status: 200
      body:
        items:
          - tracked_entity_type: person
            org_unit: OqVpUaAYv2B
            created_at: "2026-01-05T10:00:00.000"
            updated_at: "2026-02-11T09:30:00.000"
        pageInfo: {}
        meta:
          registryIdentifier: registryIdentifier
          datasetIdentifier: datasetIdentifier
          entityTypeIdentifier: person
