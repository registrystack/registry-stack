# yaml-language-server: $schema=https://id.registrystack.org/schemas/adapter/fixture/fixture.v1alpha1.schema.json
#
# Documented fixture (NOT captured): the 200-with-error-body case. The
# tracker importer reports its outcome in the summary body, and DHIS2 has
# been observed answering HTTP 200 with a summary whose status is ERROR
# (DHIS2 documentation, "Tracker"; the community thread "Unexpected 409 /
# Exception:null with api/tracker"). The pack's import-failed seam maps
# that answer to the facade's refused-write problem.
apiVersion: id.registrystack.org/formats/adapter/fixture/v1alpha1
kind: AdapterFixture
id: dhis2-tracker-import-error-200
pack: dhis2-tracker
upstreamVersion: "2.41"
provenance:
  kind: documented
  reference: https://community.dhis2.org/t/unexpected-409-exception-null-with-api-tracker/56033
intercepts:
  - kind: endpoint
    endpoint: tracker
entries:
  - given:
      endpoint: tracker
      method: POST
      path: /api/tracker
      query: async=false
      body:
        trackedEntities:
          - trackedEntity: Uid00000004
            orgUnit: MissingOrgUnit0
            attributes: []
    upstreamResponse:
      status: 200
      body:
        status: ERROR
        validationReport:
          errorReports:
            - message: Org unit does not exist.
              errorCode: E1080
              trackerType: ENROLLMENT
              uid: Uid00000004
        stats:
          created: 0
          updated: 0
          deleted: 0
          ignored: 1
          total: 1
    expectedFacadeResponse:
      status: 409
      body:
        type: https://id.registrystack.org/problems/registry-adapter/source.write-rejected
        title: The source refused the write.
        status: 409
        code: source.write-rejected
