apiVersion: registry.registrystack.org/product-contract/v1
product: documents
scope: bootstrap
evidenceStatus: source-mapped-not-executed
evidenceNote: >-
  Test references identify maintained proof obligations. This file does not
  assert that any test ran or passed in a particular review. Rows whose named
  test lives in a PostgreSQL suite are proven only when that suite runs against
  a disposable database under the postgres-test feature.
reviewRule: >-
  This matrix is the baseline every later Document Store change is reviewed
  against. A change that weakens a row rewrites the row in the same commit and
  says why. A row may not lose its negative test. A pending row names the work
  package that owes its enforcement and carries no test until that package
  lands; it becomes partial or enforced only in the change that adds the
  negative test that earns it. Until authentication lands, the served runtime
  answers only its health route; the document invariants are proven through a
  router that only test builds compile, with a synthetic caller standing in
  for the verified token.
invariants:
  - id: DOCUMENTS-SEC-01
    state: enforced
    threat: >-
      A runtime starts on a partly valid configuration, so a refused member is
      silently replaced by a default and the operator never learns which
      setting the service is actually running with.
    enforcementPoint: >-
      The runtime reads its whole configuration through the shared platform
      reader and its own semantic checks before it opens a database
      connection or binds a socket, and reports every finding at once.
    refusal: >-
      Exit before anything binds, naming each refused member at its JSON
      Pointer under its code.
    negativeTest:
      path: crates/registry-documents/src/runtime.rs
      name: a_refused_document_reports_every_finding_before_anything_binds
  - id: DOCUMENTS-SEC-02
    state: enforced
    threat: >-
      A route the product has not designed yet answers, so a caller reaches
      behaviour that no authorization, verification, or audit rule governs.
    enforcementPoint: >-
      The router declares the health route and nothing else; every other path
      and method falls through to the request-edge problem answers.
    refusal: >-
      Answer 404 request.not-found or 405 request.method-not-allowed as
      application/problem+json, with the caller's trace echoed.
    negativeTest:
      path: crates/registry-documents/src/http.rs
      name: every_other_route_is_not_found
  - id: DOCUMENTS-SEC-03
    state: enforced
    threat: >-
      A production deployment connects to PostgreSQL in plaintext, exposing
      database credentials and document metadata on the network.
    enforcementPoint: >-
      The runtime configuration accepts testOnlyPlaintext only in builds with
      the postgres-test feature; an operator build refuses the member.
    refusal: >-
      Refuse the configuration at /database/testOnlyPlaintext before any
      connection is attempted.
    negativeTest:
      path: crates/registry-documents/src/config.rs
      name: plaintext_database_is_refused_outside_test_builds
  - id: DOCUMENTS-SEC-04
    state: enforced
    threat: >-
      An operator disables content verification on a deployment reachable by
      others, so later versions could release bytes no verifier inspected.
    enforcementPoint: >-
      The runtime configuration accepts contentVerification type disabled only
      when the listener declares development-loopback TLS termination.
    refusal: >-
      Refuse with documents.runtime.content-verification-disabled at
      /contentVerification/type.
    negativeTest:
      path: crates/registry-documents/src/config.rs
      name: disabled_content_verification_requires_development_loopback
  - id: DOCUMENTS-SEC-05
    state: enforced
    threat: >-
      Any client the issuer knows can call the Document Store because the
      operator never named the clients the deployment serves.
    enforcementPoint: >-
      The runtime configuration requires an explicit allowedClients list; the
      unrestricted form is refused.
    refusal: >-
      Refuse with documents.runtime.allowed-clients-required at
      /authentication/oidc/allowedClients.
    negativeTest:
      path: crates/registry-documents/src/config.rs
      name: unrestricted_clients_are_refused
  - id: DOCUMENTS-SEC-06
    state: enforced
    threat: >-
      A configuration diagnostic repeats the refused value, leaking a secret
      reference, an environment variable name, or an internal host into logs
      and CI output.
    enforcementPoint: >-
      Runtime and documentsctl diagnostics name the member by JSON Pointer and
      the rule it broke, never the value read from the document.
    refusal: >-
      Report the finding with its pointer, code, and action, and no value.
    negativeTest:
      path: crates/registry-documentsctl/src/lib.rs
      name: a_refused_runtime_configuration_names_the_finding_without_the_value
  - id: DOCUMENTS-SEC-07
    state: enforced
    threat: >-
      A relying application acts on a forged or misrouted answer: a problem
      whose status disagrees with its code, or a response carrying another
      request's trace.
    enforcementPoint: >-
      The Rust client accepts a problem only when its type, status, and trace
      match the pinned vocabulary and the request it sent, and reads bodies
      under a fixed bound.
    refusal: >-
      Surface a protocol failure instead of the problem or the answer.
    negativeTest:
      path: crates/registry-documents-client/tests/http_boundary.rs
      name: a_problem_whose_trace_disagrees_is_a_protocol_failure
  - id: DOCUMENTS-SEC-08
    state: enforced
    threat: >-
      A hook or verifier destination uses plaintext HTTP outside development,
      sending document events or verifier credentials over the network
      unprotected.
    enforcementPoint: >-
      The runtime configuration reads every outbound URL through the shared
      checked URL type and refuses http outside a development-loopback
      deployment.
    refusal: >-
      Refuse with documents.runtime.insecure-url at the destination's url.
    negativeTest:
      path: crates/registry-documents/src/config.rs
      name: a_plaintext_hook_destination_is_refused_outside_development
  - id: DOCUMENTS-SEC-09
    state: enforced
    threat: >-
      A caller downloads bytes that content verification has not marked
      releasable, or bytes whose digest differs from the version requested.
    enforcementPoint: >-
      The download path releases a version only in the releasable state, and
      reads the whole content and checks it against the recorded digest and
      length before the first byte is sent.
    refusal: >-
      Answer 409 document-version.not-releasable for a pending, suspended, or
      rejected version, and 503 service.unavailable, with a storage-integrity
      audit entry and no byte released, when stored content no longer matches.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: an_uploaded_document_is_released_only_after_it_is_verified
  - id: DOCUMENTS-SEC-10
    state: pending
    plannedSlice: WP4
    threat: >-
      A document route answers a caller without a verified bearer token, or
      tells an unauthorized caller whether a document exists.
    enforcementPoint: >-
      Token verification through platform-oidc and access-profile resolution
      run before any document route reads the store, with one uniform 404 for
      a missing and an invisible document.
    refusal: >-
      Answer 401 without a verified token and 404 for every document the
      caller may not see.
    pendingNote: >-
      WP4 adds authentication, access profiles, and document grants, with
      negative tests for an absent token, a foreign client, and the existence
      oracle.
  - id: DOCUMENTS-SEC-11
    state: enforced
    threat: >-
      A credential is taken from the process environment where the operator
      did not mean it to be, or an authored project carries a value an
      operator substitutes per deployment, so the reviewed project is not the
      one that runs.
    enforcementPoint: >-
      The shared runtime loader refuses an environment expression in every
      secret reference, and the project reader refuses one anywhere in
      documents.yaml.
    refusal: >-
      Refuse the file with config.substitution-not-allowed at the member,
      without reading the variable.
    negativeTest:
      path: crates/registry-documents/src/config.rs
      name: shared_runtime_loader_refuses_environment_expressions_in_secret_references
  - id: DOCUMENTS-SEC-12
    state: enforced
    threat: >-
      An access profile written with an empty scope or client list reads as
      both "nobody" and "anybody", and a later runtime resolves it to the
      wider meaning.
    enforcementPoint: >-
      The project reader refuses an empty requiredScopes or requesterClients
      list, and the published schema states the same minimum.
    refusal: >-
      Refuse the project at the empty member.
    negativeTest:
      path: crates/registry-documents-core/src/project.rs
      name: an_empty_scope_or_client_list_is_refused_at_its_member
  - id: DOCUMENTS-SEC-13
    state: partial
    threat: >-
      The runtime serves a project other than the one package.expectedDigest
      pins, so a reviewed package is silently replaced.
    enforcementPoint: >-
      Startup verifies the package at package.root and compares its digest
      with the pin before it reads the project or binds.
    refusal: >-
      Refuse to start with documents.package.digest-mismatch at
      /package/expectedDigest, naming the expected and the found digest in the
      shared shape.
    negativeTest:
      path: crates/registry-documents/src/package.rs
      name: a_package_digest_mismatch_is_refused_in_the_shared_shape
    partialNote: >-
      The shared runtime configuration conformance gate has no Document Store
      row yet, so the gate does not require this test of the runtime. Adding
      the row is a change to the shared platform gate, outside this product.
  - id: DOCUMENTS-SEC-14
    state: enforced
    threat: >-
      Bytes other than the ones the custodian declared become a document
      version, because the upload trusts the body it was sent.
    enforcementPoint: >-
      The upload hashes and counts the body while reading it and finalizes
      only when the computed digest and length equal the reservation's, in
      the finalizing transaction; nothing is written before that check.
    refusal: >-
      Answer 422 upload.digest-mismatch or upload.length-mismatch, keep no
      content and enqueue no verification, and leave the reservation open
      until it expires.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: content_that_differs_from_the_reserved_digest_or_length_never_finalizes
  - id: DOCUMENTS-SEC-15
    state: enforced
    threat: >-
      A caller exhausts memory or storage by sending a body far larger than
      the length it reserved, or than the deployment ceiling.
    enforcementPoint: >-
      The upload route has its own body limit at the deployment ceiling,
      refuses a declared Content-Length above it or different from the
      reserved length, and stops reading at the reserved length plus one
      byte.
    refusal: >-
      Answer 413 request.body-too-large or 422 upload.length-mismatch and keep
      nothing.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: a_body_over_the_reserved_length_is_cut_off_and_keeps_nothing
  - id: DOCUMENTS-SEC-16
    state: enforced
    threat: >-
      Content of a type the policy does not allow enters custody, either
      declared at reservation or switched at upload, or the Store guesses a
      type from the bytes and releases them under it.
    enforcementPoint: >-
      Reservation checks the declared media type against the policy list by
      exact match; the upload requires Content-Type to equal the reserved
      type; the bytes are never inspected for a type, and release serves the
      reserved type.
    refusal: >-
      Answer 422 document.content-type-not-allowed at reservation and 422
      upload.content-type-mismatch at upload.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: a_media_type_outside_the_policy_is_refused_at_reservation_and_at_upload_without_sniffing
  - id: DOCUMENTS-SEC-17
    state: enforced
    threat: >-
      A version is released on a verdict that does not cover it: no verdict,
      a rejection, a verdict on other bytes or another media type, a verdict
      from a verifier the deployment no longer uses, or a job that gave up.
    enforcementPoint: >-
      Release requires the approved state with a verdict recorded against the
      version's computed digest, its media type, and the current verifier
      binding digest; an unavailable verifier schedules a retry, and a
      dead-lettered job records no verdict.
    refusal: >-
      Answer 409 document-version.not-releasable; a dead-lettered job leaves
      the version pending and suspended, never approved or rejected.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: an_unavailable_verifier_never_releases_and_a_dead_letter_neither_approves_nor_rejects
  - id: DOCUMENTS-SEC-18
    state: enforced
    threat: >-
      An operator replaces the content verifier and versions approved under
      the old one keep being released without the new verifier's verdict.
    enforcementPoint: >-
      At startup, every finalized version verified or queued under another
      binding digest is suspended and re-enqueued under the current binding;
      a job keyed to a superseded binding is dead-lettered without a verdict.
    refusal: >-
      Answer 409 document-version.not-releasable until the current verifier
      approves the version again.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: a_verifier_binding_change_at_restart_suspends_and_verifies_again
  - id: DOCUMENTS-SEC-19
    state: enforced
    threat: >-
      Concurrent uploads to one reservation finalize more than once, leaving
      two contents or two verification jobs behind one version.
    enforcementPoint: >-
      Finalization locks the version row and finalizes only a reservation
      still open; no transaction is held while bytes arrive.
    refusal: >-
      A later attempt with the same content gets the one finalized version;
      an attempt after finalization gets 409 upload.finalized.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: concurrent_uploads_of_one_reservation_finalize_once
  - id: DOCUMENTS-SEC-20
    state: enforced
    threat: >-
      A custodian exceeds the per-policy byte quota by sending reservations
      concurrently, each seeing the quota before the others commit.
    enforcementPoint: >-
      Reservation takes a transaction advisory lock per custodian and policy,
      sums finalized and unexpired reserved bytes, and checks the quota
      before it inserts.
    refusal: >-
      Answer 422 custody.quota-exceeded and reserve nothing.
    negativeTest:
      path: crates/registry-documents/tests/postgres_documents.rs
      name: the_custodian_quota_holds_against_concurrent_reservations
