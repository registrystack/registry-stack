      - {path: crates/registry-documents/src/http.rs, name: health_answers_without_a_credential}
      - {path: crates/registry-documents/src/http.rs, name: the_trace_is_echoed_on_a_refusal}
      - {path: crates/registry-documents/tests/postgres_startup.rs, name: a_prepared_runtime_answers_health_and_refuses_every_other_route}
  - id: DOCUMENTS-SEC-03
    tests:
