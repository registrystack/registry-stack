contract: registry.documents.security-test-traceability/v1
scope: bootstrap
executionStatus: not-recorded
note: >-
  Every entry names the tests that carry its invariant. A pending invariant
  has no entry until the work package that enforces it adds its tests. Tests
  under crates/registry-documents/tests run only with the postgres-test
  feature and a disposable database. This file records the obligation, not a
  passing run.
entries:
  - id: DOCUMENTS-SEC-01
    tests:
      - {path: crates/registry-documents/src/runtime.rs, name: a_refused_document_reports_every_finding_before_anything_binds}
      - {path: crates/registry-documents/src/config.rs, name: an_unknown_member_is_refused_by_the_shared_reader}
      - {path: crates/registry-documentsctl/src/lib.rs, name: a_refused_project_is_reported_at_its_member_and_exits_one}
