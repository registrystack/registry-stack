apiVersion: registry.registrystack.org/product-contract/v1
product: documents
scope: bootstrap
purpose: >-
  Behaviour a reader could reasonably mistake for an oversight, recorded as a
  deliberate choice with the reasoning that settled it. A later change may
  overturn any of these, but it overturns the entry in the same commit rather
  than rediscovering the question.
decisions:
  - id: DOCUMENTS-DEC-01
    subject: The served runtime answers only its health route until authentication lands
    decision: >-
      The documents binary serves GET /health and answers request.not-found
      for every other route. The document routes (reserve, upload, read, and
      download) exist, but only builds with the postgres-test feature compile
      the router that carries them, and there a synthetic caller stands in for
      the verified token.
    reasoning: >-
      Authentication and access profiles arrive in WP4. A document route
      served without them would answer callers no authorization rule
      governs, which is worse than no route. Proving the document invariants
      now, behind a test-only router, keeps them from waiting on the token
      work.
    evidence:
      - {path: crates/registry-documents/src/http.rs, name: every_other_route_is_not_found}
      - {path: crates/registry-documents/src/http.rs, name: the_served_router_carries_no_document_route}
      - {path: crates/registry-documents/tests/postgres_startup.rs, name: a_prepared_runtime_answers_health_and_refuses_every_other_route}
  - id: DOCUMENTS-DEC-02
    subject: Serving never applies the schema
    decision: >-
      Startup connects with the runtime credential and refuses a database
      that does not carry exactly this release's schema. Applying the schema
      is a separate step over the migration credential.
    reasoning: >-
      The runtime credential should not hold the rights to change the schema,
      and a schema change should be an operator's deliberate step rather than
      a side effect of a restart.
    evidence:
      - {path: crates/registry-documents/tests/postgres_startup.rs, name: a_runtime_whose_database_refuses_the_credential_does_not_start}
      - {path: crates/registry-documents/tests/postgres_startup.rs, name: a_runtime_over_a_database_without_the_schema_does_not_start}
  - id: DOCUMENTS-DEC-03
    subject: One document version is at most 16 MiB by default, and 64 MiB on S3
    decision: >-
      storage.maximumDocumentBytes defaults to 16 MiB for both storage types.
      PostgreSQL storage accepts no more; S3 storage accepts up to 64 MiB. A
      document policy may only set a lower ceiling.
    reasoning: >-
      The upload is hashed and bounded while read, then buffered under a
      fixed budget of concurrent uploads, so the ceiling stays a small
      multiple of what one buffer may hold. 16 MiB matches the Base Registry
      Engine's attachment ceiling.
    evidence:
      - {path: crates/registry-documents/src/config.rs, name: a_database_ceiling_above_sixteen_mebibytes_is_out_of_range}
      - {path: crates/registry-documents/src/config.rs, name: an_s3_ceiling_above_sixty_four_mebibytes_is_out_of_range}
      - {path: crates/registry-documents/src/config.rs, name: s3_storage_reads_the_shared_object_storage_block}
  - id: DOCUMENTS-DEC-04
    subject: The project file is parsed and bounded but not cross-checked
    decision: >-
      documentsctl check reads documents.yaml against its schema and bounds,
      and refuses unknown members and repeated hook ids, but does not yet
      check references between policies, profiles, and hooks.
    reasoning: >-
      The meaning of those references is defined by the document model and
      access rules, which arrive in WP3 and WP4. Checking them earlier would
      freeze rules that are not designed yet.
    evidence:
      - {path: crates/registry-documents-core/src/project.rs, name: an_unknown_member_is_refused}
      - {path: crates/registry-documents-core/src/project.rs, name: a_repeated_hook_id_is_refused}
      - {path: crates/registry-documentsctl/src/lib.rs, name: the_starter_project_and_runtime_check_clean}
  - id: DOCUMENTS-DEC-05
    subject: Identical content uploaded twice gives two documents
    decision: >-
      Every upload is stored as its own content, in its own S3 object when
      storage is S3, even when the bytes match another version's.
    reasoning: >-
      Sharing content across custodians would let one custodian learn, from
      timing or storage, that another holds the same bytes, and would tie the
      erasure of one document to another's.
    evidence:
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: identical_content_uploaded_twice_gives_two_documents}
      - {path: crates/registry-documents/tests/postgres_s3.rs, name: identical_s3_uploads_are_two_objects}
  - id: DOCUMENTS-DEC-06
    subject: An S3 object a failed upload attempt wrote is left in place
    decision: >-
      Each upload attempt commits a staged row naming a fresh object before
      it writes the object. An attempt that fails, or loses a race to finalize,
      leaves its object and uncommitted row behind; the upload does not try to
      delete it.
    reasoning: >-
      A delete in the failure path can itself fail and would hide the orphan.
      The staged row keeps every such object findable for the cleanup sweep
      WP5 adds.
    evidence:
      - {path: crates/registry-documents/tests/postgres_s3.rs, name: a_failed_object_write_keeps_the_staged_row_and_finalizes_nothing}
  - id: DOCUMENTS-DEC-07
    subject: A dead-lettered verification leaves the version pending and suspended
    decision: >-
      Verification retries an unavailable verifier with backoff from 30
      seconds, doubling to at most one hour, for about seven days, then
      dead-letters the job. The version is neither approved nor rejected, and
      is never erased because of the outage.
    reasoning: >-
      An outage says nothing about the content. Rejecting would discard a
      custodian's document for the verifier's failure; approving would release
      unverified bytes. An operator replays the job once the verifier answers.
    evidence:
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: an_unavailable_verifier_never_releases_and_a_dead_letter_neither_approves_nor_rejects}
  - id: DOCUMENTS-DEC-08
    subject: A verification job is retried, not ended, when the worker holds another verifier binding
    decision: >-
      A verification job runs against the verifier binding its version is
      currently recorded under. A worker whose own binding differs, as while
      two instances with different verifiers run side by side during a
      rollout, retries the job rather than dead-lettering it. Startup cancels
      every pending job under a binding a version has moved away from, and a
      job already leased under such a binding ends without a verdict. A
      verdict that changes no row while the version is still under the same
      binding and not rejected is not delivered: the attempt is refused and
      the job retried once its lease lapses.
    reasoning: >-
      Ending a job because one worker holds the other binding would strand
      the version pending until the next restart sweep, though a worker under
      its own binding could verify it. Retrying costs attempts but never
      records a verdict under the wrong binding: only the version's own
      binding may approve, and the database refuses a releasable row whose
      verdict binding differs from the version's current one. A version an
      older instance finalizes after a newer instance's sweep stays under the
      older binding until a worker under that binding verifies it, a later
      restart sweeps it, or its job dead-letters.
    evidence:
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: a_worker_under_another_binding_leaves_the_job_pending_for_its_own}
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: a_verifier_binding_change_at_restart_suspends_and_verifies_again}
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: a_verdict_that_records_nothing_under_the_current_binding_is_retried}
      - {path: crates/registry-documents/tests/postgres_documents.rs, name: the_database_refuses_a_releasable_version_under_a_stale_or_mismatched_verdict}
