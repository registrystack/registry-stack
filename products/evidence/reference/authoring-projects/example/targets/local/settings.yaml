# Synthetic loopback deployment only. `evidencectl target new --local` fills
# the package, secret, and audit paths under this project and binds the
# project's local signing key.
apiVersion: id.registrystack.org/formats/evidence/target-settings/v1alpha1
kind: EvidenceTargetSettings
governance:
  assuranceProfile: local
  service:
    providerId: urn:example:provider:record-status
    trustDomain: urn:example:trust:record-status
    publicOrigin: http://127.0.0.1:8080
  issuer:
    id: urn:example:issuer:record-status
  authentication:
    oidc:
      issuer: http://127.0.0.1:8082
      audience: urn:example:audience:record-status
      tokenTypes:
      - at+jwt
      algorithms:
      - ES256
      jwksSource:
        kind: uri
        uri: http://127.0.0.1:8082/.well-known/jwks.json
      principalClaim: sub
      requesterTagsClaim: evidence_tags
      evidenceAudienceClaim: evidence_audience
      maximumTokenLifetimeSeconds: 300
      revokedKeyIds: []
  audit:
    hashKeyRef: secret:file/audit-hmac-key
    hashKeyVersion: 1
  subjectBinding:
    secretRef: secret:file/subject-binding-hmac-key
    keyVersion: 1
  rateLimits:
    requestsPerPrincipalPerMinute: 60
    burstPerPrincipal: 16
    failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
  signing:
    format: flattened-jws-json
    algorithm: ES256
    publishedPublicJwkFiles: []
    revokedKeyIds: []
    jwksPath: /.well-known/evidence/jwks.json
    maximumAssertionValiditySeconds: 300
    verifierClockSkewSeconds: 30
  responseFormats:
  - signed-jws
  authorityProfiles:
    record-status-readers:
      kind: explicit-request
      requesterTags:
      - record-status-reader
      grants:
      - requirement: urn:example:requirement:record-status:v1
        purpose: record-status-check
        audienceFrom: authenticated-requester
        responseFormats:
        - signed-jws
        subjects:
        - role: subject
          selectorProfile: record-reference-v1
          valueOrigin: request
runtime:
  apiVersion: registry.registrystack.org/evidence-runtime/v1alpha1
  kind: EvidenceRuntimeConfig
  listener:
    bind: 127.0.0.1:8080
    tlsTermination: operator-controlled-upstream
    trustProxyIdentityHeaders: false
    maximumRequestBytes: 65536
    maximumConcurrentRequests: 64
    requestTimeoutMilliseconds: 10000
    shutdownGraceMilliseconds: 30000
  signer:
    kind: local-jwk
    privateKeyRef: secret:file/signing-p256-private-jwk
  outboundTls:
    systemRoots: true
    trustProfiles: {}
publicKeys: {}
