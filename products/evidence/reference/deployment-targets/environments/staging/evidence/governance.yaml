apiVersion: id.registrystack.org/formats/evidence/target-governance/v1alpha1
kind: EvidenceTargetGovernance
assuranceProfile: production
service: {providerId: https://evidence.staging.example.org, publicOrigin: https://evidence.staging.example.org, trustDomain: https://trust.staging.example.org}
issuer: {uri: https://authority.example.org}
publication: {serviceId: urn:example:staging:evidence-service, title: Staging Evidence service, description: Staging minimum-disclosure Evidence service, endpointUrl: https://evidence.staging.example.org, jurisdictions: [urn:example:jurisdiction:staging]}
authentication:
  oidc:
    issuer: https://issuer.staging.example.org
    audience: evidence.staging.example.org
    tokenTypes: [at+jwt]
    algorithms: [ES256]
    jwksSource:
      type: uri
      uri: https://issuer.staging.example.org/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    allowedClients: unrestricted
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit: {hashKeyRef: secret:file/evidence-audit-hmac, hashKeyVersion: 1}
subjectBinding: {secretRef: secret:file/evidence-subject-binding, keyVersion: 1}
rateLimits: {requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 16, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10}
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/akFVJQnetT36BQl_Sjom_qEihokiSr_7ysxnQQcMN0Y.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats: [signed-jws, sd-jwt-vc]
authorityProfiles:
  example-requester:
    kind: statutory
    requesterTags: [example-requester]
    grants:
      - requirement: urn:example:requirement:record-status:v1
        purpose: record-status-check
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws, sd-jwt-vc]
        subjects: [{role: subject, selectorProfile: record-reference-v1, valueOrigin: request}]
