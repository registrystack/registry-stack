apiVersion: id.registrystack.org/formats/evidence/target/v1alpha1
kind: EvidenceTarget
id: staging
project: example-evidence
package:
  root: /srv/registry-evidence/staging/bundle
authority: authority.yaml
service:
  providerId: https://evidence.staging.example.org
  publicOrigin: https://evidence.staging.example.org
  trustDomain: https://trust.staging.example.org
  issuer: https://authority.example.org
listener:
  bind: 127.0.0.1:8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 64
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 30000
authentication:
  oidc:
    issuer: https://issuer.staging.example.org
    audience: evidence.staging.example.org
    tokenTypes:
    - at+jwt
    algorithms:
    - ES256
    jwksSource:
      type: uri
      uri: https://issuer.staging.example.org/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    allowedClients: unrestricted
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
connections: {}
secretProviders:
  file:
    root: /run/registry-evidence/secrets
signer:
  type: transit
  unixSocketPath: /run/registry-evidence/transit-proxy.sock
  mount: transit
  keyName: evidence-signing
  keyVersion: 7
  attemptTimeoutMilliseconds: 2000
  algorithm: ES256
  publicJwkFile: public-keys/akFVJQnetT36BQl_Sjom_qEihokiSr_7ysxnQQcMN0Y.jwk.json
subjectBinding:
  secretRef: secret:file/evidence-subject-binding
  keyVersion: 1
audit:
  hashKeyRef: secret:file/evidence-audit-hmac
  hashKeyVersion: 1
  path: /var/lib/registry-evidence/staging/evidence.jsonl
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 16
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
assuranceProfile: production
publication:
  serviceId: urn:example:staging:evidence-service
  title: Staging Evidence service
  description: Staging minimum-disclosure Evidence service
  endpointUrl: https://evidence.staging.example.org
  jurisdictions:
  - urn:example:jurisdiction:staging
responseFormats:
- signed-jws
- sd-jwt-vc
outboundTls:
  systemRoots: true
  trustProfiles: {}
