apiVersion: id.registrystack.org/formats/evidence/runtime/v1alpha1
kind: EvidenceRuntimeConfig
package:
  root: /tmp/registry-evidence-local/bundle
listener:
  bind: 127.0.0.1:8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 16
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 10000
secretProviders:
  file: {root: /tmp/registry-evidence-local/secrets}
signer:
  type: local-jwk
  privateKeyRef: secret:file/evidence-signing
audit: {path: /tmp/registry-evidence-local/audit/evidence.jsonl}
outboundTls: {systemRoots: true, trustProfiles: {}}
