type: object
additionalProperties: false
required: [providerFields, pageSize]
properties:
  # Both parameters are pinned. The field list is the projection the protected
  # read applies, and the page size is the smallest one that can still tell a
  # unique match from an ambiguous one, so neither is an operator dial.
  providerFields: {const: "recordReference,region"}
  pageSize: {const: "2"}
