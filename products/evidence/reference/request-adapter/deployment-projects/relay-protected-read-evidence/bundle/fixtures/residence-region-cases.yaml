fixture: registry.evidence.reference.relay-residence-region/v1
synthetic_only: true
common:
  observed_at: "2026-08-02T00:00:00Z"
  selectors:
    subject:
      profile: residence-record-v1
      values: {record_reference: REC-0001}
  derivationSelectorInputs:
    subject:
      profile: residence-record-v1
      values: {record_reference: REC-0001}
  expectedRequestParts:
    query:
      - name: id
        value: REC-0001
      - name: fields
        value: "id,region"
      - name: limit
        value: "2"
    body: null
  expectedTransport:
    path: /v1/datasets/residence-register/entities/residence-record/records
    fixedHeaders:
      - name: Accept
        value: application/json
      - name: Data-Purpose
        value: https://relying.gov.example/purpose/residence-verification
cases:
  # The record carries a field this requirement never asked for. The declared
  # projection drops it before any script runs, so it cannot reach a fact, a
  # derivation, or the signed assertion.
  - id: positive
    response:
      data:
        - id: REC-0001
          region: R-101
          area_geometry: SOURCE-UNRELATED-CANARY
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      facts:
        record_reference: REC-0001
        official_residence_code: R-101
      value: REGION-NORTH

  # A second register code mapping to the same disclosed region proves the
  # mapping is a real narrowing rather than a rename.
  - id: boundary-second-source-code-same-region
    response:
      data:
        - id: REC-0001
          region: R-102
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      value: REGION-NORTH

  - id: boundary-other-region
    response:
      data:
        - id: REC-0001
          region: R-201
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      value: REGION-SOUTH

  # A register code with no reviewed mapping leaves the requirement unresolved.
  # Disclosing the unmapped code, or guessing a region for it, would both cross
  # the minimization boundary this codelist exists to hold.
  - id: negative-unmapped-source-code
    response:
      data:
        - id: REC-0001
          region: R-999
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: match
      publicProblem: evidence_not_available
      derivationRuns: true
      signed: false

  # A record with no region at all is refused by the fact schema, before
  # derivation, so an absent region can never be read as a region.
  - id: missing-fact
    response:
      data:
        - id: REC-0001
      pagination:
        has_more: false
        next_cursor: null
    expected:
      publicProblem: evidence_not_available
      derivationRuns: false
      signed: false

  - id: no-match
    response:
      data: []
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: no_match
      publicProblem: evidence_not_available
      derivationRuns: false
      signed: false

  # Two records on one page is the ordinary ambiguity signal.
  - id: ambiguous-page
    response:
      data:
        - id: REC-0001
          region: R-101
        - id: REC-0002
          region: R-201
      pagination:
        has_more: true
        next_cursor: CURSOR-SYNTHETIC-002
    expected:
      lookup: ambiguous
      publicProblem: evidence_not_available
      derivationRuns: false
      signed: false

  # This envelope reports no total, so a single record on a page that claims
  # further pages is still ambiguous. A provider that paginates an exact
  # reference filter has not proved the match is unique, and Version 1 makes
  # exactly one evidence-data request, so the further pages are never fetched.
  - id: ambiguous-further-pages
    response:
      data:
        - id: REC-0001
          region: R-101
      pagination:
        has_more: true
        next_cursor: CURSOR-SYNTHETIC-002
    expected:
      lookup: ambiguous
      publicProblem: evidence_not_available
      derivationRuns: false
      signed: false

  - id: empty-page-claiming-more
    response:
      data: []
      pagination:
        has_more: true
        next_cursor: CURSOR-SYNTHETIC-002
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: record-without-identifier
    response:
      data:
        - region: R-101
      pagination:
        has_more: false
        next_cursor: null
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: non-string-region
    response:
      data:
        - id: REC-0001
          region: 101
      pagination:
        has_more: false
        next_cursor: null
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  # A provider that ignores the requested page bound is a provider whose
  # ambiguity signal cannot be trusted, so the page is not read at all.
  - id: oversized-page
    response:
      data:
        - id: REC-0001
          region: R-101
        - id: REC-0002
          region: R-201
        - id: REC-0003
          region: R-202
      pagination:
        has_more: false
        next_cursor: null
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  # A record returned under a different reference than the authorized one is an
  # inconsistent input. It collapses publicly with the unresolved classes rather
  # than signing a region for a record nobody asked about.
  - id: returned-subject-mismatch
    response:
      data:
        - id: REC-0002
          region: R-201
      pagination:
        has_more: false
        next_cursor: null
    expected:
      lookup: match
      error: derivation_input_error
      publicProblem: evidence_not_available
      derivationRuns: true
      signed: false

  - id: source-failure
    sourceFailure: timeout
    expected:
      publicProblem: dependency_unavailable
      signed: false

  # A protected read that answers with a sign-in page instead of JSON is a
  # dependency failure, not evidence of anything about the subject.
  - id: source-sign-in-page
    sourceFailure: invalid-media-type
    expected:
      publicProblem: dependency_unavailable
      signed: false

  # The reference is caller-supplied. Rust materializes the transport, so a
  # reference carrying query and header syntax lands percent-encoded inside one
  # query value and cannot add a parameter, widen the field projection, or
  # inject a header.
  - id: hostile-reference
    selectorOverrides:
      subject:
        values: {record_reference: "X&fields=*%0D%0AInjected:yes"}
    expected:
      sourceRequestCount: 1
      expectedTransport:
        path: /v1/datasets/residence-register/entities/residence-record/records
        query: "id=X%26fields%3D%2A%250D%250AInjected%3Ayes&fields=id%2Cregion&limit=2"
        body: null

  - id: output-gate-refuses-a-raw-reference
    derivationMutation: return-raw-reference
    expected:
      outputGate: rejected
      signed: false

  - id: anti-reconstruction
    bundleMutation: duplicate-disclosure-family
    expected: {bundle: rejected}
privacyExpectation:
  evidenceContains:
    - urn:gov:example:concept:residence-region
    - REGION-NORTH
    - REGION-SOUTH
  evidenceExcludes:
    - official_residence_code
    - record_reference
    - residence-record-v1
    - REC-0001
    - REC-0002
    - R-101
    - R-102
    - R-201
    - area_geometry
    - SOURCE-UNRELATED-CANARY
  diagnosticsExclude: [REC-0001, REC-0002, R-101, R-201, SOURCE-UNRELATED-CANARY]
