{
  "apiVersion": "id.registrystack.org/formats/adapter/pack/v1alpha1",
  "kind": "AdapterPack",
  "id": "synthetic-register",
  "version": "1",
  "testedVersions": [],
  "endpoints": [
    {
      "id": "register",
      "component": "http",
      "authentication": {
        "type": "static-authorization"
      },
      "attemptTimeoutMilliseconds": 2000,
      "maximumResponseBytes": 16384
    }
  ],
  "scripts": [
    {
      "path": "scripts/lookup.rhai",
      "digest": "sha256:07d136399c0ae9a475aa35031f968fa87d4b38ea6a277f2e8c4af3a3674c3332"
    }
  ],
  "sourceRoutes": [
    {
      "id": "certificate",
      "evidence": {
        "inputsSchema": {
          "path": "schemas/inputs.json",
          "digest": "sha256:20ee232ee61942c8cd65e73dd0f35faf42e72a39d15215e44f1bafd7a72fe049"
        },
        "factsSchema": {
          "path": "schemas/certificate.json",
          "digest": "sha256:22fb92d948bf940e2c4d33db5a9805c3dbca5f9fdfb72b23e6921c8fff230973"
        },
        "acquisitionPosture": "record-transformed"
      },
      "steps": [
        {
          "setProperty": {
            "name": "record-id",
            "value": {
              "jsonpath": "$.recordId"
            }
          }
        },
        {
          "to": {
            "uri": "http:register",
            "parameters": {
              "httpMethod": "GET",
              "path": "/certificates/{{record-id}}",
              "pathParameters": {
                "record-id": {
                  "exchangeProperty": "record-id"
                }
              }
            }
          }
        },
        {
          "setBody": {
            "rhai": {
              "file": "scripts/lookup.rhai",
              "entrypoint": "certificate"
            }
          }
        }
      ]
    }
  ]
}
