type: object
additionalProperties: false
required:
  - program
  - organisationUnit
  - providerFields
  - pageSize
  - page
  - totalPages
  - validFromAttribute
  - validUntilAttribute
  - restrictionStage
  - completedEventStatus
  - absentRestrictionEventMeansUnrestricted
properties:
  program:
    type: string
    minLength: 1
    maxLength: 128
  organisationUnit:
    type: string
    minLength: 1
    maxLength: 128
  providerFields:
    const: "trackedEntity,attributes[attribute,value],enrollments[program,status,events[programStage,status]]"
  pageSize: {const: "2"}
  page: {const: "1"}
  totalPages: {const: "true"}
  validFromAttribute:
    type: string
    minLength: 1
    maxLength: 128
  validUntilAttribute:
    type: string
    minLength: 1
    maxLength: 128
  restrictionStage:
    type: string
    minLength: 1
    maxLength: 128
  completedEventStatus:
    type: string
    minLength: 1
    maxLength: 32
  absentRestrictionEventMeansUnrestricted: {type: boolean}
