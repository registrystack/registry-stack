apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:gov:example:evidence:dhis2
  publicOrigin: https://evidence.example.org
  trustDomain: urn:gov:example:trust-domain:social-protection
issuer:
  uri: urn:gov:example:issuer:population-authority
authentication:
  oidc:
    issuer: https://identity.gov.example
    audience: registry-evidence
    tokenTypes: [at+jwt]
    algorithms: [ES256]
    jwksSource:
      type: uri
      uri: https://identity.gov.example/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    allowedClients: unrestricted
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-hmac-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/subject-binding-hmac-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 16
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats: [signed-jws]

selectorProfiles:
  tracked-entity-reference-v1:
    maximumAggregateBytes: 64
    fields:
      record_reference:
        type: string
        minimumBytes: 11
        maximumBytes: 64
sourceConnections:
  population-tracker:
    endpoints:
      - endpoint: tracker
        baseUrl: https://dhis2.gov.example
        tlsTrustProfile: government-internal-pki
        clientIdentity: forbidden
        authentication:
          type: basic
sources:
  population-tracker:
    pack:
      id: dhis2-tracker
      version: "1"
      digest: sha256:2f75186175f38b6e099f987f758b90a9375b17b607592a3dc41d3df7e6a286cd
      artifactPrefix: adapter-packs/dhis2-tracker/2f75186175f38b6e099f987f758b90a9375b17b607592a3dc41d3df7e6a286cd
    route: evidence-adult-status
    connection: population-tracker
    inputs:
      recordReference:
        selector:
          role: subject
          profile: tracked-entity-reference-v1
          field: record_reference
    posture: record-transformed
    factSchema: schemas/source-facts/adult-status.schema.json
  professional-licence-register:
    pack:
      id: dhis2-tracker
      version: "1"
      digest: sha256:2f75186175f38b6e099f987f758b90a9375b17b607592a3dc41d3df7e6a286cd
      artifactPrefix: adapter-packs/dhis2-tracker/2f75186175f38b6e099f987f758b90a9375b17b607592a3dc41d3df7e6a286cd
    route: evidence-professional-licence
    connection: population-tracker
    inputs:
      recordReference:
        selector:
          role: subject
          profile: tracked-entity-reference-v1
          field: record_reference
    posture: record-transformed
    factSchema: schemas/source-facts/professional-licence.schema.json
authorityProfiles:
  eligibility-caseworker-v1:
    kind: statutory
    requesterTags: [eligibility-caseworker]
    grants:
      - requirement: urn:gov:example:requirement:adult-status:v1
        purpose: benefit-eligibility
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects:
          - role: subject
            selectorProfile: tracked-entity-reference-v1
            valueOrigin: request
  licence-verifier-v1:
    kind: statutory
    requesterTags: [licence-verifier]
    grants:
      - requirement: urn:gov:example:requirement:professional-licence-status:v1
        purpose: professional-registration-verification
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects:
          - role: subject
            selectorProfile: tracked-entity-reference-v1
            valueOrigin: request
requirements:
  - handle: adult-status
    uri: urn:gov:example:requirement:adult-status:v1
    kind: criterion
    acquisition:
      source: population-tracker
    purposes: [benefit-eligibility]
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles: [tracked-entity-reference-v1]
    referenceFrameworks: [urn:gov:example:framework:age-of-majority:v1]
    evidenceType: urn:gov:example:evidence-type:adult-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 300
    derivation:
      script: derivations/adult-status.rhai
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      parameters: {minimum_age_years: 18}
    concepts:
      - handle: adult-status
        uri: urn:gov:example:concept:adult-status
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/adult-status-cases.yaml
    disclosureGuard:
      families: [urn:gov:example:disclosure-family:adult-status]
    existenceDisclosure: collapse-unresolved
  - handle: professional-licence-status
    uri: urn:gov:example:requirement:professional-licence-status:v1
    kind: criterion
    acquisition:
      source: professional-licence-register
    purposes: [professional-registration-verification]
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles: [tracked-entity-reference-v1]
    referenceFrameworks: [urn:gov:example:framework:professional-practice-licence:v1]
    evidenceType: urn:gov:example:evidence-type:professional-licence-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 300
    derivation:
      script: derivations/professional-licence.rhai
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      parameters:
        active_state: ACTIVE
        expiry_buckets:
          - minimumInclusive:
              type: decimal
              value: '-365000'
            maximumExclusive:
              type: decimal
              value: '0'
            code: expired
          - minimumInclusive:
              type: decimal
              value: '0'
            maximumExclusive:
              type: decimal
              value: '31'
            code: within-30-days
          - minimumInclusive:
              type: decimal
              value: '31'
            maximumExclusive:
              type: decimal
              value: '91'
            code: within-90-days
          - minimumInclusive:
              type: decimal
              value: '91'
            maximumExclusive:
              type: decimal
              value: '365001'
            code: later
    concepts:
      - handle: licence-active
        uri: urn:gov:example:concept:professional-licence-active
        type: boolean
        required: true
        constraints: {}
      - handle: licence-expiry-category
        uri: urn:gov:example:concept:professional-licence-expiry-category
        type: controlled-category
        required: true
        constraints:
          categoryScheme: urn:gov:example:scheme:professional-licence-expiry
          schemeVersion: '1'
          maximumBytes: 32
          codelist: codelists/licence-expiry-categories.yaml
    fixtures: fixtures/professional-licence-cases.yaml
    disclosureGuard:
      families: [urn:gov:example:disclosure-family:professional-licence]
    existenceDisclosure: collapse-unresolved
