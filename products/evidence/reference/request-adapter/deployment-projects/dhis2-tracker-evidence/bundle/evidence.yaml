version: 1
service:
  providerId: urn:gov:example:evidence:dhis2
  trustDomain: urn:gov:example:trust-domain:social-protection
issuer:
  id: urn:gov:example:issuer:population-authority
authentication:
  kind: oidc-access-token
  issuer: https://identity.gov.example
  audiences: [registry-evidence]
  tokenTypes: [at+jwt]
  algorithms: [EdDSA]
  jwksUri: https://identity.gov.example/.well-known/jwks.json
  principalClaim: sub
  requesterTagsClaim: evidence_tags
  evidenceAudienceClaim: evidence_audience
  grantIdClaim: evidence_grant_id
  grantAuthorityClaim: evidence_authority
audit:
  format: keyed-jsonl
  hashSecretRef: secret:file/audit-hmac-key
  hashKeyVersion: 1
  failClosed: true
subjectBinding:
  secretRef: secret:file/subject-binding-hmac-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 10
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: EdDSA
  activeKeyId: evidence-signing-2026-01
  activeKeyRef: secret:file/signing-ed25519-private-jwk
  retiredPublicJwkFiles: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 86400
  verifierClockSkewSeconds: 30
responseFormats: [signed-jws]

selectorProfiles:
  tracked-entity-reference-v1:
    maximumAggregateBytes: 64
    fields:
      record_reference:
        type: string
        minimumBytes: 11
        maximumBytes: 64
sources:
  population-tracker:
    transport: http-json
    baseUrl: https://dhis2.gov.example
    posture: record-transformed
    tlsTrustProfile: government-internal-pki
    authentication:
      kind: basic
      usernameRef: secret:file/dhis2-username
      passwordRef: secret:file/dhis2-password
    request:
      method: GET
      path: /api/tracker/trackedEntities
      fixedHeaders:
        - name: Accept
          value: application/json
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      prepareScript: adapters/prepare.rhai
      adapterParameters:
        program: Prg00000001
        organisationUnit: Org00000001
        providerFields: trackedEntity,attributes[attribute,value]
        pageSize: "2"
        page: "1"
        totalPages: "true"
        dateOfBirthAttribute: Dob00000001
      adapterParametersSchema: schemas/adult-status-adapter-parameters.schema.yaml
      preparationLimits:
        query: required
        jsonBody: forbidden
        maximumQueryPairs: 8
        maximumQueryNameBytes: 64
        maximumQueryValueBytes: 1024
        maximumNormalizedBytes: 4096
      projection:
        - /pager/page
        - /pager/pageSize
        - /pager/total
        - /pager/pageCount
        - /trackedEntities/*/trackedEntity
        - /trackedEntities/*/attributes/*/attribute
        - /trackedEntities/*/attributes/*/value
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    extractScript: adapters/adult-status-extract.rhai
    factSchema: schemas/adult-status-facts.schema.yaml
  professional-licence-register:
    transport: http-json
    baseUrl: https://dhis2.gov.example
    posture: record-transformed
    tlsTrustProfile: government-internal-pki
    authentication:
      kind: basic
      usernameRef: secret:file/dhis2-username
      passwordRef: secret:file/dhis2-password
    request:
      method: GET
      path: /api/tracker/trackedEntities
      fixedHeaders:
        - name: Accept
          value: application/json
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      prepareScript: adapters/prepare.rhai
      adapterParameters:
        program: Prg00000002
        organisationUnit: Org00000001
        providerFields: trackedEntity,attributes[attribute,value],enrollments[program,status,events[programStage,status]]
        pageSize: "2"
        page: "1"
        totalPages: "true"
        validFromAttribute: Vfr00000001
        validUntilAttribute: Vun00000001
        restrictionStage: Rst00000001
        completedEventStatus: COMPLETED
        absentRestrictionEventMeansUnrestricted: true
      adapterParametersSchema: schemas/professional-licence-adapter-parameters.schema.yaml
      preparationLimits:
        query: required
        jsonBody: forbidden
        maximumQueryPairs: 8
        maximumQueryNameBytes: 64
        maximumQueryValueBytes: 1024
        maximumNormalizedBytes: 4096
      projection:
        - /pager/page
        - /pager/pageSize
        - /pager/total
        - /pager/pageCount
        - /trackedEntities/*/trackedEntity
        - /trackedEntities/*/attributes/*/attribute
        - /trackedEntities/*/attributes/*/value
        - /trackedEntities/*/enrollments/*/program
        - /trackedEntities/*/enrollments/*/status
        - /trackedEntities/*/enrollments/*/events/*/programStage
        - /trackedEntities/*/enrollments/*/events/*/status
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    extractScript: adapters/professional-licence-extract.rhai
    factSchema: schemas/professional-licence-facts.schema.yaml
authorityProfiles:
  eligibility-caseworker-v1:
    kind: statutory
    requesterTags: [eligibility-caseworker]
    grants:
      - requirement: urn:gov:example:requirement:adult-status:v1
        purpose: benefit-eligibility
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects:
          - role: subject
            selectorProfile: tracked-entity-reference-v1
            valueOrigin: request
  licence-verifier-v1:
    kind: statutory
    requesterTags: [licence-verifier]
    grants:
      - requirement: urn:gov:example:requirement:professional-licence-status:v1
        purpose: professional-registration-verification
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects:
          - role: subject
            selectorProfile: tracked-entity-reference-v1
            valueOrigin: request
requirements:
  - id: urn:gov:example:requirement:adult-status:v1
    kind: criterion
    source: population-tracker
    purposes: [benefit-eligibility]
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles: [tracked-entity-reference-v1]
    referenceFrameworks: [urn:gov:example:framework:age-of-majority:v1]
    evidenceType: urn:gov:example:evidence-type:adult-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 86400
    derivation:
      script: derivations/adult-status.rhai
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      parameters: {minimum_age_years: 18}
    concepts:
      - id: urn:gov:example:concept:adult-status
        form: boolean
        required: true
        constraints: {}
    fixtures: fixtures/adult-status-cases.yaml
    disclosureGuard:
      families: [urn:gov:example:disclosure-family:adult-status]
    existenceDisclosure: collapse-unresolved
  - id: urn:gov:example:requirement:professional-licence-status:v1
    kind: criterion
    source: professional-licence-register
    purposes: [professional-registration-verification]
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles: [tracked-entity-reference-v1]
    referenceFrameworks: [urn:gov:example:framework:professional-practice-licence:v1]
    evidenceType: urn:gov:example:evidence-type:professional-licence-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 43200
    derivation:
      script: derivations/professional-licence.rhai
      selectorInputs:
        - role: subject
          alternatives:
            - profile: tracked-entity-reference-v1
              fields: [record_reference]
      parameters:
        active_state: ACTIVE
        expiry_buckets:
          - minimumInclusive:
              type: decimal
              value: '-365000'
            maximumExclusive:
              type: decimal
              value: '0'
            code: expired
          - minimumInclusive:
              type: decimal
              value: '0'
            maximumExclusive:
              type: decimal
              value: '31'
            code: within-30-days
          - minimumInclusive:
              type: decimal
              value: '31'
            maximumExclusive:
              type: decimal
              value: '91'
            code: within-90-days
          - minimumInclusive:
              type: decimal
              value: '91'
            maximumExclusive:
              type: decimal
              value: '365001'
            code: later
    concepts:
      - id: urn:gov:example:concept:professional-licence-active
        form: boolean
        required: true
        constraints: {}
      - id: urn:gov:example:concept:professional-licence-expiry-category
        form: controlled-category
        required: true
        constraints:
          categoryScheme: urn:gov:example:scheme:professional-licence-expiry
          schemeVersion: '1'
          maximumBytes: 32
          codelist: codelists/licence-expiry-categories.yaml
    fixtures: fixtures/professional-licence-cases.yaml
    disclosureGuard:
      families: [urn:gov:example:disclosure-family:professional-licence]
    existenceDisclosure: collapse-unresolved
