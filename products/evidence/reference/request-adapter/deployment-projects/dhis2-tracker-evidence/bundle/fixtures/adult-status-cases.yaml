apiVersion: id.registrystack.org/formats/evidence/fixture/v1alpha1
kind: EvidenceFixture
syntheticOnly: true
common:
  observedAt: "2026-08-02T00:00:00Z"
  selectors:
    subject:
      profile: tracked-entity-reference-v1
      values: {record_reference: Tei00000001}
  derivationSelectorInputs:
    subject:
      profile: tracked-entity-reference-v1
      values: {record_reference: Tei00000001}
cases:
  - id: positive
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Dob00000001
                      value: "2000-01-01"
                    - attribute: Oth00000001
                      value: SOURCE-UNRELATED-CANARY
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      facts:
        record_reference: Tei00000001
        date_of_birth: "2000-01-01"
      value: true

  - id: negative-false-is-success
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Dob00000001
                      value: "2010-01-01"
    expected:
      lookup: match
      derivationRuns: true
      facts:
        record_reference: Tei00000001
        date_of_birth: "2010-01-01"
      value: false
      signed: true

  - id: boundary-on
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Dob00000001
                      value: "2008-08-02"
    expected:
      lookup: match
      derivationRuns: true
      signed: true
      facts:
        record_reference: Tei00000001
        date_of_birth: "2008-08-02"
      value: true

  - id: missing-fact
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Oth00000001
                      value: SOURCE-UNRELATED-CANARY
    expected:
      lookup: unresolved
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false

  - id: no-match
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 0
                pageCount: 0
              trackedEntities: []
    expected:
      lookup: no_match
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false

  - id: ambiguous
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 2
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes: []
                # The second record carries no reference of its own, only the
                # attribute list the projection insists on. The pager decides this page
                # before any record is read, so a response shape that demanded a
                # complete record here would turn an ordinary ambiguous lookup into a
                # source-protocol failure.
                - attributes: []
    expected:
      lookup: ambiguous
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false

  # A tracker page whose envelope is truncated, inconsistent, or wrongly typed is
  # never read as an authoritative no-match, unique match, or duplicate.
  - id: truncated-pager
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes: []
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: pager-count-mismatch
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 2
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes: []
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: total-collection-mismatch
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities: []
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: fractional-total
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1.5
                pageCount: 1
              trackedEntities: []
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  # One tracked entity carrying the configured attribute twice, or carrying it
  # with a non-string value, is a provider or configuration fault rather than a
  # record that legitimately lacks a date of birth.
  - id: duplicate-configured-attribute
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Dob00000001
                      value: "2000-01-01"
                    - attribute: Dob00000001
                      value: "2010-01-01"
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: non-string-attribute-value
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000001
                  attributes:
                    - attribute: Dob00000001
                      value: 20000101
    expected:
      error: source_protocol_error
      derivationRuns: false
      signed: false

  - id: returned-subject-mismatch
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=Tei00000001"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager:
                page: 1
                pageSize: 2
                total: 1
                pageCount: 1
              trackedEntities:
                - trackedEntity: Tei00000002
                  attributes:
                    - attribute: Dob00000001
                      value: "2000-01-01"
    expected:
      lookup: match
      error: derivation_input_error
      publicProblem: evidence.unavailable
      derivationRuns: true
      signed: false

  - id: source-failure
    sourceFailure: timeout
    expected:
      publicProblem: source.unavailable
      signed: false

  # An expired provider session answers a JSON request with an HTML sign-in page.
  - id: source-html-sign-in-page
    sourceFailure: invalid-media-type
    expected:
      publicProblem: source.unavailable
      signed: false

  - id: hostile-reference
    selectorOverrides:
      subject:
        values: {record_reference: "X&fields=*%0D%0AInjected:yes"}
    acquisition:
      intercepts:
        - type: endpoint
          endpoint: tracker
      exchanges:
        - request:
            endpoint: tracker
            method: GET
            path: /api/tracker/trackedEntities
            query: "fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=X%26fields%3D%2A%250D%250AInjected%3Ayes"
            headers:
              accept: application/json
          response:
            status: 200
            body:
              pager: {page: 1, pageSize: 2, total: 0, pageCount: 0}
              trackedEntities: []
    expected:
      lookup: no_match
      publicProblem: evidence.unavailable
      derivationRuns: false
      signed: false
      sourceRequestCount: 1

  - id: anti-reconstruction
    bundleMutation: duplicate-disclosure-family
    expected: {bundle: rejected}
privacyExpectation:
  evidenceContains: [urn:gov:example:concept:adult-status]
  evidenceExcludes: [date_of_birth, record_reference, tracked-entity-reference-v1, Tei00000001, Tei00000002]
  diagnosticsExclude: [Tei00000001, Tei00000002, "2000-01-01", SOURCE-UNRELATED-CANARY]
