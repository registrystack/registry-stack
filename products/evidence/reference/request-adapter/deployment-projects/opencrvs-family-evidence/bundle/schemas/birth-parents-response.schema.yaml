# Shape of the projected event-search response, checked before extraction runs.
# maxItems states the same page ceiling the request asks for, so an oversized
# page is refused before any record reaches the script.
type: object
additionalProperties: false
required: [total, results]
properties:
  total:
    type: integer
    minimum: 0
    maximum: 1000000
  results:
    type: array
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      # No projected leaf can be required of every record. Projection drops a
      # leaf the record did not carry, and an ambiguous page is decided before
      # any record is read, so a record on that page need not be complete.
      # Which leaves a single matched record must carry stays with the script.
      # declaration is the one member a record cannot omit, because projection
      # rejects a record missing an intermediate its children hang from, so
      # saying so here would only repeat the projection.
      required: []
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          minLength: 1
          maxLength: 64
        trackingId:
          type: string
          minLength: 1
          maxLength: 64
        declaration:
          type: object
          additionalProperties: false
          # Either parent reference may be absent from a registered record, so
          # neither is required here. How many must be present, and whether the
          # two may repeat one person, stays with the script: both are relations
          # between fields that a shape cannot state.
          required: []
          properties:
            mother.personReference:
              type: string
              minLength: 1
              maxLength: 128
            father.personReference:
              type: string
              minLength: 1
              maxLength: 128
