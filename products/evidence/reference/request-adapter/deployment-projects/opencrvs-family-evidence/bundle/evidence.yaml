apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:gov:example:evidence:opencrvs
  publicOrigin: https://evidence.example.org
  trustDomain: urn:gov:example:trust-domain:civil-registration
issuer:
  uri: urn:gov:example:issuer:civil-registration-authority
authentication:
  oidc:
    issuer: https://identity.gov.example
    audience: registry-evidence
    allowedClients:
      - casework-agent
    tokenTypes:
      - at+jwt
    algorithms:
      - ES256
    jwksSource:
      type: uri
      uri: https://identity.gov.example/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-hmac-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/subject-binding-hmac-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 16
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats:
  - signed-jws
selectorProfiles:
  opencrvs-tracking-id-v1:
    maximumAggregateBytes: 64
    fields:
      tracking_id:
        type: string
        minimumBytes: 1
        maximumBytes: 64
  civil-person-reference-v1:
    maximumAggregateBytes: 128
    fields:
      person_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 128
sources:
  registered-birth-date:
    pack:
      id: opencrvs-events
      version: "1"
      digest: sha256:41138c64e55b756317778b3a4e95673f10559fc99ded22a699791f7913f52f9a
      artifactPrefix: adapter-packs/opencrvs-events/41138c64e55b756317778b3a4e95673f10559fc99ded22a699791f7913f52f9a
    route: evidence-birth-date
    connection: opencrvs
    inputs:
      trackingId:
        selector:
          role: subject
          profile: opencrvs-tracking-id-v1
          field: tracking_id
    posture: record-transformed
    factSchema: schemas/birth-adult-facts.schema.yaml
  registered-birth-parents:
    pack:
      id: opencrvs-events
      version: "1"
      digest: sha256:41138c64e55b756317778b3a4e95673f10559fc99ded22a699791f7913f52f9a
      artifactPrefix: adapter-packs/opencrvs-events/41138c64e55b756317778b3a4e95673f10559fc99ded22a699791f7913f52f9a
    route: evidence-birth-parents
    connection: opencrvs
    inputs:
      trackingId:
        selector:
          role: child
          profile: opencrvs-tracking-id-v1
          field: tracking_id
    posture: record-transformed
    factSchema: schemas/birth-parents-facts.schema.yaml
authorityProfiles:
  civil-registration-caseworker-v1:
    requesterClients:
      - casework-agent
    grantSourceIssuer: https://casework.gov.example
    kind: statutory
    requesterTags:
      - civil-registration-caseworker
    grants:
      - requirement: urn:gov:example:requirement:adult-status-from-birth:v1
        purpose: eligibility-assessment
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
        subjects:
          - role: subject
            selectorProfile: opencrvs-tracking-id-v1
            valueOrigin: request
      - requirement: urn:gov:example:requirement:registered-parent-relationship:v1
        purpose: family-relationship-verification
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
        subjects:
          - role: child
            selectorProfile: opencrvs-tracking-id-v1
            valueOrigin: request
          - role: candidate-parent
            selectorProfile: civil-person-reference-v1
            valueOrigin: authenticated-grant
            valueClaims:
              person_reference: grant.candidate_parent.person_reference
      - requirement: urn:gov:example:requirement:identify-registered-parents:v1
        purpose: family-case-record
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
        subjects:
          - role: child
            selectorProfile: opencrvs-tracking-id-v1
            valueOrigin: request
requirements:
  - handle: adult-status-from-birth
    uri: urn:gov:example:requirement:adult-status-from-birth:v1
    kind: criterion
    acquisition:
      source: registered-birth-date
    purposes:
      - eligibility-assessment
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - opencrvs-tracking-id-v1
    referenceFrameworks:
      - urn:gov:example:framework:age-of-majority:v1
    evidenceType: urn:gov:example:evidence-type:adult-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 300
    derivation:
      script: derivations/adult-status.rhai
      selectorInputs:
        - role: subject
          alternatives:
            - profile: opencrvs-tracking-id-v1
              fields:
                - tracking_id
      parameters:
        minimum_age_years: 18
    concepts:
      - handle: adult-status
        uri: urn:gov:example:concept:adult-status
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/adult-status-cases.yaml
    disclosureGuard:
      families:
        - urn:gov:example:disclosure-family:adult-status
    existenceDisclosure: collapse-unresolved
  - handle: registered-parent-relationship
    uri: urn:gov:example:requirement:registered-parent-relationship:v1
    kind: criterion
    acquisition:
      source: registered-birth-parents
    purposes:
      - family-relationship-verification
    subjectRoles:
      - role: child
        cardinality: one
        selectorProfiles:
          - opencrvs-tracking-id-v1
      - role: candidate-parent
        cardinality: one
        selectorProfiles:
          - civil-person-reference-v1
    referenceFrameworks:
      - urn:gov:example:framework:civil-registration-parent-record:v1
    evidenceType: urn:gov:example:evidence-type:registered-parent-relationship:v1
    validitySeconds: 300
    derivation:
      script: derivations/registered-parent-relationship.rhai
      selectorInputs:
        - role: child
          alternatives:
            - profile: opencrvs-tracking-id-v1
              fields:
                - tracking_id
        - role: candidate-parent
          alternatives:
            - profile: civil-person-reference-v1
              fields:
                - person_reference
      parameters:
        matching_policy: exact-opaque-reference-v1
        candidate_reference_namespace: urn:gov:example:opencrvs:person
        relationship_set_contract: urn:gov:example:opencrvs:registered-parent-set:v1
    concepts:
      - handle: relationship-confirmed
        uri: urn:gov:example:concept:registered-parent-relationship-confirmed
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/registered-parent-relationship-cases.yaml
    disclosureGuard:
      families:
        - urn:gov:example:disclosure-family:registered-parent-relationship
    existenceDisclosure: collapse-unresolved
  - handle: identify-registered-parents
    uri: urn:gov:example:requirement:identify-registered-parents:v1
    kind: information-requirement
    acquisition:
      source: registered-birth-parents
    purposes:
      - family-case-record
    subjectRoles:
      - role: child
        cardinality: one
        selectorProfiles:
          - opencrvs-tracking-id-v1
    referenceFrameworks:
      - urn:gov:example:framework:civil-registration-parent-record:v1
    evidenceType: urn:gov:example:evidence-type:registered-parent-references:v1
    validitySeconds: 300
    derivation:
      script: derivations/registered-parent-references.rhai
      selectorInputs:
        - role: child
          alternatives:
            - profile: opencrvs-tracking-id-v1
              fields:
                - tracking_id
      parameters:
        reference_namespace: urn:gov:example:opencrvs:person
        relationship_set_contract: urn:gov:example:opencrvs:registered-parent-set:v1
    concepts:
      - handle: parent-references
        uri: urn:gov:example:concept:registered-parent-references
        type: entity-reference-list
        required: true
        constraints:
          minimumItems: 1
          maximumItems: 2
          unique: true
    fixtures: fixtures/registered-parent-references-cases.yaml
    disclosureGuard:
      families:
        - urn:gov:example:disclosure-family:registered-parent-references
    existenceDisclosure: collapse-unresolved
sourceConnections:
  opencrvs:
    endpoints:
      - endpoint: events
        baseUrl: https://events.opencrvs.gov.example
        clientIdentity: forbidden
        authentication:
          type: oauth2-client-credentials
          tokenEndpoint: https://auth.opencrvs.gov.example/token
          scope: recordsearch
          credentialPlacement: form-body
