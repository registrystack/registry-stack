# Shape of the projected event-search response, checked by Rust before
# extract/2 runs. Neither parent reference is required: a registered record may
# name one parent or two, and how many suffice is a requirement decision the
# script keeps.
type: object
additionalProperties: false
required: [total, results]
properties:
  total: {type: integer, minimum: 0, maximum: 1000000}
  results:
    type: array
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      # No projected leaf can be required of every record. Projection drops a
      # leaf the record did not carry, and an ambiguous page is decided before
      # any record is read, so a record on that page need not be complete.
      # Which leaves a single matched record must carry stays with the script.
      # declaration is the one member a record cannot omit, because projection
      # rejects a record missing an intermediate its children hang from, so
      # saying so here would only repeat the projection.
      required: []
      properties:
        type: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, minLength: 1, maxLength: 64}
        trackingId: {type: string, minLength: 1, maxLength: 64}
        declaration:
          type: object
          additionalProperties: false
          required: []
          properties:
            mother.personReference: {type: string, minLength: 1, maxLength: 128}
            father.personReference: {type: string, minLength: 1, maxLength: 128}
