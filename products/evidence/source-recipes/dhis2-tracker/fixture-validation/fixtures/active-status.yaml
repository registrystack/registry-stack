apiVersion: id.registrystack.org/formats/evidence/fixture/v1alpha1
kind: EvidenceFixture
syntheticOnly: true
common:
  observedAt: '2026-10-26T00:00:00Z'
  selectors:
    subject:
      profile: dhis2-tracked-entity-id-v1
      values: {record_reference: TeiSynthetic01}
cases:
- id: success
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 1, pageCount: 1}
          trackedEntities:
          - trackedEntity: TeiSynthetic01
            attributes: [{attribute: Sta00000001, value: ACTIVE}]
  expected: {lookup: match, derivationRuns: true, value: true, signed: true}
- id: no-match
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 0, pageCount: 0}
          trackedEntities: []
  expected: {lookup: no_match, publicProblem: evidence.unavailable, derivationRuns: false, signed: false}
- id: ambiguous
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 2, pageCount: 1}
          trackedEntities: [{attributes: []}, {attributes: []}]
  expected: {lookup: ambiguous, publicProblem: evidence.unavailable, derivationRuns: false, signed: false}
- id: pager-protocol-mismatch
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 1, pageCount: 2}
          trackedEntities:
          - trackedEntity: TeiSynthetic01
            attributes: [{attribute: Sta00000001, value: ACTIVE}]
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
- id: returned-identity-mismatch
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 1, pageCount: 1}
          trackedEntities:
          - trackedEntity: TeiSyntheticOther
            attributes: [{attribute: Sta00000001, value: ACTIVE}]
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
- id: returned-identity-type-mismatch
  acquisition:
    intercepts: [{type: endpoint, endpoint: tracker}]
    exchanges:
    - request:
        endpoint: tracker
        method: GET
        path: /api/tracker/trackedEntities
        query: fields=trackedEntity%2Cattributes%5Battribute%2Cvalue%5D&orgUnitMode=SELECTED&orgUnits=Org00000001&page=1&pageSize=2&program=Prg00000001&totalPages=true&trackedEntities=TeiSynthetic01
        headers: {accept: application/json}
      response:
        status: 200
        body:
          pager: {page: 1, pageSize: 2, total: 1, pageCount: 1}
          trackedEntities:
          - trackedEntity: 1001
            attributes: [{attribute: Sta00000001, value: ACTIVE}]
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
privacyExpectation:
  evidenceContains: [urn:example:concept:dhis2-recipe-active-status:v1]
  evidenceExcludes: [record_reference, status_code, TeiSynthetic01, TeiSyntheticOther]
  diagnosticsExclude: [TeiSynthetic01, TeiSyntheticOther]
