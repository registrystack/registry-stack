apiVersion: id.registrystack.org/formats/evidence/fixture/v1alpha1
kind: EvidenceFixture
syntheticOnly: true
common:
  observedAt: '2026-10-26T00:00:00Z'
  selectors:
    child:
      profile: opencrvs-tracking-id-v1
      values: {tracking_id: TrackingSynthetic01}
cases:
- id: success
  acquisition:
    intercepts:
    - {type: endpoint, endpoint: events}
    - {type: token-endpoint, endpoint: events}
    exchanges:
    - request: {endpoint: events, tokenRequest: true, method: POST, path: /token}
      response:
        status: 200
        body: {access_token: synthetic-replay-token, token_type: Bearer, expires_in: 300}
    - request:
        endpoint: events
        method: POST
        path: /events/search
        headers: {accept: application/json}
        body:
          query:
            type: and
            clauses:
            - eventType: birth
              status: {type: exact, term: REGISTERED}
              trackingId: {type: exact, term: TrackingSynthetic01}
          limit: 2
          offset: 0
      response:
        status: 200
        body:
          total: 1
          results:
          - type: birth
            status: REGISTERED
            trackingId: TrackingSynthetic01
            declaration: {mother.personReference: PersonSyntheticA}
  expected: {lookup: match, derivationRuns: true, value: true, signed: true}
