    - type: death
      status: REGISTERED
      trackingId: TrackingSynthetic01
      declaration: {mother.personReference: PersonSyntheticA}
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
- id: returned-identity-mismatch
  response:
    total: 1
    results:
    - type: birth
      status: REGISTERED
      trackingId: TrackingSyntheticOther
      declaration: {mother.personReference: PersonSyntheticA}
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
- id: returned-identity-type-mismatch
  response:
    total: 1
    results:
    - type: birth
      status: REGISTERED
      trackingId: [TrackingSynthetic01]
      declaration: {mother.personReference: PersonSyntheticA}
  expected: {error: source_protocol_error, derivationRuns: false, signed: false}
privacyExpectation:
  evidenceContains: [urn:example:concept:opencrvs-recipe-registered-parent:v1]
