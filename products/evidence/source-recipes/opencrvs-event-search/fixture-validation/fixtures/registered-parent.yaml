  selectors:
    child:
      profile: opencrvs-tracking-id-v1
      values: {tracking_id: TrackingSynthetic01}
  expectedRequestParts:
    query: []
    body:
      query:
        type: and
        clauses:
        - eventType: birth
          status: {type: exact, term: REGISTERED}
          trackingId: {type: exact, term: TrackingSynthetic01}
      limit: 2
      offset: 0
