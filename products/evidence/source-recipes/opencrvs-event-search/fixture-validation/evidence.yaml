apiVersion: id.registrystack.org/formats/evidence/project/v1alpha1
kind: EvidenceProject
id: opencrvs-event-search-recipe-validation
selectorProfiles:
  validation-seed:
    maximumAggregateBytes: 8
    fields:
      id: {type: string, minimumBytes: 1, maximumBytes: 8}
functions:
- id: derive-registered-parent
  interface: assertion-derive/v1
  source: functions/derive-registered-parent.rhai
- id: validation-seed-derive
  interface: assertion-derive/v1
  source: functions/validation-seed-derive.rhai
sources:
  validation-seed:
    pack: {id: validation-seed, version: '1'}
    route: validation-seed
    connection: validation-seed
    acquisitionPosture: record-transformed
    inputs:
      id: {selector: {role: seed, profile: validation-seed, field: id}}
assertionDefinitions:
  validation-seed:
    question: Does the local validation seed match?
    semantics:
      requirement: urn:example:requirement:source-recipe-validation-seed:v1
      kind: criterion
      evidenceType: urn:example:evidence-type:source-recipe-validation-seed:v1
      referenceFrameworks: [urn:example:framework:source-recipe-validation:v1]
    purpose: source-recipe-validation
    grantCeiling:
      authorities: [organizational]
      actorKinds: [service]
      valueOrigins: [request]
      audiences: [urn:example:audience:source-recipe-validator]
    subjects: [{role: seed, selectors: [validation-seed]}]
    acquisition: {source: validation-seed}
    derive: {function: validation-seed-derive}
    outputs:
      matched: {concept: 'urn:example:concept:source-recipe-validation-seed:v1', type: boolean}
    validitySeconds: 60
    subjectBinding: audience-scoped
    representations: [signed-jws]
# SOURCE_RECIPE_ASSERTION_DEFINITIONS
