apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:example:fixture:provider:evidence
  publicOrigin: https://evidence.invalid
  trustDomain: urn:example:fixture:trust-domain:acceptance
issuer:
  uri: urn:example:fixture:issuer:authority
publication:
  serviceId: urn:example:fixture:service:evidence
  title: Synthetic Evidence service
  description: Synthetic minimum-disclosure assertions for acceptance testing
  endpointUrl: https://evidence.example.invalid
  jurisdictions:
    - urn:example:jurisdiction:acceptance
authentication:
  oidc:
    issuer: https://identity.invalid
    audience: evidence-fixture
    tokenTypes:
      - at+jwt
    algorithms:
      - ES256
    jwksSource:
      type: uri
      uri: https://identity.invalid/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    allowedClients: unrestricted
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-hash-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/subject-binding-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 10
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats:
  - signed-jws
selectorProfiles:
  person-demographics-v1:
    maximumAggregateBytes: 420
    fields:
      given_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      family_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      birth_date:
        type: date
sources:
  source-a:
    pack:
      id: fixture-adult
      version: "1"
      digest: sha256:c103a586cb16cc65d0a780e302b2369f568b8f0eec3027e6cfdf6e958ad7bb47
      artifactPrefix: adapter-packs/fixture-adult/c103a586cb16cc65d0a780e302b2369f568b8f0eec3027e6cfdf6e958ad7bb47
    route: lookup
    connection: provider
    inputs:
      given_name:
        selector:
          role: subject
          profile: person-demographics-v1
          field: given_name
      family_name:
        selector:
          role: subject
          profile: person-demographics-v1
          field: family_name
      birth_date:
        selector:
          role: subject
          profile: person-demographics-v1
          field: birth_date
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
authorityProfiles:
  statutory-caseworker-v1:
    kind: statutory
    requesterTags:
      - fixture-agency
    grants:
      - requirement: urn:example:fixture:requirement:adult-status:v1
        purpose: fixture-eligibility
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
        subjects:
          - role: subject
            selectorProfile: person-demographics-v1
            valueOrigin: request
requirements:
  - handle: adult-status
    uri: urn:example:fixture:requirement:adult-status:v1
    kind: criterion
    acquisition:
      source: source-a
    purposes:
      - fixture-eligibility
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - person-demographics-v1
    referenceFrameworks:
      - urn:example:fixture:framework:adult-status:v1
    evidenceType: urn:example:fixture:evidence-type:adult-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 300
    derivation:
      script: derivations/adult-status.rhai
      parameters:
        minimum_age_years: 18
    concepts:
      - handle: is_adult
        uri: urn:example:fixture:concept:adult-status
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:adult-status
    existenceDisclosure: collapse-unresolved
sourceConnections:
  provider:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: static-authorization
        clientIdentity: forbidden
