apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:example:fixture:provider:evidence
  publicOrigin: https://evidence.invalid
  trustDomain: urn:example:fixture:trust-domain:acceptance
issuer:
  uri: urn:example:fixture:issuer:authority
publication:
  serviceId: urn:example:fixture:service:evidence
  title: Synthetic Evidence service
  description: Synthetic minimum-disclosure assertions for acceptance testing
  endpointUrl: https://evidence.example.invalid
  jurisdictions:
    - urn:example:jurisdiction:acceptance
authentication:
  oidc:
    issuer: https://identity.invalid
    audience: evidence-fixture
    allowedClients:
      - evidence-task-agent
    tokenTypes:
      - at+jwt
    algorithms:
      - ES256
    jwksSource:
      type: uri
      uri: https://identity.invalid/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-hash-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/subject-binding-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 10
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats:
  - signed-jws
  - unsigned-json
selectorProfiles:
  person-demographics-v1:
    maximumAggregateBytes: 420
    fields:
      given_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      family_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      birth_date:
        type: date
  residence-record-v1:
    maximumAggregateBytes: 96
    fields:
      record_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 96
  licence-register-v1:
    maximumAggregateBytes: 128
    fields:
      licence_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 96
      registry_region:
        type: controlled-code
        codelist: codelists/professional-registry-regions.yaml
        codelistVersion: "1"
        maximumBytes: 16
  civil-record-reference-v1:
    maximumAggregateBytes: 96
    fields:
      record_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 96
  person-reference-v1:
    maximumAggregateBytes: 128
    fields:
      person_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 128
sources:
  source-a:
    pack:
      id: fixture-adult
      version: "1"
      digest: sha256:c103a586cb16cc65d0a780e302b2369f568b8f0eec3027e6cfdf6e958ad7bb47
      artifactPrefix: adapter-packs/fixture-adult/c103a586cb16cc65d0a780e302b2369f568b8f0eec3027e6cfdf6e958ad7bb47
    route: lookup
    connection: source-a
    inputs:
      given_name:
        selector:
          role: subject
          profile: person-demographics-v1
          field: given_name
      family_name:
        selector:
          role: subject
          profile: person-demographics-v1
          field: family_name
      birth_date:
        selector:
          role: subject
          profile: person-demographics-v1
          field: birth_date
    posture: field-projected
    factSchema: schemas/adult-status-facts.schema.yaml
  source-b:
    pack:
      id: fixture-residence
      version: "1"
      digest: sha256:6682b1acce2398b314b62fa0c1647a0427c392b178fe1ef8547b8052c79c4839
      artifactPrefix: adapter-packs/fixture-residence/6682b1acce2398b314b62fa0c1647a0427c392b178fe1ef8547b8052c79c4839
    route: lookup
    connection: source-b
    inputs:
      record_reference:
        selector:
          role: subject
          profile: residence-record-v1
          field: record_reference
    posture: field-projected
    factSchema: schemas/residence-region-facts.schema.yaml
  source-c:
    pack:
      id: fixture-licence
      version: "1"
      digest: sha256:159712f1794e124927a831d713d9fc0df4fb01f9fb3a7da4e4514989d0f60bee
      artifactPrefix: adapter-packs/fixture-licence/159712f1794e124927a831d713d9fc0df4fb01f9fb3a7da4e4514989d0f60bee
    route: lookup
    connection: source-c
    inputs:
      licence_reference:
        selector:
          role: subject
          profile: licence-register-v1
          field: licence_reference
      registry_region:
        selector:
          role: subject
          profile: licence-register-v1
          field: registry_region
    posture: record-transformed
    factSchema: schemas/professional-licence-facts.schema.yaml
  source-d:
    pack:
      id: fixture-parents
      version: "1"
      digest: sha256:9508cf0ec06ad80a75955aae0db1689eed85363d51c12acf06c5c3e99539d72d
      artifactPrefix: adapter-packs/fixture-parents/9508cf0ec06ad80a75955aae0db1689eed85363d51c12acf06c5c3e99539d72d
    route: lookup
    connection: source-d
    inputs:
      record_reference:
        selector:
          role: child
          profile: civil-record-reference-v1
          field: record_reference
    posture: field-projected
    factSchema: schemas/legal-parent-relationship-facts.schema.yaml
authorityProfiles:
  statutory-caseworker-v1:
    requesterClients:
      - evidence-task-agent
    grantSourceIssuer: https://casework.invalid
    kind: statutory
    requesterTags:
      - fixture-agency
    grants:
      - requirement: urn:example:fixture:requirement:adult-status:v1
        purpose: fixture-eligibility
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
          - unsigned-json
        subjects:
          - role: subject
            selectorProfile: person-demographics-v1
            valueOrigin: request
      - requirement: urn:example:fixture:requirement:residence-region:v1
        purpose: fixture-routing
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
          - unsigned-json
        subjects:
          - role: subject
            selectorProfile: residence-record-v1
            valueOrigin: request
      - requirement: urn:example:fixture:requirement:professional-licence-status:v1
        purpose: fixture-registration
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
          - unsigned-json
        subjects:
          - role: subject
            selectorProfile: licence-register-v1
            valueOrigin: request
      - requirement: urn:example:fixture:requirement:legal-parent-relationship:v1
        purpose: fixture-enrolment
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
          - unsigned-json
        subjects:
          - role: child
            selectorProfile: civil-record-reference-v1
            valueOrigin: request
          - role: candidate-parent
            selectorProfile: person-reference-v1
            valueOrigin: authenticated-grant
            valueClaims:
              person_reference: grant.candidate_parent.person_reference
requirements:
  - handle: adult-status
    uri: urn:example:fixture:requirement:adult-status:v1
    kind: criterion
    acquisition:
      source: source-a
    purposes:
      - fixture-eligibility
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - person-demographics-v1
    referenceFrameworks:
      - urn:example:fixture:framework:adult-status:v1
    evidenceType: urn:example:fixture:evidence-type:adult-status:v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 300
    derivation:
      script: derivations/adult-status.rhai
      parameters:
        minimum_age_years: 18
    concepts:
      - handle: is_adult
        uri: urn:example:fixture:concept:adult-status
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/adult-status-cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:adult-status
    existenceDisclosure: collapse-unresolved
  - handle: residence-region
    uri: urn:example:fixture:requirement:residence-region:v1
    kind: information-requirement
    acquisition:
      source: source-b
    purposes:
      - fixture-routing
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - residence-record-v1
    referenceFrameworks:
      - urn:example:fixture:framework:residence-region:v1
    evidenceType: urn:example:fixture:evidence-type:residence-region:v1
    validitySeconds: 300
    derivation:
      script: derivations/residence-region.rhai
      parameters: {}
    concepts:
      - handle: region
        uri: urn:example:fixture:concept:residence-region
        type: controlled-code
        required: true
        constraints:
          codelist: codelists/residence-region-map.yaml
          codelistVersion: 2026-01
          maximumBytes: 32
    fixtures: fixtures/residence-region-cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:residence-region
    existenceDisclosure: collapse-unresolved
  - handle: professional-licence-status
    uri: urn:example:fixture:requirement:professional-licence-status:v1
    kind: criterion
    acquisition:
      source: source-c
    purposes:
      - fixture-registration
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - licence-register-v1
    referenceFrameworks:
      - urn:example:fixture:framework:professional-licence:v1
    evidenceType: urn:example:fixture:evidence-type:professional-licence-status:v1
    observationTimezone: Africa/Nairobi
    validitySeconds: 300
    derivation:
      script: derivations/professional-licence.rhai
      parameters:
        active_state: CURRENT
        expiry_buckets:
          - minimumInclusive:
              type: decimal
              value: "-365000"
            maximumExclusive:
              type: decimal
              value: "0"
            code: expired
          - minimumInclusive:
              type: decimal
              value: "0"
            maximumExclusive:
              type: decimal
              value: "31"
            code: within-30-days
          - minimumInclusive:
              type: decimal
              value: "31"
            maximumExclusive:
              type: decimal
              value: "91"
            code: within-90-days
          - minimumInclusive:
              type: decimal
              value: "91"
            maximumExclusive:
              type: decimal
              value: "365001"
            code: later
    concepts:
      - handle: licence-active
        uri: urn:example:fixture:concept:licence-active
        type: boolean
        required: true
        constraints: {}
      - handle: licence-expiry-category
        uri: urn:example:fixture:concept:licence-expiry-category
        type: controlled-category
        required: true
        constraints:
          categoryScheme: urn:example:fixture:scheme:licence-expiry
          schemeVersion: "1"
          maximumBytes: 32
          codelist: codelists/professional-expiry-categories.yaml
    fixtures: fixtures/professional-licence-cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:professional-licence
    existenceDisclosure: collapse-unresolved
  - handle: legal-parent-relationship
    uri: urn:example:fixture:requirement:legal-parent-relationship:v1
    kind: criterion
    acquisition:
      source: source-d
    purposes:
      - fixture-enrolment
    subjectRoles:
      - role: child
        cardinality: one
        selectorProfiles:
          - civil-record-reference-v1
      - role: candidate-parent
        cardinality: one
        selectorProfiles:
          - person-reference-v1
    referenceFrameworks:
      - urn:example:fixture:framework:legal-parent-relationship:v1
    evidenceType: urn:example:fixture:evidence-type:legal-parent-relationship:v1
    validitySeconds: 300
    derivation:
      script: derivations/legal-parent-relationship.rhai
      selectorInputs:
        - role: child
          alternatives:
            - profile: civil-record-reference-v1
              fields:
                - record_reference
        - role: candidate-parent
          alternatives:
            - profile: person-reference-v1
              fields:
                - person_reference
      parameters:
        matching_policy: exact-opaque-reference-membership-v1
        candidate_reference_namespace: urn:example:fixture:person-reference
        relationship_set_contract: urn:example:fixture:legal-parent-set:v1
        legal_authority_attestation: urn:example:fixture:governance:legal-parent-register:v1
    concepts:
      - handle: relationship-confirmed
        uri: urn:example:fixture:concept:legal-parent-relationship-confirmed
        type: boolean
        required: true
        constraints: {}
    fixtures: fixtures/legal-parent-relationship-cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:legal-parent-relationship
    existenceDisclosure: collapse-unresolved
sourceConnections:
  source-a:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: static-authorization
        clientIdentity: forbidden
  source-b:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: static-authorization
        clientIdentity: forbidden
  source-c:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: basic
        clientIdentity: forbidden
  source-d:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: static-authorization
        clientIdentity: forbidden
