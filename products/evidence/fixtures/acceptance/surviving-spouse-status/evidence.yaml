version: 1
assuranceProfile: evidence-grade
service: {providerId: urn:example:fixture:provider:evidence, trustDomain: urn:example:fixture:trust-domain:acceptance}
issuer: {id: urn:example:fixture:issuer:authority}
authentication: {kind: oidc-access-token, issuer: https://identity.invalid, audiences: [evidence-fixture], tokenTypes: [at+jwt], algorithms: [ES256], jwksUri: https://identity.invalid/.well-known/jwks.json, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, grantIdClaim: evidence_grant_id, grantAuthorityClaim: evidence_authority, maximumTokenLifetimeSeconds: 300, revokedKeyIds: []}
audit: {format: keyed-jsonl, hashSecretRef: secret:file/audit-hash-key, hashKeyVersion: 1, failClosed: true}
subjectBinding: {secretRef: secret:file/subject-binding-key, keyVersion: 1}
rateLimits: {requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10}
signing: {format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 300, verifierClockSkewSeconds: 30}
responseFormats: [signed-jws]
acquisitionCapabilities: [search-then-fetch-set]

selectorProfiles:
  compound-demographic-v1:
    maximumAggregateBytes: 420
    fields:
      family_name: {type: string, minimumBytes: 1, maximumBytes: 200}
      given_name: {type: string, minimumBytes: 1, maximumBytes: 200}
      date_of_birth: {type: date}
sources:
  civil-record-search:
    transport: http-json
    baseUrl: https://civil-source.invalid
    posture: field-projected
    authentication: {kind: static-bearer, tokenRef: secret:file/civil-record-search-token}
    request:
      method: POST
      path: /v1/civil-record-search
      fixedHeaders: [{name: Accept, value: application/json}]
      selectorInputs:
        - role: subject
          alternatives: [{profile: compound-demographic-v1, fields: [family_name, given_name, date_of_birth]}]
      prepareScript: adapters/civil-record-search-prepare.rhai
      adapterParameters:
        requestedFields: [civil_record_reference, reference_namespace]
        resultLimit: 2
        referenceNamespace: urn:example:fixture:civil-record
      adapterParametersSchema: schemas/civil-record-search.adapter-parameters.schema.yaml
      preparationLimits: {query: forbidden, jsonBody: required, maximumJsonDepth: 8, maximumCollectionItems: 16, maximumStringBytes: 256, maximumNormalizedBytes: 4096}
      projection:
        - /total
        - /records/*/civil_record_reference
        - /records/*/reference_namespace
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/civil-record-search.response.schema.yaml
    extractScript: adapters/civil-record-search.rhai
    factSchema: schemas/civil-record-search.facts.schema.yaml
  union-register:
    transport: http-json
    baseUrl: https://union-source.invalid
    posture: field-projected
    authentication: {kind: static-bearer, tokenRef: secret:file/union-register-token}
    request:
      method: GET
      pathTemplate: /v1/persons/{ref}/unions
      pathBindings: {ref: {from: prior-fact, field: civil_record_reference}}
      fixedHeaders: [{name: Accept, value: application/json}]
      selectorInputs: []
      prepareScript: adapters/union-register-prepare.rhai
      adapterParameters: {unionSetContract: urn:example:fixture:union-set:v1, maximumUnionEvents: 8}
      adapterParametersSchema: schemas/union-register.adapter-parameters.schema.yaml
      preparationLimits: {query: allowed, jsonBody: forbidden, maximumNormalizedBytes: 4096}
      projection:
        - /record_found
        - /union_events/*/union_start_date
        - /union_events/*/union_end_reason
        - /union_events/*/union_recognized
        - /union_set_contract
        - /union_set_complete
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/union-register.response.schema.yaml
    extractScript: adapters/union-register.rhai
    factSchema: schemas/union-register.facts.schema.yaml
  death-register:
    transport: http-json
    baseUrl: https://death-source.invalid
    posture: field-projected
    authentication: {kind: static-bearer, tokenRef: secret:file/death-register-token}
    request:
      method: POST
      path: /v1/death-record-search
      fixedHeaders: [{name: Accept, value: application/json}]
      selectorInputs: []
      prepareScript: adapters/death-register-prepare.rhai
      adapterParameters: {deathRegisterContract: urn:example:fixture:death-register:v1}
      adapterParametersSchema: schemas/death-register.adapter-parameters.schema.yaml
      preparationLimits: {query: forbidden, jsonBody: required, maximumJsonDepth: 1, maximumCollectionItems: 1, maximumStringBytes: 96, maximumNormalizedBytes: 256}
      projection:
        - /record_found
        - /death_subject_reference
        - /date_of_death
        - /death_record_contract
        - /death_record_complete
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/death-register.response.schema.yaml
    extractScript: adapters/death-register.rhai
    factSchema: schemas/death-register.facts.schema.yaml
authorityProfiles:
  statutory-caseworker-v1:
    kind: statutory
    requesterTags: [fixture-agency]
    grants:
      - requirement: urn:example:fixture:requirement:surviving-spouse-status:v1
        purpose: fixture-survivor-benefit
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects: [{role: subject, selectorProfile: compound-demographic-v1, valueOrigin: request}]
requirements:
  - id: urn:example:fixture:requirement:surviving-spouse-status:v1
    kind: criterion
    acquisition:
      kind: search-then-fetch-set
      search: civil-record-search
      fetch:
        - {source: union-register, factInputs: [civil_record_reference]}
        - {source: death-register, factInputs: [civil_record_reference]}
      maximumAcquisitionMilliseconds: 8000
    purposes: [fixture-survivor-benefit]
    subjectRoles: [{role: subject, cardinality: one, selectorProfiles: [compound-demographic-v1]}]
    referenceFrameworks: [urn:example:fixture:framework:surviving-spouse-status:v1]
    evidenceType: urn:example:fixture:evidence-type:surviving-spouse-status:v1
    validitySeconds: 300
    derivation:
      script: derivations/surviving-spouse-status.rhai
      parameters:
        survivorship_policy: latest-recognized-union-ended-by-other-party-death-v1
        civil_reference_namespace: urn:example:fixture:civil-record
        union_set_contract: urn:example:fixture:union-set:v1
        death_register_contract: urn:example:fixture:death-register:v1
        no_death_recorded_marker: not-recorded
    concepts: [{id: urn:example:fixture:concept:surviving-spouse-status, form: boolean, required: true, constraints: {}}]
    fixtures: fixtures/cases.yaml
    disclosureGuard: {families: [urn:example:fixture:disclosure-family:union-status]}
    existenceDisclosure: collapse-unresolved
