apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service: {providerId: urn:example:fixture:provider:evidence, publicOrigin: https://evidence.invalid, trustDomain: urn:example:fixture:trust-domain:acceptance}
issuer: {uri: urn:example:fixture:issuer:authority}
publication: {serviceId: urn:example:fixture:service:evidence, title: Synthetic Evidence service, description: Synthetic minimum-disclosure assertions for acceptance testing, endpointUrl: https://evidence.example.invalid, jurisdictions: [urn:example:jurisdiction:acceptance]}
authentication:
  oidc: {issuer: https://identity.invalid, audience: evidence-fixture, tokenTypes: [at+jwt], algorithms: [ES256], jwksSource: {type: uri, uri: https://identity.invalid/.well-known/jwks.json}, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, allowedClients: unrestricted, requiredScopes: unrestricted, maximumTokenLifetimeSeconds: 300, revokedKeyIds: []}
audit: {hashKeyRef: secret:file/audit-hash-key, hashKeyVersion: 1}
subjectBinding: {secretRef: secret:file/subject-binding-key, keyVersion: 1}
rateLimits: {requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10}
signing: {format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 300, verifierClockSkewSeconds: 30}
responseFormats: [signed-jws]

selectorProfiles:
  compound-demographic-v1:
    maximumAggregateBytes: 420
    fields:
      family_name: {type: string, minimumBytes: 1, maximumBytes: 200}
      given_name: {type: string, minimumBytes: 1, maximumBytes: 200}
      date_of_birth: {type: date}
sources:
  survivorship-registers:
    pack:
      id: fixture-survivorship
      version: "1"
      digest: sha256:7a3638fd377c969b446e47af46a143f19cbf0bbff0f21862e866b6d1beb03522
      artifactPrefix: adapter-packs/fixture-survivorship/7a3638fd377c969b446e47af46a143f19cbf0bbff0f21862e866b6d1beb03522
    route: lookup
    connection: registers
    inputs:
      family_name:
        selector: {role: subject, profile: compound-demographic-v1, field: family_name}
      given_name:
        selector: {role: subject, profile: compound-demographic-v1, field: given_name}
      date_of_birth:
        selector: {role: subject, profile: compound-demographic-v1, field: date_of_birth}
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
sourceConnections:
  registers:
    endpoints:
      - endpoint: civil-records
        baseUrl: https://civil-source.invalid
        authentication: {type: static-authorization}
        clientIdentity: forbidden
      - endpoint: union-register
        baseUrl: https://union-source.invalid
        authentication: {type: static-authorization}
        clientIdentity: forbidden
      - endpoint: death-register
        baseUrl: https://death-source.invalid
        authentication: {type: static-authorization}
        clientIdentity: forbidden
authorityProfiles:
  statutory-caseworker-v1:
    kind: statutory
    requesterTags: [fixture-agency]
    grants:
      - requirement: urn:example:fixture:requirement:surviving-spouse-status:v1
        purpose: fixture-survivor-benefit
        audienceFrom: authenticated-requester
        responseFormats: [signed-jws]
        subjects: [{role: subject, selectorProfile: compound-demographic-v1, valueOrigin: request}]
requirements:
  - handle: surviving-spouse-status
    uri: urn:example:fixture:requirement:surviving-spouse-status:v1
    kind: criterion
    acquisition: {source: survivorship-registers}
    purposes: [fixture-survivor-benefit]
    subjectRoles: [{role: subject, cardinality: one, selectorProfiles: [compound-demographic-v1]}]
    referenceFrameworks: [urn:example:fixture:framework:surviving-spouse-status:v1]
    evidenceType: urn:example:fixture:evidence-type:surviving-spouse-status:v1
    validitySeconds: 300
    derivation:
      script: derivations/surviving-spouse-status.rhai
      parameters:
        survivorship_policy: latest-recognized-union-ended-by-other-party-death-v1
        civil_reference_namespace: urn:example:fixture:civil-record
        union_set_contract: urn:example:fixture:union-set:v1
        death_register_contract: urn:example:fixture:death-register:v1
    concepts: [{handle: surviving-spouse-status, uri: urn:example:fixture:concept:surviving-spouse-status, type: boolean, required: true, constraints: {}}]
    fixtures: fixtures/cases.yaml
    disclosureGuard: {families: [urn:example:fixture:disclosure-family:union-status]}
    existenceDisclosure: collapse-unresolved
