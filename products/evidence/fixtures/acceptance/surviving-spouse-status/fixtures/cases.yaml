apiVersion: id.registrystack.org/formats/evidence/fixture/v1alpha1
kind: EvidenceFixture
coequalAcceptanceDefinition: true
syntheticOnly: true
providerContract:
  classification: synthetic-governed-authoritative-union-and-death-registers
  governance_attestation: urn:example:fixture:governance:survivorship-registers:v1
  legal_meaning: For this synthetic acceptance definition, the union register's complete recognized-union set and the death register's complete record for one resolved civil reference are together legally authoritative for the declared surviving-spouse concept.
  acquisition: One bounded reviewed route searches demographics and, only after exactly one match, fetches the union and death registers in that fixed order. The route has no loop and no response-selected destination.
  member_inputs: The digest-pinned route retains only the civil record reference for member requests. The reference namespace is never sent to a register, union facts never reach the death request, and the union path segment and death body exercise both channels through which the one permitted scalar can leave.
  cross_register_binding: The death register must state the reference it answered for, and only the derivation, which alone sees both registers' facts, may compare it to the reference the search produced.
  completeness: A register with nothing to report answers with a complete-set attestation. An empty recognized-union set is a fact; a set declared incomplete is not an answer at all.
  decision: The latest recognized union ended by the other party's death, for a subject with no recorded death, is true. Any other complete history is false.
  prohibited: Names, dates of birth, fuzzy matching, partial union histories, absence inferred from an unresolved register, and any disclosure of a union date or of a death record cannot decide survivorship.
common:
  observedAt: '2026-08-02T00:00:00Z'
  selectors:
    subject: {profile: compound-demographic-v1, values: {family_name: Halvorsen, given_name: Wren, date_of_birth: '1958-04-11'}}
  expectedRequestParts:
    civil-records:
      query: []
      body: {lookup: {family_name: Halvorsen, given_name: Wren, date_of_birth: '1958-04-11'}, fields: [civil_record_reference, reference_namespace], limit: 2}
    union-register: {query: [], body: ~}
    death-register: {query: [], body: {subject_reference: synthetic-civil-record-101}}
  expectedTransport:
    civil-records: {path: /v1/civil-record-search, fixedHeaders: [{name: Accept, value: application/json}]}
    union-register: {pathTemplate: '/v1/persons/{ref}/unions', boundFrom: civil_record_reference, fixedHeaders: [{name: Accept, value: application/json}]}
    death-register: {path: /v1/death-record-search, fixedHeaders: [{name: Accept, value: application/json}]}
cases:
  - id: positive
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1979-06-02","union_end_reason":"dissolution","union_recognized":true},{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedValue: true
    expectedLookup: match
    derivationRuns: true
    signedSuccess: true
  - id: negative-false-is-success
    # The latest recognized union ended in dissolution. A complete history that
    # decides against the subject is a signed answer, not a refusal.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1979-06-02","union_end_reason":"death-of-other-party","union_recognized":true},{"union_start_date":"1994-09-17","union_end_reason":"dissolution","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedValue: false
    expectedLookup: match
    derivationRuns: true
    signedSuccess: true
  - id: boundary-latest-recognized-union-wins
    # Same two unions as the negative case, sent in the opposite array order.
    # The fold is ordered by union start date, never by the register's layout.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true},{"union_start_date":"1979-06-02","union_end_reason":"dissolution","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedValue: true
    expectedLookup: match
    derivationRuns: true
    signedSuccess: true
  - id: boundary-unrecognized-union-ignored
    # A later union the register does not recognize cannot displace the
    # recognized one, and cannot make an answer of its own.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true},{"union_start_date":"2005-11-30","union_end_reason":"ongoing","union_recognized":false}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedValue: true
    expectedLookup: match
    derivationRuns: true
    signedSuccess: true
  - id: boundary-no-union-history
    # An empty set that the register declares complete is a fact about the
    # subject. It is a signed false, not a lookup outcome and not a refusal.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedValue: false
    expectedLookup: match
    derivationRuns: true
    signedSuccess: true
  - id: missing-fact
    # The union register resolved the person and then omitted the completeness
    # attestation the profile requires of a resolved record.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1"}
    expectedPublicProblem: source.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: missing-record
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":0,"records":[]}
    expectedLookup: no_match
    expectedPublicProblem: evidence.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: no-match
    # The search did not resolve a subject, so neither register is called and
    # the failure is the one indistinguishable unavailable answer.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":0,"records":[]}
    expectedLookup: no_match
    expectedPublicProblem: evidence.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: ambiguous
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":2,"records":[{},{}]}
    expectedLookup: ambiguous
    expectedPublicProblem: evidence.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: negative-search-namespace-mismatch
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:other-namespace"}]}
    expectedPublicProblem: source.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: negative-union-register-unresolved
    # The search resolved a subject the union register cannot read. That is a
    # dependency inconsistency, not an empty union history, and execution stops
    # before the death register is called.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":false}
    expectedPublicProblem: source.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: negative-death-register-unresolved
    # The second member cannot resolve the reference the search produced. A
    # register that answers "no death record" attests it with a flag; one
    # that cannot answer at all never becomes a fact about survivorship.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":false}
    expectedPublicProblem: source.unavailable
    derivationRuns: false
    signedSuccess: false
  - id: negative-two-recognized-unions-share-the-latest-date
    # Which of these is the latest recognized union is a question the register
    # has not answered. Folding to whichever arrived first would make the signed
    # value depend on the order a register serialized its events in, which is
    # not a property of the subject, so the derivation refuses instead.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true},{"union_start_date":"1994-09-17","union_end_reason":"dissolution","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedPublicProblem: evidence.unavailable
    derivationRuns: true
    signedSuccess: false
  - id: negative-union-set-incomplete
    # The register sent a history and admitted it is partial. The derivation
    # refuses rather than reading the part it received as the whole.
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":false}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
            status: 200
            body: {"record_found":true,"death_subject_reference":"synthetic-civil-record-101","death_recorded":false,"death_record_contract":"urn:example:fixture:death-register:v1","death_record_complete":true}
    expectedPublicProblem: evidence.unavailable
    derivationRuns: true
    signedSuccess: false
  - id: negative-death-record-incomplete
    source:
      intercepts:
        - {type: endpoint, endpoint: civil-records}
        - {type: endpoint, endpoint: union-register}
        - {type: endpoint, endpoint: death-register}
      exchanges:
        - request:
            endpoint: civil-records
            method: POST
            path: /v1/civil-record-search
            headers: {accept: application/json}
            body: {"lookup":{"family_name":"Halvorsen","given_name":"Wren","date_of_birth":"1958-04-11"},"fields":["civil_record_reference","reference_namespace"],"limit":2}
          response:
            status: 200
            body: {"total":1,"records":[{"civil_record_reference":"synthetic-civil-record-101","reference_namespace":"urn:example:fixture:civil-record"}]}
        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
