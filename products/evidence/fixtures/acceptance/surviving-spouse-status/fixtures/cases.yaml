        - request:
            endpoint: union-register
            method: GET
            path: /v1/persons/synthetic-civil-record-101/unions
            headers: {accept: application/json}
          response:
            status: 200
            body: {"record_found":true,"union_events":[{"union_start_date":"1994-09-17","union_end_reason":"death-of-other-party","union_recognized":true}],"union_set_contract":"urn:example:fixture:union-set:v1","union_set_complete":true}
        - request:
            endpoint: death-register
            method: POST
            path: /v1/death-record-search
            headers: {accept: application/json}
            body: {"subject_reference":"synthetic-civil-record-101"}
          response:
