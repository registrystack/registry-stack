type: object
additionalProperties: false
required: [death_subject_reference, date_of_death, death_record_contract, death_record_complete]
properties:
  # The reference the death register says it answered for. The derivation
  # compares it to the search FactSet's civil_record_reference, which is the
  # only reason both FactSets have to reach one derivation.
  death_subject_reference: {type: string, minLength: 1, maxLength: 96}
  # A complete register with nothing to report still answers. `not-recorded` is
  # that answer and it is a fact, not a lookup outcome. An ISO date is ten
  # bytes and the governed marker is twelve.
  date_of_death: {type: string, minLength: 10, maxLength: 12}
  death_record_contract: {const: urn:example:fixture:death-register:v1}
  death_record_complete: {type: boolean}
