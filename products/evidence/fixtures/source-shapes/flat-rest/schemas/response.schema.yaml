# Shape of the projected lookup response, checked before extraction runs.
# The source reports an explicit null result where it found nothing, so the
# result leaf is written as the nullable pair the response subset admits; the
# script reads that null with is_missing, exactly as it reads an absent leaf.
type: object
additionalProperties: false
required: [total]
properties:
  total:
    type: integer
    minimum: 0
    maximum: 1000000
  result:
    type: [object, "null"]
    additionalProperties: false
    required: []
    properties:
      fact_code:
        type: string
        minLength: 1
        maxLength: 32
  results:
    type: array
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      required: []
      properties:
        fact_code:
          type: string
          minLength: 1
          maxLength: 32
