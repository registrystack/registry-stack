apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:example:fixture:provider:evidence
  publicOrigin: https://evidence.invalid
  trustDomain: urn:example:fixture:trust-domain:supported-values
issuer:
  uri: urn:example:fixture:issuer:authority
authentication:
  oidc:
    issuer: https://identity.invalid
    audience: evidence-fixture
    tokenTypes:
      - at+jwt
    algorithms:
      - ES256
    jwksSource:
      type: uri
      uri: https://identity.invalid/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    allowedClients: unrestricted
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-hash-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/subject-binding-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 60
  burstPerPrincipal: 10
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats:
  - signed-jws
selectorProfiles:
  synthetic-subject-v1:
    maximumAggregateBytes: 64
    fields:
      opaque_id:
        type: string
        minimumBytes: 1
        maximumBytes: 32
sources:
  synthetic-source:
    pack:
      id: fixture-marker
      version: "1"
      digest: sha256:9be041d788207161f850a414e7ad5893407f728bdb2964ddad3ff3576e2cc520
      artifactPrefix: adapter-packs/fixture-marker/9be041d788207161f850a414e7ad5893407f728bdb2964ddad3ff3576e2cc520
    route: lookup
    connection: provider
    inputs:
      opaque_id:
        selector:
          role: subject
          profile: synthetic-subject-v1
          field: opaque_id
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
authorityProfiles:
  synthetic-authority-v1:
    kind: statutory
    requesterTags:
      - fixture
    grants:
      - requirement: urn:example:fixture:requirement:supported-values:v1
        purpose: conformance
        audienceFrom: authenticated-requester
        responseFormats:
          - signed-jws
        subjects:
          - role: subject
            selectorProfile: synthetic-subject-v1
            valueOrigin: request
requirements:
  - handle: supported-values
    uri: urn:example:fixture:requirement:supported-values:v1
    kind: information-requirement
    acquisition:
      source: synthetic-source
    purposes:
      - conformance
    subjectRoles:
      - role: subject
        cardinality: one
        selectorProfiles:
          - synthetic-subject-v1
    referenceFrameworks:
      - urn:example:fixture:framework:supported-values:v1
    evidenceType: urn:example:fixture:evidence-type:supported-values:v1
    observationTimezone: UTC
    validitySeconds: 300
    derivation:
      script: derivations/values.rhai
      parameters: {}
    concepts:
      - handle: boolean
        uri: urn:example:fixture:concept:boolean
        type: boolean
        required: true
        constraints: {}
      - handle: controlled-code
        uri: urn:example:fixture:concept:controlled-code
        type: controlled-code
        required: false
        constraints:
          codelist: codelists/synthetic-codes.yaml
          codelistVersion: "1"
          maximumBytes: 8
      - handle: controlled-category
        uri: urn:example:fixture:concept:controlled-category
        type: controlled-category
        required: false
        constraints:
          categoryScheme: urn:example:fixture:scheme:category
          schemeVersion: "1"
          maximumBytes: 16
          codelist: codelists/categories.yaml
      - handle: bounded-identifier
        uri: urn:example:fixture:concept:bounded-identifier
        type: bounded-identifier
        required: false
        constraints:
          prefix: 'urn:example:report:'
          minimumBytes: 20
          maximumBytes: 64
      - handle: bounded-integer
        uri: urn:example:fixture:concept:bounded-integer
        type: bounded-integer
        required: false
        constraints:
          minimum: -10
          maximum: 10
      - handle: bounded-decimal
        uri: urn:example:fixture:concept:bounded-decimal
        type: bounded-decimal
        required: false
        constraints:
          minimum: "-10.5"
          maximum: "10.5"
          maximumScale: 2
      - handle: date-bucket
        uri: urn:example:fixture:concept:date-bucket
        type: date-bucket
        required: false
        constraints:
          bucketScheme: urn:example:fixture:scheme:date-bucket
          schemeVersion: "1"
      - handle: time-bucket
        uri: urn:example:fixture:concept:time-bucket
        type: time-bucket
        required: false
        constraints:
          bucketScheme: urn:example:fixture:scheme:time-bucket
          schemeVersion: "1"
      - handle: entity-reference
        uri: urn:example:fixture:concept:audience-scoped-entity-reference
        type: audience-scoped-entity-reference
        required: false
        constraints:
          maximumBytes: 160
      - handle: controlled-code-list
        uri: urn:example:fixture:concept:controlled-code-list
        type: controlled-code-list
        required: false
        constraints:
          codelist: codelists/synthetic-codes.yaml
          codelistVersion: "1"
          minimumItems: 1
          maximumItems: 3
          unique: true
      - handle: entity-reference-list
        uri: urn:example:fixture:concept:entity-reference-list
        type: entity-reference-list
        required: false
        constraints:
          minimumItems: 1
          maximumItems: 2
          unique: true
      - handle: structured
        uri: urn:example:fixture:concept:reviewed-structured-value
        type: reviewed-structured-value
        required: false
        constraints:
          schema: urn:example:fixture:schema:closed-structure:v1
          maximumSerializedBytes: 512
    fixtures: fixtures/cases.yaml
    disclosureGuard:
      families:
        - urn:example:fixture:disclosure-family:supported-values
    existenceDisclosure: collapse-unresolved
sourceConnections:
  provider:
    endpoints:
      - endpoint: provider
        baseUrl: https://source.invalid
        authentication:
          type: static-authorization
        clientIdentity: forbidden
