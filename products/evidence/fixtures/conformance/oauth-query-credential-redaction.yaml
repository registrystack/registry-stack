fixture: registry.evidence.oauth-query-credential-redaction/v1
synthetic_only: true
configuration:
  credential_placement: query-string
  token_endpoint: https://authorization.invalid/oauth/token
  client_id_ref: secret:file/fixture-oauth-client-id
  client_secret_ref: secret:file/fixture-oauth-client-secret
  scope: fixture.read
runtime_generated_canary_classes: [client-id, client-secret, access-token]
repository_secret_values: prohibited
cases:
  - {id: token-success, provider_status: 200, expected: token-used-in-memory-only}
  - {id: token-400, provider_status: 400, expected_public_problem: dependency_unavailable}
  - {id: token-401, provider_status: 401, expected_public_problem: dependency_unavailable}
  - {id: malformed-token-json, provider_status: 200, response: invalid-json, expected_public_problem: dependency_unavailable}
  - {id: token-response-oversized, provider_status: 200, response: oversized, expected_public_problem: dependency_unavailable}
  - {id: token-response-extra-field, provider_status: 200, response: extra-field, expected_public_problem: dependency_unavailable}
  - {id: token-response-wrong-access-token-field, provider_status: 200, response: wrong-access-token-field, expected_public_problem: dependency_unavailable}
  - {id: token-response-wrong-token-type, provider_status: 200, response: wrong-token-type, expected_public_problem: dependency_unavailable}
  - {id: token-response-wrong-media-type, provider_status: 200, response: wrong-media-type, expected_public_problem: dependency_unavailable}
  - {id: token-response-wrong-scope, provider_status: 200, response: wrong-scope, expected_public_problem: dependency_unavailable}
  - {id: token-response-wrong-lifetime, provider_status: 200, response: wrong-lifetime, expected_public_problem: dependency_unavailable}
  - {id: transport-connection-failure, transport: connection-failure, expected_public_problem: dependency_unavailable}
  - {id: transport-timeout, transport: timeout, expected_public_problem: dependency_unavailable}
required_absence:
  surfaces: [public-problem, operational-log, audit, trace, metric, snapshot, panic, test-failure-output]
  values:
    - every runtime-generated client-id canary
    - every runtime-generated client-secret canary
    - every runtime-generated access-token canary
    - complete token URL with query
    - token request body
    - token response body
wire_assertion:
  provider_receives_configured_query_keys: true
  provider_receives_configured_grant: client_credentials
  evidence_data_requests_after_token_failure: 0
  Rhai_receives_token_or_token_request: false
