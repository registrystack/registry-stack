fixture: registry.evidence.oauth-credential-redaction/v1
synthetic_only: true
configuration:
  credential_placement: form-body
  token_endpoint: https://authorization.invalid/oauth/token
  client_id_ref: secret:file/fixture-oauth-client-id
  client_secret_ref: secret:file/fixture-oauth-client-secret
  scope: fixture.read
lifetime_rule: >-
  RFC 6749 section 5.1 makes expires_in recommended rather than required. A
  token response that omits it is accepted only when the bundle configures
  assumedLifetimeSeconds, and the cached lifetime is still clamped to
  maximumCacheSeconds. A present but zero, negative, or non-numeric expires_in
  remains a credential failure and no assumed lifetime can rescue it.
extension_member_rule: >-
  RFC 6749 section 5.1 permits a token response to carry members beyond the ones
  it defines, and deployed authorization servers do: refresh_expires_in,
  not-before-policy, session_state, id_token, ext_expires_in. Version 1 ignores
  every member it does not read rather than refusing the response, so an
  ordinary provider is usable. Ignoring is not trusting: an unread member is
  never a credential, never reaches a script, and is scrubbed with the rest of
  the parsed response. Every member Version 1 does read is still closed, so a
  wrong type or a wrong scope remains a credential failure, and duplicate
  members remain a parse failure, which is what stops a second access_token from
  arriving as an extension.
runtime_generated_canary_classes: [client-id, client-secret, access-token]
repository_secret_values: prohibited
cases:
  - {id: token-success, provider_status: 200, expected: token-used-in-memory-only}
  - {id: token-400, provider_status: 400, expected_public_problem: source.unavailable}
  - {id: token-401, provider_status: 401, expected_public_problem: source.unavailable}
  - {id: malformed-token-json, provider_status: 200, response: invalid-json, expected_public_problem: source.unavailable}
  - {id: token-response-oversized, provider_status: 200, response: oversized, expected_public_problem: source.unavailable}
  - {id: token-response-extension-members, provider_status: 200, response: extension-members, expected: token-used-in-memory-only}
  - {id: token-response-duplicate-access-token, provider_status: 200, response: duplicate-access-token, expected_public_problem: source.unavailable}
  - {id: token-response-wrong-access-token-field, provider_status: 200, response: wrong-access-token-field, expected_public_problem: source.unavailable}
  - {id: token-response-wrong-token-type, provider_status: 200, response: wrong-token-type, expected_public_problem: source.unavailable}
  - {id: token-response-omitted-lifetime, provider_status: 200, response: omitted-lifetime, expected_public_problem: source.unavailable}
  - {id: token-response-omitted-lifetime-with-assumed-lifetime, provider_status: 200, response: omitted-lifetime, assumed_lifetime_seconds: 120, expected: token-used-in-memory-only}
  - {id: token-response-wrong-media-type, provider_status: 200, response: wrong-media-type, expected_public_problem: source.unavailable}
  - {id: token-response-wrong-scope, provider_status: 200, response: wrong-scope, expected_public_problem: source.unavailable}
  - {id: token-response-wrong-lifetime, provider_status: 200, response: wrong-lifetime, expected_public_problem: source.unavailable}
  - {id: transport-connection-failure, transport: connection-failure, expected_public_problem: source.unavailable}
  - {id: transport-timeout, transport: timeout, expected_public_problem: source.unavailable}
required_absence:
  surfaces: [public-problem, operational-log, audit, trace, metric, snapshot, panic, test-failure-output]
  values:
    - every runtime-generated client-id canary
    - every runtime-generated client-secret canary
    - every runtime-generated access-token canary
    - complete token URL
    - token request body
    - token response body
placement_rule: >-
  RFC 6749 section 2.3.1 requires the client identifier and secret to travel in
  the Authorization header or the request body and never in the request URI.
  Version 1 offers no query-string placement, so the token URL carries no
  credential to leak into an authorization-server, proxy, or ingress log.
wire_assertion:
  provider_receives_no_token_url_query: true
  provider_receives_configured_form_keys: true
  provider_receives_configured_grant: client_credentials
  evidence_data_requests_after_token_failure: 0
  Rhai_receives_token_or_token_request: false
