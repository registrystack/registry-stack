  pre_source_rejections:
    - missing, unknown, extra, mistyped, empty, oversized, and aggregate-oversized fields
    - unauthorized profile, role, purpose, audience, or value origin
    - caller values on context-derived or grant-derived profiles
    - absent caller values on an authorized request-derived profile
