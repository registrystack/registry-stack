apiVersion: id.registrystack.org/formats/evidence/bundle/v1
kind: EvidenceBundle
assuranceProfile: evidence-grade
service:
  providerId: urn:example:fixture:provider:selector-conformance
  publicOrigin: https://evidence.invalid
  trustDomain: urn:example:fixture:trust-domain:selector-conformance
issuer:
  uri: urn:example:fixture:issuer:selector-conformance
authentication:
  oidc:
    issuer: https://identity.invalid
    audience: selector-conformance
    allowedClients:
    - evidence-task-agent
    tokenTypes:
    - at+jwt
    algorithms:
    - ES256
    jwksSource:
      type: uri
      uri: https://identity.invalid/.well-known/jwks.json
    principalClaim: sub
    requesterTagsClaim: evidence_tags
    evidenceAudienceClaim: evidence_audience
    requiredScopes: unrestricted
    maximumTokenLifetimeSeconds: 300
    revokedKeyIds: []
audit:
  hashKeyRef: secret:file/audit-key
  hashKeyVersion: 1
subjectBinding:
  secretRef: secret:file/binding-key
  keyVersion: 1
rateLimits:
  requestsPerPrincipalPerMinute: 1000
  burstPerPrincipal: 100
  failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 100
signing:
  format: flattened-jws-json
  algorithm: ES256
  activePublicJwkFile: public-keys/_QkPweRjMZxmIHnz7v8tj3coTKx-90L2LRsZbkeP_Bo.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: "/.well-known/evidence/jwks.json"
  maximumAssertionValiditySeconds: 300
  verifierClockSkewSeconds: 30
responseFormats:
- signed-jws
selectorProfiles:
  opaque-record-v1:
    maximumAggregateBytes: 96
    fields:
      record_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 96
  demographics-v1:
    maximumAggregateBytes: 420
    fields:
      given_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      family_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      birth_date:
        type: date
  demographics-with-event-v1:
    maximumAggregateBytes: 520
    fields:
      given_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      family_name:
        type: string
        minimumBytes: 1
        maximumBytes: 200
      birth_date:
        type: date
      event_reference:
        type: string
        minimumBytes: 1
        maximumBytes: 96
  opaque-coordinates-v1:
    maximumAggregateBytes: 96
    fields:
      alpha:
        type: string
        minimumBytes: 1
        maximumBytes: 80
      delta:
        type: integer
        minimum: 0
        maximum: 999999
      kappa:
        type: controlled-code
        codelist: codelists/opaque-codes.yaml
        codelistVersion: '1'
        maximumBytes: 16
sources:
  classification-source:
    pack:
      id: selector-conformance
      version: '1'
      digest: sha256:3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
      artifactPrefix: adapter-packs/selector-conformance/3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
    route: classification-source
    connection: classification-source
    inputs:
      request_record_reference:
        selector:
          role: subject
          profile: opaque-record-v1
          field: record_reference
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
  context-source:
    pack:
      id: selector-conformance
      version: '1'
      digest: sha256:3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
      artifactPrefix: adapter-packs/selector-conformance/3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
    route: context-source
    connection: context-source
    inputs:
      context_given_name:
        selector:
          role: subject
          profile: demographics-v1
          field: given_name
      context_family_name:
        selector:
          role: subject
          profile: demographics-v1
          field: family_name
      context_birth_date:
        selector:
          role: subject
          profile: demographics-v1
          field: birth_date
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
  grant-source:
    pack:
      id: selector-conformance
      version: '1'
      digest: sha256:3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
      artifactPrefix: adapter-packs/selector-conformance/3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
    route: grant-source
    connection: grant-source
    inputs:
      grant_given_name:
        selector:
          role: subject
          profile: demographics-with-event-v1
          field: given_name
      grant_family_name:
        selector:
          role: subject
          profile: demographics-with-event-v1
          field: family_name
      grant_birth_date:
        selector:
          role: subject
          profile: demographics-with-event-v1
          field: birth_date
      grant_event_reference:
        selector:
          role: subject
          profile: demographics-with-event-v1
          field: event_reference
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
  relationship-source:
    pack:
      id: selector-conformance
      version: '1'
      digest: sha256:3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
      artifactPrefix: adapter-packs/selector-conformance/3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
    route: relationship-source
    connection: relationship-source
    inputs:
      role_a_record_reference:
        selector:
          role: subject-a
          profile: opaque-record-v1
          field: record_reference
      role_a_alpha:
        selector:
          role: subject-a
          profile: opaque-coordinates-v1
          field: alpha
      role_a_delta:
        selector:
          role: subject-a
          profile: opaque-coordinates-v1
          field: delta
      role_a_kappa:
        selector:
          role: subject-a
          profile: opaque-coordinates-v1
          field: kappa
      role_b_given_name:
        selector:
          role: subject-b
          profile: demographics-v1
          field: given_name
      role_b_family_name:
        selector:
          role: subject-b
          profile: demographics-v1
          field: family_name
      role_b_birth_date:
        selector:
          role: subject-b
          profile: demographics-v1
          field: birth_date
      role_b_event_given_name:
        selector:
          role: subject-b
          profile: demographics-with-event-v1
          field: given_name
      role_b_event_family_name:
        selector:
          role: subject-b
          profile: demographics-with-event-v1
          field: family_name
      role_b_event_birth_date:
        selector:
          role: subject-b
          profile: demographics-with-event-v1
          field: birth_date
      role_b_event_event_reference:
        selector:
          role: subject-b
          profile: demographics-with-event-v1
          field: event_reference
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
  opaque-source:
    pack:
      id: selector-conformance
      version: '1'
      digest: sha256:3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
      artifactPrefix: adapter-packs/selector-conformance/3823a30cd0b49837cdd966c697f45cedf9a0235ec08545738e8da8dc5478fd14
    route: opaque-source
    connection: opaque-source
    inputs:
      opaque_alpha:
        selector:
          role: subject
          profile: opaque-coordinates-v1
          field: alpha
      opaque_delta:
        selector:
          role: subject
          profile: opaque-coordinates-v1
          field: delta
      opaque_kappa:
        selector:
          role: subject
          profile: opaque-coordinates-v1
          field: kappa
    posture: field-projected
    factSchema: schemas/facts.schema.yaml
authorityProfiles:
  reviewed-caseworker-v1:
    kind: statutory
    requesterTags:
    - selector-reviewer
    grants:
    - requirement: urn:example:fixture:requirement:classification:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject
        selectorProfile: opaque-record-v1
        valueOrigin: request
    - requirement: urn:example:fixture:requirement:relationship:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject-a
        selectorProfile: opaque-record-v1
        valueOrigin: request
      - role: subject-b
        selectorProfile: demographics-v1
        valueOrigin: request
    - requirement: urn:example:fixture:requirement:opaque:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject
        selectorProfile: opaque-coordinates-v1
        valueOrigin: request
  subject-bound-v1:
    kind: organizational
    requesterTags:
    - selector-reviewer
    grants:
    - requirement: urn:example:fixture:requirement:property:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject
        selectorProfile: demographics-v1
        valueOrigin: authenticated-context
        valueClaims:
          given_name: identity.given_name
          family_name: identity.family_name
          birth_date: identity.birth_date
  institutional-review-v1:
    requesterClients:
    - evidence-task-agent
    grantSourceIssuer: https://casework.invalid
    kind: consent
    requesterTags:
    - selector-reviewer
    grants:
    - requirement: urn:example:fixture:requirement:property-with-event:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject
        selectorProfile: demographics-with-event-v1
        valueOrigin: authenticated-grant
        valueClaims:
          given_name: grant.subject.given_name
          family_name: grant.subject.family_name
          birth_date: grant.subject.birth_date
          event_reference: grant.subject.event_reference
  alternate-caseworker-v1:
    kind: statutory
    requesterTags:
    - selector-reviewer
    grants:
    - requirement: urn:example:fixture:requirement:relationship:v1
      purpose: fixture-procedure
      audienceFrom: authenticated-requester
      responseFormats:
      - signed-jws
      subjects:
      - role: subject-a
        selectorProfile: opaque-coordinates-v1
        valueOrigin: request
      - role: subject-b
        selectorProfile: demographics-with-event-v1
        valueOrigin: request
