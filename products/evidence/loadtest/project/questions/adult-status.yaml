# yaml-language-server: $schema=https://id.registrystack.org/schemas/evidence/question/question.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/evidence/question/v1alpha1
kind: EvidenceQuestion
id: adult-status
question: Is the person at least 18 years old?
purpose: age-check
subject:
  role: person
  selector: person_id
source:
  operation: getPerson
  facts:
    - name: date_of_birth
      path: /date_of_birth
      combine: exactly-one
  collectionBounds: {}
answers:
  - concept: is_adult
    type: boolean
responseFormats: [signed-jws]
derivation: derivations/adult-status.rhai
disclosure:
  allow: [is_adult]
