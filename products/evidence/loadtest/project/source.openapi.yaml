openapi: 3.1.0
info:
  title: Load-test synthetic registry
  version: 1.0.0
servers:
  - url: http://127.0.0.1:MOCK_PORT
paths:
  /people/{record-id}:
    get:
      operationId: getPerson
      parameters:
        - name: record-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A synthetic person record
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [total, record]
                properties:
                  total:
                    type: integer
                    minimum: 0
                    maximum: 2
                  record:
                    type: object
                    additionalProperties: false
                    required: [record_id, birth_date, residence_region, address_canary]
                    properties:
                      record_id:
                        type: string
                        minLength: 1
                        maxLength: 64
                      birth_date:
                        type: string
                        format: date
                      residence_region:
                        type: string
                        enum: [north, south]
                      address_canary:
                        type: string
                        minLength: 1
                        maxLength: 128
