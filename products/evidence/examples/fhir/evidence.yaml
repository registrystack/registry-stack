apiVersion: id.registrystack.org/formats/evidence/project/v1alpha1
kind: EvidenceProject
id: fhir-record-evidence
selectorProfiles:
  patient-by-id:
    maximumAggregateBytes: 64
    fields:
      patient_id:
        type: string
        minimumBytes: 1
        maximumBytes: 64
  coverage-by-id:
    maximumAggregateBytes: 64
    fields:
      coverage_id:
        type: string
        minimumBytes: 1
        maximumBytes: 64
  organization-by-id:
    maximumAggregateBytes: 64
    fields:
      organization_id:
        type: string
        minimumBytes: 1
        maximumBytes: 64
functions:
- id: derive-coverage-status
  interface: assertion-derive/v1
  source: functions/derive-coverage-status.rhai
- id: derive-healthcare-establishment
  interface: assertion-derive/v1
  source: functions/derive-healthcare-establishment.rhai
sources:
  coverage-record:
    pack: {id: fhir-read-through, version: '1'}
    route: coverage-record
    connection: fhir-read-through
    acquisitionPosture: record-transformed
    inputs:
      coverageId:
        selector: {role: coverage-record, profile: coverage-by-id, field: coverage_id}
  organization-record:
    pack: {id: fhir-read-through, version: '1'}
    route: organization-record
    connection: fhir-read-through
    acquisitionPosture: record-transformed
    inputs:
      organizationId:
        selector: {role: organization, profile: organization-by-id, field: organization_id}
assertionDefinitions:
  fhir-coverage-status:
    question: Does this coverage record report active coverage for the selected patient?
    semantics:
      kind: criterion
      requirement: urn:example:requirement:coverage-record:v1
      referenceFrameworks:
      - https://hl7.org/fhir/R4/
      evidenceType: urn:example:evidence-type:coverage-record:v1
    purpose: coverage-record-verification
    grantCeiling:
      actorKinds:
      - service
      audiences:
      - urn:example:audience:fhir-record-evidence
      authorities:
      - organizational
      valueOrigins:
      - request
    subjects:
    - role: patient
      selectors:
      - patient-by-id
    - role: coverage-record
      selectors:
      - coverage-by-id
    acquisition:
      source: coverage-record
    derive:
      function: derive-coverage-status
      selectorInputs:
      - role: patient
        alternatives:
        - profile: patient-by-id
          fields:
          - patient_id
    outputs:
      coverage-record-reports-active:
        concept: urn:example:concept:coverage-record-reports-active:v1
        type: boolean
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    - sd-jwt-vc
    fixtures: fixtures/coverage-status.yaml
  fhir-healthcare-establishment:
    question: Does this organization record report an active healthcare provider?
    semantics:
      kind: criterion
      requirement: urn:example:requirement:organization-record:v1
      referenceFrameworks:
      - https://hl7.org/fhir/R4/
      evidenceType: urn:example:evidence-type:organization-record:v1
    purpose: healthcare-establishment-verification
    grantCeiling:
      actorKinds:
      - service
      audiences:
      - urn:example:audience:fhir-record-evidence
      authorities:
      - organizational
      valueOrigins:
      - request
    subjects:
    - role: organization
      selectors:
      - organization-by-id
    acquisition:
      source: organization-record
    derive:
      function: derive-healthcare-establishment
    outputs:
      healthcare-provider-record-active:
        concept: urn:example:concept:healthcare-provider-record-active:v1
        type: boolean
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    - sd-jwt-vc
    fixtures: fixtures/healthcare-establishment.yaml
