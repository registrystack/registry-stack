# yaml-language-server: $schema=https://id.registrystack.org/schemas/rstack/dev/dev.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/rstack/dev/v1alpha1
kind: RStackDev
# Evidence alone: no BReg, no Casework, no database. Evidence's local target
# accepts only a loopback issuer, so the run is its own issuer: it signs the
# test tokens with a throwaway local key and serves the matching public keys on
# loopback. Start the synthetic source first, as the README shows:
# `python3 serve-source.py --port 8081`.
issuer: run
products:
  - {product: evidence, project: ., audience: "urn:example:resource:standalone-evidence"}
people:
  caller:
    subject: "urn:registrystack:evidence:local:client:example-caller"
    client: example-caller
    grants:
      evidence:
        # The requester tag the local target's compiled authority admits.
        profile: local-service
        scopes: ["evidence:request"]
        claims: {evidence_audience: "urn:example:audience:standalone-app"}
scenarioFile: tests/scenarios.yaml
