apiVersion: id.registrystack.org/formats/evidence/project/v1alpha1
kind: EvidenceProject
id: standalone-evidence
selectorProfiles:
  record-by-id:
    maximumAggregateBytes: 64
    fields:
      record-id:
        type: string
        minimumBytes: 1
        maximumBytes: 64
functions:
- id: derive-adult-status
  interface: assertion-derive/v1
  source: functions/derive-adult-status.rhai
- id: derive-residence-region
  interface: assertion-derive/v1
  source: functions/derive-residence-region.rhai
- id: derive-licence-status
  interface: assertion-derive/v1
  source: functions/derive-licence-status.rhai
- id: derive-parent-relationship
  interface: assertion-derive/v1
  source: functions/derive-parent-relationship.rhai
sources:
  person-record:
    pack: {id: synthetic-register, version: '1'}
    route: person
    connection: synthetic-register
    projection:
      source: projections/person-facts.rhai
      entrypoint: project_facts
      schema: schemas/person-facts.json
    acquisitionPosture: record-transformed
    inputs:
      recordId:
        selector: {role: subject, profile: record-by-id, field: record-id}
  licence-record:
    pack: {id: synthetic-register, version: '1'}
    route: licence
    connection: synthetic-register
    acquisitionPosture: record-transformed
    inputs:
      recordId:
        selector: {role: licence, profile: record-by-id, field: record-id}
  parent-record:
    pack: {id: synthetic-register, version: '1'}
    route: parents
    connection: synthetic-register
    acquisitionPosture: record-transformed
    inputs:
      recordId:
        selector: {role: child, profile: record-by-id, field: record-id}
assertionDefinitions:
  adult-status:
    question: Is the subject at least 18 at observation time?
    semantics:
      requirement: urn:example:requirement:adult-status:v1
      kind: criterion
      evidenceType: urn:example:evidence-type:adult-status:v1
      referenceFrameworks:
      - urn:example:framework:standalone:v1
    purpose: age-check
    grantCeiling:
      authorities:
      - organizational
      actorKinds:
      - service
      valueOrigins:
      - request
      audiences:
      - urn:example:audience:standalone-app
    subjects:
    - role: subject
      selectors:
      - record-by-id
    acquisition:
      source: person-record
    derive:
      function: derive-adult-status
    outputs:
      adult:
        concept: urn:example:concept:adult-status:v1
        type: boolean
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    observationTimezone: Asia/Bangkok
    fixtures: fixtures/adult-status.yaml
  residence-region:
    question: Which reviewed region contains the subject residence?
    semantics:
      requirement: urn:example:requirement:residence-region:v1
      kind: information-requirement
      evidenceType: urn:example:evidence-type:residence-region:v1
      referenceFrameworks:
      - urn:example:framework:standalone:v1
    purpose: residence-check
    grantCeiling:
      authorities:
      - organizational
      actorKinds:
      - service
      valueOrigins:
      - request
      audiences:
      - urn:example:audience:standalone-app
    subjects:
    - role: subject
      selectors:
      - record-by-id
    acquisition:
      source: person-record
    derive:
      function: derive-residence-region
    outputs:
      region:
        concept: urn:example:concept:residence-region:v1
        type: controlled-category
        values:
        - north
        - south
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    observationTimezone: UTC
    fixtures: fixtures/residence-region.yaml
  professional-licence-status:
    question: What is the current professional licence status?
    semantics:
      requirement: urn:example:requirement:professional-licence-status:v1
      kind: information-requirement
      evidenceType: urn:example:evidence-type:professional-licence-status:v1
      referenceFrameworks:
      - urn:example:framework:standalone:v1
    purpose: licence-check
    grantCeiling:
      authorities:
      - organizational
      actorKinds:
      - service
      valueOrigins:
      - request
      audiences:
      - urn:example:audience:standalone-app
    subjects:
    - role: licence
      selectors:
      - record-by-id
    acquisition:
      source: licence-record
    derive:
      function: derive-licence-status
    outputs:
      licence-status:
        concept: urn:example:concept:licence-status:v1
        type: controlled-category
        values:
        - active
        - suspended
        - expired
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    observationTimezone: UTC
    fixtures: fixtures/professional-licence-status.yaml
  legal-parent-relationship:
    question: Is the candidate a legal parent in the complete relationship set?
    semantics:
      requirement: urn:example:requirement:legal-parent-relationship:v1
      kind: criterion
      evidenceType: urn:example:evidence-type:legal-parent-relationship:v1
      referenceFrameworks:
      - urn:example:framework:standalone:v1
    purpose: relationship-check
    grantCeiling:
      authorities:
      - organizational
      actorKinds:
      - service
      valueOrigins:
      - request
      audiences:
      - urn:example:audience:standalone-app
    subjects:
    - role: child
      selectors:
      - record-by-id
    - role: candidate-parent
      selectors:
      - record-by-id
    acquisition:
      source: parent-record
    derive:
      function: derive-parent-relationship
      selectorInputs:
      - role: candidate-parent
        alternatives:
        - profile: record-by-id
          fields:
          - record-id
    outputs:
      is-parent:
        concept: urn:example:concept:legal-parent-relationship:v1
        type: boolean
    validitySeconds: 300
    subjectBinding: audience-scoped
    representations:
    - signed-jws
    observationTimezone: UTC
    fixtures: fixtures/legal-parent-relationship.yaml
