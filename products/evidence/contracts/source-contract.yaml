contract: registry.evidence.fixed-http-json-source/v1
status: frozen
ownership:
  governed_bundle:
    - requirement acquisition kind, every source that kind fixes, each fetch stage's declared prior-fact allowlist, and any whole-acquisition ceiling the kind declares
    - the gated acquisition kinds the bundle declares it uses
    - each source's fixed origin, acquisition posture, authentication kind, and logical secret references
    - fixed method and fixed path, or complete-segment pathTemplate and pathBindings
    - fixed non-secret headers, closed selectorInputs, prepareScript, extractScript, adapter parameters, and the adapter-parameter, response, and fact schemas
    - preparation channel policy and bounds, response projection, redirect denial, timeout, response byte limit, and concurrency limit
    - optional logical TLS trust-profile name
  runtime_yaml:
    - bundle directory, listener and process bounds
    - the gated acquisition kinds this deployment enables; a bundle needing one absent from that list is refused before serving
    - file-secret root and audit-storage path
    - exact private-CA file binding for each governed logical TLS trust profile
  runtime_override: prohibited
  scripts:
    prepare: Renders only ordered query pairs and at most one JSON body from minimized authorized selectors, closed parameters, and the empty or validated prior FactSet supplied by Rust.
    extract: Maps only the bounded projected response, already inside its declared response schema, closed parameters, and the same prior FactSet to the closed lookup union.
    prohibited: source sequence, origin, method, path binding origin, headers, authentication, credentials, TLS, proxy, redirect, retry, pagination, concurrency, or request-count authority
evidence_data_request:
  count:
    single: Exactly one per evaluation.
    search-then-fetch: One search, followed only after a unique schema-valid match by one fetch; the ceiling is exactly two.
    search-then-fetch-set: One search, followed only after a unique schema-valid match by each declared fetch member in declared order; the ceiling is one plus the declared member count, at most five. The count is fixed by the bundle before any request is made, and no response can raise it, lower it, or reorder it. A member that does not resolve stops the acquisition, so an execution is always a prefix of the declared sequence.
    common_order: Successful authorization and request rate limiting occur once. Each actual source call requires its own durable access audit and complete RequestParts validation before credential resolution.
  retry: The HTTP client disables transport retry explicitly, so each configured stage yields at most one connection attempt and never creates an evidence-data request the declared acquisition did not already fix.
  acquisition_budget: A multi-call acquisition kind may declare one whole-acquisition ceiling in milliseconds, in the same [1, 30000] range one request carries. It bounds the source exchanges and the transitions between stages and never crosses a durable audit append. Exhaustion is a dependency failure naming the last stage actually executed, distinct from a per-source timeout.
  owner: Core runtime.
  method_allowlist: [GET, POST]
  request_media_types: [application/json]
  response_media_types: [application/json, application/graphql-response+json]
  redirects: deny
  maximum_response_bytes: {required: true, upper_bound: 1048576, applied: before parsing and projection}
  timeout_milliseconds: {required: true, range: [1, 30000], applies_to: [source-concurrency-admission, OAuth-single-flight-admission, HTTP-exchange]}
  concurrency_limit: {required: true, range: [1, 256]}
  request_parts:
    query: Ordered logical string pairs. Rust preserves duplicates, percent-encodes UTF-8 components exactly once with uppercase percent escapes, and never performs implicit value-to-string conversion.
    body: At most one bounded JSON value. JSON null means no body; GET sources must configure the JSON-body channel as forbidden and any defensive GET-with-body execution is rejected before concurrency admission or credential resolution.
    channels: Each source marks query and JSON body required, allowed, or forbidden and may configure tighter bounds beneath the ABI ceilings.
    validation_order: Rust validates the exact keys, types, channel policy, sizes, query controls, and normalized output before resolving credentials or contacting the source.
  path:
    fixed: One normalized absolute path.
    template: A placeholder occupies one complete segment and binds directly through tagged pathBindings either to one already authorized selector role, profile, and field or, on a fetch source only, one scalar fact required by the preceding search fact schema.
    prior_fact: Rust validates the search FactSet before path materialization; only string, signed 64-bit integer, and boolean facts can fill a fetch segment, using the same single-pass encoding and hostile-value rejection as selectors.
    template_reachability: A selector binding is mandatory against the selector set a request activates, not against the union of the sets. Every allowed set must therefore carry each selector-bound role and profile, and plan compilation refuses the source otherwise. A prior-fact binding is instead proven at startup against every search fact schema that can precede that fetch source, and, where the acquisition kind declares one, against that member's own closed allowlist of search fact names.
    prior_fact_projection: A fetch stage receives only the prior facts its acquisition kind gives it. Under search-then-fetch that is the whole validated search FactSet. Under search-then-fetch-set each member receives only the projection of that FactSet onto its declared allowlist, and the derivation receives the union of every stage, whose fact names startup has proven pairwise disjoint. The projection governs every channel a fact can leave through, including a request body that preparation builds, which no static binding check inspects; preparation is handed the projected map alone and so cannot name a fact outside the allowlist.
    encoding: Rust rejects missing, extra, duplicated, empty, slash, backslash, percent, control, and dot-segment values and percent-encodes each accepted segment exactly once.
    script_authority: prohibited
  fixed_headers:
    form: Ordered non-secret name and value constants, unique after ASCII case folding.
    forbidden_collisions:
      - authentication, host and routing, cookies, body framing, content length and type
      - connection and hop-by-hop, forwarding, proxy, tracing, and configured API-key headers
    classifier: One closed ASCII-case-insensitive deny set shared by startup configuration validation and source plan compilation. Prefix families are denied before exact names, and both checks run before any credential is resolved.
    denied_prefix_families: [x-forwarded-, proxy-, sec-, x-b3-, x-envoy-, x-datadog-, x-http-method]
    denied_names:
      - authorization
      - proxy-authorization
      - www-authenticate
      - proxy-authenticate
      - host
      - cookie
      - set-cookie
      - content-length
      - content-type
      - transfer-encoding
      - expect
      - connection
      - keep-alive
      - te
      - trailer
      - upgrade
      - proxy-connection
      - forwarded
      - via
      - x-real-ip
      - x-client-ip
      - x-cluster-client-ip
      - true-client-ip
      - cf-connecting-ip
      - fastly-client-ip
      - x-appengine-user-ip
      - x-azure-clientip
      - traceparent
      - tracestate
      - baggage
      - b3
      - x-cloud-trace-context
      - x-request-id
      - x-correlation-id
      - x-amzn-trace-id
      - x-original-url
      - x-rewrite-url
      - x-original-method
    core_headers: Rust owns authentication and framing and adds Content-Type application/json for a JSON body.
    script_authority: prohibited
  url_security:
    production: HTTPS only.
    deterministic_local_mock: HTTP only when the parsed host is a numeric address in 127.0.0.0/8 or exactly ::1.
    unauthenticated_local_source: The none authentication kind is admitted only by assuranceProfile local, only at an exact canonical HTTP numeric-loopback origin with an explicit non-zero port, and never with a TLS trust profile.
    prohibited: [arbitrary-insecure-http, DNS-localhost-alias, userinfo, fragment, ambiguous-host-encoding, product-specific-insecure-transport-flag]
projection:
  owner: Core runtime.
  stage: After bounded strict JSON parsing and before conversion to Rhai.
  grammar:
    root: Non-empty list of extended JSON Pointers.
    object_segments: RFC 6901 literal segments with only ~0 and ~1 escapes.
    array_segment: A literal wildcard '*' visits every current array element.
    prohibited: [numeric-array-index, recursive-descent, filters, predicates, unions, script-computed-paths]
  semantics:
    - A new tree retains only selected leaves and the objects or arrays needed to reach them.
    - Object keys not selected are removed; array order and length are preserved.
    - A missing selected leaf remains absent, while a missing or mistyped intermediate container is a source-protocol failure before Rhai.
    - Empty, invalid, duplicate, decoded-duplicate, ancestor/descendant-overlap, wildcard-overlap, or structurally incompatible paths fail startup.
    - Wire byte and parsing bounds apply before projection; Rhai bounds apply again to the projected tree.
  posture_rule: The declared acquisition posture describes the pre-projection wire response. Local projection never upgrades a record-transformed source claim.
response_shape:
  owner: Core runtime.
  stage: After projection and before conversion to Rhai, so no response outside its declared shape reaches a script.
  artifact: One required bundle-relative responseSchema per source, in the same closed JSON Schema subset as adapterParametersSchema and factSchema and validated by the same startup checks.
  role_relaxation: A response schema may list fewer required members than it declares properties, because projection legitimately drops a selected leaf the record did not carry. The adapter-parameter and fact roles keep the exact required-equals-properties rule.
  required_rule: Projection already decides which members a schema may require. A selected leaf can be absent, so requiring one turns an ordinary incomplete record into a source-protocol failure and must instead be checked by the script on the records that have to carry it. An intermediate container cannot be absent, because projection rejects the response before the shape is read, so requiring one only repeats the projection.
  nullable_form: A response schema node may write its type as the pair [T, "null"]. A source reports an explicit null where it holds no value and projection carries that null through verbatim, so the shape has to be able to say so. This is the only union the subset admits and only in the response role; null reaches the script as the same unit marker is_missing already reads.
  division_of_labour:
    schema: Member presence where the shape can guarantee it, member types, array bounds and uniqueness, string bounds and formats, and enumerated or constant values.
    script: Relations between fields the shape cannot state, such as how a reported total agrees with the records returned, page-count arithmetic, and which values must agree with the closed adapter parameters.
  failure: A projected response outside its declared shape is a source-protocol failure, indistinguishable in public output from any other one.
cardinality:
  preferred: Provider count plus at most one bounded result, field-projected where supported.
  fallback: At most two minimally projected results solely to distinguish a unique result from ambiguity.
  outcomes: [match, no_match, ambiguous]
  facts_only_on: match
  prohibited:
    - broad candidate retrieval, candidate exposure, score comparison, candidate choice, page traversal, retry, response-selected source or transport, an evidence-data request the declared acquisition kind did not already fix, or any acquisition kind beyond single, search-then-fetch, and search-then-fetch-set
    - converting provider inconsistency, returned-subject mismatch, or incomplete relationship data into no_match or an authoritative false concept
authentication:
  none:
    inputs: []
    placement: No authentication header is sent.
    rules:
      - The containing governed bundle must declare assuranceProfile local.
      - The source baseUrl must be an exact canonical numeric-loopback HTTP origin with an explicit non-zero port and no userinfo, path, query, or fragment.
      - Production and evidence-grade bundles reject this kind at startup; it is not a generic unauthenticated source profile.
  basic:
    inputs: [username_secret_ref, password_secret_ref]
    placement: Authorization header.
  static-authorization:
    inputs: [token_secret_ref, optional_scheme]
    placement: Authorization header.
    scheme_rule: RFC 9110 section 11.1 makes the authentication scheme an HTTP token the origin chooses, so a source may state the one it expects; absent, the runtime sends Bearer. The scheme is a governed bundle token, never derived from a request or a response, and static-api-key cannot serve a source that wants another scheme because its header name is refused by the collision denylist.
  static-api-key:
    inputs: [bundle_fixed_header_name, value_secret_ref]
    placement: The exact allowlisted provider header.
    rule: Header name is validated against the same collision denylist as fixed headers and cannot be Authorization.
  oauth2-client-credentials:
    inputs: [token_endpoint, client_id_secret_ref, optional_client_secret_ref, optional_client_assertion_key_secret_ref, optional_fixed_client_assertion_audience, optional_fixed_scope, optional_fixed_audience, optional_credential_placement, maximum_cache_lifetime, optional_assumed_token_lifetime]
    rules:
      - Token acquisition is credential bootstrap, not an evidence-data request or fact source.
      - Endpoint, grant, client authentication form, scope, audience, placement, response bounds, redirect denial, and cache maximum are fixed.
      - Waiting for the per-source token-cache and single-flight boundary is limited by the configured source timeout.
      - Cache lifetime is clamped to provider expiry and the configured maximum.
      - Token request and response are unavailable to Rhai and fully redacted.
    token_lifetime_rule: RFC 6749 section 5.1 makes expires_in recommended rather than required, so a token response carrying only access_token and token_type is accepted when the bundle configures assumedLifetimeSeconds. The assumed lifetime is a governed positive bundle value, never inferred from the token, and the cache is still clamped to the configured maximum. A provider that omits expires_in without a configured assumed lifetime, or returns a zero or non-numeric expires_in, remains a credential failure.
    token_extension_member_rule: 'RFC 6749 section 5.1 permits members beyond the ones it defines, and deployed authorization servers send them, so a token response member Version 1 does not read is ignored rather than refused. Ignoring is not trusting: an unread member is never a credential, is never available to Rhai, and is scrubbed with the rest of the parsed response. Every member Version 1 does read stays closed, so a wrong type or a scope other than the configured one remains a credential failure, and duplicate members remain a parse failure, which is what prevents a second access_token arriving as an extension.'
    client_authentication_forms: [client-secret, private-key-jwt]
    client_authentication_rule: 'A source declares exactly one client authentication form. clientSecretRef selects the client-secret form and requires credentialPlacement; clientAssertionKeyRef selects the private-key-jwt form and admits neither. RFC 7523 section 2.2 fixes the client-assertion type identifier, so it is not configurable, and the assertion lifetime is fixed rather than governed. The referenced secret is a private JWK the runtime signs with under the algorithm the key itself declares; SMART on FHIR Backend Services names ES384 and RS384 for that signature. A key the runtime cannot read is a credential failure raised before any token request, and neither the key nor the assertion is available to Rhai.'
    client_assertion_audience_rule: 'RFC 7523 section 3 requires only that the assertion audience identify the authorization server, states the token endpoint URL MAY be used, and leaves the exact string to out-of-band agreement, so it is governed rather than derived. clientAssertionAudience states it and is admitted only beside clientAssertionKeyRef, because a shared secret carries no claim to put it in; absent, the audience is the token endpoint, which is the value SMART on FHIR Backend Services requires. A server reached through a proxy or naming its issuer identifier expects a value the runtime never dials, so no same-origin relationship to the token endpoint is imposed. Section 3 has the server compare the value by Simple String Comparison, so the governed bytes are signed unchanged rather than reparsed as a URL. The audience names who may accept the assertion and never where the token request is sent.'
    credential_placements: [basic-header, form-body]
    credential_placement_rule: RFC 6749 section 2.3.1 defines Basic authentication and the request-body parameters and requires that those parameters never appear in the request URI. Version 1 offers no query-string placement, so no client identifier or secret can reach an authorization-server, proxy, or ingress URL log. The token URL, body, response, and debug output are still fully redacted.
    audience_rule: An authorization server that scopes a token to a named API reads a fixed audience token-request parameter, without which it returns a token the source cannot accept. The audience is a governed bundle string, never derived from a request or a response, and it is sent only when the bundle states it.
    token_endpoint_transport: The same HTTPS-or-explicit-numeric-loopback rule as the evidence-data origin.
  secret_rules:
    - The governed bundle contains only secret:file logical references. Environment-variable interpolation and literal secret values are not supported.
    - Runtime binds one owner-controlled file-secret root and cannot change a source authentication kind or logical reference.
    - Evidence-request processing resolves credentials only after authorization, access audit, preparation, and RequestParts validation.
    - Missing or invalid credentials fail closed without an evidence-data request.
tls_and_proxy:
  backend: The evidence-data and OAuth token clients select the rustls TLS backend explicitly, so workspace-wide dependency feature unification that enables an alternate backend elsewhere cannot change which backend these clients use.
  system_roots: Supported when runtime outboundTls.systemRoots is true.
  private_ca: A governed logical tlsTrustProfile must have exactly one regular, read-only, captured, bounded, valid runtime CA file binding before readiness; missing, extra, symlinked, mutable, and malformed bindings fail startup.
  verification: Fixed-origin and hostname verification remain mandatory; insecure, skip-verification, and trust-all modes do not exist.
  proxy: Evidence-data and OAuth token clients ignore HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, and NO_PROXY; Version 1 has no application-level proxy field.
acquisition_postures:
  source-derived:
    meaning: Source returns the final declared concept fact.
    claim: Acquisition and disclosure minimization.
  field-projected:
    meaning: Source returns only the facts required for in-process derivation.
    claim: Strong acquisition and disclosure minimization.
  record-transformed:
    meaning: A broader legacy record is transiently transformed in memory.
    claim: Disclosure minimization only.
  chained_rule: A multi-stage requirement has the weakest of every declared source posture it may call, whether that is two sources or five; chaining never upgrades a minimization claim, and adding a stage can only weaken one.
failure_classes:
  transport: [401, 403, 429, 5xx, timeout, redirect, invalid-json, duplicate-json-member, wrong-media-type, oversized-response]
  projection: [invalid-pointer, missing-intermediate, mistyped-intermediate, projected-input-oversized]
  response_shape: [missing-required-member, unexpected-member, wrong-member-type, out-of-bounds-value, oversized-array, duplicate-array-member]
  semantic: [no-match, ambiguous, required-fact-missing, wrong-fact-type, unknown-controlled-code]
  graphql_envelope_rule: Any top-level errors member, including partial data with errors, fails closed.
persistence:
  source_request_or_response: prohibited
  raw_fact: prohibited
  in_memory_lifetime: One bounded evaluation only; validated search facts are dropped with the fetch and are never placed in audit.
neutrality:
  production_contract: Generic HTTP, generic authentication, bounded JSON, extended JSON Pointer projection, and Rhai preparation and extraction only.
  named_compatibility_profiles: Test fixtures and reference documentation only.
fixtures:
  postures: ../fixtures/conformance/acquisition-postures.yaml
  oauth_credential_redaction: ../fixtures/conformance/oauth-credential-redaction.yaml
  shapes: ../fixtures/source-shapes/
  required_shape_outcomes: [zero, one, multiple, missing-fact, error-envelope]
