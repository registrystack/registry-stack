contract: registry.evidence.jws-profile/v1
status: frozen
response:
  media_type: application/jose+json
  serialization: flattened-jws-json
  members:
    required: [protected, payload, signature]
    prohibited: [header]
  payload: base64url without padding of the exact UTF-8 Evidence JSON bytes
  negotiation: Missing Accept, */*, and exact application/jose+json select this default signed format. Only the exact application/vnd.registrystack.evidence-unsigned+json media type selects the separately governed unsigned envelope, and only when the immutable bundle and the complete matched authority grant permit it. Every response varies on Accept and remains no-store.
request_batch:
  route: POST /v1/evidence/batch
  media_type: application/vnd.registrystack.evidence.request-batch+json
  rule: Every available item is one flattened JWS under this profile. The route admits no unsigned or SD-JWT VC serialization and performs no fallback between representations. An evidence_not_available item contains no JWS.
  envelope_integrity: The complete exact JSON envelope is bounded to 1048576 bytes, serialized before durable terminal release audit, and returned byte-for-byte afterward. The envelope itself has no additional signature; each evidence member is independently signed.
  singular_noninteraction: This media type is not accepted by POST /v1/evidence. The singular holder-bound batch media type application/vnd.registrystack.evidence.batch+json is not accepted by this route.
unsigned_envelope:
  media_type: application/vnd.registrystack.evidence-unsigned+json
  schema: registry.unsigned-evidence-envelope/v1
  members:
    required: [schema, type, integrityProtection, warning, evidence]
    prohibited: [protected, payload, signature, header]
  integrity: none; transport-authenticated convenience only, never later-verifiable evidence and never a fallback from any signed-path failure
  verifier_rule: The strict JWS verifier rejects this representation. A dedicated unsigned parser may validate the envelope, the Evidence schema, and expected policy fields, but returns an explicitly unverified result type and never the verified-JWS result type. Version 1 never uses JWS alg none, an empty signature, or a JWS-shaped unsigned object.
protected_header:
  exact_members: [alg, kid, typ, cty]
  alg:
    allowed: [ES256]
    rule: Must equal the algorithm bound to the trusted key.
  kid:
    required: true
    exact_length: 43
    rule: The RFC 7638 SHA-256 thumbprint of the exact public EC P-256 JWK, resolved only within the verifier-pinned provider JWKS.
  typ: {const: evidence+jws}
  cty: {const: application/evidence+json}
  prohibited: [jku, x5u, jwk, x5c, crit, b64]
signing:
  active_keys: 1
  algorithm: ES256 over P-256
  governed_active_public_key: signing.activePublicJwkFile
  published_public_keys: signing.publishedPublicJwkFiles are bundle-owned public JWKs and never contain private members
  revoked_key_ids: signing.revokedKeyIds are excluded from the active and published sets and from JWKS
  runtime_signer: local assurance uses signer.kind local-jwk; production and evidence-grade use signer.kind transit through a workload-local Unix socket with a pinned nonzero key version
  provider_controls: Transit metadata must report ecdsa-p256 with signing enabled, derived false, exportable false, allow_plaintext_backup false, and an exact public-key match. Evidence receives no provider token.
  startup_proof: The runtime signer public key must equal the governed active public JWK and pass one sign-and-verify test before readiness.
  bundle_private_key_material: prohibited
  order:
    - core validates the complete derivation result
    - core constructs the exact evidence payload including the exact request nonce
    - signing provider signs protected header plus payload
    - core serializes the final immutable response bytes
    - disclosure-release audit is durably accepted
    - the exact pre-audited bytes are released
  unsigned_order: For an explicitly authorized unsigned request the core performs no signing operation, still requires the ordinary signing dependency to be ready, constructs and serializes the final immutable envelope bytes, durably accepts disclosure-release audit, then releases those exact bytes.
  failure: safe 503 with no unsigned fallback
key_discovery:
  path: /.well-known/evidence/jwks.json
  media_type: application/jwk-set+json
  content: public keys only
  trust_rule: Discovery is not a trust anchor; provider identity and JWKS location are pinned through governed verifier configuration.
rotation:
  planned: Publish the next public key first, deploy every replica, keep the named Transit key's minimum signing version low enough for both pinned application versions, then atomically switch activePublicJwkFile and signer.keyVersion while leaving the predecessor published. Ordinary Vault/OpenBao ACLs grant the named key path rather than filtering the request-body key version.
  old_public_key_minimum_availability: maximum assertion validity plus allowed verifier clock skew
  emergency: Raise the Transit minimum signing version or otherwise disable the compromised version provider-side, remove its public key, add its thumbprint to revokedKeyIds, activate a replacement or remain unavailable, then restart every affected consumer.
  kid_reuse: prohibited for different key material
verifier_rules:
  - Parse flattened JWS with strict duplicate-member rejection.
  - Reject unprotected headers and any protected member outside the exact allowlist.
  - Resolve kid only in the pinned provider key set and require the allowlisted algorithm.
  - Reject a policy-denied kid before selecting a pinned public key, even when that key is present in a cached or retained JWKS.
  - Verify the signature before parsing or acting on payload claims.
  - Validate the strict payload against the complete committed Evidence JSON Schema before deserializing or applying relying-procedure policy.
  - Require the assurance profile, schema, issuer, provider, requirement, Evidence Type, purpose, audience, observation, validity, and configuration revision expected independently by the relying procedure. An authentic local assertion never satisfies a production or evidence-grade expectation.
  - Require the exact request nonce from the independently retained original request. Nonce reuse is not replay prevention and is not rejected by the runtime.
  - Require the exact expected role-bound opaque subject bindings as an unordered set of unique role and binding pairs, compared only after signature and schema verification. Expectations come from independent trusted state, never from the JWS under verification.
  - Require the exact expected concept identifiers, value forms, and cardinalities; missing, extra, duplicated, or wrongly formed output fails even under a valid signature.
  - Return one generic policy mismatch without revealing which hidden selector or policy comparison failed.
  - Impose a maximum accepted assertion lifetime in addition to current validity.
  - Treat validUntil as an exclusive upper bound and apply only the configured clock skew.
  - Report cryptographic authenticity separately from current validity; an expired assertion may remain authentic without being current evidence.
  - Do not infer source truth, legal-signature status, holder binding, or single-use semantics from a valid signature.
durable_verification_record:
  - the exact flattened JWS bytes
  - the original request and its request nonce
  - the expected audience, purpose, requirement, Evidence Type, issuer, and technical provider
  - the expected assurance profile
  - the expected role-bound subject bindings
  - the expected concept identifiers, forms, and cardinalities or the exact trusted requirement contract that defines them
  - the configuration revision
  - the trusted signing-key or JWKS snapshot selected through governed metadata
  - the trusted time at which current-validity verification was performed
negative_tests:
  - expected-assurance-profile-mismatch
  - jws-payload-modification
  - jws-protected-header-modification
  - jws-message-key-url-rejected
  - jws-unknown-kid-rejected
  - jws-revoked-kid-rejected
  - jws-schema-invalid-signed-payload-rejected
  - jws-retired-key-window
  - signing-failure-no-unsigned-success
  - expected-nonce-mismatch
  - expected-subject-set-mismatch
  - expected-output-contract-mismatch
  - assertion-lifetime-above-accepted-maximum
  - unsigned-envelope-rejected-by-jws-verifier
