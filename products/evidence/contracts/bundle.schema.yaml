$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registrystack.org/schemas/evidence/bundle-v1.json
title: Evidence immutable deployment bundle Version 1
type: object
additionalProperties: false
required: [version, assuranceProfile, service, issuer, authentication, audit, subjectBinding, rateLimits, signing, selectorProfiles, sources, authorityProfiles, requirements]
properties:
  version: {const: 1}
  assuranceProfile: {enum: [local, production, evidence-grade]}
  service:
    type: object
    additionalProperties: false
    required: [providerId, trustDomain]
    properties:
      providerId: {type: string, format: uri, maxLength: 512}
      trustDomain: {type: string, format: uri, maxLength: 512}
  issuer:
    type: object
    additionalProperties: false
    required: [id]
    properties: {id: {type: string, format: uri, maxLength: 512}}
  authentication: {$ref: '#/$defs/authentication'}
  audit: {$ref: '#/$defs/audit'}
  subjectBinding: {$ref: '#/$defs/subject-binding'}
  rateLimits: {$ref: '#/$defs/rate-limits'}
  signing:
    type: object
    additionalProperties: false
    required: [format, algorithm, activePublicJwkFile, publishedPublicJwkFiles, revokedKeyIds, jwksPath, maximumAssertionValiditySeconds, verifierClockSkewSeconds]
    properties:
      format: {const: flattened-jws-json}
      algorithm: {const: ES256}
      activePublicJwkFile: {$ref: '#/$defs/public-jwk-path'}
      publishedPublicJwkFiles:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {$ref: '#/$defs/public-jwk-path'}
      revokedKeyIds:
        type: array
        maxItems: 33
        uniqueItems: true
        items: {$ref: '#/$defs/service-key-id'}
      jwksPath: {const: /.well-known/evidence/jwks.json}
      maximumAssertionValiditySeconds: {type: integer, minimum: 1, maximum: 31536000}
      verifierClockSkewSeconds: {type: integer, minimum: 0, maximum: 300}
  responseFormats: {$ref: '#/$defs/response-formats'}
  selectorProfiles:
    type: object
    minProperties: 1
    maxProperties: 128
    propertyNames: {$ref: '#/$defs/local-id'}
    additionalProperties: {$ref: '#/$defs/selector-profile'}
  sources:
    type: object
    minProperties: 1
    maxProperties: 128
    propertyNames: {$ref: '#/$defs/local-id'}
    additionalProperties: {$ref: '#/$defs/source'}
  authorityProfiles:
    type: object
    minProperties: 1
    maxProperties: 128
    propertyNames: {$ref: '#/$defs/local-id'}
    additionalProperties: {$ref: '#/$defs/authority-profile'}
  acquisitionCapabilities:
    # Acquisition kinds this bundle opts in to beyond the frozen Version 1
    # forms. A gated kind absent from this list cannot be served, so a bundle
    # written before a form existed keeps serving exactly what it served
    # before. The Version 1 forms are absent from the enumeration on purpose:
    # every bundle already had them, so declaring one would say nothing and
    # omitting one would have to mean something.
    # An explicit empty list is accepted and says exactly what absence says.
    # The loader treats the two as one document, so refusing it here would
    # refuse a bundle startup loads.
    type: array
    maxItems: 1
    uniqueItems: true
    items: {enum: [search-then-fetch-set]}
  requirements:
    type: array
    minItems: 1
    maxItems: 128
    items: {$ref: '#/$defs/requirement'}
allOf:
  - if:
      properties: {assuranceProfile: {const: local}}
    then:
      properties:
        authentication:
          properties:
            issuer: {pattern: '^(?:https://|http://127\.0\.0\.1:[1-9][0-9]{0,4}$)'}
            jwksUri: {pattern: '^(?:https://|http://127\.0\.0\.1:[1-9][0-9]{0,4}/\.well-known/jwks\.json$)'}
  - if:
      properties: {assuranceProfile: {enum: [production, evidence-grade]}}
    then:
      properties:
        authentication:
          properties:
            issuer: {pattern: '^https://'}
            jwksUri: {pattern: '^https://'}
        requirements:
          items: {required: [fixtures]}
        sources:
          additionalProperties:
            properties:
              authentication:
                not:
                  type: object
                  required: [kind]
                  properties: {kind: {const: none}}
  - if:
      properties:
        assuranceProfile: {enum: [production, evidence-grade]}
        responseFormats: {contains: {const: sd-jwt-vc}}
      required: [assuranceProfile, responseFormats]
    then:
      properties:
        service:
          properties:
            providerId:
              type: string
              pattern: '^https://(?:[A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\])(?::[1-9][0-9]{0,4})?$'
  # A gated acquisition kind is served only where the bundle opted in, so a
  # document that uses one without declaring it is a document startup refuses.
  # The loader refuses it too, and states which requirement is at fault; the
  # contract states only that the pair is required, because that is the whole
  # of what a schema can see. Naming the capability rather than counting the
  # list keeps this true when a second gated kind joins the enumeration.
  - if:
      properties:
        requirements:
          contains:
            required: [acquisition]
            properties:
              acquisition:
                required: [kind]
                properties: {kind: {const: search-then-fetch-set}}
      required: [requirements]
    then:
      required: [acquisitionCapabilities]
      properties:
        acquisitionCapabilities: {contains: {const: search-then-fetch-set}}
$defs:
  local-id: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  uri: {type: string, format: uri, maxLength: 512}
  response-formats:
    # Closed enabled response formats. Signed flattened JWS is mandatory and
    # remains the default; the unsigned and SD-JWT VC formats must each be
    # enabled by the bundle and permitted by the complete matched grant.
    # Omission means signed only.
    type: array
    minItems: 1
    maxItems: 3
    uniqueItems: true
    contains: {const: signed-jws}
    items: {enum: [signed-jws, unsigned-json, sd-jwt-vc]}
  secret-ref:
    {type: string, pattern: '^secret:file/[a-z][a-z0-9._-]{0,127}$'}
  relative-path: {type: string, pattern: '^(adapters|derivations|schemas|codelists|fixtures)/[A-Za-z0-9._/-]+$'}
  public-jwk-path: {type: string, pattern: '^public-keys/[A-Za-z0-9._-]+\.jwk\.json$'}
  service-key-id: {type: string, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
  authentication:
    type: object
    additionalProperties: false
    required: [kind, issuer, audiences, tokenTypes, algorithms, jwksUri, principalClaim, requesterTagsClaim, evidenceAudienceClaim, grantIdClaim, grantAuthorityClaim, maximumTokenLifetimeSeconds, revokedKeyIds]
    properties:
      kind: {const: oidc-access-token}
      issuer: {type: string, pattern: '^https?://', maxLength: 512}
      audiences:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 512}
      tokenTypes:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {enum: [at+jwt, application/at+jwt]}
      algorithms:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items: {enum: [EdDSA, ES256, RS256]}
      jwksUri: {type: string, pattern: '^https?://', maxLength: 512}
      principalClaim: {$ref: '#/$defs/claim-name'}
      requesterTagsClaim: {$ref: '#/$defs/claim-name'}
      evidenceAudienceClaim: {$ref: '#/$defs/claim-name'}
      grantIdClaim: {$ref: '#/$defs/claim-name'}
      grantAuthorityClaim: {$ref: '#/$defs/claim-name'}
      maximumTokenLifetimeSeconds: {type: integer, minimum: 1, maximum: 86400}
      revokedKeyIds:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'}
      actorClaim: {$ref: '#/$defs/claim-name'}
  audit:
    type: object
    additionalProperties: false
    required: [format, hashSecretRef, hashKeyVersion, failClosed]
    properties:
      format: {const: keyed-jsonl}
      hashSecretRef: {$ref: '#/$defs/secret-ref'}
      hashKeyVersion: {type: integer, minimum: 1, maximum: 2147483647}
      failClosed: {const: true}
  subject-binding:
    type: object
    additionalProperties: false
    required: [secretRef, keyVersion]
    properties:
      secretRef: {$ref: '#/$defs/secret-ref'}
      keyVersion: {type: integer, minimum: 1, maximum: 2147483647}
  rate-limits:
    type: object
    additionalProperties: false
    required: [requestsPerPrincipalPerMinute, burstPerPrincipal, failedSelectorAttemptsPerPrincipalAuthorityPerMinute]
    properties:
      requestsPerPrincipalPerMinute: {type: integer, minimum: 1, maximum: 1000000}
      burstPerPrincipal: {type: integer, minimum: 1, maximum: 100000}
      failedSelectorAttemptsPerPrincipalAuthorityPerMinute: {type: integer, minimum: 1, maximum: 100000}
  claim-name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,127}$'}
  claim-path: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_-]*(\.[A-Za-z_][A-Za-z0-9_-]*)*$'}
  selector-profile:
    type: object
    additionalProperties: false
    required: [maximumAggregateBytes, fields]
    properties:
      maximumAggregateBytes: {type: integer, minimum: 1, maximum: 8192}
      fields:
        type: object
        minProperties: 1
        maxProperties: 16
        propertyNames: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        additionalProperties: {$ref: '#/$defs/selector-field'}
  selector-field:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, minimumBytes, maximumBytes]
        properties:
          type: {const: string}
          minimumBytes: {type: integer, minimum: 1, maximum: 8192}
          maximumBytes: {type: integer, minimum: 1, maximum: 8192}
      - type: object
        additionalProperties: false
        required: [type]
        properties: {type: {const: date}}
      - type: object
        additionalProperties: false
        required: [type, minimum, maximum]
        properties:
          type: {const: integer}
          minimum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
          maximum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
      - type: object
        additionalProperties: false
        required: [type]
        properties: {type: {const: boolean}}
      - type: object
        additionalProperties: false
        required: [type, codelist, codelistVersion, maximumBytes]
        properties:
          type: {const: controlled-code}
          codelist: {$ref: '#/$defs/relative-path'}
          codelistVersion: {type: string, minLength: 1, maxLength: 128}
          maximumBytes: {type: integer, minimum: 1, maximum: 8192}
  source:
    type: object
    additionalProperties: false
    required: [transport, baseUrl, posture, authentication, request, responseSchema, extractScript, factSchema]
    properties:
      transport: {const: http-json}
      baseUrl:
        oneOf:
          - {type: string, pattern: '^https://[^/?#]+$'}
          - {type: string, pattern: '^http://(127(\.[0-9]{1,3}){3}|\[::1\])(:[0-9]{1,5})?$'}
      posture: {enum: [source-derived, field-projected, record-transformed]}
      tlsTrustProfile: {$ref: '#/$defs/local-id'}
      authentication: {$ref: '#/$defs/source-authentication'}
      request: {$ref: '#/$defs/fixed-request'}
      responseSchema: {$ref: '#/$defs/relative-path'}
      extractScript: {$ref: '#/$defs/relative-path'}
      factSchema: {$ref: '#/$defs/relative-path'}
    allOf:
      - if:
          required: [authentication]
          properties:
            authentication:
              type: object
              required: [kind]
              properties: {kind: {const: none}}
        then:
          properties:
            baseUrl:
              type: string
              pattern: '^http://(?:127\.(?:0|[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.(?:0|[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.(?:0|[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|\[::1\]):(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
          not: {required: [tlsTrustProfile]}
  source-authentication:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties: {kind: {const: none}}
      - type: object
        additionalProperties: false
        required: [kind, usernameRef, passwordRef]
        properties:
          kind: {const: basic}
          usernameRef: {$ref: '#/$defs/secret-ref'}
          passwordRef: {$ref: '#/$defs/secret-ref'}
      - type: object
        additionalProperties: false
        required: [kind, tokenRef]
        properties:
          kind: {const: static-bearer}
          tokenRef: {$ref: '#/$defs/secret-ref'}
      - type: object
        additionalProperties: false
        required: [kind, headerName, valueRef]
        properties:
          kind: {const: static-api-key}
          headerName: {$ref: '#/$defs/configurable-header-name'}
          valueRef: {$ref: '#/$defs/secret-ref'}
      - type: object
        additionalProperties: false
        required: [kind, tokenEndpoint, clientIdRef, clientSecretRef, credentialPlacement, maximumCacheSeconds]
        properties:
          kind: {const: oauth2-client-credentials}
          tokenEndpoint:
            oneOf:
              - {type: string, pattern: '^https://[^?#]+$'}
              - {type: string, pattern: '^http://(127(\.[0-9]{1,3}){3}|\[::1\])(:[0-9]{1,5})?/[^?#]*$'}
          clientIdRef: {$ref: '#/$defs/secret-ref'}
          clientSecretRef: {$ref: '#/$defs/secret-ref'}
          scope: {type: string, minLength: 1, maxLength: 512}
          credentialPlacement: {enum: [basic-header, form-body]}
          maximumCacheSeconds: {type: integer, minimum: 0, maximum: 86400}
          assumedLifetimeSeconds: {type: integer, minimum: 1, maximum: 86400}
  fixed-request:
    type: object
    additionalProperties: false
    required: [method, selectorInputs, prepareScript, adapterParameters, adapterParametersSchema, preparationLimits, projection, redirects, timeoutMilliseconds, maximumResponseBytes, concurrencyLimit]
    properties:
      method: {enum: [GET, POST]}
      path: {type: string, pattern: '^/(?!/)[A-Za-z0-9._~!$&''()*+,;=:@%/-]*$'}
      pathTemplate: {type: string, minLength: 2, maxLength: 2048, pattern: '^/(?!/)[A-Za-z0-9._~!$&''()*+,;=:@%/{\}-]*$'}
      pathBindings:
        type: object
        minProperties: 1
        maxProperties: 16
        propertyNames: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        additionalProperties: {$ref: '#/$defs/path-binding'}
      fixedHeaders:
        type: array
        maxItems: 32
        items:
          type: object
          additionalProperties: false
          required: [name, value]
          properties:
            name: {$ref: '#/$defs/configurable-header-name'}
            value: {type: string, maxLength: 4096, pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'}
      selectorInputs:
        type: array
        minItems: 0
        maxItems: 8
        items: {$ref: '#/$defs/selector-input'}
      prepareScript: {$ref: '#/$defs/relative-path'}
      adapterParameters:
        type: object
        maxProperties: 64
        propertyNames: {$ref: '#/$defs/parameter-key'}
        additionalProperties: {$ref: '#/$defs/adapter-parameter-value'}
      adapterParametersSchema: {$ref: '#/$defs/relative-path'}
      preparationLimits: {$ref: '#/$defs/preparation-limits'}
      projection:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items: {type: string, minLength: 2, maxLength: 256, pattern: '^/(?!/)([^/~]|~[01]|/|\*)+$'}
      redirects: {const: deny}
      timeoutMilliseconds: {type: integer, minimum: 1, maximum: 30000}
      maximumResponseBytes: {type: integer, minimum: 1, maximum: 1048576}
      concurrencyLimit: {type: integer, minimum: 1, maximum: 256}
    oneOf:
      - required: [path]
        not: {anyOf: [{required: [pathTemplate]}, {required: [pathBindings]}]}
      - required: [pathTemplate, pathBindings]
        not: {required: [path]}
    allOf:
      - if:
          required: [method]
          properties: {method: {const: GET}}
        then:
          properties:
            preparationLimits:
              properties: {jsonBody: {const: forbidden}}
  selector-input:
    type: object
    additionalProperties: false
    required: [role, alternatives]
    properties:
      role: {$ref: '#/$defs/local-id'}
      alternatives:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: object
          additionalProperties: false
          required: [profile, fields]
          properties:
            profile: {$ref: '#/$defs/local-id'}
            fields:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
  path-binding:
    oneOf:
      - type: object
        additionalProperties: false
        required: [from, role, profile, field]
        properties:
          from: {const: selector}
          role: {$ref: '#/$defs/local-id'}
          profile: {$ref: '#/$defs/local-id'}
          field: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
      - type: object
        additionalProperties: false
        required: [from, field]
        properties:
          from: {const: prior-fact}
          field: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
  configurable-header-name:
    type: string
    minLength: 1
    maxLength: 64
    pattern: '^[!#$%&''*+.^_`|~0-9A-Za-z-]+$'
  parameter-key: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9._-]{0,127}$'}
  adapter-parameter-value:
    oneOf:
      - {type: boolean}
      - {type: integer, minimum: -9223372036854775808, maximum: 9223372036854775807}
      - {type: string, maxLength: 16384}
      - type: array
        maxItems: 256
        items: {$ref: '#/$defs/adapter-parameter-value'}
      - type: object
        maxProperties: 256
        propertyNames: {$ref: '#/$defs/parameter-key'}
        additionalProperties: {$ref: '#/$defs/adapter-parameter-value'}
  preparation-limits:
    type: object
    additionalProperties: false
    required: [query, jsonBody]
    properties:
      query: {enum: [required, allowed, forbidden]}
      jsonBody: {enum: [required, allowed, forbidden]}
      maximumQueryPairs: {type: integer, minimum: 1, maximum: 64}
      maximumQueryNameBytes: {type: integer, minimum: 1, maximum: 64}
      maximumQueryValueBytes: {type: integer, minimum: 1, maximum: 4096}
      maximumJsonDepth: {type: integer, minimum: 1, maximum: 32}
      maximumCollectionItems: {type: integer, minimum: 1, maximum: 256}
      maximumStringBytes: {type: integer, minimum: 1, maximum: 16384}
      maximumNormalizedBytes: {type: integer, minimum: 1, maximum: 65536}
    not:
      properties:
        query: {const: forbidden}
        jsonBody: {const: forbidden}
      required: [query, jsonBody]
  authority-profile:
    type: object
    additionalProperties: false
    required: [kind, requesterTags, grants]
    properties:
      kind: {enum: [statutory, organizational, consent, delegated, explicit-request]}
      requesterTags:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: '#/$defs/local-id'}
      grants:
        type: array
        minItems: 1
        maxItems: 128
        items:
          type: object
          additionalProperties: false
          required: [requirement, purpose, audienceFrom, subjects]
          properties:
            requirement: {$ref: '#/$defs/uri'}
            purpose: {type: string, pattern: '^[a-z][a-z0-9._:-]{0,127}$'}
            audienceFrom: {const: authenticated-requester}
            responseFormats: {$ref: '#/$defs/response-formats'}
            subjects:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required: [role, selectorProfile, valueOrigin]
                properties:
                  role: {$ref: '#/$defs/local-id'}
                  selectorProfile: {$ref: '#/$defs/local-id'}
                  valueOrigin: {enum: [authenticated-context, authenticated-grant, request]}
                  valueClaims:
                    type: object
                    minProperties: 1
                    maxProperties: 16
                    propertyNames: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
                    additionalProperties: {$ref: '#/$defs/claim-path'}
                allOf:
                  - if:
                      required: [valueOrigin]
                      properties:
                        valueOrigin: {enum: [authenticated-context, authenticated-grant]}
                    then: {required: [valueClaims]}
                  - if:
                      required: [valueOrigin]
                      properties:
                        valueOrigin: {const: request}
                    then:
                      not: {required: [valueClaims]}
  acquisition:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, source]
        properties:
          kind: {const: single}
          source: {$ref: '#/$defs/local-id'}
      - type: object
        additionalProperties: false
        required: [kind, search, fetch]
        properties:
          kind: {const: search-then-fetch}
          search: {$ref: '#/$defs/local-id'}
          fetch: {$ref: '#/$defs/local-id'}
      # One search followed by the declared fetch members, executed in the
      # order they appear. Each member reads only the search facts it lists,
      # and the budget covers the whole acquisition.
      - type: object
        additionalProperties: false
        required: [kind, search, fetch, maximumAcquisitionMilliseconds]
        properties:
          kind: {const: search-then-fetch-set}
          search: {$ref: '#/$defs/local-id'}
          fetch:
            type: array
            minItems: 2
            maxItems: 4
            items:
              type: object
              additionalProperties: false
              required: [source, factInputs]
              properties:
                source: {$ref: '#/$defs/local-id'}
                factInputs:
                  type: array
                  minItems: 1
                  maxItems: 16
                  uniqueItems: true
                  items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
          maximumAcquisitionMilliseconds: {type: integer, minimum: 1, maximum: 30000}
  requirement:
    type: object
    additionalProperties: false
    required: [id, kind, acquisition, purposes, subjectRoles, referenceFrameworks, evidenceType, validitySeconds, derivation, concepts, disclosureGuard, existenceDisclosure]
    properties:
      id: {$ref: '#/$defs/uri'}
      kind: {enum: [criterion, information-requirement, constraint]}
      acquisition: {$ref: '#/$defs/acquisition'}
      purposes:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9._:-]{0,127}$'}
      subjectRoles:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: object
          additionalProperties: false
          required: [role, cardinality, selectorProfiles]
          properties:
            role: {$ref: '#/$defs/local-id'}
            cardinality: {const: one}
            selectorProfiles:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items: {$ref: '#/$defs/local-id'}
      referenceFrameworks:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: '#/$defs/uri'}
      evidenceType: {$ref: '#/$defs/uri'}
      observationTimezone: {type: string, minLength: 1, maxLength: 128}
      validitySeconds: {type: integer, minimum: 1, maximum: 31536000}
      derivation:
        type: object
        additionalProperties: false
        required: [script, parameters]
        properties:
          script: {$ref: '#/$defs/relative-path'}
          selectorInputs:
            type: array
            maxItems: 8
            items: {$ref: '#/$defs/selector-input'}
          parameters:
            type: object
            maxProperties: 32
            additionalProperties: {$ref: '#/$defs/parameter-value'}
      concepts:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: object
          additionalProperties: false
          required: [id, form, required]
          properties:
            id: {$ref: '#/$defs/uri'}
            form: {enum: [boolean, controlled-code, controlled-category, bounded-integer, bounded-decimal, date-bucket, time-bucket, audience-scoped-entity-reference, controlled-code-list, entity-reference-list, reviewed-structured-value]}
            required: {type: boolean}
            constraints: {type: object}
            sdJwtVc: {$ref: '#/$defs/sd-jwt-vc-concept-projection'}
          allOf:
            - oneOf:
                - properties:
                    form: {const: boolean}
                    constraints: {$ref: '#/$defs/boolean-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: controlled-code}
                    constraints: {$ref: '#/$defs/controlled-code-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: controlled-category}
                    constraints: {$ref: '#/$defs/controlled-category-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: bounded-integer}
                    constraints: {$ref: '#/$defs/bounded-integer-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: bounded-decimal}
                    constraints: {$ref: '#/$defs/bounded-decimal-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: date-bucket}
                    constraints: {$ref: '#/$defs/bucket-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: time-bucket}
                    constraints: {$ref: '#/$defs/bucket-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: audience-scoped-entity-reference}
                    constraints: {$ref: '#/$defs/entity-reference-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: controlled-code-list}
                    constraints: {$ref: '#/$defs/controlled-code-list-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: entity-reference-list}
                    constraints: {$ref: '#/$defs/entity-reference-list-constraints'}
                - required: [constraints]
                  properties:
                    form: {const: reviewed-structured-value}
                    constraints: {$ref: '#/$defs/reviewed-structured-value-constraints'}
            - if: {required: [sdJwtVc]}
              then:
                properties:
                  form: {const: reviewed-structured-value}
      fixtures: {$ref: '#/$defs/relative-path'}
      disclosureGuard:
        type: object
        additionalProperties: false
        required: [families]
        properties:
          families:
            type: array
            minItems: 1
            maxItems: 16
            uniqueItems: true
            items: {$ref: '#/$defs/uri'}
      existenceDisclosure: {enum: [collapse-unresolved]}
  boolean-constraints:
    type: object
    additionalProperties: false
    maxProperties: 0
  controlled-code-constraints:
    type: object
    additionalProperties: false
    required: [codelist, codelistVersion, maximumBytes]
    properties:
      codelist: {$ref: '#/$defs/relative-path'}
      codelistVersion: {type: string, minLength: 1, maxLength: 128}
      maximumBytes: {type: integer, minimum: 1, maximum: 8192}
  controlled-category-constraints:
    type: object
    additionalProperties: false
    required: [categoryScheme, schemeVersion, codelist, maximumBytes]
    properties:
      categoryScheme: {$ref: '#/$defs/uri'}
      schemeVersion: {type: string, minLength: 1, maxLength: 128}
      codelist: {$ref: '#/$defs/relative-path'}
      maximumBytes: {type: integer, minimum: 1, maximum: 8192}
  bounded-integer-constraints:
    type: object
    additionalProperties: false
    required: [minimum, maximum]
    properties:
      minimum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
      maximum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
  bounded-decimal-constraints:
    type: object
    additionalProperties: false
    required: [minimum, maximum, maximumScale]
    properties:
      minimum: {$ref: '#/$defs/canonical-decimal-text'}
      maximum: {$ref: '#/$defs/canonical-decimal-text'}
      maximumScale: {type: integer, minimum: 0, maximum: 9}
  canonical-decimal-text:
    type: string
    pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$'
  bucket-constraints:
    type: object
    additionalProperties: false
    required: [bucketScheme, schemeVersion]
    properties:
      bucketScheme: {$ref: '#/$defs/uri'}
      schemeVersion: {type: string, minLength: 1, maxLength: 128}
  entity-reference-constraints:
    type: object
    additionalProperties: false
    required: [maximumBytes]
    properties:
      maximumBytes: {type: integer, minimum: 1, maximum: 8192}
  controlled-code-list-constraints:
    type: object
    additionalProperties: false
    required: [codelist, codelistVersion, minimumItems, maximumItems, unique]
    properties:
      codelist: {$ref: '#/$defs/relative-path'}
      codelistVersion: {type: string, minLength: 1, maxLength: 128}
      minimumItems: {type: integer, minimum: 1, maximum: 64}
      maximumItems: {type: integer, minimum: 1, maximum: 64}
      unique: {const: true}
  entity-reference-list-constraints:
    type: object
    additionalProperties: false
    required: [minimumItems, maximumItems, unique]
    properties:
      minimumItems: {type: integer, minimum: 1, maximum: 64}
      maximumItems: {type: integer, minimum: 1, maximum: 64}
      unique: {const: true}
  reviewed-structured-value-constraints:
    type: object
    additionalProperties: false
    required: [schema, maximumSerializedBytes]
    properties:
      schema: {$ref: '#/$defs/uri'}
      maximumSerializedBytes: {type: integer, minimum: 1, maximum: 65536}
  sd-jwt-vc-concept-projection:
    type: object
    additionalProperties: false
    required: [claim, disclosure]
    properties:
      claim:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
      disclosure: {const: top-level}
  parameter-value:
    oneOf:
      - {type: string, maxLength: 1024}
      - {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
      - {type: boolean}
      - {$ref: '#/$defs/decimal-value'}
      - type: array
        minItems: 1
        maxItems: 64
        items: {$ref: '#/$defs/bucket-boundary'}
  decimal-value:
    type: object
    additionalProperties: false
    required: [type, value]
    properties:
      type: {const: decimal}
      value: {type: string, pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$'}
  bucket-boundary:
    type: object
    additionalProperties: false
    required: [minimumInclusive, maximumExclusive, code]
    properties:
      minimumInclusive: {$ref: '#/$defs/decimal-value'}
      maximumExclusive: {$ref: '#/$defs/decimal-value'}
      code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
bundle_layout:
  root: evidence.yaml
  allowed_directories: [adapters, derivations, schemas, codelists, fixtures, public-keys]
  symlinks: prohibited
  path_escape: prohibited
  unknown_files: prohibited
atomic_revision:
  digest: sha256 over a canonical sorted path manifest plus exact file bytes
  trust: Established by operator deployment controls, not by the digest itself.
  lifetime: Mounted read-only and loaded once; reload, merge, mutation, fallback, and partial serving are prohibited.
startup_checks:
  - Unique stable identifiers and no dangling references.
  - Complete role/profile/origin/authority/source bindings.
  - Secret references resolve without expanding values into YAML or diagnostics.
  - Scripts compile and use only the Version 1 ABI and primitive allowlist.
  - Schemas and codelists are closed, versioned, bounded, and referenced.
  - Each reviewed structured-value schema URI resolves to exactly one schema artifact by its `$id`; missing, duplicate, unreferenced, or open schemas fail startup.
  - Each date- or time-bucket scheme URI and version resolves to exactly one reviewed codelist artifact; missing, duplicate, or unreferenced schemes fail startup.
  - Fixtures cover positive, negative, boundary, missing, no-match, ambiguous, source failure, and anti-reconstruction cases.
  - The complete simultaneously enabled requirement set passes disclosure-combination review.
  - No two enabled requirements share a disclosureGuard family; a shared family rejects the bundle regardless of purposes, audiences, requester entitlements, or rate limits.
  - Each context-derived or grant-derived subject has valueClaims whose keys exactly equal the named selector profile field set; missing, extra, duplicate-target, or invalid claim paths fail startup.
  - Request-derived subjects have no valueClaims.
  - Request preparation receives only the closed selectorInputs alternatives and the exact adapter context of parameters plus empty or validated prior facts; it cannot choose transport authority, path-binding origin, headers, credentials, or request count.
  - Configured authority claim names are distinct and none names a registered JWT claim; `sub` is permitted for principalClaim alone, because it already carries the principal. A repeated or shadowing name would read one verified token member as something the issuer wrote for another purpose.
  - For authenticated-grant origin, verified token values at authentication.grantIdClaim and grantAuthorityClaim must exist, grantAuthority must exactly equal the matched authority-profile identifier, and the same entitlement must bind requirement, purpose, audience, role, selector profile, and valueClaims result before selector resolution.
  - Required signing, audit, credential, and source dependencies are ready.
  - The active and published public JWK files are public-only exact ES256 P-256 JWKs whose 43-character kid equals their RFC 7638 thumbprint; paths, kids, and key material are unique and no revoked identifier is active, published, or served.
  - The active plus published set contains at most 33 keys. A published predecessor remains available for the maximum assertion validity plus clock skew, unless emergency revocation requires immediate removal and denylisting.
  - The runtime signer matches the governed active public JWK exactly and passes a startup sign-and-verify test; local assurance uses local-jwk and production or evidence-grade uses Transit.
  - Every secret reference uses the closed file-secret grammar and is resolved beneath runtime.yaml secretProviders.file.root.
  - Fixed path and path-template forms are mutually exclusive and every template placeholder has exactly one tagged selector or prior-fact binding. Prior-fact bindings are allowed only on fetch sources and must name a scalar property required by every preceding search fact schema.
  - Every selector set an authority grant can activate for a source carries each role and profile that source's selector path bindings require. The sets are derived one per grant, so covering a bound role across their union is not enough: a single grant omitting one yields a set with no value to substitute, which fails startup rather than every request that grant would serve.
  - Fixed headers and static API-key header names reject authentication, routing, framing, cookie, forwarding, proxy, tracing, and hop-by-hop collisions after ASCII case folding.
  - Extended JSON Pointer projections are non-empty, uniquely decoded, and reject duplicate or overlapping ancestor, descendant, and wildcard paths.
  - Every source preparation, extraction, and derivation selector-input contract is closed and cross-referenced to the exact authorized role/profile/field set.
secret_policy:
  permitted: File-provider logical names matching the exact secret-reference grammar only.
  prohibited: private key, password, bearer token, client secret, or expanded environment value in any bundle file
  oauth_placement_rule: Client credentials travel in the Authorization header or the token request body only. There is no query-string placement, so no credential can reach a token URL, and the token URL, body, response, and debug output are still fully redacted.
  file_provider_rule: Resolve secret:file logical names beneath the configured owner-controlled fileRoot, reject symlinks and path traversal, require regular owner-only files, and parse values as data.
deployment_rules:
  authentication: Evidence independently validates the bearer token against exact configured issuer, audience, token type, algorithm, and JWKS; upstream identity headers are ignored and rejected if mapped
  audit: failClosed and keyed pseudonymization remain governed; storage path and rotation bound come only from runtime.yaml
  rate_limit_labels: principal and authority use scoped pseudonyms; raw selector values are never labels or keys
  source_urls: HTTPS is required except explicit HTTP numeric loopback on 127.0.0.0/8 or ::1 for deterministic local mocks; Rust parses IP and port strictly and rejects userinfo, DNS localhost aliases, non-loopback HTTP, invalid octets, fragments, and URL ambiguity
  runtime_split: runtime.yaml cannot override any field in this schema; the two closed documents have independent digests and immutable startup lifetimes
