contract: registry.evidence.oid4vci-profile/v1
status: frozen
status_rule: >-
  This was draft until every negative test named below existed, because a frozen
  contract whose tests do not exist is an aspiration rather than a guarantee.
  Each identifier under negative_tests now resolves through
  security-test-traceability.yaml to executable tests, and the traceability
  checker proves each of those names a real test item, so freezing states what
  is enforced rather than what is intended. Frozen means the statements here may
  be relied on and changed only by the review the security invariant matrix
  requires; it does not mean the delivery surface is finished, and the
  prohibitions below stay prohibitions.
summary: >-
  A wallet-facing OpenID for Verifiable Credential Issuance delivery front end
  for holder-bound Evidence assertions. It is a supporting service and a
  protocol adapter, not a third pattern and not part of the Evidence runtime:
  it never signs a credential, never holds a holder private key, and adds no
  Evidence semantics. It translates a pre-authorized code flow into exactly one
  holder-bound Evidence batch request, so N wallet proofs cost one
  authorization decision and one source acquisition. Every Evidence guarantee
  a delivered credential carries is the holder-bound profile's guarantee,
  unchanged and unmediated by this service.
standards_profile:
  oid4vci: OpenID for Verifiable Credential Issuance 1.0, Final, published 2025-09-16
  credential_format: dc+sd-jwt
  proof_type: jwt, with the bare header type openid4vci-proof+jwt
  evolution_rule: A later revision is a reviewed profile change, never an implicit library upgrade.
  draft_compatibility: >-
    None in the 1.0 Final profile described by this contract: it accepts and
    emits no Draft 13 shape. Draft 13's vc+sd-jwt format identifier is never
    used, and the token-response c_nonce is neither accepted nor emitted by
    any 1.0 route. A Draft 13 compatibility profile exists beside it as a
    separate profile (see draft13_compatibility_profile), off unless
    configured, and removable as one unit; it widens nothing in this profile.
  interoperability_target:
    status: exact-pinned-evidence-passed
    tested_on: 2026-08-09
    inji_wallet_develop: 2fa12c3285b6523db340c3dd2333454b750b40a4
    inji_vci_client_android_develop: f1d7ee2b14e996e18bfc7c40fbf89ec31b768951
    inji_vci_client_ios_develop: dbe60eef9a8c7b71ba58ee81cc7d0e5a92af7c7c
    claim_rule: >-
      The sanitized Registry flow and these revisions' focused public client
      tests passed through the reproducible runner tracked by issue 690. This
      is bounded interoperability evidence for the exact revisions and test
      conditions, not device or UI evidence, another-revision compatibility,
      certification, full conformance, or general Inji compatibility.
draft13_compatibility_profile:
  status: draft
  purpose: >-
    The France Identite Partenaires test wallet accepts third-party issuance
    only over OpenID4VCI Draft 13. This profile lets it receive the same
    dc+sd-jwt credentials Evidence signs. It is a compatibility profile for
    that wallet family, not a second supported protocol revision, and it is
    removed when the wallet moves to 1.0.
  separation:
    - Its own issuer identifier is the 1.0 credential issuer followed by /protocol/oid4vci/draft-13, and its own path prefix is that same suffix. Every route of the profile lives under the prefix.
    - It is off unless the runtime file carries draft13Profile as an empty mapping. When absent, none of its routes exist and the 1.0 routes, metadata and wire behaviour are exactly what this contract describes. When present, the 1.0 routes, metadata and wire behaviour are unchanged.
    - It is removable as one unit; the profile module, its handlers, the draft13Profile configuration member and the one route registration are the whole of it.
    - It shares the offer store, the offer authorization and the Evidence client with the 1.0 profile and nothing redeemable. Offers and access tokens are bound to a catalog generation of the profile's own, so a code or token minted for one profile is unknown to the other and a refused cross-profile attempt spends nothing.
    - Nonces are not shared. The c_nonce is a keyed tag over its expiry and the access token it is delivered with, in a key-space of its own, so it opens that one exchange and neither a 1.0 nonce nor another exchange's c_nonce verifies.
    - The service still signs nothing and alters no credential. The credential is the dc+sd-jwt credential Evidence signed for the holder key the proof presented, delivered byte for byte, binding that key in cnf.jwk.
  endpoints:
    - path: GET /protocol/oid4vci/draft-13/.well-known/openid-credential-issuer
      rule: >-
        Plain JSON, never signed. Publishes credential_issuer (the profile's
        issuer identifier), credential_endpoint, token_endpoint,
        grant_types_supported, the singular token_endpoint_auth_method of
        none, and credential_configurations_supported derived from the same
        authenticated Evidence discovery as the 1.0 catalog. It publishes no
        authorization_servers, no nonce_endpoint and no batch member. The
        document is addressed by appending the well-known suffix to the
        profile's issuer identifier, not by inserting it between host and path.
    - path: POST /protocol/oid4vci/draft-13/offers
      rule: >-
        The adopter-facing offer endpoint of the profile, with the same request
        body, the same resource-server authorization, the same attribution
        audit and the same refusals as POST /offers. It returns the Draft 13
        offer object: credential_issuer is the profile's issuer identifier, the
        grant carries the pre-authorized_code and, when a transaction code was
        asked for, a tx_code description, otherwise user_pin_required false.
    - path: POST /protocol/oid4vci/draft-13/token
      rule: >-
        Form-encoded, pre-authorized code grant only, no client authentication.
        Returns access_token, token_type of lowercase bearer, expires_in,
        c_nonce and c_nonce_expires_in. There is no nonce endpoint.
    - path: POST /protocol/oid4vci/draft-13/credential
      rule: >-
        Bearer access token. Accepts format (dc+sd-jwt), vct (the type the offer
        was created for) and one proof object whose proof_type is jwt. The
        plural proofs member and credential_configuration_id are refused. The
        access token is claimed before the request is read, so every later
        refusal is terminal for the exchange and returns no fresh c_nonce.
        Returns one credential. Errors are invalid_credential_request,
        unsupported_credential_format, unsupported_credential_type,
        invalid_proof (which also covers an unusable nonce, because Draft 13 has
        no invalid_nonce), and the post-claim credential_request_denied.
  proof_rules: >-
    The proof validator is the 1.0 profile's, with these differences only: aud
    is the profile's issuer identifier, so the 1.0 issuer identifier is
    refused, and the nonce must be the c_nonce delivered with the same access
    token. The header type, the ES256 algorithm, the closed key reference
    rules, the iss absence rule, the freshness window and the signature-first
    parsing are unchanged.
  wallet_workaround:
    rule: >-
      Partenaires Android 1.3.5078 rejects the specification binding method jwk
      for dc+sd-jwt. Every configuration in this profile, and only this
      profile, therefore advertises cryptographic_binding_methods_supported of
      cose_key. The credential is unchanged and still binds the holder key in
      cnf.jwk; the advertised value only lets that build proceed. The 1.0
      metadata never advertises cose_key.
  wire_differences_from_1_0: >-
    Issuer identifier and well-known location; token_endpoint, grant_types_supported
    and token_endpoint_auth_method in the metadata and no authorization_servers
    or nonce_endpoint; lowercase bearer and c_nonce in the token response;
    format and vct with a singular proof in place of credential_configuration_id
    with plural proofs; a singular credential in place of a credentials array;
    invalid_proof in place of invalid_nonce; the Draft 13 offer object. Sources:
    OpenID4VCI Draft 13 sections 6.2 and 7.2, and the Partenaires Draft 13
    guide, whose sections follow the order of this list.
  not_supported:
    - signed metadata, DPoP, pushed authorization requests, wallet attestation and client authentication
    - the authorization code flow, deferred issuance, the notification endpoint and offers by reference
    - batch issuance, plural proofs and any credential format other than dc+sd-jwt
    - the mso_mdoc format and the vc+sd-jwt format identifier
  open_items:
    - Behaviour on a Partenaires device is unconfirmed. The wallet might need user_pin_required or a by-reference offer URI; neither has been tested on a device.
service_boundary:
  rule: >-
    Each of the following is a property the service must not have. The first
    three and the fifth are held by named negative tests below; source-product
    and domain neutrality are held by the same repository-wide neutrality sweep
    that covers the Evidence runtime; the one-way dependency is held by the
    workspace manifests, which no Evidence crate may amend without the review
    this profile requires.
  items:
    - It holds no Evidence signing key and signs no credential. Evidence signs; this service transports.
    - It holds no holder private key. It receives holder public keys inside wallet-signed proof JWTs and passes them to Evidence unchanged.
    - It adds no Evidence semantics: no requirement, no selector, no derivation, no acceptance rule, and no binding of its own.
    - It is source-product neutral and domain neutral, under the same sweeps as the Evidence runtime.
    - No Evidence crate depends on it at runtime. The dependency runs one way only.
  consequence: >-
    A credential delivered through this service is bit-for-bit the credential
    Evidence would have issued to the same holder keys under the same
    requirement and purpose. A relying party verifies it against the
    holder-bound profile without knowing this service exists, and nothing here
    is part of the trust chain it checks.
endpoints:
  - path: GET /.well-known/openid-credential-issuer
    authorization: none
    rule: >-
      Publishes credential_issuer, credential_endpoint, nonce_endpoint,
      authorization_servers and credential_configurations_supported. It also
      publishes batch_credential_issuance when the effective holder-bound
      ceiling is at least two; batch_size is then that ceiling in the range 2
      through 16. Omitting the member means only a single proof is accepted,
      still inside the plural proofs and credentials envelopes. The token
      endpoint is not published here; it is published by the authorization
      server metadata below, which is what authorization_servers points a
      wallet at. Every credential_configurations_supported entry is derived
      from the Evidence bundle's authenticated discovery rather than
      hand-written, so it describes that discovered generation rather than an
      adapter-authored capability. The complete discovered document must pass
      the Evidence request contract's lexical, cardinality, uniqueness, and
      response-format rules before any entry is published; a malformed sibling
      is a catalog failure rather than a partially advertised deployment. The
      batch_credential_issuance batch_size is
      the backing deployment's effective holder-bound batch
      ceiling from authenticated Evidence discovery, bounded again by the
      Evidence client's compile-time request ceiling. Discovery is cached and
      that effective value is captured with each offer so the adapter enforces
      one catalog generation consistently before proof processing. Capturing it
      does not make a later Evidence generation honor the old ceiling. Stop the
      adapter and discard its outstanding exchanges before changing or
      restarting the backing Evidence bundle, then restart the adapter after
      Evidence is ready so it begins from fresh authenticated discovery.
  - path: GET /.well-known/oauth-authorization-server
    authorization: none
    rule: >-
      The RFC 8414 document for the authorization server this service is, for
      the pre-authorized code grant alone. It publishes issuer, token_endpoint,
      the one supported grant type, and token_endpoint_auth_methods_supported
      of none, because a pre-authorized flow authenticates the code rather than
      the client. OpenID4VCI 1.0 Final permits a server that supports only this
      grant to omit response_types_supported despite RFC 8414 requiring it, so
      the metadata omits the member rather than publishing an empty array or
      advertising an authorization response the service does not support. It
      also publishes
      pre-authorized_grant_anonymous_access_supported as true, spelled with the
      hyphen inside pre-authorized that OpenID4VCI gives it, which is what tells
      a wallet holding no client registration that it may redeem a code anyway.
  - path: POST /offers
    authorization: issuer-issued bearer token, verified as a resource server through the shared OIDC primitive
    rule: >-
      Adopter-facing, never wallet-facing. It accepts a credential
      configuration identifier, the subject selector values that identify who
      the credential is about, and whether a transaction code is wanted; the
      purpose and every other Evidence parameter come from the bundle-derived
      catalog rather than from the caller. It returns the offer object, its
      openid-credential-offer URI, and, when one was asked for, the transaction
      code itself, once and only in that response. This is the authorization
      boundary of the whole service: it accepts selector values and will cause a
      credential to be issued for whoever those values identify, so it is
      protected at least as strongly as calling Evidence directly. Every
      request-origin selector must carry exactly the catalog's field set, with
      each value matching its published scalar type and bounds. A mismatch is
      refused before generating an offer secret or writing exchange state. An
      available normalized client and/or verified subject are recorded as
      distinct keyed pseudonyms under a server-generated opaque exchange
      identifier, and a token carrying neither is refused. When a client is
      present, it is the verifier's normalized matched client; without a client
      allowlist, azp is authoritative over client_id. The attempted and
      created audit entries must reach the configured destination before the
      offer is released; audit refusal fails closed without returning it.
  - path: POST /token
    authorization: pre-authorized code, and the transaction code when the offer declared one
    rule: >-
      Grant type urn:ietf:params:oauth:grant-type:pre-authorized_code only.
      Returns access_token, token_type and expires_in, and never c_nonce, which
      Final moved to its own endpoint.
  - path: POST /nonce
    authorization: none, as the specification requires
    rule: >-
      Empty body or empty JSON object, a c_nonce response, and Cache-Control
      no-store. Nothing
      about the caller is read: no header is inspected, so a nonce is minted for
      a caller this service cannot name and is bound to no access token. The
      nonce is a freshness challenge, a keyed tag over its own expiry, verified
      by recomputation, so an unauthenticated endpoint cannot be turned into a
      memory-exhaustion target by asking for nonces, and nothing here looks
      anything up, so nothing here can be used as an oracle. Binding it to a
      token would make it unreachable rather than stronger: the endpoint the
      specification defines carries no token to bind to, so a conforming wallet
      would hold a nonce the credential endpoint could never accept.
  - path: POST /credential
    authorization: bearer access token
    rule: >-
      Accepts credential_configuration_id and a proofs object keyed by proof
      type whose value is a non-empty array. One proof is valid whether or not
      batch_credential_issuance is advertised. Returns credentials as an array
      of objects even for a single credential, which is Final's shape and maps
      one to one onto the holder-bound batch. The access token is claimed before
      proof inspection. Any later Evidence refusal or failure is therefore
      terminal for that exchange and returns 400 credential_request_denied with
      the fixed value-free description "this credential request cannot be
      completed"; the wallet must begin a newly authorized exchange. A transient
      dependency or bounded-state failure detected before a code or token is
      claimed may still return 503 temporarily_unavailable and invite retry of
      that unclaimed authorization. After token claim, the adapter writes an
      attempted delivery entry under the offer's opaque exchange identifier
      before proof processing or Evidence I/O. It records the terminal proof,
      Evidence, internal, or released outcome before returning the response;
      audit refusal releases no credential and returns the same terminal
      credential_request_denied response as every other post-claim failure.
      Timeout or cancellation records unfinished while the token remains spent.
  - path: GET /health and GET /ready
    authorization: none
    rule: >-
      Operational probes, not protocol surface. They report that the process is
      running and whether its required local audit destination can accept
      entries. Readiness deliberately says nothing about the deployments this
      service calls outbound, because their transient failure does not make the
      process itself unready. Neither probe discloses anything about any offer,
      token, or credential, and both are named here so this endpoint list is the
      complete set of routes the service answers.
proof_rules:
  - The header type is the bare openid4vci-proof+jwt. The registered media type carries an application prefix; the header value does not, and a value carrying the prefix is rejected.
  - Exactly one of kid, jwk or x5c may be present. An inline public JWK and a locally decoded did:jwk key are read under one closed member set: only kty, crv, x, y, alg, kid and use, with use, when present, reading sig. A member outside that set is rejected rather than silently dropped from the accepted key. A kid is accepted only as a self-contained did:jwk URL with the #0 verification-method fragment, decoded locally to a public P-256 key; any other kid and every x5c are rejected rather than resolved through ambient network or trust state.
  - iss must be absent. Final requires its omission when the token came from the pre-authorized code flow, so its presence is a rejection rather than something ignored.
  - aud is the credential issuer identifier, and iat and nonce are required. exp is optional; when present it must be a future integer NumericDate and never widens the short iat freshness window. Every other claim except iss is ignored, following RFC 7519 section 4, so a wallet that adds jti is accepted; the key-binding JWT of the holder-bound profile keeps its closed claim set.
  - The signature is verified before the payload is parsed, the header allowlist is closed, the payload is read for the claims above and no others, and a duplicate JSON member is rejected rather than last-wins.
  - A rejected proof answers invalid_proof with a fixed description that names the failed rule (for example the missing or refused claim). The description and the service log never carry a nonce, key, token or other presented value.
  - Every rejection happens before any Evidence call, so a malformed proof never reaches an authorization decision or a source.
  - Each accepted proof yields one public JWK, and the set becomes the Evidence request's holder keys, so the holder-bound profile's duplicate-thumbprint rejection applies unchanged and a wallet cannot inflate a batch with one key wearing several kid values.
state_model:
  rule: >-
    Everything the service remembers lives in one bounded in-memory store,
    keyed by keyed tags and never by the secrets themselves, with values
    zeroized on claim. The store prunes on write and fails closed on saturation
    rather than evicting a live entry.
  held:
    - The prepared request, its server-generated opaque exchange identifier, and the transaction code tag, keyed by the pre-authorized code's tag, for minutes.
    - The prepared request carried forward, keyed by the access token's tag, for minutes, so one credential request may be made per token.
    - A ledger of the transaction code failure count and whether the offer was redeemed or locked out, keyed by the pre-authorized code's tag, for the offer's whole life whether or not the offer itself is still redeemable. A lockout drops the offer, so a counter that lived inside the offer would be forgotten by the very event it exists to record, and a counter a restart clears is a restart-to-reset lockout.
  stateless_by_design: >-
    The c_nonce is not stored. It is a keyed tag over its own expiry, verified
    by recomputation, and it names no access token. Nonce replay is harmless
    because the access token is single use and the proof binds the wallet's own
    key, so a replay returns the same holder the same credential, and a stolen
    nonce is worth nothing without the token that must accompany it.
  honest_limits:
    - A restart invalidates every offer outstanding in a minutes-wide window. The resulting failure is a clean, value-free error rather than a panic.
    - A backing Evidence bundle or batch-ceiling change requires a coordinated cutover: stop this adapter and discard outstanding exchanges, change or restart Evidence, then restart this adapter so its first catalog comes from the new generation. Do not change Evidence while this adapter continues to serve a cached catalog.
    - Each exchange belongs to the process that created it. An independent process has a different random tagging key and no matching live state, so it refuses both live and spent codes and tokens as unknown rather than accepting a replay. Exactly one replica is supported so every later request reaches the process that owns the exchange; adding replicas would require shared state or sticky routing and a reviewed deployment contract.
    - Single use is mostly a detection property. It turns silent duplicate issuance from a stolen offer into one party receiving an error and complaining. The short lifetime and the transaction code are the primary defenses, not the marker.
    - Selector values are held in the deployment's memory rather than encrypted into a client-held code, so they are never placed in a QR code that can be forwarded or photographed.
operational_telemetry:
  rule: >-
    Metrics are absent by default. When configured, the process binds a second
    loopback-or-private listener that serves only GET /metrics. Its route,
    method, status, problem, and outcome labels come from closed vocabularies,
    state pressure and cleanup are unlabeled gauges or counters, and neither
    metrics nor request logs carry a request-derived or deployment-specific
    identifier.
  excluded_values:
    - offer codes, transaction codes, access tokens, nonces, and proofs
    - holder keys, credentials, selectors, and subject identifiers
    - raw issuer, audience, client, and credential-configuration identifiers
delivery_audit:
  rule: >-
    The adapter owns one durable, append-only audit trail joining authenticated
    offer creation to the eventual credential-release outcome through a random,
    opaque exchange identifier. The available normalized client and/or verified
    subject are distinct keyed pseudonyms, and at least one is required. This
    trail is separate from Evidence's own authorization
    and signed-response release audit under the adapter's outbound client
    identity. A file destination is the durable journal; stdout is durable only
    when the deployment's collector accepts and preserves every line.
  excluded_values:
    - offer codes, transaction codes, access tokens, nonces, and proofs
    - holder keys, credentials, selectors, and raw subject or client identifiers
    - credential configuration identifiers and Evidence request material
  scope: >-
    Validated, authorized offer-creation attempts and post-claim credential
    delivery are audited. Unauthenticated or malformed offer refusals, unknown
    codes or tokens, and nonce requests are not durable audit events because
    they identify no accepted protected exchange or release.
prohibitions:
  rule: None of the following is implemented, stubbed, feature-flagged, or left as an extension seam.
  items:
    - the authorization code flow, deferred issuance, the notification endpoint, and credential offers by reference
    - any second store backend, any database, and any persistence across a restart
    - issuing, minting, or signing a credential, and holding any Evidence signing key
    - generating, holding, escrowing, or recovering a holder key
    - delivering a credential for a requirement that is not holder-bound, which would launder an audience-scoped credential into a wallet
    - wallet attestation, trust-list membership, and any judgement about which wallet is asking
    - remote DID resolution or any key lookup selected by a proof
    - draft-13 compatibility inside the 1.0 profile or in the 1.0 routes; the Draft 13 compatibility profile above is a separate, removable profile
    - the authorization code flow, pushed authorization requests, and DPoP
    - any credential format other than dc+sd-jwt
    - credential status, revocation, lifecycle, or management operations
    - multi-replica state or any second replica under the process-local store
    - protocol plugins, format plugins, or general issuer extensibility
# Each identifier is a named security negative resolved through
# security-test-traceability.yaml to executable tests, and each is the negative
# of a row in security-invariant-matrix.yaml. The traceability checker requires
# every one of them to be mapped while this profile is frozen, so a guarantee
# above cannot outlive the test that enforces it.
negative_tests:
  - sec-oid4vci-offer-requires-authorization
  - sec-oid4vci-offer-attribution-audit
  - sec-oid4vci-offer-request-contract
  - sec-oid4vci-code-single-use
  - sec-oid4vci-tx-code-bounded
  - sec-oid4vci-proof-closed
  - sec-oid4vci-no-audience-scoped-laundering
  - sec-oid4vci-service-holds-no-key
  - sec-oid4vci-telemetry-private
