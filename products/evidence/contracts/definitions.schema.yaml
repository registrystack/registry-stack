$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registrystack.org/schemas/evidence/definitions-v1.json
title: Requester-scoped Evidence definitions Version 1
type: object
additionalProperties: false
required: [schema, assuranceProfile, audience, issuedBy, providedBy, holderBoundBatchMaxSize, definitions]
properties:
  schema: {const: registry.evidence-definitions/v1}
  assuranceProfile: {enum: [local, production, evidence-grade]}
  audience: {type: string, format: uri, maxLength: 512}
  issuedBy: {type: string, format: uri, maxLength: 512}
  providedBy: {type: string, format: uri, maxLength: 512}
  holderBoundBatchMaxSize:
    description: >-
      The effective deployment ceiling for one holder-bound batch. A protocol
      adapter may advertise no larger batch than this value.
    type: integer
    minimum: 1
    maximum: 16
  definitions:
    type: array
    maxItems: 16384
    uniqueItems: true
    items: {$ref: '#/$defs/definition'}
$defs:
  definition:
    type: object
    additionalProperties: false
    required:
      - handle
      - requirement
      - configurationRevision
      - kind
      - evidenceType
      - purpose
      - responseFormats
      - referenceFrameworks
      - subjects
      - concepts
    properties:
      handle: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
      requirement: {type: string, format: uri, maxLength: 512}
      configurationRevision:
        description: >-
          The revision an assertion for this requirement carries. It covers this
          requirement's own configuration and artifact closure, so a relying
          party pins one requirement without depending on the rest of the
          deployment.
        type: string
        pattern: '^sha256:[a-f0-9]{64}$'
      kind: {enum: [criterion, information-requirement, constraint]}
      subjectBindingMode:
        description: >-
          What the subject bindings in this requirement's assertions are derived
          under. The vocabulary is closed and carries no default: absence means
          audience-scoped, stated here so a relying party reading a definition
          without the key knows the requirement issues audience-scoped
          assertions and is not reading an omission it has to resolve elsewhere.
          A definition that does carry the key states the mode explicitly.
        enum: [audience-scoped, holder-bound]
      evidenceType: {type: string, format: uri, maxLength: 512}
      purpose: {type: string, pattern: '^[a-z][a-z0-9._:-]{0,127}$'}
      responseFormats:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {enum: [signed-jws, unsigned-json, sd-jwt-vc, sd-jwt-vc-batch]}
      referenceFrameworks:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, format: uri, maxLength: 512}
      subjects:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items: {$ref: '#/$defs/subject'}
      concepts:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: '#/$defs/concept'}
  subject:
    type: object
    additionalProperties: false
    required: [role, cardinality, selector]
    properties:
      role: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
      cardinality: {const: one}
      selector: {$ref: '#/$defs/selector'}
  selector:
    type: object
    additionalProperties: false
    required: [profile, valueOrigin, fields]
    properties:
      profile: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
      valueOrigin:
        enum: [request, authenticated-context, authenticated-grant]
      fields:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: '#/$defs/selector-field'}
  selector-field:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, name, minimumBytes, maximumBytes]
        properties:
          type: {const: string}
          name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
          minimumBytes: {type: integer, minimum: 1, maximum: 8192}
          maximumBytes: {type: integer, minimum: 1, maximum: 8192}
      - type: object
        additionalProperties: false
        required: [type, name]
        properties:
          type: {const: date}
          name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
      - type: object
        additionalProperties: false
        required: [type, name, minimum, maximum]
        properties:
          type: {const: integer}
          name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
          minimum:
            {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
          maximum:
            {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
      - type: object
        additionalProperties: false
        required: [type, name]
        properties:
          type: {const: boolean}
          name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
      - type: object
        additionalProperties: false
        required: [type, name, scheme, version, maximumBytes]
        properties:
          type: {const: controlled-code}
          name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
          scheme: {type: string, format: uri, maxLength: 512}
          version: {type: string, minLength: 1, maxLength: 128}
          maximumBytes: {type: integer, minimum: 1, maximum: 8192}
  concept:
    type: object
    additionalProperties: false
    required: [handle, concept, required, form]
    properties:
      handle: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
      concept: {type: string, format: uri, maxLength: 512}
      required: {type: boolean}
      form:
        oneOf:
          - enum: [boolean, integer, string, date-bucket, time-bucket, entity-reference, structured]
          - type: object
            additionalProperties: false
            required: [list]
            properties:
              list:
                type: object
                additionalProperties: false
                required: [items, minimumItems, maximumItems, unique]
                properties:
                  items: {enum: [string, entity-reference]}
                  minimumItems: {type: integer, minimum: 1, maximum: 64}
                  maximumItems: {type: integer, minimum: 1, maximum: 64}
                  unique: {const: true}
$comment: >-
  The authenticated response contains only complete request shapes that match
  exactly one configured authority path. It never exposes source plans,
  scripts, credentials, requester tags, authority-profile identifiers,
  selector values, codelist values, codelist paths, internal constraints, or
  unrelated definitions. Discovery
  performs no provider request and grants no authority.
