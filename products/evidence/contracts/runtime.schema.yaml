$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registrystack.org/schemas/evidence/runtime-v1.json
title: Evidence closed operator runtime configuration Version 1
type: object
additionalProperties: false
required:
  - version
  - bundleDirectory
  - listener
  - secretProviders
  - signer
  - auditStorage
  - outboundTls
properties:
  version:
    description: >-
      Pins the runtime document to Version 1 of this grammar; the loader rejects any other
      value, so a future incompatible runtime shape is never read as if it were this one.
    const: 1
  bundleDirectory:
    description: >-
      Selects the one governed bundle directory this process loads at startup; no alternate,
      overlay, or fallback bundle path exists for a running deployment.
    $ref: '#/$defs/absolute-path'
  listener:
    description: >-
      Groups the network binding and per-request admission limits for the process's evidence
      endpoint; `metricsListener`, when present, is an entirely separate binding with its
      own limits.
    type: object
    additionalProperties: false
    required:
      - bindHost
      - port
      - tlsTermination
      - trustProxyIdentityHeaders
      - maximumRequestBytes
      - maximumConcurrentRequests
      - requestTimeoutMilliseconds
      - shutdownGraceMilliseconds
    properties:
      bindHost:
        description: >-
          Numeric listener address. The default `private-address` exposure accepts loopback,
          RFC 1918 private IPv4, or RFC 4193 unique-local IPv6. The explicit
          `container-private` exposure additionally accepts the unspecified IPv4 or IPv6
          wildcard for a container network confined by the operator. Multicast, public, and
          hostname values are prohibited in both modes.
        type: string
        minLength: 2
        maxLength: 64
        x-runtime-validation: >-
          Parsed as an IP address and checked together with listener.networkExposure. Wildcards
          require the explicit container-private value; public addresses remain prohibited.
      networkExposure:
        description: >-
          Declares the operator-owned network boundary around the listener. Absent preserves
          the private-address contract used by existing runtime files. container-private permits
          a wildcard bind only for a container network whose ingress and TLS termination are
          controlled by the operator; it does not enable public or direct-TLS serving.
        type: string
        enum:
          - private-address
          - container-private
        default: private-address
      port:
        description: >-
          TCP port the process binds for the evidence API alongside `listener.bindHost`; port
          `0`, which would ask the kernel for an arbitrary ephemeral port instead of naming
          one, is refused.
        type: integer
        minimum: 1
        maximum: 65535
      tlsTermination:
        description: >-
          Declares that TLS terminates at an operator-controlled upstream in front of this
          listener; the runtime accepts no other value and exposes no direct-TLS or `insecure`
          mode of its own.
        const: operator-controlled-upstream
      trustProxyIdentityHeaders:
        description: >-
          Fixes the listener to ignore proxy-supplied identity headers; authenticated identity
          and authority always come from the verified access token, never from a header a
          network intermediary can set.
        const: false
      maximumRequestBytes:
        description: >-
          Caps accepted request body size; a request whose declared or actual length exceeds
          this bound is rejected as malformed before evidence evaluation begins.
        type: integer
        minimum: 1024
        maximum: 1048576
      maximumConcurrentRequests:
        description: >-
          Sizes the fixed admission semaphore for concurrent evidence requests; a request
          that cannot acquire a slot within `listener.requestTimeoutMilliseconds` receives
          a service-unavailable response instead of queuing without bound.
        type: integer
        minimum: 1
        maximum: 4096
      requestTimeoutMilliseconds:
        description: >-
          Bounds admission-slot acquisition and request-body collection; once protected evaluation
          starts, this timer no longer cancels it, and source and OIDC boundaries carry their
          own separate limits.
        type: integer
        minimum: 1
        maximum: 30000
      shutdownGraceMilliseconds:
        description: >-
          Operational target for graceful shutdown to finish within; it does not cancel a
          request already inside protected evaluation, so audit and signing invariants complete
          even if shutdown outlives this grace period.
        type: integer
        minimum: 1
        maximum: 120000
  metricsListener:
    description: >-
      Optional operator-only telemetry listener serving GET /metrics. Absent means the deployment
      serves no metrics endpoint, which is the default. This listener is a separate binding from
      the evidence listener and is not described by the public evidence contract.
    type: object
    additionalProperties: false
    required:
      - bindHost
      - port
    properties:
      bindHost:
        description: >-
          Numeric loopback, RFC 1918 private IPv4, or RFC 4193 unique-local IPv6 address.
          Unspecified, multicast, public, and hostname values are prohibited.
        type: string
        minLength: 2
        maxLength: 64
        x-runtime-validation: >-
          Parsed as an IP address and accepted only when Rust classifies it as loopback, private
          IPv4, or unique-local IPv6.
      port:
        description: >-
          TCP port for the optional metrics listener; paired with `metricsListener.bindHost`,
          it must not repeat the evidence listener's exact host-and-port binding.
        type: integer
        minimum: 1
        maximum: 65535
    x-runtime-validation: >-
      Rejected at startup when bindHost and port together repeat the evidence listener binding.
  secretProviders:
    description: >-
      Configures how a `secret:file/...` reference resolves to bytes at startup; it supplies
      the storage location only, and which secret each governed field names is fixed by the
      bundle, not by this section.
    type: object
    additionalProperties: false
    required:
      - file
    properties:
      file:
        description: >-
          Declares the file-based secret provider and its root directory; Version 1 defines
          no other provider kind, so every `secret:file/name` reference resolves through this
          one path.
        type: object
        additionalProperties: false
        required:
          - root
        properties:
          root:
            description: >-
              Absolute base directory every `secret:file/name` reference resolves beneath;
              each name is one bounded path component opened relative to this root, and the
              opened file is checked for type, ownership, mode, and link count before its
              bytes are read.
            $ref: '#/$defs/absolute-path'
  signer:
    description: >-
      Binds the process to the private-key transport that produces every signature over the
      bundle's governed active public key; it can select and configure that transport but
      cannot change the governed key set or signing algorithm.
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - kind
          - privateKeyRef
        properties:
          kind:
            description: >-
              Selects the signer transport for this deployment: `local-jwk` resolves a file-provider
              secret directly, `transit` calls a workload-local signing proxy over a Unix
              socket; only the kind matching the bundle's assurance profile is accepted at
              startup.
            const: local-jwk
          privateKeyRef:
            description: >-
              Names the file-provider secret holding the local signing private key material,
              read only when `signer.kind` is `local-jwk`; the value is a reference, and configuration
              never carries the key bytes themselves.
            $ref: '#/$defs/secret-ref'
      - type: object
        additionalProperties: false
        required:
          - kind
          - unixSocketPath
          - mount
          - keyName
          - keyVersion
          - timeoutMilliseconds
        properties:
          kind:
            const: transit
          unixSocketPath:
            description: >-
              Absolute Unix socket path used to reach the workload-local Transit signing proxy;
              the runtime supplies no provider token over this connection, because token custody
              and renewal stay with the proxy.
            $ref: '#/$defs/absolute-path'
          mount:
            description: >-
              Names the Transit secrets-engine mount this signer calls; it is a path segment
              in the local Transit-proxy request URL, not a filesystem location.
            $ref: '#/$defs/local-id'
          keyName:
            description: >-
              Names the specific key within `signer.mount` this signer calls; combined with
              `signer.mount` and `signer.keyVersion`, it reaches exactly one pinned Transit
              key.
            $ref: '#/$defs/local-id'
          keyVersion:
            description: >-
              Pins signing to one exact Transit key version rather than a `latest` alias,
              so a provider-side rotation cannot silently replace the key bytes behind an
              unchanged `kid`.
            type: integer
            minimum: 1
            maximum: 4294967295
          timeoutMilliseconds:
            description: >-
              Bounds how long the runtime waits on each call to the Transit signing proxy;
              because a `transit` signer keeps no local fallback key, a call that exceeds
              this bound fails the request rather than blocking it indefinitely.
            type: integer
            minimum: 1
            maximum: 30000
  auditStorage:
    description: >-
      Groups the physical destination and size bound for the audit log this process writes;
      the log format, pseudonymization key, and fail-closed policy are governed by the bundle's
      `audit` section, not by this one.
    type: object
    additionalProperties: false
    required:
      - path
      - maximumFileBytes
    properties:
      path:
        description: >-
          Absolute path to the append-only keyed-JSONL audit file on durable, operator-owned
          storage; this physical destination is process-local and is not chosen by the bundle's
          governed audit policy.
        $ref: '#/$defs/absolute-path'
      maximumFileBytes:
        description: >-
          Caps how large the active audit segment file may grow before the runtime seals it
          and starts a new one; a single audit record whose own size exceeds this bound can
          never be written, and the request that would have produced it fails rather than
          being audited incompletely.
        type: integer
        minimum: 1048576
        maximum: 1099511627776
  outboundTls:
    description: >-
      Groups outbound TLS trust for calls to configured sources; it can add private certificate
      authorities through named trust profiles but carries no setting to weaken hostname verification
      or skip TLS.
    type: object
    additionalProperties: false
    required:
      - systemRoots
      - trustProfiles
    properties:
      systemRoots:
        description: >-
          Fixes the system certificate authority store as always trusted for outbound calls;
          because Version 1 has no way to disable it, a source's public certificate must still
          chain to a trusted root even when a private trust profile also applies.
        const: true
      trustProfiles:
        description: >-
          Closed map of private certificate-authority bundles a source may reference by logical
          id; the set of ids present here must exactly match the `tlsTrustProfile` names the
          bundle's sources declare, with no extra or missing profile.
        type: object
        maxProperties: 64
        propertyNames:
          $ref: '#/$defs/local-id'
        additionalProperties:
          description: >-
            One named private trust profile, binding a logical id a source's `tlsTrustProfile`
            reference names to the certificate-authority bundle used only for that source's
            outbound connections.
          type: object
          additionalProperties: false
          required:
            - caBundleFile
          properties:
            caBundleFile:
              description: >-
                Absolute path to one bounded PEM file of trust anchors, loaded and validated
                at startup; changing its bytes requires a restart and changes the computed
                runtime digest.
              $ref: '#/$defs/absolute-path'
  sourceExtracts:
    description: >-
      Closed map of process-local extract files a source may read by logical name; the set of
      names present here must exactly match the `extractProfile` names the bundle's extract
      sources declare, with no extra or missing name. Omission binds none, which is what a
      runtime file for a bundle with no extract source says.
    type: object
    maxProperties: 64
    propertyNames:
      $ref: '#/$defs/local-id'
    additionalProperties:
      description: >-
        One named extract binding, joining a logical name a source's `extractProfile` reference
        declares to the process-local file that holds it, so the reviewed bundle names what it
        reads and the operator decides where that file sits.
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          description: >-
            Absolute path to one read-only regular file, validated at startup and digested
            without being read into memory; it must be neither a symbolic link nor writable,
            because the statement executor opens it as immutable, and its digest changes the
            computed runtime digest.
          $ref: '#/$defs/absolute-path'
  acquisitionCapabilities:
    description: >-
      Gated acquisition kinds and source-call optimizations this deployment enables, the
      operator half of the same two-sided gate the bundle declares. Omission and an explicit
      empty list both enable nothing.
    type: array
    maxItems: 2
    uniqueItems: true
    items:
      description: >-
        One gated acquisition kind or source-call optimization this deployment permits. A
        bundle needing an acquisition kind absent here is refused before the listener binds;
        an absent optimization is never selected.
      enum:
        - search-then-fetch-set
        - source-batch
    x-runtime-validation: >-
      A bundle whose requirement needs a gated acquisition kind, or whose HTTP source carries a
      batch block, is refused at startup when the corresponding capability is absent from this
      list, before the deployment serves anything.
$defs:
  local-id:
    type: string
    pattern: ^[a-z][a-z0-9._-]{0,127}$
  secret-ref:
    type: string
    pattern: ^secret:file/[a-z][a-z0-9._-]{0,127}$
  absolute-path:
    type: string
    minLength: 2
    maxLength: 512
    pattern: ^/(?!/)(?!.*(?:^|/)\.\.?(?:/|$))[^\\\u0000]+$
ownership:
  governed_fields: prohibited
  allowed:
    - bundle directory
    - listener binding and process limits
    - optional operator metrics listener binding
    - file-secret root
    - signer binding to a local private JWK or workload-local Transit proxy
    - audit path and rotation bound
    - logical private-CA file bindings
    - logical source-extract file bindings
    - >-
      optional enabled acquisition capabilities, which widen nothing a bundle did not already
      declare
  overrides: prohibited
startup:
  unknown_keys: rejected at every level
  mutability: >-
    runtime.yaml and bound CA files are captured read-only once; reload, merge, fallback,
    and partial serving are prohibited
  digest: >-
    independent SHA-256 revision over exact runtime.yaml bytes plus logical trust-profile
    names and exact CA bytes
  trust_profiles: >-
    names must exactly equal the logical tlsTrustProfile names used by the governed bundle
  secrets: >-
    values and provider tokens are never parsed into or included in the runtime document or
    digest
  signer: >-
    local assurance requires local-jwk; production and evidence-grade require Transit through
    an absolute Unix socket. Transit key version is pinned and no provider token is supplied
    to Evidence.
  proxy: >-
    HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, and NO_PROXY are ignored; no application-level proxy
    field exists
platform:
  supported: Unix
  reason: >-
    Version 1 requires Unix owner, mode, no-follow, link-count, and file-identity guarantees
    for the runtime file, the bundle directory and its artifacts, named CA bundle files, the
    secret root, source extracts, individual secrets, and audit storage.
