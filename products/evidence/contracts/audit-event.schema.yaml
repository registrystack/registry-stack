$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registrystack.org/schemas/evidence/audit-event-v1.json
title: Evidence native audit record union Version 1
type: object
additionalProperties: false
required:
  - schema
  - assuranceProfile
  - eventId
  - occurredAt
  - operation
  - phase
  - bundleRevision
  - requesterPseudonym
  - decision
  - durationMilliseconds
properties:
  schema:
    enum:
      - registry.evidence.audit/v1
      - registry.evidence.audit.authorization-refusal/v1
  assuranceProfile: {enum: [local, production, evidence-grade]}
  eventId: {type: string, format: uri, maxLength: 512}
  occurredAt: {type: string, format: date-time}
  operation: {type: string, minLength: 16, maxLength: 128}
  phase: {enum: [access-attempt, disclosure-release, denial, transient-failure]}
  requirement: {type: string, format: uri, maxLength: 512}
  bundleRevision: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
  purpose: {type: string, pattern: '^[a-z][a-z0-9._:-]{0,127}$'}
  requesterPseudonym: {$ref: '#/$defs/pseudonym'}
  actorPseudonym: {$ref: '#/$defs/pseudonym'}
  authority:
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: {enum: [statutory, organizational, consent, delegated, explicit-request]}
      grantPseudonym: {$ref: '#/$defs/pseudonym'}
  subjects:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: object
      additionalProperties: false
      required: [role, selectorProfile]
      properties:
        role: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        selectorProfile: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
        selectorBundlePseudonym: {$ref: '#/$defs/pseudonym'}
  responseProtection: {enum: [signed, unsigned, sd-jwt-vc]}
  sourceId: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  adapterId: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  sourceIds:
    type: array
    minItems: 3
    maxItems: 5
    uniqueItems: true
    items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  adapterIds:
    type: array
    minItems: 3
    maxItems: 5
    items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  decision:
    enum: [authorized, released, not-authorized, no-match, ambiguous, unresolved, fact-missing, dependency-failure, evaluation-failure, signing-failure]
  disclosedConcepts:
    type: array
    maxItems: 16
    uniqueItems: true
    items: {type: string, format: uri, maxLength: 512}
  evidenceId: {type: string, format: uri, maxLength: 512}
  evidenceIds:
    type: array
    minItems: 2
    maxItems: 16
    uniqueItems: true
    items: {type: string, format: uri, maxLength: 512}
  signingKeyId: {type: string, minLength: 1, maxLength: 256}
  safeErrorCategory: {type: string, pattern: '^[a-z][a-z0-9._-]{0,127}$'}
  durationMilliseconds: {type: integer, minimum: 0, maximum: 86400000}
$defs:
  pseudonym:
    type: string
    pattern: '^hmac-sha256:v[1-9][0-9]*:[a-f0-9]{64}$'
oneOf:
  - title: Authorized-material event
    required: [requirement, purpose, authority, subjects, responseProtection]
    properties:
      schema: {const: registry.evidence.audit/v1}
      decision:
        enum: [authorized, released, no-match, ambiguous, unresolved, fact-missing, dependency-failure, evaluation-failure, signing-failure]
  - title: Authenticated authorization-refusal event
    required: [safeErrorCategory]
    properties:
      schema: {const: registry.evidence.audit.authorization-refusal/v1}
      phase: {const: denial}
      decision: {const: not-authorized}
      safeErrorCategory: {const: not-authorized}
    not:
      anyOf:
        - {required: [requirement]}
        - {required: [purpose]}
        - {required: [authority]}
        - {required: [subjects]}
        - {required: [responseProtection]}
        - {required: [sourceId]}
        - {required: [adapterId]}
        - {required: [sourceIds]}
        - {required: [adapterIds]}
        - {required: [disclosedConcepts]}
        - {required: [evidenceId]}
        - {required: [evidenceIds]}
        - {required: [signingKeyId]}
allOf:
  # A release names what it released exactly once: evidenceId for the one
  # assertion it carried, evidenceIds for the complete set a batch carried.
  # Present together they would let a reader count one release twice, so the
  # oneOf below is an exclusive choice rather than a permitted pair.
  - if: {properties: {phase: {const: disclosure-release}}}
    then:
      required: [disclosedConcepts]
      oneOf:
        - {required: [evidenceId]}
        - {required: [evidenceIds]}
    else:
      not:
        anyOf:
          - {required: [disclosedConcepts]}
          - {required: [evidenceId]}
          - {required: [evidenceIds]}
          - {required: [signingKeyId]}
          - {required: [sourceIds]}
          - {required: [adapterIds]}
  - if:
      properties:
        phase: {const: disclosure-release}
        responseProtection: {enum: [signed, sd-jwt-vc]}
    then: {required: [signingKeyId]}
  - if: {properties: {responseProtection: {const: unsigned}}}
    then: {not: {required: [signingKeyId]}}
  - if: {required: [sourceIds]}
    then: {required: [adapterIds, sourceId, adapterId]}
  - if: {required: [adapterIds]}
    then: {required: [sourceIds, sourceId, adapterId]}
  # The two arrays are positionally aligned, one entry per executed stage, so
  # they are the same length. That much a schema can state, and a reader
  # validating against this document alone gets it. The remaining half of the
  # alignment, each array's last entry equalling its scalar, compares one
  # instance value with another and is not expressible here; it stays a rule
  # the producing runtime enforces, stated in source_identity below.
  - if: {required: [sourceIds], properties: {sourceIds: {minItems: 3, maxItems: 3}}}
    then: {properties: {adapterIds: {minItems: 3, maxItems: 3}}}
  - if: {required: [sourceIds], properties: {sourceIds: {minItems: 4, maxItems: 4}}}
    then: {properties: {adapterIds: {minItems: 4, maxItems: 4}}}
  - if: {required: [sourceIds], properties: {sourceIds: {minItems: 5, maxItems: 5}}}
    then: {properties: {adapterIds: {minItems: 5, maxItems: 5}}}
audit_rules:
  authorization_refusal_gate: After successful authentication, an authorization refusal is durably accepted before the generic HTTP 403 is returned. Audit failure changes the outward result to service.unavailable with HTTP 503.
  authorization_refusal_minimization: The refusal event contains only its chain and event identifiers, server-minted operation, timestamp and duration, assurance profile, bundle revision, scoped requester pseudonym, optional actor pseudonym, and the closed denial category and decision. The public trace identifier never becomes this operation identity. Requester and actor pseudonym scope binds the operator trust domain, requested purpose, and authenticated audience, while those scope inputs remain omitted from the event. It omits the untrusted requested requirement, purpose, subjects, unmatched authority, selector information, response protection, and source or evaluation material.
  access_gate: One access-attempt is durably accepted after authorization and before credential acquisition or source access for every actual source stage; search-then-fetch therefore records search access and, only after a unique validated match, fetch access, and search-then-fetch-set records search access followed by one access per declared fetch member in declared order, each reached only after every earlier stage resolved. A stage that is never reached records nothing.
  unresolved_decision: A configured exact source-level unresolved Problem Details outcome records the neutral denial decision unresolved only when it terminates a singular acquisition or search stage. It does not assert no-match or ambiguity, and the event records none of the upstream problem body, type, code, detail, or trace. The same outcome after a unique search is a dependency failure because the acquisition has already committed to a fetch or member reference.
  release_gate: disclosure-release is durably accepted after the final immutable response bytes are serialized and before those exact bytes are released. One operation has exactly one terminal release event, whatever it released; a release carrying more than one assertion names the complete released set in evidenceIds, in release order, instead of naming a single assertion in evidenceId. Splitting a batch into one event per member is not available, because that would make one request either several operations or one operation with several terminal events, and the chain accepts neither.
  request_batch_noninteraction: POST /v1/evidence/batch uses the distinct registry.evidence.audit.request-batch/v1 schema because one physical call may cover several independently authorized subject sets and its terminal release includes unavailable outcomes. This native union remains the singular operation and holder-bound issuance-batch audit contract; it never accepts itemIndices, itemGroups, outcomes, or terminal-failure.
  source_identity: Each access or failure event names the source and adapter for that stage; disclosure release names the final source and adapter that produced the derivation FactSet. A release closing an acquisition of three to five stages additionally lists every executed source in sourceIds and its adapter in adapterIds, in execution order and positionally aligned, with the last entry of each equal to the corresponding scalar; sourceIds is distinct while adapterIds is not, because two stages may read through one adapter. A release closing a one or two stage acquisition omits both arrays, so its shape is unchanged; an earlier stage of such an acquisition is read from its own access-attempt event, as it always has been. Stage identities are configuration, never a value obtained from a source.
  response_protection: Every authorized-material event records the closed non-secret responseProtection mode resolved with authorization. signingKeyId exists exactly for cryptographically protected disclosure release, which is the signed flattened JWS and the SD-JWT VC serialization, and is forbidden for unsigned output. An authorization-refusal event has no resolved response protection and omits both fields.
  failure_policy: sink failure blocks the applicable step
  chain_verification: At startup and after restart, the newest sealed segment supplies the prior chain head and the complete active segment is verified from that head. Complete retained-history verification is an out-of-band operator duty performed with evidence verify-audit across every available sealed segment and, when the writer is stopped, the active segment. Steady-state appends and readiness verify the pinned active-segment identity, modification fingerprint, expected length, verified tail, and lock-file identity without rescanning sealed history or the growing active segment.
  external_mutation: Any external replacement or modification of the active segment or lock file fails readiness and future appends closed for the process lifetime. Mutation within older sealed history is detected by complete out-of-band verification, not by serving-process startup or readiness.
  pre_authentication_and_validation_failure: Authentication, malformed-request, and invalid-selector failures remain operational-only because the core has no authenticated requester plus authorization decision from which to construct the minimal refusal event.
  pseudonym_domains: [requester, actor, grant, subject]
  subject_scope: key version plus operator trust domain, purpose, the binding scope, role, profile, and complete canonical selector bundle. The binding scope is the authenticated audience for an audience-scoped requirement and the holder key thumbprint for a holder-bound one; the two are domain-separated, so no binding can be read as belonging to the other mode.
  pseudonym_scope: Requester, actor, and grant pseudonyms for an audience-scoped operation bind the operator trust domain, requested purpose, and authenticated audience. A holder-bound operation is scoped to no relying party, so its pseudonyms bind the operator trust domain and requested purpose under a separate derivation domain, and never the holder key thumbprint. A holder-bound requester pseudonym is therefore stable across that requester's issuances within one trust domain and purpose, which is the accountability property the mode keeps and the linkability it accepts.
  never_record:
    - raw principal, actor, grant, selector, source, or supported values
    - separate hashes of low-entropy selector fields
    - credentials, tokens, request or response bodies
    - the request nonce
    - candidate count, candidates, scores, hints, or comparisons
    - prior facts, intermediate lookup identifiers, or fetch path values
    - script inputs, outputs, stacks, or signing material
    - the holder key, its thumbprint, or any value derived from it
