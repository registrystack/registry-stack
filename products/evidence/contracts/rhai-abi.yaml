contract: registry.evidence.rhai-abi/v1
status: frozen
acquisition_contract: ../../adapter/CONCEPT.md
trust_model:
  scripts: Reviewed, trusted, immutable bundle artifacts compiled at startup.
  boundary: Trust permits derivation scripts to implement reviewed requirement semantics, but never grants transport, credential, authorization, signing, audit, or evidence-construction authority. Provider semantics belong to the separate Adapter pack contract.
functions:
  derivation:
    signature: derive(facts, declared_authorized_selectors, evaluation_context) -> ConceptValueSet
    input:
      facts: 'The complete closed FactSet from one matched Adapter pack lookup, validated against the Evidence Source factSchema. The pack may compose bounded reviewed operations internally; partial, no-match, ambiguous, unresolved, and invalid results never reach derivation. Integer tokens outside the signed 64-bit range fail before Rhai rather than converting to a precision-losing float.'
      declared_authorized_selectors: Exact role, profile, and field map declared by derivation.selectorInputs, resolved from already authorized requirement subjects; omission yields an empty map.
      evaluation_context:
        exact_keys: [observed_at, legal_local_date, legal_local_time, parameters, codelists]
        observed_at: Runtime-supplied UTC instant.
        legal_local_date: Runtime-resolved date for the configured IANA timezone.
        legal_local_time: Runtime-resolved local time with UTC offset.
        parameters: Fixed typed requirement parameters.
        codelists: Bounded read-only handles to named versioned bundle codelists.
    output:
      representation: array of exact maps with keys concept_id and value
      maximum_items: 16
      validation: Concept identifiers must equal the requirement output set; duplicates, missing required values, extra fields, and invalid values are rejected. An ordinary Rhai float is never a public derived value; exact numbers use the declared integer or Rust-owned Decimal forms. Finite ordinary floats may occur in input facts or local computation but cannot cross the public derived-value gate.
      protected_types:
        Decimal:
          construction: decimal(canonical_text) or parse_decimal(canonical_text)
          rule: Rust-owned exact coefficient-and-scale decimal with maximum precision 28 and scale 9; Rhai f32/f64 and ordinary numeric coercion cannot satisfy a bounded-decimal concept.
        EntityReferenceSeed:
          construction: entity_reference_seed(protected_string)
          maximum_seed_bytes: 512
          rule: Valid only for an audience-scoped-entity-reference concept or its bounded list form; never serializable, loggable, or usable as a public identifier.
        EntityReferenceSeedList:
          construction: Bounded Rhai array containing only EntityReferenceSeed values.
          maximum_items: 64
          rule: Rust projects each seed after output validation.
    permitted_selector_aware_rules:
      - Exact equality between a returned unique-record binding fact and its declared authorized lookup selector.
      - Exact membership of a separately authorized stable reference in a complete authoritative relationship set with a governed namespace and contract identifier.
      - A closed deterministic attribute comparison only when its jurisdiction-governed canonicalization and concept semantics are explicitly versioned in the reviewed requirement.
      - Direct mapping of an explicit source-owned decision fact.
    false_relationship_rule: A false relationship concept is permitted only after unique returned-subject binding, complete valid relationship facts, namespace and contract agreement, and the exact governed comparison. No-match, ambiguity, returned-subject mismatch, incomplete facts, or protocol uncertainty stop without a signed negative.
    prohibited_context:
      - undeclared selector roles, profiles, or fields
      - requester or actor
      - requirement purpose or audience
      - authority, entitlement, or grant objects
      - token, credential, source client, response, or prepared request
      - logging, audit, or signing handle
capabilities:
  allowed:
    - fresh local variables and statically named bounded same-file helper functions
    - pure expressions and bounded array iteration
    - allowlisted primitive calls
    - bounded local map, array, and string construction and mutation
    - explicit to_string conversion of signed 64-bit integers to canonical decimal text and Booleans to true or false text; no Dynamic or opaque-handle stringification
  denied:
    - filesystem, environment, network, process, import, eval, plugins, or modules
    - ambient clock, timezone lookup, randomness, UUID, logging, printing, diagnostics, audit, credentials, or signing
    - anonymous functions, function pointers, dynamic dispatch, top-level executable statements, or catchable host-private unavailable termination
    - raw string literals, block and if expressions in operand position, and negative array indexing
  syntax_contract: The detailed pinned Rhai 1.27.0 syntax surface and forbidden constructs are defined by the trusted request-adapter API and enforced by startup compilation tests. Startup review also rewrites every index operand through a host-owned guard that rejects a negative index whether it is written literally or computed. The lexical restriction is an enforceable reviewed-language contract; the raw engine capability set remains the isolation boundary.
lifecycle:
  compilation: Startup only; each derivation artifact must expose exactly one public derive function at arity three before readiness. Pack scripts compile separately under the Adapter engine script contract.
  state: Fresh invocation state and fresh input copies; no cross-request or cross-definition mutable state. Derivation receives only the completed validated lookup facts and its separately minimized authorized selectors.
  identity: Script path and exact bytes are listed in the governed package's SHA256SUMS file.
failure:
  derivation: derivation_input_error
  unavailable: Host-private, unforgeable, and uncatchable required-value termination.
  observability: All failures map to closed value-free classes; raw Rhai errors and protected input or output material are absent from public problems and diagnostics.
core_projection:
  decimal:
    input: Decimal canonical text
    output: JSON string containing the exact canonical decimal text
    rule: JSON numeric serialization and binary floating-point conversion are prohibited.
  entity_reference:
    input: EntityReferenceSeed
    hmac_input: Deterministic length-prefixed bytes over profile version, concept id, audience, binding-key version, and exact seed bytes.
    key: subjectBinding.secretRef from the governed bundle
    output: 'urn:evidence:entity:v<key-version>_<base64url-no-pad HMAC-SHA256>'
    confidentiality: Seed is protected source-derived data and is absent from evidence, logs, audit, errors, traces, metrics, snapshots, and script diagnostics.
anti_capabilities:
  - source sequence, origin, path binding origin, header, authentication, credential, TLS, proxy, pagination, retry, or request-count selection
  - broad candidate retrieval, probabilistic or fuzzy scoring, ranking, deduplication, or candidate selection
  - authorization or disclosure-profile selection
  - evidence, identifier, subject-binding, JWS, or audit construction
