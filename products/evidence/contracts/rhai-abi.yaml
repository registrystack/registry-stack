contract: registry.evidence.rhai-abi/v1
status: frozen
trust_model:
  scripts: Reviewed, trusted, immutable bundle artifacts compiled at startup.
  boundary: Trust permits scripts to implement provider and requirement semantics, but never grants transport, credential, authorization, signing, audit, or evidence-construction authority.
functions:
  preparation:
    signature: prepare(source_required_selectors, adapter_context) -> RequestParts
    input:
      source_required_selectors: Exact role, profile, and field map selected from the source request selectorInputs after validation and authorization; the map is empty for a fetch source with no selectorInputs.
      adapter_context:
        exact_keys: [parameters, prior_facts]
        parameters: Closed non-secret JSON parameters validated at startup against adapterParametersSchema.
        prior_facts: Empty for single and search calls; for the fetch call, exactly the closed schema-validated FactSet returned by the search extraction.
      prohibited:
        - requester, actor, purpose, audience, authority, entitlement, or grant objects
        - source origin, method, path, path bindings, headers, credentials, TLS, proxy, timeout, redirect, pagination, concurrency, or request-count controls
    output:
      exact_keys: [query, body]
      query:
        representation: ordered array of exact maps with string keys name and value
        maximum_items: 64
        rules:
          - Names and values are logical lexical strings; Rust percent-encodes each component exactly once.
          - Pair order and duplicate names are preserved.
          - Empty names, CR, LF, implicit value-to-string conversion, and non-string values are rejected.
      body:
        representation: one bounded JSON value or unit for no body
        maximum_depth: 32
      validation: Rust applies the source preparationLimits and validates the complete normalized RequestParts before credential resolution.
    core_owned_transport:
      - source and fixed origin selected by the requirement acquisition, never by a script or response
      - fixed method and fixed path, or complete-segment pathTemplate and pathBindings bound to authorized selectors or, on a fetch source only, a scalar prior fact
      - fixed non-secret headers and every authentication header
      - credentials, TLS trust, hostname verification, redirect denial, proxy denial, timeout, response limit, concurrency, and one request per source stage
  extraction:
    signature: extract(projected_source_response, adapter_context) -> LookupResult
    input:
      projected_source_response: Parsed JSON from the completed source stage after pre-projection response bounds, the Rust-enforced extended JSON Pointer allowlist, and validation against the source's declared responseSchema, so a response outside its declared shape never reaches this script. The projected tree handed to extraction is limited to 65536 serialized bytes; the 1 MiB wire-response maximum bounds the pre-projection response and the two limits are compatible layers. Integer tokens outside the signed 64-bit range fail before Rhai rather than converting to a precision-losing float; provider identifiers outside that range must be represented as strings.
      adapter_context:
        exact_keys: [parameters, prior_facts]
        parameters: A fresh copy of the same closed non-secret parameters supplied to preparation.
        prior_facts: The same empty or schema-validated prior FactSet supplied to preparation for this stage.
      prohibited:
        - selectors or prepared request parts
        - unprojected response fields
        - request metadata, credentials, authority context, or a source client
    output:
      tagged_union:
        match:
          exact_keys: [outcome, facts]
          outcome: match
          facts: Closed FactSet declared by the source binding.
        no_match:
          exact_keys: [outcome]
          outcome: no_match
        ambiguous:
          exact_keys: [outcome]
          outcome: ambiguous
      prohibited: [candidates, count, scores, confidence, hints, diagnostics, comparisons]
    rules:
      - Facts are legal only on match and must exactly satisfy the declared fact schema.
      - Search no-match and ambiguous stop evaluation; derivation and fetch are not invoked.
      - Fetch no-match or ambiguous after a unique search match is a dependency inconsistency, never a signed absence claim.
      - Extraction may map provider-owned cardinality from a count plus one minimized record, or at most two minimally projected records solely to detect ambiguity.
      - Extraction never chooses a candidate and never turns protocol inconsistency into a closed lookup outcome.
  derivation:
    signature: derive(facts, declared_authorized_selectors, evaluation_context) -> ConceptValueSet
    input:
      facts: Immutable validated FactSet from one unique match. Integer tokens outside the signed 64-bit range fail before Rhai rather than converting to a precision-losing float.
      declared_authorized_selectors: Exact role, profile, and field map declared by derivation.selectorInputs, resolved from already authorized requirement subjects; omission yields an empty map.
      evaluation_context:
        exact_keys: [observed_at, legal_local_date, legal_local_time, parameters, codelists]
        observed_at: Runtime-supplied UTC instant.
        legal_local_date: Runtime-resolved date for the configured IANA timezone.
        legal_local_time: Runtime-resolved local time with UTC offset.
        parameters: Fixed typed requirement parameters.
        codelists: Bounded read-only handles to named versioned bundle codelists.
    output:
      representation: array of exact maps with keys concept_id and value
      maximum_items: 16
      validation: Concept identifiers must equal the requirement output set; duplicates, missing required values, extra fields, and invalid values are rejected. An ordinary Rhai float is never a public derived value; exact numbers use the declared integer or Rust-owned Decimal forms. Ordinary f64 remains available only inside the preparation and extraction adapter surfaces.
      protected_types:
        Decimal:
          construction: decimal(canonical_text) or parse_decimal(canonical_text)
          rule: Rust-owned exact coefficient-and-scale decimal with maximum precision 28 and scale 9; Rhai f32/f64 and ordinary numeric coercion cannot satisfy a bounded-decimal concept.
        EntityReferenceSeed:
          construction: entity_reference_seed(protected_string)
          maximum_seed_bytes: 512
          rule: Valid only for an audience-scoped-entity-reference concept or its bounded list form; never serializable, loggable, or usable as a public identifier.
        EntityReferenceSeedList:
          construction: Bounded Rhai array containing only EntityReferenceSeed values.
          maximum_items: 64
          rule: Rust projects each seed after output validation.
    permitted_selector_aware_rules:
      - Exact equality between a returned unique-record binding fact and its declared authorized lookup selector.
      - Exact membership of a separately authorized stable reference in a complete authoritative relationship set with a governed namespace and contract identifier.
      - A closed deterministic attribute comparison only when its jurisdiction-governed canonicalization and concept semantics are explicitly versioned in the reviewed requirement.
      - Direct mapping of an explicit source-owned decision fact.
    false_relationship_rule: A false relationship concept is permitted only after unique returned-subject binding, complete valid relationship facts, namespace and contract agreement, and the exact governed comparison. No-match, ambiguity, returned-subject mismatch, incomplete facts, or protocol uncertainty stop without a signed negative.
    prohibited_context:
      - undeclared selector roles, profiles, or fields
      - requester or actor
      - requirement purpose or audience
      - authority, entitlement, or grant objects
      - token, credential, source client, response, or prepared request
      - logging, audit, or signing handle
capabilities:
  allowed:
    - fresh local variables and statically named bounded same-file helper functions
    - pure expressions and bounded array iteration
    - allowlisted primitive calls
    - bounded local map, array, and string construction and mutation
  denied:
    - filesystem, environment, network, process, import, eval, plugins, or modules
    - ambient clock, timezone lookup, randomness, UUID, logging, printing, diagnostics, audit, credentials, or signing
    - anonymous functions, function pointers, dynamic dispatch, top-level executable statements, or catchable host-private unavailable termination
    - raw string literals, block and if expressions in operand position, and negative array indexing
  syntax_contract: The detailed pinned Rhai 1.25.1 syntax surface and forbidden constructs are defined by the trusted request-adapter API and enforced by startup compilation tests. Startup review also rewrites every index operand through a host-owned guard that rejects a negative index whether it is written literally or computed. The lexical restriction is an enforceable reviewed-language contract; the raw engine capability set remains the isolation boundary.
lifecycle:
  compilation: Startup only; each script must expose exactly one public entry point at the required arity before readiness.
  state: Fresh invocation state and fresh input copies; only the immutable schema-validated search FactSet crosses into the fetch stage, with no cross-request or cross-definition mutable state.
  identity: Script path and exact bytes are covered by the governed bundle revision.
failure:
  preparation: adapter_input_error
  extraction: source_protocol_error
  derivation: derivation_input_error
  unavailable: Host-private, unforgeable, and uncatchable required-value termination.
  observability: All failures map to closed value-free classes; raw Rhai errors and protected input or output material are absent from public problems and diagnostics.
core_projection:
  decimal:
    input: Decimal canonical text
    output: JSON string containing the exact canonical decimal text
    rule: JSON numeric serialization and binary floating-point conversion are prohibited.
  entity_reference:
    input: EntityReferenceSeed
    hmac_input: Deterministic length-prefixed bytes over profile version, concept id, audience, binding-key version, and exact seed bytes.
    key: subjectBinding.secretRef from the governed bundle
    output: 'urn:evidence:entity:v<key-version>_<base64url-no-pad HMAC-SHA256>'
    confidentiality: Seed is protected source-derived data and is absent from evidence, logs, audit, errors, traces, metrics, snapshots, and script diagnostics.
anti_capabilities:
  - source sequence, origin, path binding origin, header, authentication, credential, TLS, proxy, pagination, retry, or request-count selection
  - broad candidate retrieval, probabilistic or fuzzy scoring, ranking, deduplication, or candidate selection
  - authorization or disclosure-profile selection
  - evidence, identifier, subject-binding, JWS, or audit construction
