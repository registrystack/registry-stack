contract: registry.evidence.public-problem/v1
status: frozen
media_type: application/problem+json
body:
  exact_members: [type, title, status, detail, code, traceId]
  detail: Static, value-free text selected only by the service's closed problem code.
  traceId: Lowercase 32-hex W3C trace identifier for caller correlation; it is not an audit operation identifier.
  prohibited:
    - request body or selector profile and values
    - principal, actor, grant, token, credential, or authorization inputs
    - source URL, query, request, response, status text, or fact
    - script input, output, line, stack, or diagnostic
    - supported value or subject binding
    - candidate count, score, hint, or comparison detail
codes:
  evidence.invalid-request: {status: 400, title: Evidence request is invalid, detail: the Evidence request is invalid}
  request.selector-invalid: {status: 400, title: Selector is invalid, detail: selector does not match an available request profile}
  auth.invalid-credential: {status: 401, title: Bearer access token is invalid, detail: bearer access token validation failed}
  evidence.denied: {status: 403, title: Evidence request is not permitted, detail: the Evidence request is not permitted}
  resource.not-found: {status: 404, title: Requested resource was not found, detail: the requested resource was not found}
  format.unsupported: {status: 406, title: Requested format is not supported, detail: the requested format is not supported}
  evidence.unavailable: {status: 422, title: Evidence could not be produced, detail: evidence could not be produced for this request}
  evidence.rate-limited: {status: 429, title: Evidence request rate is exhausted, detail: the Evidence request rate is exhausted}
  source.unavailable: {status: 503, title: Authoritative source is unavailable, detail: the authoritative source is unavailable}
  service.unavailable: {status: 503, title: Service is unavailable, detail: the request could not be served}
type_uri_prefix: https://id.registrystack.org/problems/registry-evidence/
response_headers:
  cache_control: no-store
  traceparent: Every response carries a W3C traceparent header whose trace identifier equals body.traceId for a problem response. A valid inbound traceparent may supply that trace identifier; otherwise Evidence mints one.
  tracestate: Caller-supplied tracestate is never echoed.
  www_authenticate: HTTP 401 carries Bearer realm="registry-evidence".
  retry_after: "HTTP 429 alone carries Retry-After: 1."
response_format_rules:
  negotiation: Missing Accept, */*, and exact application/jose+json select signed JWS. Only exact application/vnd.registrystack.evidence-unsigned+json selects the unsigned envelope. Duplicate, combined, parameterized, quality-weighted, or unknown negotiation returns format.unsupported before source access.
  request_batch_negotiation: POST /v1/evidence/batch requires the one exact application/vnd.registrystack.evidence.request-batch+json Accept value. Missing, wildcard, singular-format, holder-batch, duplicate, combined, parameterized, quality-weighted, or unknown negotiation returns format.unsupported before source access.
  authorization: A recognized unsigned request that the immutable bundle or the complete matched grant does not permit durably appends the minimal authorization-refusal audit event, then returns the ordinary evidence.denied problem before credential acquisition or source access, without revealing which layer withheld permission. Audit failure returns service.unavailable instead.
authorization_refusal_audit:
  applies_after: successful authentication when the authorization decision refuses the request
  order: The minimal registry.evidence.audit.authorization-refusal/v1 event is durably accepted before the evidence.denied response.
  failure: An audit append failure replaces the evidence.denied response with service.unavailable.
  operational_only: [evidence.invalid-request, request.selector-invalid, auth.invalid-credential]
selector_refusal:
  code: request.selector-invalid
  applies_to: Every selector the matched entitlement resolves that fails its selector profile.
  order: Returned during selector resolution, after authorization and before any access-attempt audit event, credential acquisition, or source contact.
  budget: Counts against the caller's selector-failure budget like every other selector refusal.
  path_bound_value: A value that passes its profile but that a source of the requirement binds to a request path segment the value cannot occupy is not a selector refusal. It is refused after the durable access-attempt audit event and before credential acquisition or any source request, as source.unavailable (503), on the single and the batch route alike.
existence_disclosure:
  default_public_collapse:
    internal_classes: [no_match, ambiguous, required_fact_missing, derivation_input_unresolved]
    source_outcome: An exact source-declared unresolved outcome at a singular or search stage.
    public_code: evidence.unavailable
    same_status: 422
    same_title: Evidence could not be produced
    same_body_shape: true
    timing_rule: Avoid intentional class-dependent delay; apply uniform bounded processing and response handling.
  explicit_existence_concept_rule: Existence may be disclosed only as a separately authorized fixed concept, never as error detail.
request_batch:
  singular_unavailable: Every condition the singular collapse contract exposes as evidence-not-available becomes the closed item result and does not produce an outer 422. This is exactly no_match, ambiguous, required_fact_missing, derivation_input_unresolved, and an exact source-declared unresolved outcome at a singular or search stage in Version 1. A source-declared unresolved fetch or member remains an outer dependency failure.
  successful_mixtures: A mixed available/unavailable or all-unavailable closed envelope returns HTTP 200.
  outer_abort: Every other failure uses this existing safe Problem Details vocabulary for the outer response and releases no completed item, JWS, evidence identifier, or partial envelope.
  value_safety: The outer problem never includes item index, item count, nonce, selector, subject, authority, source, outcome, evidence identifier, or signed material.
transient_failures:
  internal_classes: [source_unavailable, source_protocol_error, script_failure, signing_failure, authorization_refusal_audit_failure, access_audit_failure, release_audit_failure]
  public_codes: [source.unavailable, service.unavailable]
  retry_after: absent
unknown_definition_rule: Unknown and unauthorized requirement identifiers must be indistinguishable to a caller lacking authorization.
route_resolution: An unknown path or unsupported method returns resource.not-found.
public_check:
  route: POST /v1/public-check
  stability: experimental
  codes_added: none
  authentication: none; the route reads no principal and no request header except Content-Type
  miss:
    public_code: resource.not-found
    status: 404
    identical: Status, every response header except the server-minted traceparent, and every body byte except traceId are the same for every miss class.
    classes: [no_match, ambiguous, unresolved, code_mismatch, missing_fact]
    class_detail:
      no_match: The Source returned no record for the document number.
      ambiguous: The Source returned more than one record for the document number.
      unresolved: An exact source-declared unresolved outcome.
      code_mismatch: The stored check code is absent, not a string, not exactly 24 characters of A to Z and 2 to 7, or not equal to the presented code.
      missing_fact: A required fact is missing or a derivation input is unresolved after the code matched.
    operator_only: The audit decision tells the classes apart (no-match, ambiguous, unresolved, code-mismatch, fact-missing); the caller never can.
  invalid_request:
    code: evidence.invalid-request
    status: 400
    classes: [Content-Type that is not exactly application/json (absent, another type, or carrying a parameter), body over the listener maximumRequestBytes, body that is not one strict JSON object, an object without exactly the two string members documentNumber and checkCode, a duplicate member, a checkCode that is not 24 characters of A to Z and 2 to 7 after ASCII upper-casing]
    order: Refused before admission to evaluation, any audit write, credential acquisition, or source contact.
  invalid_selector:
    code: request.selector-invalid
    status: 400
    classes: [documentNumber that fails the selector profile of the activated subject, documentNumber that the inputs schema of the Source refuses]
    order: Refused before any audit write, credential acquisition, or source contact.
  unavailable:
    source.unavailable:
      status: 503
      classes: [Source transport, timeout or protocol failure, including a facts-schema refusal and an extract-script failure, a Source result that is not a record or a declared outcome, acquisition budget exhausted, a documentNumber that passes the selector profile and the inputs schema but that the Source binds to a path segment it cannot occupy]
      audit: A transient-failure entry with decision dependency-failure follows the access-attempt entry.
      before_comparison: The check code is compared only after the Source returns a record, so every Source failure before the comparison answers this problem. A pack that refuses one record's content before the comparison lets this answer reveal that a record exists for the number, though neither its status nor its fields; a record-independent fault answers it for every number and reveals nothing. Pack authors keep the facts schema to types, declare a returned record whose number does not exactly match as no-match, and check record content in the derivation.
    service.unavailable:
      status: 503
      classes: [request time budget exhausted, admission to the request slots timed out, access-attempt or release audit append failed, evaluation task failed, a package fault, derivation or output validation failure after the code matched, a public answer that cannot be built from the two named outputs, including a status outside valid, suspended, revoked and expired (problem category public-check-answer)]
      audit: Where an access attempt was accepted, a transient-failure entry follows with decision evaluation-failure; an audit append failure writes nothing further.
  route_resolution: A route that the authority does not activate, and any method other than POST and OPTIONS on the route, return resource.not-found with the status and body of an unknown path (an activated route adds its CORS headers); an unactivated route also answers a browser preflight as an unknown path does.
  header_rule:
    cache_control: Every response, success or problem, carries Cache-Control no-store.
    access_control: Every response of the route, problems included, carries Access-Control-Allow-Origin *, never Access-Control-Allow-Credentials. A preflight answers 200 with an empty body, allows exactly POST and Content-Type, and a max age of 600 seconds. No other route carries a CORS header.
    cross_origin_resource_policy: The route answers cross-origin.
    traceparent: Every response carries a server-minted W3C traceparent whose trace identifier equals body.traceId for a problem response. An inbound traceparent, tracestate, cookie, authorization, forwarding or client-address header is never read and never reaches the log or the audit.
    content_type: The 200 answer is application/json; a problem is application/problem+json.
