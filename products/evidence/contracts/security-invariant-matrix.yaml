contract: registry.evidence.security-invariants/v1
status: frozen
review_rule: Every row requires its named negative test on the same implementation revision; tests may be split but may not be weakened or deleted.
invariants:
  - id: V1-I01
    rule: Only predefined, versioned Requirement URIs can be evaluated; local definition handles are not public request identities. Optional expectedConfigurationRevision pins the active per-definition revision.
    threat: Caller turns Evidence into an arbitrary fact-query service.
    enforcement: The closed request accepts Requirement URIs, and the resolver rejects a stale expectedConfigurationRevision before authentication, authority resolution, credentials, or source I/O. URI-only requests return the active revision; independent verifier expectations remain authoritative.
    negative_test: sec-unknown-or-disabled-requirement
  - id: V1-I02
    rule: Callers cannot provide thresholds, expressions, scripts, paths, headers, source fields, relationship types, adapter parameters, or response projections.
    threat: Caller reconstructs protected facts or expands acquisition and disclosure.
    enforcement: Closed request schema plus digest-pinned reviewed pack acquisition, governed connection policy, bounded assertion derivation, and declared concept projection.
    negative_test: sec-caller-query-material-rejected
  - id: V1-I03
    rule: The complete enabled bundle is reviewed as one disclosure surface.
    threat: Threshold ladders or overlapping categories reconstruct a protected value across otherwise safe definitions.
    enforcement: Startup bundle-combination validation and explicit operator review of one atomic revision.
    negative_test: sec-unsafe-definition-combination
  - id: V1-I04
    rule: Principals, actor kind, and attributes derive only from configured validated authentication sources; missing data denies.
    threat: Authentication bypass through fallback claims or unsigned headers.
    enforcement: Strict authentication profile, one configured principal claim, and one strict shared actor-kind claim with no fallback.
    negative_test: sec-missing-principal-no-fallback
  - id: V1-I05
    rule: One authorization decision binds requester, actor kind, optional actor identity, verified client, requirement revision, purpose, all role/profile/origin tuples, authority, and audience. A task-grant path additionally binds immutable grant id, principal, original client and resource, trusted source issuer, deadline, and exact Evidence requirement bound; requires its signed approver handle; and records a scoped keyed approver pseudonym on successful audit events.
    threat: Permission splicing, confused-deputy access across partially authorized dimensions, or approved delegation without accountable approver attribution.
    enforcement: Target activation validates every complete grant against package authority-kind, actor-kind, value-origin, audience, subject, selector, purpose, representation and binding ceilings. A dynamic authenticated audience must remain inside the authored ceiling. The process captures one active authority revision before grant matching, and audit binds it and the effective ceiling/grant digest. Exact complete-entitlement match precedes authorized-material audit, credential resolution, or source access. A present grant is incomplete without its approver claim, and a present invalid grant cannot fall back to a standing profile. Successful grant audit derives the approver pseudonym with the existing scoped audit key. A refusal after successful authentication follows the separate minimal denial-audit invariant.
    negative_test: sec-no-entitlement-union
  - id: V1-I06
    rule: Selector profiles and values are provider-lookup inputs, never proof of authority.
    threat: Broken object-level authorization by possession of an identifier or demographic tuple.
    enforcement: Selector validation occurs inside an already matched subject-authority path.
    negative_test: sec-selector-possession-no-authority
  - id: V1-I07
    rule: Caller-provided consent, approval, or grant references never create authority.
    threat: Fabricated reference escalates authority.
    enforcement: Grant identifiers are accepted only inside the complete verified shared grant context. Agent kind, principal, client, resource, trusted source issuer, deadline, purpose, and requirement bound must match exactly one complete entitlement.
    negative_test: sec-caller-grant-reference-rejected
  - id: V1-I08
    rule: Callers cannot choose selector fields, operators, weights, thresholds, normalization, or query plans.
    threat: Matching scope creep, oracle behavior, or broad candidate retrieval.
    enforcement: Named profiles close exact field sets. Each Source input binding exposes only its declared authorized role/profile/field value to the reviewed pack route, while derivation receives its separate declared selector projection. Pack inputs satisfy the pinned route schema before credentials or effects. Reviewed pack code owns provider placement and any required comparison of returned identity scalars with those authorized inputs.
    negative_test: sec-selector-shape-not-callable
  - id: V1-I09
    rule: Source calls are fixed by trusted configuration and executed only by the core. The current access audit captures the effective immutable operation, deadline, and response-byte bounds before credentials or source effects.
    threat: SSRF, credential forwarding, overbroad reads, script-directed networking, or an accountability record that cannot establish the finite limits governing an admitted acquisition.
    enforcement: The Source selects a digest-pinned reviewed Adapter route and minimized authorized inputs. Governed named connection policies fix permitted endpoint origins, authentication and TLS selections; captured runtime bindings must match them. The Evidence profile and shared engine enforce read-only operations, destination policy, header ownership, finite response and concurrency bounds, and one aggregate acquisition budget before effects. Before credentials or effects, the current /v3 access event records that budget as the closed positive maximumDataOperations, acquisitionDeadlineMilliseconds, and maximumResponseBytes executionBounds, with no endpoint, secret, or source value. Caller and provider values cannot replace those policies or select an undeclared endpoint.
    negative_test: sec-source-request-immutable
  - id: V1-I10
    rule: Provider lookup has only matched facts, no-match, ambiguous, or declared unresolved outcomes; Evidence never exposes or chooses candidates, while reviewed derivation may compare only declared authorized selectors with complete facts from one unique record.
    threat: Evidence becomes an identity-resolution engine or exposes registry candidates.
    enforcement: The shared engine validates the final closed lookup result and matched facts against the reviewed source contract before Evidence derives values. Candidate arrays and arbitrary result members are not accepted as final facts. No-match, ambiguity and declared unresolved outcomes release no assertion values; a uniquely matched record with inconsistent derivation inputs remains unavailable rather than selecting another candidate.
    negative_test: sec-candidate-material-rejected
  - id: V1-I11
    rule: Pack acquisition returns one checked closed lookup result, and assertion derivation returns declared typed concept values only.
    threat: Script crosses into authorization, response construction, diagnostics, or arbitrary metadata.
    enforcement: The Evidence execution profile validates the final lookup union and closed facts schema after bounded reviewed pack execution. The assertion-derive/v1 interface receives those checked facts and its declared selector projection; the Rust output gate rejects undeclared concepts, extra fields, invalid types and values outside their declared bounds before construction or signing. Pack helpers cannot construct an Evidence response or bypass the output gate.
    negative_test: sec-rhai-output-shape-closed
  - id: V1-I12
    rule: Undeclared concepts, extra fields, and values violating types, codelists, identifier prefixes or syntax, cardinality, precision, or sizes are rejected.
    threat: Data leakage or type confusion through trusted-script mistakes.
    enforcement: Core validates exact concept set and the complete Supported Value declaration before evidence construction; bounded identifiers require an exact governed prefix, ASCII suffix syntax, and declared byte bounds; decimals are exact coefficient-and-scale values and entity-reference seeds are protected projection inputs.
    negative_test: sec-derived-value-output-gate
  - id: V1-I13
    rule: Missing facts, undefined decisions, script failures, audit failures, and evaluation failures fail closed. Every current authorized-material access event records the effective immutable execution bounds before credentials or source effects.
    threat: Partial, stale, fabricated, or unaudited evidence is released, or an audit reader cannot establish which finite bounds governed an admitted acquisition.
    enforcement: Typed error boundaries; refusal audit before an authenticated authorization 403; current singular and request-batch /v3 access audit before credentials or source effects with one closed positive executionBounds object; release audit after signing and before release. Terminal /v3 and retained /v2 records omit executionBounds.
    negative_test: sec-evaluation-and-audit-fail-closed
  - id: V1-I14
    rule: Raw source responses are never persisted or logged.
    threat: Source connector data leakage and unauthorized secondary retention.
    enforcement: Bounded in-memory response ownership, no recording path, and centralized structured-log redaction.
    negative_test: sec-source-canary-absent-everywhere
  - id: V1-I15
    rule: Selector, source, and disclosed values never appear in logs or native audit.
    threat: Quasi-identifier disclosure or reconstruction from operational records.
    enforcement: Field allowlists and at most one scoped keyed pseudonym over each complete canonical role/selector bundle.
    negative_test: sec-protected-canaries-redacted
  - id: V1-I16
    rule: No-match, ambiguous, required-fact-missing, derivation-input-inconsistent, and exact source-declared unresolved behavior cannot accidentally disclose registry membership or be confused with a dependency failure.
    threat: Existence oracle through status, message, diagnostics, count, avoidable timing, a distinguishable failure class, or overly broad treatment of attacker-controlled Problem Details as authoritative absence.
    enforcement: Default public collapse of every unresolved class to one problem shape. A digest-pinned pack may select registry-lookup-v1 with an exact source-neutral 404, HTTPS type and bounded code tuple. Rust checks the bounded response, exactly one canonical problem media type and a duplicate-free six-member wire shape before any provider script receives a data-free unresolved outcome. Reviewed route logic defines authoritative absence and incomplete-acquisition handling; a later missing fetch normally remains a dependency failure unless a documented source-specific absence rule explicitly selects unavailable. Transport, malformed protocol and verification failures cannot manufacture absence or false facts.
    negative_test: sec-unresolved-public-collapse
  - id: V1-I17
    rule: Subject bindings are audience-scoped and not globally linkable.
    threat: Cross-purpose or cross-relying-party tracking.
    enforcement: Domain-separated keyed derivation includes audience, purpose, role, profile, binding-key version, and complete canonical selector bundle.
    negative_test: sec-subject-binding-scope
  - id: V1-I18
    rule: The package, runtime bindings, and active target authority snapshot are immutable for the serving process lifetime.
    threat: Unreviewed hot mutation, partial authority activation, inconsistent history, or authorization and audit using different revisions.
    enforcement: One read-only package verified from its SHA256SUMS and one closed runtime file are captured at startup. Normalized projects additionally load one validated target authority bound to the project, target and exact package digest. Activation validates every complete grant against package ceilings before atomically committing the active snapshot and durable history in one synced state document under a single-writer lock. Failed or partial preparation cannot become active; a new activation takes effect only at a controlled process restart. Every admitted operation retains that captured snapshot through access and release audit. Runtime overrides, hot reload, merge and fallback paths do not exist.
    negative_test: sec-runtime-bundle-mutation-absent
  - id: V1-I19
    rule: One process serves one operator-controlled trust domain.
    threat: Cross-tenant disclosure, authority confusion, or key and audit boundary mixing.
    enforcement: One service trustDomain, issuer governance boundary, bundle lifecycle, signer, and audit boundary per process.
    negative_test: sec-mutually-distrustful-configuration
  - id: V1-I20
    rule: Rate controls are defense in depth, not a substitute for concept design or authorization.
    threat: Unsafe threshold reconstruction remains possible below or around rate limits.
    enforcement: Bundle combination validation is mandatory independently of configured rate limits.
    negative_test: sec-rate-limit-does-not-legalize-ladder
  - id: V1-I21
    rule: Signed flattened JWS over the exact evidence payload is mandatory, available to every authorized grant issuing under the audience-scoped subject binding, and the default response; unsigned output exists only through its exact media type when both the immutable bundle and the complete matched grant permit it. A holder-bound requirement is the one exception to that availability, and it narrows rather than widens, serving neither signed JWS nor unsigned output, because neither carries the confirmation the mode exists to bind. The mandatory signature governs Evidence responses to authenticated callers; the unauthenticated public check answer is a separate answer type that is not an Evidence response, is never signed, and is bounded by V1-I60.
    threat: Payload substitution, an unsigned success masquerading as verified evidence, or unverifiable parallel representations.
    enforcement: One flattened-JWS response type containing only protected, payload, and signature, plus a strict closed Accept matrix resolved before source access.
    negative_test: sec-jws-mutation-and-duplicate-payload
  - id: V1-I22
    rule: Missing or failed signing never falls back to unsigned evidence.
    threat: Availability fallback silently removes integrity and provider authentication.
    enforcement: Signing readiness plus a mandatory signing step before release audit and response.
    negative_test: sec-signing-failure-no-release
  - id: V1-I23
    rule: Private signing material is core-owned and absent from bundle values, Rhai, logs, audit, and errors.
    threat: Key disclosure or script exfiltration.
    enforcement: Secret-reference-only schema, SigningProvider boundary, redacted serialization/debugging, and no script capability.
    negative_test: sec-private-key-canary-unreachable
  - id: V1-I24
    rule: A signature authenticates provider and payload integrity but does not assert legal-signature status or source truth.
    threat: Relying party overclaims cryptographic or legal assurance.
    enforcement: Distinct issuer/provider fields and verifier contract with no legal-signature or source-truth claim.
    negative_test: sec-verifier-rejects-untrusted-provider
  - id: V1-I25
    rule: Public evidence is constructed only by the core after complete output validation.
    threat: Script injects envelope fields, subject identifiers, selector values, or unsupported claims.
    enforcement: Rhai returns ConceptValueSet only; core owns identifiers, subjects, metadata, decimal serialization, entity-reference HMAC projection, public projection, and JWS.
    negative_test: sec-script-cannot-construct-evidence
  - id: V1-I26
    rule: Evidence-definition discovery is authenticated and requester-scoped; public protected-resource metadata is origin-bound and neither surface creates authority or exposes deployment internals.
    threat: A public catalog, entitlement oracle, or overbroad metadata response reveals unavailable definitions, authority structure, selectors, source plans, or credentials, or redirects a client to attacker-selected token or key endpoints.
    enforcement: Rust publishes a closed RFC 9728 document derived only from the canonical service.publicOrigin and configured issuer, authenticates and rate-limits definition discovery, projects only complete shapes matching exactly one authority path and valid token-owned selector material through a closed response allowlist, omits unentitled and ambiguous shapes, and performs no provider or evidence-data audit access.
    negative_test: sec-discovery-requester-scoped
  - id: V1-I27
    rule: Every request carries one exact canonical 32-byte random nonce that is echoed into Evidence under the audience-scoped subject binding but never stored, uniqueness-checked, or exposed to authorization, rate limits, Rhai, source requests, logs, metrics, traces, or native audit. A holder-bound assertion is issued to a key rather than answered to a requester, so it has no party to echo to and carries no request nonce at all; the member is absent, never empty or fabricated.
    threat: A malformed or attacker-shaped nonce reaches downstream boundaries, or the nonce becomes a covert identifier channel correlated through audit or source records. Echoing it into a holder-bound assertion would be a third channel, carrying a value chosen by whoever asked, carried inside a credential meant to be presented to parties who never asked.
    enforcement: Strict canonical base64url parsing before authentication, credential acquisition, and source access; the exact value is copied only into the core-constructed Evidence payload, and only when that payload is audience-scoped.
    negative_test: sec-request-nonce-strict-and-contained
  - id: V1-I28
    rule: The unsigned response format is authorized only when the immutable bundle enables it and the one complete matched grant permits it; API selection, runtime configuration, and other grants create no permission. A holder-bound requirement narrows this further and unconditionally, so that whatever the bundle and the grant permit it serves only the SD-JWT VC serialization and the batch envelope over it, and no permission anywhere reopens the others. The grant-gated unsigned format is the Evidence unsigned envelope only; the unauthenticated public check route admits no caller, matches no grant, and serves its own unsigned answer type only under the package declaration and authority activation of V1-I58.
    threat: A caller or operator activates unsigned output around governance, or permissions union across grants. Under the holder-bound mode a permitted-format list would additionally become a way to obtain the assertion in a serialization that carries no confirmation, stripping the binding the mode exists to create.
    enforcement: Closed bundle responseFormats and per-grant responseFormats validated at startup with signed JWS mandatory, checked together after exact entitlement match and before selector resolution, credentials, or source access; the closed runtime file has no response-format field. The mode allowlist is a fourth condition checked in the same place, and all four collapse into one indistinguishable denial.
    negative_test: sec-unsigned-requires-bundle-and-grant
  - id: V1-I29
    rule: Final immutable response bytes exist before the disclosure-release audit is durably accepted and are the exact bytes released afterward, for every response format. Admission to that append is the disclosure-begin boundary and final acquisition-deadline gate; an admitted append completes without cancellation and its exact bytes may return after expiry. One response is one release event, including the batch envelope, which is audited once over the whole envelope, carrying the bounded set of released evidence identifiers, never one event for each member.
    threat: Audit describes bytes that were never released, or a response is released without a durable release record. A batch audited per member would additionally record releases for members a later failure meant were never released, and would let the number of records disclose how many keys a holder presented.
    enforcement: The runtime serializes the signed JWS, unsigned envelope, credential, or batch envelope to its final bytes and checks the acquisition deadline before admitting the one release append. Once admitted, that append completes without cancellation, then the runtime returns those bytes unchanged through the HTTP boundary even if expiry occurred during the append. A failure on any member fails the whole batch before that event exists. Verified source validUntil remains an independent validity cap.
    negative_test: sec-release-bytes-pre-audited
  - id: V1-I30
    rule: Every authorized-material native audit event records the closed response-protection mode and a signing key identity exactly for cryptographically protected disclosure release. The minimal authorization-refusal event records neither unresolved field.
    threat: An unsigned release is indistinguishable from a signed one in accountability records, a fabricated signing-key claim appears on unsigned output, or a refusal fabricates a response format that authorization never resolved.
    enforcement: A mandatory closed responseProtection field with schema-conditional signingKeyId validation in the authorized-material event branch, and a mutually exclusive minimal refusal branch that prohibits both fields.
    negative_test: sec-audit-response-protection-mode
  - id: V1-I31
    rule: Strict signed verification requires the exact expected unordered set of unique role-bound subject bindings and the expected concept identifiers, forms, and cardinalities, returns one generic policy mismatch, and reports cryptographic authenticity separately from current validity. The pinned subject bindings are required under both subject-binding modes and remain values the relying party must have retained independently rather than derive. Audience-scoped verification also requires the independently retained expected request nonce, and holder-bound presentation verification replaces that freshness input with the key-binding audience and nonce it pins for the proof of possession.
    threat: A relying party accepts substituted subjects or outputs under a valid signature, or leaks which hidden comparison failed. A mode whose bindings the relying party could derive for itself would also let it recognize a subject it was never told about.
    enforcement: Verifier policy comparison after signature and schema verification with a single generic policy error and a separate current-validity result, over two closed policy documents that each refuse the other's body.
    negative_test: sec-verifier-independent-expectations
  - id: V1-I32
    rule: An access token carrying a proof-of-possession confirmation claim is denied, never accepted as an ordinary bearer token.
    threat: A stolen sender-constrained token replays for its full lifetime because the profile silently discards a constraint it does not validate.
    enforcement: Verified-claim rejection of the RFC 7800 confirmation claim before any authenticated context is constructed.
    negative_test: sec-sender-constrained-token-denied
  - id: V1-I33
    rule: Operational telemetry is off by default, served only on a separate operator-private listener, and carries no caller-supplied or protected value in any label or series.
    threat: A metrics surface becomes a public existence oracle, or per-request labels reconstruct selectors, requirement usage, or registry membership through unbounded series cardinality.
    enforcement: Optional runtime metricsListener bound to a private address distinct from the evidence listener, serving only GET /metrics; request series labels are drawn from the closed registered route-template set, a fixed method set, a fixed status category, and the reviewed problem-code set, and the source shape-drift series is labeled only by a governed bundle source identifier registered at startup, never from request or response content.
    negative_test: sec-telemetry-bounded-and-operator-private
  - id: V1-I34
    rule: Only the explicit local assurance profile may omit a requirement fixture reference or use focused fixture coverage; production and evidence-grade retain complete fixture validation before the bundle can load.
    threat: An incomplete or absent semantic fixture suite is silently treated as deployable assurance.
    enforcement: The governed assuranceProfile is required in the closed bundle and Rust requires every production or evidence-grade requirement to reference a captured fixture that passes the existing complete coverage validator. Local changes only the fixture prerequisite and category completeness; synthetic data and structural rules still hold at load, and the same evaluator and privacy checks apply when a suite is run.
    negative_test: sec-assurance-profile-fixture-boundary
  - id: V1-I35
    rule: Every assertion encoding, definition response, and audit event carries the governed assurance profile, and verification compares it with an independent relying-procedure expectation.
    threat: An authentic development-only assertion is accepted where production or evidence-grade assurance is required.
    enforcement: Rust projects assuranceProfile from the immutable bundle into Evidence, JWS, SD-JWT VC, discovery, and audit, while both protected-format verifiers fail with the generic policy error on a mismatch.
    negative_test: expected-assurance-profile-mismatch
  - id: V1-I36
    rule: Credential-free source access exists only for local authoring against an exact numeric-loopback HTTP origin and never sends an authentication header.
    threat: A local tutorial convenience becomes unauthenticated production access, reaches a remote host, or forwards caller-controlled authorization material.
    enforcement: Evidence validates unauthenticated network access against local assurance and an exact numeric-loopback HTTP origin with an explicit non-zero port. The reviewed endpoint and governed connection must agree on authentication none, and runtime binding cannot substitute an origin or TLS policy. The compiled header policy sends no Authorization header for that endpoint. Production and evidence-grade transport checks reject unauthenticated HTTP and GraphQL endpoints; signed Evidence host protocols always require authenticated source access.
    negative_test: sec-local-source-none-boundary
  - id: V1-I37
    rule: Each configured product or shared contextual-authorization claim names a distinct token member, and none names a registered JWT claim; only principalClaim may name sub.
    threat: One verified member is read as two different authorization inputs, or an input is read from a member the issuer wrote for another purpose, such as a grant source issuer taken from the audience Evidence validates against itself.
    enforcement: Authentication validation refuses repeated names across both claim sets and the registered-claim set at startup, on the resource server, so the rule holds for every configured OIDC issuer rather than only for issuers that refuse to mint such tokens.
    negative_test: sec-authority-claim-names-closed
  - id: V1-I38
    rule: Every authorization path that can activate a Source supplies the role, selector profile and required fields its reviewed input bindings name.
    threat: An authority path that cannot fill the template compiles and reports ready, then fails every request it serves as a source dependency failure, hiding an authorization-shaped configuration fault behind an availability symptom.
    enforcement: Compilation checks Source bindings against the complete declared selector alternatives, rather than a union of partial authority paths. Evidence minimizes the resolved authorized selectors to those bindings and validates the reviewed route input schema before acquisition intent, credentials or source effects. Route materialization refuses a value that cannot fill its reviewed path rather than forwarding it or widening the query.
    negative_test: sec-path-binding-unreachable-selector-set
  - id: V1-I39
    rule: Every authorization refusal after successful authentication is durably recorded as one standalone minimal native event before the generic 403 is returned; an audit failure returns the generic 503 instead.
    threat: An authenticated caller can probe denied operations without an accountable record, or the refusal record leaks untrusted request, unmatched-authority, selector, or response-format material.
    enforcement: The core derives requester plus available client, grant, and actor pseudonyms scoped by operator trust domain, requested purpose, and authenticated audience, while request-rate accounting remains principal-scoped. It records actor kind and a fixed safe reason, constructs the closed refusal branch under its distinct registry.evidence.audit.authorization-refusal/v2 entry schema, durably appends it before the response, and omits every request-derived requirement, purpose, unmatched authority, selector, response-protection, source, and evaluation field. Authentication, malformed-request, and invalid-selector failures remain operational-only.
    negative_test: sec-authenticated-authorization-refusal-audited
  - id: V1-I40
    rule: A pack acquisition reaches only reviewed, governed destinations and returns one checked lookup result; provider data cannot choose a new destination, credential policy or unbounded execution.
    threat: Provider-controlled response data becomes a workflow plan, redirects credentials to an unreviewed endpoint, expands one authorized evaluation into unbounded reads, or leaks an intermediate record identifier through audit.
    enforcement: A Source selects one digest-pinned pack route and minimized authorized inputs. The Evidence profile admits only read-only endpoint operations under matching governed connection policies and captured runtime bindings. Reviewed branches, retries and pagination share one finite data-operation budget and absolute deadline. Authority, audit, budget and cryptographic verification refusals are terminal. Durable acquisition intent precedes credentials and source effects; optional per-send durable detail does not replace that intent or release audit.
    negative_test: sec-search-then-fetch-bounded
  - id: V1-I41
    rule: A reviewed multistep route executes within one acquisition boundary, keeps intermediate source material private, and releases only the final checked facts required for derivation.
    threat: A wider acquisition becomes a response-led plan, carries every search fact to every source so one source learns what another answered, continues past the stages the bundle declared, or runs unbounded because no single stage exceeded its own timeout.
    enforcement: The immutable pack owns the reachable route graph, expressions and endpoint declarations. Runtime data cannot add a destination or change its credential policy. Every actual data operation, including reviewed retries, pages and SQLite statements, consumes the same acquisition budget and deadline; no next protected effect begins after exhaustion. Reviewed error handling may handle ordinary dependency outcomes but cannot catch authority, audit, budget or cryptographic verification refusals into successful facts. Final lookup and native facts validation precede any optional package-owned projection. A projection changes only matched facts, uses the same acquisition deadline, validates its output against its governed final facts schema, and contributes its exact script and schema to definition revisions. No-match, ambiguous and unresolved outcomes remain unchanged; projection failure prevents derivation. Diagnostic and audit fields exclude intermediate values.
    negative_test: sec-fetch-set-bounded
  - id: V1-I42
    rule: A Source can use only the reviewed route and connection authority declared by its package and the matching resources its operator bound at startup.
    threat: A bundle silently widens a deployment's source reach past what its operator reviewed, or a deployment that never made the decision begins serving a kind added after its acquisition surface froze.
    enforcement: The governed Source names its exact pack, route, input bindings and connection. Pack endpoint declarations and governed connection policies must agree, and captured runtime endpoint material must satisfy that policy before execution. Runtime configuration supplies resources and finite operational tuning rather than new route or destination authority. The retired acquisition-kind capability switches are not a compatibility path; malformed, missing or mismatched bindings fail before source effects.
    negative_test: sec-acquisition-capability-opt-in
  - id: V1-I43
    rule: Each sqlite-extract operation executes one digest-pinned reviewed statement against the immutable extract its operator bound, under finite row, cell, response, statement-step, time and concurrency bounds; caller or source values cannot replace the statement, file or limits.
    threat: The statement transport becomes a query channel into a registry data tier, a statement writes to or reaches outside the file it was prepared against, an unbounded result moves a whole register into the process, a statement reads a clock of its own and becomes non-deterministic, or an unattributed or stale extract answers as though it were current.
    enforcement: The reviewed pack fixes the statement artifact, declared columns, named parameters and extract profile. The runtime captures the immutable extract once; initialization verifies its binding and later reads retain path and handle checks. Read-only authorization refuses writes, connection-widening actions, multiple statements and nondeterministic functions. Only declared typed parameter expressions are accepted, and the host owns the evaluation instant. Statement and metadata work are bounded by the remaining acquisition deadline as well as their own limits; cancellation and completed worker draining preserve admission and connection reuse. The complete assembled response is byte-bounded before final facts validation.
    negative_test: sec-statement-source-bounded
  - id: V1-I44
    rule: Under the holder-bound subject binding, every subject binding is derived from the presented holder key's canonical RFC 7638 thumbprint under a domain separate from the audience-scoped one, and from nothing about the requester. One holder receives one binding however many relying parties collect the assertion on its behalf, two holders never receive the same binding for the same subject, and no key thumbprint can be made to collide with any audience.
    threat: A requester that entered the derivation could poison a holder's binding by asking under its own identity, and would hand one holder unequal bindings for the same subject collected through two procedures. A shared domain would let an audience string chosen to look like a thumbprint, or the reverse, produce a binding the other mode would also produce, so a relying party could recognize a subject under a mode it was never issued.
    enforcement: The binding scope is a closed Rust enum whose holder-bound arm carries a thumbprint and cannot carry an audience, so an audience-carrying holder-bound binding is unrepresentable rather than merely unreached. Each arm supplies its own domain constant to the keyed derivation, and the thumbprint is required to be the canonical form before it is used.
    negative_test: sec-holder-bound-binding-derivation
  - id: V1-I45
    rule: The mode is reached only when the requirement declares it and the one complete matched grant permits it, and only through the serializations the mode allows. A requirement that declares nothing serves the audience-scoped path whatever the caller supplies, and permission to serialize is never permission to issue under the mode. Every refusal across the bundle permission, the grant permission, the grant's mode permission, and the mode allowlist is one indistinguishable denial that reveals neither the layer nor whether the requirement exists.
    threat: A caller attaching a holder key to reach a mode no operator declared, an operator widening a serialization list and silently enabling the mode with it, or a distinguishable denial turning the endpoint into an oracle for which requirements are holder-bound and which grants cover the caller.
    enforcement: The declaration and the grant permission are separate startup-validated fields, and the four conditions are checked together in one place after exact entitlement match and before selector resolution, credentials, or source access. They collapse into a single not-authorized problem whose body is built from the problem code alone; the internal category stays in server-side extensions and never reaches the wire.
    negative_test: sec-holder-bound-format-and-grant
  - id: V1-I46
    rule: A batch is bounded before anything is acquired and released whole or not at all. The presented keys are at most the deployment's declared ceiling and pairwise distinct as thumbprints, one acquisition serves the whole batch however many keys were presented, each key yields its own binding, evidence identifier, and salts, and a failure on any member releases nothing. The answer carries exactly one credential per presented key, and the relying-party client refuses an envelope that does not.
    threat: An unbounded or duplicated key list turning one authorized request into repeated source load, a per-member acquisition letting the source count the keys a holder holds, shared salts or identifiers linking the members of one batch, and a partial release handing out credentials for a batch that failed.
    enforcement: The ceiling and the thumbprint distinctness check run before acquisition, so a refused batch reads no source. Distinctness is over the computed thumbprint, so the same coordinates under a different key name are still one key. Acquisition happens once and the derivation runs per member over its own thumbprint, and the whole batch is serialized to final bytes before the single release event exists. The maintained client holds the same cardinality on the reading side; it counts the holder keys the prepared request presented and refuses an issuance envelope whose member count differs as the same protocol failure as one that does not parse, so a positional credential-to-key match is never offered over a list the caller already knows is short or long.
    negative_test: sec-holder-bound-batch-bounded
  - id: V1-I47
    rule: A holder-bound credential is accepted only on presentation with a valid key-binding JWT made by the key the signed confirmation names, over the pinned audience and nonce, with a matching digest of the presentation and an acceptably recent issuance. Every way that proof can fail reports one key-binding class, and a credential whose issuer signature is authentic but whose proof is not is rejected outright, never downgraded to an issuer-only acceptance.
    threat: Replay of a credential the presenter does not hold, substitution of a proof made for another relying party or another presentation, and the failure mode that undoes the mode entirely, which is treating a failed proof as an absent one and falling back to accepting the issuer signature alone.
    enforcement: The presentation entry point requires the proof, refuses an absent, wrong-audience, wrong-nonce, wrong-digest, stale, wrong-signer, unsigned, unknown-header, or duplicate-member proof under one error class, and has no path that returns a verified result without it. The audience-scoped entry point refuses a presentation outright rather than reading it.
    negative_test: sec-key-binding-required-at-presentation
  - id: V1-I48
    rule: The two verification modes are two closed policy documents and two entry points. Each document refuses the other's body, the audience-scoped entry point refuses a presentation, and the presentation entry point refuses an audience-scoped credential.
    threat: One permissive policy shape that silently drops the members the other mode requires, so a relying party believes it pinned a proof of possession it never pinned, or believes it pinned a request nonce that the presented credential never carried.
    enforcement: Each document denies unknown fields, so neither can absorb the other's members, and the entry points separate on the serialization itself rather than on a caller-supplied mode flag.
    negative_test: sec-holder-bound-policy-separation
  - id: V1-I49
    rule: A multi-subject request batch authenticates once, uses one evaluation instant, atomically charges request-rate cost equal to its complete item count, and validates and authorizes every item before any source credential or I/O.
    threat: A caller uses one outer request to evade per-principal rate controls, obtains results evaluated at different instants, or puts an unauthorized later item behind an authorized first item so the source is contacted before the complete authorization decision is known.
    enforcement: The closed request admits one to sixteen ordered items under one requirement and purpose and requires canonical pairwise-distinct nonces. Rust authenticates the bearer token once, reserves one instant, resolves selectors and one complete grant independently per item, and performs one all-or-nothing weighted debit before choosing a source strategy. Any malformed, invalid-selector, unauthorized, format, or rate failure ends the outer operation before credential resolution, access audit, or source I/O and releases no item.
    negative_test: sec-request-batch-admission-atomic
  - id: V1-I50
    rule: A request batch returns one ordered result per item and releases the complete envelope or nothing. Every condition the singular collapse contract exposes as evidence-not-available becomes that item outcome; every other failure aborts through the existing safe outer problem contract.
    threat: A partial envelope leaks successful assertions before a later item fails, a dependency or protocol failure is misrepresented as authoritative absence, or response reordering binds one subject's evidence to another logical request.
    enforcement: The sequential Rust host preserves request order and per-item correlation; provider code cannot return opaque slots that reorder or substitute items. Rust accumulates no releasable bytes while evaluating items, constructs a flattened signed JWS only for each available item, and maps only the closed unavailable classes to the item sentinel. It serializes the closed registry.evidence-request-batch/v1 envelope only after all items end, rejects it above 1048576 bytes, durably appends one terminal release, and returns those same bytes. Any other failure appends one terminal failure and returns the existing Problem Details without item material.
    negative_test: sec-request-batch-no-partial-release
  - id: V1-I51
    rule: Request batches use complete ordered per-item pack acquisitions; no retired source-batch hook or authored optimization block can bypass complete authorization, input minimization or result correlation.
    threat: One configuration author silently expands source reach, a source response chooses request count, a failed optimized call is replayed as up to sixteen ordinary calls, or missing, duplicate, and substituted extraction members are attached to the wrong request items.
    enforcement: The complete batch is validated and every item authorized before any source credential or effect. The baseline evaluates each item through its selected Source and its own acquisition limits, preserving item order, independent evidence identities and request nonces. Any outer failure releases no partial envelope, and a failed source acquisition does not trigger a hidden optimized-to-sequential fanout. The removed preparation, extraction and opaque-slot batch interfaces are refused rather than executed through a compatibility runtime.
    negative_test: sec-source-batch-bounded
  - id: V1-I52
    rule: A request batch durably records acquisition intent before each started item acquisition and exactly one terminal event under registry.evidence.audit.request-batch/v3, with bounded item groups and no nonce, selector, fact, body or signed material. Each access event records the effective immutable execution bounds; its terminal event omits them.
    threat: Optimized execution hides which logical items reached a source, different grants are collapsed into one misleading authority, an abort leaves no accountable terminal record, or native audit becomes a durable copy of protected request or signed response material.
    enforcement: Each access intent names sorted bounded item indices and itemGroups partitioned by identical authority object and ordered pseudonymized subjects. It requires the closed positive maximumDataOperations, acquisitionDeadlineMilliseconds, and maximumResponseBytes executionBounds captured before credential resolution, token acquisition or source effects, and optional per-send detail does not change the intent or release gates. Release groups partition all request indices and carry contiguous ordered outcomes with an evidence id exactly for evidence. signingKeyId exists exactly when at least one assertion was signed. Any other post-authorization failure emits a value-free terminal failure. Every terminal record omits executionBounds. The complete envelope bytes exist and pass the size bound before release audit, and only those exact bytes return after durable acceptance. Closed event structs reject raw selector, source, request, response and signing material.
    negative_test: sec-request-batch-audit-minimized
  - id: V1-I53
    rule: Provider discovery is a deterministic closed projection of governed public service identity, endpoint, roles, conformance, exact compatible binding-and-response capability tuples, jurisdictions, and Evidence Type identifiers, and reaches no Evidence data path.
    threat: An unauthenticated discovery response leaks source bindings, selector or adapter configuration, credentials, authorization policy, signing material, audit state, internal network information, or assertion data.
    enforcement: Evidence compilation renders the shared closed Registry Discovery profile from an explicit public allowlist and seals catalog.jsonld in the deployment package. It emits one Data Service node per exact Evidence Type and compatible binding-and-response profile, with a distinct centrally derived bindingId, so JSON-LD, RDF, and multi-filter search cannot create a cross-requirement capability pair. Startup recomputes only to reject a missing, extra, or byte-drifted artifact, then captures the packaged bytes. Capability identifiers encode compatible binding-and-response tuples, never independently combinable tags. The stable public route serves only the captured packaged bytes without authentication, source access, assertion evaluation, signing, or Evidence audit writes.
    negative_test: sec-provider-public-projection
  - id: V1-I54
    rule: Every bundle states allowedClients and requiredScopes, each as the keyword unrestricted or a nonempty list; an omitted member and an empty list are refused when the bundle is read. When a list is stated, admission is the explicit list and the required scope set of the verified token; audience plus static issuer-governed attributes alone never establish resource permission, and a missing scope is never inferred from tags, principal, roles, sub, or request fields.
    threat: An issuer that returns a correctly signed token for a known resource with zero scopes while still emitting the client's static attributes lets that client reach protected Evidence operations on audience and attributes alone.
    enforcement: Client admission runs in the platform verifier's client_id/azp semantics; the scope gate runs after signature verification and before any authority claim is read, with the same closed refusal a refused client gets.
    negative_test: sec-admission-clients-and-scopes
  - id: V1-I55
    rule: When authentication states assertionIssuers, a token carrying the platform verifier's registry_assertion_issuer claim is admitted only when the client it names is a listed key and the claim value is one of that client's listed authorities; an absent map applies no rule, and a token carrying no such claim is never affected by this admission.
    threat: An authorization server that grants token exchange per client but not per assertion authority lets any exchange-capable client present any authority that server trusts, so a client approved to act on one authority's assertions reaches Evidence carrying another authority's and is indistinguishable from the approved one at the boundary.
    enforcement: The pairing is applied in the platform verifier beside allowedClients, under the same client_id/azp semantics, so a refusal is a credential refusal taken before any requirement is read or made visible to the caller. A claim-free client-credentials token is admitted either way, so the rule narrows exchanged authority without gating ordinary service callers.
    negative_test: sec-assertion-authority-pairing
  - id: V1-I56
    rule: A selector value that passes its profile is refused in one of two ways, in both before any credential is read or source request is sent. A value that the inputs schema of a source of the requirement refuses is refused before any access-attempt audit entry, as request.selector-invalid on the public check route (before any registry read) and as service.unavailable with problem category source-inputs on the relying routes. A value that passes, or that meets a source with no inputs schema, but that the source binds to a request path segment the value cannot occupy is refused after the durable access-attempt audit event, as source.unavailable audited as a dependency failure, on the single, the batch and the public check route alike; on the relying routes it is not charged to the selector-failure budget.
    threat: A caller-chosen value containing a separator, a dot segment, a percent escape or a control character, placed into a source request path, reaches a different source route than the reviewed one, or is sent to the source with its credential attached. A residual remains, since the segment refusal reports a caller input error as source.unavailable, so it reads as an authoritative-source outage in both the response and the durable audit, and a caller can produce that appearance at will; the audit category tells the operator which occurred.
    enforcement: Path materialization applies one segment admissibility rule, rejecting empty, slash, backslash, percent, control and dot-segment values, and percent-encodes every accepted value exactly once. The rule runs inside source execution after the access intent is durably appended and before credential resolution and transport, so no source request is sent and no credential is read for a refused value. The refusal is a dependency failure in the response and in the audit, and a value that merely needs percent-encoding still reaches the source encoded once. An inputs-schema refusal is taken during selector resolution, before the access intent is appended, so it writes no audit entry and reads no registry.
    negative_test: sec-path-selector-refused-before-source
  - id: V1-I57
    rule: Discovery-free issuer key fetches use the shared declared-endpoint rule, so the configured jwksSource.uri may resolve to a public, private, or loopback address while cloud-metadata and link-local destinations are always refused. Plain HTTP is admitted only under the local assurance profile, on the exact numeric 127.0.0.1 loopback origin with an explicit port or elsewhere with allowInsecureHttp; production and evidence-grade bundles refuse a plain HTTP issuer or key endpoint and refuse the opt-in itself even when every URL is HTTPS.
    threat: A key endpoint fetched over plain HTTP beyond loopback lets an on-path attacker substitute the signing keys and mint access tokens the deployment accepts, and an unrestricted fetch target turns key refresh into a request to cloud metadata.
    enforcement: The verifier builds its key fetch policy from the platform IssuerNetworkPolicy for the declared issuer and pins DNS for each fetch with redirects and ambient proxies disabled; bundle validation refuses plain HTTP and allowInsecureHttp for deployable assurance profiles before the bundle can load, and startup logs a fixed warning whenever the opt-in is set.
    negative_test: sec-issuer-key-transport
  - id: V1-I58
    rule: The public check route exists only when a package definition declares publicCheck and the active target authority activates that definition; it reads no principal and no request header except Content-Type, and its trace is minted by the server. With no activation the route answers a request and a preflight exactly as an unknown path does, and no runtime switch opens it.
    threat: An operator edit, a runtime flag or a header turns an authenticated service into one that evaluates registry data for any caller, or lets a caller choose the identity, trace or client address that the log and the audit record.
    enforcement: The router registers the route only for an activated check, and the runtime without an activation answers resource.not-found. The handler reads Content-Type and the body alone; credentials, cookies, forwarding headers and trace context never reach the runtime, the operational log or the audit, and the observer replaces any inbound trace with a server-created one on this route. Admission, body bound and request timeout are those of the relying routes. The public check audit entry names no requester, actor, client or grant.
    negative_test: sec-public-check-gated-and-headerless
  - id: V1-I59
    rule: Every miss of the public check is one identical resource.not-found answer, and the check code is compared once, in constant time, removed from the facts before any derivation, and never logged or audited. The comparison happens only after the Source returns a record; any Source failure before it answers source.unavailable.
    threat: A caller learns whether a document number exists, which part of a pair was wrong, or the check code, through the status, a header, the body, a log line, an audit record, a relying path that receives the code as a fact, or a comparison that returns early. A residual remains, since a number with no record cannot fail the way a record can, so a pack that refuses one record's content before the comparison (a facts schema that constrains values beyond their type, or an extract script that throws on one record's data) lets the source.unavailable answer reveal that a record exists for the number, though neither its status nor its fields.
    enforcement: No match, ambiguous, unresolved, code mismatch and missing fact all return the same status, headers and body apart from the minted trace identifier. The stored code is read from the matched facts, an absent or malformed value is compared against a value no code can equal so that it costs the same comparison, and the fact is removed before derivation; the kernel withholds a declared code fact from every requirement that acquires through the same Source. The request and the code have redacted debug forms, and neither the code nor the document number is written to the log or the audit, which holds only a keyed pseudonym of the number. Any Source failure before the comparison (transport, timeout, call budget, a protocol failure, a facts-schema refusal, an extract-script failure) answers 503 source.unavailable and is audited as a dependency failure, an access-attempt entry then a dependency-failure entry. A record-independent fault answers 503 for every number and reveals nothing. Pack authors keep the facts schema to types, declare a returned record whose number does not exactly match as no-match, and check record content in the derivation, which runs after the comparison, so only a caller holding the right code sees its failures; the example pack follows this.
    negative_test: sec-public-check-identical-miss-and-code-confinement
  - id: V1-I60
    rule: The public check answer carries only the two named outputs of the activated definition and the observation time, is never signed, and is not an Evidence format, so it has no subject identifier, binding, nonce, validity bound or signature.
    threat: The unauthenticated route discloses more than the reviewed answer, or its unsigned answer is mistaken for verifiable Evidence and relied on as such.
    enforcement: The answer is built from the status output and the fields output only, so any other output of the definition stays on the relying path. Authoring and startup bind the status output to a controlled category within the four statuses (valid, suspended, revoked, expired), and startup refuses a definition declaring publicCheck whose status output has values outside them; authoring and startup bind the check code fact to a string fact of the acquiring source that no source input binds, and authoring binds the fields output to a reviewed structured value. The answer refuses a status outside the four with service.unavailable (category public-check-answer), and its schema enumerates them. The answer has its own schema identifier and media type, is serialized before the durable release record and returned unchanged after it, and carries no-store caching.
    negative_test: sec-public-check-answer-ceiling

cross_cutting:
  target_authority_activation:
    threat: A partial write, concurrent activation, injected identity digest, or package/target mismatch becomes effective authority or falsifies activation history.
    enforcement: Compile and validate complete target grants against the package before commit. Derive authorityRevision and authorityDigest from canonical normalized document bytes. A bounded single state document atomically holds ordered history and the active snapshot, under one writer lock with synced write, rename and directory. Startup verifies stored document identities, sequence, target and exact package digest, then captures authority for the process lifetime. An exact repeat of the active package and revision is refused as already active; prepared files are never active. A request audit entry is accepted before the writer lock is taken and a response entry follows the commit. Invalid operator references produce a correlated request and refused response with no reference value or hash; refusals never touch the store, and a response refused after a known durable commit is reported as applied but unaudited. Only a complete durability boundary permits applied with a sequence. Failure before state replacement is failed; uncertain durability after replacement or interrupted blocking execution is unfinished without a sequence, never a claim that authority stayed unchanged.
    negative_test: sec-target-authority-atomic-activation
  target_grant_ceilings:
    threat: A target widens a package definition through actor, authority, value origin, purpose, subject, selector, audience, representation or binding, or combines partial grants into new permission.
    enforcement: Every activated grant must fit one definition's complete authored ceiling and exact subject-role set. Required actor kinds and value origins cannot become wildcards. The authenticated audience is checked against the authored audience ceiling at request time. Exactly one complete grant authorizes, and the process-captured authorityRevision plus effectiveGrantDigest bind access and terminal release audit; pinning authority does not bypass authenticated task-grant validity or release gates.
    negative_test: sec-target-grant-ceilings
  holder_bound_entity_reference_prohibited:
    threat: An entity reference is a pointer only the one relying party it was scoped to can resolve. A holder-bound assertion has no such party, so disclosing one would emit an identifier nobody who receives the credential can resolve and that correlates its holder wherever it is presented.
    enforcement: A holder-bound requirement declaring either entity-reference value form is refused during bundle validation, before the listener binds, with a fixed cause that interpolates nothing from the rejected bundle. The refusal is about the mode, not the value form, so the same concept stays configurable on an audience-scoped requirement.
    negative_test: sec-holder-bound-entity-reference-prohibited
  holder_bound_issuance_purpose:
    threat: A relying party reading the pinned issuance purpose as a licence to use the assertion for that purpose, which would turn a statement about why the issuer released it into an authorization this product does not issue and cannot enforce.
    enforcement: The purpose is compared as signed issuance provenance, so a credential issued under one purpose does not satisfy a policy that pinned another. The presentation policy document is closed and its whole vocabulary either pins something the issuer signed or bounds the proof of possession; a member that would read as a grant, licence, or use limit is refused rather than ignored.
    negative_test: sec-holder-bound-purpose-is-issuance-provenance
  channel_declared_and_consumer_bound:
    threat: A consumer that predates the channel member, or that never decided to trust a presented credential, accepting an assertion whose facts a holder supplied as though Evidence had acquired them from an authoritative source; a presented credential's issue time replaced by the verification instant so a stale credential reads as fresh; a holder-presented claim serialized into a form that has no way to say so.
    enforcement: The channel is a required signed member of a closed vocabulary, and the presented credential is present if and only if the channel is holder-presented, which the payload contract and the verifier both check. A verification policy accepts source only when it names no channels, so an existing consumer refuses holder-presented. The credential issue time is a required instant on the only constructor of the member, is refused when later than the observation, and is bounded by an optional maximum age measured from the observation. The SD-JWT VC profile carries no channel claim, so the runtime refuses to serialize a holder-presented assertion as SD-JWT VC and the verifier reads every SD-JWT VC as source.
    negative_test: sec-channel-declared-and-consumer-bound
  x5c_pinned_leaf:
    threat: Evidence credentials may carry an x5c certificate chain so certificate-trusting wallets and verifiers can resolve the issuer key. If Evidence's own verifier treated a chain the credential supplies as trust, any party holding a key that signs a self-chosen chain could present a credential that verifies, and key-pinned trust would silently become trust in whatever chain a credential brings. A certificate identity attached to a rotated or revoked key, or to a different key than the one that signs, would also certify the wrong key.
    enforcement: An x5c header is accepted only when the pinned key selected by kid in the trusted key set carries an x5c member whose first certificate equals the header's first certificate byte for byte, and the signature is still verified with the pinned key. A pinned key without a chain refuses any x5c header, a differing leaf is refused, a malformed header or pinned chain is refused, and the verifier never validates a chain to anchors. The flattened JWS profile still refuses x5c. At startup the certificate chain file is bound to the active key's thumbprint by file name, must parse, must not exceed the platform chain policy length, must carry a leaf for the signing key, and must be valid at startup; only the active key's served entry carries the chain. Without the configuration the issued header and the key set are unchanged.
    negative_test: sec-x5c-pinned-leaf
  holder_key_confinement:
    threat: Presented key material reaching audit, errors, scripts, source requests, logs, or snapshots, which would let a durable record or an upstream source recognize a holder across every assertion it collects.
    enforcement: The public confirmation the issuer signs into the credential is the one intended destination and is disclosed on purpose; nothing else carries the material. Scripts receive only minimized authorized selectors, so a script cannot read the presented key, and the requests they prepare are checked to carry none of it. The audit log records the pseudonymous scope rather than the key, private members are refused at the boundary, and the operational log field set is closed.
    negative_test: sec-holder-key-material-confined
  config_trust:
    threat: A missing, writable, or unreviewed bundle is treated as trusted configuration.
    enforcement: Version 1 has no in-bundle trust override; the operator must supply exactly one reviewed read-only bundle, and absence or failed immutability checks fail readiness.
    negative_test: sec-missing-or-writable-bundle-fails
  audit_order:
    threat: An authenticated authorization refusal, source read, or evidence release occurs without a durable accountability record.
    enforcement: Minimal authorization-refusal audit precedes its generic 403; durable acquisition intent precedes credential resolution, token acquisition and source effects for every started evaluation or request-batch item; optional per-send detail cannot replace that intent; disclosure-release audit follows final serialization and signing where any assertion is available and precedes release; a request-batch abort after authorization emits its value-free terminal event; all fail closed. An acquisition deadline does not interrupt an in-flight required durable append; once it completes, an expired acquisition begins no credential or source effect. Every entry is written through the shared registry-platform-audit AuditWriter as one JSON line carrying the entry schema, event id, time, request or response phase, the record's operation as correlation, and the record; an access attempt is a request entry and every terminal record a response entry. The file destination returns from an append only after the entry's bytes are synced, and concurrent appends share one durable write without any record being reported durable before its own bytes are synced. A single-writer lock refuses a second process on the same path. Appends and readiness check the pinned identity and modification fingerprint of the active file and its lock, so an external write or replacement fails readiness and every later append; a failed durable write stops the writer for the life of the process. Entries are not chained; tamper evidence after the fact belongs to the append-only store the operator ships audit to, and the stdout destination hands durability to that collector.
    negative_test: sec-audit-order-and-failure
  secret_parsing:
    threat: YAML substitution or bundle values inject credential or key material.
    enforcement: Bundle accepts exact secret references only; resolution occurs after parsing into core-owned secret containers and values never re-enter configuration.
    negative_test: sec-secret-values-rejected-from-bundle
  transport_identity:
    threat: Public binding or proxy-provided identity bypasses Evidence token validation.
    enforcement: Private-address mode accepts only loopback or private HTTP bindings. Explicit container-private mode additionally accepts a wildcard only as an operator assertion about the confined container network and upstream TLS boundary. Concrete public addresses remain refused; Evidence validates strict OIDC bearer tokens and never trusts proxy identity headers.
    negative_test: sec-proxy-identity-header-rejected
  trace_context:
    threat: Caller-controlled tracing metadata is reflected as an unbounded response channel or becomes the durable audit identity, allowing correlation injection or collapsing distinct requests into one accountable operation.
    enforcement: The HTTP boundary accepts only one valid bounded W3C traceparent trace identifier, replaces invalid or duplicate values with server context, never reflects tracestate, emits the effective trace identifier in the response traceparent and problem traceId, and always mints a distinct internal audit operation.
    negative_test: sec-trace-context-bounded-and-audit-distinct
  exact_decimal:
    threat: Binary floating-point conversion changes a disclosed value or bypasses precision and range bounds.
    enforcement: Rhai creates a Rust-owned coefficient-and-scale Decimal from canonical text with precision 28 and scale 9; public wire value is that canonical JSON string.
    negative_test: sec-decimal-no-float-coercion
  entity_reference_projection:
    threat: A source-derived entity seed becomes a global identifier or leaks before audience scoping.
    enforcement: Rhai returns a protected EntityReferenceSeed; Rust HMAC-projects version, concept, audience, and seed with the subject-binding key.
    negative_test: sec-entity-reference-seed-protected
  request_preparation:
    threat: A trusted mapping mistake gains transport authority, smuggles an unbounded request, or acquires credentials before its output is validated.
    enforcement: Evidence projects only bound authorized selectors into the pinned route input schema before acquisition intent, credentials or source effects. The reviewed pack fixes the reachable route, permitted destinations and header policy; Rust checks materialized paths, body and header limits before credential access. GET plans refuse a JSON body and reserved or colliding headers at compilation, while finite aggregate admission and acquisition bounds remain host-owned.
    negative_test: sec-request-preparation-closed
  runtime_ownership_split:
    threat: An environment-specific runtime file silently changes governed authorization, disclosure, source authority, signing, or audit policy.
    enforcement: Closed runtime.yaml binds process-local listeners, metrics, paths, secrets, audit storage, signer transport, captured trust and extract resources, named source connections and finite acquisition tuning. Captured endpoint material must agree with the governed connection policy in destination, authentication authority, trust and client identity; runtime configuration cannot select another route or widen that authority. Extract profiles are bound exactly, the signer must match the governed active public JWK, and captured policy and resources remain fixed for the process lifetime without a separate public runtime revision.
    negative_test: sec-runtime-cannot-override-governed-bundle
  outbound_tls_and_proxy:
    threat: A mutable or untrusted CA or ambient proxy redirects credentials and protected source queries to another authority.
    enforcement: Runtime captures validated private-CA bytes at startup, fixed-origin hostname verification stays enabled, and both evidence-data and OAuth clients ignore ambient proxy variables. Source trust profiles are scoped to the named connection and must match governed endpoint policy. The access-token issuer key-set connection uses only its authentication block-selected private trust profile beside system roots, independently of source connections.
    negative_test: sec-tls-and-proxy-authority-fixed
  subject_role_order:
    threat: Caller-controlled array position substitutes one subject role for another or changes the signed binding order.
    enforcement: Rust resolves a unique subject by declared role independently of both grant order and request array order, rejects duplicate, missing, unknown, and wrong-profile entries, then emits requirement declaration order in evidence, audit, and the JWS.
    negative_test: sec-subject-array-order-nonsemantic
  unsigned_envelope_distinct:
    threat: A stored unsigned response is mistaken for verified signed evidence.
    enforcement: The unsigned envelope is self-identifying with a fixed schema, type, integrity marker, warning, and exact vendor media type, contains no JWS member, and is rejected by the strict JWS verifier.
    negative_test: sec-unsigned-envelope-not-jws
  secret_file_identity:
    threat: A group- or world-accessible, symlinked, multi-link, or oversized secret file exposes or substitutes key material.
    enforcement: File secrets must be regular owner-only files opened without following symlinks, with exact service ownership, exact mode 0400 or 0600, single-hard-link, and size checks before use.
    negative_test: sec-secret-file-identity
  transport_pinning:
    threat: Workspace dependency feature unification silently changes the TLS backend or introduces transport retries, breaking the per-stage request ceiling and TLS contracts.
    enforcement: The shared production destination client explicitly selects rustls and disables implicit reqwest retries. A connection failure creates no hidden retry. Any pack-declared retry is reviewed route logic and consumes the same finite acquisition data-operation budget and absolute deadline as every other source send.
    negative_test: sec-transport-backend-and-single-attempt
  jwks_route_parity:
    threat: The configured JWKS path and the served discovery route drift apart.
    enforcement: Bundle validation pins the one Version 1 discovery path and the served route returns the runtime key set at exactly that configured path.
    negative_test: sec-jwks-route-config-parity
  source_response_shape:
    threat: A source response outside the shape its adapter was reviewed against reaches the extraction script, or a malformed or mismatched Problem Details response is treated as an authoritative unresolved outcome.
    enforcement: Bounded strict JSON parsing precedes provider scripts. Reviewed pack steps may project and validate intermediate provider data against pinned schemas; the final lookup and matched facts always satisfy the binding's closed result schema before derivation. Input and fact roles are independently validated when a pack shares schema bytes; one artifact path cannot carry conflicting digest pins. The optional registry-lookup-v1 host protocol matches its declared unresolved tuple in Rust against the exact bounded 404 problem media type and duplicate-free six-member shape, releasing only a data-free outcome. Any Problem mismatch is a terminal protocol failure before provider scripts run.
    negative_test: sec-source-response-shape-enforced
  script_resource_exhaustion:
    threat: A hostile or defective reviewed script consumes unbounded execution inside the shared process.
    enforcement: The engine's normative operation ceiling terminates the invocation with a closed value-free error.
    negative_test: sec-script-operation-exhaustion
  reserved_header_aliases:
    threat: A configured fixed or API-key header name collides with an authorization, framing, routing, cookie, forwarding, proxy, or tracing header, including case variants and known infrastructure aliases.
    enforcement: One closed ASCII-case-insensitive deny set shared by startup configuration validation and source plan compilation, with prefix families denied before exact names and both checks running before any credential is resolved.
    negative_test: sec-reserved-header-aliases-closed
  source_access_attribution:
    threat: A caller, governed fixed header, API-key name, or Rhai adapter forges another requester or purpose at an authoritative source, or Evidence discloses identity context to an ordinary source that did not opt in.
    enforcement: The reviewed protected-read host protocol explicitly opts into attribution. After token verification and complete Evidence authorization and selector resolution, the host base64url-encodes the bounded non-control UTF-8 requester and purpose into reserved headers. The shared header classifier refuses those names for pack-authored and authentication headers; ordinary endpoints forward no attribution, and an opted-in call without host-owned attribution fails before I/O.
    negative_test: sec-source-access-attribution-host-owned
  sd_jwt_vc_projection_integrity:
    threat: The SD-JWT VC serialization carries different content from the signed assertion, or a relying party accepts a modified disclosure, digest, payload, or protected header.
    enforcement: The credential is a projection of the identical constructed evidence payload. Unprojected supported values have one root disclosure. A configured reviewed structured value has one nested disclosure per direct field, after complete schema validation, plus signed metadata that binds its public claim name back to the original concept, schema, and position. The verifier rebuilds the exact payload, requires an exact digest-to-disclosure match in both directions, and then applies the same output-contract and policy checks as signed JWS. Each serialization is rejected by the other format's verifier.
    negative_test: sec-sd-jwt-projection-integrity
  sd_jwt_vc_format_authorization:
    threat: Requesting the credential media type grants a disclosure the requester is not authorized to receive.
    enforcement: Format selection creates no permission. The immutable bundle and the one complete matched authority grant must each enable the format, and denial does not reveal which layer withheld it.
    negative_test: sec-sd-jwt-format-requires-bundle-and-grant
  sd_jwt_vc_holder_key_closed:
    threat: A caller-supplied holder key smuggles private key material, a non-allowlisted algorithm, or an unparseable body into a signed credential.
    enforcement: The optional holder key must be a closed public EC P-256 JWK with exact x and y coordinates and optional ES256 alg and wallet-owned kid; any private or unknown member, other key type or curve, or malformed body fails before credential acquisition and source access, and the rejection never echoes the submitted key material.
    negative_test: sec-sd-jwt-holder-key-closed
  signing_key_governance:
    threat: A configured kid is detached from its public key, a compromised key remains usable through a cached key set, or exported local private material is used for deployable assurance.
    enforcement: Service keys are exact ES256 P-256 public JWKs whose kid is their RFC 7638 thumbprint; active, published, and revoked sets are disjoint; production and evidence-grade require pinned-version Transit over a workload-local Unix socket and reject denied identifiers before key selection.
    negative_test: sec-service-key-governance
  audit_key_epoch:
    threat: Pseudonyms produced under a replacement audit master are read as if they belonged to the same key history as earlier entries, so one subject appears as two or two key epochs appear as one.
    enforcement: The audit identifier key is derived from one master through the shared platform audit profile, and every pseudonym carries hashKeyVersion in its prefix. Changing the master requires a new hashKeyVersion, so entries under different key material stay distinguishable in one log; a zero version fails startup before the destination opens. Entries are not chained, so the runtime cannot detect a master replaced without a version change; that remains an operator duty in the key rotation procedure.
    negative_test: sec-audit-key-epoch
  sd_jwt_vc_claims_closed:
    threat: A claim outside the profile, such as a status reference, an audience restriction, or a smuggled selector value, reaches a relying party under a valid signature.
    enforcement: The published claim set is closed to the issuer-owned and always-disclosed names plus the declared disclosures; the verifier rejects any other member instead of ignoring it.
    negative_test: sec-sd-jwt-claims-closed
  oid4vci_offer_authorization:
    threat: The offer endpoint of the wallet-facing delivery front end accepts subject selector values and will cause a credential to be issued for whoever those values identify, so an unauthenticated caller, or one holding a token minted for another resource server, would have issuance on demand. A refusal that named the requirement, purpose, evidence type, selector, or value it declined would turn the same endpoint into an oracle over what the deployment offers and who it holds.
    enforcement: The offer endpoint is a resource server for the deployment's authorization server and is the one authorization boundary the delivery front end has. A missing token is answered with a bare challenge, and a token this issuer did not sign, one whose signature was replaced, or one minted for another audience is refused before an offer exists and before anything reaches Evidence. The refusal body carries the two OAuth members and nothing else, and neither the body bytes nor the challenge quotes anything the deployment knows.
    negative_test: sec-oid4vci-offer-requires-authorization
  oid4vci_offer_attribution_audit:
    threat: A credential can be delivered from an offer without durable evidence of the verified client or subject that initiated the exchange, or audit records disclose the selectors, authorization secrets, holder material, or credential they are meant to account for.
    enforcement: The adapter uses the verifier's normalized matched client, with azp authoritative over client_id when no client allowlist is configured, and the verified subject when present. It requires at least one non-empty identity and pseudonymizes each available identity under a separate class. It assigns an opaque random exchange identifier before state is written, carries that identifier through code redemption and token claim, and writes attempted and terminal offer and credential-release entries before releasing either response. Audit failure prevents release, post-claim failure still spends the token and returns terminal credential_request_denied, cancellation records unfinished, and the journal contains no code, token, nonce, proof, selector, holder key, credential, or raw actor identity. Evidence retains its separate authorization and signed-response release audit.
    negative_test: sec-oid4vci-offer-attribution-audit
  oid4vci_offer_request_contract:
    threat: An unusable catalog or selector is accepted into an offer and only rejected after the wallet spends its single-use authorization.
    enforcement: The complete discovered catalog validates before publication, and each offered selector has the exact fields, scalar types, and bounds the selected definition permits before secrets or exchange state are created and before upstream issuance.
    negative_test: sec-oid4vci-offer-request-contract
  oid4vp_verifier_service:
    threat: The wallet protocol service accepts a response for the wrong session, state, key or policy query, accepts two responses for one session, or accepts one after its window; or it records a response as accepted and then refuses it; or a caller other than Evidence, or Evidence on behalf of another principal, reads a held presentation; or one presentation is read again and again, so a relying party gets one signed comparison per guessed name; or the service keeps reporting ready while wallets refuse its expired client identifier certificate.
    enforcement: A response is decrypted with the session's own key and must carry its state, a single plain error or one encrypted response with no repeated member, and a vp_token matching the policy query, within a bounded body. One response is reserved per session inside the exchange window and is confirmed or released after its audit record is written, whatever the window does meanwhile, and the expiry sweep keeps a reserved session. Only the Evidence service credential reads, and a foreign principal reads exactly as an unknown reference. The first successful read of a terminal result consumes it and releases its held bytes, decided under the session lock so that of concurrent reads exactly one receives it; a read that does not succeed consumes nothing, and the audit record states the consumption. Readiness fails once a client identifier certificate is past its notAfter by the service clock, with one warning that names the identifier and no certificate content.
    negative_test: sec-oid4vp-verifier-negative-paths
  signed_evidence_source:
    threat: An unsigned, substituted, expired, or misdirected upstream assertion is treated as authoritative source data and disclosed under a downstream signature, a downstream assertion outlives the verified upstream fact it derives from, an upstream selector resolved from the downstream service's own source credential returns one fixed subject's values next to a different downstream subject binding, or the downstream caller's requester and purpose are forwarded to another deployment that has no use for them.
    enforcement: A governed Source pins a reviewed pack host protocol, one complete upstream definition and independently accepted public keys. The strict Evidence-owned host-protocol compiler accepts only request-origin upstream selectors, refuses caller-controlled attribution overrides, and refuses unauthenticated signed-source endpoints before I/O. Protocol content is a digest-covered pack artifact rather than inline bundle-schema members. The host prepares a fresh opaque request nonce, bounds the raw response and trace headers, and verifies signature, revocation, issuer, provider, assurance, audience, purpose, requirement, revision, subject roles, validity and declared values before any verified values enter pack execution. Rust retains verified validUntil outside script-visible facts, carries the earliest trusted deadline through acquisition and request-batch items, caps downstream validity, and refuses construction when the cap is no longer live. Only verified values reach scripts; opaque first-use subject bindings are not independently derived, and no source protocol metadata enters public assertions or audit. Verification failure is terminal and cannot fall back to unsigned or raw provider data.
    negative_test: sec-signed-evidence-source
  wallet_presentation_source:
    threat: A presentation a holder made to another verifier, for another session, or by a different caller, a credential from an issuer the channel never approved or one a reviewer has since withdrawn, a stale or expired credential, or a forged claim set is released to a route and signed into an assertion; or the wallet protocol service, which holds the presentation, is trusted to decide issuer trust or to vouch for the credential; or the presentation bytes, nonce, session reference or claim values leak into scripts, audit, or diagnostics.
    enforcement: A governed Source pins the built-in wallet presentation host protocol, whose compiler refuses an unauthenticated endpoint, status checking that is not available, holder binding that is not required, an attribute-match link with no disclosed claim to compare, and any configuration with a missing, unknown or duplicated member, including an unstated deny-list. The request is closed to a session reference and the presenting principal, sent to one fixed read path without a query. Rust verifies the presentation with the pure presentation crate before any route step runs; the deny-list is consulted before the allow-list and before any signature work, issuer keys come only from configured anchors or pinned keys, disclosures resolve under the format rules, and the key-binding JWT must match the session nonce and the channel client identifier. The read context must carry the channel policy identifier and client identifier and the requesting principal, and the response must hold exactly one string under exactly the configured query. Validity is judged at the acquisition evaluation instant; a stated receipt time later than that instant plus the clock skew, or earlier than it less the verifier service's largest result window and the skew, is refused; a credential without an issue time or older than the maximum age is refused, and the attached presented facts expire at the earlier of the credential expiry and the age bound. Every failure is a dependency failure that releases no fact and no attachment. Only the declared claims that are present and a closed verification object reach scripts; credential bytes, signatures, holder keys, the nonce and undeclared claims do not, and the raw response is zeroized.
    negative_test: sec-wallet-presentation-source
  oid4vci_single_use_code:
    threat: A pre-authorized code or access token redeemable twice would let a forwarded offer URI or a captured token collect the credential a second time, so the holder it was meant for and the party that took it both succeed and neither learns of the other.
    enforcement: The bounded store atomically marks the pre-authorized code redeemed and the access token claimed before the prepared request they carry is handed on, and refuses either on reuse. The token is claimed before credential-configuration, nonce, or proof validation, so one authorization buys one attempt rather than a place to try requests against a live token. Concurrent claims have one winner; saturation fails closed without evicting a live exchange or spending an offer that could not receive a token; cleanup releases expired held material without touching live state; and restart invalidates outstanding process-local state. Unknown, expired, consumed, locked, and restarted values share the same bounded refusal classes.
    negative_test: sec-oid4vci-code-single-use
  oid4vci_transaction_code_bounded:
    threat: A short numeric transaction code is guessable if it may be tried without limit, and a failure count held inside the offer, or lost when the offer is dropped, would make every lockout a fresh start.
    enforcement: Failures are counted in a ledger keyed by the pre-authorized code's tag that outlives the offer itself, so exhausting the configured ceiling locks the offer out for the rest of its life and the correct code is refused afterwards too. A locked-out offer no longer holds the prepared request it was protecting.
    negative_test: sec-oid4vci-tx-code-bounded
  oid4vci_proof_closed:
    threat: The wallet proof is the only thing binding a delivered credential to the key that will hold it. A proof read loosely, resolved through a remote kid or x5c reference, carrying an invalid self-contained key, claiming an issuer, made for another audience, carrying a nonce this service did not mint, issued outside its window, expired, unsigned, or carrying a duplicated member would bind a credential to a key the presenter does not hold. Validating any of that after calling Evidence would spend an authorization decision and a source read on a proof about to be refused.
    enforcement: The proof header type is the bare registered value and exactly one key reference is permitted. An inline public JWK and a locally decoded did:jwk #0 key are honoured under one closed member set, so an unreviewed member inside the presented key is refused rather than dropped from it, and a key whose own algorithm disagrees with the pinned header algorithm is refused rather than verified on its own terms; every other kid and x5c are refused without resolution. The issuer claim must be absent; audience, issuance time and nonce are required, and the audience is a single string rather than the array form; optional expiry must still be current and cannot relax issuance freshness. The stateless nonce must be service-minted, intact, and unexpired, but reuse alone is not replay and one nonce may validate under separate live authorizations. The signature is verified before the payload is parsed, and both header and payload are closed with duplicate members refused rather than resolved last-wins. Batch size and distinct RFC 7638 holder thumbprints are checked after token claim but before one Evidence request. Every refusal reports one proof class and happens before any Evidence call, which is asserted by counting the requests that reached Evidence rather than by reading the status alone, and control cases prove both accepted key forms reach Evidence.
    negative_test: sec-oid4vci-proof-closed
  oid4vci_holder_bound_only:
    threat: An audience-scoped assertion is addressed to one relying party. Delivering one to a wallet would launder it into something that reads as a holder-bound credential while carrying a binding and an entity reference nobody who receives it can rely on or resolve.
    enforcement: The published credential configurations are derived from the Evidence bundle and drop every requirement that is not unambiguously holder-bound, so an audience-scoped requirement is never published to a wallet. The offer endpoint refuses a credential configuration the catalog does not carry, with a cause that describes nothing else, and the credential endpoint refuses a configuration other than the one the redeemed offer named before anything reaches Evidence.
    negative_test: sec-oid4vci-no-audience-scoped-laundering
  oid4vci_no_signing_key:
    threat: A delivery front end holding a credential signing key or a holder private key would be inside the trust chain a relying party checks, so it could mint or rewrite what a wallet receives, and it could recover or correlate holders across presentations.
    enforcement: The delivery configuration has no member for a signing key and refuses an unknown member as a load failure, so no deployment document can give the process one. What a wallet receives is compared byte for byte against what Evidence returned, which a service that signed or re-signed could not satisfy. A proof presenting a private key member is refused before any Evidence call, and the one key the process does hold, its own client identity, never reaches debug output.
    negative_test: sec-oid4vci-service-holds-no-key
  oid4vci_telemetry_private:
    threat: A public metrics surface, unbounded request labels, or operational records carrying deployment and protocol values become a second disclosure channel for issuer topology, request activity, holders, and credentials.
    enforcement: Metrics are absent unless an operator configures a distinct loopback-or-private listener, that listener serves only GET /metrics, and every request, problem, outcome, latency, state-pressure, expiry, cleanup, and upstream-availability series is selected from a closed label vocabulary. Metrics and request logs contain no raw issuer, audience, client, credential configuration, secret, nonce, proof, holder key, credential, selector, or subject value.
    negative_test: sec-oid4vci-telemetry-private
  holder_presented_channel_selection:
    threat: A request on a source selector profile that reaches the wallet presentation Source, a holder-presented answer built without the verified presentation facts, or a fallback from one channel to the other would label an assertion with a channel its evidence did not come from, so a relying party that accepts only the source channel could be handed what a holder merely presented.
    enforcement: A selector profile selects exactly one acquisition channel, fixed by the definition and checked at startup; the holder-presented Source must use the wallet presentation protocol and a source-channel Source must not; a profile that would select both channels, a definition with neither channel, a holder-presented definition that offers any representation but signed JWS, and a channels member on a grant are all refused at the offending member before a request is served. At run time the channel Source is chosen from the resolved selector profile alone and a mixed or unknown profile acquires nothing. A holder-presented channel with no trusted presented facts is a dependency failure, never a source assertion, and a source channel that receives presented facts is a protocol refusal, so neither releases a fact. The credential issue time is a required argument of the only constructor of the presented credential, so a holder-presented assertion has no default credential time.
    negative_test: sec-holder-presented-channel-selection
