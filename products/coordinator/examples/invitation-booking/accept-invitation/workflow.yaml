# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: accept-invitation
  version: '1'
types:
  workflow-input:
    type: object
    additionalProperties: false
    required: [invitationId, grant]
    properties:
      invitationId: {type: string, format: uuid}
      grant:
        type: object
        additionalProperties: false
        required: [id, expiresAt]
        properties:
          id: {type: string, format: uuid}
          expiresAt: {type: integer, minimum: 1}
contracts:
  invitations:
    type: breg
    source: generated/invitations.contract.json
functions:
  invitation-route:
    runtime: rhai
    source: functions.rhai
    entrypoint: invitation_route
    inputs:
      invitation: {operationOutput: invitations-read-record}
    output:
      type: string
      enum: [claim, expired, revoked, ineligible, booked, accepting, no-capacity]
  claim-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: claim_request
    inputs:
      input: {typeRef: workflow-input}
    output: {operationInput: invitations-claim}
  availability-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: availability_request
    inputs:
      invitation: {operationOutput: invitations-read-record}
    output: {operationInput: catalogue-read-availability}
  capacity-route:
    runtime: rhai
    source: functions.rhai
    entrypoint: capacity_route
    inputs:
      availability: {operationOutput: catalogue-read-availability}
    output: {type: string, enum: [available, unavailable]}
  booking-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: booking_request
    inputs:
      input: {typeRef: workflow-input}
      invitation: {operationOutput: invitations-read-record}
      metadata: {operationOutput: catalogue-read-scheduling}
      availability: {operationOutput: catalogue-read-availability}
    output: {operationInput: book-appointment}
  record-result-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: record_result_request
    inputs:
      invitation: {operationOutput: invitations-read-record}
      appointment: {operationOutput: book-appointment}
    output: {operationInput: invitations-record-booking-result}
  record-no-capacity-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: record_no_capacity_request
    inputs:
      invitation: {operationOutput: invitations-read-record}
    output: {operationInput: invitations-record-no-capacity}
  notice-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: notice_request
    inputs:
      invitation: {operationOutput: invitations-read-record}
      appointment: {operationOutput: book-appointment}
    output: {operationInput: notices-submit-message}
operations:
  invitations-read-record:
    uses: breg.read-record/v1
    connection: invitations
  invitations-claim:
    uses: breg.invoke-action/v1
    connection: invitations
    action: {contract: invitations, id: claim-invitation}
  invitations-record-booking-result:
    uses: breg.invoke-action/v1
    connection: invitations
    action: {contract: invitations, id: record-booking-result}
  invitations-record-no-capacity:
    uses: breg.invoke-action/v1
    connection: invitations
    action: {contract: invitations, id: record-no-capacity}
  catalogue-read-scheduling:
    uses: scheduling.read-service/v1
    connection: catalogue
  catalogue-read-availability:
    uses: scheduling.read-availability/v1
    connection: catalogue
  book-appointment:
    uses: scheduling.create-appointment/v1
    connection: bookings
  notices-submit-message:
    uses: messaging.submit-message/v1
    connection: notices
workflow:
  input: {typeRef: workflow-input}
  deadlineSeconds: 86400
  start: read-invitation
  steps:
    read-invitation:
      type: call
      operation: invitations-read-record
      input:
        type: fields
        fields:
          collection: {type: literal, value: invitations}
          recordId: {type: input, path: /invitationId}
      next: current-state
    current-state:
      type: choose
      choose:
        type: function
        function: invitation-route
        inputs:
          invitation: {type: step, step: read-invitation}
      cases:
        claim: claim
        expired: expired
        revoked: revoked
        ineligible: ineligible
        booked: already-booked
        accepting: acceptance-in-progress
        no-capacity: no-capacity
    claim:
      type: call
      operation: invitations-claim
      input:
        type: function
        function: claim-request
        inputs:
          input: {type: input}
      next: read-claimed-invitation
    read-claimed-invitation:
      type: call
      operation: invitations-read-record
      input:
        type: fields
        fields:
          collection: {type: literal, value: invitations}
          recordId: {type: input, path: /invitationId}
      next: metadata
    metadata:
      type: call
      operation: catalogue-read-scheduling
      input: {type: fields, fields: {}}
      next: availability
    availability:
      type: call
      operation: catalogue-read-availability
      input:
        type: function
        function: availability-request
        inputs:
          invitation: {type: step, step: read-claimed-invitation}
      next: capacity
    capacity:
      type: choose
      choose:
        type: function
        function: capacity-route
        inputs:
          availability: {type: step, step: availability}
      cases:
        available: book
        unavailable: record-no-capacity
    record-no-capacity:
      type: call
      operation: invitations-record-no-capacity
      input:
        type: function
        function: record-no-capacity-request
        inputs:
          invitation: {type: step, step: read-claimed-invitation}
      next: no-capacity
    book:
      type: call
      operation: book-appointment
      input:
        type: function
        function: booking-request
        inputs:
          input: {type: input}
          invitation: {type: step, step: read-claimed-invitation}
          metadata: {type: step, step: metadata}
          availability: {type: step, step: availability}
      next: record-result
    record-result:
      type: call
      operation: invitations-record-booking-result
      input:
        type: function
        function: record-result-request
        inputs:
          invitation: {type: step, step: read-claimed-invitation}
          appointment: {type: step, step: book}
      next: notify
    notify:
      type: call
      operation: notices-submit-message
      input:
        type: function
        function: notice-request
        inputs:
          invitation: {type: step, step: read-claimed-invitation}
          appointment: {type: step, step: book}
      next: accepted
    accepted:
      type: finish
      outcome: appointment-and-message-accepted
      output:
        type: fields
        fields:
          acceptanceId: {type: step, step: read-claimed-invitation, path: /data/domainData/acceptanceId}
          appointmentId: {type: step, step: book, path: /appointmentId}
          messageId: {type: step, step: notify, path: /id}
    expired: {type: finish, outcome: invitation-expired}
    revoked: {type: finish, outcome: invitation-revoked}
    ineligible: {type: finish, outcome: invitation-ineligible}
    already-booked:
      type: finish
      outcome: already-accepted
      output:
        type: fields
        fields:
          appointmentId: {type: step, step: read-invitation, path: /data/domainData/appointmentId}
    acceptance-in-progress:
      type: finish
      outcome: acceptance-in-progress
      output:
        type: fields
        fields:
          acceptanceId: {type: step, step: read-invitation, path: /data/domainData/acceptanceId}
    no-capacity:
      type: finish
      outcome: no-current-capacity
      output:
        type: fields
        fields:
          acceptanceId: {type: step, step: read-invitation, path: /data/domainData/acceptanceId}
  outcomes:
    appointment-and-message-accepted:
      type: object
      additionalProperties: false
      required: [acceptanceId, appointmentId, messageId]
      properties:
        acceptanceId: {type: string}
        appointmentId: {type: string}
        messageId: {type: string, format: uuid}
    invitation-expired: {type: 'null'}
    invitation-revoked: {type: 'null'}
    invitation-ineligible: {type: 'null'}
    already-accepted:
      type: object
      additionalProperties: false
      required: [appointmentId]
      properties: {appointmentId: {type: string}}
    acceptance-in-progress:
      type: object
      additionalProperties: false
      required: [acceptanceId]
      properties: {acceptanceId: {type: string}}
    no-current-capacity:
      type: object
      additionalProperties: false
      required: [acceptanceId]
      properties: {acceptanceId: {type: string}}
