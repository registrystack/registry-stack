# yaml-language-server: $schema=https://id.registrystack.org/schemas/messaging/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/messaging/project/v1alpha1
kind: MessagingProject
project:
  id: earlier-appointment-notices
  version: '1'
providers:
  - id: mail-relay
    type: smtp
senderProfiles:
  - id: transactional
    channel: email
    provider: mail-relay
    sender: notices@example.invalid
templates:
  - id: earlier-appointment
    version: '1'
accessProfiles:
  - id: alert-sender
    principalClaim: sub
    requiredScopes: [messaging:send]
    requesterClients: [coordinator-alerts]
    actorKind: service
    role: sender
    senderProfiles: [transactional]
    templates: [earlier-appointment]
    requestsPerMinute: 60
    burst: 10
