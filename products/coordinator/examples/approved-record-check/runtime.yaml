# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/runtime/runtime.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/runtime/v1alpha1
kind: CoordinatorRuntimeConfig
secretProviders:
  environment: {}
  file: {root: /private/tmp/coordinator-secrets}
database:
  runtimeUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
  migrationUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
namespace: coordinator_approved_check
connections:
  source:
    product: breg
    baseUrl: http://127.0.0.1:8100
    profile: approved-reader
    authorization:
      tokenEndpoint: http://127.0.0.1:8090/oauth2/token
      clientAssertionAudience: http://127.0.0.1:8090
      clientId: task-agent
      signingKeyRef: secret:file/task-agent-key
      resource: urn:example:applications
      scopes: [records:get]
      taskAuthority:
        baseUrl: http://127.0.0.1:8092
        issuer: https://casework.local.example
        subject: registered-agent-subject
        exchangeAudience: http://127.0.0.1:8090
        bootstrapResource: urn:example:casework
