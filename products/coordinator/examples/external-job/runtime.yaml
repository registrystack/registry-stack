apiVersion: id.registrystack.org/formats/coordinator/runtime/v1alpha1
kind: CoordinatorRuntimeConfig
secretProviders:
  environment: {}
  file:
    root: /run/registry-coordinator/secrets
database:
  runtimeUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
  migrationUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
namespace: coordinator_directory
connections:
  jobs:
    type: external-http
    baseUrl: http://127.0.0.1:9010/
    commandPath: jobs
    paths:
    - jobs/status
    queryParameters:
    - id
    authorization:
      tokenEndpoint: http://127.0.0.1:8090/oauth2/token
      clientAssertionAudience: http://127.0.0.1:8090
      clientId: coordinator-external-job
      signingKeyRef: secret:file/external-job-client-jwk
      resource: urn:example:external-job
      scopes:
      - external-job:admit
      - external-job:observe
    responseSchema:
      type: object
      additionalProperties: false
      required:
      - status
      - body
      properties:
        status:
          type: integer
          const: 200
        body:
          type: object
          additionalProperties: false
          required:
          - jobId
          - state
          properties:
            jobId:
              type: string
              minLength: 1
              maxLength: 64
            state:
              type: string
              enum:
              - queued
              - running
              - succeeded
              - failed
