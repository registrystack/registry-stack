# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/scenarios/scenarios.v1alpha1.schema.json
# Synthetic replies exercise the compiled model. The PostgreSQL test drives the
# same project through the real HTTP adapters and durable Coordinator worker.
apiVersion: id.registrystack.org/formats/coordinator/scenarios/v1alpha1
kind: CoordinatorScenarios
cases:
- id: complete-after-pending
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 201, body: {jobId: job-001}}
    read:
    - type: success
      value:
        status: 200
        body:
          jobId: job-001
          state: queued
  waits:
    await-terminal:
      type: observations
      responses:
      - status: 200
        body:
          jobId: job-001
          state: running
      - status: 200
        body:
          jobId: job-001
          state: succeeded
  expect:
    path:
    - admit
    - read
    - await-terminal
    - report-terminal
    state: completed
    outcome:
      type: named
      value: job-result
    output:
      state: complete
      result:
        jobId: job-001
- id: declared-job-failure
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 201, body: {jobId: job-001}}
    read:
    - type: success
      value:
        status: 200
        body:
          jobId: job-001
          state: queued
  waits:
    await-terminal:
      type: observations
      responses:
      - status: 200
        body:
          jobId: job-001
          state: failed
  expect:
    path:
    - admit
    - read
    - await-terminal
    - report-terminal
    state: completed
    outcome:
      type: named
      value: job-result
    output:
      state: refused
      code: external-job-failed
- id: timeout-stops-only-this-wait
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 201, body: {jobId: job-001}}
    read:
    - type: success
      value:
        status: 200
        body:
          jobId: job-001
          state: running
  waits:
    await-terminal:
      type: timeout
  expect:
    path:
    - admit
    - read
    - await-terminal
    - stopped-waiting
    state: completed
    outcome:
      type: named
      value: job-wait-expired
    output: null
    workflowElapsedSeconds: 600
- id: invalid-job-is-a-declared-no-effect-refusal
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 422, body: {reason: invalid-job}}
  expect:
    path: [admit, admission-refused]
    state: completed
    outcome: {type: named, value: job-admission-refused}
    output: {refusalCode: invalid-job}
- id: unusable-admission-response-is-uncertain
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 200, body: {}}
  expect:
    path: [admit]
    state: uncertain
- id: changed-command-conflict-is-uncertain
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 409, body: {reason: idempotency-conflict}}
  expect:
    path: [admit]
    state: uncertain
- id: lost-admission-reply-recovers-the-same-command
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - {type: uncertain, code: transport-uncertain}
    - type: response
      value: {status: 200, body: {jobId: job-001}}
    read:
    - type: success
      value: {status: 200, body: {jobId: job-001, state: running}}
  waits:
    await-terminal:
      type: observations
      responses:
      - {status: 200, body: {jobId: job-001, state: succeeded}}
  recovery:
    admit: retry-same
  expect:
    path: [admit, read, await-terminal, report-terminal]
    state: completed
    outcome: {type: named, value: job-result}
    output: {state: complete, result: {jobId: job-001}}
- id: read-current-authority-refused
  admittedAt: '2026-10-14T00:00:00Z'
  input: {reference: case-001}
  replies:
    admit:
    - type: response
      value: {status: 201, body: {jobId: job-001}}
    read:
    - type: refused
      code: credential-refused
  expect:
    path:
    - admit
    - read
    state: refused
    outcome:
      type: none
