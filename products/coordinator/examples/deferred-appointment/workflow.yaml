# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: deferred-appointment
  version: '1'
types:
  workflow-input:
    type: object
    additionalProperties: false
    required:
    - applicationId
    - bookAfter
    - searchStart
    - searchEnd
    - grant
    properties:
      applicationId:
        type: string
        format: uuid
      bookAfter:
        type: string
        format: date-time
      searchStart:
        type: string
        format: date-time
      searchEnd:
        type: string
        format: date-time
      grant:
        type: object
        additionalProperties: false
        required:
        - id
        - expiresAt
        properties:
          id:
            type: string
            format: uuid
          expiresAt:
            type: integer
            minimum: 1
functions:
  appointment-route:
    runtime: rhai
    source: functions.rhai
    entrypoint: appointment_route
    inputs:
      record:
        operationOutput: applications-read-record
    output:
      type: string
      enum:
      - book
      - skip
  capacity-route:
    runtime: rhai
    source: functions.rhai
    entrypoint: capacity_route
    inputs:
      availability:
        operationOutput: catalogue-read-availability
    output:
      type: string
      enum:
      - available
      - unavailable
  booking-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: booking_request
    inputs:
      input:
        typeRef: workflow-input
      metadata:
        operationOutput: catalogue-read-scheduling
      availability:
        operationOutput: catalogue-read-availability
    output:
      operationInput: bookings-create-appointment
  notice-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: notice_request
    inputs:
      input:
        typeRef: workflow-input
      record:
        operationOutput: applications-read-record
      appointment:
        operationOutput: bookings-create-appointment
    output:
      operationInput: notices-submit-message
operations:
  applications-read-record:
    uses: breg.read-record/v1
    connection: applications
  catalogue-read-scheduling:
    uses: scheduling.read-service/v1
    connection: catalogue
  catalogue-read-availability:
    uses: scheduling.read-availability/v1
    connection: catalogue
  bookings-create-appointment:
    uses: scheduling.create-appointment/v1
    connection: bookings
  notices-submit-message:
    uses: messaging.submit-message/v1
    connection: notices
workflow:
  input:
    typeRef: workflow-input
  deadlineSeconds: 86400
  start: read-application
  steps:
    read-application:
      type: call
      operation: applications-read-record
      input:
        type: fields
        fields:
          collection:
            type: literal
            value: applications
          recordId:
            type: input
            path: /applicationId
      next: eligibility
    eligibility:
      type: choose
      choose:
        type: function
        function: appointment-route
        inputs:
          record:
            type: step
            step: read-application
      cases:
        book: due
        skip: skipped
    due:
      type: wait-until
      waitUntil:
        type: input
        path: /bookAfter
      next: metadata
    metadata:
      type: call
      operation: catalogue-read-scheduling
      input:
        type: fields
        fields: {}
      next: availability
    availability:
      type: call
      operation: catalogue-read-availability
      input:
        type: fields
        fields:
          offering:
            type: literal
            value: application-review
          start:
            type: input
            path: /searchStart
          end:
            type: input
            path: /searchEnd
          limit:
            type: literal
            value: 20
      next: capacity
    capacity:
      type: choose
      choose:
        type: function
        function: capacity-route
        inputs:
          availability:
            type: step
            step: availability
      cases:
        available: book
        unavailable: no-capacity
    book:
      type: call
      operation: bookings-create-appointment
      input:
        type: function
        function: booking-request
        inputs:
          input:
            type: input
          metadata:
            type: step
            step: metadata
          availability:
            type: step
            step: availability
      next: notify
    notify:
      type: call
      operation: notices-submit-message
      input:
        type: function
        function: notice-request
        inputs:
          input:
            type: input
          record:
            type: step
            step: read-application
          appointment:
            type: step
            step: book
      next: accepted
    accepted:
      type: finish
      outcome: appointment-and-message-accepted
      output:
        type: fields
        fields:
          appointmentId:
            type: step
            step: book
            path: /appointmentId
          messageId:
            type: step
            step: notify
            path: /id
    skipped:
      type: finish
      outcome: no-current-eligibility
    no-capacity:
      type: finish
      outcome: no-current-capacity
  outcomes:
    appointment-and-message-accepted:
      type: object
      additionalProperties: false
      required:
      - appointmentId
      - messageId
      properties:
        appointmentId:
          type: string
        messageId:
          type: string
          format: uuid
    no-current-eligibility:
      type: 'null'
    no-current-capacity:
      type: 'null'
