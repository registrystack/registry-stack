    searchEnd: '2026-10-10T11:00:00Z'
    grant:
      id: 00000000-0000-4000-8000-000000000003
      expiresAt: 1791620000
  replies:
    read-application:
    - type: success
      value:
        data:
          domainData:
            appointmentAllowed: true
            email: person@example.invalid
    metadata:
    - type: success
      value:
        schedulingId: pilot
        policyRevision: 7
        policyDigest: sha256:policy
    availability:
    - type: success
      value:
        items:
        - kind: slot
          start: '2026-10-10T10:00:00Z'
          end: '2026-10-10T10:30:00Z'
          free: 1
        nextCursor: null
    book:
    - type: success
      value:
        appointmentId: appointment-one
        offering: application-review
        start: '2026-10-10T10:00:00Z'
        end: '2026-10-10T10:30:00Z'
    notify:
    - type: success
      value:
        id: 00000000-0000-4000-8000-000000000002
        status: queued
  expect:
    path:
    - read-application
    - eligibility
    - due
    - metadata
    - availability
    - capacity
    - book
    - notify
    - accepted
    state: completed
    outcome:
      type: named
      value: appointment-and-message-accepted
    output:
      appointmentId: appointment-one
      messageId: 00000000-0000-4000-8000-000000000002
    workflowElapsedSeconds: 960
