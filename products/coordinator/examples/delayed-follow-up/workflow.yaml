# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: delayed-follow-up
  version: '1'
types:
  workflow-input:
    type: object
    additionalProperties: false
    required:
    - applicationId
    - sendAfter
    properties:
      applicationId:
        type: string
        format: uuid
      sendAfter:
        type: string
        format: date-time
functions:
  notice-route:
    runtime: rhai
    source: functions.rhai
    entrypoint: notice_route
    inputs:
      record:
        operationOutput: applications-read-record
    output:
      type: string
      enum:
      - send
      - skip
  notice-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: notice_request
    inputs:
      input:
        typeRef: workflow-input
      record:
        operationOutput: applications-read-record
    output:
      operationInput: notices-submit-message
operations:
  applications-read-record:
    uses: breg.read-record/v1
    connection: applications
  notices-submit-message:
    uses: messaging.submit-message/v1
    connection: notices
workflow:
  input:
    typeRef: workflow-input
  deadlineSeconds: 2592000
  start: due
  steps:
    due:
      type: wait-until
      waitUntil:
        type: input
        path: /sendAfter
      next: read-application
    read-application:
      type: call
      operation: applications-read-record
      input:
        type: fields
        fields:
          collection:
            type: literal
            value: applications
          recordId:
            type: input
            path: /applicationId
      next: permission
    permission:
      type: choose
      choose:
        type: function
        function: notice-route
        inputs:
          record:
            type: step
            step: read-application
      cases:
        send: notify
        skip: skipped
    notify:
      type: call
      operation: notices-submit-message
      input:
        type: function
        function: notice-request
        inputs:
          input:
            type: input
          record:
            type: step
            step: read-application
      next: accepted
    accepted:
      type: finish
      outcome: message-accepted
      output:
        type: fields
        fields:
          messageId:
            type: step
            step: notify
            path: /id
    skipped:
      type: finish
      outcome: no-current-permission
  outcomes:
    message-accepted:
      type: object
      additionalProperties: false
      required:
      - messageId
      properties:
        messageId:
          type: string
          format: uuid
    no-current-permission:
      type: 'null'
