# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/scenarios/scenarios.v1alpha1.schema.json
# Executable synthetic replies and virtual time. No credentials or live I/O.
apiVersion: id.registrystack.org/formats/coordinator/scenarios/v1alpha1
kind: CoordinatorScenarios
cases:
- id: notice-accepted-after-virtual-wait
  admittedAt: '2026-10-09T09:00:00Z'
  input:
    applicationId: 00000000-0000-4000-8000-000000000001
    sendAfter: '2026-10-09T09:16:00Z'
  replies:
    read-application:
    - type: success
      value:
        meta:
          registryIdentifier: applications-registry
          datasetIdentifier: applications
          recordTypeIdentifier: application
        data:
          recordIdentifier: 00000000-0000-4000-8000-000000000001
          revisionIdentifier: revision-1
          domainData:
            noticeAllowed: true
            email: person@example.invalid
    notify:
    - type: success
      value:
        id: 00000000-0000-4000-8000-000000000002
        status: queued
        links:
          self: /v1/messages/00000000-0000-4000-8000-000000000002
          cancel: /v1/messages/00000000-0000-4000-8000-000000000002/cancel
  expect:
    path:
    - due
    - read-application
    - permission
    - notify
    - accepted
    state: completed
    outcome:
      type: named
      value: message-accepted
    output:
      messageId: 00000000-0000-4000-8000-000000000002
    workflowElapsedSeconds: 960
