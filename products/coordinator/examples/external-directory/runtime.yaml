# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/runtime/runtime.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/runtime/v1alpha1
kind: CoordinatorRuntimeConfig
secretProviders:
  environment: {}
database:
  runtimeUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
  migrationUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
namespace: coordinator_directory
connections: {}
externalHttpConnections:
  directory:
    baseUrl: http://127.0.0.1:8102/directory
    paths: [offices]
    queryParameters: [district]
    # Public synthetic directory. Omitted authorization never borrows a token.
    # Attempt defaults: two seconds and at most 65536 response bytes.
    responseSchema:
      oneOf:
      - type: object
        additionalProperties: false
        required: [status, body]
        properties:
          status: {const: 200}
          body:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                maxItems: 256
                items:
                  type: object
                  additionalProperties: false
                  required: [id]
                  properties:
                    id: {type: string, minLength: 1, maxLength: 128}
      - type: object
        additionalProperties: false
        required: [status, body]
        properties:
          status: {enum: [404, 503]}
          body: {type: "null"}
