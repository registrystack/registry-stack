- id: unavailable-credential-does-not-submit
  admittedAt: '2026-10-10T09:00:00Z'
  input:
    applicationId: 00000000-0000-4000-8000-000000000001
    summary: The submitted application is missing proof of address.
  replies:
    assess:
    - type: retryable
      code: credential-unavailable
  expect:
    path:
    - assess
    state: retryable
    outcome:
      type: none
