# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/runtime/runtime.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/runtime/v1alpha1
kind: CoordinatorRuntimeConfig
# Offline check reads references, never their secret values.
secretProviders:
  environment: {}
  file:
    root: /run/registry-coordinator/secrets
database:
  runtimeUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
  migrationUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
namespace: coordinator_bounded_poll
connections:
  applications:
    product: breg
    baseUrl: http://127.0.0.1:8100
    profile: review-reader
    authorization:
      tokenEndpoint: http://127.0.0.1:8090/token
      clientId: application-reader
      signingKeyRef: secret:file/client-key
      resource: urn:example:applications
      scopes: [applications:read]
