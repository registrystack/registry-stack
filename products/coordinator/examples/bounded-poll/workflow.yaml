# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: bounded-poll
  version: "1"
input:
  type: object
  additionalProperties: false
  required: [applicationId, firstCheckAt]
  properties:
    applicationId: {type: string, format: uuid}
    firstCheckAt: {type: string, format: date-time}
connections:
  applications: breg
functionsFile: functions.rhai
deadlineSeconds: 604800
start: wait-1
# The graph is finite and acyclic, so the poll is unrolled: each round is a
# timed wait, a current read and a choice. After the last round the run
# finishes and the caller decides whether to start a new run later.
steps:
  wait-1:
    type: wait-until
    waitUntil: {type: input, path: /firstCheckAt}
    next: read-1
  read-1:
    type: call
    connection: applications
    operation: read-record
    input:
      type: fields
      fields:
        collection: {type: literal, value: applications}
        recordId: {type: input, path: /applicationId}
    next: check-1
  check-1:
    type: choose
    choose: {type: function, function: review_state, arguments: [{type: step, step: read-1}]}
    cases: {decided: decided-1, pending: wait-2}
  wait-2:
    type: wait-until
    waitUntil:
      type: function
      function: check_time
      arguments: [{type: input, path: /firstCheckAt}, {type: literal, value: 1}]
    next: read-2
  read-2:
    type: call
    connection: applications
    operation: read-record
    input:
      type: fields
      fields:
        collection: {type: literal, value: applications}
        recordId: {type: input, path: /applicationId}
    next: check-2
  check-2:
    type: choose
    choose: {type: function, function: review_state, arguments: [{type: step, step: read-2}]}
    cases: {decided: decided-2, pending: wait-3}
  wait-3:
    type: wait-until
    waitUntil:
      type: function
      function: check_time
      arguments: [{type: input, path: /firstCheckAt}, {type: literal, value: 2}]
    next: read-3
  read-3:
    type: call
    connection: applications
    operation: read-record
    input:
      type: fields
      fields:
        collection: {type: literal, value: applications}
        recordId: {type: input, path: /applicationId}
    next: check-3
  check-3:
    type: choose
    choose: {type: function, function: review_state, arguments: [{type: step, step: read-3}]}
    cases: {decided: decided-3, pending: still-pending}
  decided-1:
    type: finish
    outcome: decided
    output:
      type: fields
      fields:
        decision: {type: step, step: read-1, path: /data/domainData/reviewState}
  decided-2:
    type: finish
    outcome: decided
    output:
      type: fields
      fields:
        decision: {type: step, step: read-2, path: /data/domainData/reviewState}
  decided-3:
    type: finish
    outcome: decided
    output:
      type: fields
      fields:
        decision: {type: step, step: read-3, path: /data/domainData/reviewState}
  still-pending:
    type: finish
    outcome: still-pending
outcomes:
  decided:
    type: object
    additionalProperties: false
    required: [decision]
    properties:
      decision: {type: string, enum: [approved, rejected]}
  still-pending:
    type: "null"
