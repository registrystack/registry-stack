- id: decided-at-first-check
  admittedAt: '2026-10-09T09:00:00Z'
  input:
    applicationId: 00000000-0000-4000-8000-000000000001
    firstCheckAt: '2026-10-10T09:00:00Z'
  replies:
    read-1:
    - type: success
      value:
        meta:
          registryIdentifier: applications-registry
          datasetIdentifier: applications
          entityTypeIdentifier: application
        data:
          recordIdentifier: 00000000-0000-4000-8000-000000000001
          revisionIdentifier: revision-1
          domainData:
            reviewState: approved
  expect:
    path: [wait-1, read-1, check-1, decided-1]
    state: completed
    outcome: {type: named, value: decided}
    output:
      decision: approved
    workflowElapsedSeconds: 86400
