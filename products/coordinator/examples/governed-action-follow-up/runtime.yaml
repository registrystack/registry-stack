# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/runtime/runtime.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/runtime/v1alpha1
kind: CoordinatorRuntimeConfig
# Synthetic deployment references. Product policy must expose the read fields,
# request-information action and Messaging template; names grant no authority.
secretProviders:
  environment: {}
  file:
    root: /private/tmp/coordinator-secrets
database:
  runtimeUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
  migrationUrlRef: secret:env/COORDINATOR_TEST_DATABASE_URL
namespace: coordinator_actions
connections:
  applications:
    product: breg
    baseUrl: http://127.0.0.1:8100
    profile: workflow-actions
    authorization:
      tokenEndpoint: http://127.0.0.1:8090/token
      clientId: application-agent
      signingKeyRef: secret:file/client-key
      resource: urn:example:applications
      scopes: [applications:read, applications:act]
  notices:
    product: messaging
    baseUrl: http://127.0.0.1:8101
    authorization:
      tokenEndpoint: http://127.0.0.1:8090/token
      clientId: case-system
      signingKeyRef: secret:file/client-key
      resource: urn:example:messaging
      scopes: [messaging:send]
