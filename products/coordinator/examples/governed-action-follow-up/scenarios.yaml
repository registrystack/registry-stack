apiVersion: id.registrystack.org/formats/coordinator/scenarios/v1alpha1
kind: CoordinatorScenarios
cases:
- id: action-and-notice-accepted
  admittedAt: '2026-10-10T09:00:00Z'
  input: {applicationId: 00000000-0000-4000-8000-000000000001}
  replies:
    read-application:
    - type: success
      value: {data: {domainData: {complete: false, missingField: proof of address, email: person@example.invalid}}}
    request-information:
    - type: success
      value:
        action: request-information
        applicationId: 00000000-0000-4000-8000-000000000003
        results:
          application: {entity: applications, recordId: 00000000-0000-4000-8000-000000000001, revision: 2}
    notify:
    - type: success
      value: {id: 00000000-0000-4000-8000-000000000002, status: queued}
  expect:
    path: [read-application, needs-information, request-information, notify, accepted]
    state: completed
    outcome: {type: named, value: action-and-notice-accepted}
    output: {actionApplicationId: 00000000-0000-4000-8000-000000000003, messageId: 00000000-0000-4000-8000-000000000002}
