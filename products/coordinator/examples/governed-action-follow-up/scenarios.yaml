cases:
- id: action-and-notice-accepted
  admittedAt: '2026-10-10T09:00:00Z'
  input: {applicationId: 00000000-0000-4000-8000-000000000001}
  replies:
    read-application:
    - type: success
      value:
        meta: {registryIdentifier: applications-registry, datasetIdentifier: applications, entityTypeIdentifier: application}
        data: {recordIdentifier: 00000000-0000-4000-8000-000000000001, revisionIdentifier: revision-1, domainData: {complete: false, missingField: proof of address, email: person@example.invalid}}
    request-information:
    - type: success
      value:
        action: request-information
        applicationId: 00000000-0000-4000-8000-000000000003
        results:
          application: {recordType: application, recordId: 00000000-0000-4000-8000-000000000001, revision: 2}
    notify:
    - type: success
      value:
        id: 00000000-0000-4000-8000-000000000002
        status: queued
        links: {self: /v1/messages/00000000-0000-4000-8000-000000000002, cancel: /v1/messages/00000000-0000-4000-8000-000000000002/cancel}
  expect:
    path: [read-application, needs-information, request-information, notify, accepted]
    state: completed
    outcome: {type: named, value: action-and-notice-accepted}
    output: {actionApplicationId: 00000000-0000-4000-8000-000000000003, messageId: 00000000-0000-4000-8000-000000000002}
