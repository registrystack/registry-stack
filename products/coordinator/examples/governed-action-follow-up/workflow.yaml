# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/project/project.v1alpha1.schema.json
apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: governed-action-follow-up
  version: "1"
input:
  type: object
  additionalProperties: false
  required: [applicationId]
  properties:
    applicationId: {type: string, format: uuid}
connections:
  applications: breg
  notices: messaging
functionsFile: functions.rhai
deadlineSeconds: 300
start: read-application
steps:
  read-application:
    type: call
    connection: applications
    operation: read-record
    input:
      type: fields
      fields:
        collection: {type: literal, value: applications}
        recordId: {type: input, path: /applicationId}
    next: needs-information
  needs-information:
    type: choose
    choose: {type: function, function: information_route, arguments: [{type: step, step: read-application}]}
    cases: {request: request-information, skip: skipped}
  request-information:
    type: call
    connection: applications
    operation: invoke-breg-action
    input: {type: function, function: action_request, arguments: [{type: input}, {type: step, step: read-application}]}
    next: notify
    onDeclaredRefusal: action-refused
  notify:
    type: call
    connection: notices
    operation: submit-message
    input: {type: function, function: notice_request, arguments: [{type: step, step: read-application}, {type: step, step: request-information}]}
    next: accepted
  accepted:
    type: finish
    outcome: action-and-notice-accepted
    output:
      type: fields
      fields:
        actionApplicationId: {type: step, step: request-information, path: /applicationId}
        messageId: {type: step, step: notify, path: /id}
  skipped:
    type: finish
    outcome: no-information-request-needed
  action-refused:
    type: finish
    outcome: information-request-refused
    output:
      type: fields
      fields:
        refusalCode: {type: step, step: request-information, path: /refusalCode}
outcomes:
  action-and-notice-accepted:
    type: object
    additionalProperties: false
    required: [actionApplicationId, messageId]
    properties:
      actionApplicationId: {type: string, format: uuid}
      messageId: {type: string, format: uuid}
  no-information-request-needed: {type: "null"}
  information-request-refused:
    type: object
    additionalProperties: false
    required: [refusalCode]
    properties:
      refusalCode: {type: string, minLength: 1, maxLength: 128}
