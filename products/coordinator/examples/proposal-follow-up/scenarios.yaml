  input:
    correction:
      input:
        facilityId: 00000000-0000-4000-8000-000000000001
        addressLine: 12 Example Road
        city: Example City
        postalCode: '10000'
    notice:
      senderProfile: notices
      to:
        email: person@example.invalid
      template:
        id: address-updated
        version: '1'
      locale: en
      data:
        facility: Synthetic clinic
  replies:
    start-draft:
    - type: success
      value:
        proposal:
          id: 00000000-0000-4000-8000-000000000001
          actionId: correct-address
          actionRevision: sha256:1e2b7f1e425c009616e0ffd8123583f9a8c3f95ebb8a001679dd96c7521c6120
          submissionVersion: 1
          revision: 1
          state: draft
          links: {}
    submit:
    - type: success
      value:
        id: 00000000-0000-4000-8000-000000000001
        actionId: correct-address
        actionRevision: sha256:1e2b7f1e425c009616e0ffd8123583f9a8c3f95ebb8a001679dd96c7521c6120
        submissionVersion: 1
        revision: 2
        state: submitted
        links: {}
        effectDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    notify:
    - type: success
      value:
        id: 00000000-0000-4000-8000-000000000002
        status: queued
        links:
          self: /v1/messages/00000000-0000-4000-8000-000000000002
          cancel: /v1/messages/00000000-0000-4000-8000-000000000002/cancel
  waits:
    await-application:
      type: event
      value:
        outcome: applied
        proposal:
          id: 00000000-0000-4000-8000-000000000001
          actionId: correct-address
          actionRevision: sha256:1e2b7f1e425c009616e0ffd8123583f9a8c3f95ebb8a001679dd96c7521c6120
          submissionVersion: 1
          revision: 3
          state: applied
          links: {}
          effectDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          application:
            applicationId: 00000000-0000-4000-8000-000000000002
            submissionVersion: 1
            effectDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            resultLinks:
            - recordType: facility
              recordId: 00000000-0000-4000-8000-000000000001
              revision: 2
  expect:
    path:
    - start-draft
    - submit
    - await-application
    - application-outcome
    - notify
    - report-accepted
    state: completed
    outcome:
      type: named
      value: message-accepted
    output:
      id: 00000000-0000-4000-8000-000000000002
      status: queued
      links:
        self: /v1/messages/00000000-0000-4000-8000-000000000002
        cancel: /v1/messages/00000000-0000-4000-8000-000000000002/cancel
