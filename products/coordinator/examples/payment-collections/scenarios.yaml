# yaml-language-server: $schema=https://id.registrystack.org/schemas/coordinator/scenarios/scenarios.v1alpha1.schema.json
# Synthetic replies exercise the compiled model. HTTP authority and durability are tested separately.
apiVersion: id.registrystack.org/formats/coordinator/scenarios/v1alpha1
kind: CoordinatorScenarios
cases:
- id: confirmed-collection-records-receipt
  admittedAt: '2026-11-12T00:00:00Z'
  input:
    billId: 00000000-0000-4000-8000-000000000101
    billVersion: 1
  replies:
    request-collection:
    - type: success
      value:
        collectionId: 00000000-0000-4000-8000-000000000201
        billId: 00000000-0000-4000-8000-000000000101
        billVersion: 1
        bindingRevision: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        simulation: true
    record-receipt:
    - type: success
      value:
        collectionId: 00000000-0000-4000-8000-000000000201
        billId: 00000000-0000-4000-8000-000000000101
        billVersion: 1
        bindingRevision: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        simulation: true
        money: {value: '25.00', currency: USD, scale: 2}
        providerReference: SIM-PAID-001
        receiptId: payment-00000000-0000-4000-8000-000000000201
  waits:
    await-collection:
      type: event
      value:
        collectionId: 00000000-0000-4000-8000-000000000201
        billId: 00000000-0000-4000-8000-000000000101
        billVersion: 1
        bindingRevision: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        simulation: true
        state: confirmed
        money: {value: '25.00', currency: USD, scale: 2}
        providerReference: SIM-PAID-001
  expect:
    path: [request-collection, await-collection, route-collection, record-receipt, receipt-recorded]
    state: completed
    outcome: {type: named, value: receipt-recorded}
    output:
      collectionId: 00000000-0000-4000-8000-000000000201
      billId: 00000000-0000-4000-8000-000000000101
      billVersion: 1
      bindingRevision: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      simulation: true
      money: {value: '25.00', currency: USD, scale: 2}
      providerReference: SIM-PAID-001
      receiptId: payment-00000000-0000-4000-8000-000000000201
