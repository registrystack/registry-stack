name: RegistryStack Release Repeatability

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published vMAJOR.MINOR.PATCH tag; newest release when omitted
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-repeatability
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRANE_VERSION: v0.21.2
  CRANE_LINUX_AMD64_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
  RELEASE_BUILDX_VERSION: v0.33.0
  RELEASE_BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

jobs:
  rebuild:
    name: Clean rebuild of published release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout protected repeatability tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve exact published tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="$(
              gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
                --exclude-drafts --json tagName \
                --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]'
            )"
          fi
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be an exact published vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          if (( BASH_REMATCH[1] == 0 && BASH_REMATCH[2] < 19 )); then
            echo "pre-v0.19 releases are immutable historical evidence; use the corresponding ${tag} Git tag and archived assets" >&2
            exit 1
          fi
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,tagName \
            | jq -e --arg tag "${tag}" \
                'select(.isDraft == false and .tagName == $tag)' >/dev/null
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify tag source and download published subjects
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          source_sha="$(git -C source rev-parse --verify "refs/tags/${TAG}^{}")"
          test "$(git -C source rev-parse HEAD)" = "${source_sha}"
          git -C source merge-base --is-ancestor \
            "${source_sha}" refs/remotes/origin/main
          mkdir -p published
          release_manifest="registry-stack-${TAG}-release-manifest.json"
          release_assets="$(
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name'
          )"
          image_metadata=""
          image_metadata_kind=""
          if grep -Fqx -- "${release_manifest}" <<<"${release_assets}"; then
            image_metadata="${release_manifest}"
            image_metadata_kind="release-manifest"
          else
            echo "${TAG} requires release asset ${release_manifest}" >&2
            exit 1
          fi
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir published \
            --pattern SHA256SUMS \
            --pattern "*-${TAG}-linux-amd64" \
            --pattern "${image_metadata}"
          test -s "published/${image_metadata}"
          (
            cd published
            sha256sum --check --strict --ignore-missing SHA256SUMS
          )
          {
            echo "source_sha=${source_sha}"
            echo "image_metadata=published/${image_metadata}"
            echo "image_metadata_kind=${image_metadata_kind}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build canonical Linux payload from clean state
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${RUNNER_TEMP}/repeatability-cargo-home"
          target_dir="${RUNNER_TEMP}/repeatability-target"
          test ! -e "${cargo_home}"
          test ! -e "${target_dir}"
          mkdir -p "${cargo_home}" "${target_dir}"
          RELEASE_CARGO_HOME="${cargo_home}" \
            RELEASE_TARGET_DIR="${target_dir}" \
            source/release/scripts/build-release-binaries.sh "${VERSION}"

      - name: Compare published binary hashes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          mapfile -t expected < <(
            python3 - "source" "${TAG}" <<'PY'
          import glob
          import sys

          import yaml

          root, tag = sys.argv[1:]
          version = tag.removeprefix("v")
          matches = []
          for path in glob.glob(f"{root}/release/manifests/registry-stack-*.yaml"):
              with open(path, encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              if str(data.get("stack", {}).get("version", "")) == version:
                  matches.append(data)
          if len(matches) != 1:
              raise SystemExit(f"expected one release manifest for {version}")
          artifacts = matches[0].get("artifacts", {})
          binary_names = {
              "discovery": "discovery",
              "evidence": "evidence",
              "evidencectl": "evidencectl",
              "evidence-oid4vci": "evidence-oid4vci",
              "mint": "mint",
              "registry-manifest": "registry-manifest",
              "registry-manifest-cli": "registry-manifest",
              "breg": "breg",
              "bregctl": "bregctl",
              "relay": "relay",
              "relayctl": "relayctl",
          }
          for artifact, asset in sorted(binary_names.items()):
              if artifact in artifacts:
                  print(f"{asset}-{tag}-linux-amd64")
          PY
          )
          for asset in "${expected[@]}"; do
            test -s "published/${asset}"
            cmp "published/${asset}" "source/dist/bin/${asset}"
          done
          (
            cd source/dist/bin
            sha256sum -- "${expected[@]}"
          ) | sort > proof/rebuilt-linux-amd64.sha256

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.RELEASE_BUILDX_VERSION }}
          driver-opts: image=${{ env.RELEASE_BUILDKIT_IMAGE }}

      - name: Install pinned image inspector
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${archive}"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${archive}" \
            | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" crane
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Compare published image config and layers
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          IMAGE_METADATA: ${{ steps.source.outputs.image_metadata }}
          IMAGE_METADATA_KIND: ${{ steps.source.outputs.image_metadata_kind }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/image-layouts
          image_rows="${RUNNER_TEMP}/repeatability-images.tsv"
          case "${IMAGE_METADATA_KIND}" in
            release-manifest)
              jq -er '.images[] | [.name,.final_ref,.digest] | @tsv' \
                "${IMAGE_METADATA}" > "${image_rows}"
              ;;
            *)
              echo "unsupported repeatability image metadata kind: ${IMAGE_METADATA_KIND}" >&2
              exit 1
              ;;
          esac
          test -s "${image_rows}"
          while IFS=$'\t' read -r name published_ref index_digest; do
            test -n "${name}"
            test -n "${published_ref}"
            [[ "${index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            published_layout="proof/image-layouts/${name}-published"
            rebuilt_layout="${GITHUB_WORKSPACE}/proof/image-layouts/${name}-rebuilt"
            test "$(crane digest "${published_ref}")" = "${index_digest}"
            crane pull "${published_ref}" "${published_layout}" --format=oci
            index_blob="${published_layout}/blobs/sha256/${index_digest#sha256:}"
            test -f "${index_blob}"
            test "sha256:$(sha256sum "${index_blob}" | awk '{print $1}')" = \
              "${index_digest}"
            cp "${index_blob}" "${published_layout}/index.json"
            RELEASE_BUILDX_BUILDER="${BUILDER_NAME}" \
              RELEASE_IMAGE_CONTEXT="${GITHUB_WORKSPACE}/source" \
              RELEASE_IMAGE_NO_CACHE=true \
              RELEASE_IMAGE_OCI_LAYOUT="${rebuilt_layout}" \
              source/release/scripts/build-release-image.sh \
                "${name}" \
                "ghcr.io/registrystack/${name}:${TAG}" \
                "https://github.com/${GITHUB_REPOSITORY}" \
                "${SOURCE_SHA}" \
                "${VERSION}" \
                "${GITHUB_WORKSPACE}/proof/image-layouts/${name}.metadata.json"
            python3 verifier/release/scripts/compare-release-image-layouts.py \
              "${published_layout}" "${rebuilt_layout}"
          done < "${image_rows}"

      - name: Record successful 30-day proof
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tag "${TAG}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schema_version: "registry-stack.release-repeatability-result.v2",
              repository: $repository,
              tag: $tag,
              source_sha: $source_sha,
              result: "passed",
              scope: {
                linux_amd64_binaries: "byte-identical",
                images: "config-and-ordered-rootfs-layers-identical",
                other_platforms: "not-tested"
              },
              completed_at: $completed_at,
              silver_claim_valid_through:
                (($completed_at | fromdateiso8601) + (30 * 24 * 60 * 60) | todateiso8601),
              run_url: $run_url
            }' > proof/release-repeatability-result.json

      - name: Upload 30-day repeatability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-repeatability-${{ steps.release.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof/rebuilt-linux-amd64.sha256
            proof/release-repeatability-result.json
          if-no-files-found: error
          retention-days: 30
