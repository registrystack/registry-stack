name: Nightly Security

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed security surfaces
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.classify.outputs.run }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Restore last successful nightly state
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .nightly-security-state
          key: nightly-security-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nightly-security-state-

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          run=false

          changed_files="${RUNNER_TEMP}/registry-stack-nightly-security-files"
          : > "${changed_files}"

          is_relevant_path() {
            local path="$1"
            case "${path}" in
              .github/workflows/*|.github/dependabot.yml)
                return 0
                ;;
              Cargo.toml|Cargo.lock|deny.toml|rust-toolchain*)
                return 0
                ;;
              crates/registry-platform-authcommon/*|crates/registry-platform-crypto/*)
                return 0
                ;;
              crates/registry-platform-sdjwt/*)
                return 0
                ;;
              crates/registry-manifest-core/*|crates/registry-manifest-cli/*)
                return 0
                ;;
              products/platform/*|products/manifest/*|release/docker/*)
                return 0
                ;;
              docker/*|.dockerignore)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run=true
          elif [[ ! -f .nightly-security-state/last-success-sha ]]; then
            run=true
          else
            base_sha="$(tr -d '[:space:]' < .nightly-security-state/last-success-sha)"
            if [[ -z "${base_sha}" ]] ||
               ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              run=true
            elif [[ "${base_sha}" != "${head_sha}" ]]; then
              git diff --name-only -z "${base_sha}" "${head_sha}" > "${changed_files}"
              while IFS= read -r -d '' path; do
                if is_relevant_path "${path}"; then
                  run=true
                  break
                fi
              done < "${changed_files}"
            fi
          fi

          {
            echo "run=${run}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

  assurance:
    name: Security assurance manifests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false

      - name: Release and adopter image Dockerfile checks
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          secret_copy_re = re.compile(
              r"\b(?:COPY|ADD)\b(?=.*(?:\.env|\.pem|\.key|\.p12|jwk|secret|credential))|\"d\"\s*:",
              re.IGNORECASE,
          )
          # The adopter image is scanned beside the release ones: it is built from
          # the same tree by anyone following the local-run docs, so baking key or
          # credential material into it would leak just as widely.
          release_paths = [
              Path("release/docker/Dockerfile.evidence"),
              Path("release/docker/Dockerfile.mint"),
              Path("release/docker/Dockerfile.relay"),
          ]
          missing = [str(path) for path in release_paths if not path.is_file()]
          if missing:
              print(
                  f"security assurance check failed: missing release Dockerfiles: {missing}",
                  file=sys.stderr,
              )
              sys.exit(1)
          paths = release_paths + sorted(Path("docker").glob("Dockerfile"))
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if secret_copy_re.search(line):
                      print(
                          f"security assurance check failed: {path}:{lineno} may copy secret or private JWK material",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          PY

  platform-fuzz:
    name: Platform fuzz smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      - name: Run parser and credential fuzz smoke
        working-directory: products/platform
        run: |
          set -euo pipefail
          for target in \
            authcommon_parsers \
            sdjwt_holder_proof \
            sdjwt_issuance
          do
            mkdir -p "fuzz/artifacts/${target}"
            cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "${target}" -- \
              -max_total_time=60 \
              -rss_limit_mb=1024 \
              -artifact_prefix="fuzz/artifacts/${target}/" \
              -print_final_stats=1
          done

      - name: Upload platform fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-platform-fuzz-artifacts
          path: products/platform/fuzz/artifacts
          if-no-files-found: ignore

  manifest-fuzz:
    name: Manifest fuzz smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      - name: Run manifest fuzz smoke
        working-directory: products/manifest
        run: |
          set -euo pipefail
          for target in \
            metadata_manifest_yaml \
            rendered_artifact_json
          do
            mkdir -p "fuzz/artifacts/${target}"
            cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "${target}" -- \
              -max_total_time=60 \
              -rss_limit_mb=1024 \
              -artifact_prefix="fuzz/artifacts/${target}/" \
              -print_final_stats=1
          done

      - name: Upload manifest fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-manifest-fuzz-artifacts
          path: products/manifest/fuzz/artifacts
          if-no-files-found: ignore

  save-state:
    name: Save successful nightly state
    needs:
      - changes
      - assurance
      - platform-fuzz
      - manifest-fuzz
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Write successful head
        run: |
          mkdir -p .nightly-security-state
          printf '%s\n' "${{ needs.changes.outputs.head_sha }}" > .nightly-security-state/last-success-sha

      - name: Save last successful nightly state
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .nightly-security-state
          key: nightly-security-state-${{ github.run_id }}-${{ github.run_attempt }}
