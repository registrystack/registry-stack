name: Nightly Security

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_TERM_COLOR: always

jobs:
  assurance:
    name: Security assurance manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Release and adopter image Dockerfile checks
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          secret_copy_re = re.compile(
              r"\b(?:COPY|ADD)\b(?=.*(?:\.env|\.pem|\.key|\.p12|jwk|secret|credential))|\"d\"\s*:",
              re.IGNORECASE,
          )
          # The adopter image is scanned beside the release ones: it is built from
          # the same tree by anyone following the local-run docs, so baking key or
          # credential material into it would leak just as widely.
          # Scan every release Dockerfile so a newly onboarded image cannot omit
          # the secret-copy check. The Debian image policy separately fails on
          # any Dockerfile not added to its maintained roster.
          release_paths = sorted(Path("release/docker").glob("Dockerfile.*"))
          if not release_paths:
              print(
                  "security assurance check failed: no release Dockerfiles found",
                  file=sys.stderr,
              )
              sys.exit(1)
          paths = release_paths + sorted(Path("docker").glob("Dockerfile"))
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if secret_copy_re.search(line):
                      print(
                          f"security assurance check failed: {path}:{lineno} may copy secret or private JWK material",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          PY

  platform-fuzz:
    name: Platform fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      - name: Run parser and credential fuzz smoke
        working-directory: products/platform
        run: |
          set -euo pipefail
          for target in \
            authcommon_parsers \
            sdjwt_holder_proof \
            sdjwt_issuance \
            sqlite_statement
          do
            mkdir -p "fuzz/artifacts/${target}"
            cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "${target}" -- \
              -max_total_time=60 \
              -rss_limit_mb=1024 \
              -artifact_prefix="fuzz/artifacts/${target}/" \
              -print_final_stats=1
          done

      - name: Upload platform fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-platform-fuzz-artifacts
          path: products/platform/fuzz/artifacts
          if-no-files-found: ignore

  manifest-fuzz:
    name: Manifest fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      - name: Run manifest fuzz smoke
        working-directory: products/manifest
        run: |
          set -euo pipefail
          for target in \
            metadata_manifest_yaml \
            rendered_artifact_json
          do
            mkdir -p "fuzz/artifacts/${target}"
            cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "${target}" -- \
              -max_total_time=60 \
              -rss_limit_mb=1024 \
              -artifact_prefix="fuzz/artifacts/${target}/" \
              -print_final_stats=1
          done

      - name: Upload manifest fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-manifest-fuzz-artifacts
          path: products/manifest/fuzz/artifacts
          if-no-files-found: ignore
