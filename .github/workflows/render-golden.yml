name: Registry Render golden gate

# The Render byte-stability gate: the three coequal example bundles must
# produce the exact golden hashes pinned in products/render/golden.json on
# BOTH operating systems. Any difference in the Typst pin, the lockfile
# (including the deflate stack, whose upgrades change compressed bytes and
# are reviewed like a Typst pin change), the bundle content or the
# platform-dependent layout fails here and must be reviewed, never
# silenced. Invariant: cross-machine byte stability as promised by the
# product. Owner: the Render product. Removal condition: only if the
# Render product contract deliberately narrows the byte-stability promise
# to same-machine reproducibility.

on:
  pull_request:
    paths:
      - "crates/registry-render/**"
      # The platform crates render links against: a change there can move
      # bytes without touching any path above (path deps do not surface in
      # Cargo.lock), so the cross-OS proof must run for them too.
      - "crates/registry-platform-audit/**"
      - "crates/registry-platform-authcommon/**"
      - "crates/registry-platform-buildinfo/**"
      - "crates/registry-platform-canonical-json/**"
      - "crates/registry-platform-config/**"
      - "crates/registry-platform-crypto/**"
      - "crates/registry-platform-httpsec/**"
      - "crates/registry-platform-testing/**"
      - "crates/registry-platform-yaml/**"
      - "products/render/**"
      - "docs/site/public/examples/population-extract/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/render-golden.yml"
  # GitHub offers no paths filter for merge_group, so a merge queue run is
  # never skipped here.
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    # Keep this list equal to the pull_request paths above.
    paths:
      - "crates/registry-render/**"
      - "crates/registry-platform-audit/**"
      - "crates/registry-platform-authcommon/**"
      - "crates/registry-platform-buildinfo/**"
      - "crates/registry-platform-canonical-json/**"
      - "crates/registry-platform-config/**"
      - "crates/registry-platform-crypto/**"
      - "crates/registry-platform-httpsec/**"
      - "crates/registry-platform-testing/**"
      - "crates/registry-platform-yaml/**"
      - "products/render/**"
      - "docs/site/public/examples/population-extract/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/render-golden.yml"

concurrency:
  group: render-golden-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  golden:
    name: Golden hashes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both OSes must report independently: one failing must not cancel
      # the other's signal.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Go for the AWS-LC-FIPS source build
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.2
          cache: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          key: render-golden-go-1.27.2-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Golden and determinism tests
        run: cargo test --locked -p registry-render --test golden

      - name: Serve end-to-end tests
        run: cargo test --locked -p registry-render --test serve

      - name: Scaffold and CLI tests
        run: cargo test --locked -p registry-render --test scaffold --test test_seal

      - name: Set up Node for the specimen issuer
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.0

      - name: Set up uv for the independent QR reader
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.16"

      - name: Issue, scan and look up a test-signed extract
        if: runner.os == 'Linux'
        working-directory: products/render/examples/specimen-verification
        env:
          REGISTRY_RENDER_BIN: ${{ github.workspace }}/target/debug/registry-render
        run: |
          node --test issue.test.mjs serve.test.mjs
          uv run --python 3.13 --script test_scan.py
