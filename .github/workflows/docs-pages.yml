name: Deploy RegistryStack Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      released_tag:
        description: Optional exact public docs-bearing release tag
        required: false
        type: string
      docs_sha256:
        description: Optional SHA-256 of that released documentation archive
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Authenticate and assemble docs site
    runs-on: ubuntu-24.04
    outputs:
      released_tag: ${{ steps.release.outputs.released_tag }}
      docs_sha256: ${{ steps.release.outputs.docs_sha256 }}
    permissions:
      contents: read
    steps:
      - name: Validate deployment request before build
        env:
          REQUESTED_TAG: ${{ inputs.released_tag }}
          REQUESTED_DOCS_SHA256: ${{ inputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch) ;;
            *) echo "unsupported deployment event ${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          if [[ -n "${REQUESTED_TAG}" && -z "${REQUESTED_DOCS_SHA256}" ]] || \
             [[ -z "${REQUESTED_TAG}" && -n "${REQUESTED_DOCS_SHA256}" ]]; then
            echo "released_tag and docs_sha256 must be supplied together" >&2
            exit 1
          fi
          if [[ -n "${REQUESTED_TAG}" && ! "${REQUESTED_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "released_tag must be canonical v<major>.<minor>.<patch> text" >&2
            exit 1
          fi
          if [[ -n "${REQUESTED_DOCS_SHA256}" && ! "${REQUESTED_DOCS_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "docs_sha256 must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi

      - name: Checkout protected main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Resolve latest published docs release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.released_tag }}
          REQUESTED_DOCS_SHA256: ${{ inputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'add' > "${RUNNER_TEMP}/published-releases.json"
          resolver=(
            python3 release/scripts/verify_latest_published_release.py
            --metadata "${RUNNER_TEMP}/published-releases.json"
          )
          if [[ -n "${REQUESTED_TAG}" ]]; then
            resolver+=(
              --expected-tag "${REQUESTED_TAG}"
              --expected-sha256 "${REQUESTED_DOCS_SHA256}"
            )
          fi
          "${resolver[@]}" > "${RUNNER_TEMP}/resolved-docs-release.json"
          {
            echo "released_tag=$(jq -er .tag_name "${RUNNER_TEMP}/resolved-docs-release.json")"
            echo "docs_sha256=$(jq -er .docs_sha256 "${RUNNER_TEMP}/resolved-docs-release.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate public release and checksum inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
          DOCS_SHA256: ${{ steps.release.outputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          archive="registry-docs-${RELEASED_TAG}.tar.gz"
          checksum_bundle="registry-stack-${RELEASED_TAG}-SHA256SUMS.sigstore.json"
          release_dir="${RUNNER_TEMP}/released-docs"
          mkdir "${release_dir}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASED_TAG}" \
            > "${release_dir}/release.json"
          jq -e \
            --arg tag "${RELEASED_TAG}" \
            '.tag_name==$tag and .draft==false and .prerelease==false' \
            "${release_dir}/release.json" >/dev/null
          for name in "${archive}" SHA256SUMS "${checksum_bundle}"; do
            test "$(jq -r --arg name "${name}" \
              '[.assets[] | select(.name==$name)] | length' \
              "${release_dir}/release.json")" = 1
          done

          gh release download "${RELEASED_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${release_dir}" \
            --pattern "${archive}" \
            --pattern "SHA256SUMS" \
            --pattern "${checksum_bundle}"

          actual="$(sha256sum "${release_dir}/${archive}" | awk '{print $1}')"
          test "${actual}" = "${DOCS_SHA256}"
          test "$(jq -er --arg name "${archive}" \
            '.assets[] | select(.name==$name) | .digest' \
            "${release_dir}/release.json")" = "sha256:${DOCS_SHA256}"
          checksum="$(
            awk -v name="${archive}" '$2 == name {print $1}' \
              "${release_dir}/SHA256SUMS"
          )"
          test "${checksum}" = "${DOCS_SHA256}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify tag-bound checksum signature
        env:
          RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/released-docs"
          cosign verify-blob "${release_dir}/SHA256SUMS" \
            --bundle \
              "${release_dir}/registry-stack-${RELEASED_TAG}-SHA256SUMS.sigstore.json" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build protected main at /dev/
        working-directory: docs/site
        run: npm run build:dev
        env:
          DOCS_RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_UMAMI_SCRIPT_SRC: ${{ vars.PUBLIC_UMAMI_SCRIPT_SRC }}
          PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS }}

      - name: Assemble declared historical archives
        working-directory: docs/site
        env:
          RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
          DOCS_RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
        run: |
          set -euo pipefail
          npm run assemble:archives -- \
            --exclude-docset "${RELEASED_TAG}"

      - name: Promote exact released docs without rewriting archive files
        working-directory: docs/site
        env:
          RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
          DOCS_SHA256: ${{ steps.release.outputs.docs_sha256 }}
          RELEASED_ARCHIVE: ${{ runner.temp }}/released-docs/registry-docs-${{ steps.release.outputs.released_tag }}.tar.gz
        run: |
          set -euo pipefail
          npm run stage:production-docsets -- \
            --released-tag "${RELEASED_TAG}" \
            --docs-sha256 "${DOCS_SHA256}" \
            --bundle "${RELEASED_ARCHIVE}"

      - name: Verify current machine-readable documentation
        working-directory: docs/site
        run: npm run check:llms:built
        env:
          DOCS_DIST_DIR: ${{ github.workspace }}/docs/site/dist/dev
          DOCS_PUBLIC_BASE: /dev/

      - name: Verify assembled documentation tree
        working-directory: docs/site
        env:
          DOCS_RELEASED_TAG: ${{ steps.release.outputs.released_tag }}
        run: |
          npm run check:seo:built
          npm run check:links:built

      - name: Smoke assembled route and discovery tree
        working-directory: docs/site
        run: |
          npm run smoke:deployment -- \
            --root dist \
            --released-tag "${{ steps.release.outputs.released_tag }}"

      - name: Upload one Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site/dist

  deploy:
    name: Deploy and smoke canonical docs
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment helpers from protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            docs/site/scripts/smoke-docs-deployment.mjs
            release/scripts/verify_latest_published_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Recheck latest published docs release immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_TAG: ${{ needs.build.outputs.released_tag }}
          DOCS_SHA256: ${{ needs.build.outputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'add' > "${RUNNER_TEMP}/published-releases.json"
          python3 release/scripts/verify_latest_published_release.py \
            --metadata "${RUNNER_TEMP}/published-releases.json" \
            --expected-tag "${RELEASED_TAG}" \
            --expected-sha256 "${DOCS_SHA256}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          # State the action's maximum explicitly. A deployment that remains
          # queued for ten minutes is a provider-side failure and is retried
          # by relaunching this authenticated workflow.
          timeout: 600000

      - name: Smoke live canonical deployment
        working-directory: docs/site
        run: |
          node scripts/smoke-docs-deployment.mjs \
            --url https://docs.registrystack.org \
            --released-tag "${{ needs.build.outputs.released_tag }}" \
            --attempts 12
