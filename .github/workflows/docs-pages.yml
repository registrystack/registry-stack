name: Deploy RegistryStack Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/site/**"
      - "crates/registryctl/assets/project-starters/**"
      - "crates/registryctl/schemas/project-authoring/**"
      - "crates/registryctl/schemas/project-documentation/**"
      - "crates/registryctl/schemas/project-reports/**"
      - "crates/registryctl/src/lib.rs"
      - "crates/registryctl/src/main.rs"
      - "crates/registryctl/src/project_authoring/capability_inventory.rs"
      - "crates/registryctl/src/project_authoring/compiler/relay.rs"
      - "crates/registryctl/src/project_authoring/diagnostic_reference.rs"
      - "crates/registryctl/src/project_authoring/diagnostics.rs"
      - "crates/registryctl/src/project_authoring/documentation.rs"
      - "crates/registryctl/src/project_authoring/fixture_diagnostics.rs"
      - "crates/registryctl/src/project_authoring/fixture_coverage.rs"
      - "crates/registryctl/src/project_authoring/knowledge.rs"
      - "crates/registryctl/src/project_authoring/migration.rs"
      - "crates/registryctl/src/project_authoring/output.rs"
      - "crates/registryctl/src/project_authoring/preflight.rs"
      - "crates/registryctl/src/project_authoring/promotion.rs"
      - "crates/registryctl/src/project_authoring/report_contract.rs"
      - "crates/registryctl/src/project_authoring/semantic_comparison.rs"
      - "crates/registryctl/src/sample.rs"
      - "crates/registryctl/src/templates/**"
      - "crates/registryctl/tests/fixtures/project-authoring-journeys.yaml"
      - "crates/registryctl/tests/fixtures/project-authoring/**"
      - "crates/registryctl/tests/fixtures/project-reports/**"
      - "crates/registryctl/tests/init_output.rs"
      - "crates/registryctl/tests/project_authoring.rs"
      - "crates/registry-relay/docs/**"
      - "crates/registry-relay/openapi/**"
      - "crates/registry-relay/config/documentation-intent.json"
      - "crates/registry-relay/src/api/openapi.rs"
      - "crates/registry-relay/src/consultation/**"
      - "crates/registry-relay/src/config/**"
      - "crates/registry-relay/src/main.rs"
      - "crates/registry-relay/src/process_startup.rs"
      - "crates/registry-relay/src/server.rs"
      - "crates/registry-relay/tests/api_docs.rs"
      - "crates/registry-notary-core/config/documentation-intent.json"
      - "crates/registry-notary-core/src/config.rs"
      - "crates/registry-notary-core/src/config/**"
      - "crates/registry-notary-core/src/deployment.rs"
      - "crates/registry-notary-server/src/standalone/activation.rs"
      - "crates/registry-platform-ops/src/lib.rs"
      - "products/notary/docs/**"
      - "products/notary/openapi/**"
      - "products/manifest/docs/**"
      - "schemas/registry-relay.config.schema.json"
      - "schemas/registry-notary.config.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Check standard journey generation
        working-directory: docs/site
        run: node scripts/generate-standard-journeys.mjs --check

      - name: Build Main-source preview
        working-directory: docs/site
        run: |
          npm run generate
          DOCS_DOCSET=latest DOCS_BASE=/preview/ npx astro check
          DOCS_DOCSET=latest DOCS_BASE=/preview/ npx astro build --outDir dist/preview
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_UMAMI_SCRIPT_SRC: ${{ vars.PUBLIC_UMAMI_SCRIPT_SRC }}
          PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS }}

      - name: Prepare Main-source preview mount
        working-directory: docs/site
        run: npm run prepare:unreleased-preview

      - name: Verify Main-source preview
        working-directory: docs/site
        run: |
          DOCS_DIST_DIR="${GITHUB_WORKSPACE}/docs/site/dist/preview" npm run check:accessibility:built
          DOCS_DIST_DIR="${GITHUB_WORKSPACE}/docs/site/dist/preview" DOCS_PUBLIC_BASE=/preview/ npm run check:llms:built
          DOCS_DIST_DIR="${GITHUB_WORKSPACE}/docs/site/dist" npm run check:seo:current
          DOCS_DIST_DIR="${GITHUB_WORKSPACE}/docs/site/dist" npm run check:links:current

      - name: Package deterministic unreleased preview evidence
        working-directory: docs/site
        run: npm run package:unreleased-preview
        env:
          DOCS_BUILD_COMMIT: ${{ github.sha }}
          DOCS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload unreleased preview evidence
        id: preview-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-docs-unreleased-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/site/preview-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Record unreleased preview evidence
        shell: bash
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.preview-evidence.outputs.artifact-id }}
          PREVIEW_ARTIFACT_URL: ${{ steps.preview-evidence.outputs.artifact-url }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.preview-evidence.outputs.artifact-digest }}
        run: |
          {
            echo "### Unreleased documentation preview"
            echo
            echo "- Release coordinate: unassigned"
            echo "- Artifact ID: \`${PREVIEW_ARTIFACT_ID}\`"
            echo "- Artifact URL: ${PREVIEW_ARTIFACT_URL}"
            echo "- Artifact digest: \`${PREVIEW_ARTIFACT_DIGEST}\`"
            echo "- Evidence class: unreleased preview, not release evidence and not human-acceptance evidence"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Assemble immutable archived docs
        working-directory: docs/site
        run: npm run assemble:archives -- --bootstrap

      - name: Stage released-root routing
        working-directory: docs/site
        run: npm run stage:production-docsets

      - name: Assert sealed production Pages directory
        working-directory: docs/site
        run: |
          test -d dist-production
          test -f dist-production/index.html

      - name: Verify assembled documentation tree
        working-directory: docs/site
        run: |
          npm run check:seo:built
          npm run check:links:built
        env:
          DOCS_DIST_DIR: ${{ github.workspace }}/docs/site/dist-production

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site/dist-production

  deploy:
    name: Deploy docs site
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
