name: Deploy RegistryStack Docs

on:
  workflow_dispatch:
    inputs:
      released_tag:
        description: Exact public Registry Stack release tag
        required: true
        type: string
      docs_sha256:
        description: SHA-256 of the released documentation archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Authenticate and assemble docs site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate exact dispatch before build
        env:
          RELEASED_TAG: ${{ inputs.released_tag }}
          DOCS_SHA256: ${{ inputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          if [[ ! "${RELEASED_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "released_tag must be canonical v<major>.<minor>.<patch> text" >&2
            exit 1
          fi
          if [[ ! "${DOCS_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "docs_sha256 must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi

      - name: Authenticate public release and checksum inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_TAG: ${{ inputs.released_tag }}
          DOCS_SHA256: ${{ inputs.docs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          archive="registry-docs-${RELEASED_TAG}.tar.gz"
          checksum_bundle="registry-stack-${RELEASED_TAG}-SHA256SUMS.sigstore.json"
          release_dir="${RUNNER_TEMP}/released-docs"
          mkdir "${release_dir}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASED_TAG}" \
            > "${release_dir}/release.json"
          jq -e \
            --arg tag "${RELEASED_TAG}" \
            '.tag_name==$tag and .draft==false and .prerelease==false' \
            "${release_dir}/release.json" >/dev/null
          for name in "${archive}" SHA256SUMS "${checksum_bundle}"; do
            test "$(jq -r --arg name "${name}" \
              '[.assets[] | select(.name==$name)] | length' \
              "${release_dir}/release.json")" = 1
          done

          gh release download "${RELEASED_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${release_dir}" \
            --pattern "${archive}" \
            --pattern "SHA256SUMS" \
            --pattern "${checksum_bundle}"

          actual="$(sha256sum "${release_dir}/${archive}" | awk '{print $1}')"
          test "${actual}" = "${DOCS_SHA256}"
          test "$(jq -er --arg name "${archive}" \
            '.assets[] | select(.name==$name) | .digest' \
            "${release_dir}/release.json")" = "sha256:${DOCS_SHA256}"
          checksum="$(
            awk -v name="${archive}" '$2 == name {print $1}' \
              "${release_dir}/SHA256SUMS"
          )"
          test "${checksum}" = "${DOCS_SHA256}"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1

      - name: Verify tag-bound checksum signature
        env:
          RELEASED_TAG: ${{ inputs.released_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/released-docs"
          cosign verify-blob "${release_dir}/SHA256SUMS" \
            --bundle \
              "${release_dir}/registry-stack-${RELEASED_TAG}-SHA256SUMS.sigstore.json" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASED_TAG}"

      - name: Checkout protected main without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Check standard journey generation
        working-directory: docs/site
        run: node scripts/generate-standard-journeys.mjs --check

      - name: Build protected main at /dev/
        working-directory: docs/site
        run: |
          set -euo pipefail
          npm run generate
          DOCS_DOCSET=latest DOCS_BASE=/dev/ npx astro check
          DOCS_DOCSET=latest DOCS_BASE=/dev/ npx astro build --outDir dist/dev
          node scripts/apply-archive-seo.mjs dist/dev
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_UMAMI_SCRIPT_SRC: ${{ vars.PUBLIC_UMAMI_SCRIPT_SRC }}
          PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS }}

      - name: Assemble declared historical archives
        working-directory: docs/site
        env:
          RELEASED_TAG: ${{ inputs.released_tag }}
        run: |
          set -euo pipefail
          npm run assemble:archives -- \
            --exclude-docset "${RELEASED_TAG}"

      - name: Promote exact released docs without rewriting archive files
        working-directory: docs/site
        env:
          RELEASED_TAG: ${{ inputs.released_tag }}
          DOCS_SHA256: ${{ inputs.docs_sha256 }}
          RELEASED_ARCHIVE: ${{ runner.temp }}/released-docs/registry-docs-${{ inputs.released_tag }}.tar.gz
        run: |
          set -euo pipefail
          npm run stage:production-docsets -- \
            --released-tag "${RELEASED_TAG}" \
            --docs-sha256 "${DOCS_SHA256}" \
            --bundle "${RELEASED_ARCHIVE}"

      - name: Verify current machine-readable documentation
        working-directory: docs/site
        run: npm run check:llms:built

      - name: Verify assembled documentation tree
        working-directory: docs/site
        run: |
          npm run check:seo:built
          npm run check:links:built

      - name: Smoke assembled route and discovery tree
        working-directory: docs/site
        run: |
          npm run smoke:deployment -- \
            --root dist \
            --released-tag "${{ inputs.released_tag }}"

      - name: Upload one Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site/dist

  deploy:
    name: Deploy and smoke canonical docs
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Checkout smoke helper from protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: refs/heads/main
          sparse-checkout: docs/site/scripts/smoke-docs-deployment.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Smoke live canonical deployment
        working-directory: docs/site
        run: |
          node scripts/smoke-docs-deployment.mjs \
            --url https://docs.registrystack.org \
            --released-tag "${{ inputs.released_tag }}" \
            --attempts 12
