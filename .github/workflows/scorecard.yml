name: OpenSSF Scorecard

on:
  schedule:
    - cron: "24 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT (Administration: read-only). With only
          # GITHUB_TOKEN, Scorecard cannot query check suites and falls back
          # to the first page of check runs, which misses CodeQL on our PRs.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
