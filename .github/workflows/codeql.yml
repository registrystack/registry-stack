name: CodeQL

# Static analysis (SAST) for Rust, JavaScript/TypeScript, and Python. The Rust
# analyzer runs buildless (build-mode none) beside the interpreted languages in
# the docs site, node bindings, and Python sidecars. CodeQL has no shell
# analyzer, so the repository's shell scripts are outside this workflow.
# .github/codeql/codeql-config.yml excludes test-only paths, such as crate
# integration tests, from every language's analysis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/1.0]
  schedule:
    - cron: "27 3 * * 1"

# A push to a pull request cancels the analysis of its previous head, which
# would otherwise hold a runner for the full Rust analysis. Main and scheduled
# analyses each keep their own group and always complete.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
