name: Notary PostgreSQL conformance

on:
  workflow_call:
    inputs:
      strict_coverage:
        description: Run coverage and fail the caller when the Codecov upload fails.
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - release/1.0
    paths:
      - .github/workflows/notary-postgres-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/registry-notary/**
      - crates/registry-notary-core/**
      - crates/registry-notary-server/**
      - crates/registry-notary-worker-harness/**
      - crates/registry-platform-audit/**
      - crates/registry-platform-authcommon/**
      - crates/registry-platform-cache/**
      - crates/registry-platform-crypto/**
      - crates/registry-platform-ops/**
      - crates/registry-platform-replay/**
      - products/notary/scripts/postgresql-conformance.sh
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    paths:
      - .github/workflows/notary-postgres-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/registry-notary/**
      - crates/registry-notary-core/**
      - crates/registry-notary-server/**
      - crates/registry-notary-worker-harness/**
      - crates/registry-platform-audit/**
      - crates/registry-platform-authcommon/**
      - crates/registry-platform-cache/**
      - crates/registry-platform-crypto/**
      - crates/registry-platform-ops/**
      - crates/registry-platform-replay/**
      - products/notary/scripts/postgresql-conformance.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_LLVM_COV_VERSION: "0.8.7"
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/notary-postgres-conformance

jobs:
  state-plane:
    name: Notary state plane (PostgreSQL ${{ matrix.postgresql }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: "16"
            source_image: postgres:16.13-alpine
            target_image: postgres:16.14-alpine
          - postgresql: "17"
            source_image: postgres:17.9-alpine
            target_image: postgres:17.10-alpine
          - postgresql: "18"
            source_image: postgres:18.3-alpine
            target_image: postgres:18.4-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: notary-postgresql-pr-${{ matrix.postgresql }}

      - name: Build Registry Notary with CEL support
        run: cargo build --locked -p registry-notary --features registry-notary-cel

      - name: Precompile PostgreSQL conformance tests before service startup
        run: cargo test --locked -p registry-notary-server --lib --no-run

      - name: Run Notary PostgreSQL conformance
        env:
          NOTARY_BIN: target/notary-postgres-conformance/debug/registry-notary
          NOTARY_POSTGRES_SOURCE_IMAGE: ${{ matrix.source_image }}
          NOTARY_POSTGRES_TARGET_IMAGE: ${{ matrix.target_image }}
        run: |
          set -euo pipefail
          diagnostics="${RUNNER_TEMP}/notary-postgresql-${{ matrix.postgresql }}-docker-events.log"
          docker events --format '{{json .}}' >"${diagnostics}" &
          events_pid=$!
          trap 'kill "${events_pid}" 2>/dev/null || true; wait "${events_pid}" 2>/dev/null || true' EXIT
          products/notary/scripts/postgresql-conformance.sh "${{ matrix.postgresql }}"

      - name: Report PostgreSQL Docker diagnostics
        if: failure()
        run: |
          set -euo pipefail
          diagnostics="${RUNNER_TEMP}/notary-postgresql-${{ matrix.postgresql }}-docker-events.log"
          if [[ -s "${diagnostics}" ]]; then
            sed -n '1,400p' "${diagnostics}"
          else
            echo "No Docker events were captured."
          fi
          docker ps --all --no-trunc
          docker version

  state-plane-coverage:
    name: Notary state plane (PostgreSQL ${{ matrix.postgresql }})
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      inputs.strict_coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: "16"
            source_image: postgres:16.13-alpine
            target_image: postgres:16.14-alpine
          - postgresql: "17"
            source_image: postgres:17.9-alpine
            target_image: postgres:17.10-alpine
          - postgresql: "18"
            source_image: postgres:18.3-alpine
            target_image: postgres:18.4-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: notary-postgresql-coverage-${{ matrix.postgresql }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned coverage tool
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Build Registry Notary with CEL support
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          cargo build --locked -p registry-notary --features registry-notary-cel

      - name: Precompile PostgreSQL conformance tests before service startup
        run: |
          set -euo pipefail
          eval "$(cargo llvm-cov show-env --sh)"
          cargo test --locked -p registry-notary-server --lib --no-run

      - name: Run Notary PostgreSQL conformance
        env:
          NOTARY_BIN: target/notary-postgres-conformance/debug/registry-notary
          NOTARY_POSTGRES_SOURCE_IMAGE: ${{ matrix.source_image }}
          NOTARY_POSTGRES_TARGET_IMAGE: ${{ matrix.target_image }}
        run: |
          set -euo pipefail
          diagnostics="${RUNNER_TEMP}/notary-postgresql-${{ matrix.postgresql }}-docker-events.log"
          docker events --format '{{json .}}' >"${diagnostics}" &
          events_pid=$!
          trap 'kill "${events_pid}" 2>/dev/null || true; wait "${events_pid}" 2>/dev/null || true' EXIT
          eval "$(cargo llvm-cov show-env --sh)"
          products/notary/scripts/postgresql-conformance.sh "${{ matrix.postgresql }}"

      - name: Report Notary PostgreSQL coverage
        run: |
          set -euo pipefail
          eval "$(cargo llvm-cov show-env --sh)"
          coverage_dir="target/notary-postgres-conformance/coverage"
          mkdir -p "${coverage_dir}"
          cargo llvm-cov report --locked \
            -p registry-notary \
            -p registry-notary-server
          cargo llvm-cov report --locked \
            -p registry-notary \
            -p registry-notary-server \
            --lcov \
            --output-path "${coverage_dir}/notary-postgresql-${{ matrix.postgresql }}.lcov"

      - name: Upload Notary PostgreSQL coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notary-postgresql-${{ matrix.postgresql }}-coverage
          path: target/notary-postgres-conformance/coverage/
          if-no-files-found: error

      - name: Upload Notary PostgreSQL coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: ${{ inputs.strict_coverage }}
          files: target/notary-postgres-conformance/coverage/notary-postgresql-${{ matrix.postgresql }}.lcov
          flags: notary-postgres
          name: notary-postgresql-${{ matrix.postgresql }}
          use_oidc: true
          version: v11.3.1

      - name: Report PostgreSQL Docker diagnostics
        if: failure()
        run: |
          set -euo pipefail
          diagnostics="${RUNNER_TEMP}/notary-postgresql-${{ matrix.postgresql }}-docker-events.log"
          if [[ -s "${diagnostics}" ]]; then
            sed -n '1,400p' "${diagnostics}"
          else
            echo "No Docker events were captured."
          fi
          docker ps --all --no-trunc
          docker version
