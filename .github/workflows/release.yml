name: RegistryStack Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: registry-stack-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: registrystack
  CRANE_VERSION: v0.21.2
  CRANE_LINUX_AMD64_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
  SLSA_VERIFIER_VERSION: v2.7.1
  SLSA_VERIFIER_LINUX_AMD64_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339

jobs:
  verify:
    name: Verify tag and exact private candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      workflow_revision: ${{ steps.candidate.outputs.workflow_revision }}
      candidate_run: ${{ steps.binding.outputs.run_id }}
      candidate_attempt: ${{ steps.binding.outputs.run_attempt }}
      manifest_sha256: ${{ steps.binding.outputs.manifest_sha256 }}
      docs_sha256: ${{ steps.candidate.outputs.docs_sha256 }}
    steps:
      - name: Checkout exact annotated tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve exact tag identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be canonical vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != tag ]]; then
            echo "Release tag must be annotated" >&2
            exit 1
          fi
          source_sha="$(git rev-parse --verify "refs/tags/${tag}^{}")"
          test "$(git rev-parse HEAD)" = "${source_sha}"
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor \
            "${source_sha}" refs/remotes/origin/main
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Parse compact candidate binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents)' \
            "refs/tags/${{ steps.identity.outputs.tag }}" \
            > "${RUNNER_TEMP}/tag-message"
          PYTHONPATH=release/scripts python3 - \
            "${RUNNER_TEMP}/tag-message" "${GITHUB_OUTPUT}" <<'PY'
          import sys
          from pathlib import Path
          from release_candidate import parse_tag_binding

          message = Path(sys.argv[1]).read_text(encoding="utf-8")
          binding = parse_tag_binding(message.rstrip("\n"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for field in ("run_id", "run_attempt", "manifest_sha256"):
                  handle.write(f"{field}={binding[field]}\n")
          PY

      - name: Download exact candidate attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.binding.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.binding.outputs.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            > promotion/trusted-run.json
          jq -e \
            --argjson run_id "${RUN_ID}" \
            --argjson run_attempt "${RUN_ATTEMPT}" \
            '.id == $run_id and
             .run_attempt == $run_attempt and
             .event == "repository_dispatch" and
             .path == ".github/workflows/release-candidate.yml" and
             .conclusion == "success"' promotion/trusted-run.json >/dev/null
          artifact_name="registry-stack-release-candidate-${RUN_ID}-${RUN_ATTEMPT}"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq --arg name "${artifact_name}" \
            '[.artifacts[] | select(
              .name == $name and
              .expired == false and
              .workflow_run.id != null
            )] | select(length == 1) | .[0]' \
            > promotion/artifact.json
          artifact_id="$(jq -er .id promotion/artifact.json)"
          expected_archive_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' promotion/artifact.json)"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > promotion/candidate.zip
          test "sha256:$(sha256sum promotion/candidate.zip | awk '{print $1}')" = \
            "${expected_archive_digest}"
          unzip -q promotion/candidate.zip -d promotion/candidate
          expected="$(
            printf '%s\n' \
              release-candidate-manifest.json \
              "registry-stack-${{ steps.identity.outputs.tag }}-candidate.tar.gz" \
              | sort
          )"
          actual="$(
            find promotion/candidate -maxdepth 1 -type f -printf '%f\n' | sort
          )"
          test "${actual}" = "${expected}"
          cp promotion/trusted-run.json promotion/candidate/trusted-run.json

      - name: Verify binding, candidate, attestations, and recent canary
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=promotion/candidate/release-candidate-manifest.json
          bundle="promotion/candidate/registry-stack-${{ steps.identity.outputs.tag }}-candidate.tar.gz"
          test "$(sha256sum "${manifest}" | awk '{print $1}')" = \
            "${{ steps.binding.outputs.manifest_sha256 }}"
          mkdir -p promotion/extracted
          tar -xzf "${bundle}" -C promotion/extracted
          release_id="$(jq -er .release.release_id "${manifest}")"
          workflow_revision="$(jq -er .workflow.revision "${manifest}")"
          python3 release/scripts/release_candidate.py verify-tag-binding \
            --message "${RUNNER_TEMP}/tag-message" \
            --manifest "${manifest}" \
            --bundle "${bundle}" \
            --bundle-root promotion/extracted \
            --trusted-run-metadata promotion/trusted-run.json \
            --tag-target "${{ steps.identity.outputs.source_sha }}" \
            --workflow-revision "${workflow_revision}" \
            --version "${{ steps.identity.outputs.version }}" \
            --release-id "${release_id}"
          test "${workflow_revision}" = "${{ steps.identity.outputs.source_sha }}"
          python3 release/scripts/release_candidate.py verify-candidate \
            --manifest "${manifest}" \
            --bundle "${bundle}" \
            --bundle-root promotion/extracted \
            --source-sha "${workflow_revision}" \
            --workflow-revision "${workflow_revision}" \
            --version "${{ steps.identity.outputs.version }}" \
            --release-id "${release_id}" \
            --run-id "${{ steps.binding.outputs.run_id }}" \
            --run-attempt "${{ steps.binding.outputs.run_attempt }}" \
            --promotion \
            --trusted-run-metadata promotion/trusted-run.json
          for subject in "${manifest}" "${bundle}"; do
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow \
                "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --signer-digest "${workflow_revision}" \
              --source-ref refs/heads/main \
              --source-digest "${workflow_revision}" \
              --deny-self-hosted-runners
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-canary.yml/runs?branch=main&status=success&per_page=100" \
            > promotion/canary-runs.json
          python3 release/scripts/release_candidate.py select-canary \
            --metadata promotion/canary-runs.json \
            --workflow-revision "${workflow_revision}" \
            --output promotion/canary-run.json
          python3 release/scripts/release_candidate.py verify-canary \
            --metadata promotion/canary-run.json \
            --workflow-revision "${workflow_revision}"
          {
            echo "release_id=${release_id}"
            echo "workflow_revision=${workflow_revision}"
            echo "docs_sha256=$(jq -er .docs.sha256 "${manifest}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify public images are absent and any draft is bound
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=promotion/candidate/release-candidate-manifest.json
          response="${RUNNER_TEMP}/release-response"
          if gh api --include --silent \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.identity.outputs.tag }}" \
              >"${response}" 2>&1; then
            status=200
          else
            status="$(
              python3 release/scripts/release_workflow_guard.py http-status \
                --response "${response}"
            )"
          fi
          if [[ "${status}" == 200 ]]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.identity.outputs.tag }}" \
              > promotion/existing-release.json
            jq -e \
              --arg tag "${{ steps.identity.outputs.tag }}" \
              --arg title "RegistryStack ${{ steps.identity.outputs.tag }}" \
              --arg marker \
                "registry-stack-release-candidate-v2 manifest_sha256:${{ steps.binding.outputs.manifest_sha256 }}" \
              '.draft == true and
               .prerelease == false and
               .tag_name == $tag and
               .name == $title and
               ((.body // "") | contains($marker))' \
              promotion/existing-release.json >/dev/null
          elif [[ "${status}" != 404 ]]; then
            echo "GitHub Release destination is neither absent nor an exact draft" >&2
            exit 1
          fi
          while IFS=$'\t' read -r final_ref _digest; do
            destination="$(
              python3 release/scripts/release_workflow_guard.py \
                public-image-destination \
                --final-ref "${final_ref}" \
                --namespace "${IMAGE_NAMESPACE}"
            )"
            IFS=$'\t' read -r package tag <<<"${destination}"
            versions="${RUNNER_TEMP}/${package}-versions.json"
            gh api --paginate --slurp \
              "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}/versions?per_page=100" \
              > "${versions}"
            python3 release/scripts/release_workflow_guard.py \
              require-image-tag-absent \
              --metadata "${versions}" \
              --tag "${tag}"
          done < <(jq -r '.images[] | [.final_ref,.digest] | @tsv' "${manifest}")

      - name: Upload verified promotion input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-promotion-input-${{ github.run_id }}
          path: promotion/candidate
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  stage-draft:
    name: Create or reconcile the bound draft
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download verified promotion input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-promotion-input-${{ github.run_id }}
          path: promotion

      - name: Reverify and stage exact candidate payloads
        shell: bash
        run: |
          set -euo pipefail
          manifest=promotion/release-candidate-manifest.json
          bundle="promotion/registry-stack-${{ needs.verify.outputs.tag }}-candidate.tar.gz"
          test "$(sha256sum "${manifest}" | awk '{print $1}')" = \
            "${{ needs.verify.outputs.manifest_sha256 }}"
          mkdir -p extracted release-assets contract
          tar -xzf "${bundle}" -C extracted
          python3 release/scripts/release_candidate.py verify-candidate \
            --manifest "${manifest}" \
            --bundle "${bundle}" \
            --bundle-root extracted \
            --source-sha "${{ needs.verify.outputs.workflow_revision }}" \
            --workflow-revision "${{ needs.verify.outputs.workflow_revision }}" \
            --version "${{ needs.verify.outputs.version }}" \
            --release-id "${{ needs.verify.outputs.release_id }}" \
            --run-id "${{ needs.verify.outputs.candidate_run }}" \
            --run-attempt "${{ needs.verify.outputs.candidate_attempt }}" \
            --promotion \
            --trusted-run-metadata promotion/trusted-run.json
          while IFS= read -r name; do
            if [[ "${name}" == *-image-lock.json ]]; then
              continue
            fi
            cp "extracted/${name}" "release-assets/${name}"
          done < <(jq -r '.payloads[].name' "${manifest}")
          public_manifest="registry-stack-${{ needs.verify.outputs.tag }}-release-manifest.json"
          cp "${manifest}" "release-assets/${public_manifest}"

      - name: Reconcile bound draft and upload exact staged inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          while IFS= read -r -d '' file; do
            jq -n \
              --arg name "$(basename "${file}")" \
              --arg sha256 "$(sha256sum "${file}" | awk '{print $1}')" \
              --argjson size "$(stat -c %s "${file}")" \
              '{name:$name,sha256:$sha256,size:$size}'
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z) \
            | jq -s 'sort_by(.name)' > contract/staged-assets.json
          response="${RUNNER_TEMP}/release-response"
          if gh api --include --silent \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              >"${response}" 2>&1; then
            status=200
          else
            status="$(
              python3 release/scripts/release_workflow_guard.py http-status \
                --response "${response}"
            )"
          fi
          if [[ "${status}" == 200 ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              > "${RUNNER_TEMP}/existing-draft.json"
            jq -e \
              --arg tag "${tag}" \
              --arg title "RegistryStack ${tag}" \
              --arg marker \
                "registry-stack-release-candidate-v2 manifest_sha256:${{ needs.verify.outputs.manifest_sha256 }}" \
              'select(
                .draft == true and
                .prerelease == false and
                .tag_name == $tag and
                .name == $title and
                ((.body // "") | contains($marker))
              ) | .id' \
              "${RUNNER_TEMP}/existing-draft.json" >/dev/null
          elif [[ "${status}" != 404 ]]; then
            echo "GitHub Release destination is neither absent nor an exact draft" >&2
            exit 1
          else
            cp "release/notes/${tag}.md" contract/draft-notes.md
            printf \
              '\n<!-- registry-stack-release-candidate-v2 manifest_sha256:%s -->\n' \
              "${{ needs.verify.outputs.manifest_sha256 }}" \
              >> contract/draft-notes.md
            gh release create "${tag}" \
              --verify-tag \
              --draft \
              --title "RegistryStack ${tag}" \
              --notes-file contract/draft-notes.md
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > "${RUNNER_TEMP}/staged-draft.json"
          jq -r '.[].name' contract/staged-assets.json \
            | sort -u > contract/expected-staged-assets
          jq -r '.assets[].name' "${RUNNER_TEMP}/staged-draft.json" \
            | sort -u > contract/actual-staged-assets
          if ! comm -13 \
              contract/expected-staged-assets \
              contract/actual-staged-assets \
              > contract/unexpected-staged-assets; then
            exit 1
          fi
          if [[ -s contract/unexpected-staged-assets ]]; then
            echo "Draft contains assets outside the deterministic staged roster" >&2
            cat contract/unexpected-staged-assets >&2
            exit 1
          fi
          additions=()
          while IFS=$'\t' read -r name sha256 size; do
            matches="$(
              jq -c --arg name "${name}" \
                '[.assets[] | select(.name == $name)]' \
                "${RUNNER_TEMP}/staged-draft.json"
            )"
            count="$(jq -r length <<<"${matches}")"
            if [[ "${count}" == 0 ]]; then
              additions+=("release-assets/${name}")
            elif [[ "${count}" == 1 ]]; then
              jq -e \
                --arg digest "sha256:${sha256}" \
                --argjson size "${size}" \
                '.[0].digest == $digest and .[0].size == $size' \
                <<<"${matches}" >/dev/null
            else
              echo "Draft repeats staged asset ${name}" >&2
              exit 1
            fi
          done < <(
            jq -r '.[] | [.name,.sha256,.size] | @tsv' \
              contract/staged-assets.json
          )
          if ((${#additions[@]} > 0)); then
            gh release upload "${tag}" "${additions[@]}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > "${RUNNER_TEMP}/staged-draft.json"
          while IFS=$'\t' read -r name sha256 size; do
            jq -e \
              --arg name "${name}" \
              --arg digest "sha256:${sha256}" \
              --argjson size "${size}" \
              '[.assets[]
                | select(
                    .name == $name and
                    .digest == $digest and
                    .size == $size
                  )]
               | length == 1' \
              "${RUNNER_TEMP}/staged-draft.json" >/dev/null
          done < <(
            jq -r '.[] | [.name,.sha256,.size] | @tsv' \
              contract/staged-assets.json
          )

      - name: Upload draft reconciliation contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-draft-contract-${{ github.run_id }}
          path: contract
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  promote-images:
    name: Reconcile staged draft, then promote exact image manifests
    needs:
      - verify
      - stage-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download verified candidate and draft contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-input-${{ github.run_id }}
          path: inputs

      - name: Download exact draft contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-draft-contract-${{ github.run_id }}
          path: contract

      - name: Install pinned image inspector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/crane.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" \
            -C "${HOME}/.local/bin" crane
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Reconcile exact staged draft before first public image write
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > contract/draft-release.json
          jq -e \
            --arg tag "${tag}" \
            '.draft == true and .tag_name == $tag' \
            contract/draft-release.json >/dev/null
          jq -r '.[].name' contract/staged-assets.json \
            | sort > contract/expected-assets
          jq -r '.assets[].name' contract/draft-release.json \
            | sort > contract/actual-assets
          diff -u contract/expected-assets contract/actual-assets
          mkdir -p draft
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" --dir draft
          while IFS=$'\t' read -r name sha256 size; do
            test "$(stat -c %s "draft/${name}")" = "${size}"
            test "$(sha256sum "draft/${name}" | awk '{print $1}')" = "${sha256}"
            test "$(jq -er --arg name "${name}" \
              '.assets[] | select(.name == $name) | .digest' \
              contract/draft-release.json)" = "sha256:${sha256}"
          done < <(
            jq -r '.[] | [.name,.sha256,.size] | @tsv' \
              contract/staged-assets.json
          )

      - name: Reverify candidate expiry immediately before registry login
        shell: bash
        run: |
          set -euo pipefail
          promotion="inputs/release-promotion-input-${GITHUB_RUN_ID}"
          manifest="${promotion}/release-candidate-manifest.json"
          bundle="${promotion}/registry-stack-${{ needs.verify.outputs.tag }}-candidate.tar.gz"
          mkdir -p candidate-extracted
          tar -xzf "${bundle}" -C candidate-extracted
          python3 release/scripts/release_candidate.py verify-candidate \
            --manifest "${manifest}" \
            --bundle "${bundle}" \
            --bundle-root candidate-extracted \
            --source-sha "${{ needs.verify.outputs.workflow_revision }}" \
            --workflow-revision "${{ needs.verify.outputs.workflow_revision }}" \
            --version "${{ needs.verify.outputs.version }}" \
            --release-id "${{ needs.verify.outputs.release_id }}" \
            --run-id "${{ needs.verify.outputs.candidate_run }}" \
            --run-attempt "${{ needs.verify.outputs.candidate_attempt }}" \
            --promotion \
            --trusted-run-metadata "${promotion}/trusted-run.json"

      - name: Log in for exact candidate promotion
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Burn version on first exact digest promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="inputs/release-promotion-input-${GITHUB_RUN_ID}/release-candidate-manifest.json"
          while IFS=$'\t' read -r candidate_ref digest final_ref; do
            test "$(crane digest "${candidate_ref}")" = "${digest}"
            destination="$(
              python3 release/scripts/release_workflow_guard.py \
                public-image-destination \
                --final-ref "${final_ref}" \
                --namespace "${IMAGE_NAMESPACE}"
            )"
            IFS=$'\t' read -r package tag <<<"${destination}"
            versions="${RUNNER_TEMP}/${package}-versions.json"
            gh api --paginate --slurp \
              "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}/versions?per_page=100" \
              > "${versions}"
            # Each public write is an irreversible version burn. Rechecking
            # absence immediately before each copy prevents a rerun from
            # resuming a partially published version.
            python3 release/scripts/release_workflow_guard.py \
              require-image-tag-absent \
              --metadata "${versions}" \
              --tag "${tag}"
            crane copy "${candidate_ref}" "${final_ref}"
            test "$(crane digest "${final_ref}")" = "${digest}"
          done < <(
            jq -r '.images[] |
              [.candidate_ref,.digest,.final_ref] | @tsv' "${manifest}"
          )

  finalize-assets:
    name: Finalize signed assets and prove the released 1.x runtime
    needs:
      - verify
      - stage-draft
      - promote-images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: read
    outputs:
      provenance_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download exact candidate and staged draft contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-input-${{ github.run_id }}
          path: inputs

      - name: Download exact staged draft contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-draft-contract-${{ github.run_id }}
          path: contract

      - name: Install pinned image inspector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/crane.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" \
            -C "${HOME}/.local/bin" crane
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install tag-bound signer
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
        with:
          cosign-release: v3.0.4

      - name: Clean retryable final additions and reverify exact staged assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          version="${{ needs.verify.outputs.version }}"
          major="${version%%.*}"
          mkdir -p release-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > contract/draft-release.json
          jq -e \
            --arg tag "${tag}" \
            --arg title "RegistryStack ${tag}" \
            --arg marker \
              "registry-stack-release-candidate-v2 manifest_sha256:${{ needs.verify.outputs.manifest_sha256 }}" \
            '.draft == true and
             .prerelease == false and
             .tag_name == $tag and
             .name == $title and
             ((.body // "") | contains($marker))' \
            contract/draft-release.json >/dev/null
          {
            printf '%s\n' \
              "registryctl-${tag}-image-lock.json" \
              SHA256SUMS \
              "registry-stack-${tag}-SHA256SUMS.sigstore.json"
            if ((major >= 1)); then
              evidence="registry-stack-${tag}-first-country-release-form.tar.gz"
              printf '%s\n' \
                registry-release-lock.v1.json \
                "${evidence}" \
                "${evidence%.tar.gz}.sigstore.json"
            fi
          } | sort -u > contract/retryable-final-assets
          {
            jq -r '.[].name' contract/staged-assets.json
            cat contract/retryable-final-assets
          } | sort -u > contract/allowed-assets
          jq -r '.assets[].name' contract/draft-release.json \
            | sort -u > contract/actual-assets
          if ! comm -23 contract/actual-assets contract/allowed-assets \
              > contract/unexpected-assets; then
            exit 1
          fi
          if [[ -s contract/unexpected-assets ]]; then
            echo "Draft contains assets outside the staged and retryable rosters" >&2
            cat contract/unexpected-assets >&2
            exit 1
          fi
          # Sigstore bundles are intentionally nondeterministic. On a failed
          # finalizer retry, remove only the closed final-addition roster from
          # this exact candidate draft, then regenerate the closure together.
          while IFS= read -r name; do
            asset_id="$(
              jq -er --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' \
                contract/draft-release.json 2>/dev/null || true
            )"
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < contract/retryable-final-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > contract/draft-release.json
          jq -r '.[].name' contract/staged-assets.json \
            | sort > contract/expected-assets
          jq -r '.assets[].name' contract/draft-release.json \
            | sort > contract/actual-assets
          diff -u contract/expected-assets contract/actual-assets
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" --dir release-assets
          while IFS=$'\t' read -r name sha256 size; do
            test "$(stat -c %s "release-assets/${name}")" = "${size}"
            test "$(sha256sum "release-assets/${name}" | awk '{print $1}')" = "${sha256}"
            test "$(jq -er --arg name "${name}" \
              '.assets[] | select(.name == $name) | .digest' \
              contract/draft-release.json)" = "sha256:${sha256}"
          done < <(
            jq -r '.[] | [.name,.sha256,.size] | @tsv' \
              contract/staged-assets.json
          )

      - name: Render the final P to T image lock
        shell: bash
        run: |
          set -euo pipefail
          promotion="inputs/release-promotion-input-${GITHUB_RUN_ID}"
          candidate="${promotion}/release-candidate-manifest.json"
          release_manifest="$(
            python3 - "${{ needs.verify.outputs.version }}" <<'PY'
          import glob
          import sys
          import yaml

          version = sys.argv[1]
          matches = []
          for path in sorted(glob.glob("release/manifests/registry-stack-*.yaml")):
              with open(path, encoding="utf-8") as handle:
                  stack = yaml.safe_load(handle).get("stack", {})
              if str(stack.get("version", "")) == version:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"expected one release manifest for {version}, found {matches}")
          print(matches[0])
          PY
          )"
          mkdir -p "${RUNNER_TEMP}/release-image-indexes"
          for name in registry-notary registry-relay; do
            index_digest="$(jq -er --arg name "${name}" \
              '.images[] | select(.name == $name) | .digest
               | select(test("^sha256:[0-9a-f]{64}$"))' "${candidate}")"
            image_ref="${REGISTRY}/${IMAGE_NAMESPACE}/${name}@${index_digest}"
            test "$(crane digest "${image_ref}")" = "${index_digest}"
            crane manifest "${image_ref}" \
              > "${RUNNER_TEMP}/release-image-indexes/${name}.json"
            printf '%s\n' "${image_ref}" \
              > "${RUNNER_TEMP}/${name}.release.digest"
          done
          postgresql_ref="$(
            tr -d '\n' < release/registryctl-postgresql-image.ref
          )"
          postgresql_index_digest="${postgresql_ref##*@}"
          test "$(crane digest "${postgresql_ref}")" = \
            "${postgresql_index_digest}"
          crane manifest "${postgresql_ref}" \
            > "${RUNNER_TEMP}/release-image-indexes/postgresql.json"
          release/scripts/registry-release render-registryctl-image-lock \
            "${release_manifest}" \
            --relay-digest "${RUNNER_TEMP}/registry-relay.release.digest" \
            --notary-digest "${RUNNER_TEMP}/registry-notary.release.digest" \
            --postgresql-ref-file release/registryctl-postgresql-image.ref \
            --tag-target "${{ needs.verify.outputs.source_sha }}" \
            --source-sha "${{ needs.verify.outputs.workflow_revision }}" \
            --output \
              "release-assets/registryctl-${{ needs.verify.outputs.tag }}-image-lock.json"
          image_lock="registryctl-${{ needs.verify.outputs.tag }}-image-lock.json"
          expected_image_lock_sha256="$(
            jq -er --arg name "${image_lock}" \
              '.payloads[]
               | select(.kind == "image-lock" and .name == $name)
               | .sha256' "${candidate}"
          )"
          test "$(
            sha256sum "release-assets/${image_lock}" | awk '{print $1}'
          )" = "${expected_image_lock_sha256}"

      - name: Generate signed 1.x lock and run the clean released runtime
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          version="${{ needs.verify.outputs.version }}"
          major="${version%%.*}"
          mkdir -p evidence
          if ((major >= 1)); then
            python3 release/scripts/registry_release_lock.py create-payload \
              --version "${version}" \
              --manifest-source-ref "${{ needs.verify.outputs.workflow_revision }}" \
              --tag-target "${{ needs.verify.outputs.source_sha }}" \
              --asset-dir release-assets \
              --image-lock \
                "release-assets/registryctl-${tag}-image-lock.json" \
              --relay-image-index \
                "${RUNNER_TEMP}/release-image-indexes/registry-relay.json" \
              --notary-image-index \
                "${RUNNER_TEMP}/release-image-indexes/registry-notary.json" \
              --postgresql-image-index \
                "${RUNNER_TEMP}/release-image-indexes/postgresql.json" \
              --output contract/registry-release-lock.payload.json
            cosign sign-blob --yes \
              --bundle contract/registry-release-lock.sigstore.json \
              contract/registry-release-lock.payload.json
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${tag}"
            cosign verify-blob contract/registry-release-lock.payload.json \
              --bundle contract/registry-release-lock.sigstore.json \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer \
                https://token.actions.githubusercontent.com
            python3 release/scripts/registry_release_lock.py assemble \
              --payload contract/registry-release-lock.payload.json \
              --bundle contract/registry-release-lock.sigstore.json \
              --output release-assets/registry-release-lock.v1.json
            python3 release/scripts/registry_release_lock.py check \
              --input release-assets/registry-release-lock.v1.json
            (
              cd release-assets
              find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
                | sort -z | xargs -0 sha256sum | sed 's#  \./#  #'
            ) > release-assets/SHA256SUMS
            python3 release/scripts/first-country-release-form.py run \
              --asset-dir release-assets \
              --tag "${tag}" \
              --evidence-dir evidence/first-country
            python3 release/scripts/first-country-release-form.py verify \
              --asset-dir release-assets \
              --tag "${tag}" \
              --report evidence/first-country/first-country-release-form.json
            rm release-assets/SHA256SUMS
            archive="release-assets/registry-stack-${tag}-first-country-release-form.tar.gz"
            tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 \
              --numeric-owner -czf "${archive}" -C evidence first-country
            cosign sign-blob --yes \
              --bundle "${archive%.tar.gz}.sigstore.json" \
              "${archive}"
          fi

      - name: Sign and upload the complete pre-provenance asset closure
        id: subjects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum | sed 's#  \./#  #'
          ) > release-assets/SHA256SUMS
          version="${{ needs.verify.outputs.version }}"
          major="${version%%.*}"
          if ((major >= 1)); then
            python3 release/scripts/first-country-release-form.py verify \
              --asset-dir release-assets \
              --tag "${tag}" \
              --report evidence/first-country/first-country-release-form.json
          fi
          cp release-assets/SHA256SUMS contract/provenance-subjects.sha256
          echo "base64_subjects=$(base64 -w0 contract/provenance-subjects.sha256)" \
            >> "${GITHUB_OUTPUT}"
          checksum_bundle="release-assets/registry-stack-${{ needs.verify.outputs.tag }}-SHA256SUMS.sigstore.json"
          cosign sign-blob --yes \
            --bundle "${checksum_bundle}" \
            release-assets/SHA256SUMS
          test -s "${checksum_bundle}"
          mapfile -d '' -t staged < <(
            jq -r '.[].name' contract/staged-assets.json \
              | while IFS= read -r name; do
                  printf '%s\0' "release-assets/${name}"
                done
          )
          mapfile -d '' -t additions < <(
            find release-assets -maxdepth 1 -type f -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  skip=0
                  for original in "${staged[@]}"; do
                    if [[ "${file}" == "${original}" ]]; then
                      skip=1
                      break
                    fi
                  done
                  if ((skip == 0)); then
                    printf '%s\0' "${file}"
                  fi
                done
          )
          gh release upload "${tag}" "${additions[@]}" \
            --repo "${GITHUB_REPOSITORY}"
          while IFS= read -r -d '' file; do
            jq -n \
              --arg name "$(basename "${file}")" \
              --arg sha256 "$(sha256sum "${file}" | awk '{print $1}')" \
              --argjson size "$(stat -c %s "${file}")" \
              '{name:$name,sha256:$sha256,size:$size}'
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z) \
            | jq -s 'sort_by(.name)' > contract/pre-provenance-assets.json

      - name: Upload final reconciliation contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-final-contract-${{ github.run_id }}
          path: contract
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  release-provenance:
    name: Generate tag-bound release provenance
    needs:
      - verify
      - finalize-assets
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.finalize-assets.outputs.provenance_subjects }}
      upload-assets: true
      upload-tag-name: ${{ needs.verify.outputs.tag }}
      provenance-name: registry-stack-${{ needs.verify.outputs.tag }}-release-provenance.intoto.jsonl

  publish:
    name: Publish reconciled draft and dispatch exact docs
    needs:
      - verify
      - stage-draft
      - promote-images
      - finalize-assets
      - release-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact candidate manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-promotion-input-${{ github.run_id }}
          path: promotion

      - name: Download exact final contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-final-contract-${{ github.run_id }}
          path: contract

      - name: Install pinned release verifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/crane.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" \
            -C "${HOME}/.local/bin" crane
          curl -sSfL \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64" \
            -o "${HOME}/.local/bin/slsa-verifier"
          echo "${SLSA_VERIFIER_LINUX_AMD64_SHA256}  ${HOME}/.local/bin/slsa-verifier" \
            | sha256sum --check --strict
          chmod 0755 "${HOME}/.local/bin/slsa-verifier"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install cosign verifier
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
        with:
          cosign-release: v3.0.4

      - name: Recheck complete signed draft and exact public images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          manifest=promotion/release-candidate-manifest.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > release-state.json
          jq -e \
            --arg tag "${tag}" \
            --arg title "RegistryStack ${tag}" \
            --arg marker \
              "registry-stack-release-candidate-v2 manifest_sha256:${{ needs.verify.outputs.manifest_sha256 }}" \
            '((.draft | type) == "boolean") and
             .prerelease == false and
             .tag_name == $tag and
             .name == $title and
             ((.body // "") | contains($marker))' \
            release-state.json >/dev/null
          provenance="registry-stack-${tag}-release-provenance.intoto.jsonl"
          {
            jq -r '.[].name' contract/pre-provenance-assets.json
            printf '%s\n' "${provenance}"
          } | sort > expected-assets
          jq -r '.assets[].name' release-state.json | sort > actual-assets
          diff -u expected-assets actual-assets
          mkdir -p draft
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" --dir draft
          while IFS=$'\t' read -r name sha256 size; do
            test "$(stat -c %s "draft/${name}")" = "${size}"
            test "$(sha256sum "draft/${name}" | awk '{print $1}')" = "${sha256}"
            test "$(jq -er --arg name "${name}" \
              '.assets[] | select(.name == $name) | .digest' \
              release-state.json)" = "sha256:${sha256}"
          done < <(
            jq -r '.[] | [.name,.sha256,.size] | @tsv' \
              contract/pre-provenance-assets.json
          )
          (
            cd draft
            sha256sum --check --strict SHA256SUMS
          )
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${tag}"
          cosign verify-blob draft/SHA256SUMS \
            --bundle \
              "draft/registry-stack-${tag}-SHA256SUMS.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com
          while read -r _subject_sha subject_name; do
            slsa-verifier verify-artifact "draft/${subject_name}" \
              --provenance-path "draft/${provenance}" \
              --source-uri "github.com/${GITHUB_REPOSITORY}" \
              --source-tag "${tag}"
          done < contract/provenance-subjects.sha256
          while IFS=$'\t' read -r digest final_ref; do
            test "$(crane digest "${final_ref}")" = "${digest}"
          done < <(jq -r '.images[] | [.digest,.final_ref] | @tsv' "${manifest}")
          required=(
            "registry-docs-${tag}.tar.gz"
            SHA256SUMS
            "registry-stack-${tag}-SHA256SUMS.sigstore.json"
            "registry-stack-${tag}-release-provenance.intoto.jsonl"
          )
          version="${{ needs.verify.outputs.version }}"
          major="${version%%.*}"
          if ((major >= 1)); then
            evidence="registry-stack-${tag}-first-country-release-form.tar.gz"
            required+=(
              registry-release-lock.v1.json
              "registryctl-${tag}-image-lock.json"
              "${evidence}"
              "${evidence%.tar.gz}.sigstore.json"
            )
            cosign verify-blob "draft/${evidence}" \
              --bundle "draft/${evidence%.tar.gz}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer \
                https://token.actions.githubusercontent.com
          fi
          for name in "${required[@]}"; do
            jq -e --arg name "${name}" \
              '.assets[] | select(.name == $name)' \
              release-state.json >/dev/null
          done

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > publish-state.json
          release_id="$(
            jq -er \
              --arg tag "${tag}" \
              --arg title "RegistryStack ${tag}" \
              --arg marker \
                "registry-stack-release-candidate-v2 manifest_sha256:${{ needs.verify.outputs.manifest_sha256 }}" \
              'select(
                ((.draft | type) == "boolean") and
                .prerelease == false and
                .tag_name == $tag and
                .name == $title and
                ((.body // "") | contains($marker))
              ) | .id' \
              publish-state.json
          )"
          is_draft="$(jq -er '.draft | tostring' publish-state.json)"
          if [[ "${is_draft}" == true ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > published-release.json
          jq -e \
            --argjson release_id "${release_id}" \
            --arg tag "${tag}" \
            --arg title "RegistryStack ${tag}" \
            --arg marker \
              "registry-stack-release-candidate-v2 manifest_sha256:${{ needs.verify.outputs.manifest_sha256 }}" \
            '.id == $release_id and
             .draft == false and
             .prerelease == false and
             .tag_name == $tag and
             .name == $title and
             ((.body // "") | contains($marker))' \
            published-release.json >/dev/null

  dispatch-docs:
    name: Dispatch exact docs promotion
    needs:
      - verify
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch authenticated docs promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run docs-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "released_tag=${{ needs.verify.outputs.tag }}" \
            -f "docs_sha256=${{ needs.verify.outputs.docs_sha256 }}"
