name: Rehearse RegistryStack Release
run-name: Rehearse ${{ inputs.release_id }} v${{ inputs.version }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared canonical semantic version without the v prefix
        required: true
        type: string
      release_id:
        description: Prepared release train identity
        required: true
        type: string
      request_id:
        description: Unique operator-generated identity used to correlate this rehearsal
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release image onboarding before builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a branch rehearsal
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "release rehearsal must run from a prepared branch" >&2
            exit 1
          fi

      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Check complete release image onboarding
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 release/scripts/release_candidate.py check-image-onboarding \
            --version "${REHEARSAL_VERSION}" \
            --root .

  rehearse:
    name: Exercise future-tag release paths on Ubuntu
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Refresh protected-main comparison ref
        run: >-
          git fetch --no-tags --force origin
          refs/heads/main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install exact docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Rehearse prepared release without publishing
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
          REHEARSAL_RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          release/scripts/rehearse-release
          --version "${REHEARSAL_VERSION}"
          --release-id "${REHEARSAL_RELEASE_ID}"
          --base-ref origin/main

  canonical-linux:
    name: Prove the canonical Linux payload
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RELEASE_BUILDER_IMAGE: rust:1.95-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Restore reusable Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: registry-stack-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'release/scripts/build-release-binaries.sh', 'release/docker/Dockerfile.builder') }}

      - name: Build and smoke the canonical Linux payload
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release/scripts/build-release-binaries.sh "${REHEARSAL_VERSION}"
          test "$("dist/bin/breg-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
            "breg ${REHEARSAL_VERSION}"
          test "$("dist/bin/bregctl-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
            "bregctl ${REHEARSAL_VERSION}"

  node-clients:
    name: Prove Linux Node clients for ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CLIENT_VERSION: ${{ inputs.version }}
      RUSTUP_TOOLCHAIN: "1.95.0"
      NODE_GLIBC_BASELINE_IMAGE: node:22.12.0-bullseye-slim@sha256:52e4282a01d63eb4cfce7a395364d366cee488c278079110d3aa49dd21b2bf18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-amd64-glibc
            target: x86_64-unknown-linux-gnu
            napi_platform: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            asset: linux-arm64-glibc
            target: aarch64-unknown-linux-gnu
            napi_platform: linux-arm64-gnu
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            crates/registry-discovery-client-node/package-lock.json
            crates/registry-evidence-client-node/package-lock.json
            crates/registry-relay-client-node/package-lock.json
            crates/registry-breg-client-node/package-lock.json
            crates/registry-stack-client-node/package-lock.json

      - name: Install exact Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          python3 -m venv "${RUNNER_TEMP}/maturin"
          "${RUNNER_TEMP}/maturin/bin/pip" install --quiet \
            --require-hashes --only-binary=:all: \
            --requirement "${GITHUB_WORKSPACE}/release/requirements/maturin-1.9.6.txt"
          test "$("${RUNNER_TEMP}/maturin/bin/python" -m ziglang version)" = 0.12.1

      - name: Build, package, and smoke Linux Node clients
        shell: bash
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"${CLIENT_VERSION}"
          unified_client=0
          if (( major > 0 || minor > 26 || (minor == 26 && patch >= 1) )); then
            unified_client=1
          fi
          clients=(discovery evidence relay)
          if [[ "${unified_client}" -eq 1 ]]; then
            clients+=(breg)
          fi
          for client in "${clients[@]}"; do
            client_dir="${GITHUB_WORKSPACE}/crates/registry-${client}-client-node"
            (cd "${client_dir}" && npm ci)
            test "$(node -p "require('${client_dir}/package.json').version")" = \
              "${CLIENT_VERSION}"
            release/scripts/build-linux-node-client \
              --client "${client}" \
              --target "${{ matrix.target }}" \
              --napi-platform "${{ matrix.napi_platform }}" \
              --zig-python "${RUNNER_TEMP}/maturin/bin/python"

            if [[ "${unified_client}" -eq 1 ]]; then
              continue
            fi
            platform_dir="${client_dir}/npm/${{ matrix.napi_platform }}"
            test -f "${platform_dir}/package.json"
            cp "${client_dir}/LICENSE" "${platform_dir}/LICENSE"
            cp "${client_dir}/${client}-client.${{ matrix.napi_platform }}.node" \
              "${platform_dir}/"
            (cd "${client_dir}" && npm pack \
              "./npm/${{ matrix.napi_platform }}" \
              --ignore-scripts --pack-destination "${RUNNER_TEMP}")
            platform_package="${RUNNER_TEMP}/registrystack-${client}-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${platform_package}"

            smoke="${RUNNER_TEMP}/node-rehearsal-${client}"
            mkdir -p "${smoke}"
            root_stage="${RUNNER_TEMP}/node-root-${client}"
            mkdir -p "${root_stage}"
            for source in \
              LICENSE README.md client.js client.d.ts index.js index.d.ts package.json; do
              cp "${client_dir}/${source}" "${root_stage}/${source}"
            done
            python3 release/scripts/client_registry.py bind-optional-deps \
              --package-json "${root_stage}/package.json" \
              --version "${CLIENT_VERSION}" \
              --client "${client}"
            (cd "${root_stage}" && npm pack \
              --ignore-scripts --pack-destination "${smoke}")
            root_package="${smoke}/registrystack-${client}-client-${CLIENT_VERSION}.tgz"
            test -f "${root_package}"
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund --ignore-scripts \
                "${root_package}" "${platform_package}"
              test -z "$(find "node_modules/@registrystack/${client}-client" \
                -maxdepth 1 -name '*.node' -print -quit)"
              test -f \
                "node_modules/@registrystack/${client}-client-${{ matrix.napi_platform }}/${client}-client.${{ matrix.napi_platform }}.node"
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-${client}-client-package.js" .
              node "smoke-${client}-client-package.js"
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node "smoke-${client}-client-package.js"
            )
          done
          if [[ "${unified_client}" -eq 1 ]]; then
            client_dir="${GITHUB_WORKSPACE}/crates/registry-stack-client-node"
            platform_dir="${client_dir}/npm/${{ matrix.napi_platform }}"
            for client in discovery evidence relay breg; do
              cp "${GITHUB_WORKSPACE}/crates/registry-${client}-client-node/${client}-client.${{ matrix.napi_platform }}.node" \
                "${platform_dir}/"
            done
            (cd "${client_dir}" && npm pack \
              "./npm/${{ matrix.napi_platform }}" \
              --ignore-scripts --pack-destination "${RUNNER_TEMP}")
            platform_package="${RUNNER_TEMP}/registrystack-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${platform_package}"

            smoke="${RUNNER_TEMP}/node-rehearsal-registry"
            root_stage="${RUNNER_TEMP}/node-root-registry"
            mkdir -p "${smoke}" "${root_stage}"
            cp -R "${client_dir}/." "${root_stage}/"
            python3 release/scripts/client_registry.py bind-optional-deps \
              --package-json "${root_stage}/package.json" \
              --version "${CLIENT_VERSION}" \
              --client stack
            (cd "${root_stage}" && npm pack \
              --ignore-scripts --pack-destination "${smoke}")
            root_package="${smoke}/registrystack-client-${CLIENT_VERSION}.tgz"
            test -f "${root_package}"
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund --ignore-scripts \
                "${root_package}" "${platform_package}"
              test -z "$(find node_modules/@registrystack/client \
                -maxdepth 1 -name '*.node' -print -quit)"
              test "$(find node_modules/@registrystack/client-${{ matrix.napi_platform }} \
                -maxdepth 1 -name '*.node' | wc -l)" -eq 4
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.js" \
                "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.mjs" .
              node smoke-registry-client-package.js
              node smoke-registry-client-package.mjs
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node smoke-registry-client-package.js
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node smoke-registry-client-package.mjs
            )
          fi
