name: Rehearse RegistryStack Release
run-name: Rehearse ${{ inputs.release_id }} v${{ inputs.version }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared canonical semantic version without the v prefix
        required: true
        type: string
      release_id:
        description: Prepared release train identity
        required: true
        type: string
      request_id:
        description: Unique operator-generated identity used to correlate this rehearsal
        required: true
        type: string
      advisory_evidence:
        description: Collect review-only image advisory evidence
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release image onboarding before builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a branch rehearsal
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "release rehearsal must run from a prepared branch" >&2
            exit 1
          fi

      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Check complete release image onboarding
        env:
          REHEARSAL_ADVISORY_EVIDENCE: ${{ inputs.advisory_evidence }}
          REHEARSAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          onboarding=(
            python3 release/scripts/release_candidate.py check-image-onboarding
            --version "${REHEARSAL_VERSION}"
            --root .
          )
          case "${REHEARSAL_ADVISORY_EVIDENCE}" in
            true) onboarding+=(--allow-missing-baseline) ;;
            false) ;;
            *) echo "advisory_evidence must be a typed boolean" >&2; exit 2 ;;
          esac
          "${onboarding[@]}"

  rehearse:
    name: Exercise future-tag release paths on Ubuntu
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Refresh protected-main comparison ref
        run: >-
          git fetch --no-tags --force origin
          refs/heads/main:refs/remotes/origin/main

      - name: Require reviewed image baselines for release rehearsal
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: >-
          python3 release/scripts/release_candidate.py check-image-onboarding
          --version "${REHEARSAL_VERSION}"
          --root .

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install exact docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Rehearse prepared release without publishing
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
          REHEARSAL_RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          release/scripts/rehearse-release
          --version "${REHEARSAL_VERSION}"
          --release-id "${REHEARSAL_RELEASE_ID}"
          --base-ref origin/main

  canonical-linux-binaries:
    name: Build canonical Linux ${{ matrix.group }} binary shard
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_BUILDER_IMAGE: rust:1.95-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    strategy:
      fail-fast: false
      matrix:
        group: [core, breg, casework]
    steps:
      - name: Checkout exact prepared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Restore reusable Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: registry-stack-release-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', 'release/scripts/build-release-binaries.sh', 'release/docker/Dockerfile.builder', 'release/requirements/ziglang-0.12.1.txt', 'release/glibc-floor.env', 'release/scripts/zig-glibc-compiler') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            registry-stack-release-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', 'release/scripts/build-release-binaries.sh', 'release/docker/Dockerfile.builder', 'release/requirements/ziglang-0.12.1.txt', 'release/glibc-floor.env', 'release/scripts/zig-glibc-compiler') }}-

      - name: Build canonical Linux binary shard
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          REHEARSAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release/scripts/build-release-binaries.sh \
            --group "${{ matrix.group }}" \
            "${REHEARSAL_VERSION}"

      - name: Stage canonical Linux binary shard
        run: |
          set -euo pipefail
          mkdir binary-shard
          cp -R dist/bin binary-shard/bin
          cp dist/RELEASE_BINARY_SHARD dist/RELEASE_BUILDER_IMAGE binary-shard/

      - name: Upload canonical Linux binary shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-binaries-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shard
          if-no-files-found: error
          retention-days: 2

  canonical-linux:
    name: Prove the canonical Linux payload
    needs:
      - validate
      - canonical-linux-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_BUILDER_IMAGE: rust:1.95-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
      RELEASE_BUILDX_VERSION: v0.33.0
      RELEASE_BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      REHEARSAL_REGISTRY_IMAGE: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
      SYFT_VERSION: v1.45.1
      SYFT_LINUX_AMD64_SHA256: 20c84195e24927f50a3b2269946be51f4c4abc9d2f145fee7388b4199149f716
      GRYPE_VERSION: v0.114.0
      GRYPE_LINUX_AMD64_SHA256: edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343
      CRANE_VERSION: v0.21.2
      CRANE_LINUX_AMD64_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
      ORAS_VERSION: v1.3.2
      ORAS_LINUX_AMD64_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
    steps:
      - name: Checkout exact prepared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download canonical Linux core binary shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal-binaries-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/core

      - name: Download canonical Linux breg binary shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal-binaries-breg-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/breg

      - name: Download canonical Linux Casework binary shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal-binaries-casework-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/casework

      - name: Merge and smoke the canonical Linux payload
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release/scripts/merge-release-binary-shards.py \
            --version "${REHEARSAL_VERSION}" \
            --source-sha "${{ github.sha }}" \
            --core binary-shards/core \
            --breg binary-shards/breg \
            --casework binary-shards/casework \
            --output dist \
            --builder-image "${RELEASE_BUILDER_IMAGE}"
          test "$("dist/bin/breg-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
            "breg ${REHEARSAL_VERSION}"
          test "$("dist/bin/bregctl-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
            "bregctl ${REHEARSAL_VERSION}"
          IFS=. read -r release_major release_minor _release_patch \
            <<<"${REHEARSAL_VERSION}"
          if (( release_major > 0 || release_minor >= 30 )); then
            test "$("dist/bin/casework-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
              "casework ${REHEARSAL_VERSION}"
            test "$("dist/bin/caseworkctl-v${REHEARSAL_VERSION}-linux-amd64" --version)" = \
              "caseworkctl ${REHEARSAL_VERSION}"
          fi

      - name: Set up Docker Buildx for advisory evidence
        if: ${{ inputs.advisory_evidence }}
        id: advisory-buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.RELEASE_BUILDX_VERSION }}
          driver-opts: image=${{ env.RELEASE_BUILDKIT_IMAGE }}

      - name: Install pinned advisory evidence tools
        if: ${{ inputs.advisory_evidence }}
        env:
          STEP_CRANE_SHA256: ${{ env.CRANE_LINUX_AMD64_SHA256 }}
          STEP_CRANE_VERSION: ${{ env.CRANE_VERSION }}
          STEP_GRYPE_SHA256: ${{ env.GRYPE_LINUX_AMD64_SHA256 }}
          STEP_GRYPE_VERSION: ${{ env.GRYPE_VERSION }}
          STEP_ORAS_SHA256: ${{ env.ORAS_LINUX_AMD64_SHA256 }}
          STEP_ORAS_VERSION: ${{ env.ORAS_VERSION }}
          STEP_SYFT_SHA256: ${{ env.SYFT_LINUX_AMD64_SHA256 }}
          STEP_SYFT_VERSION: ${{ env.SYFT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin" "${RUNNER_TEMP}/tools"
          syft_version="${STEP_SYFT_VERSION#v}"
          grype_version="${STEP_GRYPE_VERSION#v}"
          oras_version="${STEP_ORAS_VERSION#v}"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/${STEP_SYFT_VERSION}/syft_${syft_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/syft.tar.gz"
          echo "${STEP_SYFT_SHA256}  ${RUNNER_TEMP}/tools/syft.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/syft.tar.gz" \
            -C "${HOME}/.local/bin" syft
          curl -sSfL \
            "https://github.com/anchore/grype/releases/download/${STEP_GRYPE_VERSION}/grype_${grype_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/grype.tar.gz"
          echo "${STEP_GRYPE_SHA256}  ${RUNNER_TEMP}/tools/grype.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/grype.tar.gz" \
            -C "${HOME}/.local/bin" grype
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${STEP_CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/crane.tar.gz"
          echo "${STEP_CRANE_SHA256}  ${RUNNER_TEMP}/tools/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/crane.tar.gz" \
            -C "${HOME}/.local/bin" crane
          curl -sSfL \
            "https://github.com/oras-project/oras/releases/download/${STEP_ORAS_VERSION}/oras_${oras_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/oras.tar.gz"
          echo "${STEP_ORAS_SHA256}  ${RUNNER_TEMP}/tools/oras.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/oras.tar.gz" \
            -C "${HOME}/.local/bin" oras
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Collect exact advisory review evidence
        if: ${{ inputs.advisory_evidence }}
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
          REHEARSAL_SOURCE: https://github.com/${{ github.repository }}
          REHEARSAL_REVISION: ${{ github.sha }}
          REHEARSAL_BUILDX_BUILDER: ${{ steps.advisory-buildx.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          release/scripts/collect-rehearsal-advisory-evidence.py \
            --version "${REHEARSAL_VERSION}" \
            --source "${REHEARSAL_SOURCE}" \
            --revision "${REHEARSAL_REVISION}" \
            --buildx-builder "${REHEARSAL_BUILDX_BUILDER}" \
            --registry-image "${REHEARSAL_REGISTRY_IMAGE}" \
            --output "${RUNNER_TEMP}/release-advisory-evidence"

      - name: Upload advisory review evidence
        if: ${{ inputs.advisory_evidence }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-advisory-evidence-${{ inputs.version }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/release-advisory-evidence
          if-no-files-found: error
          retention-days: 8

  node-clients:
    name: Prove Linux Node clients for ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CLIENT_VERSION: ${{ inputs.version }}
      RUSTUP_TOOLCHAIN: "1.95.0"
      NODE_GLIBC_BASELINE_IMAGE: node:22.12.0-bullseye-slim@sha256:52e4282a01d63eb4cfce7a395364d366cee488c278079110d3aa49dd21b2bf18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-amd64-glibc
            target: x86_64-unknown-linux-gnu
            napi_platform: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            asset: linux-arm64-glibc
            target: aarch64-unknown-linux-gnu
            napi_platform: linux-arm64-gnu
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            crates/registry-discovery-client-node/package-lock.json
            crates/registry-evidence-client-node/package-lock.json
            crates/registry-relay-client-node/package-lock.json
            crates/registry-breg-client-node/package-lock.json
            crates/registry-casework-client-node/package-lock.json
            crates/registry-stack-client-node/package-lock.json

      - name: Install exact Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          python3 -m venv "${RUNNER_TEMP}/maturin"
          "${RUNNER_TEMP}/maturin/bin/pip" install --quiet \
            --require-hashes --only-binary=:all: \
            --requirement "${GITHUB_WORKSPACE}/release/requirements/maturin-1.9.6.txt"
          test "$("${RUNNER_TEMP}/maturin/bin/python" -m ziglang version)" = 0.12.1

      - name: Build, package, and smoke Linux Node clients
        shell: bash
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"${CLIENT_VERSION}"
          unified_client=0
          if (( major > 0 || minor > 26 || (minor == 26 && patch >= 1) )); then
            unified_client=1
          fi
          clients=(discovery evidence relay)
          if [[ "${unified_client}" -eq 1 ]]; then
            clients+=(breg casework)
          fi
          for client in "${clients[@]}"; do
            client_dir="${GITHUB_WORKSPACE}/crates/registry-${client}-client-node"
            (cd "${client_dir}" && npm ci)
            test "$(node -p "require('${client_dir}/package.json').version")" = \
              "${CLIENT_VERSION}"
            release/scripts/build-linux-node-client \
              --client "${client}" \
              --target "${{ matrix.target }}" \
              --napi-platform "${{ matrix.napi_platform }}" \
              --zig-python "${RUNNER_TEMP}/maturin/bin/python"

            if [[ "${unified_client}" -eq 1 ]]; then
              continue
            fi
            platform_dir="${client_dir}/npm/${{ matrix.napi_platform }}"
            test -f "${platform_dir}/package.json"
            cp "${client_dir}/LICENSE" "${platform_dir}/LICENSE"
            cp "${client_dir}/${client}-client.${{ matrix.napi_platform }}.node" \
              "${platform_dir}/"
            (cd "${client_dir}" && npm pack \
              "./npm/${{ matrix.napi_platform }}" \
              --ignore-scripts --pack-destination "${RUNNER_TEMP}")
            platform_package="${RUNNER_TEMP}/registrystack-${client}-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${platform_package}"

            smoke="${RUNNER_TEMP}/node-rehearsal-${client}"
            mkdir -p "${smoke}"
            root_stage="${RUNNER_TEMP}/node-root-${client}"
            mkdir -p "${root_stage}"
            for source in \
              LICENSE README.md client.js client.d.ts index.js index.d.ts package.json; do
              cp "${client_dir}/${source}" "${root_stage}/${source}"
            done
            python3 release/scripts/client_registry.py bind-optional-deps \
              --package-json "${root_stage}/package.json" \
              --version "${CLIENT_VERSION}" \
              --client "${client}"
            (cd "${root_stage}" && npm pack \
              --ignore-scripts --pack-destination "${smoke}")
            root_package="${smoke}/registrystack-${client}-client-${CLIENT_VERSION}.tgz"
            test -f "${root_package}"
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund --ignore-scripts \
                "${root_package}" "${platform_package}"
              test -z "$(find "node_modules/@registrystack/${client}-client" \
                -maxdepth 1 -name '*.node' -print -quit)"
              test -f \
                "node_modules/@registrystack/${client}-client-${{ matrix.napi_platform }}/${client}-client.${{ matrix.napi_platform }}.node"
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-${client}-client-package.js" .
              node "smoke-${client}-client-package.js"
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node "smoke-${client}-client-package.js"
            )
          done
          if [[ "${unified_client}" -eq 1 ]]; then
            client_dir="${GITHUB_WORKSPACE}/crates/registry-stack-client-node"
            platform_dir="${client_dir}/npm/${{ matrix.napi_platform }}"
            for client in discovery evidence relay breg casework; do
              cp "${GITHUB_WORKSPACE}/crates/registry-${client}-client-node/${client}-client.${{ matrix.napi_platform }}.node" \
                "${platform_dir}/"
            done
            (cd "${client_dir}" && npm pack \
              "./npm/${{ matrix.napi_platform }}" \
              --ignore-scripts --pack-destination "${RUNNER_TEMP}")
            platform_package="${RUNNER_TEMP}/registrystack-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${platform_package}"

            smoke="${RUNNER_TEMP}/node-rehearsal-registry"
            root_stage="${RUNNER_TEMP}/node-root-registry"
            mkdir -p "${smoke}" "${root_stage}"
            cp -R "${client_dir}/." "${root_stage}/"
            python3 release/scripts/client_registry.py bind-optional-deps \
              --package-json "${root_stage}/package.json" \
              --version "${CLIENT_VERSION}" \
              --client stack
            (cd "${root_stage}" && npm pack \
              --ignore-scripts --pack-destination "${smoke}")
            root_package="${smoke}/registrystack-client-${CLIENT_VERSION}.tgz"
            test -f "${root_package}"
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund --ignore-scripts \
                "${root_package}" "${platform_package}"
              test -z "$(find node_modules/@registrystack/client \
                -maxdepth 1 -name '*.node' -print -quit)"
              test "$(find node_modules/@registrystack/client-${{ matrix.napi_platform }} \
                -maxdepth 1 -name '*.node' | wc -l)" -eq 5
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.js" \
                "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.mjs" .
              node smoke-registry-client-package.js
              node smoke-registry-client-package.mjs
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node smoke-registry-client-package.js
              docker run --rm --network none \
                --volume "${smoke}:${smoke}:ro" \
                --workdir "${smoke}" \
                "${NODE_GLIBC_BASELINE_IMAGE}" \
                node smoke-registry-client-package.mjs
            )
          fi
