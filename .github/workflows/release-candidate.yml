name: RegistryStack Release Candidate
run-name: Release candidate ${{ github.event.client_payload.release_id }} v${{ github.event.client_payload.version }} (${{ github.event.client_payload.request_id }})

on:
  repository_dispatch:
    types: [release_candidate]

permissions:
  contents: read

concurrency:
  group: registry-stack-release-candidate-${{ github.event.client_payload.release_unit || 'stack' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: registrystack
  RELEASE_BUILDER_IMAGE: rust:1.95-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
  RELEASE_BUILDX_VERSION: v0.33.0
  RELEASE_BUILDKIT_IMAGE: ghcr.io/registrystack/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  SYFT_VERSION: v1.45.1
  SYFT_LINUX_AMD64_SHA256: 20c84195e24927f50a3b2269946be51f4c4abc9d2f145fee7388b4199149f716
  GRYPE_VERSION: v0.114.0
  GRYPE_LINUX_AMD64_SHA256: edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343
  COSIGN_VERSION: v3.0.4
  COSIGN_LINUX_AMD64_SHA256: 10dab2fd2170b5aa0d5c0673a9a2793304960220b314f6a873bf39c2f08287aa
  CRANE_VERSION: v0.21.2
  CRANE_LINUX_AMD64_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
  ORAS_VERSION: v1.3.2
  ORAS_LINUX_AMD64_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf

jobs:
  validate:
    name: Validate request and all build-independent controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      workflow_revision: ${{ steps.request.outputs.workflow_revision }}
      version: ${{ steps.request.outputs.version }}
      release_id: ${{ steps.request.outputs.release_id }}
      tag: ${{ steps.request.outputs.tag }}
      unit: ${{ steps.request.outputs.unit }}
      asset_tag: ${{ steps.request.outputs.asset_tag }}
      prefix: ${{ steps.request.outputs.prefix }}
      bundle_name: ${{ steps.request.outputs.bundle_name }}
      binary_groups: ${{ steps.request.outputs.binary_groups }}
      exclude_discovery: ${{ steps.request.outputs.exclude_discovery }}
      manifest: ${{ steps.request.outputs.manifest }}
      image_names: ${{ steps.request.outputs.image_names }}
    steps:
      - name: Checkout protected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.16"

      - name: Validate request, source, and destinations
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_EVENT_ACTION: ${{ github.event.action }}
          REQUEST_UNIT: ${{ github.event.client_payload.release_unit || 'stack' }}
          REQUEST_VERSION: ${{ github.event.client_payload.version }}
          REQUEST_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          REQUEST_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "repository_dispatch" ||
                "${REQUEST_EVENT_ACTION}" != "release_candidate" ]]; then
            echo "Candidate accepts only repository_dispatch:release_candidate" >&2
            exit 1
          fi
          if [[ ! "${REQUEST_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be canonical semantic version text" >&2
            exit 1
          fi
          case "${REQUEST_UNIT}" in
            stack) prefix=registry-stack; binary_groups='["core","breg","casework","scheduling","messaging"]' ;;
            discovery) prefix=registry-discovery; binary_groups='["discovery"]' ;;
            *) echo "unsupported release unit" >&2; exit 1 ;;
          esac
          IFS=. read -r request_major request_minor _ <<< "${REQUEST_VERSION}"
          if [[ "${REQUEST_UNIT}" == stack ]] && (( request_major == 0 && request_minor < 19 )); then
            echo "pre-v0.19 releases are immutable historical evidence; use the corresponding v${REQUEST_VERSION} Git tag and archived assets" >&2
            exit 1
          fi
          release_image_names="$(
            python3 release/scripts/release_candidate.py image-names \
              --version "${REQUEST_VERSION}" --unit "${REQUEST_UNIT}"
          )"
          exclude_discovery=false
          if [[ "${REQUEST_UNIT}" == stack ]]; then
            exclude_discovery="$(PYTHONPATH=release/scripts python3 - "${REQUEST_VERSION}" <<'PYUNIT'
          import sys
          from pathlib import Path
          from release_distribution import load_components
          print("true" if load_components(Path.cwd(), sys.argv[1]) else "false")
          PYUNIT
            )"
            if [[ "${exclude_discovery}" == true ]]; then
              selected_images=
              for image in ${release_image_names}; do
                if [[ "${image}" != discovery ]]; then selected_images+="${image} "; fi
              done
              release_image_names="${selected_images% }"
            fi
          fi
          if [[ ! "${REQUEST_RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "release_id is invalid" >&2
            exit 1
          fi
          if [[ ! "${REQUEST_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "request_id is invalid" >&2
            exit 1
          fi
          if [[ ! "${REQUEST_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be one exact commit" >&2
            exit 1
          fi
          workflow_revision="${GITHUB_SHA}"
          if [[ "${REQUEST_SOURCE_SHA}" != "${workflow_revision}" ]]; then
            echo "source_sha must equal the protected workflow revision" >&2
            exit 1
          fi
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${REQUEST_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${REQUEST_SOURCE_SHA}" refs/remotes/origin/main
          git merge-base --is-ancestor \
            "${workflow_revision}" refs/remotes/origin/main
          uv run --no-project --with PyYAML==6.0.2 python3 release/scripts/registry-release validate-source-commit \
            --source-sha "${REQUEST_SOURCE_SHA}"
          asset_tag="v${REQUEST_VERSION}"
          tag="${asset_tag}"
          if [[ "${REQUEST_UNIT}" != stack ]]; then tag="${REQUEST_UNIT}/${asset_tag}"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" \
              >/dev/null 2>&1; then
            echo "tag ${tag} already exists" >&2
            exit 1
          else
            tag_lookup_status=$?
            if [[ "${tag_lookup_status}" -ne 2 ]]; then
              echo "cannot prove tag ${tag} is absent: git ls-remote exited ${tag_lookup_status}" >&2
              exit 1
            fi
          fi
          release_response="${RUNNER_TEMP}/release-response"
          encoded_tag="$(jq -rn --arg tag "${tag}" '$tag | @uri')"
          if gh api --include --silent \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}" \
              >"${release_response}" 2>&1; then
            release_status=200
          else
            release_status="$(
              python3 release/scripts/release_workflow_guard.py http-status \
                --response "${release_response}"
            )"
          fi
          if [[ "${release_status}" != "404" ]]; then
            echo "GitHub Release destination is not absent" >&2
            exit 1
          fi
          for package in ${release_image_names}; do
            package_metadata="${RUNNER_TEMP}/${package}-package.json"
            if ! gh api \
                "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}" \
                > "${package_metadata}"; then
              echo "GHCR package ${package} must be provisioned before release" >&2
              exit 1
            fi
            python3 release/scripts/release_workflow_guard.py \
              require-package-visibility \
              --metadata "${package_metadata}" \
              --package "${package}" \
              --visibility public
            candidate_package="${package}-candidate"
            candidate_package_metadata="${RUNNER_TEMP}/${candidate_package}-package.json"
            if ! gh api \
                "/orgs/${IMAGE_NAMESPACE}/packages/container/${candidate_package}" \
                > "${candidate_package_metadata}"; then
              echo "GHCR package ${candidate_package} must be provisioned before release" >&2
              exit 1
            fi
            python3 release/scripts/release_workflow_guard.py \
              require-package-visibility \
              --metadata "${candidate_package_metadata}" \
              --package "${candidate_package}" \
              --visibility private
            versions="${RUNNER_TEMP}/${package}-versions.json"
            gh api --paginate --slurp \
              "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}/versions?per_page=100" \
              > "${versions}"
            python3 release/scripts/release_workflow_guard.py \
              require-image-tag-absent \
              --metadata "${versions}" \
              --tag "${asset_tag}"
          done
          manifest=
          if [[ "${REQUEST_UNIT}" == stack ]]; then
          manifest="$(
            uv run --no-project --with PyYAML==6.0.2 python3 - "${REQUEST_VERSION}" "${REQUEST_RELEASE_ID}" <<'PY'
          import glob
          import sys
          import yaml

          version, release_id = sys.argv[1:]
          matches = []
          for path in sorted(glob.glob("release/manifests/registry-stack-*.yaml")):
              with open(path, encoding="utf-8") as handle:
                  stack = yaml.safe_load(handle).get("stack", {})
              if str(stack.get("version", "")) == version:
                  matches.append((path, stack))
          if len(matches) != 1:
              raise SystemExit(f"expected one manifest for {version}, found {matches}")
          path, stack = matches[0]
          if stack.get("release") != release_id:
              raise SystemExit("manifest release identity does not match request")
          print(path)
          PY
          )"
          else
            python3 release/scripts/unit_release_pipeline.py prepare \
              --unit "${REQUEST_UNIT}" --version "${REQUEST_VERSION}" \
              --release-id "${REQUEST_RELEASE_ID}"
          fi
          {
            echo "unit=${REQUEST_UNIT}"
            echo "asset_tag=${asset_tag}"
            echo "prefix=${prefix}"
            echo "bundle_name=${prefix}-${asset_tag}-candidate.tar.gz"
            echo "binary_groups=${binary_groups}"
            echo "exclude_discovery=${exclude_discovery}"
            echo "source_sha=${REQUEST_SOURCE_SHA}"
            echo "workflow_revision=${workflow_revision}"
            echo "version=${REQUEST_VERSION}"
            echo "release_id=${REQUEST_RELEASE_ID}"
            echo "tag=${tag}"
            echo "manifest=${manifest}"
            echo "image_names=${release_image_names}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate manifests, pins, recipes, and scanner policy fixtures
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.request.outputs.source_sha }}"
          python3 release/scripts/release_candidate.py check-image-onboarding \
            --version "${{ steps.request.outputs.version }}" \
            --root . --unit "${{ steps.request.outputs.unit }}" \
            --allow-missing-baseline
          if [[ "${{ steps.request.outputs.unit }}" == stack ]]; then
          uv run --no-project --with PyYAML==6.0.2 python3 release/scripts/registry-release validate \
            "${{ steps.request.outputs.manifest }}"
          uv run --no-project --with PyYAML==6.0.2 python3 release/scripts/registry-release validate-docsets
          fi
          cargo metadata --locked --format-version 1 >/dev/null
          uv run --no-project --with PyYAML==6.0.2 release/scripts/check-release-source-model.sh
          release/scripts/check-debian13-images.py

      - name: Install checksum signature verifier for selected components
        if: steps.request.outputs.exclude_discovery == 'true'
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "${RUNNER_TEMP}/cosign"
          printf '%s  %s\n' "${COSIGN_LINUX_AMD64_SHA256}" "${RUNNER_TEMP}/cosign" | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/cosign" "${HOME}/.local/bin/cosign"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Authenticate exact previously published components
        if: steps.request.outputs.exclude_discovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir distribution
          python3 release/scripts/release_distribution.py resolve \
            --repo . --repository "${GITHUB_REPOSITORY}" \
            --stack-version "${{ steps.request.outputs.version }}" \
            --output "distribution/registry-stack-${{ steps.request.outputs.asset_tag }}-distribution.json"

      - name: Retain authenticated component lock
        if: steps.request.outputs.exclude_discovery == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: distribution/*.json
          if-no-files-found: error
          retention-days: 2

  protected-ci:
    name: Require exact protected-main CI before candidate attestation
    needs: validate
    runs-on: ubuntu-24.04
    # Allow the full CI path and runner queues; the release budget is a target,
    # not a deadline for cancelling otherwise healthy verification.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout protected verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_revision }}
          persist-credentials: false
          submodules: false

      - name: Wait for successful push CI on the exact main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release/scripts/registry-release wait-for-ci \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --repository "${GITHUB_REPOSITORY}"

  build-canonical-binaries:
    name: Build canonical Linux ${{ matrix.group }} binary shard
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.validate.outputs.binary_groups) }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Restore reusable Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: registry-stack-release-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', 'release/scripts/build-release-binaries.sh', 'release/docker/Dockerfile.builder', 'release/requirements/ziglang-0.12.1.txt', 'release/glibc-floor.env', 'release/scripts/zig-glibc-compiler', 'release/scripts/zig-glibc-toolchain.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            registry-stack-release-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', 'release/scripts/build-release-binaries.sh', 'release/docker/Dockerfile.builder', 'release/requirements/ziglang-0.12.1.txt', 'release/glibc-floor.env', 'release/scripts/zig-glibc-compiler', 'release/scripts/zig-glibc-toolchain.sh') }}-

      - name: Build canonical Linux binary shard
        env:
          RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then component_args+=(--exclude-unit discovery); fi
          release/scripts/build-release-binaries.sh "${component_args[@]}" \
            --group "${{ matrix.group }}" \
            "${{ needs.validate.outputs.version }}"

      - name: Stage canonical Linux binary shard
        run: |
          set -euo pipefail
          mkdir binary-shard
          cp -R dist/bin binary-shard/bin
          cp dist/RELEASE_BINARY_SHARD dist/RELEASE_BUILDER_IMAGE binary-shard/

      - name: Upload canonical Linux binary shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-linux-binaries-${{ matrix.group }}-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shard
          if-no-files-found: error
          retention-days: 2

  build-canonical:
    name: Build Linux payload and private images once
    needs:
      - validate
      - build-canonical-binaries
    runs-on: ubuntu-24.04
    # Covers an uncached canonical compile plus image work.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_IMAGE_NAMES: ${{ needs.validate.outputs.image_names }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download canonical Linux core binary shard
        if: needs.validate.outputs.unit == 'stack'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-core-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/core

      - name: Download canonical Linux breg binary shard
        if: needs.validate.outputs.unit == 'stack'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-breg-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/breg

      - name: Download canonical Linux Casework binary shard
        if: needs.validate.outputs.unit == 'stack'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-casework-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/casework

      - name: Download canonical Linux Scheduling binary shard
        if: needs.validate.outputs.unit == 'stack'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-scheduling-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/scheduling

      - name: Download canonical Linux Messaging binary shard
        if: needs.validate.outputs.unit == 'stack'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-messaging-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/messaging

      - name: Download canonical Discovery binary shard
        if: needs.validate.outputs.unit == 'discovery'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-linux-binaries-discovery-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: binary-shards/discovery

      - name: Merge and smoke the Discovery payload
        if: needs.validate.outputs.unit == 'discovery'
        run: |
          set -euo pipefail
          python3 release/scripts/unit_release_pipeline.py merge-shard \
            --unit discovery --version "${{ needs.validate.outputs.version }}" \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --shard binary-shards/discovery --output dist \
            --builder-image "${RELEASE_BUILDER_IMAGE}"
          for binary in discovery discoveryctl; do
            test "$("dist/bin/${binary}-${{ needs.validate.outputs.asset_tag }}-linux-amd64" --version)" = \
              "${binary} ${{ needs.validate.outputs.version }}"
          done

      - name: Merge and smoke the canonical Linux payload
        if: needs.validate.outputs.unit == 'stack'
        run: |
          set -euo pipefail
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then component_args+=(--exclude-unit discovery); fi
          release/scripts/merge-release-binary-shards.py "${component_args[@]}" \
            --version "${{ needs.validate.outputs.version }}" \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --core binary-shards/core \
            --breg binary-shards/breg \
            --casework binary-shards/casework \
            --scheduling binary-shards/scheduling \
            --messaging binary-shards/messaging \
            --output dist \
            --builder-image "${RELEASE_BUILDER_IMAGE}"
          IFS=. read -r release_major release_minor _release_patch \
            <<<"${{ needs.validate.outputs.version }}"
          if (( release_major > 0 || release_minor >= 26 )); then
            test "$("dist/bin/breg-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "breg ${{ needs.validate.outputs.version }}"
            test "$("dist/bin/bregctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "bregctl ${{ needs.validate.outputs.version }}"
          fi
          discoveryctl_in_release="$(python3 release/scripts/release_roster.py \
            discoveryctl-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${discoveryctl_in_release}" == true && "${{ needs.validate.outputs.exclude_discovery }}" != true ]]; then
            test "$("dist/bin/discoveryctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "discoveryctl ${{ needs.validate.outputs.version }}"
          fi
          scheduling_binary_in_release="$(python3 release/scripts/release_roster.py \
            scheduling-binary-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${scheduling_binary_in_release}" == true ]]; then
            test "$("dist/bin/scheduling-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "scheduling ${{ needs.validate.outputs.version }}"
          fi
          breg_services_in_release="$(python3 release/scripts/release_roster.py \
            breg-services-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${breg_services_in_release}" == true ]]; then
            for breg_service in breg-mcp breg-review; do
              test "$("dist/bin/${breg_service}-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
                "${breg_service} ${{ needs.validate.outputs.version }}"
              test "$("dist/image-bin/${breg_service}" --version)" = \
                "${breg_service} ${{ needs.validate.outputs.version }}"
            done
          fi
          if (( release_major > 0 || release_minor >= 30 )); then
            test "$("dist/bin/casework-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "casework ${{ needs.validate.outputs.version }}"
            test "$("dist/bin/caseworkctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "caseworkctl ${{ needs.validate.outputs.version }}"
          fi
          if (( release_major > 0 || release_minor >= 33 )); then
            test "$(dist/image-bin/scheduling --version)" = \
              "scheduling ${{ needs.validate.outputs.version }}"
          fi
          if (( release_major > 0 || release_minor >= 36 )); then
            test "$("dist/bin/schedulingctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "schedulingctl ${{ needs.validate.outputs.version }}"
            for operator_tool in bregctl caseworkctl schedulingctl; do
              test "$("dist/image-bin/${operator_tool}" --version)" = \
                "${operator_tool} ${{ needs.validate.outputs.version }}"
            done
          fi
          messaging_in_release="$(python3 release/scripts/release_roster.py \
            messaging-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${messaging_in_release}" == true ]]; then
            test "$("dist/bin/messaging-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "messaging ${{ needs.validate.outputs.version }}"
            test "$("dist/bin/messagingctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "messagingctl ${{ needs.validate.outputs.version }}"
            test "$(dist/image-bin/messagingctl --version)" = \
              "messagingctl ${{ needs.validate.outputs.version }}"
          fi
          coordinator_in_release="$(python3 release/scripts/release_roster.py \
            coordinator-binaries-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${coordinator_in_release}" == true ]]; then
            test "$("dist/bin/coordinator-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "coordinator ${{ needs.validate.outputs.version }}"
            test "$("dist/bin/coordinatorctl-${{ needs.validate.outputs.tag }}-linux-amd64" --version)" = \
              "coordinatorctl ${{ needs.validate.outputs.version }}"
            if [[ "$(python3 release/scripts/release_roster.py coordinator-in-release "${{ needs.validate.outputs.version }}")" == true ]]; then
              test "$(dist/image-bin/coordinator --version)" = \
                "coordinator ${{ needs.validate.outputs.version }}"
              test "$(dist/image-bin/coordinatorctl --version)" = \
                "coordinatorctl ${{ needs.validate.outputs.version }}"
            fi
            coordinatorctl_binary="${GITHUB_WORKSPACE}/dist/bin/coordinatorctl-${{ needs.validate.outputs.tag }}-linux-amd64"
            coordinator_project="${RUNNER_TEMP}/release-coordinator-project"
            "${coordinatorctl_binary}" init --directory "${coordinator_project}"
            "${coordinatorctl_binary}" check --project "${coordinator_project}"
          fi

          render_in_release="$(python3 release/scripts/release_roster.py \
            render-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${render_in_release}" == true ]]; then
            render_binary="${GITHUB_WORKSPACE}/dist/bin/registry-render-${{ needs.validate.outputs.tag }}-linux-amd64"
            typst_pin="$(sed -n 's/^pub const TYPST_PIN: &str = "\([^" ]*\)";$/\1/p' crates/registry-render/src/lib.rs)"
            test -n "${typst_pin}"
            expected_render_version="registry-render ${{ needs.validate.outputs.version }} (typst ${typst_pin})"
            test "$("${render_binary}" --version)" = "${expected_render_version}"
            test "$(dist/image-bin/registry-render --version)" = "${expected_render_version}"
            render_project="${RUNNER_TEMP}/release-render-project"
            render_package="${RUNNER_TEMP}/release-render-package"
            "${render_binary}" init "${render_project}"
            "${render_binary}" check --bundle "${render_project}"
            "${render_binary}" package --bundle "${render_project}" --output "${render_package}"
            "${render_binary}" compile --bundle "${render_package}" --type letter \
              --data "${render_project}/fixtures/data.json" --issued-at 2026-01-01T00:00:00Z \
              --strict --out "${RUNNER_TEMP}/release-render-letter.pdf"
            test -s "${RUNNER_TEMP}/release-render-letter.pdf"
          fi
          oid4vci_image_in_release="$(python3 release/scripts/release_roster.py \
            evidence-oid4vci-image-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${oid4vci_image_in_release}" == true ]]; then
            test "$(dist/image-bin/evidence-oid4vci --version)" = \
              "evidence-oid4vci ${{ needs.validate.outputs.version }}"
          fi

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.RELEASE_BUILDX_VERSION }}
          driver-opts: image=${{ env.RELEASE_BUILDKIT_IMAGE }}

      - name: Build private candidate image layouts once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/images
          for name in ${RELEASE_IMAGE_NAMES}; do
            package="${name}-candidate"
            candidate="${REGISTRY}/${IMAGE_NAMESPACE}/${package}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            metadata="dist/images/${name}.metadata.json"
            layout="${GITHUB_WORKSPACE}/dist/images/${name}.oci"
            RELEASE_BUILDX_BUILDER="${{ steps.buildx.outputs.name }}" \
              RELEASE_IMAGE_OCI_LAYOUT="${layout}" \
              release/scripts/build-release-image.sh \
                "${name}" "${candidate}" \
                "https://github.com/${GITHUB_REPOSITORY}" \
                "${{ needs.validate.outputs.source_sha }}" \
                "${{ needs.validate.outputs.version }}" \
                "${metadata}"
            digest="$(
              jq -er '."containerimage.digest"
                | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata}"
            )"
            printf '%s\n' \
              "${REGISTRY}/${IMAGE_NAMESPACE}/${package}@${digest}" \
              > "dist/images/${name}.digest"
          done

      - name: Stage canonical build products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-canonical/dist
          cp -R dist/bin candidate-canonical/dist/bin
          cp -R dist/images candidate-canonical/dist/images

      - name: Upload canonical build products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-canonical
          if-no-files-found: error
          retention-days: 2

  build-docs:
    if: needs.validate.outputs.unit == 'stack'
    name: Build exact release docs archive once
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Setup Node for exact release docs archive
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Package exact release docs archive
        working-directory: docs/site
        env:
          DOCS_ARCHIVE_OUTPUT: ${{ runner.temp }}/registry-docs-${{ needs.validate.outputs.tag }}.tar.gz
          DOCS_DOCSET: ${{ needs.validate.outputs.tag }}
        # Nothing here runs Vale, the only package with an install script this
        # step would use. Its postinstall fetches through the unauthenticated
        # GitHub API, which refuses shared runner addresses once their hourly
        # limit is spent, so install scripts are skipped.
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build:archive
          npm run archive:snapshot -- \
            "${DOCS_DOCSET}" \
            --output "${DOCS_ARCHIVE_OUTPUT}" \
            --verify-lock

      - name: Upload exact release docs archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-docs-${{ needs.validate.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  build-platforms:
    if: needs.validate.outputs.unit == 'stack'
    name: Build native ${{ matrix.asset }} payload once
    needs: validate
    runs-on: ${{ matrix.runner }}
    # Covers an uncached native compile through the pinned Zig toolchain,
    # AWS-LC-FIPS included, plus the toolchain install.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Selects the minimal toolchain installed below, as the clients job
      # does. Otherwise rustup also installs rust-toolchain.toml's rustfmt
      # and clippy, which the build does not use and which the arm64 runner
      # image refuses as a file conflict.
      RUSTUP_TOOLCHAIN: "1.95.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Go for the AWS-LC-FIPS source build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false

      - name: Build native platform payload once
        shell: bash
        env:
          REGISTRY_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 \
            --profile minimal --target "${{ matrix.target }}"
          # The runner's glibc is newer than the release floor. Compile and
          # link through the same pinned Zig toolchain as the canonical Linux
          # recipe, so the floor is set by release/glibc-floor.env and never
          # by the runner image.
          . release/scripts/zig-glibc-toolchain.sh
          install_zig_glibc_toolchain "${RUNNER_TEMP:?RUNNER_TEMP is required}/zig-glibc-toolchain"
          cargo build --release --locked \
            -p registry-evidence -p registry-evidencectl \
            -p registry-evidence-oid4vci \
            --target "${{ matrix.target }}"
          rstack_in_release="$(python3 release/scripts/release_roster.py \
            rstack-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${rstack_in_release}" == true ]]; then
            cargo build --release --locked \
              -p registry-rstack --bin rstack \
              --target "${{ matrix.target }}"
          fi
          IFS=. read -r release_major release_minor _release_patch \
            <<<"${{ needs.validate.outputs.version }}"
          include_breg=0
          if (( release_major > 0 || release_minor >= 26 )); then
            include_breg=1
            cargo build --release --locked \
              -p registry-breg --bin breg --features runtime \
              --target "${{ matrix.target }}"
            cargo build --release --locked \
              -p registry-bregctl \
              --target "${{ matrix.target }}"
          fi
          breg_services_in_release="$(python3 release/scripts/release_roster.py \
            breg-services-in-release "${{ needs.validate.outputs.version }}")"
          if [[ "${breg_services_in_release}" == true ]]; then
            cargo build --release --locked \
              -p registry-breg-mcp --bin breg-mcp \
              --target "${{ matrix.target }}"
            cargo build --release --locked \
              -p registry-breg-review --bin breg-review \
              --target "${{ matrix.target }}"
          fi
          include_casework=0
          if (( release_major > 0 || release_minor >= 30 )); then
            include_casework=1
            cargo build --release --locked \
              -p registry-casework --bin casework \
              --target "${{ matrix.target }}"
            cargo build --release --locked \
              -p registry-caseworkctl --bin caseworkctl \
              --target "${{ matrix.target }}"
          fi
          include_schedulingctl=0
          if (( release_major > 0 || release_minor >= 36 )); then
            include_schedulingctl=1
            cargo build --release --locked \
              -p registry-schedulingctl --bin schedulingctl \
              --target "${{ matrix.target }}"
          fi
          mkdir -p platform
          if [[ "${rstack_in_release}" == true ]]; then
            asset="rstack-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/rstack" "platform/${asset}"
            chmod 0755 "platform/${asset}"
            test "$("platform/${asset}" --version)" = \
              "rstack ${{ needs.validate.outputs.version }}"
          fi
          for evidence_binary in evidence evidencectl evidence-oid4vci; do
            asset="${evidence_binary}-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/${evidence_binary}" \
              "platform/${asset}"
            chmod 0755 "platform/${asset}"
          done
          if [[ "${include_breg}" -eq 1 ]]; then
            for breg_binary in breg bregctl; do
              asset="${breg_binary}-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
              cp "target/${{ matrix.target }}/release/${breg_binary}" \
                "platform/${asset}"
              chmod 0755 "platform/${asset}"
              test "$("platform/${asset}" --version)" = \
                "${breg_binary} ${{ needs.validate.outputs.version }}"
            done
          fi
          if [[ "${breg_services_in_release}" == true ]]; then
            for breg_service in breg-mcp breg-review; do
              asset="${breg_service}-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
              cp "target/${{ matrix.target }}/release/${breg_service}" \
                "platform/${asset}"
              chmod 0755 "platform/${asset}"
              test "$("platform/${asset}" --version)" = \
                "${breg_service} ${{ needs.validate.outputs.version }}"
            done
          fi
          if [[ "${include_casework}" -eq 1 ]]; then
            for casework_binary in casework caseworkctl; do
              asset="${casework_binary}-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
              cp "target/${{ matrix.target }}/release/${casework_binary}" \
                "platform/${asset}"
              chmod 0755 "platform/${asset}"
              test "$("platform/${asset}" --version)" = \
                "${casework_binary} ${{ needs.validate.outputs.version }}"
            done
          fi
          if [[ "${include_schedulingctl}" -eq 1 ]]; then
            asset="schedulingctl-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/schedulingctl" "platform/${asset}"
            chmod 0755 "platform/${asset}"
            test "$("platform/${asset}" --version)" = \
              "schedulingctl ${{ needs.validate.outputs.version }}"
          fi
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            component_args+=(--exclude-unit discovery)
          fi
          bash release/scripts/build-additional-platform-binaries.sh \
            "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.tag }}" \
            "${{ matrix.target }}" platform "${component_args[@]}"
          mkdir -p candidate-platform
          mv platform candidate-platform/platform

      - name: Check arm64 Linux binaries against the glibc floor
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          release/scripts/check-glibc-floor.sh candidate-platform/platform/*

      - name: Upload native platform payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.asset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-platform
          if-no-files-found: error
          retention-days: 2

  build-macos-platforms:
    if: needs.validate.outputs.unit == 'stack'
    name: Build native macOS ${{ matrix.group }} payload once
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [core, breg, bregctl, casework, scheduling]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Go for the AWS-LC-FIPS source build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false

      - name: Build native macOS release shard
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 \
            --profile minimal --target aarch64-apple-darwin
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            component_args+=(--exclude-unit discovery)
          fi
          release/scripts/build-release-native-platform.sh \
            --group "${{ matrix.group }}" \
            --purpose candidate_input \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --output candidate-native-shard \
            "${component_args[@]}"
          # These groups contain complete installer toolsets. Exercise the
          # relocated release bytes while the Cargo output is unavailable.
          if [[ "${{ matrix.group }}" == core || "${{ matrix.group }}" == casework ||
                "${{ matrix.group }}" == scheduling ]]; then
            installer_assets="${RUNNER_TEMP}/macos-installer-assets"
            installer_destination="${RUNNER_TEMP}/macos-installer-bin"
            mkdir -p "${installer_assets}"
            cp candidate-native-shard/platform/* "${installer_assets}/"
            cp candidate-native-shard/SHA256SUMS "${installer_assets}/"
            mv target target.installer-smoke-hidden
            trap 'mv target.installer-smoke-hidden target' EXIT
            unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
            if [[ "${{ matrix.group }}" == core ]]; then
              EVIDENCECTL_VERSION="${{ needs.validate.outputs.tag }}" \
              EVIDENCECTL_ASSET_DIR="${installer_assets}" \
              EVIDENCECTL_INSTALL_DIR="${installer_destination}" \
                bash crates/registry-evidencectl/install.sh
            elif [[ "${{ matrix.group }}" == casework ]]; then
              CASEWORK_VERSION="${{ needs.validate.outputs.tag }}" \
              CASEWORK_ASSET_DIR="${installer_assets}" \
              CASEWORK_INSTALL_DIR="${installer_destination}" \
                bash crates/registry-casework/install.sh
            else
              # macOS publishes schedulingctl alone, which is this shard.
              SCHEDULING_VERSION="${{ needs.validate.outputs.tag }}" \
              SCHEDULING_ASSET_DIR="${installer_assets}" \
              SCHEDULING_INSTALL_DIR="${installer_destination}" \
                bash crates/registry-scheduling/install.sh
            fi
          fi

      - name: Upload native macOS release shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-native-macos-arm64-${{ needs.validate.outputs.version }}-${{ matrix.group }}-${{ needs.validate.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-native-shard
          if-no-files-found: error
          retention-days: 2

  clients:
    if: needs.validate.outputs.unit == 'stack'
    name: Build native client packages for ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CLIENT_VERSION: ${{ needs.validate.outputs.version }}
      CLIENT_TAG: ${{ needs.validate.outputs.tag }}
      RUSTUP_TOOLCHAIN: "1.95.0"
      # Native client packages are self-contained. aws-lc-fips-sys otherwise
      # defaults to a build-directory dylib on macOS.
      AWS_LC_FIPS_SYS_STATIC: "1"
      NODE_RUNTIME_SMOKE_IMAGE: registry.access.redhat.com/ubi8/nodejs-24-minimal:1-1791463611@sha256:dc01310904907c73f7e5faddc0bc062e6d24561a01716bbc6701ba2072e18e08
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-amd64-glibc
            target: x86_64-unknown-linux-gnu
            wheel_tag: cp311-abi3-linux_x86_64
            registry_wheel_tag: cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64
            napi_platform: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            asset: linux-arm64-glibc
            target: aarch64-unknown-linux-gnu
            wheel_tag: cp311-abi3-linux_aarch64
            registry_wheel_tag: cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64
            napi_platform: linux-arm64-gnu
          - runner: macos-26
            asset: macos-arm64
            target: aarch64-apple-darwin
            wheel_tag: cp311-abi3-macosx_11_0_arm64
            registry_wheel_tag: cp311-abi3-macosx_11_0_arm64
            napi_platform: darwin-arm64
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Go for the AWS-LC-FIPS source build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false

      - name: Setup minimum Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Retain minimum Node runtime for package smokes
        shell: bash
        run: |
          minimum_node_bin="$(command -v node)"
          [[ "${minimum_node_bin}" == /* ]]
          test "$("${minimum_node_bin}" --version)" = v24.11.0
          printf 'MINIMUM_NODE_BIN=%s\n' "${minimum_node_bin}" >> "${GITHUB_ENV}"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The napi-rs CLI's toolchain dependencies require Node 24.12 or
          # later. Package smokes independently exercise the retained minimum
          # Node 24.11 runtime.
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            crates/registry-discovery-client-node/package-lock.json
            crates/registry-evidence-client-node/package-lock.json
            crates/registry-breg-client-node/package-lock.json
            crates/registry-casework-client-node/package-lock.json
            crates/registry-messaging-client-node/package-lock.json
            crates/registry-scheduling-client-node/package-lock.json
            crates/registry-coordinator-client-node/package-lock.json
            crates/registry-stack-client-node/package-lock.json

      - name: Restore native client Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release-client-python
            target/release-client-node
          # AWS-LC does not track the deployment-target environment variable.
          # Exclude older runner images and builds without the macOS 11 pin.
          key: registry-stack-release-isolated-clients-go-1.27.2-zig-0.12.1-glibc-2.17-${{ matrix.asset }}-${{ matrix.asset == 'macos-arm64' && 'macos-26-deployment-11.0-' || '' }}${{ hashFiles('.github/workflows/release-candidate.yml', 'rust-toolchain.toml', 'Cargo.lock', 'release/requirements/maturin-1.9.6.txt', 'release/scripts/zig-glibc-compiler', 'release/scripts/build-linux-python-client', 'release/scripts/build-linux-node-client', 'release/scripts/assemble-registry-client-wheel.py', 'release/scripts/macos_fips_packaging.py', 'release/scripts/bundle-client-macos-fips.py', 'release/scripts/sync-registry-client-node.py', 'crates/registry-discovery-client-node/package-lock.json', 'crates/registry-evidence-client-node/package-lock.json', 'crates/registry-breg-client-node/package-lock.json', 'crates/registry-casework-client-node/package-lock.json', 'crates/registry-messaging-client-node/package-lock.json', 'crates/registry-scheduling-client-node/package-lock.json', 'crates/registry-coordinator-client-node/package-lock.json', 'crates/registry-stack-client-node/package-lock.json') }}
          restore-keys: |
            registry-stack-release-isolated-clients-go-1.27.2-zig-0.12.1-glibc-2.17-${{ matrix.asset }}-${{ matrix.asset == 'macos-arm64' && 'macos-26-deployment-11.0-' || '' }}

      - name: Build Python client wheels
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-client-python
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          python3 -m venv "${RUNNER_TEMP}/maturin"
          "${RUNNER_TEMP}/maturin/bin/pip" install --quiet \
            --require-hashes --only-binary=:all: \
            --requirement "${GITHUB_WORKSPACE}/release/requirements/maturin-1.9.6.txt"
          wheel_dir="${GITHUB_WORKSPACE}/candidate-client-package/clients"
          built_wheel_dir="${RUNNER_TEMP}/built-client-wheels"
          mkdir -p "${wheel_dir}" "${built_wheel_dir}"
          IFS=. read -r client_major client_minor client_patch <<<"${CLIENT_VERSION}"
          if [[ "${RUNNER_OS}" == macOS ]] &&
              (( client_major > 0 || client_minor >= 33 )); then
            export AWS_LC_FIPS_SYS_STATIC=0
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          unified_client=0
          if (( client_major > 0 || client_minor > 26 ||
                (client_minor == 26 && client_patch >= 1) )); then
            unified_client=1
          fi
          include_casework=0
          if (( client_major > 0 || client_minor >= 30 )); then
            include_casework=1
          fi
          clients=(discovery evidence)
          if [[ "${unified_client}" -eq 1 ]]; then
            clients+=(breg)
          fi
          if [[ "${include_casework}" -eq 1 ]]; then
            clients+=(casework)
          fi
          messaging_in_release="$(python3 release/scripts/release_roster.py \
            messaging-in-release "${CLIENT_VERSION}")"
          if [[ "${messaging_in_release}" == true ]]; then
            clients+=(messaging)
          fi
          scheduling_in_release="$(python3 release/scripts/release_roster.py \
            scheduling-client-in-release "${CLIENT_VERSION}")"
          if [[ "${scheduling_in_release}" == true ]]; then
            clients+=(scheduling)
          fi
          coordinator_in_release="$(python3 release/scripts/release_roster.py \
            coordinator-client-in-release "${CLIENT_VERSION}")"
          if [[ "${coordinator_in_release}" == true ]]; then
            clients+=(coordinator)
          fi
          for client in "${clients[@]}"; do
            if [[ "${client}" == discovery ]] &&
                (( client_major == 0 && client_minor < 23 )); then
              continue
            fi
            client_dir="${GITHUB_WORKSPACE}/crates/registry-${client}-client-py"
            configured_version="$(cd "${client_dir}" && python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            test "${configured_version}" = "${CLIENT_VERSION}"
            IFS=. read -r major minor _patch <<<"${CLIENT_VERSION}"
            registry_packages=0
            if ((
              major > 0 || minor >= 21
            )); then
              registry_packages=1
            fi
            wheel_tag="${{ matrix.wheel_tag }}"
            if [[ "${registry_packages}" -eq 1 ]]; then
              wheel_tag="${{ matrix.registry_wheel_tag }}"
            fi
            if [[ "${RUNNER_OS}" == Linux ]]; then
              compatibility=linux
              if [[ "${registry_packages}" -eq 1 ]]; then
                compatibility=manylinux_2_17
              fi
              release/scripts/build-linux-python-client \
                --client "${client}" \
                --target "${{ matrix.target }}" \
                --compatibility "${compatibility}" \
                --zig-python "${RUNNER_TEMP}/maturin/bin/python" \
                --maturin "${RUNNER_TEMP}/maturin/bin/maturin" \
                --out "${built_wheel_dir}" \
                --profile release
            else
              (cd "${client_dir}" && "${RUNNER_TEMP}/maturin/bin/maturin" build \
                --release --locked --out "${built_wheel_dir}")
            fi
            wheel_stem="registry_${client}_client"
            if [[ "${client}" == breg ]]; then
              wheel_stem=registry_breg_client_native
            elif [[ "${client}" == casework ]]; then
              wheel_stem=registry_casework_client_native
            elif [[ "${client}" == messaging ]]; then
              wheel_stem=registry_messaging_client_native
            elif [[ "${client}" == scheduling ]]; then
              wheel_stem=registry_scheduling_client_native
            elif [[ "${client}" == coordinator ]]; then
              wheel_stem=registry_coordinator_client_native
            fi
            wheel="${wheel_stem}-${CLIENT_VERSION}-${wheel_tag}.whl"
            if [[ ! -f "${built_wheel_dir}/${wheel}" ]]; then
              echo "maturin did not produce ${wheel}" >&2
              find "${built_wheel_dir}" -maxdepth 1 -name '*.whl' >&2
              exit 1
            fi
          done
          if [[ "${unified_client}" -eq 1 ]]; then
            casework_wheel_args=()
            if [[ "${include_casework}" -eq 1 ]]; then
              casework_wheel_args=(
                --casework-wheel
                "${built_wheel_dir}/registry_casework_client_native-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl"
              )
            fi
            messaging_wheel_args=()
            if [[ "${messaging_in_release}" == true ]]; then
              messaging_wheel_args=(
                --messaging-wheel
                "${built_wheel_dir}/registry_messaging_client_native-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl"
              )
            fi
            scheduling_wheel_args=()
            if [[ "${scheduling_in_release}" == true ]]; then
              scheduling_wheel_args=(
                --scheduling-wheel
                "${built_wheel_dir}/registry_scheduling_client_native-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl"
              )
            fi
            coordinator_wheel_args=()
            if [[ "${coordinator_in_release}" == true ]]; then
              coordinator_wheel_args=(
                --coordinator-wheel
                "${built_wheel_dir}/registry_coordinator_client_native-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl"
              )
            fi
            macos_wheel_args=()
            if [[ "${RUNNER_OS}" == macOS ]] &&
                (( client_major > 0 || client_minor >= 33 )); then
              macos_wheel_args=(--macos-library-root "${CARGO_TARGET_DIR}")
            fi
            # macOS runs bash 3.2, which rejects an empty "${array[@]}"
            # under `set -u`; each optional array expands only when set.
            python3 release/scripts/assemble-registry-client-wheel.py \
              ${macos_wheel_args[@]+"${macos_wheel_args[@]}"} \
              --version "${CLIENT_VERSION}" \
              --output-dir "${wheel_dir}" \
              --discovery-wheel "${built_wheel_dir}/registry_discovery_client-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl" \
              --evidence-wheel "${built_wheel_dir}/registry_evidence_client-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl" \
              --breg-wheel "${built_wheel_dir}/registry_breg_client_native-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl" \
              ${casework_wheel_args[@]+"${casework_wheel_args[@]}"} \
              ${messaging_wheel_args[@]+"${messaging_wheel_args[@]}"} \
              ${scheduling_wheel_args[@]+"${scheduling_wheel_args[@]}"} \
              ${coordinator_wheel_args[@]+"${coordinator_wheel_args[@]}"}
            expected_wheels=1
          else
            cp "${built_wheel_dir}"/*.whl "${wheel_dir}/"
            expected_wheels=1
            if [[ ! "${CLIENT_VERSION}" =~ ^0\.([0-9]|1[0-8])\. ]] &&
                [[ "${CLIENT_VERSION}" != "0.19.0" ]]; then
              expected_wheels=2
            fi
            if (( client_major > 0 || client_minor >= 23 )); then
              expected_wheels=3
            fi
          fi
          test "$(find "${wheel_dir}" -maxdepth 1 -name '*.whl' | wc -l)" -eq "${expected_wheels}"

      - name: Smoke Python client wheels
        shell: bash
        run: |
          set -euo pipefail
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
          if [[ "${RUNNER_OS}" == macOS ]]; then
            build_root="${GITHUB_WORKSPACE}/target/release-client-python"
            hidden_build_root="${build_root}.smoke-hidden"
            mv -- "${build_root}" "${hidden_build_root}"
            trap 'mv -- "${hidden_build_root}" "${build_root}"' EXIT
          fi
          IFS=. read -r client_major client_minor client_patch <<<"${CLIENT_VERSION}"
          if (( client_major > 0 || client_minor > 26 ||
                (client_minor == 26 && client_patch >= 1) )); then
            wheel="registry_stack_client-${CLIENT_VERSION}-${{ matrix.registry_wheel_tag }}.whl"
            smoke="${RUNNER_TEMP}/wheel-smoke-registry"
            python3 -m venv "${smoke}"
            "${smoke}/bin/pip" install --quiet \
              "${GITHUB_WORKSPACE}/candidate-client-package/clients/${wheel}"
            "${smoke}/bin/python" \
              release/scripts/smoke-registry-client-package.py
            exit 0
          fi
          for client in discovery evidence; do
            if [[ "${client}" == discovery ]] &&
                (( client_major == 0 && client_minor < 23 )); then
              continue
            fi
            IFS=. read -r major minor _patch <<<"${CLIENT_VERSION}"
            wheel_tag="${{ matrix.wheel_tag }}"
            if ((
              major > 0 || minor >= 21
            )); then
              wheel_tag="${{ matrix.registry_wheel_tag }}"
            fi
            wheel="registry_${client}_client-${CLIENT_VERSION}-${wheel_tag}.whl"
            smoke="${RUNNER_TEMP}/wheel-smoke-${client}"
            python3 -m venv "${smoke}"
            "${smoke}/bin/pip" install --quiet \
              "${GITHUB_WORKSPACE}/candidate-client-package/clients/${wheel}"
            "${smoke}/bin/python" \
              "release/scripts/smoke-${client}-client-package.py"
          done

      - name: Build Node client packages
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-client-node
        run: |
          set -euo pipefail
          IFS=. read -r client_major client_minor client_patch <<<"${CLIENT_VERSION}"
          if [[ "${RUNNER_OS}" == macOS ]] &&
              (( client_major > 0 || client_minor >= 33 )); then
            export AWS_LC_FIPS_SYS_STATIC=0
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          unified_client=0
          if (( client_major > 0 || client_minor > 26 ||
                (client_minor == 26 && client_patch >= 1) )); then
            unified_client=1
          fi
          include_casework=0
          if (( client_major > 0 || client_minor >= 30 )); then
            include_casework=1
          fi
          clients=(discovery evidence)
          if [[ "${unified_client}" -eq 1 ]]; then
            clients+=(breg)
          fi
          if [[ "${include_casework}" -eq 1 ]]; then
            clients+=(casework)
          fi
          messaging_in_release="$(python3 release/scripts/release_roster.py \
            messaging-in-release "${CLIENT_VERSION}")"
          if [[ "${messaging_in_release}" == true ]]; then
            clients+=(messaging)
          fi
          scheduling_in_release="$(python3 release/scripts/release_roster.py \
            scheduling-client-in-release "${CLIENT_VERSION}")"
          if [[ "${scheduling_in_release}" == true ]]; then
            clients+=(scheduling)
          fi
          coordinator_in_release="$(python3 release/scripts/release_roster.py \
            coordinator-client-in-release "${CLIENT_VERSION}")"
          if [[ "${coordinator_in_release}" == true ]]; then
            clients+=(coordinator)
          fi
          for client in "${clients[@]}"; do
            if [[ "${client}" == discovery ]] &&
                (( client_major == 0 && client_minor < 23 )); then
              continue
            fi
            client_dir="${GITHUB_WORKSPACE}/crates/registry-${client}-client-node"
            (cd "${client_dir}" && npm ci)
            test "$(node -p "require('${client_dir}/package.json').version")" = "${CLIENT_VERSION}"
            if [[ "${RUNNER_OS}" == Linux ]]; then
              release/scripts/build-linux-node-client \
                --client "${client}" \
                --target "${{ matrix.target }}" \
                --napi-platform "${{ matrix.napi_platform }}" \
                --zig-python "${RUNNER_TEMP}/maturin/bin/python"
            else
              (cd "${client_dir}" && ./node_modules/.bin/napi build \
                --platform --release --target "${{ matrix.target }}")
            fi
            if [[ "${unified_client}" -eq 1 ]]; then
              continue
            fi
            if [[ "${client}" == discovery ]]; then
              (cd "${client_dir}" && npm run normalize:loader)
            fi
            (cd "${client_dir}" && npm pack --pack-destination "${RUNNER_TEMP}")
            packed="${RUNNER_TEMP}/registrystack-${client}-client-${CLIENT_VERSION}.tgz"
            test -f "${packed}"
            entries="$(tar -tzf "${packed}")"
            grep -Fxq "package/${client}-client.${{ matrix.napi_platform }}.node" \
              <<<"${entries}"
            cp "${packed}" \
              "${GITHUB_WORKSPACE}/candidate-client-package/clients/${client}-client-node-${CLIENT_TAG}-${{ matrix.asset }}.tgz"
            IFS=. read -r major minor _patch <<<"${CLIENT_VERSION}"
            if ((
              major > 0 || minor >= 21
            )); then
              platform_dir="${client_dir}/npm/${{ matrix.napi_platform }}"
              test -f "${platform_dir}/package.json"
              cp "${client_dir}/LICENSE" "${platform_dir}/LICENSE"
              cp "${client_dir}/${client}-client.${{ matrix.napi_platform }}.node" \
                "${platform_dir}/"
              (cd "${client_dir}" && npm pack \
                "./npm/${{ matrix.napi_platform }}" \
                --ignore-scripts --pack-destination "${RUNNER_TEMP}")
              platform_package="registrystack-${client}-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
              test -f "${RUNNER_TEMP}/${platform_package}"
              cp "${RUNNER_TEMP}/${platform_package}" \
                "${GITHUB_WORKSPACE}/candidate-client-package/clients/${platform_package}"
            fi
          done
          if [[ "${unified_client}" -eq 1 ]]; then
            platform_dir="${GITHUB_WORKSPACE}/crates/registry-stack-client-node/npm/${{ matrix.napi_platform }}"
            platform_clients=(discovery evidence breg)
            if [[ "${include_casework}" -eq 1 ]]; then
              platform_clients+=(casework)
            fi
            if [[ "${messaging_in_release}" == true ]]; then
              platform_clients+=(messaging)
            fi
            if [[ "${scheduling_in_release}" == true ]]; then
              platform_clients+=(scheduling)
            fi
            if [[ "${coordinator_in_release}" == true ]]; then
              platform_clients+=(coordinator)
            fi
            for client in "${platform_clients[@]}"; do
              cp "${GITHUB_WORKSPACE}/crates/registry-${client}-client-node/${client}-client.${{ matrix.napi_platform }}.node" \
                "${platform_dir}/"
            done
            if [[ "${RUNNER_OS}" == macOS ]] &&
                (( client_major > 0 || client_minor >= 33 )); then
              macos_consumer_args=()
              for client in "${platform_clients[@]}"; do
                macos_consumer_args+=(--consumer "${platform_dir}/${client}-client.${{ matrix.napi_platform }}.node")
              done
              python3 release/scripts/bundle-client-macos-fips.py \
                "${macos_consumer_args[@]}" \
                --library-root "${CARGO_TARGET_DIR}" \
                --library-directory "${platform_dir}"
            fi
          fi

      - name: Smoke Node client packages
        shell: bash
        run: |
          set -euo pipefail
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
          if [[ "${RUNNER_OS}" == macOS ]]; then
            build_root="${GITHUB_WORKSPACE}/target/release-client-node"
            hidden_build_root="${build_root}.smoke-hidden"
            mv -- "${build_root}" "${hidden_build_root}"
            trap 'mv -- "${hidden_build_root}" "${build_root}"' EXIT
          fi
          IFS=. read -r major minor patch <<<"${CLIENT_VERSION}"
          if (( major > 0 || minor > 26 || (minor == 26 && patch >= 1) )); then
            include_casework=0
            if (( major > 0 || minor >= 30 )); then
              include_casework=1
            fi
            messaging_in_release="$(python3 release/scripts/release_roster.py \
              messaging-in-release "${CLIENT_VERSION}")"
            scheduling_in_release="$(python3 release/scripts/release_roster.py \
              scheduling-client-in-release "${CLIENT_VERSION}")"
            coordinator_in_release="$(python3 release/scripts/release_roster.py \
              coordinator-client-in-release "${CLIENT_VERSION}")"
            smoke="${RUNNER_TEMP}/node-smoke-registry"
            root_stage="${RUNNER_TEMP}/node-root-registry"
            mkdir -p "${smoke}" "${root_stage}"
            cp -R crates/registry-stack-client-node/. "${root_stage}/"
            python3 release/scripts/client_registry.py bind-optional-deps \
              --package-json "${root_stage}/package.json" \
              --version "${CLIENT_VERSION}" \
              --client stack
            (cd "${root_stage}" && npm pack \
              "./npm/${{ matrix.napi_platform }}" \
              --ignore-scripts --pack-destination "${RUNNER_TEMP}")
            platform_package="registrystack-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${RUNNER_TEMP}/${platform_package}"
            cp "${RUNNER_TEMP}/${platform_package}" \
              "${GITHUB_WORKSPACE}/candidate-client-package/clients/${platform_package}"
            (cd "${root_stage}" && npm pack \
              --ignore-scripts --pack-destination "${smoke}")
            root_package="${smoke}/registrystack-client-${CLIENT_VERSION}.tgz"
            platform_package="${GITHUB_WORKSPACE}/candidate-client-package/clients/registrystack-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
            test -f "${root_package}"
            test -f "${platform_package}"
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund \
                "${root_package}" "${platform_package}"
              test -z "$(find node_modules/@registrystack/client \
                -maxdepth 1 -name '*.node' -print -quit)"
              expected_addons=3
              if [[ "${include_casework}" -eq 1 ]]; then
                expected_addons=4
              fi
              if [[ "${messaging_in_release}" == true ]]; then
                expected_addons=$((expected_addons + 1))
              fi
              if [[ "${scheduling_in_release}" == true ]]; then
                expected_addons=$((expected_addons + 1))
              fi
              if [[ "${coordinator_in_release}" == true ]]; then
                expected_addons=$((expected_addons + 1))
              fi
              test "$(find node_modules/@registrystack/client-${{ matrix.napi_platform }} \
                -maxdepth 1 -name '*.node' | wc -l)" -eq "${expected_addons}"
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.js" \
                "${GITHUB_WORKSPACE}/release/scripts/smoke-registry-client-package.mjs" .
              node smoke-registry-client-package.js
              "${MINIMUM_NODE_BIN}" smoke-registry-client-package.js
              node smoke-registry-client-package.mjs
              "${MINIMUM_NODE_BIN}" smoke-registry-client-package.mjs
              if [[ "${RUNNER_OS}" == Linux ]]; then
                docker run --rm --network none \
                  --volume "${smoke}:${smoke}:ro" \
                  --workdir "${smoke}" \
                  "${NODE_RUNTIME_SMOKE_IMAGE}" \
                node smoke-registry-client-package.js
                docker run --rm --network none \
                  --volume "${smoke}:${smoke}:ro" \
                  --workdir "${smoke}" \
                  "${NODE_RUNTIME_SMOKE_IMAGE}" \
                node smoke-registry-client-package.mjs
              fi
            )
            if [[ "${{ matrix.asset }}" == linux-amd64-glibc ]]; then
              cp "${root_package}" \
                "${GITHUB_WORKSPACE}/candidate-client-package/clients/"
            fi
            exit 0
          fi
          for client in discovery evidence; do
            if [[ "${client}" == discovery ]] &&
                (( major == 0 && minor < 23 )); then
              continue
            fi
            smoke="${RUNNER_TEMP}/node-smoke-${client}"
            mkdir -p "${smoke}"
            packages=()
            if ((
              major > 0 || minor >= 21
            )); then
              client_dir="${GITHUB_WORKSPACE}/crates/registry-${client}-client-node"
              root_stage="${RUNNER_TEMP}/node-root-${client}"
              mkdir -p "${root_stage}"
              for source in \
                LICENSE README.md client.js client.d.ts index.js index.d.ts package.json; do
                cp "${client_dir}/${source}" "${root_stage}/${source}"
              done
              python3 release/scripts/client_registry.py bind-optional-deps \
                --package-json "${root_stage}/package.json" \
                --version "${CLIENT_VERSION}" \
                --client "${client}"
              (cd "${root_stage}" && npm pack \
                --ignore-scripts --pack-destination "${smoke}")
              root_package="${smoke}/registrystack-${client}-client-${CLIENT_VERSION}.tgz"
              platform_package="${GITHUB_WORKSPACE}/candidate-client-package/clients/registrystack-${client}-client-${{ matrix.napi_platform }}-${CLIENT_VERSION}.tgz"
              test -f "${root_package}"
              test -f "${platform_package}"
              packages=("${root_package}" "${platform_package}")
            else
              packages=(
                "${GITHUB_WORKSPACE}/candidate-client-package/clients/${client}-client-node-${CLIENT_TAG}-${{ matrix.asset }}.tgz"
              )
            fi
            (
              cd "${smoke}"
              npm init --yes >/dev/null
              npm install --no-audit --no-fund "${packages[@]}"
              if ((
                major > 0 || minor >= 21
              )); then
                test -z "$(find "node_modules/@registrystack/${client}-client" \
                  -maxdepth 1 -name '*.node' -print -quit)"
                test -f \
                  "node_modules/@registrystack/${client}-client-${{ matrix.napi_platform }}/${client}-client.${{ matrix.napi_platform }}.node"
              fi
              cp "${GITHUB_WORKSPACE}/release/scripts/smoke-${client}-client-package.js" .
              node "smoke-${client}-client-package.js"
              "${MINIMUM_NODE_BIN}" "smoke-${client}-client-package.js"
              if [[ "${RUNNER_OS}" == Linux ]]; then
                # Prove package loading on supported UBI 8 (glibc 2.28).
                # The builder's ELF check separately holds GLIBC_2.17.
                docker run --rm --network none \
                  --volume "${smoke}:${smoke}:ro" \
                  --workdir "${smoke}" \
                  "${NODE_RUNTIME_SMOKE_IMAGE}" \
                  node "smoke-${client}-client-package.js"
              fi
            )
            if [[ "${{ matrix.asset }}" == linux-amd64-glibc ]] &&
                (( major > 0 || minor >= 21 )); then
              cp "${root_package}" \
                "${GITHUB_WORKSPACE}/candidate-client-package/clients/"
            fi
          done

      - name: Upload native client packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-clients-${{ matrix.asset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-client-package
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  assemble:
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      needs.build-canonical.result == 'success' &&
      (needs.validate.outputs.unit == 'discovery' ||
       (needs.build-docs.result == 'success' && needs.build-platforms.result == 'success' &&
        needs.build-macos-platforms.result == 'success' && needs.clients.result == 'success'))
    name: Smoke, scan, and assemble one candidate bundle
    needs:
      - validate
      - build-canonical
      - build-docs
      - build-platforms
      - build-macos-platforms
      - clients
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      RELEASE_IMAGE_NAMES: ${{ needs.validate.outputs.image_names }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download exact build products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: inputs

      - name: Merge exact native macOS release shards
        if: needs.validate.outputs.unit == 'stack'
        shell: bash
        run: |
          set -euo pipefail
          prefix="candidate-native-macos-arm64-${{ needs.validate.outputs.version }}"
          suffix="${{ needs.validate.outputs.source_sha }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            component_args+=(--exclude-unit discovery)
          fi
          release/scripts/merge-release-native-platform-shards.py \
            --version "${{ needs.validate.outputs.version }}" \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --purpose candidate_input \
            --core "inputs/${prefix}-core-${suffix}" \
            --breg "inputs/${prefix}-breg-${suffix}" \
            --bregctl "inputs/${prefix}-bregctl-${suffix}" \
            --casework "inputs/${prefix}-casework-${suffix}" \
            --scheduling "inputs/${prefix}-scheduling-${suffix}" \
            --output "inputs/candidate-macos-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${component_args[@]}"

      - name: Install pinned candidate inspection tools
        env:
          STEP_CRANE_SHA256: ${{ env.CRANE_LINUX_AMD64_SHA256 }}
          STEP_CRANE_VERSION: ${{ env.CRANE_VERSION }}
          STEP_GRYPE_SHA256: ${{ env.GRYPE_LINUX_AMD64_SHA256 }}
          STEP_GRYPE_VERSION: ${{ env.GRYPE_VERSION }}
          STEP_ORAS_SHA256: ${{ env.ORAS_LINUX_AMD64_SHA256 }}
          STEP_ORAS_VERSION: ${{ env.ORAS_VERSION }}
          STEP_SYFT_SHA256: ${{ env.SYFT_LINUX_AMD64_SHA256 }}
          STEP_SYFT_VERSION: ${{ env.SYFT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin" "${RUNNER_TEMP}/tools"
          syft_version="${STEP_SYFT_VERSION#v}"
          grype_version="${STEP_GRYPE_VERSION#v}"
          oras_version="${STEP_ORAS_VERSION#v}"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/${STEP_SYFT_VERSION}/syft_${syft_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/syft.tar.gz"
          echo "${STEP_SYFT_SHA256}  ${RUNNER_TEMP}/tools/syft.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/syft.tar.gz" \
            -C "${HOME}/.local/bin" syft
          curl -sSfL \
            "https://github.com/anchore/grype/releases/download/${STEP_GRYPE_VERSION}/grype_${grype_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/grype.tar.gz"
          echo "${STEP_GRYPE_SHA256}  ${RUNNER_TEMP}/tools/grype.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/grype.tar.gz" \
            -C "${HOME}/.local/bin" grype
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${STEP_CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/crane.tar.gz"
          echo "${STEP_CRANE_SHA256}  ${RUNNER_TEMP}/tools/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/crane.tar.gz" \
            -C "${HOME}/.local/bin" crane
          curl -sSfL \
            "https://github.com/oras-project/oras/releases/download/${STEP_ORAS_VERSION}/oras_${oras_version}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/tools/oras.tar.gz"
          echo "${STEP_ORAS_SHA256}  ${RUNNER_TEMP}/tools/oras.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/tools/oras.tar.gz" \
            -C "${HOME}/.local/bin" oras
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify local image layouts before package credentials are used
        shell: bash
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in ${RELEASE_IMAGE_NAMES}; do
            python3 release/scripts/check-release-image-oci-labels.py \
              "oci-layout://${canonical}/dist/images/${name}.oci" \
              --source "https://github.com/${GITHUB_REPOSITORY}" \
              --revision "${{ needs.validate.outputs.source_sha }}" \
              --version "${{ needs.validate.outputs.version }}"
          done

      - name: Publish exact layouts to private candidate packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "${GH_TOKEN}" \
            | oras login "${REGISTRY}" \
                --username "${GITHUB_ACTOR}" --password-stdin
          for name in ${RELEASE_IMAGE_NAMES}; do
            package="${name}-candidate"
            package_metadata="${RUNNER_TEMP}/${package}-package.json"
            package_response="${RUNNER_TEMP}/${package}-response"
            if gh api --include --silent \
                "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}" \
                >"${package_response}" 2>&1; then
              package_status=200
            else
              package_status="$(
                python3 release/scripts/release_workflow_guard.py http-status \
                  --response "${package_response}"
              )"
            fi
            if [[ "${package_status}" == 200 ]]; then
              gh api "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}" \
                > "${package_metadata}"
              python3 release/scripts/release_workflow_guard.py \
                require-package-visibility \
                --metadata "${package_metadata}" \
                --package "${package}" \
                --visibility private
            elif [[ "${package_status}" != 404 ]]; then
              echo "Cannot prove ${package} is absent or private" >&2
              exit 1
            fi
            candidate_ref="$(tr -d '\n' < "${canonical}/dist/images/${name}.digest")"
            digest="${candidate_ref##*@}"
            candidate_tag="${REGISTRY}/${IMAGE_NAMESPACE}/${package}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            oras cp --from-oci-layout \
              "${canonical}/dist/images/${name}.oci@${digest}" \
              "${candidate_tag}"
            test "$(crane digest "${candidate_tag}")" = "${digest}"
            test "$(crane digest "${candidate_ref}")" = "${digest}"
            gh api "/orgs/${IMAGE_NAMESPACE}/packages/container/${package}" \
              > "${package_metadata}"
            python3 release/scripts/release_workflow_guard.py \
              require-package-visibility \
              --metadata "${package_metadata}" \
              --package "${package}" \
              --visibility private
          done

      - name: Verify and scan exact candidate images
        shell: bash
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p candidate/security/{image-sbom,syft,grype,oci-config,rootfs}
          grype db update
          grype db status -o json \
            > candidate/security/grype/grype-db-status.json
          jq -e 'type == "object" and length > 0' \
            candidate/security/grype/grype-db-status.json >/dev/null
          scan_image() {
            local image_ref="$1"
            local report="$2"
            local status db_built db_checksum db_built_epoch now_epoch
            set +e
            grype "${image_ref}" -o json > "${report}"
            status=$?
            set -e
            if (( status != 0 )); then
              echo "Grype failed (exit ${status}); refusing candidate scan" >&2
              exit 1
            fi
            if ! jq -e '
              type == "object" and
              (.matches | type == "array") and
              (.source.type == "image") and
              (
                .source.target.userInput
                | type == "string" and
                  test("@sha256:[0-9a-f]{64}$")
              ) and
              (
                (.descriptor.db.built // .descriptor.db.status.built)
                | type == "string"
              ) and
              (
                (.descriptor.db.checksum | type == "string") or
                (
                  .descriptor.db.status.from
                  | type == "string" and
                    test("checksum=sha256%3A[0-9a-fA-F]{64}")
                )
              )
            ' "${report}" >/dev/null; then
              echo "Grype did not emit a complete scan report (exit ${status})" >&2
              exit 1
            fi
            IFS=$'\t' read -r db_built db_checksum < <(
              jq -er '
                [
                  (.descriptor.db.built // .descriptor.db.status.built),
                  (
                    .descriptor.db.checksum //
                    (
                      .descriptor.db.status.from
                      | capture(
                          "checksum=sha256%3A(?<digest>[0-9a-fA-F]{64})"
                        ).digest
                      | ascii_downcase
                    )
                  )
                ] | @tsv
              ' "${report}"
            )
            test -n "${db_checksum}"
            db_built_epoch="$(date -u -d "${db_built}" +%s)"
            now_epoch="$(date -u +%s)"
            if (( db_built_epoch > now_epoch ||
                  now_epoch - db_built_epoch > 259200 )); then
              echo "Grype database is future-dated or older than three days" >&2
              exit 1
            fi
          }
          for name in ${RELEASE_IMAGE_NAMES}; do
            candidate_ref="$(tr -d '\n' < "${canonical}/dist/images/${name}.digest")"
            digest="${candidate_ref##*@}"
            test "$(crane digest "${candidate_ref}")" = "${digest}"
            crane manifest "${candidate_ref}" \
              > "${RUNNER_TEMP}/${name}.index.json"
            python3 release/scripts/check-release-image-oci-labels.py \
              "${candidate_ref}" \
              --source "https://github.com/${GITHUB_REPOSITORY}" \
              --revision "${{ needs.validate.outputs.source_sha }}" \
              --version "${{ needs.validate.outputs.version }}"
            crane config "${candidate_ref}" \
              > "candidate/security/oci-config/${name}.json"
            jq -e '
              type == "object" and
              .architecture == "amd64" and
              .os == "linux" and
              (.config | type == "object") and
              (.rootfs.type == "layers") and
              ((.rootfs.diff_ids | type) == "array") and
              (.rootfs.diff_ids | length > 0)
            ' "candidate/security/oci-config/${name}.json" >/dev/null
            observed="$(
              docker run --rm \
                --network none \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                "${candidate_ref}" --version
            )"
            expected_image_version="${name} ${{ needs.validate.outputs.version }}"
            if [[ "${name}" == "registry-render" ]]; then
              typst_pin="$(sed -n 's/^pub const TYPST_PIN: &str = "\([^" ]*\)";$/\1/p' crates/registry-render/src/lib.rs)"
              test -n "${typst_pin}"
              expected_image_version="${expected_image_version} (typst ${typst_pin})"
            fi
            test "${observed}" = "${expected_image_version}"
            SYFT_FILE_METADATA_SELECTION=all \
            SYFT_FILE_METADATA_DIGESTS=sha256 \
            syft "${candidate_ref}" \
              -o "spdx-json=candidate/security/image-sbom/${name}.spdx.json" \
              -o "syft-json=candidate/security/syft/${name}.syft.json"
            mkdir -p "candidate/security/rootfs/${name}"
            crane export "${candidate_ref}" - \
              | tar --extract --file=- \
                  --directory="candidate/security/rootfs/${name}" \
                  --no-same-owner --no-same-permissions
            if find "candidate/security/rootfs/${name}" \
                \( -type b -o -type c -o -type p -o -type s \) \
                -print -quit | grep -q .; then
              echo "Exported rootfs ${name} contains a forbidden special file" >&2
              exit 1
            fi
            scan_image \
              "${candidate_ref}" \
              "candidate/security/grype/${name}.grype.json"
          done
          for name in ${RELEASE_IMAGE_NAMES}; do
            candidate_ref="$(tr -d '\n' < "${canonical}/dist/images/${name}.digest")"
            digest="${candidate_ref##*@}"
            baseline="release/security/${name}-advisory-baseline.json"
            python3 release/scripts/check-advisory-baselines.py \
              grype "candidate/security/grype/${name}.grype.json" \
              --baseline "${baseline}" \
              --syft-report "candidate/security/syft/${name}.syft.json" \
              --rootfs "candidate/security/rootfs/${name}" \
              --candidate-image-digest "${digest}" \
              --source-revision "${{ needs.validate.outputs.source_sha }}" \
              --oci-config "candidate/security/oci-config/${name}.json" \
              --subject "${name}-image"
          done
          rm -rf candidate/security/rootfs
          advisory_subjects="$(
            for name in ${RELEASE_IMAGE_NAMES}; do
              printf '%s-image\n' "${name}"
            done | jq -R . | jq -s .
          )"
          jq -n --argjson subjects "${advisory_subjects}" '{
            schema_version: "registry-stack.advisory-verdict.v2",
            verdict: "passed",
            subjects: $subjects
          }' > candidate/security/advisory-verdict.json

      - name: Assemble public payload and validate version-appropriate install inputs
        if: needs.validate.outputs.unit == 'stack'
        shell: bash
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          macos="inputs/candidate-macos-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          linux_arm="inputs/candidate-linux-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p candidate/bundle-root
          cp "${canonical}"/dist/bin/* candidate/bundle-root/
          cp "inputs/candidate-docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/registry-docs-${{ needs.validate.outputs.tag }}.tar.gz" \
            candidate/bundle-root/
          rm -f candidate/bundle-root/SHA256SUMS
          cp "${macos}"/platform/* candidate/bundle-root/
          cp "${linux_arm}"/platform/* candidate/bundle-root/
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            cp "inputs/candidate-distribution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/registry-stack-${{ needs.validate.outputs.asset_tag }}-distribution.json" candidate/bundle-root/
          fi
          version="${{ needs.validate.outputs.version }}"
          IFS=. read -r client_major client_minor client_patch <<<"${version}"
          if (( client_major > 0 || client_minor >= 33 )); then
            cp THIRD_PARTY_NOTICES candidate/bundle-root/
          fi
          include_unified_client=0
          if (( client_major > 0 || client_minor > 26 ||
                (client_minor == 26 && client_patch >= 1) )); then
            include_unified_client=1
          fi
          include_registry_packages=0
          if ((
            client_major > 0 || client_minor >= 21
          )); then
            include_registry_packages=1
          fi
          include_discovery_clients=0
          if ((
            client_major > 0 || client_minor >= 23
          )); then
            include_discovery_clients=1
          fi
          for platform in linux-amd64-glibc linux-arm64-glibc macos-arm64; do
            client_root="inputs/candidate-clients-${platform}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/clients"
            if [[ "${include_unified_client}" -eq 1 ]]; then
              expected_client_assets=2
            else
              expected_client_assets=2
              if [[ "${include_registry_packages}" -eq 1 ]]; then
                expected_client_assets=6
              fi
              if [[ "${include_discovery_clients}" -eq 1 ]]; then
                expected_client_assets=9
              fi
            fi
            if [[ "${platform}" == linux-amd64-glibc ]]; then
              if [[ "${include_unified_client}" -eq 1 ]]; then
                expected_client_assets=$((expected_client_assets + 1))
              elif [[ "${include_registry_packages}" -eq 1 ]]; then
                expected_client_assets=$((expected_client_assets + 2))
                if [[ "${include_discovery_clients}" -eq 1 ]]; then
                  expected_client_assets=$((expected_client_assets + 1))
                fi
              fi
            fi
            test "$(find "${client_root}" -maxdepth 1 -type f | wc -l)" -eq "${expected_client_assets}"
            cp "${client_root}"/* candidate/bundle-root/
          done
          {
            if [[ "${include_unified_client}" -eq 1 ]]; then
              echo "registrystack-client-${version}.tgz"
              for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
                echo "registrystack-client-${platform}-${version}.tgz"
              done
              for wheel_platform in \
                manylinux_2_17_x86_64.manylinux2014_x86_64 \
                manylinux_2_17_aarch64.manylinux2014_aarch64 \
                macosx_11_0_arm64; do
                echo "registry_stack_client-${version}-cp311-abi3-${wheel_platform}.whl"
              done
            else
              for platform in linux-amd64-glibc linux-arm64-glibc macos-arm64; do
                echo "evidence-client-node-${{ needs.validate.outputs.tag }}-${platform}.tgz"
              done
              wheel_platforms=(linux_x86_64 linux_aarch64 macosx_11_0_arm64)
              if [[ "${include_registry_packages}" -eq 1 ]]; then
                wheel_platforms=(manylinux_2_17_x86_64.manylinux2014_x86_64 manylinux_2_17_aarch64.manylinux2014_aarch64 macosx_11_0_arm64)
              fi
              for wheel_platform in "${wheel_platforms[@]}"; do
                echo "registry_evidence_client-${{ needs.validate.outputs.version }}-cp311-abi3-${wheel_platform}.whl"
              done
            if [[ "${include_registry_packages}" -eq 1 ]]; then
              echo "registrystack-evidence-client-${version}.tgz"
              for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
                echo "registrystack-evidence-client-${platform}-${version}.tgz"
              done
            fi
            if [[ "${include_discovery_clients}" -eq 1 ]]; then
              for platform in linux-amd64-glibc linux-arm64-glibc macos-arm64; do
                echo "discovery-client-node-${{ needs.validate.outputs.tag }}-${platform}.tgz"
              done
              for wheel_platform in "${wheel_platforms[@]}"; do
                echo "registry_discovery_client-${{ needs.validate.outputs.version }}-cp311-abi3-${wheel_platform}.whl"
              done
              if [[ "${include_registry_packages}" -eq 1 ]]; then
                echo "registrystack-discovery-client-${version}.tgz"
                for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
                  echo "registrystack-discovery-client-${platform}-${version}.tgz"
                done
              fi
            fi
            fi
          } | sort > "${RUNNER_TEMP}/expected-client-assets"
          find candidate/bundle-root -maxdepth 1 -type f \
            \( -name 'evidence-client-node-*.tgz' \
               -o -name 'registry_evidence_client-*.whl' \
               -o -name 'registrystack-evidence-client-*.tgz' \
               -o -name 'discovery-client-node-*.tgz' \
               -o -name 'registrystack-discovery-client-*.tgz' \
               -o -name 'registry_discovery_client-*.whl' \
               -o -name 'registrystack-client-*.tgz' \
               -o -name 'registry_stack_client-*.whl' \) \
            -printf '%f\n' | sort > "${RUNNER_TEMP}/actual-client-assets"
          diff -u \
            "${RUNNER_TEMP}/expected-client-assets" \
            "${RUNNER_TEMP}/actual-client-assets"
          if [[ "${include_unified_client}" -eq 1 ]]; then
            python3 release/scripts/client_registry.py validate-dist \
              --directory candidate/bundle-root \
              --version "${version}" \
              --client stack
          elif [[ "${include_registry_packages}" -eq 1 ]]; then
            for client in discovery evidence; do
              if [[ "${client}" == discovery ]] &&
                  [[ "${include_discovery_clients}" -ne 1 ]]; then
                continue
              fi
              python3 release/scripts/client_registry.py validate-dist \
                --directory candidate/bundle-root \
                --version "${version}" \
                --client "${client}"
            done
          fi
          component_args=()
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            component_args+=(--exclude-unit discovery)
          fi
          python3 release/scripts/additional_installers.py --package candidate/bundle-root \
            --version "${version}" --tag "${{ needs.validate.outputs.tag }}" \
            "${component_args[@]}"
          python3 release/scripts/additional_installers.py --smoke candidate/bundle-root \
            --scratch-root "${RUNNER_TEMP}" \
            --version "${version}" --tag "${{ needs.validate.outputs.tag }}" \
            "${component_args[@]}"
          if (( client_major > 0 || client_minor >= 26 )); then
            breg_installer="breg-${{ needs.validate.outputs.tag }}-install.sh"
            awk -v version="${{ needs.validate.outputs.tag }}" '
              $0 == "default_version=\"\"" {
                print "default_version=\"" version "\""
                rendered = 1
                next
              }
              { print }
              END { if (!rendered) exit 1 }
            ' crates/registry-breg/install.sh \
              > "candidate/bundle-root/${breg_installer}"
            chmod 0755 "candidate/bundle-root/${breg_installer}"
            cp "candidate/bundle-root/${breg_installer}" \
              candidate/bundle-root/breg-install.sh
            chmod 0755 candidate/bundle-root/breg-install.sh
            (
              cd candidate/bundle-root
              sha256sum -- \
                "breg-${{ needs.validate.outputs.tag }}-linux-amd64" \
                "bregctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
                > SHA256SUMS
            )
            breg_install_dir="${RUNNER_TEMP}/candidate-breg-install"
            BREG_ASSET_DIR="${GITHUB_WORKSPACE}/candidate/bundle-root" \
            BREG_INSTALL_DIR="${breg_install_dir}" \
              bash "candidate/bundle-root/${breg_installer}"
            for breg_binary in breg bregctl; do
              observed="$("${breg_install_dir}/${breg_binary}" --version)"
              test "${observed}" = \
                "${breg_binary} ${{ needs.validate.outputs.version }}"
            done
            breg_project="${RUNNER_TEMP}/candidate-breg-project"
            "${breg_install_dir}/bregctl" \
              init "${breg_project}"
            "${breg_install_dir}/bregctl" \
              check "${breg_project}"
            rm candidate/bundle-root/SHA256SUMS
          fi
          if (( client_major > 0 || client_minor >= 30 )); then
            casework_installer="casework-${{ needs.validate.outputs.tag }}-install.sh"
            awk -v version="${{ needs.validate.outputs.tag }}" '
              $0 == "default_version=\"\"" {
                print "default_version=\"" version "\""
                rendered = 1
                next
              }
              { print }
              END { if (!rendered) exit 1 }
            ' crates/registry-casework/install.sh \
              > "candidate/bundle-root/${casework_installer}"
            chmod 0755 "candidate/bundle-root/${casework_installer}"
            cp "candidate/bundle-root/${casework_installer}" \
              candidate/bundle-root/casework-install.sh
            chmod 0755 candidate/bundle-root/casework-install.sh
            (
              cd candidate/bundle-root
              sha256sum -- \
                "casework-${{ needs.validate.outputs.tag }}-linux-amd64" \
                "caseworkctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
                > SHA256SUMS
            )
            casework_install_dir="${RUNNER_TEMP}/candidate-casework-install"
            CASEWORK_ASSET_DIR="${GITHUB_WORKSPACE}/candidate/bundle-root" \
            CASEWORK_INSTALL_DIR="${casework_install_dir}" \
              bash "candidate/bundle-root/${casework_installer}"
            for casework_binary in casework caseworkctl; do
              observed="$("${casework_install_dir}/${casework_binary}" --version)"
              test "${observed}" = \
                "${casework_binary} ${{ needs.validate.outputs.version }}"
            done
            casework_project="${RUNNER_TEMP}/candidate-casework-project"
            casework_package="${RUNNER_TEMP}/candidate-casework-package"
            "${casework_install_dir}/caseworkctl" init \
              "${casework_project}" --template standalone-decision
            "${casework_install_dir}/caseworkctl" check "${casework_project}"
            "${casework_install_dir}/caseworkctl" test "${casework_project}"
            "${casework_install_dir}/caseworkctl" package \
              "${casework_project}" --output "${casework_package}"
            test -f "${casework_package}/SHA256SUMS"
            rm candidate/bundle-root/SHA256SUMS
          fi
          scheduling_installer_in_release="$(python3 release/scripts/release_roster.py \
            scheduling-installer-in-release "${version}")"
          if [[ "${scheduling_installer_in_release}" == true ]]; then
            scheduling_installer="scheduling-${{ needs.validate.outputs.tag }}-install.sh"
            awk -v version="${{ needs.validate.outputs.tag }}" '
              $0 == "default_version=\"\"" {
                print "default_version=\"" version "\""
                rendered = 1
                next
              }
              { print }
              END { if (!rendered) exit 1 }
            ' crates/registry-scheduling/install.sh \
              > "candidate/bundle-root/${scheduling_installer}"
            chmod 0755 "candidate/bundle-root/${scheduling_installer}"
            cp "candidate/bundle-root/${scheduling_installer}" \
              candidate/bundle-root/scheduling-install.sh
            chmod 0755 candidate/bundle-root/scheduling-install.sh
            (
              cd candidate/bundle-root
              sha256sum -- \
                "scheduling-${{ needs.validate.outputs.tag }}-linux-amd64" \
                "schedulingctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
                > SHA256SUMS
            )
            scheduling_install_dir="${RUNNER_TEMP}/candidate-scheduling-install"
            SCHEDULING_ASSET_DIR="${GITHUB_WORKSPACE}/candidate/bundle-root" \
            SCHEDULING_INSTALL_DIR="${scheduling_install_dir}" \
              bash "candidate/bundle-root/${scheduling_installer}"
            for scheduling_binary in scheduling schedulingctl; do
              observed="$("${scheduling_install_dir}/${scheduling_binary}" --version)"
              test "${observed}" = \
                "${scheduling_binary} ${{ needs.validate.outputs.version }}"
            done
            scheduling_project="${RUNNER_TEMP}/candidate-scheduling-project"
            scheduling_package="${RUNNER_TEMP}/candidate-scheduling-package"
            "${scheduling_install_dir}/schedulingctl" init \
              --template standalone-exact-time "${scheduling_project}"
            "${scheduling_install_dir}/schedulingctl" check "${scheduling_project}"
            "${scheduling_install_dir}/schedulingctl" test "${scheduling_project}"
            "${scheduling_install_dir}/schedulingctl" package \
              "${scheduling_project}" --output "${scheduling_package}"
            test -f "${scheduling_package}/SHA256SUMS"
            rm candidate/bundle-root/SHA256SUMS
          fi
          messaging_in_release="$(python3 release/scripts/release_roster.py \
            messaging-in-release "${version}")"
          if [[ "${messaging_in_release}" == true ]]; then
            for messaging_binary in messaging messagingctl; do
              chmod 0755 \
                "candidate/bundle-root/${messaging_binary}-${{ needs.validate.outputs.tag }}-linux-amd64"
              observed="$("candidate/bundle-root/${messaging_binary}-${{ needs.validate.outputs.tag }}-linux-amd64" --version)"
              test "${observed}" = \
                "${messaging_binary} ${{ needs.validate.outputs.version }}"
            done
            messaging_project="${RUNNER_TEMP}/candidate-messaging-project"
            "candidate/bundle-root/messagingctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
              init "${messaging_project}"
            "candidate/bundle-root/messagingctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
              check --project "${messaging_project}"
            "candidate/bundle-root/messagingctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
              package "${messaging_project}" --output "${messaging_project}-installed"
            "candidate/bundle-root/messagingctl-${{ needs.validate.outputs.tag }}-linux-amd64" \
              check --package "${messaging_project}-installed"
          fi
          evidencectl_installer="evidencectl-${{ needs.validate.outputs.tag }}-install.sh"
          awk -v version="${{ needs.validate.outputs.tag }}" '
            $0 == "default_version=\"\"" {
              print "default_version=\"" version "\""
              rendered = 1
              next
            }
            { print }
            END { if (!rendered) exit 1 }
          ' crates/registry-evidencectl/install.sh \
            > "candidate/bundle-root/${evidencectl_installer}"
          chmod 0755 "candidate/bundle-root/${evidencectl_installer}"
          cp "candidate/bundle-root/${evidencectl_installer}" \
            candidate/bundle-root/evidencectl-install.sh
          chmod 0755 candidate/bundle-root/evidencectl-install.sh
          (
            cd candidate/bundle-root
            sha256sum -- \
              "evidence-${{ needs.validate.outputs.tag }}-linux-amd64" \
              "evidencectl-${{ needs.validate.outputs.tag }}-linux-amd64" \
              "evidence-oid4vci-${{ needs.validate.outputs.tag }}-linux-amd64" \
              > SHA256SUMS
          )
          evidence_install_dir="${RUNNER_TEMP}/candidate-evidence-install"
          EVIDENCECTL_ASSET_DIR="${GITHUB_WORKSPACE}/candidate/bundle-root" \
          EVIDENCECTL_INSTALL_DIR="${evidence_install_dir}" \
            bash "candidate/bundle-root/${evidencectl_installer}"
          for binary in evidence evidencectl evidence-oid4vci; do
            observed="$("${evidence_install_dir}/${binary}" --version)"
            test "${observed}" = \
              "${binary} ${{ needs.validate.outputs.version }}"
          done
          rm candidate/bundle-root/SHA256SUMS
          if [[ "$(python3 release/scripts/release_roster.py \
              rstack-in-release "${version}")" == true ]]; then
            rstack_installer="rstack-${{ needs.validate.outputs.tag }}-install.sh"
            awk -v version="${{ needs.validate.outputs.tag }}" '
              $0 == "default_version=\"\"" {
                print "default_version=\"" version "\""
                rendered = 1
                next
              }
              { print }
              END { if (!rendered) exit 1 }
            ' crates/registry-rstack/install.sh \
              > "candidate/bundle-root/${rstack_installer}"
            chmod 0755 "candidate/bundle-root/${rstack_installer}"
            cp "candidate/bundle-root/${rstack_installer}" \
              candidate/bundle-root/rstack-install.sh
            chmod 0755 candidate/bundle-root/rstack-install.sh
          fi
      - name: Install Node for the distribution SDK smoke
        if: needs.validate.outputs.exclude_discovery == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0

      - name: Install carried-forward Discovery and smoke the current unified SDK
        if: needs.validate.outputs.exclude_discovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/distribution-discovery/bin"
          python3 release/scripts/release_distribution.py install \
            --lock "candidate/bundle-root/registry-stack-${{ needs.validate.outputs.asset_tag }}-distribution.json" \
            --install-dir "${install_dir}"
          python3 release/scripts/smoke_discovery_distribution.py \
            --bin-dir "${install_dir}" \
            --client-tarball "candidate/bundle-root/registrystack-client-${{ needs.validate.outputs.version }}.tgz"

      - name: Assemble and smoke Discovery install inputs
        if: needs.validate.outputs.unit == 'discovery'
        run: |
          set -euo pipefail
          python3 release/scripts/unit_release_pipeline.py stage-payload \
            --unit discovery --version "${{ needs.validate.outputs.version }}" \
            --binaries "inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/dist/bin" \
            --output candidate/bundle-root

      - name: Package exact security evidence and SBOM
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in ${RELEASE_IMAGE_NAMES}; do
            candidate_ref="$(tr -d '\n' < "${canonical}/dist/images/${name}.digest")"
            digest="${candidate_ref##*@}"
            printf '%s\n' "${REGISTRY}/${IMAGE_NAMESPACE}/${name}@${digest}" \
              > "${RUNNER_TEMP}/${name}.release.digest"
          done
          syft dir:candidate/bundle-root \
            -o "spdx-json=candidate/bundle-root/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}.sbom.spdx.json"
          tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 \
            --numeric-owner -czf \
            "candidate/bundle-root/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}-security-evidence.tar.gz" \
            -C candidate/security \
              image-sbom syft grype advisory-verdict.json
          for name in ${RELEASE_IMAGE_NAMES}; do
            cp "candidate/security/grype/${name}.grype.json" \
              candidate/bundle-root/
          done
          cp candidate/security/advisory-verdict.json candidate/bundle-root/

      - name: Seal compact candidate manifest and bundle
        shell: bash
        run: |
          set -euo pipefail
          canonical="inputs/candidate-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag="${{ needs.validate.outputs.asset_tag }}"
          prefix="${{ needs.validate.outputs.prefix }}"
          version="${{ needs.validate.outputs.version }}"
          bundle="candidate/${{ needs.validate.outputs.bundle_name }}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d "${created_at} + 7 days" +%Y-%m-%dT%H:%M:%SZ)"
          tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 \
            --numeric-owner -czf "${bundle}" -C candidate/bundle-root .
          payloads="$(
            find candidate/bundle-root -maxdepth 1 -type f \
              ! -name '*.grype.json' \
              ! -name advisory-verdict.json \
              -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  name="$(basename "${file}")"
                  case "${name}" in
                    registry-docs-*.tar.gz) kind=docs ;;
                    *-distribution.json) kind=distribution ;;
                    *.sbom.spdx.json) kind=sbom ;;
                    *-security-evidence.tar.gz) kind=security-evidence ;;
                    *-install.sh) kind=installer ;;
                    THIRD_PARTY_NOTICES) kind=notice ;;
                    discovery-client-node-*.tgz|evidence-client-node-*.tgz|registrystack-discovery-client-*.tgz|registrystack-evidence-client-*.tgz|registrystack-client-*.tgz|registry_discovery_client-*.whl|registry_evidence_client-*.whl|registry_stack_client-*.whl) kind=client-package ;;
                    *) kind=binary ;;
                  esac
                  jq -n \
                    --arg name "${name}" \
                    --arg kind "${kind}" \
                    --argjson size "$(stat -c %s "${file}")" \
                    --arg sha256 "$(sha256sum "${file}" | awk '{print $1}')" \
                    '{name:$name,kind:$kind,size:$size,sha256:$sha256}'
                done | jq -s .
          )"
          rstack_components=null
          if [[ "${{ needs.validate.outputs.unit }}" == stack &&
            "$(python3 release/scripts/release_roster.py \
              rstack-in-release "${version}")" == true ]]; then
            rstack_components="$(printf '%s' "${payloads}" \
              | python3 release/scripts/rstack_components.py --version "${version}")"
          fi
          images="$(
            for name in ${RELEASE_IMAGE_NAMES}; do
              candidate_ref="$(tr -d '\n' < "${canonical}/dist/images/${name}.digest")"
              digest="${candidate_ref##*@}"
              jq -n \
                --arg name "${name}" \
                --arg candidate_ref "${candidate_ref}" \
                --arg digest "${digest}" \
                --arg final_ref "${REGISTRY}/${IMAGE_NAMESPACE}/${name}:${tag}" \
                '{name:$name,candidate_ref:$candidate_ref,digest:$digest,final_ref:$final_ref}'
            done | jq -s .
          )"
          scans="$(
            for name in ${RELEASE_IMAGE_NAMES}; do
              file="candidate/bundle-root/${name}.grype.json"
              jq -n \
                --arg image "${name}" \
                --arg name "${name}.grype.json" \
                --arg sha256 "$(sha256sum "${file}" | awk '{print $1}')" \
                '{image:$image,name:$name,sha256:$sha256,status:"passed"}'
            done | jq -s .
          )"
          docs_name="registry-docs-${tag}.tar.gz"
          sbom_name="${prefix}-${tag}.sbom.spdx.json"
          docs_sha=
          if [[ "${{ needs.validate.outputs.unit }}" == stack ]]; then
            docs_sha="$(sha256sum "candidate/bundle-root/${docs_name}" | awk '{print $1}')"
          fi
          distribution_components='[]'
          if [[ "${{ needs.validate.outputs.exclude_discovery }}" == true ]]; then
            distribution_components="$(jq -ce .components "candidate/bundle-root/registry-stack-${tag}-distribution.json")"
          fi
          advisory_name=advisory-verdict.json
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg version "${{ needs.validate.outputs.version }}" \
            --arg release_id "${{ needs.validate.outputs.release_id }}" \
            --arg tag "${{ needs.validate.outputs.tag }}" \
            --arg unit "${{ needs.validate.outputs.unit }}" \
            --arg source_sha "${{ needs.validate.outputs.source_sha }}" \
            --arg workflow_revision "${{ needs.validate.outputs.workflow_revision }}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg created_at "${created_at}" \
            --arg expires_at "${expires_at}" \
            --argjson rstack_components "${rstack_components}" \
            --argjson payloads "${payloads}" \
            --argjson distribution_components "${distribution_components}" \
            --argjson images "${images}" \
            --arg docs_name "${docs_name}" \
            --arg docs_sha "${docs_sha}" \
            --arg sbom_name "${sbom_name}" \
            --arg sbom_sha "$(sha256sum "candidate/bundle-root/${sbom_name}" | awk '{print $1}')" \
            --argjson scans "${scans}" \
            --arg advisory_name "${advisory_name}" \
            --arg advisory_sha "$(sha256sum "candidate/bundle-root/${advisory_name}" | awk '{print $1}')" \
            --arg bundle_name "$(basename "${bundle}")" \
            --argjson bundle_size "$(stat -c %s "${bundle}")" \
            --arg bundle_sha "$(sha256sum "${bundle}" | awk '{print $1}')" \
            '{
              schema_version: "registry-stack.release-candidate.v2",
              repository: $repository,
              release: {
                version: $version,
                release_id: $release_id,
                tag: $tag,
                source_sha: $source_sha
              },
              workflow: {
                path: ".github/workflows/release-candidate.yml",
                revision: $workflow_revision,
                run_id: $run_id,
                run_attempt: $run_attempt
              },
              validity: {
                created_at: $created_at,
                expires_at: $expires_at
              },
              payloads: $payloads,
              images: $images,
              docs: {name:$docs_name,sha256:$docs_sha},
              sbom: {name:$sbom_name,sha256:$sbom_sha},
              scans: $scans,
              advisory: {
                name: $advisory_name,
                sha256: $advisory_sha,
                verdict: "passed"
              },
              bundle: {
                name: $bundle_name,
                size: $bundle_size,
                sha256: $bundle_sha
              }
            } + (if $rstack_components == null then {} else {components:$rstack_components} end)
            | if $unit == "stack" then
              if ($distribution_components | length) > 0 then
                .schema_version = "registry-stack.release-candidate.v3" |
                .distribution_components = $distribution_components
              else . end
            else
              .schema_version = "registry-stack.release-candidate.v3" |
              .release.unit = $unit | del(.docs) end' > candidate/candidate-manifest.draft.json
          python3 release/scripts/release_candidate.py seal-candidate \
            --draft candidate/candidate-manifest.draft.json \
            --output candidate/release-candidate-manifest.json

      - name: Smoke release-pinned rstack installation from verified local assets
        if: ${{ needs.validate.outputs.unit == 'stack' && needs.validate.outputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          if [[ "$(python3 release/scripts/release_roster.py \
              rstack-in-release "${version}")" != true ]]; then
            exit 0
          fi
          tag="${{ needs.validate.outputs.tag }}"
          assets="${GITHUB_WORKSPACE}/candidate/bundle-root"
          cp candidate/release-candidate-manifest.json \
            "${assets}/registry-stack-${tag}-release-manifest.json"
          (
            cd "${assets}"
            sha256sum -- * > SHA256SUMS
          )
          destination="${RUNNER_TEMP}/rstack-install-smoke"
          bash "${assets}/rstack-${tag}-install.sh" \
            --asset-dir "${assets}" \
            --bin-dir "${destination}/bin" \
            --install-root "${destination}/lib" \
            breg evidence
          test -L "${destination}/bin/rstack"
          test "$(find "${destination}/bin" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test "$("${destination}/bin/rstack" --version)" = "rstack ${version}"
          "${destination}/bin/rstack" components list --format json \
            | jq -e '.components | any(.name == "breg" and .installed == true)' \
            >/dev/null
          "${destination}/bin/rstack" components list --format json \
            | jq -e '.components | any(.name == "evidence" and .installed == true)' \
            >/dev/null
          test "$("${destination}/bin/rstack" breg --version)" = "bregctl ${version}"
          test "$("${destination}/bin/rstack" evidence --version)" = "evidencectl ${version}"

      - name: Upload one candidate manifest and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-stack-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/release-candidate-manifest.json
            candidate/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}-candidate.tar.gz
          if-no-files-found: error
          retention-days: 8

  attest:
    name: Reverify and attest candidate
    needs:
      - validate
      - protected-ci
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_revision }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download compact candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-stack-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate

      - name: Reverify all bytes before requesting OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/extracted
          tar -xzf \
            "candidate/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}-candidate.tar.gz" \
            -C candidate/extracted
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > candidate/trusted-run.json
          python3 release/scripts/release_candidate.py verify-candidate \
            --manifest candidate/release-candidate-manifest.json \
            --bundle \
              "candidate/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}-candidate.tar.gz" \
            --bundle-root candidate/extracted \
            --source-sha "${{ needs.validate.outputs.source_sha }}" \
            --workflow-revision "${{ needs.validate.outputs.workflow_revision }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --release-id "${{ needs.validate.outputs.release_id }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --trusted-run-metadata candidate/trusted-run.json \
            --allow-current-run-in-progress

      - name: Attest manifest and bundle after re-verification
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            candidate/release-candidate-manifest.json
            candidate/${{ needs.validate.outputs.prefix }}-${{ needs.validate.outputs.asset_tag }}-candidate.tar.gz
