name: macOS contributor gates

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  direct-cargo-binaries:
    name: Direct Cargo binaries and database-free gates
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Go for the AWS-LC-FIPS source build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.4
          cache: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # napi-rs CLI 3.8.2 requires Node 22.13 or later.
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            crates/registry-discovery-client-node/package-lock.json
            docs/site/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"

      - name: Prepare Python gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python "$(command -v python3)" .macos-contributor-venv
          uv pip install --python .macos-contributor-venv/bin/python PyYAML==6.0.2
          echo "$PWD/.macos-contributor-venv/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: macos-26
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Cargo runtime-library resolution
        run: >-
          python3 -m unittest
          scripts/test_cargo_runtime_library_path.py
          scripts/test_cargo_runtime_script_contracts.py

      - name: Build and execute Cargo binaries directly
        shell: bash
        run: |
          set -euo pipefail
          source scripts/cargo-runtime-library-path.sh
          registry_cargo_build "$PWD" --locked \
            -p registry-bregctl \
            -p registry-caseworkctl \
            -p registry-schedulingctl \
            -p registry-messagingctl \
            -p registry-evidencectl \
            -p registry-discoveryctl
          for binary in bregctl caseworkctl schedulingctl messagingctl evidencectl discoveryctl; do
            "target/debug/${binary}" --version
          done

      - name: Verify database-free product gates
        shell: bash
        run: |
          set -euo pipefail
          products/casework/scripts/check-checkpoint.sh
          products/scheduling/scripts/check-checkpoint.sh
          products/messaging/scripts/check-checkpoint.sh
          products/evidence/scripts/check-authoring-no-io.sh

      - name: Test the Discovery language bindings
        shell: bash
        run: |
          set -euo pipefail
          # The Node and Python bindings are Cargo-built native libraries.
          # Prepare their exact AWS-LC FIPS output in this shell before invoking
          # either host directly. SIP strips DYLD_* variables from protected
          # executables, so the Python bootstrap explicitly preloads the library
          # from the helper's non-DYLD carrier.
          source scripts/cargo-runtime-library-path.sh
          registry_prepare_cargo_runtime "$PWD" --manifest-path "$PWD/Cargo.toml" \
            --locked -p registry-discovery-client-node
          (
            cd crates/registry-discovery-client-node
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build:debug
            node --test __test__/*.test.js
          )
          (
            cd crates/registry-discovery-client-py
            python3 -m unittest discover -s tests/python -v
          )

      - name: Replay the Discovery tutorial from source
        shell: bash
        run: |
          set -euo pipefail
          # The runner builds the tutorial binaries itself and serves them with
          # their AWS-LC FIPS runtime library, as a contributor's gate does.
          # The runner needs only pure-JS packages. Skipping install scripts
          # keeps the Vale postinstall's unauthenticated GitHub download, which
          # shared macOS runner addresses get rate-limited on, out of this gate.
          cd docs/site
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:tutorial:discovery
