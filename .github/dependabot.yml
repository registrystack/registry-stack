version: 2
updates:
  # Rust workspace at the repository root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Docs site dependencies.
  - package-ecosystem: npm
    directory: "/docs/site"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Pinned GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images, pinned by digest. Without this the pinned digests would
  # silently rot; dependabot keeps them current while preserving the pin.
  - package-ecosystem: docker
    directories:
      - "/release/docker"
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      docker-images:
        patterns:
          - "*"
