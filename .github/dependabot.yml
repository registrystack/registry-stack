version: 2
updates:
  # Rust workspace at the repository root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # wasmtime is pinned to an LTS line (=48.0.2 today). Patch updates
    # within the line are wanted; a minor or major proposal is an LTS jump
    # the pin exists to prevent. wasmtime is the only direct
    # wasmtime-family dependency; add sibling entries here if that changes.
    ignore:
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Docs site dependencies.
  - package-ecosystem: npm
    directory: "/docs/site"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Pinned GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images, pinned by digest. Without this the pinned digests would
  # silently rot; dependabot keeps them current while preserving the pin.
  - package-ecosystem: docker
    directories:
      - "/release/docker"
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      docker-images:
        patterns:
          - "*"
