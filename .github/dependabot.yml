version: 2
updates:
  # Rust workspace at the repository root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major
    # wasmtime is pinned to an LTS line (=48.0.5 today). Patch updates
    # within the line are wanted; a minor or major proposal is an LTS jump
    # the pin exists to prevent. wasmtime is the only direct
    # wasmtime-family dependency; add sibling entries here if that changes.
    ignore:
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # jsonwebtoken 11 sits under every token-verifying path (#1684).
      - dependency-name: "jsonwebtoken"
        update-types:
          - "version-update:semver-major"
      # jsonschema moves once, to the current release, across every crate (#1655).
      - dependency-name: "jsonschema"
        update-types:
          - "version-update:semver-major"
      # The RustCrypto and rand generation moves together: ed25519-dalek 3,
      # p256 0.14, pkcs8 0.11, and rand/rand_core/rand_chacha 0.10 (#1695).
      - dependency-name: "ed25519-dalek"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "p256"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pkcs8"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand_core"
        update-types:
          - "version-update:semver-major"
      # rand_chacha and fake move with the rand 0.10 generation; fake is also
      # pinned exactly so evidencectl source mocks stay deterministic (#1695).
      - dependency-name: "rand_chacha"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "fake"
        update-types:
          - "version-update:semver-major"
      # ureq 3 changes proxy and redirect defaults in evidencectl (#1696).
      - dependency-name: "ureq"
        update-types:
          - "version-update:semver-major"

  # BReg WASM handler SDK: guest authoring crates, the build-time
  # pre-initializer, and the admission-proof harness. A standalone workspace
  # on purpose (see products/breg/wasm-handler-sdk/Cargo.toml), so it is not
  # covered by the root cargo entry above.
  - package-ecosystem: cargo
    directory: "/products/breg/wasm-handler-sdk"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major
    # wasmtime and wasmtime-wizer are pinned to the same LTS line as the root
    # workspace's wasmtime dependency (=48.0.5 today); a minor or major
    # proposal is the LTS jump the pin exists to prevent. phonenumber is
    # pinned exactly because the module-size ceiling was measured against its
    # bundled metadata at this release (template/Cargo.toml); any bump,
    # patch included, needs a deliberate re-measurement, not an automated PR.
    # The admission crate path-depends on registry-platform-script, so a
    # wasmtime patch bump lands in both workspaces in the same change.
    ignore:
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "wasmtime-wizer"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "phonenumber"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # The SDK's path dependencies on workspace crates inherit the root
    # workspace's versions, so the root entry's deferred majors are deferred
    # here too, under the same tickets.
      # jsonwebtoken 11 sits under every token-verifying path (#1684).
      - dependency-name: "jsonwebtoken"
        update-types:
          - "version-update:semver-major"
      # jsonschema moves once, to the current release, across every crate (#1655).
      - dependency-name: "jsonschema"
        update-types:
          - "version-update:semver-major"
      # The RustCrypto and rand generation moves together: ed25519-dalek 3,
      # p256 0.14, pkcs8 0.11, and rand/rand_core/rand_chacha 0.10 (#1695).
      - dependency-name: "ed25519-dalek"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "p256"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pkcs8"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand_core"
        update-types:
          - "version-update:semver-major"

  # Remaining standalone cargo workspaces: the Zed editor extension and the
  # cargo-fuzz targets. Each has its own Cargo.lock outside the root
  # workspace and none carry a version pin that needs protecting.
  - package-ecosystem: cargo
    directories:
      - "/editors/zed"
      - "/products/evidence/fuzz"
      - "/products/manifest/fuzz"
      - "/products/platform/fuzz"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major
    # The platform and Evidence fuzz targets path-depend on the platform
    # crates, so the root entry's deferred majors are deferred here too, under
    # the same tickets.
    ignore:
      # jsonwebtoken 11 sits under every token-verifying path (#1684).
      - dependency-name: "jsonwebtoken"
        update-types:
          - "version-update:semver-major"
      # jsonschema moves once, to the current release, across every crate (#1655).
      - dependency-name: "jsonschema"
        update-types:
          - "version-update:semver-major"
      # The RustCrypto and rand generation moves together: ed25519-dalek 3,
      # p256 0.14, pkcs8 0.11, and rand/rand_core/rand_chacha 0.10 (#1695).
      - dependency-name: "ed25519-dalek"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "p256"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pkcs8"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand_core"
        update-types:
          - "version-update:semver-major"

  # The npm and GitHub Actions entries run monthly; the cargo and docker
  # entries stay weekly. A schedule governs version updates only: Dependabot
  # security updates open when an alert is raised, whatever the interval.

  # Docs site dependencies.
  - package-ecosystem: npm
    directory: "/docs/site"
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    ignore:
      # astro-mermaid accepts only mermaid 10 and 11, and mermaid 12 re-lays
      # out existing diagrams (#1697).
      - dependency-name: "mermaid"
        update-types:
          - "version-update:semver-major"
      # @astrojs/check accepts only TypeScript 5 and 6 (#1698).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Unified product client Node.js bindings: thin napi-rs wrappers, each with
  # its own package-lock.json. optionalDependencies seen in these lockfiles
  # belong to third-party build tooling (e.g. @napi-rs/lzma, @napi-rs/tar)
  # publishing their own platform binaries; they are not this repo's
  # @registrystack/client platform packages, which sync-registry-client-node.py
  # assembles at release time and are never checked into a lockfile Dependabot
  # reads, so no ignore rule is needed here.
  - package-ecosystem: npm
    directories:
      - "/crates/registry-breg-client-node"
      - "/crates/registry-casework-client-node"
      - "/crates/registry-discovery-client-node"
      - "/crates/registry-evidence-client-node"
      - "/crates/registry-messaging-client-node"
      - "/crates/registry-stack-client-node"
    schedule:
      interval: monthly
      time: "05:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    # @types/node tracks the lowest Node.js these packages support
    # (engines.node >=22.12.0), so it stays on the 22 line; move it with the
    # engines floor.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 moves with the editor extension's TypeScript 7 upgrade
      # (#1667).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Editor extension (VS Code) dependencies.
  - package-ecosystem: npm
    directory: "/editors/vscode"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    # @types/vscode is pinned to the engines.vscode floor: vsce refuses to
    # package when the types are newer than the oldest supported editor.
    # Move both together when the floor is raised.
    ignore:
      - dependency-name: "@types/vscode"
      # TypeScript 7 needs tsconfig changes before the extension type-checks
      # (#1667).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # @types/node tracks the Node.js runtime the extension targets (the
      # esbuild bundle targets node20 for the engines.vscode floor), not the
      # latest Node.js; move it deliberately with that floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # Architecture diagram site (LikeC4) dependencies.
  - package-ecosystem: npm
    directory: "/docs/architecture"
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major

  # Pinned GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images, pinned by digest. Without this the pinned digests would
  # silently rot; dependabot keeps them current while preserving the pin.
  - package-ecosystem: docker
    directories:
      - "/release/docker"
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      docker-images:
        patterns:
          - "*"
    # The release builder's Rust version must equal rust-toolchain.toml, so a
    # rust tag bump moves by hand together with that pin (issue #1525).
    # Digest refreshes of the pinned tag are still proposed.
    ignore:
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
