[project]
name = "registry-payment-simulator"
version = "0.1.0"
description = "Local synthetic payment simulator, starting with GovStack-aligned G2P"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "simplejson>=3.19,<4",
  "uvicorn>=0.30,<1",
]

[project.scripts]
payment-simulator = "payment_simulator.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_simulator"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
