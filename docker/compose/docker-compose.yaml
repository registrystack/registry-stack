# Operator-owned Compose adapter for an approved Evidence candidate. It is not
# generated by evidencectl package. Operators select reviewed image digests and
# supply the candidate, runtime, and secrets separately. Authority activation
# is an explicit one-shot operation before preflight and serving.
#
# Required environment:
#   EVIDENCE_CANDIDATE_DIR  absolute path to the evidencectl package output
#   EVIDENCE_RUNTIME_FILE   container-specific runtime.yaml path
#   EVIDENCE_SECRET_ROOT    owner-only Evidence secret directory
#   EVIDENCE_TRANSIT_SOCKET_DIR directory containing transit-proxy.sock
#   EVIDENCE_IMAGE          reviewed Evidence image by digest
name: registry-evidence

services:
  evidence:
    image: ${EVIDENCE_IMAGE:?set EVIDENCE_IMAGE to a reviewed image digest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    volumes:
      - ${EVIDENCE_CANDIDATE_DIR:?set EVIDENCE_CANDIDATE_DIR to the approved candidate}/bundle:/etc/registry-evidence/bundle:ro
      - ${EVIDENCE_CANDIDATE_DIR:?set EVIDENCE_CANDIDATE_DIR to the approved candidate}/compiled-authority.yaml:/etc/registry-evidence/compiled-authority.yaml:ro
      - ${EVIDENCE_RUNTIME_FILE:?set EVIDENCE_RUNTIME_FILE to a container runtime}:/etc/registry-evidence/runtime.yaml:ro
      - ${EVIDENCE_SECRET_ROOT:?set EVIDENCE_SECRET_ROOT to the Evidence secret root}:/run/secrets/registry-evidence:ro
      # Evidence receives only the workload-local proxy socket, never its
      # provider token or auto-auth credentials.
      - ${EVIDENCE_TRANSIT_SOCKET_DIR:?set EVIDENCE_TRANSIT_SOCKET_DIR to the Transit socket directory}:/run/registry-evidence:ro
      # The durable audit file must outlive the container.
      - evidence-audit:/var/lib/registry-evidence
      # Activation writes this named volume through the one-shot service below.
      # The serving process receives the completed state read-only.
      - evidence-authority:/var/lib/registry-evidence/authority:ro
      # Docker otherwise provides an implicit writable /dev/shm tmpfs. Keep it
      # read-only so the audit root is the only regular-file write lane.
      - type: tmpfs
        target: /dev/shm
        read_only: true
    networks: [evidence-net]
    # To reach the listener from the host, publish it explicitly; TLS and
    # public exposure stay upstream concerns for the operator's proxy:
    # ports:
    #   - "127.0.0.1:8080:8080"

  authority-activate:
    image: ${EVIDENCE_IMAGE:?set EVIDENCE_IMAGE to a reviewed image digest}
    profiles: [authority]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - authority
      - activate
      - --runtime-config
      - /etc/registry-evidence/runtime.yaml
      - --document
      - /etc/registry-evidence/compiled-authority.yaml
    volumes:
      - ${EVIDENCE_CANDIDATE_DIR:?set EVIDENCE_CANDIDATE_DIR to the approved candidate}/bundle:/etc/registry-evidence/bundle:ro
      - ${EVIDENCE_CANDIDATE_DIR:?set EVIDENCE_CANDIDATE_DIR to the approved candidate}/compiled-authority.yaml:/etc/registry-evidence/compiled-authority.yaml:ro
      - ${EVIDENCE_RUNTIME_FILE:?set EVIDENCE_RUNTIME_FILE to a container runtime}:/etc/registry-evidence/runtime.yaml:ro
      - ${EVIDENCE_SECRET_ROOT:?set EVIDENCE_SECRET_ROOT to the Evidence secret root}:/run/secrets/registry-evidence:ro
      - evidence-audit:/var/lib/registry-evidence
      - evidence-authority:/var/lib/registry-evidence/authority
      - type: tmpfs
        target: /dev/shm
        read_only: true
    networks: [evidence-net]

networks:
  evidence-net: {}

volumes:
  evidence-audit:
  evidence-authority:
