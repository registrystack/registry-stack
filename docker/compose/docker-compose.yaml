# Operator-owned Compose adapter for an approved Evidence candidate. It is not
# generated by evidencectl build. Operators select reviewed image digests and
# supply the candidate, runtime, and secrets separately.
#
# Required environment:
#   EVIDENCE_CANDIDATE_DIR  absolute path to the approved candidate
#   EVIDENCE_RUNTIME_FILE   container-specific runtime.yaml path
#   EVIDENCE_SECRET_ROOT    owner-only Evidence secret directory
#   EVIDENCE_TRANSIT_SOCKET_DIR directory containing transit-proxy.sock
#   EVIDENCE_IMAGE          reviewed Evidence image by digest
name: registry-evidence

services:
  evidence:
    image: ${EVIDENCE_IMAGE:?set EVIDENCE_IMAGE to a reviewed image digest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    volumes:
      - ${EVIDENCE_CANDIDATE_DIR:?set EVIDENCE_CANDIDATE_DIR to the approved candidate}/bundle:/etc/registry-evidence/bundle:ro
      - ${EVIDENCE_RUNTIME_FILE:?set EVIDENCE_RUNTIME_FILE to a container runtime}:/etc/registry-evidence/runtime.yaml:ro
      - ${EVIDENCE_SECRET_ROOT:?set EVIDENCE_SECRET_ROOT to the Evidence secret root}:/run/secrets/registry-evidence:ro
      # Evidence receives only the workload-local proxy socket, never its
      # provider token or auto-auth credentials.
      - ${EVIDENCE_TRANSIT_SOCKET_DIR:?set EVIDENCE_TRANSIT_SOCKET_DIR to the Transit socket directory}:/run/registry-evidence:ro
      # The append-only audit chain must outlive the container.
      - evidence-audit:/var/lib/registry-evidence
    networks: [evidence-net]
    # To reach the listener from the host, publish it explicitly; TLS and
    # public exposure stay upstream concerns for the operator's proxy:
    # ports:
    #   - "127.0.0.1:8080:8080"

networks:
  evidence-net: {}

volumes:
  evidence-audit:
