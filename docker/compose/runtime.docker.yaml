# Container-shaped runtime configuration for the compose deployment beside
# this file. It is not governed content: it binds a reviewed bundle to one
# environment, exactly like the host-shaped runtime.yaml an evidencectl
# scaffold writes, over the same bundle bytes.
#
# docker-compose.yaml mounts this file over the project's runtime.yaml, so
# every path below is a container path fixed by the image contract:
# deployment inputs under /etc/registry-evidence, writable audit state under
# /var/lib/registry-evidence. The bindHost must stay equal to the static
# address docker-compose.yaml assigns the evidence service.
version: 1

bundleDirectory: /etc/registry-evidence/bundle

listener:
  bindHost: 172.28.0.10
  port: 8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 64
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 30000

# Secret files are read from this directory only: the project's secrets/
# directory, arriving through the read-only project mount.
secretProviders:
  file:
    root: /etc/registry-evidence/secrets

auditStorage:
  path: /var/lib/registry-evidence/audit/evidence.jsonl
  maximumFileBytes: 1073741824

# Add a trust profile here only when a bundle source declares one; the two
# sets must match exactly.
outboundTls:
  systemRoots: true
  trustProfiles: {}
