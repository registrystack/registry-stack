# Example container-shaped runtime configuration for the operator-owned Compose
# adapter. It is not governed content and is never generated by evidencectl
# build. Copy it into an operator runtime file and bind it to the approved
# candidate bundle mounted by docker-compose.yaml.
#
# Every path below is a container path: the approved bundle lives under
# /etc/registry-evidence, secrets under /run/secrets/registry-evidence, and
# writable audit state under /var/lib/registry-evidence. The explicit
# container-private mode permits the wildcard bind inside the isolated Compose
# network; it does not authorize public or direct-TLS exposure.
version: 1

bundleDirectory: /etc/registry-evidence/bundle

listener:
  bindHost: 0.0.0.0
  networkExposure: container-private
  port: 8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 64
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 30000

# Secret files arrive through a separate read-only mount. Their ownership and
# modes must be accepted by the configured container service identity.
secretProviders:
  file:
    root: /run/secrets/registry-evidence

# The workload-local proxy creates this socket in the separately mounted
# /run/registry-evidence directory. Replace the key name and version with the
# exact values that match the governed active public JWK.
signer:
  kind: transit
  unixSocketPath: /run/registry-evidence/transit-proxy.sock
  mount: transit
  keyName: evidence-signing
  keyVersion: 1
  timeoutMilliseconds: 2000

auditStorage:
  path: /var/lib/registry-evidence/audit/evidence.jsonl
  maximumFileBytes: 1073741824

# Add a trust profile here only when a bundle source declares one; the two
# sets must match exactly.
outboundTls:
  systemRoots: true
  trustProfiles: {}
