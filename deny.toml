[graph]
all-features = true
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Advisory ignores must include a scoped rationale and a review trigger.
ignore = [
    # RUSTSEC-2026-0249: `smartstring` 1.0.1 is unmaintained and has no patched
    # release. Its safe `From<String>` conversion has reported undefined
    # behavior (bodil/smartstring#49), also reproduced through Rhai's
    # `ImmutableString` (rhaiscript/rhai#816). Rhai 1.25.1 pulls it into
    # Evidence, its authoring tools, and the shared language server exposed
    # through `relayctl`, where the affected owned-string conversion is
    # reachable. This ignore records accepted residual risk, not a fix.
    # Reviewed 2026-08-13. Review when Rhai replaces `smartstring`, if a
    # maintained patched release appears, after changes to Evidence's Rhai
    # string flow, before accepting untrusted scripts, or if upstream publishes
    # further security findings.
    "RUSTSEC-2026-0249",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT-0 removes MIT's attribution condition. It is used by `borrow-or-share`,
    # a transitive dependency of the language server's URI implementation.
    "MIT-0",
    # MPL-2.0 is weak, file-level copyleft: its obligations attach only to the
    # MPL-licensed files themselves, not to code that merely depends on them.
    # Allowed workspace-wide; the motivating dependency is `smartstring`,
    # pulled in transitively by the `rhai` script runtime.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
