[graph]
all-features = true
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Advisory ignores must include a scoped rationale and a review trigger.
ignore = [
    # RUSTSEC-2026-0249: `smartstring` 1.0.1 is unmaintained and has no patched
    # release. Its safe `From<String>` conversion has reported undefined
    # behavior (bodil/smartstring#49), also reproduced through Rhai's
    # `ImmutableString` (rhaiscript/rhai#816). Rhai 1.25.1 pulls it into
    # Evidence, its authoring tools, and the shared language server exposed
    # through `relayctl`, where the affected owned-string conversion is
    # reachable. This ignore records accepted residual risk, not a fix.
    # Reviewed 2026-08-13. Review when Rhai replaces `smartstring`, if a
    # maintained patched release appears, after changes to Evidence's Rhai
    # string flow, before accepting untrusted scripts, or if upstream publishes
    # further security findings.
    "RUSTSEC-2026-0249",
    # The following advisories all arrive through the Typst rendering tree
    # (`typst`/`typst-pdf`/`krilla`/`typst-library`), which
    # `registry-render` pins at 0.15.1 with a lockfile matched to the Typst
    # release for byte-stable PDF output. None is fixable in this workspace
    # without moving the Typst pin (which is itself a reviewed golden-hash
    # diff). Rendering is offline and template input is governed and
    # hash-covered, so none of these is reachable from request data; the
    # ignores record accepted residual risk from the pinned tree, not fixes.
    # Reviewed 2026-09-17. Review all of these when the Typst pin moves, if
    # patched releases appear that Typst adopts, or if Render starts feeding
    # attacker-influenced input to the affected code paths.
    # bincode 1.3.3 (via syntect/two-face in typst-library): unmaintained.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 (via biblatex/hayagriva in typst-library): unmaintained.
    "RUSTSEC-2024-0436",
    # quick-xml 0.38.4 (via krilla's XMP writer): two DoS-class findings
    # (RUSTSEC-2026-0194, RUSTSEC-2026-0195). The XML it processes is
    # krilla-generated metadata, never request text; upgrading ahead of the
    # Typst pin would diverge from the release lockfile and change PDF XMP
    # bytes, breaking the merge-gate byte-equality contract.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustybuzz 0.20.1 (via krilla, text shaping): unmaintained advisory.
    "RUSTSEC-2026-0206",
    # ttf-parser 0.25.1 (via krilla/fontdb; also a direct render dependency
    # for label-coverage checks): unmaintained advisory.
    "RUSTSEC-2026-0192",
    # yaml-rust 0.4.5 (via syntect/two-face in typst-library): unmaintained.
    "RUSTSEC-2024-0320",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT-0 removes MIT's attribution condition. It is used by `borrow-or-share`,
    # a transitive dependency of the language server's URI implementation.
    "MIT-0",
    # MPL-2.0 is weak, file-level copyleft: its obligations attach only to the
    # MPL-licensed files themselves, not to code that merely depends on them.
    # Allowed workspace-wide; the motivating dependency is `smartstring`,
    # pulled in transitively by the `rhai` script runtime.
    "MPL-2.0",
    # The OpenSSL License covers OpenSSL-derived code vendored inside the
    # AWS-LC FIPS module (`aws-lc-fips-sys`), the always-on FIPS cryptography
    # behind field-level encryption. Review:
    # release/notes/dependency-vetting-aws-lc-fips.md
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
