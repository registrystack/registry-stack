[graph]
all-features = true
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Advisory ignores must include a scoped rationale and a review trigger.
ignore = [
    # RUSTSEC-2026-0249: Rhai 1.27.0 still declares smartstring 1.0.1 as an
    # unconditional dependency. The workspace enables Rhai's compact_str
    # feature, so its map keys and ImmutableString use CompactString and the
    # reported unsound owned-String conversion is outside the compiled Rhai
    # path. registry-platform-script's backend/Unicode regression pins that
    # feature choice. This ignore covers the declared unused package, not a
    # new reachable smartstring use. Owner: Registry Stack maintainers.
    # Reviewed 2026-10-26. Revisit when Rhai or its selected features change,
    # when upstream makes smartstring optional/removes it, or when another
    # dependency introduces a runtime smartstring path.
    "RUSTSEC-2026-0249",
    # The following advisories all arrive through the Typst rendering tree
    # (`typst`/`typst-pdf`/`krilla`/`typst-library`), which
    # `registry-render` pins at 0.15.1 with a lockfile matched to the Typst
    # release for byte-stable PDF output. None is fixable in this workspace
    # without moving the Typst pin (which is itself a reviewed golden-hash
    # diff). Rendering is offline and template input is governed and
    # hash-covered, so none of these is reachable from request data; the
    # ignores record accepted residual risk from the pinned tree, not fixes.
    # Reviewed 2026-09-17. Review all of these when the Typst pin moves, if
    # patched releases appear that Typst adopts, or if Render starts feeding
    # attacker-influenced input to the affected code paths.
    # bincode 1.3.3 (via syntect/two-face in typst-library): unmaintained.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 (via biblatex/hayagriva in typst-library): unmaintained.
    "RUSTSEC-2024-0436",
    # quick-xml 0.38.4 (via krilla's XMP writer): two DoS-class findings
    # (RUSTSEC-2026-0194, RUSTSEC-2026-0195). The XML it processes is
    # krilla-generated metadata, never request text; upgrading ahead of the
    # Typst pin would diverge from the release lockfile and change PDF XMP
    # bytes, breaking the merge-gate byte-equality contract.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustybuzz 0.20.1 (via krilla, text shaping): unmaintained advisory.
    "RUSTSEC-2026-0206",
    # ttf-parser 0.25.1 (via krilla/fontdb; also a direct render dependency
    # for label-coverage checks): unmaintained advisory.
    "RUSTSEC-2026-0192",
    # unsafe-libyaml 0.2.11 (via serde_yaml 0.9.34 in typst-library, directly
    # and through hayagriva): unmaintained, no patched release. It runs only
    # when a template calls Typst's `yaml()`, `yaml.encode()`, or
    # `bibliography()`; no bundle in this repository does. Request data
    # reaches a template as JSON in `sys.inputs.data`, and a YAML data file a
    # bundle keeps for its template is package bytes. Render does not withhold
    # these functions, so keeping request text and request assets away from
    # them is a template review duty, not a renderer guarantee; this ignore
    # does not accept a template that passes them request data.
    # Reviewed 2026-10-12. Beyond the triggers above, review this one when a
    # bundle's template starts calling any of those three functions: the Typst
    # pin and the renderer can stay unchanged while that happens.
    "RUSTSEC-2024-0449",
    # yaml-rust 0.4.5 (via syntect/two-face in typst-library): unmaintained.
    "RUSTSEC-2024-0320",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT-0 removes MIT's attribution condition. It is used by `borrow-or-share`,
    # a transitive dependency of the language server's URI implementation.
    "MIT-0",
    # MPL-2.0 is weak, file-level copyleft: its obligations attach only to the
    # MPL-licensed files themselves, not to code that merely depends on them.
    # Allowed workspace-wide; the motivating dependency is `smartstring`,
    # pulled in transitively by the `rhai` script runtime.
    "MPL-2.0",
    # The OpenSSL License covers OpenSSL-derived code vendored inside the
    # AWS-LC FIPS module (`aws-lc-fips-sys`), the always-on FIPS cryptography
    # behind field-level encryption. Review:
    # release/notes/dependency-vetting-aws-lc-fips.md
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # 0BSD is the BSD licence with its attribution condition removed, like
    # MIT-0 above. It is scoped to `quoted_printable`, which `lettre` needs to
    # encode Messaging's SMTP message bodies.
    { crate = "quoted_printable", allow = ["0BSD"] },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
# CFG-YAML-1: YAML is read only through `registry-platform-yaml`. The workspace
# no longer depends on `serde_yaml_ng`, so its `clippy.toml` entries refuse
# nothing until it returns; this ban refuses the return itself.
# `products/platform/scripts/check-yaml-reader-boundary.sh` requires it.
deny = [
  { crate = "saphyr-parser", wrappers = ["registry-platform-yaml"], reason = "the YAML subset parser is reached only through registry_platform_yaml (CFG-YAML-1)" },
  { crate = "serde_yaml", wrappers = ["hayagriva", "typst-library"], reason = "read YAML through registry_platform_yaml; only the Typst bibliography stack may carry serde_yaml (CFG-YAML-1)" },
  { crate = "yaml-rust", wrappers = ["syntect"], reason = "read YAML through registry_platform_yaml; only syntect's syntax definitions may carry yaml-rust (CFG-YAML-1)" },
  { crate = "serde_yml", reason = "read YAML through registry_platform_yaml::Document::decode or RuntimeConfigLoader (CFG-YAML-1)" },
  { crate = "yaml-rust2", reason = "read YAML through registry_platform_yaml::Document::decode or RuntimeConfigLoader (CFG-YAML-1)" },
  { crate = "saphyr", reason = "read YAML through registry_platform_yaml::Document::decode or RuntimeConfigLoader (CFG-YAML-1)" },
  { crate = "serde_yaml_ng", reason = "read YAML through registry_platform_yaml::Document::decode or RuntimeConfigLoader, and write it with serde_norway (CFG-YAML-1)" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
