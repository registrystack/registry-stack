[workspace]
members = [
    "crates/registry-cli-docs",
    "crates/registry-discovery",
    "crates/registry-discovery-client",
    "crates/registry-discovery-client-node",
    "crates/registry-discovery-client-py",
    "crates/registry-discovery-profile",
    "crates/registry-discoveryctl",
    "crates/registry-evidence",
    "crates/registry-evidence-authoring",
    "crates/registry-evidence-client",
    "crates/registry-evidence-client-node",
    "crates/registry-evidence-client-py",
    "crates/registry-evidence-oid4vci",
    "crates/registry-evidence-verifier",
    "crates/registry-evidencectl",
    "crates/registry-platform-audit",
    "crates/registry-platform-authcommon",
    "crates/registry-platform-buildinfo",
    "crates/registry-platform-canonical-json",
    "crates/registry-platform-config",
    "crates/registry-platform-crypto",
    "crates/registry-platform-httpsec",
    "crates/registry-platform-httputil",
    "crates/registry-platform-oidc",
    "crates/registry-platform-sdjwt",
    "crates/registry-platform-sqlite",
    "crates/registry-platform-testing",
    "crates/registry-manifest-core",
    "crates/registry-manifest-cli",
    "crates/registry-mint",
    "crates/registry-record",
    "crates/registry-breg-client",
    "crates/registry-relay-http-contract",
    "crates/registry-relay-client",
    "crates/registry-relay-client-node",
    "crates/registry-relay-client-py",
    "crates/registry-relay-v2",
    "crates/registry-relayctl",
    "crates/registry-breg",
    "crates/registry-bregctl",
    "crates/registry-stack-client",
    "crates/registry-language-server",
]
exclude = [
    "products/platform/fuzz",
    "products/manifest/fuzz",
]
resolver = "2"

[workspace.package]
version = "0.25.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "RegistryStack source workspace."
repository = "https://github.com/registrystack/registry-stack"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
registry-discovery = { path = "crates/registry-discovery", version = "0.25.0", default-features = false }
registry-discovery-client = { path = "crates/registry-discovery-client", version = "0.25.0" }
registry-discovery-client-node = { path = "crates/registry-discovery-client-node", version = "0.25.0" }
registry-discovery-client-py = { path = "crates/registry-discovery-client-py", version = "0.25.0" }
registry-discovery-profile = { path = "crates/registry-discovery-profile", version = "0.25.0" }
registry-discoveryctl = { path = "crates/registry-discoveryctl", version = "0.25.0" }
registry-evidence = { path = "crates/registry-evidence", version = "0.25.0" }
registry-evidence-authoring = { path = "crates/registry-evidence-authoring", version = "0.25.0" }
registry-evidence-client = { path = "crates/registry-evidence-client", version = "0.25.0" }
registry-evidence-client-node = { path = "crates/registry-evidence-client-node", version = "0.25.0" }
registry-evidence-client-py = { path = "crates/registry-evidence-client-py", version = "0.25.0" }
registry-evidence-oid4vci = { path = "crates/registry-evidence-oid4vci", version = "0.25.0" }
registry-evidence-verifier = { path = "crates/registry-evidence-verifier", version = "0.25.0" }
registry-evidencectl = { path = "crates/registry-evidencectl", version = "0.25.0" }
registry-language-server = { path = "crates/registry-language-server", version = "0.25.0" }
registry-manifest-core = { path = "crates/registry-manifest-core", version = "0.25.0" }
registry-mint = { path = "crates/registry-mint", version = "0.25.0" }
registry-record = { path = "crates/registry-record", version = "0.25.0" }
registry-breg-client = { path = "crates/registry-breg-client", version = "0.25.0" }
registry-relay-http-contract = { path = "crates/registry-relay-http-contract", version = "0.25.0" }
registry-relay-client = { path = "crates/registry-relay-client", version = "0.25.0" }
registry-relay-client-node = { path = "crates/registry-relay-client-node", version = "0.25.0" }
registry-relay-client-py = { path = "crates/registry-relay-client-py", version = "0.25.0" }
registry-relay-v2 = { path = "crates/registry-relay-v2", version = "0.25.0" }
registry-relayctl = { path = "crates/registry-relayctl", version = "0.25.0" }
registry-breg = { path = "crates/registry-breg", version = "0.25.0", default-features = false }
registry-bregctl = { path = "crates/registry-bregctl", version = "0.25.0" }
registry-stack-client = { path = "crates/registry-stack-client", version = "0.25.0" }
registry-platform-audit = { path = "crates/registry-platform-audit", version = "0.25.0" }
registry-platform-authcommon = { path = "crates/registry-platform-authcommon", version = "0.25.0" }
registry-platform-buildinfo = { path = "crates/registry-platform-buildinfo", version = "0.25.0" }
registry-platform-canonical-json = { path = "crates/registry-platform-canonical-json", version = "0.25.0" }
registry-platform-config = { path = "crates/registry-platform-config", version = "0.25.0" }
registry-platform-crypto = { path = "crates/registry-platform-crypto", version = "0.25.0" }
registry-platform-httpsec = { path = "crates/registry-platform-httpsec", version = "0.25.0", default-features = false }
registry-platform-httputil = { path = "crates/registry-platform-httputil", version = "0.25.0" }
registry-platform-oidc = { path = "crates/registry-platform-oidc", version = "0.25.0" }
registry-platform-sdjwt = { path = "crates/registry-platform-sdjwt", version = "0.25.0" }
registry-platform-sqlite = { path = "crates/registry-platform-sqlite", version = "0.25.0" }
registry-platform-testing = { path = "crates/registry-platform-testing", version = "0.25.0" }

anyhow = { version = "1" }
assert-json-diff = { version = "2" }
async-trait = { version = "0.1" }
aws-lc-rs = { version = "1" }
axum = { version = "0.8" }
axum-test = { version = "20" }
base64 = { version = "0.22" }
bytes = { version = "1" }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
chrono = { version = "0.4" }
chrono-tz = { version = "0.10.4" }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
csv = { version = "1" }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
fake = { version = "=4.4.0", default-features = false }
fs2 = { version = "0.4" }
futures = { version = "0.3" }
futures-core = { version = "0.3" }
getrandom = { version = "0.4" }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
hex = { version = "0.4" }
hmac = { version = "0.13" }
http = { version = "1" }
inquire = { version = "0.9.4" }
ipnet = { version = "2" }
# Default features pull an HTTP client for remote $ref resolution and a command
# line parser for the bundled CLI. Every consumer here compiles schemas it
# already holds in memory, so neither belongs in the dependency graph.
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
napi = { version = "3.12.0", features = ["async", "serde-json"] }
napi-build = { version = "2.4.0" }
napi-derive = { version = "3.6.2" }
p256 = { version = "0.13", features = ["ecdsa"] }
pg_query = { version = "=6.2.0", default-features = false }
pkcs1 = { version = "0.7", features = ["alloc"] }
pkcs8 = { version = "0.10" }
proptest = { version = "1" }
pyo3 = { version = "0.29.1", features = ["abi3-py310"] }
pyo3-build-config = { version = "0.29.1" }
rand = { version = "0.9" }
rand_chacha = { version = "0.9" }
rand_core = { version = "0.6", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
rhai = { version = "=1.26.0", features = ["sync", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# `bundled` vendors the SQLite amalgamation, so a statement source needs no
# system library. `hooks` carries the authorizer and the progress handler, which
# are the statement source's safety boundary and its only real cancellation.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks", "limits"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls-native-certs = { version = "0.8.4" }
ryu-js = { version = "=1.0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
schemars = { version = "=1.2.2" }
serde_norway = { version = "0.9" }
serde_path_to_error = { version = "0.1" }
serde_yaml_ng = { version = "0.10.0" }
sha2 = { version = "0.11" }
signal-hook = { version = "0.3" }
subtle = { version = "2" }
tempfile = { version = "3" }
thiserror = { version = "2" }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring", "native-certs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5" }
tower-lsp-server = { version = "0.23" }
tree-sitter = { version = "0.26" }
tree-sitter-yaml = { version = "0.7.2" }
tower-http = { version = "0.7", features = ["cors", "limit", "request-id", "set-header", "timeout", "trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
ulid = { version = "1" }
ureq = { version = "2" }
url = { version = "2" }
utoipa = { version = "5" }
uuid = { version = "1", features = ["v4"] }
wiremock = { version = "0.6" }
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
