coverage:
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default: off
      platform:
        flags:
          - platform
        informational: true
    patch:
      default: off
      platform:
        flags:
          - platform
        informational: true

flags:
  platform:
    paths:
      - "crates/registry-platform-*/**"
    carryforward: true
  manifest-unit:
    paths:
      - "crates/registry-manifest-*/**"
    carryforward: true
  developer-tools:
    paths:
      - "crates/registry-language-server/**"
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  show_carryforward_flags: true
