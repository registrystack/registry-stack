warnings:
  - code: fresh-state-baseline
    classification: breaking-change
    detail: No product reads state v0.41.0 wrote. Install v0.42.0 on fresh databases beside the v0.41.0 deployment and keep the v0.41.0 databases for reconciliation and rollback. See release/notes/v0.42.0.md.
  - code: breg-postgresql-17-utf8
    classification: breaking-change
    detail: BReg requires PostgreSQL 17 or later and a UTF8 database, matching Casework, Scheduling, and Messaging.
  - code: review-and-registry-model
    classification: breaking-change
    detail: BReg projects declare recordTypes and Actions with durable Proposals; Casework reviews use ReviewPolicy, ReviewRequest, ReviewTask, and ReviewResult; Evidence authoring uses one normalized evidence.yaml project. See release/notes/v0.42.0.md.
  - code: configuration-and-wire-renames
    classification: breaking-change
    detail: Configuration names, issuer network policy, webhook and audit envelopes, diagnostics, and client and Rust APIs change as listed in release/notes/v0.42.0.md.
