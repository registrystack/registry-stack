warnings:
  - code: fresh-state-baselines
    classification: breaking-change
    detail: BReg's managed schema fingerprint changes with the Proposal hand-off store, and every package declares the record_timer_store engine feature; the Coordinator refuses protected state schema 4 namespaces and interpreter ABI v1 definitions. Retain previous databases and namespaces, settle Coordinator runs with v0.44.0, provision fresh state, and apply matching v0.45.0 packages and projects before cutover. See release/notes/v0.45.0.md.
  - code: evidence-source-pack-boundary
    classification: breaking-change
    detail: Evidence Sources move into reviewed Adapter packs and v0.45.0 refuses the retired http-json and sqlite-extract Source form, flat target connections, and non-empty acquisitionCapabilities. There is no in-place upgrade and the v0.44.0 to v0.45.0 Evidence upgrade is not rehearsed. Migrate projects by hand, keep the previous deployment and audit, update audit readers for audit v3, and verify a fresh synthetic assertion before cutover. See release/notes/v0.45.0.md.
  - code: unsafe-runtime-config-file
    classification: breaking-change
    detail: Every runtime refuses a configuration file whose file or ancestor directory is not owned by root or the runtime user, or is writable by group or others. Check ownership and modes before cutover. See release/notes/v0.45.0.md.
  - code: shared-report-envelope
    classification: breaking-change
    detail: Operator tools write the shared report envelope with status complete, domain-refusal, usage-error, or operational-failure and command-specific results under outcome. Update automation that parses machine-readable reports. See release/notes/v0.45.0.md.
  - code: record-and-wire-renames
    classification: breaking-change
    detail: Registry Record v1 uses recordTypeIdentifier, BReg Batch, Proposal, and direct-write contracts and SDK names change, BReg takes today's date in project.timezone, and Evidence and Coordinator clients must be upgraded with their servers. Regenerate source exports with the matching bregctl and update clients together. See release/notes/v0.45.0.md.
