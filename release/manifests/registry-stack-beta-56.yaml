warnings:
  - code: fresh-state-baselines
    classification: breaking-change
    detail: BReg refuses the v0.43.0 attachment-verification schema, and Casework and Scheduling refuse ledgers below schema version 200. Retain previous databases for reconciliation and rollback, provision fresh databases, and build and apply matching v0.44.0 packages before cutover. See release/notes/v0.44.0.md.
  - code: rstack-managed-installation
    classification: breaking-change
    detail: Managed local installations expose only rstack on PATH. Replace direct product-tool invocations with the corresponding rstack subcommand and select components during bootstrap or with rstack install. Independently deployed service entrypoints retain their names. See release/notes/v0.44.0.md.
  - code: oid4vci-durable-audit
    classification: breaking-change
    detail: Evidence OID4VCI requires a durable audit destination and audit.hashKeyRef resolving to at least 32 random bytes. Configure the journal and key, back them up together, and check the runtime configuration before cutover. See release/notes/v0.44.0.md.
  - code: command-and-client-parameters
    classification: breaking-change
    detail: Update renamed response-bound, timeout, and retry parameters in clients and use explicit command report formats and artifact destinations. Unknown or ambiguous configuration and singleton arguments are rejected. See release/notes/v0.44.0.md.
  - code: product-authoring-and-wire-contracts
    classification: breaking-change
    detail: Rebuild BReg packages for scalar-only module value types, updated inspection formats, hook configuration and vocabulary, and attachment URL fields; update idempotency and audit consumers. Select Casework report v1alpha2 and Render namespaced problem codes. See release/notes/v0.44.0.md.
