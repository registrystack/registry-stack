warnings:
  - code: client-runtime-floors
    classification: breaking-change
    detail: The unified clients require Node.js 24.11.0 or later and Python 3.11 or later. See release/notes/v0.41.0.md.
  - code: task-grant-status-required
    classification: breaking-change
    detail: Scheduling runtime files require taskGrantStatus; BReg validates its entries when reading the file. Casework deferred grants and status failures require the configuration and client handling described in release/notes/v0.41.0.md.
  - code: retired-compatibility-paths
    classification: breaking-change
    detail: Historical BReg state tolerance and Evidence, Casework, and Scheduling compatibility refusals are removed. Valid v0.40.0 state stays readable; command, diagnostic, and Rust API changes are listed in release/notes/v0.41.0.md.
