warnings:
  - code: breg-statistics-measures
    classification: breaking-change
    detail: BReg statistical datasets require disclosure.type minimum-count-and-rounding, every cell names its measure (JSON dataset.measures and cell measure, a CSV measure column), sum and mean values can be decimal strings or null with status not-applicable, and a dataset declares at most 12 dimensions. Every dataset's definition digest changes once, so earlier releases are no longer served. Update definitions and readers, then republish the periods you need. See release/notes/v0.47.0.md.
  - code: private-key-jwt-audience
    classification: breaking-change
    detail: Every private_key_jwt client must state its client assertion audience, with no default, in BReg, breg-mcp, Casework, Coordinator, Evidence, evidence-oid4vci, Adapter, saved CLI connections and the Node.js and Python clients. A configuration or client without it is refused. Set it to the authorization server's issuer identifier as its metadata publishes it. See release/notes/v0.47.0.md.
  - code: coordinator-fresh-namespace
    classification: breaking-change
    detail: Coordinator protected state schema version 6 refuses version 5 namespaces, and the connection audience joins each connection binding. Settle open Runs with the v0.46.0 binaries, then apply v0.47.0 to a fresh namespace and database identity. See release/notes/v0.47.0.md.
  - code: breg-task-grant-limits
    classification: breaking-change
    detail: BReg refuses a Casework task-grant token without iat and exp, with a lifetime over 900 seconds, or issued in the future beyond the leeway. Reads, statistics and the Proposal review-record read admit a task grant only before its deadline and only for the principal and purpose it names. Issue task-grant tokens for at most 900 seconds with the profile's principal and purpose claims. See release/notes/v0.47.0.md.
  - code: scheduling-appointment-grant-reads
    classification: breaking-change
    detail: A Scheduling appointment detail read admitted only through an appointment.read task grant is held to the grant's service, location and current status, even for the subject's own booking. Give clients that read their own bookings the reads scope. See release/notes/v0.47.0.md.
  - code: evidence-deadline-and-grant-expiry
    classification: breaking-change
    detail: Evidence refuses an acquisition deadline above 300000 milliseconds, releases no acquisition result after the caller's task grant expires (403 evidence.denied), and evidence-oid4vci refuses unrestricted offer clients or scopes outside supervised local development. Lower deadlines, issue longer grants, and list offer clients and scopes. See release/notes/v0.47.0.md.
  - code: casework-principal-claim
    classification: breaking-change
    detail: Casework refuses a casework.yaml whose access profiles for people name different principalClaim values (casework.access-profile.mixed-principal-claims). Set one principalClaim on every person's profile and issue it in every person's token. See release/notes/v0.47.0.md.
  - code: adapter-async-write-origin
    classification: breaking-change
    detail: The Adapter facade polls an asynchronous write only at the source origin it was sent to. After a baseUrl change an unfinished write is held until the original baseUrl returns or the write expires, and rows from earlier versions are quarantined. Let asynchronous writes settle before upgrading. See release/notes/v0.47.0.md.
  - code: adapter-job-revised-items
    classification: breaking-change
    detail: adapter-job store schema 104, which the previous binary refuses, holds possibly admitted items as adapter.job.revised-item, and the direct BReg receiver identity now includes clientAssertionAudience. Back up the store, run passes with the previous binary until no items are pending, check BReg or the Coordinator for admissions of legacy refused items, then run init-store. See release/notes/v0.47.0.md.
  - code: rstack-dev-replaces-sessions
    classification: breaking-change
    detail: rstack dev replaces the per-product development sessions. api --client is removed from the product CLIs, as are caseworkctl dev, evidencectl dev, bregctl examples review, evidencectl access client, evidencectl audit show and evidencectl source add, and evidencectl request prepare no longer takes --client. Use rstack dev, rstack dev token header files or saved connections. See release/notes/v0.47.0.md.
  - code: editor-integration-removed
    classification: breaking-change
    detail: evidencectl tooling language-server and the VS Code and Zed extensions are removed with no desktop replacement. The standalone registry-language-server ships as a release asset. Schema validation through a stock YAML language server is unchanged. See release/notes/v0.47.0.md.
  - code: breg-explain-and-geometry
    classification: breaking-change
    detail: bregctl explain access emits v1alpha9 and explain model emits v1alpha8 with new required members. A BReg client GeoJSON Feature geometry is a union of Point, Polygon and MultiPolygon in Rust, TypeScript and the Python stubs. Accept the new apiVersion values and match the geometry type before reading coordinates. See release/notes/v0.47.0.md.
