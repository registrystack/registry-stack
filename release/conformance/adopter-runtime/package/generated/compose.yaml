name: registry-adopter-probe

x-product-hardening: &product-hardening
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD", "/conformance-only-healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  registry-private-namespace:
    <<: *product-hardening
    image: example.invalid/registrystack/private-namespace@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: private-namespace-holder
    networks: [registry-private]

  registry-postgres:
    <<: *product-hardening
    image: example.invalid/registrystack/postgresql@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: postgresql-state-plane
    network_mode: service:registry-private-namespace
    depends_on:
      registry-private-namespace:
        condition: service_healthy
    volumes:
      - registry-postgres-data:/var/lib/postgresql/data
    secrets:
      - registry-postgres-tls
      - registry-postgres-credentials

  registry-relay-public:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: relay-public
    networks: [registry-edge]
    volumes:
      - type: bind
        source: ./bundles/relay-public
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-public
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-public-state:/var/lib/registry/state
      - registry-relay-public-audit:/var/lib/registry/audit
    secrets: [registry-relay-public-tls]

  registry-relay-consultation:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: relay-consultation
    network_mode: service:registry-private-namespace
    depends_on:
      registry-private-namespace:
        condition: service_healthy
      registry-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./bundles/relay-consultation
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-consultation
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-consultation-state:/var/lib/registry/state
      - registry-relay-consultation-audit:/var/lib/registry/audit
    secrets: [registry-relay-consultation-tls]

  registry-notary:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-notary@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: notary
    network_mode: service:registry-private-namespace
    depends_on:
      registry-private-namespace:
        condition: service_healthy
      registry-postgres:
        condition: service_healthy
      registry-relay-consultation:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./bundles/notary
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/notary
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-notary-state:/var/lib/registry/state
      - registry-notary-audit:/var/lib/registry/audit
    secrets:
      - registry-notary-tls
      - registry-notary-signing-key

networks:
  registry-edge:
    name: registry-adopter-probe-edge
  registry-private:
    name: registry-adopter-probe-private
    internal: true

volumes:
  registry-postgres-data:
  registry-relay-public-state:
  registry-relay-public-audit:
  registry-relay-consultation-state:
  registry-relay-consultation-audit:
  registry-notary-state:
  registry-notary-audit:

secrets:
  registry-postgres-tls:
    file: ../operator/secrets/postgresql-tls
  registry-postgres-credentials:
    file: ../operator/secrets/postgresql-credentials
  registry-relay-public-tls:
    file: ../operator/secrets/relay-public-tls
  registry-relay-consultation-tls:
    file: ../operator/secrets/relay-consultation-tls
  registry-notary-tls:
    file: ../operator/secrets/notary-tls
  registry-notary-signing-key:
    file: ../operator/secrets/notary-signing-key
