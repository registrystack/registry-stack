name: registry-adopter-probe

x-product-hardening: &product-hardening
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  healthcheck:
    test: ["CMD", "/conformance-only-healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3

x-stager-hardening: &stager-hardening
  image: example.invalid/registrystack/postgresql@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  entrypoint: ["/bin/sh", "-ceu"]
  command: ["umask 077\nexit 0\n"]
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_READ_SEARCH]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  network_mode: none
  restart: "no"

services:
  registry-postgresql-stage-secrets:
    <<: *stager-hardening
    volumes:
      - registry-operator-files-postgresql-serve:/registryctl-stage/output/postgresql-serve
      - registry-operator-files-postgresql-bootstrap:/registryctl-stage/output/postgresql-bootstrap
    secrets:
      - source: registry-postgresql-admin-password
        target: postgresql-admin-password
      - source: registry-postgresql-tls-certificate
        target: postgresql-tls-certificate
      - source: registry-postgresql-tls-private-key
        target: postgresql-tls-private-key

  registry-relay-public-stage-secrets:
    <<: *stager-hardening
    volumes:
      - registry-operator-files-relay-public-serve:/registryctl-stage/output/relay-public-serve
    secrets:
      - source: registry-relay-public-tls-certificate
        target: relay-public-tls-certificate
      - source: registry-relay-public-tls-private-key
        target: relay-public-tls-private-key

  registry-relay-consultation-stage-secrets:
    <<: *stager-hardening
    volumes:
      - registry-operator-files-relay-consultation-serve:/registryctl-stage/output/relay-consultation-serve
      - registry-operator-files-relay-consultation-prepare:/registryctl-stage/output/relay-consultation-prepare
      - registry-operator-files-relay-consultation-initialize:/registryctl-stage/output/relay-consultation-initialize
    secrets:
      - source: registry-postgresql-tls-certificate
        target: postgresql-tls-certificate
      - source: registry-relay-consultation-tls-certificate
        target: relay-consultation-tls-certificate
      - source: registry-relay-consultation-tls-private-key
        target: relay-consultation-tls-private-key

  registry-notary-stage-secrets:
    <<: *stager-hardening
    volumes:
      - registry-operator-files-notary-serve:/registryctl-stage/output/notary-serve
      - registry-operator-files-notary-prepare:/registryctl-stage/output/notary-prepare
      - registry-operator-files-notary-initialize:/registryctl-stage/output/notary-initialize
    secrets:
      - source: registry-notary-relay-workload-credential
        target: notary-relay-workload-credential
      - source: registry-notary-signing-key
        target: notary-signing-key
      - source: registry-notary-tls-certificate
        target: notary-tls-certificate
      - source: registry-notary-tls-private-key
        target: notary-tls-private-key
      - source: registry-postgresql-tls-certificate
        target: postgresql-tls-certificate
      - source: registry-relay-consultation-tls-certificate
        target: relay-consultation-tls-certificate

  registry-postgres:
    image: example.invalid/registrystack/postgresql@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    entrypoint:
      - /bin/sh
      - -ceu
      - >-
        test -s /var/lib/postgresql/data/PG_VERSION ||
        { echo 'data directory is empty; run explicit initialization' >&2; exit 1; };
        exec docker-entrypoint.sh "$@"
      - --
    command: [postgres]
    user: "999:999"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0750
    healthcheck:
      test: ["CMD", "/conformance-only-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [registry-runtime]
    depends_on:
      registry-postgresql-stage-secrets:
        condition: service_completed_successfully
    env_file: [./postgresql-server.env]
    volumes:
      - registry-postgresql-data:/var/lib/postgresql/data
      - registry-operator-files-postgresql-serve:/run/secrets:ro

  registry-relay-public:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    restart: unless-stopped
    command: [product-action, relay-public, serve]
    networks: [registry-runtime]
    ports: ["127.0.0.1:4242:4242"]
    depends_on:
      registry-relay-public-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/relay-public-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-public
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-public
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-public-state:/var/lib/registry/state
      - registry-relay-public-audit:/var/lib/registry/audit
      - registry-operator-files-relay-public-serve:/run/secrets:ro

  registry-relay-consultation:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    restart: unless-stopped
    command: [product-action, relay-consultation, serve]
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-relay-consultation-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/relay-consultation-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-consultation
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-consultation
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-consultation-state:/var/lib/registry/state
      - registry-relay-consultation-audit:/var/lib/registry/audit
      - registry-operator-files-relay-consultation-serve:/run/secrets:ro

  registry-notary:
    <<: *product-hardening
    image: example.invalid/registrystack/registry-notary@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    restart: unless-stopped
    command: [product-action, serve]
    networks: [registry-runtime]
    ports: ["127.0.0.1:4255:4255"]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-relay-consultation:
        condition: service_healthy
      registry-notary-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/notary-environment]
    volumes:
      - type: bind
        source: ./bundles/notary
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/notary
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-notary-state:/var/lib/registry/state
      - registry-notary-audit:/var/lib/registry/audit
      - registry-operator-files-notary-serve:/run/secrets:ro

networks:
  registry-runtime:

volumes:
  registry-postgresql-data:
  registry-relay-public-state:
  registry-relay-public-audit:
  registry-relay-consultation-state:
  registry-relay-consultation-audit:
  registry-notary-state:
  registry-notary-audit:
  registry-operator-files-postgresql-serve:
  registry-operator-files-postgresql-bootstrap:
  registry-operator-files-relay-public-serve:
  registry-operator-files-relay-consultation-serve:
  registry-operator-files-relay-consultation-prepare:
  registry-operator-files-relay-consultation-initialize:
  registry-operator-files-notary-serve:
  registry-operator-files-notary-prepare:
  registry-operator-files-notary-initialize:

secrets:
  registry-relay-public-tls-certificate:
    file: ../operator/secrets/relay-public-tls-certificate
  registry-relay-public-tls-private-key:
    file: ../operator/secrets/relay-public-tls-private-key
  registry-relay-consultation-tls-certificate:
    file: ../operator/secrets/relay-consultation-tls-certificate
  registry-relay-consultation-tls-private-key:
    file: ../operator/secrets/relay-consultation-tls-private-key
  registry-notary-tls-certificate:
    file: ../operator/secrets/notary-tls-certificate
  registry-notary-tls-private-key:
    file: ../operator/secrets/notary-tls-private-key
  registry-notary-signing-key:
    file: ../operator/secrets/notary-signing-key
  registry-notary-relay-workload-credential:
    file: ../operator/secrets/notary-relay-workload-credential
  registry-postgresql-tls-certificate:
    file: ../operator/secrets/postgresql-tls-certificate
  registry-postgresql-tls-private-key:
    file: ../operator/secrets/postgresql-tls-private-key
  registry-postgresql-admin-password:
    file: ../operator/secrets/postgresql-admin-password
