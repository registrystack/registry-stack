services:
  registry-postgres:
    entrypoint: [docker-entrypoint.sh]

  registry-postgres-bootstrap:
    image: example.invalid/registrystack/postgresql@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    command: [postgresql-action, bootstrap]
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0750
    restart: "no"
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-postgresql-stage-secrets:
        condition: service_completed_successfully
    env_file:
      - ./postgresql-server.env
      - ../operator/secrets/postgresql-bootstrap-environment
    volumes:
      - registry-operator-files-postgresql-bootstrap:/run/secrets:ro

  registry-relay-public-prepare-state:
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: [product-action, relay-public, prepare_state_store]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    env_file: [../operator/secrets/relay-public-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-public
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-public
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-public-audit:/var/lib/registry/audit

  registry-relay-consultation-prepare-state:
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: [product-action, relay-consultation, prepare_state_store]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-relay-consultation-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/relay-consultation-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-consultation
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-consultation
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-consultation-audit:/var/lib/registry/audit
      - registry-operator-files-relay-consultation-prepare:/run/secrets:ro

  registry-notary-prepare-state:
    image: example.invalid/registrystack/registry-notary@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command: [product-action, prepare_state_store]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-notary-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/notary-environment]
    volumes:
      - type: bind
        source: ./bundles/notary
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/notary
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-notary-audit:/var/lib/registry/audit
      - registry-operator-files-notary-prepare:/run/secrets:ro

  registry-relay-public-initialize:
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: [product-action, relay-public, initialize_state]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    env_file: [../operator/secrets/relay-public-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-public
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-public
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-public-state:/var/lib/registry/state
      - registry-relay-public-audit:/var/lib/registry/audit

  registry-relay-consultation-initialize:
    image: example.invalid/registrystack/registry-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: [product-action, relay-consultation, initialize_state]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-relay-consultation-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/relay-consultation-environment]
    volumes:
      - type: bind
        source: ./bundles/relay-consultation
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/relay-consultation
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-relay-consultation-state:/var/lib/registry/state
      - registry-relay-consultation-audit:/var/lib/registry/audit
      - registry-operator-files-relay-consultation-initialize:/run/secrets:ro

  registry-notary-initialize:
    image: example.invalid/registrystack/registry-notary@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command: [product-action, initialize_state]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    networks: [registry-runtime]
    depends_on:
      registry-postgres:
        condition: service_healthy
      registry-notary-stage-secrets:
        condition: service_completed_successfully
    env_file: [../operator/secrets/notary-environment]
    volumes:
      - type: bind
        source: ./bundles/notary
        target: /run/registry/bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./anchors/notary
        target: /run/registry/anchor
        read_only: true
        bind:
          create_host_path: false
      - registry-notary-state:/var/lib/registry/state
      - registry-notary-audit:/var/lib/registry/audit
      - registry-operator-files-notary-initialize:/run/secrets:ro
