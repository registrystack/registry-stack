    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    image: example.invalid/registrystack/registry-notary@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command: [product-action, prepare_state_store]
    labels:
      io.registrystack.probe.owner: renderer
      io.registrystack.probe.role: prepare-state
    restart: "no"
    network_mode: service:registry-private-namespace
