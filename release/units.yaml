      "dependencies": [],
      "candidate": {
        "payloads": [
          {"template": "discovery-{asset_tag}-linux-amd64", "kind": "binary"},
          {"template": "discoveryctl-{asset_tag}-linux-amd64", "kind": "binary"},
          {"template": "discovery-{asset_tag}-install.sh", "kind": "installer"},
          {"template": "discovery-install.sh", "kind": "installer"},
          {"template": "THIRD_PARTY_NOTICES", "kind": "notice"},
          {"template": "{asset_prefix}-{asset_tag}.sbom.spdx.json", "kind": "sbom"},
          {"template": "{asset_prefix}-{asset_tag}-security-evidence.tar.gz", "kind": "security-evidence"}
        ],
        "images": ["discovery"]
      }
    },
    "evidence-oid4vci": {
