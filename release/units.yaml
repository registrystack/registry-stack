      "tag_prefix": "breg-casework-evidence/",
      "asset_prefix": "registry-breg-casework-evidence",
      "members": ["breg", "bregctl", "casework", "caseworkctl", "evidence", "evidencectl"],
      "artifact_patterns": ["breg-v*-*", "breg-install.sh", "bregctl-v*-*", "casework-v*-*", "casework-install.sh", "caseworkctl-v*-*", "evidence-v*-*", "evidencectl-v*-*", "evidencectl-install.sh"],
      "dependencies": [],
      "candidate": null
    },
    "breg-mcp": {
      "display_name": "Base Registry MCP",
      "status": "held",
      "tag_prefix": "breg-mcp/",
