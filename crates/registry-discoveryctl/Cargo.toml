[package]
name = "registry-discoveryctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline Registry Discovery catalog authoring and immutable index packaging."
repository.workspace = true
publish = false

[[bin]]
name = "discoveryctl"
path = "src/main.rs"

[lints]
workspace = true

[features]
schema = [
  "dep:schemars",
  "registry-discovery/schema",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]

[dependencies]
clap.workspace = true
hex.workspace = true
registry-discovery = { workspace = true, features = ["runtime-config"] }
registry-discovery-profile.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-config.workspace = true
registry-platform-httputil.workspace = true
registry-platform-yaml.workspace = true
reqwest.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
jsonschema.workspace = true
registry-discovery = { workspace = true, features = ["server"] }
tempfile.workspace = true
