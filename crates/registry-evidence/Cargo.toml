[package]
name = "registry-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimum-disclosure signed assertion evidence service."
repository.workspace = true
publish = false

[[bin]]
name = "evidence"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Enables the status ledger PostgreSQL suites. They require
# `EVIDENCE_STATUS_TEST_DATABASE_URL` and fail when it is absent.
postgres-test = []
# Generates the code list JSON Schema from the reader types; see
# `examples/codelist-schema.rs`.
schema = ["registry-platform-yaml/schema"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
http.workspace = true
jsonschema.workspace = true
jsonwebtoken.workspace = true
registry-evidence-verifier.workspace = true
registry-evidence-client.workspace = true
registry-discovery-profile.workspace = true
p256.workspace = true
registry-platform-audit.workspace = true
registry-platform-authcommon.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-crypto = { workspace = true, features = ["transit"] }
registry-platform-config.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-ratelimit.workspace = true
registry-platform-sdjwt.workspace = true
registry-platform-sqlite = { workspace = true, features = ["fixture"] }
registry-platform-yaml.workspace = true
reqwest.workspace = true
rand_core.workspace = true
rhai.workspace = true
rusqlite.workspace = true
rustix.workspace = true
schemars = { workspace = true, features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
assert-json-diff.workspace = true
axum-test.workspace = true
criterion.workspace = true
proptest.workspace = true
rcgen.workspace = true
registry-evidence-authoring.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
wiremock.workspace = true

[[test]]
name = "status_ledger"
path = "tests/status_ledger.rs"
required-features = ["postgres-test"]

[[bench]]
name = "audit_bench"
harness = false
