annotations:
  domains_json: '{"sp": {"label": {"en": "Social protection", "fr": "Protection sociale", "es": "Protección social"}, "description": {"en": "Benefit programmes, eligibility, enrollment, entitlements, referrals and grievance redress.", "fr": "Programmes de prestations, éligibilité, inscription, droits aux prestations, orientations et traitement des réclamations.", "es": "Programas de prestaciones, elegibilidad, inscripción, derechos a prestaciones, derivaciones y atención de reclamos."}}, "crvs": {"label": {"en": "Civil registration", "fr": "État civil", "es": "Registro civil"}, "description": {"en": "Civil registration of vital events and the associated roles and records.", "fr": "Enregistrement des faits d''état civil, avec les rôles et les actes associés.", "es": "Registro de los hechos vitales, con los roles y las actas asociados."}}, "agri": {"label": {"en": "Agriculture", "fr": "Agriculture", "es": "Agricultura"}, "description": {"en": "Agricultural and fisheries production, holdings, cultivation and production-specific roles, facilities, inputs and assertions.", "fr": "Production agricole et halieutique : exploitations, cultures, rôles, installations, intrants et assertions propres à la production.", "es": "Producción agropecuaria y pesquera: fincas, cultivos, roles, instalaciones, insumos y aseveraciones propios de la producción."}}, "land": {"label": {"en": "Land administration", "fr": "Administration foncière", "es": "Administración de tierras"}, "description": {"en": "Land administration, spatial/property units, tenure and boundary assertions.", "fr": "Administration foncière : unités spatiales et foncières, tenure et assertions de limites.", "es": "Administración de tierras: unidades espaciales y prediales, tenencia y aseveraciones de linderos."}}, "environment": {"label": {"en": "Environment", "fr": "Environnement", "es": "Medio ambiente"}, "description": {"en": "Environmentally regulated facilities and their activities, and water-use authorizations.", "fr": "Installations soumises à une réglementation environnementale, leurs activités et les autorisations de prélèvement d''eau.", "es": "Instalaciones sujetas a regulación ambiental, sus actividades y las autorizaciones de uso de agua."}}, "transport": {"label": {"en": "Transport", "fr": "Transports", "es": "Transporte"}, "description": {"en": "Road vehicles, driving entitlements and vessel attributes.", "fr": "Véhicules routiers, droits de conduire et caractéristiques des navires.", "es": "Vehículos de carretera, derechos de conducción y atributos de embarcaciones."}}, "edu": {"label": {"en": "Education", "fr": "Éducation", "es": "Educación"}, "description": {"en": "Education provision, programmes, delivery sites and educational facility types.", "fr": "Offre d''enseignement, programmes, lieux de formation et types d''établissements scolaires.", "es": "Oferta educativa, programas, sedes de enseñanza y tipos de establecimientos educativos."}}, "health": {"label": {"en": "Health", "fr": "Santé", "es": "Salud"}, "description": {"en": "Healthcare facility discovery and integration with selected external FHIR resources/profiles; no replacement medical ontology.", "fr": "Découverte des établissements de santé et intégration avec une sélection de ressources et profils FHIR externes ; pas d''ontologie médicale de remplacement.", "es": "Descubrimiento de establecimientos de salud e integración con recursos y perfiles FHIR externos seleccionados; sin ontología médica de reemplazo."}}, "tax": {"label": {"en": "Tax administration", "fr": "Administration fiscale", "es": "Administración tributaria"}, "description": {"en": "Registration of persons and organizations with tax authorities, by tax type.", "fr": "Enregistrement des personnes et des organisations auprès des administrations fiscales, par type d''impôt.", "es": "Inscripción de personas y organizaciones ante las administraciones tributarias, por tipo de impuesto."}}, "elections": {"label": {"en": "Elections", "fr": "Élections", "es": "Elecciones"}, "description": {"en": "Voter registration, electoral districts and polling stations.", "fr": "Inscription sur les listes électorales, circonscriptions et bureaux de vote.", "es": "Inscripción electoral, circunscripciones y mesas de votación."}}, "metrics": {"label": {"en": "Metrics", "fr": "Indicateurs", "es": "Indicadores"}, "description": {"en": "Computable aggregate indicators with declarative calculations, dimensions and external alignments.", "fr": "Indicateurs agrégés calculables, avec calculs déclaratifs, dimensions et alignements externes.", "es": "Indicadores agregados calculables, con cálculos declarativos, dimensiones y alineaciones externas."}}}'
