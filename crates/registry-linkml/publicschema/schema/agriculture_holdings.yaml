    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      label_es: Superficie utilizada
      label_fr: Superficie utilisée
      description_es: La superficie de la parcela vinculada que utiliza esta finca. Las superficies
        utilizadas por distintas fincas pueden superponerse; no sumarlas sin una regla de asignación.
      description_fr: La superficie de la parcelle liée que cette exploitation utilise. Les superficies
