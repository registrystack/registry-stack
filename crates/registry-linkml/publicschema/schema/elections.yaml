id: https://publicschema.org/linkml/elections
name: publicschema-elections
title: Voter registration
description: Voter registration and the electoral districts and polling stations it assigns.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- identity
- misc
- registry
classes:
  VoterRegistration:
    class_uri: publicschema:elections/VoterRegistration
    title: Voter Registration
    description: The recognition by an electoral authority that a person is entered in its register
      of electors for a jurisdiction. Being registered does not by itself mean the person may vote in every election.
    slots:
    - electoral_districts
    - polling_service_point
    status: bibo:draft
    is_a: Registration
    close_mappings:
    - https://pages.nist.gov/VoterRecordsInterchange/
    annotations:
      label_es: Inscripción electoral
      label_fr: Inscription électorale
      description_es: El reconocimiento por una autoridad electoral de que una persona está inscrita
        en su registro de electores para una jurisdicción. Estar inscrito no implica por sí solo que
        la persona pueda votar en todas las elecciones.
      description_fr: La reconnaissance par une autorité électorale qu'une personne est inscrite
        dans son registre des électeurs pour une juridiction. Être inscrit ne signifie pas à lui seul
        que la personne peut voter à chaque élection.
      source_domain: elections
      bibliography_refs: '["nist-sp-1500-102", "oasis-eml-7", "venice-commission-cdl-ad-2002-023"]'
      external_alignments_json: '[{"label": "VoterRecord", "match": "close", "note": "NIST SP 1500-102
        Voter Records Interchange 1.0 also carries a voter status (active, inactive or other) that this
        concept does not model.", "uri": "https://pages.nist.gov/VoterRecordsInterchange/", "vocabulary":
        "NIST SP 1500-102", "vocabulary_id": "nist-sp-1500-102"}, {"label": "Voter Registration (schema 310)",
        "match": "related", "note": "OASIS EML 7.0 schema 310 is a message for registering voters, not a
        register entry.", "uri": "https://docs.oasis-open.org/election/eml/v7.0/eml-v7.0.html", "vocabulary":
        "OASIS EML 7.0", "vocabulary_id": "oasis-eml-7"}]'
slots:
  electoral_districts:
    slot_uri: publicschema:elections/electoral_districts
    title: Electoral districts
    description: The electoral areas the registration places the person in, such as a constituency,
      ward or precinct, one for each kind of election where they differ. Being placed in a district does
      not by itself mean the person may vote in every election held there.
    range: Location
    multivalued: true
    status: bibo:draft
    annotations:
      label_es: Circunscripciones electorales
      label_fr: Circonscriptions électorales
      description_es: Las áreas electorales en las que la inscripción sitúa a la persona, como una
        circunscripción, un distrito electoral o una sección electoral, una por cada tipo de
        elección cuando difieren. Estar situado en una circunscripción no implica por sí solo que
        la persona pueda votar en todas las elecciones que se celebren allí.
      description_fr: Les zones électorales dans lesquelles l'inscription place la personne, telles
        qu'une circonscription, un quartier électoral ou une section électorale, une par type
        d'élection lorsqu'elles diffèrent. Être placé dans une circonscription ne signifie pas à lui
        seul que la personne peut voter à chaque élection qui s'y tient.
      source_domain: elections
      category: location
      sensitivity: sensitive
      external_alignments_json: '[{"label": "ReportingUnit", "match": "related", "note": "NIST SP 1500-100
        uses ReportingUnit, typed as precinct, ward or another unit, for the areas that results are reported
        for.", "uri": "https://pages.nist.gov/ElectionResultsReporting/", "vocabulary": "NIST SP 1500-100",
        "vocabulary_id": "nist-sp-1500-100"}, {"label": "ElectionDistricts", "match": "related", "uri":
        "https://docs.oasis-open.org/election/eml/v7.0/eml-v7.0.html", "vocabulary": "OASIS EML 7.0", "vocabulary_id":
        "oasis-eml-7"}]'
      bibliography_refs: '["nist-sp-1500-100", "oasis-eml-7"]'
  polling_service_point:
    slot_uri: publicschema:elections/polling_service_point
    title: Polling station
    description: The polling station assigned to the person for voting in person, when the register
      records one. It can reveal the neighbourhood where the person lives.
    range: ServicePoint
    multivalued: false
    status: bibo:draft
    annotations:
      label_es: Centro de votación
      label_fr: Bureau de vote
      description_es: El centro de votación asignado a la persona para votar en persona, cuando el
        registro consigna uno. Puede revelar el barrio en el que reside la persona.
      description_fr: Le bureau de vote attribué à la personne pour voter en personne, lorsque le
        registre en enregistre un. Il peut révéler le quartier où réside la personne.
      source_domain: elections
      category: location
      sensitivity: sensitive
      external_alignments_json: '[{"label": "PollingPlace", "match": "related", "uri": "https://docs.oasis-open.org/election/eml/v7.0/eml-v7.0.html",
        "vocabulary": "OASIS EML 7.0", "vocabulary_id": "oasis-eml-7"}]'
      bibliography_refs: '["oasis-eml-7"]'
