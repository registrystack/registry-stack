id: https://publicschema.org/linkml/agriculture_operations
name: publicschema-agriculture-operations
title: Agricultural facilities, services and regulated products
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- core
- identity
- registry
- government
classes:
  AgriculturalFacility:
    class_uri: publicschema:agri/AgriculturalFacility
    title: Agricultural Facility
    description: A physical site or installation used for agricultural production, storage, processing,
      trade or technical support. Its identity is distinct from its operator, a holding and any registration.
    status: bibo:draft
    slots:
    - name
    - identifiers
    - facility_function
    - facility_location
    - facility_operator
    see_also:
    - https://www.fao.org/global-soil-partnership/glosolan/en/
    - https://www.enam.gov.in/web/resources/FAQs-of-eNam
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-glosolan", "india-enam-facilities"]'
  AgriculturalLaboratory:
    class_uri: publicschema:agri/AgriculturalLaboratory
    title: Agricultural Laboratory
    description: A physical laboratory facility providing analysis or testing of agricultural materials.
      Network membership does not establish accreditation or proficiency.
    status: bibo:draft
    slots:
    - laboratory_capability
    see_also:
    - https://www.fao.org/global-soil-partnership/glosolan/en/
    is_a: AgriculturalFacility
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-glosolan"]'
  Apiary:
    class_uri: publicschema:agri/Apiary
    title: Apiary
    description: A site at which bee colonies are kept. Colonies and their movements have identities separate
      from the site.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.nationalbeeunit.com/assets/PDFs/6_Bees_and_the_Law/Hive_count/FAQs_for_Hive_Count_2021.pdf
    is_a: AgriculturalFacility
    annotations:
      source_domain: agri
      bibliography_refs: '["beebase-apiaries"]'
  AquacultureEstablishment:
    class_uri: publicschema:agri/AquacultureEstablishment
    title: Aquaculture Establishment
    description: A site or installation where aquatic organisms are farmed or held for aquaculture. The
      operating business and its authorization are separate.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.gov.scot/publications/registers-of-authorised-aquaculture-production-businesses-and-authorised-processing-establishments/
    is_a: AgriculturalFacility
    annotations:
      source_domain: agri
      bibliography_refs: '["scotland-aquaculture-register"]'
  LivestockEstablishment:
    class_uri: publicschema:agri/LivestockEstablishment
    title: Livestock Establishment
    description: A premises or installation where terrestrial livestock are kept or handled, including
      production and assembly sites. It is distinct from the animals and the agricultural holding.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2024/en_glossaire.htm
    is_a: AgriculturalFacility
    annotations:
      source_domain: agri
      bibliography_refs: '["woah-terrestrial-2024"]'
  PlantNursery:
    class_uri: publicschema:agri/PlantNursery
    title: Plant Nursery
    description: A facility where plants are propagated or grown for planting elsewhere. It is distinct
      from a nursery business and authorization to issue plant passports.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.gov.uk/guidance/issuing-plant-passports-to-trade-plants-in-great-britain
    is_a: AgriculturalFacility
    annotations:
      source_domain: agri
      bibliography_refs: '["uk-plant-passports"]'
  AgriculturalMachinery:
    class_uri: publicschema:agri/AgriculturalMachinery
    title: Agricultural Machinery
    description: An identifiable physical machine used in agricultural work. A hired machine retains its
      identity independently of a service provider, owner or holding.
    status: bibo:draft
    slots:
    - name
    - identifiers
    - machine_category
    - machine_model
    - machine_serial_number
    see_also:
    - https://agrimachinery.nic.in/Index/farmsapp
    annotations:
      source_domain: agri
      bibliography_refs: '["india-farms"]'
  FishingVessel:
    class_uri: publicschema:agri/FishingVessel
    title: Fishing Vessel
    description: An identifiable vessel used for fishing. Changes in name, flag or operator do not alone
      create a different vessel; registration and permission to fish remain separate.
    status: bibo:draft
    slots:
    - name
    - identifiers
    - vessel_flag
    - vessel_length
    see_also:
    - https://www.fao.org/global-record/background/unique-vessel-identifier/en/
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-vessel-uvi"]'
  AgriculturalServiceRole:
    class_uri: publicschema:agri/AgriculturalServiceRole
    title: Agricultural Service Role
    description: A person, organization or group acting as a provider of specified agricultural services
      during a stated period. This relationship does not establish professional qualification or legal
      permission.
    status: bibo:draft
    slots:
    - service_provider
    - agricultural_service
    - service_area
    - service_equipment
    - start_date
    - end_date
    see_also:
    - https://agrimachinery.nic.in/Index/farmsapp
    annotations:
      source_domain: agri
      bibliography_refs: '["india-farms"]'
  InputSupplierRole:
    class_uri: publicschema:agri/InputSupplierRole
    title: Input Supplier Role
    description: An agricultural service role supplying inputs such as seed, feed, fertilizer or pesticides.
      Supply activity does not itself establish approval for every product.
    status: bibo:draft
    slots:
    - supplied_product
    see_also:
    - https://www.hse.gov.uk/pesticides/register.htm
    is_a: AgriculturalServiceRole
    annotations:
      source_domain: agri
      bibliography_refs: '["uk-pesticide-work"]'
  PesticideApplicatorRole:
    class_uri: publicschema:agri/PesticideApplicatorRole
    title: Pesticide Applicator Role
    description: An agricultural service role applying pesticides. Competence certification and permission
      to use a particular product are separate assertions.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.hse.gov.uk/pesticides/register.htm
    is_a: AgriculturalServiceRole
    annotations:
      source_domain: agri
      bibliography_refs: '["uk-pesticide-work"]'
  SeedOperatorRole:
    class_uri: publicschema:agri/SeedOperatorRole
    title: Seed Operator Role
    description: An agricultural service role producing, processing, packing or marketing seed. The role
      is distinct from seed-lot certification and plant-variety identity.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.sasa.gov.uk/document-library/public-register-seeds-merchants-processors-packers
    is_a: AgriculturalServiceRole
    annotations:
      source_domain: agri
      bibliography_refs: '["sasa-seed-register"]'
  ProducerOrganization:
    class_uri: publicschema:agri/ProducerOrganization
    title: Producer Organization
    description: An identifiable organization formed by agricultural producers to pursue shared production,
      marketing or service objectives. Recognition under a particular legal regime is represented separately.
    status: bibo:draft
    slots:
    - producer_sector
    see_also:
    - https://agriculture.ec.europa.eu/common-agricultural-policy/agri-food-supply-chain/producer-and-interbranch-organisations_en
    is_a: Organization
    annotations:
      source_domain: agri
      bibliography_refs: '["ec-producer-organizations"]'
  AgriculturalProduct:
    class_uri: publicschema:agri/AgriculturalProduct
    title: Agricultural Product
    description: A specified product intended for use as an agricultural input. It describes the product
      specification or marketed formulation, not an individual package, shipment, batch or authorization.
    status: bibo:draft
    slots:
    - name
    - identifiers
    - product_designation
    - product_component
    see_also:
    - https://food.ec.europa.eu/plants/pesticides/eu-pesticides-database_en
    annotations:
      source_domain: agri
      bibliography_refs: '["ec-pesticides-database"]'
  FeedProduct:
    class_uri: publicschema:agri/FeedProduct
    title: Feed Product
    description: A product intended for oral feeding to animals. Product description is distinct from
      registration or approval of the feed business.
    status: bibo:draft
    slots: []
    see_also:
    - https://www.gov.uk/government/publications/starting-an-animal-feed-business/starting-an-animal-feed-business
    is_a: AgriculturalProduct
    annotations:
      source_domain: agri
      bibliography_refs: '["uk-feed-business"]'
  FertilizerProduct:
    class_uri: publicschema:agri/FertilizerProduct
    title: Fertilizer Product
    description: A product intended to provide nutrients to plants or mushrooms. Soil improvers and other
      fertilising-product categories are not automatically fertilizers.
    status: bibo:draft
    slots: []
    see_also:
    - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A32019R1009
    is_a: AgriculturalProduct
    annotations:
      source_domain: agri
      bibliography_refs: '["eu-fertilizer-2019"]'
  PesticideProduct:
    class_uri: publicschema:agri/PesticideProduct
    title: Pesticide Product
    description: A prepared agricultural input product intended to control pests or regulate plant growth,
      including defoliants and desiccants. Active substances, permitted uses and national product authorizations
      remain separate from product identity.
    status: bibo:draft
    slots: []
    see_also:
    - https://faoterm.fao.org/viewEntry.html?entryId=182628&language=en
    - https://food.ec.europa.eu/plants/pesticides/eu-pesticides-database_en
    is_a: AgriculturalProduct
    annotations:
      source_domain: agri
      bibliography_refs: '["ec-pesticides-database", "faoterm-pesticide"]'
  ProductComponent:
    class_uri: publicschema:ProductComponent
    title: Product Component
    description: A named or coded constituent of a product, optionally with a quantity expressing its
      concentration on a stated basis. This is a composition description, not an application instruction.
    status: bibo:draft
    slots:
    - component_substance
    - component_amount
    - component_basis
    see_also:
    - https://food.ec.europa.eu/plants/pesticides/eu-pesticides-database_en
    annotations:
      bibliography_refs: '["ec-pesticides-database"]'
  AgriculturalCertification:
    class_uri: publicschema:agri/AgriculturalCertification
    title: Agricultural Certification
    description: An assertion by a certifying organization that an agricultural subject meets a stated agricultural scheme
      within an explicit scope and validity period. It is distinct from the certificate document, registration
      and permission to operate.
    status: bibo:draft
    slots:
    - identifiers
    - certified_subject
    - certifying_organization
    - certification_scheme
    - certification_scope
    - valid_from
    - valid_to
    see_also:
    - https://agdatacommons.nal.usda.gov/articles/dataset/The_Organic_INTEGRITY_Database/24661722
    annotations:
      source_domain: agri
      bibliography_refs: '["usda-integrity"]'
  IrrigationScheme:
    class_uri: publicschema:agri/IrrigationScheme
    title: Irrigation Scheme
    description: An organized set of infrastructure for supplying irrigation water to an agricultural
      service area. Its equipped or command area is distinct from actual seasonal irrigation and from
      water-use permission.
    status: bibo:draft
    slots:
    - name
    - identifiers
    - scheme_operator
    - irrigation_service_area
    - irrigation_component
    see_also:
    - https://www.fao.org/aquastat/en/overview/methodology/irrig-drainage/index.html
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-aquastat-irrigation"]'
  WaterUseAuthorization:
    class_uri: publicschema:environment/WaterUseAuthorization
    title: Water Use Authorization
    description: An authorization to abstract or otherwise use water for stated purposes, sources and
      conditions. It is distinct from an irrigation scheme, a water source and an observation of actual
      water use.
    status: bibo:draft
    slots:
    - authorized_water_source
    - authorized_water_quantity
    - water_quantity_period
    - irrigation_scheme
    see_also:
    - https://www.gov.uk/guidance/water-management-apply-for-a-water-abstraction-or-impoundment-licence
    is_a: Authorization
    annotations:
      source_domain: environment
      bibliography_refs: '["uk-water-authorization"]'
  ProducerMembership:
    class_uri: publicschema:agri/ProducerMembership
    title: Producer membership
    description: A dated relationship in which a person, group or organization is a member of a producer
      organization. Membership is distinct from employment, ownership of a holding and recognition of
      the producer organization by an authority.
    status: bibo:draft
    slots:
    - producer_member
    - producer_organization
    - producer_membership_role
    - start_date
    - end_date
    see_also:
    - https://agriculture.ec.europa.eu/common-agricultural-policy/agri-food-supply-chain/producer-and-interbranch-organisations_en
    annotations:
      source_domain: agri
      bibliography_refs: '["ec-producer-organizations"]'
slots:
  facility_function:
    slot_uri: publicschema:agri/facility_function
    title: Facility function
    description: A function performed at an agricultural facility; codes identify their own classification
      scheme.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  facility_location:
    slot_uri: publicschema:facility_location
    title: Facility location
    description: The named geographic or administrative area containing a facility; not a geometry.
    range: Location
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  facility_operator:
    slot_uri: publicschema:facility_operator
    title: Facility operator
    description: URI of the person, organization or group operating a facility in this description. Operator
      history should use dated relationships.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  laboratory_capability:
    slot_uri: publicschema:laboratory_capability
    title: Laboratory capability
    description: A declared analytical capability, identifying its method or scope vocabulary; not proof
      of accreditation.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  machine_category:
    slot_uri: publicschema:machine_category
    title: Machine category
    description: The machine type in an explicitly identified classification.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  machine_model:
    slot_uri: publicschema:machine_model
    title: Machine model
    description: The manufacturer model designation of a machine.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  machine_serial_number:
    slot_uri: publicschema:machine_serial_number
    title: Machine serial number
    description: The manufacturer-assigned serial number, interpreted with manufacturer or identifier
      scheme context.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  vessel_flag:
    slot_uri: publicschema:transport/vessel_flag
    title: Vessel flag
    description: The state under whose flag the vessel operates in this description.
    range: Country
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: transport
      category: agriculture
  vessel_length:
    slot_uri: publicschema:transport/vessel_length
    title: Vessel length
    description: Length overall of a vessel, with its unit explicitly stated.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: transport
      category: agriculture
  service_provider:
    slot_uri: publicschema:service_provider
    title: Service provider
    description: URI of the person, organization or group performing this role; the URI identifies the
      actor rather than its registration.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  agricultural_service:
    slot_uri: publicschema:agri/agricultural_service
    title: Agricultural service
    description: A service or activity offered in this role, with its classification scheme.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  service_area:
    slot_uri: publicschema:service_area
    title: Service area
    description: A geographic or administrative area in which the service is offered.
    range: Location
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  service_equipment:
    slot_uri: publicschema:agri/service_equipment
    title: Service equipment
    description: A machine offered or used by this service role, without implying ownership.
    range: AgriculturalMachinery
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  supplied_product:
    slot_uri: publicschema:agri/supplied_product
    title: Supplied product
    description: URI of an input product supplied under this role, including medicinal products or seed
      lots defined in their own domains.
    range: uri
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  producer_sector:
    slot_uri: publicschema:agri/producer_sector
    title: Producer sector
    description: A production sector in which a producer organization acts.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  product_designation:
    slot_uri: publicschema:product_designation
    title: Product designation
    description: A marketed designation or specification distinguishing a product.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  product_component:
    slot_uri: publicschema:product_component
    title: Product component
    description: A constituent and its declared composition in a product.
    range: ProductComponent
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  component_substance:
    slot_uri: publicschema:component_substance
    title: Component substance
    description: The constituent identified by a code and scheme, optionally with a descriptive label.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  component_amount:
    slot_uri: publicschema:component_amount
    title: Component amount
    description: The quantity expressing the constituent concentration on the stated basis; units and
      basis must be interpreted together.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  component_basis:
    slot_uri: publicschema:component_basis
    title: Component basis
    description: The denominator or basis of composition, such as mass per product volume or mass fraction.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  certified_subject:
    slot_uri: publicschema:certified_subject
    title: Certified subject
    description: URI of the operation, product, lot, facility or actor to which the certification applies.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  certifying_organization:
    slot_uri: publicschema:certifying_organization
    title: Certifying organization
    description: The organization responsible for the certification assertion.
    range: Organization
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  certification_scheme:
    slot_uri: publicschema:certification_scheme
    title: Certification scheme
    description: URI identifying the certification scheme and, where material, its edition.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  certification_scope:
    slot_uri: publicschema:certification_scope
    title: Certification scope
    description: The activities, products or limitations expressly covered by certification.
    range: string
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  scheme_operator:
    slot_uri: publicschema:agri/scheme_operator
    title: Scheme operator
    description: URI of the person, organization or group operating the irrigation scheme.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  irrigation_service_area:
    slot_uri: publicschema:agri/irrigation_service_area
    title: Irrigation service area
    description: The equipped service or command area of the scheme with its unit; not the area actually
      irrigated during a season.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  irrigation_component:
    slot_uri: publicschema:agri/irrigation_component
    title: Irrigation component
    description: URI of an infrastructure component forming part of the scheme, such as a canal, pump
      or reservoir.
    range: uri
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  authorized_water_source:
    slot_uri: publicschema:environment/authorized_water_source
    title: Water source
    description: URI identifying the water body or source covered by an authorization.
    range: uri
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: environment
      category: agriculture
  authorized_water_quantity:
    slot_uri: publicschema:environment/authorized_water_quantity
    title: Authorized water quantity
    description: A quantity of water allowed during the separately stated accounting period; not observed
      withdrawal.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: environment
      category: agriculture
  water_quantity_period:
    slot_uri: publicschema:environment/water_quantity_period
    title: Water quantity period
    description: The accounting period for the authorized quantity, such as per calendar year or per day.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: environment
      category: agriculture
  irrigation_scheme:
    slot_uri: publicschema:agri/irrigation_scheme
    title: Irrigation scheme
    description: The irrigation scheme associated with the authorization.
    range: IrrigationScheme
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  producer_member:
    slot_uri: publicschema:agri/producer_member
    title: Producer member
    description: URI of the person, group or organization holding this membership.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  producer_organization:
    slot_uri: publicschema:agri/producer_organization
    title: Producer organization
    description: The producer organization in which membership is held.
    range: ProducerOrganization
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  producer_membership_role:
    slot_uri: publicschema:agri/producer_membership_role
    title: Producer membership role
    description: A membership role or category defined by the organization or membership scheme.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
