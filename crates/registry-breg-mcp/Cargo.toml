[package]
name = "registry-breg-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Citizen-facing MCP gateway that lets a chat host act for one verified citizen against a Base Registry Engine."
repository.workspace = true
publish = false

[[bin]]
name = "breg-mcp"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Runs the gateway against a real Base Registry Engine on PostgreSQL. The
# engine is a dev-dependency only: this feature enables its test features and
# never places the runtime in the gateway's normal dependency graph.
postgres-test = [
    "registry-breg/postgres-test",
    "registry-breg/runtime",
    "registry-breg/tooling",
]
# Derives the runtime configuration JSON Schema the generator below writes.
schema = [
    "dep:schemars",
    "registry-platform-audit/schema",
    "registry-platform-config/schema",
    "registry-platform-yaml/schema",
]

[[test]]
name = "postgres_gateway"
path = "tests/postgres_gateway.rs"
required-features = ["postgres-test"]

# The scripted local run of the citizen journey against the `breg-mcp` and
# `breg-review` binaries, driven by
# products/breg/acceptance/citizen-address-correction/run-local.sh.
[[example]]
name = "citizen_local_run"
path = "examples/citizen_local_run.rs"
required-features = ["postgres-test"]

# Writes the runtime configuration JSON Schema committed under
# products/breg/generated/mcp-runtime.
[[example]]
name = "mcp-runtime-schema"
path = "examples/mcp-runtime-schema.rs"
required-features = ["schema"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
registry-breg-client.workspace = true
registry-platform-audit.workspace = true
registry-platform-authcommon.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-ratelimit.workspace = true
registry-platform-yaml.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
jsonschema.workspace = true
registry-breg.workspace = true
# The composed journey test serves the citizen review page beside the gateway;
# the gateway itself never links the page.
registry-breg-review.workspace = true
registry-platform-testing = { workspace = true, features = ["test-authorization-server"] }
reqwest.workspace = true
# The test client reaches the gateway over plain loopback HTTP. rmcp's
# `reqwest` feature would add reqwest's aws-lc-rs rustls provider beside the
# workspace's ring one, and rustls then refuses to pick either at runtime.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
tokio-postgres.workspace = true
