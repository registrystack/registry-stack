[package]
name = "registry-platform-oidc-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded Python token verification over Registry Stack OIDC primitives."
readme = "README.md"
repository.workspace = true
publish = false

[lib]
name = "registry_platform_oidc"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
oidc_core = { package = "registry-platform-oidc", path = "../registry-platform-oidc" }
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
registry-platform-testing.workspace = true
