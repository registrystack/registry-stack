[package]
name = "registry-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only Registry Discovery index and HTTP service."
repository.workspace = true
publish = false

[[bin]]
name = "discovery"
path = "src/main.rs"
required-features = ["server"]

[lints]
workspace = true

[features]
default = ["server"]
server = [
  "runtime-config",
  "dep:axum",
  "dep:clap",
  "dep:http",
  "dep:registry-platform-buildinfo",
  "dep:registry-platform-httpsec",
  "dep:tokio",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
]
# The runtime configuration types and their offline check, without the
# service.
runtime-config = ["dep:registry-platform-config", "dep:registry-platform-yaml"]
schema = [
  "runtime-config",
  "dep:schemars",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]

[dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
http = { workspace = true, optional = true }
registry-discovery-profile.workspace = true
registry-platform-buildinfo = { workspace = true, optional = true }
registry-platform-canonical-json.workspace = true
registry-platform-config = { workspace = true, optional = true }
registry-platform-httpsec = { workspace = true, features = ["server"], optional = true }
registry-platform-yaml = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
axum-test.workspace = true
futures.workspace = true
tempfile.workspace = true
tower.workspace = true
