[package]
name = "registry-evidence-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relying-party client for requesting and verifying signed Evidence responses."
readme = "README.md"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Derive the JSON Schema of the client profile and reviewed contracts files.
schema = ["dep:schemars", "registry-platform-yaml/schema"]

[dependencies]
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
registry-evidence-verifier.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httpsec = { workspace = true, default-features = false }
registry-platform-httputil.workspace = true
registry-platform-yaml.workspace = true
reqwest.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The synchronization primitives the cached token provider needs. Holding a
# credential across an await rules out a blocking lock, and reqwest already
# brings this runtime into any build that reaches the network.
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
jsonschema.workspace = true
p256.workspace = true
registry-evidence.workspace = true
registry-thunderid-tooling.workspace = true
registry-platform-config.workspace = true
registry-platform-sdjwt.workspace = true
tempfile.workspace = true
wiremock.workspace = true
