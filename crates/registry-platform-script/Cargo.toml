[package]
name = "registry-platform-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded script execution mechanics for Registry Stack products."
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = []
# The WASM backend: the pinned Wasmtime runtime, the deterministic executor,
# and the byte-transfer outcome checks. Non-default so every crate depending
# on this one without the feature gains nothing.
wasm = ["dep:serde", "dep:serde_json", "dep:wasmtime"]

[lints]
workspace = true

[dependencies]
rhai.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Pinned LTS Wasmtime release (line 48, EOL 2028-08-20), built without its
# default features: the default `cache` feature links `wasmtime-internal-cache`,
# whose build script keys the module cache on the enclosing git commit, and
# the rest add surfaces the executor never uses (without `gc`, a guest using
# GC types, exception handling, or `externref` is refused). Each feature kept
# is one the executor calls: `cranelift` compiles modules (and brings `std`), `runtime`
# instantiates and runs them, `pulley` selects the pulley64 compilation target,
# `threads` provides the `Config::wasm_threads` switch the executor turns off
# (so the proposal stays off even if another crate unifies the feature on), and
# `parallel-compilation` keeps multi-MiB handler modules from compiling on one
# thread. Text-format parsing (`wat`) is a dev-dependency only.
wasmtime = { version = "=48.0.5", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "pulley",
    "runtime",
    "threads",
], optional = true }

[dev-dependencies]
wat = "1.259.0"
