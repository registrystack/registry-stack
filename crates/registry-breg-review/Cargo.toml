[package]
name = "registry-breg-review"
description = "A server-rendered page where a signed-in person reviews and submits their own Base Registry Engine Proposal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "breg-review"
path = "src/main.rs"

[features]
default = []
# Derives the runtime configuration JSON Schema the generator below writes.
schema = [
    "dep:schemars",
    "registry-platform-audit/schema",
    "registry-platform-config/schema",
    "registry-platform-yaml/schema",
]

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
# Server-rendered pages only. Templates are compiled in, so no loader; the
# builtin filters and a shared layout are wanted, debug and macros are not.
minijinja = { workspace = true, features = ["builtins", "multi_template", "serde"] }
registry-breg-client.workspace = true
registry-platform-audit.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-ratelimit.workspace = true
registry-platform-yaml.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
jsonschema.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-testing = { workspace = true, features = ["test-authorization-server"] }
reqwest.workspace = true
tempfile.workspace = true


# Writes the runtime configuration JSON Schema committed under
# products/breg/generated/review-runtime.
[[example]]
name = "review-runtime-schema"
path = "examples/review-runtime-schema.rs"
required-features = ["schema"]
