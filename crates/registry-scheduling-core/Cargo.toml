[package]
name = "registry-scheduling-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Source-neutral model, policy types, and pure admission evaluators for Registry Scheduling."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
schema = ["dep:schemars", "registry-platform-yaml/schema", "registry-platform-config/schema", "registry-platform-hooks/schema"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
registry-platform-calendar.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-config.workspace = true
registry-platform-hooks.workspace = true
registry-platform-yaml.workspace = true
schemars = { workspace = true, optional = true, features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_norway.workspace = true
