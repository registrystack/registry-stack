                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                - header:
                    key: cache-control
                    value: no-store
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - name: refuse-x-http-method
                match:
                  prefix: "/"
                  headers:
                  - name: x-http-method
                    present_match: true
                direct_response:
                  status: 403
                  body:
                    inline_string: '{"type":"https://id.registrystack.org/problems/registry-platform/identity/method-override-refused","title":"Method override not accepted","status":403,"code":"identity.method-override-refused"}'
                response_headers_to_add:
                - header:
                    key: content-type
                    value: application/problem+json
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                - header:
                    key: cache-control
                    value: no-store
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - name: refuse-put-self-service-record
                match:
                  path: "/users/me"
                  case_sensitive: false
                  headers:
                  - name: ":method"
                    string_match:
                      exact: PUT
                direct_response:
