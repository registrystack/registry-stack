                  body:
                    inline_string: '{"type":"https://id.registrystack.org/problems/registry-platform/identity/self-service-edit-refused","title":"User record changes are managed by administrators","status":403,"code":"identity.self-service-edit-refused"}'
                response_headers_to_add:
