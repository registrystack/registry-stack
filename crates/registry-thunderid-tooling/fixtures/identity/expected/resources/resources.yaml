nodes:
- id: start
  onSuccess: session_signout
  type: START
- executor:
    name: SessionSignOutExecutor
  id: session_signout
  onIncomplete: prompt_confirm
  onSuccess: end
  properties:
    promptOnSignOut: true
  type: TASK_EXECUTION
- id: prompt_confirm
  meta:
    components:
    - align: center
      category: DISPLAY
      id: text_signout_title
      label: '{{ t(signout:forms.confirm.title) }}'
      resourceType: ELEMENT
      type: TEXT
      variant: HEADING_1
    - align: center
      category: DISPLAY
      id: text_signout_desc
      label: '{{ t(signout:forms.confirm.description) }}'
      resourceType: ELEMENT
      type: TEXT
      variant: BODY_1
    - category: BLOCK
      components:
      - actionType: CONFIRM
        category: ACTION
        eventType: SUBMIT
        id: action_confirm
        label: '{{ t(signout:forms.confirm.actions.submit.label) }}'
        resourceType: ELEMENT
        type: ACTION
        variant: PRIMARY
      id: block_signout
      resourceType: ELEMENT
      type: BLOCK
  prompts:
  - action:
      nextNode: session_signout
      ref: action_confirm
      type: CONFIRM
  type: PROMPT
- id: end
  type: END
