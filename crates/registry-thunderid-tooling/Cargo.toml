[package]
name = "registry-thunderid-tooling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tooling-only support for adopter CLIs and integration tests against a pinned upstream ThunderID issuer."
repository.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

# This crate is deliberately private: no runtime product may depend on it, and
# it ships no binary and opens no listener. Adopter CLIs and integration tests
# are its only consumers. It renders the pinned upstream release's native
# declarative resources from a validated internal description, performs the
# upstream bootstrap one-shot, and owns one development session's container.
[dependencies]
base64.workspace = true
getrandom.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-yaml.workspace = true
reqwest.workspace = true
rustix.workspace = true
schemars = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
jsonschema.workspace = true
p256.workspace = true
registry-platform-authcommon.workspace = true

[features]
schema = [
  "dep:schemars",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]

[[example]]
name = "task-connection-schema"
required-features = ["schema"]
