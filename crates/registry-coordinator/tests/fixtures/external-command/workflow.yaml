apiVersion: id.registrystack.org/formats/coordinator/project/v1alpha1
kind: CoordinatorProject
project:
  id: fee-bill
  version: "1"

types:
  fee-input:
    type: object
    additionalProperties: false
    required: [applicationId, amount]
    properties:
      applicationId: {type: string, minLength: 1, maxLength: 64}
      amount: {type: integer, minimum: 1, maximum: 1000000}
  bill-response:
    type: object
    additionalProperties: false
    required: [status, body]
    properties:
      status: {type: integer, minimum: 200, maximum: 499}
      body:
        type: object
        additionalProperties: false
        properties:
          billId: {type: string, minLength: 1, maxLength: 64}
          reason: {type: string, minLength: 1, maxLength: 64}
  bill:
    type: object
    additionalProperties: false
    required: [billId]
    properties:
      billId: {type: string, minLength: 1, maxLength: 64}
  bill-outcome:
    oneOf:
      - type: object
        additionalProperties: false
        required: [state, result]
        properties:
          state: {type: string, const: accepted}
          result: {typeRef: bill}
      - type: object
        additionalProperties: false
        required: [state, code]
        properties:
          state: {type: string, const: refused}
          code: {type: string, enum: [account-closed]}
      - type: object
        additionalProperties: false
        required: [state]
        properties:
          state: {type: string, const: uncertain}

functions:
  bill-request:
    runtime: rhai
    source: functions.rhai
    entrypoint: bill_request
    inputs:
      request: {typeRef: fee-input}
    output: {operationInput: create-bill}
  bill-outcome:
    runtime: rhai
    source: functions.rhai
    entrypoint: bill_outcome
    inputs:
      command: {operationInput: create-bill}
      response: {operationOutput: create-bill}
    output: {typeRef: bill-outcome}

operations:
  create-bill:
    uses: external.command/v1
    connection: payments
    responseSchema: {typeRef: bill-response}
    interpret: bill-outcome

workflow:
  input: {typeRef: fee-input}
  deadlineSeconds: 900
  start: create
  steps:
    create:
      title: Create the fee bill
      type: call
      operation: create-bill
      input:
        type: function
        function: bill-request
        inputs:
          request: {type: input}
      next: billed
      onDeclaredRefusal: not-billed
    billed:
      type: finish
      outcome: billed
      output:
        type: fields
        fields:
          billId: {type: step, step: create, path: /billId}
    not-billed:
      type: finish
      outcome: not-billed
      output: {type: step, step: create}
  outcomes:
    billed: {typeRef: bill}
    not-billed: {operationRefusal: create-bill}
