apiVersion: id.registrystack.org/formats/adapter/pack/v1alpha1
kind: AdapterPack
id: case-api-pack
version: "1.0.0"
testedVersions:
  - "2.7"
endpoints:
  - id: case-api
    component: http
    authentication:
      type: oauth2-client-credentials
    attemptTimeoutMilliseconds: 10000
    maximumResponseBytes: 1048576
    operations:
      - id: cases-read
        idempotentUpstream: true
routeTemplates:
  - id: fetch-page
    parameters:
      - name: record-type
        type: string
        required: true
        description: The declared record type the page fetches.
    steps:
      - setBody:
          rhai:
            file: scripts/map.rhai
            entrypoint: map
routes:
  - id: shared-lookup
    from:
      uri: direct:shared-lookup
    steps:
      - convertBodyTo:
          type: codeMap:gender-codes
      - to:
          uri: http:case-api
          parameters:
            httpMethod: GET
            path: /api/cases/{{type}}
            pathParameters:
              type:
                constant: case
codeMaps:
  - id: gender-codes
    entries:
      female: F
scripts:
  - path: scripts/map.rhai
    digest: sha256:15a047e0c80af3300451da34c59953fe2dbc953580a8e7dbdee2e788d99bc663
queryFiles: []
capabilities:
  components:
    - http
  languages:
    - rhai
    - constant
  eips:
    - setBody
    - to
