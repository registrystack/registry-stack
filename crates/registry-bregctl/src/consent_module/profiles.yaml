- id: __SUBJECT__-consent-self
  principalClaim: __CLAIM__
  requiredScopes: ['consent:__SUBJECT__:self']
  permissions:
    records:
    - recordType: __SUBJECT__-consent-decision
      rowBoundaries: unrestricted
      membershipBoundaries:
      - {field: subject, membershipRecordType: __SUBJECT__-consent-link, membershipKeyField: subject, principalField: principal, activeField: active}
      operations: [get, list]
      readableFields: [subject, notice, clause, recipient, purpose, scope, decision, effective-at, expires-at, channel]
    - recordType: __SUBJECT__-consent-link
      rowBoundaries:
      - {field: principal, claim: __CLAIM__, operator: equals}
      operations: [get, list]
      readableFields: [subject, active]
    - recordType: __SUBJECT__-privacy-notice
      rowBoundaries: unrestricted
      operations: [get, list]
      readableFields: [notice-version, language, title, text, text-uri, controller-name, controller-contact, jurisdiction, legal-basis, rights-statement, rights-uri, withdrawal-method, published-at]
    - recordType: __SUBJECT__-notice-clause
      rowBoundaries: unrestricted
      operations: [get, list]
      readableFields: [notice, recipient, purpose, scope, data-life, description]
    actions:
    - action: give-__SUBJECT__-consent
      operations: [invoke]
      targets:
      - {recordType: __SUBJECT__-consent-link, rowBoundaries: [{field: principal, claim: __CLAIM__, operator: equals}]}
      - {recordType: __SUBJECT__, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-notice-clause, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-consent-decision, rowBoundaries: unrestricted}
      results: [decision]
    - action: refuse-__SUBJECT__-consent
      operations: [invoke]
      targets:
      - {recordType: __SUBJECT__-consent-link, rowBoundaries: [{field: principal, claim: __CLAIM__, operator: equals}]}
      - {recordType: __SUBJECT__, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-notice-clause, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-consent-decision, rowBoundaries: unrestricted}
      results: [decision]
    - action: withdraw-__SUBJECT__-consent
      operations: [invoke]
      targets:
      - {recordType: __SUBJECT__-consent-link, rowBoundaries: [{field: principal, claim: __CLAIM__, operator: equals}]}
      - {recordType: __SUBJECT__, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-notice-clause, rowBoundaries: unrestricted}
      - {recordType: __SUBJECT__-consent-decision, rowBoundaries: unrestricted}
      results: [decision]
