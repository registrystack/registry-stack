[package]
name = "registry-casework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Casework HTTP service and PostgreSQL runtime."
repository.workspace = true
publish = false

[[bin]]
name = "casework"
path = "src/main.rs"

[features]
default = []
postgres-test = []
schema = ["dep:schemars", "registry-casework-breg/schema"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap.workspace = true
deadpool-postgres.workspace = true
futures.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
registry-casework-core.workspace = true
registry-casework-breg.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-audit.workspace = true
registry-platform-authcommon.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-oidc.workspace = true
registry-platform-httputil.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_path_to_error.workspace = true
schemars = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[dev-dependencies]
jsonschema.workspace = true
registry-casework-client.workspace = true
registry-platform-testing = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tower.workspace = true
wiremock.workspace = true

[[test]]
name = "postgres_transactions"
path = "tests/postgres_transactions.rs"
required-features = ["postgres-test"]

[[test]]
name = "service_visibility"
path = "tests/service_visibility.rs"
required-features = ["postgres-test"]

[[test]]
name = "hosted_standalone"
path = "tests/hosted_standalone.rs"
required-features = ["postgres-test"]

[[test]]
name = "hosted_postgres"
path = "tests/hosted_postgres.rs"
required-features = ["postgres-test"]

[[test]]
name = "assignment_postgres"
path = "tests/assignment_postgres.rs"
required-features = ["postgres-test"]

[[test]]
name = "routing_postgres"
path = "tests/routing_postgres.rs"
required-features = ["postgres-test"]

[[test]]
name = "source_retention_postgres"
path = "tests/source_retention_postgres.rs"
required-features = ["postgres-test"]

[[test]]
name = "inbox_ordering_postgres"
path = "tests/inbox_ordering_postgres.rs"
required-features = ["postgres-test"]
