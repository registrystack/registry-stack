# Generated by `registry-session gateway envoy` from the runtime configuration.
# Do not edit: regenerate it. This is the HTTP filters, to splice at the head of the host's chain, in this order, ahead of the host's own filters and its router.
- name: "registry-session.csrf"
  disabled: true
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
    filter_enabled:
      default_value:
        numerator: 100
        denominator: HUNDRED
- name: "registry-session.check"
  disabled: true
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
    failure_mode_allow: false
    status_on_error:
      code: ServiceUnavailable
    http_service:
      server_uri:
        uri: "http://registry-session-check"
        cluster: "registry-session-check"
        timeout: "3s"
      path_prefix: "/check"
      authorization_response:
        allowed_upstream_headers:
          patterns:
            - exact: "authorization"
        allowed_client_headers:
          patterns:
            - exact: "content-type"
            - exact: "cache-control"
            - exact: "location"
            - exact: "registry-session-answer"
    allowed_headers:
      patterns:
        - exact: "cookie"
        - exact: "origin"
        - exact: "sec-fetch-site"
        - exact: "registry-client"
- name: "registry-session.strip-cookies"
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
    default_source_code:
      inline_string: |
        local own_cookies = {
          ["__Host-registry-session"] = true,
          ["registry-session"] = true,
          ["__Host-registry-signin"] = true,
          ["registry-signin"] = true,
        }

        -- Removes the service's own cookies from the request and keeps the rest.
        function envoy_on_request(handle)
          local headers = handle:headers()
          local cookie = headers:get("cookie")
          if cookie == nil then
            return
          end
          local kept = {}
          for pair in string.gmatch(cookie, "[^;,]+") do
            local first = string.find(pair, "%S")
            if first ~= nil then
              local name = string.match(pair, "^%s*([^=]*)")
              if not own_cookies[name] then
                local last = #pair
                while string.find(string.sub(pair, last, last), "%s") do
                  last = last - 1
                end
                table.insert(kept, string.sub(pair, first, last))
              end
            end
          end
          if #kept == 0 then
            headers:remove("cookie")
          else
            headers:replace("cookie", table.concat(kept, "; "))
          end
        end
