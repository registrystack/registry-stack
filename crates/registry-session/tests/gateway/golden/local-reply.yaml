# Generated by `registry-session gateway envoy` from the runtime configuration.
# Do not edit: regenerate it. This is the local reply configuration, to splice into the host's HTTP connection manager: the answer when the check itself fails.
local_reply_config:
  mappers:
    - filter:
        and_filter:
          filters:
            - status_code_filter:
                comparison:
                  op: EQ
                  value:
                    default_value: 503
                    runtime_key: registry-session.local-reply.status
            - response_flag_filter:
                flags:
                  - UAEX
      headers_to_add:
        - header:
            key: registry-session-answer
            value: "1"
          append_action: OVERWRITE_IF_EXISTS_OR_ADD
        - header:
            key: cache-control
            value: no-store
          append_action: OVERWRITE_IF_EXISTS_OR_ADD
      body_format_override:
        json_format:
          type: "https://id.registrystack.org/problems/registry-platform/session/unavailable"
          title: Session service unavailable
          status: 503
          code: session.unavailable
        content_type: application/problem+json
