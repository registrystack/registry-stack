[package]
name = "registry-session"
description = "A small session service beside a gateway: signs a person in once, keeps their tokens on the server, and tells the gateway which bearer token to attach to each call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "registry-session"
path = "src/main.rs"

[features]
default = []
schema = [
    "dep:schemars",
    "registry-platform-audit/schema",
    "registry-platform-config/schema",
    "registry-platform-yaml/schema",
]

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
registry-platform-audit.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-ratelimit.workspace = true
registry-platform-yaml.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
jsonschema.workspace = true
registry-platform-testing.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[[example]]
name = "session-runtime-schema"
path = "examples/session-runtime-schema.rs"
required-features = ["schema"]
