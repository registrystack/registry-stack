[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "registry-discovery-client"
version = "0.24.0"
description = "Python binding for the Registry Discovery client, via PyO3."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["discovery", "registry", "registrystack"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://docs.registrystack.org/"
Issues = "https://github.com/registrystack/registry-stack/issues"
Repository = "https://github.com/registrystack/registry-stack"

[tool.maturin]
python-source = "python"
module-name = "registry_discovery_client"
features = ["extension-module"]
