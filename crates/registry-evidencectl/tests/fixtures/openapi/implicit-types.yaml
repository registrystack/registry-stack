openapi: 3.0.3
info:
  title: Implicit Types
  version: "1.0.0"
paths:
  # The collection-wrapper shape published by several large registry APIs:
  # `properties` with no `type: object` beside it.
  /records:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                properties:
                  pager:
                    properties:
                      page:
                        type: integer
                        minimum: 1
                        maximum: 1000
                  records:
                    items:
                      properties:
                        id:
                          type: string
                          minLength: 11
                          maxLength: 11
                    maxItems: 50
  # A node carrying neither a type nor a structural keyword stays untyped:
  # nothing here guesses at a scalar.
  /opaque:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  known:
                    type: string
                    minLength: 1
                    maxLength: 8
                  anything:
                    description: no type, no properties, no items
