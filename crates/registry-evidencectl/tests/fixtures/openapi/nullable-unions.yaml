openapi: 3.1.0
info:
  title: Nullable Unions
  version: "1.0.0"
paths:
  /records:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  # The idiom generated by zod-to-openapi and friends: an
                  # optional scalar written as a two-member anyOf against
                  # `null` rather than as the 3.1 type pair.
                  note:
                    anyOf:
                      - type: string
                        minLength: 1
                        maxLength: 64
                      - type: "null"
                  # The same idiom spelled with `oneOf`, with the null member
                  # first, and carrying a description on the union node.
                  count:
                    description: how many were seen
                    oneOf:
                      - type: "null"
                      - type: integer
                        minimum: 0
                        maximum: 99
                  # A 3.1 type pair written null-first.
                  reversedPair:
                    type: ["null", string]
                    minLength: 1
                    maxLength: 8
                  # Nullable containers collapse the same way, so their members
                  # stay selectable.
                  parent:
                    anyOf:
                      - type: object
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 36
                      - type: "null"
                  # A union of two real types is not a nullable spelling and is
                  # left alone for the flattener to skip.
                  either:
                    anyOf:
                      - type: string
                      - type: integer
