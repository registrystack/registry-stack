# The shape the statement result must have before extraction reads it. It is a
# closed shape on purpose, and its row ceiling matches the source's
# `maximumRows`, so a result that grew past the bound is refused rather than
# read.
type: object
additionalProperties: false
required: [rows]
properties:
  rows:
    type: array
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      required: [qualifying_record_count]
      properties:
        qualifying_record_count:
          type: integer
          minimum: 0
          maximum: 1000000
