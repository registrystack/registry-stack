# Registry Mint configuration, paired with the Evidence deployment beside it.
#
# Mint issues the short-lived access tokens that deployment verifies, so a
# deployment with no identity provider still authenticates its callers. The
# dependency runs one way only: Evidence knows nothing about Mint beyond an
# issuer, a key set and a set of claim names.
#
# Every value shared with `bundle/evidence.yaml` was written from one source
# when this project was scaffolded. Change them in both documents or Mint will
# issue tokens Evidence refuses.
#
# Paths resolve relative to this file. Everything here is startup-only except
# the client registry, which `SIGHUP` reloads in place.
version: 1

issuer: {{token_issuer}}

# Mint serves plain HTTP and expects TLS termination it does not manage. The
# issuer above is https, so put a terminator in front of this listener.
listener:
  address: 127.0.0.1
  port: {{mint_listener_port}}
  maximumRequestBytes: 16384
  requestTimeoutMilliseconds: 5000

# Generated by `evidencectl keygen signing`, never by the scaffold. The file
# must be a private JWK, owner-read-only, whose kid equals the id below.
signing:
  algorithm: {{token_algorithm}}
  activeKeyId: {{mint_signing_key_id}}
  activeKeyFile: secrets/signing-ed25519-private-jwk
  retiredPublicJwkFiles: []
  jwksPath: {{token_jwks_path}}

# `audiences` is what Evidence accepts as `aud`, and each claim name below is
# the one Evidence reads from a token. A lifetime longer than a few minutes
# would rebuild the long-lived bearer token Mint exists to avoid.
accessTokens:
  audiences: [{{token_audience}}]
  lifetimeSeconds: 300
  claims:
    principal: {{principal_claim}}
    requesterTags: {{requester_tags_claim}}
    evidenceAudience: {{evidence_audience_claim}}
    grantId: {{grant_id_claim}}
    grantAuthority: {{grant_authority_claim}}

# Callers authenticate with a short JWT signed by their own key (RFC 7523). The
# audience binds an assertion to this endpoint, so one presented to another
# service cannot be replayed here.
clientAssertion:
  audience: {{mint_token_endpoint}}
  maximumLifetimeSeconds: 300
  algorithms: [{{token_algorithm}}]

# One `*.yaml` file per registered caller. This directory is public data: a
# registration carrying private key material is refused.
clients:
  directory: clients
