# Process-local runtime configuration. This file is not governed content: it
# binds the reviewed bundle to one environment. Staging and production may use
# different runtime files over the same bundle bytes without changing evidence
# semantics.
#
# The paths below were written as absolute paths when the project was
# scaffolded. Change them for a real deployment and freeze the file again.
version: 1

bundleDirectory: {{bundle_directory}}

listener:
  bindHost: 127.0.0.1
  port: 8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 64
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 30000

# Secret files are read from this directory only. The directory itself must be
# owner-only (mode 0700) and each secret file owner-read-only (mode 0600).
secretProviders:
  file:
    root: {{secret_root}}

auditStorage:
  path: {{audit_path}}
  maximumFileBytes: 1073741824

# Add a trust profile here only when a bundle source declares one; the two
# sets must match exactly.
outboundTls:
  systemRoots: true
  trustProfiles: {}
