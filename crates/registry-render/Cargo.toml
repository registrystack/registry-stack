[package]
name = "registry-render"
description = "Governed, byte-stable PDF documents from registry data, rendered with Typst."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
registry-platform-audit = { workspace = true }
registry-platform-authcommon = { workspace = true }
registry-platform-buildinfo = { workspace = true }
registry-platform-canonical-json = { workspace = true }
registry-platform-config = { workspace = true }
registry-platform-oidc = { workspace = true }
jsonwebtoken = { workspace = true }
registry-platform-crypto = { workspace = true, features = ["cms-signing", "transit"] }
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil = { workspace = true }
registry-platform-yaml = { workspace = true }
typst = { workspace = true }
typst-pdf = { workspace = true }
typst-assets = { workspace = true }
comemo = { workspace = true }
ttf-parser = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hayro-syntax = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
pdf-writer = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
schemars = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
rcgen = { workspace = true }
registry-platform-crypto = { workspace = true, features = ["cms-signing", "test-support", "transit"] }
registry-render-client.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
tower = { workspace = true }

[[bin]]
name = "registry-render"
path = "src/main.rs"

[lints]
workspace = true

[features]
schema = [
  "dep:schemars",
  "registry-platform-audit/schema",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]
