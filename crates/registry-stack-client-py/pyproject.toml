[project]
name = "registry-stack-client"
version = "0.26.1"
description = "Unified Python client for Registry Stack products."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["registry", "registrystack", "discovery", "evidence", "relay", "breg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://docs.registrystack.org/"
Issues = "https://github.com/registrystack/registry-stack/issues"
Repository = "https://github.com/registrystack/registry-stack"
