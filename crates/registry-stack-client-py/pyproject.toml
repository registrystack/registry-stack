[project]
name = "registry-stack-client"
version = "0.46.1"
description = "Unified Python client for Registry Stack products."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["registry", "registrystack", "discovery", "evidence", "breg", "casework", "messaging", "scheduling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://docs.registrystack.org/"
Issues = "https://github.com/registrystack/registry-stack/issues"
Repository = "https://github.com/registrystack/registry-stack"

[project.optional-dependencies]
flask = ["Flask>=3.1,<4"]
fastapi = ["fastapi>=0.115,<1"]
human = ["Authlib>=1.9.5,<2", "requests>=2.31,<3"]
postgres = ["cryptography>=50.0.2,<51", "psycopg[binary]>=3.3.6,<4"]
