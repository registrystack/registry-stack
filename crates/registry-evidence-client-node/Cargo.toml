[package]
name = "registry-evidence-client-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js binding for the Evidence relying-party client, via napi-rs."
readme = "README.md"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# napi-rs's generated glue (through the `napi`/`napi-derive` dependency, not
# this crate's own source) registers FFI entry points with unsafe code
# unconditionally, which the workspace's `unsafe_code = "forbid"` lint would
# reject. This crate opts out of `[lints] workspace = true` and instead denies
# unsafe code in its own source from `src/lib.rs`, which is the strongest
# constraint napi-rs usage can satisfy here.

[dependencies]
chrono.workspace = true
napi.workspace = true
napi-derive.workspace = true
registry-evidence-client.workspace = true
registry-platform-crypto.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
p256.workspace = true
# The committed policy fixture stands for a relying party's own verification
# policy document, so the tests validate it against the frozen contract that
# governs one. `jsonschema` compiles that contract and `serde_norway` reads it.
jsonschema.workspace = true
registry-evidence-verifier.workspace = true
serde.workspace = true
serde_norway.workspace = true
