[package]
name = "registry-documentsctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Stack Document Store adopter and local operator tooling."
repository.workspace = true
publish = false

[[bin]]
name = "documentsctl"
path = "src/main.rs"

[[test]]
name = "postgres_cli"
path = "tests/postgres_cli.rs"
required-features = ["postgres-test"]

[features]
default = []
postgres-test = ["registry-documents/postgres-test"]

[lints]
workspace = true

[dependencies]
clap.workspace = true
registry-documents.workspace = true
registry-documents-core.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-yaml.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres.workspace = true
