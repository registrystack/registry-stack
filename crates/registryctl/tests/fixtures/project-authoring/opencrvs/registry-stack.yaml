  release: 0.19.0
  content_digest: sha256:f645eb1b7055d1c474e28535cf21e59994de30345fa23b3a2ababbce5c5ebee9
registry: { id: fictional-civil-registry }
integrations:
  birth-record: { file: integrations/birth-record/integration.yaml }
services:
  birth-verification:
    kind: consultation_api
    version: 1
    purpose: birth-record-verification
