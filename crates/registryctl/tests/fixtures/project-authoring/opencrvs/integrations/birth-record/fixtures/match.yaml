name: birth-record-match
classification: synthetic
request:
  target:
    type: Person
    identifiers: [{ scheme: UIN, value: "0000000001" }]
  variables: { as_of_date: 2026-01-01 }
  claims: [birth-record-exists]
  disclosure: predicate
  format: application/vnd.registry-notary.claim-result+json
  purpose: birth-record-verification
input: { uin: "0000000001" }
variables: { as_of_date: 2026-01-01 }
interactions:
  - expect:
      method: POST
      path: /oauth/token
      headers: { Accept: application/json, Content-Type: application/json }
      body: { grant_type: client_credentials }
    respond:
      status: 200
      body: { access_token: SYNTHETIC_FIXTURE_TOKEN, token_type: Bearer, expires_in: 300 }
  - expect: { method: GET, path: /.well-known/jwks.json }
    respond: { status: 200, body: { file: bodies/jwks.json } }
  - expect:
      method: POST
      path: /dci/v1/birth/search
      headers: { Accept: application/json, Content-Type: application/json }
      body:
        header:
          version: 1.0.0
          message_id: { generated: dci-correlation }
          message_ts: { generated: rfc3339-timestamp }
          action: search
          sender_id: fictional-notary
          receiver_id: fictional-civil-registry
          total_count: 1
          is_msg_encrypted: false
        message:
          transaction_id: { generated: dci-correlation }
          search_request:
            - reference_id: { generated: dci-correlation }
              timestamp: { generated: rfc3339-timestamp }
              search_criteria:
                version: 1.0.0
                reg_type: civil-registry
                reg_event_type: birth
                reg_record_type: birth
                query_type: exact-and
                query:
                  operator: and
                  predicates:
                    - { field: identifier_value, operator: eq, value: "0000000001" }
                pagination: { page_size: 2, page_number: 1 }
    respond: { status: 200, body: { file: bodies/match.json } }
expect:
  outcome: match
  outputs:
    date_of_birth: 2018-05-12
    sex: female
    child_given_name: Ada
    child_family_name: Example
    place_of_birth: Fictional District
    parents:
      - { type: mother, name: Mira Example, identifier: PARENT-0001 }
      - { type: father, name: Noah Example, identifier: PARENT-0002 }
  claims:
    birth-record-exists: true
    date-of-birth: 2018-05-12
    sex: female
    child-given-name: Ada
    child-family-name: Example
    child-birth-date: 2018-05-12
    child-place-of-birth: Fictional District
    parents:
      - { type: mother, name: Mira Example, identifier: PARENT-0001 }
      - { type: father, name: Noah Example, identifier: PARENT-0002 }
    age-band: 5-17
