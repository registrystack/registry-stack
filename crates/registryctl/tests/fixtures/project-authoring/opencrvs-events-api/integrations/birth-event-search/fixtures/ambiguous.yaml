name: birth-event-ambiguous
classification: synthetic
input: { tracking_id: TRK-SYNTH000001 }
interactions:
  - expect:
      method: POST
      path: /oauth/token
      headers: { Accept: application/json, Content-Type: application/json }
      body: { grant_type: client_credentials }
    respond:
      status: 200
      headers: { Content-Type: application/json }
      body: { access_token: SYNTHETIC_FIXTURE_TOKEN, token_type: Bearer }
  - expect:
      method: POST
      path: /api/events/events/search
      body:
        query:
          type: and
          clauses:
            - eventType: birth
              trackingId: { type: exact, term: TRK-SYNTH000001 }
        limit: 2
        offset: 0
    respond:
      status: 200
      body:
        total: 2
        results:
          - { id: 00000000-0000-4000-8000-000000000001, type: birth, status: REGISTERED, trackingId: TRK-SYNTH000001 }
          - { id: 00000000-0000-4000-8000-000000000002, type: birth, status: DECLARED, trackingId: TRK-SYNTH000001 }
expect:
  outcome: ambiguous
  outputs: {}
  claims: {}
