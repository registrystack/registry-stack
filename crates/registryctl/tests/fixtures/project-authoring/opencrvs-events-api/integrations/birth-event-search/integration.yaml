version: 1
id: synthetic-opencrvs-events-search
revision: 1

source:
  product: opencrvs-events-api
  versions:
    unverified: [develop-synthetic-shape-2026-07-30]
  auth:
    type: oauth2_client_credentials
    request: json
    response_profile: oauth2_bearer_no_expiry
  allow:
    - method: POST
      path: /api/events/events/search
      semantics: read_only
  response:
    format: json
    max_bytes: 64KiB

input:
  tracking_id:
    role: selector
    type: string
    maxLength: 32
    pattern: "^TRK-SYNTH[0-9]{6}$"

capability:
  script:
    file: adapter.rhai

outputs:
  event_type:
    type: string
    maxLength: 32
  registered:
    type: boolean

limits:
  calls: 1
  source_bytes: 128KiB
  request_bytes: 16KiB
  deadline: 10s
