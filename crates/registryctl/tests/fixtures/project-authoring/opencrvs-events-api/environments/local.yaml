version: 1

development:
  source_mode: synthetic
  default_integration: birth-event-search
  default_fixture: birth-event-match

integrations:
  birth-event-search:
    source:
      origin: https://events.opencrvs.invalid
      credential:
        client_id: { secret: OPENCRVS_EVENTS_CLIENT_ID }
        client_secret: { secret: OPENCRVS_EVENTS_CLIENT_SECRET }
        generation: 1
      oauth:
        origin: https://identity.opencrvs.invalid
        path: /oauth/token
        generation: 1

relay:
  origin: https://relay.opencrvs.invalid
  issuer: https://workload-issuer.opencrvs.invalid
  jwks_url: https://workload-issuer.opencrvs.invalid/.well-known/jwks.json
  audience: registry-relay
  allowed_clients: [synthetic-opencrvs-relay-client]
  consultation: { client_id: synthetic-opencrvs-consultation-client, principal_id: synthetic-opencrvs-consultation-principal }

deployment:
  profile: local
  relay: { service: synthetic-opencrvs-relay }
