version: 1
integrations:
  individual:
    source:
      origin: https://social-registry.invalid
      credential:
        token: { secret: SOCIAL_REGISTRY_TOKEN }
        generation: 1
relay:
  origin: https://social-registry-relay.internal.invalid
  issuer: https://workload-issuer.internal.invalid
  jwks_url: https://workload-issuer.internal.invalid/.well-known/jwks.json
  audience: registry-relay
  allowed_clients: [social-registry-relay-client]
  consultation: { client_id: social-registry-consultation-client, principal_id: social-registry-consultation-principal }

deployment:
  profile: local
  relay: { service: social-registry-relay }
