name: social-registry-match
classification: synthetic
request:
  target:
    type: Person
    identifiers: [{ scheme: openspp_individual_id, value: IND-AB12CD34 }]
  claims: [social-registry-record-exists]
  disclosure: predicate
  format: application/vnd.registry-notary.claim-result+json
  purpose: social-programme-verification
input: { individual_id: IND-AB12CD34 }
interactions:
  - expect:
      method: GET
      path: /api/v2/spp/Individual/IND-AB12CD34
      query: { _elements: "active,programme_code,household_reference" }
    respond:
      status: 200
      body: { active: true, programme_code: SUPPORT, household_reference: HH-0001 }
expect:
  outputs: { active: true, programme_code: SUPPORT, household_reference: HH-0001 }
  claims: { social-registry-record-exists: true, social-registry-active: true, programme-code: SUPPORT, household-reference: redacted }
