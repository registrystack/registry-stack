version: 1
starter:
  id: spreadsheet
  release: 0.17.0
  content_digest: sha256:c435b97fb247502094168de231dc2248ce57c145fec8bad9a5f8fbce841c071d

registry:
  id: fictional-public-works-registry

integrations:
  project-record-snapshot:
    file: integrations/project-record-snapshot/integration.yaml

entities:
  projects:
    file: entities/projects.yaml

services:
  projects-records:
    kind: records_api
    entity: projects
    title: Fictional public works projects
    description: Protected operational view of synthetic public works projects.
    owner: Public Works Delivery Unit
    sensitivity: confidential
    access_rights: restricted
    update_frequency: as_needed
    api:
      scopes:
        metadata: projects:metadata
        rows: projects:rows
        aggregate: projects:aggregate
        evidence_verification: projects:evidence_verification
      purposes: [public-works-case-management]
      projection: [project_id, district_code, sector, status]
      pagination: { default_limit: 50, max_limit: 100 }
      filters: { project_id: [eq] }
      required_principal_filters: [project_id]
      standards: { ogc_features: false, sp_dci: false }

  public-works-verification:
    kind: consultation_api
    version: 1
    purpose: public-works-case-management
    legal_basis: public-service-delivery
    consent: not_required
    consultations:
      project:
        integration: project-record-snapshot
        input: { project_id: request.target.identifiers.project_id }
