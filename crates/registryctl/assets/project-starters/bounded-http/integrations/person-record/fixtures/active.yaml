name: active-person
classification: synthetic
request:
  target:
    type: Person
    identifiers: [{ scheme: registry_person_id, value: AB-123456 }]
  claims: [person-record-exists]
  disclosure: predicate
  format: application/vnd.registry-notary.claim-result+json
  purpose: public-service-person-verification
input: { person_id: AB-123456 }
interactions:
  - expect:
      method: GET
      path: /people/AB-123456
      query: { fields: active }
    respond: { status: 200, body: { active: true } }
expect:
  outcome: match
  outputs: { active: true }
  claims: { person-record-exists: true, person-active: true }
