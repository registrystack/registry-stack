[package]
name = "registry-platform-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared hook contract for Registry Stack: declarations, envelope, handler messages, compile-time rules, and the notification delivery core."
repository.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[features]
default = []
schema = ["dep:schemars"]
postgres = [
    "dep:async-trait",
    "dep:hex",
    "dep:registry-platform-httputil",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-postgres",
]

[dependencies]
async-trait = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
registry-platform-canonical-json.workspace = true
registry-platform-httputil = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, features = ["serde-well-known", "formatting"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
tokio-postgres = { workspace = true, optional = true }
uuid.workspace = true
