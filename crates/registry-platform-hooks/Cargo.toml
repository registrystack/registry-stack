[package]
name = "registry-platform-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared hook contract for Registry Stack: declarations, envelope, handler messages, compile-time rules, capability sets, the delivery adapter, and the local-handler executor."
repository.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[features]
default = []
schema = ["dep:schemars"]
postgres = [
    "dep:async-trait",
    "dep:registry-platform-activation",
    "dep:registry-platform-audit",
    "dep:registry-platform-config",
    "dep:registry-platform-crypto",
    "dep:registry-platform-dispatch",
    "dep:registry-platform-httputil",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:url",
]
receiver = ["dep:base64", "dep:registry-platform-crypto", "time/parsing"]
# The Rhai hook program engine: the hook Rhai profile, its compile check, and
# its run path. Products that run no Rhai hook program leave it off and
# compile no Rhai executor.
rhai = ["dep:registry-platform-script", "dep:rhai"]
# The WASM hook program engine: a hook-owned module runtime with its own
# executor, epoch ticker, and prepared-module cache. Products that run no WASM
# hook program leave it off and compile no WASM executor.
wasm = ["dep:registry-platform-script", "registry-platform-script/wasm"]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
registry-platform-activation = { workspace = true, optional = true }
registry-platform-audit = { workspace = true, optional = true }
registry-platform-canonical-json.workspace = true
registry-platform-config = { workspace = true, optional = true }
registry-platform-crypto = { workspace = true, optional = true }
registry-platform-dispatch = { workspace = true, features = ["postgres"], optional = true }
registry-platform-httputil = { workspace = true, optional = true }
registry-platform-script = { workspace = true, optional = true }
registry-platform-yaml.workspace = true
rhai = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde-well-known", "formatting"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
tokio-postgres = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
wat = "1.259.0"
