[package]
name = "registry-language-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-file navigation and reference diagnostics for Registry Stack project YAML."
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
registry-evidence-authoring.workspace = true
registry-language-core.workspace = true
registry-relay-v2.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tower-lsp-server.workspace = true
tree-sitter.workspace = true
tree-sitter-yaml.workspace = true

[dev-dependencies]
futures.workspace = true
# The authoring library's own fixtures build the projects the Evidence tests index, so the editor is
# tested against the shape the compiler is tested against rather than against a copy of it.
registry-evidence-authoring = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
