[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "registry-relay-client"
version = "0.20.0"
description = "Python binding for the Registry Relay V2 client, via PyO3."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.maturin]
python-source = "python"
module-name = "registry_relay_client"
features = ["extension-module"]
