[package]
name = "registry-relay-client-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python binding for the Registry Relay V2 client, via PyO3."
readme = "README.md"
repository.workspace = true
publish = false

[lib]
name = "registry_relay_client"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
registry-platform-crypto.workspace = true
relay-client-sdk = { package = "registry-relay-client", path = "../registry-relay-client", version = "0.26.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
wiremock.workspace = true
