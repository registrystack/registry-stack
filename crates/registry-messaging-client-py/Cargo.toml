[package]
name = "registry-messaging-client-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python binding for the Registry Messaging client, via PyO3."
readme = "README.md"
repository.workspace = true
publish = false

[lib]
name = "registry_messaging_client"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
# Keep the SDK name distinct from this extension's Python module name.
messaging-client-sdk = { package = "registry-messaging-client", path = "../registry-messaging-client", version = "0.34.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
