[graph]
all-features = true
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Advisory ignores must include a scoped rationale and a review trigger.
ignore = [
    # RUSTSEC-2023-0089: the all-features graph reaches `atomic-polyfill`
    # through Crosswalk -> phonenumber -> postcard -> heapless 0.7. Phonenumber
    # uses postcard at build time and runtime, but heapless selects
    # `atomic-polyfill` only for AVR, riscv32i/riscv32imc, thumbv6m, and
    # xtensa-esp32s2, not Relay's supported x86_64/aarch64 Linux or x86_64
    # macOS service targets. Reviewed 2026-07-25 for the canonical
    # attribute-release runtime. Review when the chain removes it, before
    # supporting an affected embedded target, or if the advisory scope changes.
    "RUSTSEC-2023-0089",
    # RUSTSEC-2024-0436: `paste` is an unmaintained build-time procedural macro
    # pulled in by Relay's DataFusion and Parquet graph. It does not remain in
    # the runtime binary as request-facing parser code. Review when DataFusion
    # or Arrow/Parquet removes `paste` from the resolved graph, or before
    # upgrading those major versions.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0249: `smartstring` 1.0.1 is unmaintained and has no patched
    # release. Rhai 1.25.1 uses it for Relay's deployment-authored, bounded
    # script adapters; requesters cannot supply scripts. This is a maintenance-
    # status advisory, not a reported vulnerability. Reviewed 2026-08-10.
    # Review when Rhai replaces `smartstring`, before accepting untrusted
    # scripts, or if the advisory gains security or correctness findings.
    "RUSTSEC-2026-0249",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MPL-2.0 is weak, file-level copyleft: its obligations attach only to the
    # MPL-licensed files themselves, not to code that merely depends on them.
    # Allowed for Relay; the motivating dependency is `smartstring`, pulled in
    # transitively by the `rhai` script runtime.
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = [
    { name = "cel", deny-multiple-versions = true },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/PublicSchema/crosswalk",
]
