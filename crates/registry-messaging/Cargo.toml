[package]
name = "registry-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Messaging HTTP service and PostgreSQL runtime."
repository.workspace = true
publish = false

[[bin]]
name = "messaging"
path = "src/main.rs"

[[test]]
name = "postgres_migrate"
path = "tests/postgres_migrate.rs"
required-features = ["postgres-test"]

[[test]]
name = "postgres_package"
path = "tests/postgres_package.rs"
required-features = ["postgres-test"]

[[test]]
name = "smtp_mailpit"
path = "tests/smtp_mailpit.rs"
required-features = ["smtp-test"]

[[test]]
name = "postgres_messages"
path = "tests/postgres_messages.rs"
required-features = ["postgres-test"]

[[test]]
name = "postgres_dispatch"
path = "tests/postgres_dispatch.rs"
required-features = ["postgres-test"]

[[test]]
name = "postgres_callbacks"
path = "tests/postgres_callbacks.rs"
required-features = ["postgres-test"]

[features]
default = []
postgres-test = []
# Enables the Mailpit SMTP suite. It requires
# `MESSAGING_SMTP_TEST_MAILPIT_SMTP` (the relay's `ip:port`) and
# `MESSAGING_SMTP_TEST_MAILPIT_API` (its HTTP API base URL), and fails when
# either is absent.
smtp-test = []
schema = ["dep:schemars"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
ipnet.workspace = true
jsonwebtoken.workspace = true
lettre.workspace = true
registry-messaging-core.workspace = true
registry-platform-audit.workspace = true
registry-platform-authcommon.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-config.workspace = true
registry-platform-dispatch = { workspace = true, features = ["postgres"] }
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-script.workspace = true
rhai.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
hex.workspace = true
rcgen.workspace = true
registry-messaging-client.workspace = true
registry-platform-testing.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
wiremock.workspace = true
