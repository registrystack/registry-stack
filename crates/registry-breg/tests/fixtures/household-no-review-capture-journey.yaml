apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: household-contact-registration-result-capture
    steps:
      - id: create-household
        entity: household
        accessProfile: household-operator
        claims:
          principal: household-operator
          scopes: [registry:household:operate]
          purpose: household-administration
        request:
          type: create
          data:
            household-code: hh-001
            local-household-number: 1001
            household-name: Ortega household
            administrative-area: district-9
            household-type: private
        expect:
          outcome: success
          status: 201
        capture: household
      - id: create-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request:
          type: create
          data:
            household: {recordCapture: household}
            person-code: person-001
            legal-name: Ana Ortega
            family-name: Ortega
            person-sex: female
            residency-status: usual-resident
            relationship: head
            valid-from: "2026-01-01"
            reason: registration packet verified
        expect:
          outcome: success
          status: 201
        capture: contact-request
      - id: get-before-submit
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request: {type: get, recordCapture: contact-request}
        expect: {outcome: success, status: 200}
        capture: contact-before-submit
      - id: submit-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-submitter
        claims:
          principal: household-contact-submitter
          scopes: [registry:household-contact:submit]
          purpose: household-contact-registration
        request:
          type: submit-request
          recordCapture: contact-before-submit
          etagCapture: contact-before-submit
        expect: {outcome: success, status: 200}
      - id: get-before-apply
        entity: register-household-contact-request
        accessProfile: household-contact-applier
        claims:
          principal: household-contact-applier
          scopes: [registry:household-contact:apply]
          purpose: household-contact-apply
        request: {type: get, recordCapture: contact-request}
        expect: {outcome: success, status: 200}
        capture: contact-before-apply
      - id: apply-contact-request
        entity: register-household-contact-request
        accessProfile: household-contact-applier
        claims:
          principal: household-contact-applier
          scopes: [registry:household-contact:apply]
          purpose: household-contact-apply
        request:
          type: apply-request
          recordCapture: contact-before-apply
          etagCapture: contact-before-apply
          proposalVersionCapture: contact-before-apply
          effectDigestCapture: contact-before-apply
        expect: {outcome: success, status: 200}
        captureResults:
          person: contact-person
          membership: contact-membership
      - id: get-created-contact
        entity: person
        accessProfile: household-operator
        claims:
          principal: household-operator
          scopes: [registry:household:operate]
          purpose: household-administration
        request: {type: get, recordCapture: contact-person}
        expect:
          outcome: success
          status: 200
          fields:
            person-code: person-001
            legal-name: Ana Ortega
            family-name: Ortega
            person-sex: female
            residency-status: usual-resident
      - id: get-created-membership
        entity: group-membership
        accessProfile: household-operator
        claims:
          principal: household-operator
          scopes: [registry:household:operate]
          purpose: household-administration
        request: {type: get, recordCapture: contact-membership}
        expect:
          outcome: success
          status: 200
          fields:
            relationship: head
            valid-from: "2026-01-01"
