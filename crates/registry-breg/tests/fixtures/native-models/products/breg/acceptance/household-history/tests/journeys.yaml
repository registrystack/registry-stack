{
  "apiVersion": "id.registrystack.org/formats/breg/journeys/v1",
  "kind": "BRegJourneys",
  "journeys": [
    {
      "id": "household-history-caller-surfaces",
      "steps": [
        {
          "id": "create-initial-membership",
          "accessProfile": "registry-operator",
          "claims": {
            "principal": "synthetic-history-operator",
            "purpose": "history-maintenance",
            "scopes": [
              "history-maintain"
            ]
          },
          "request": {
            "type": "create",
            "data": {
              "subject": "household-schema-001",
              "group": "A",
              "valid-from": "2026-01-01",
              "source-reference": "schema-initial-membership"
            }
          },
          "expect": {
            "outcome": "success",
            "status": 201,
            "fields": {
              "subject": "household-schema-001",
              "group": "A",
              "valid-from": "2026-01-01",
              "valid-to": null,
              "source-reference": "schema-initial-membership"
            }
          },
          "capture": "initial-membership",
          "recordType": "membership-record"
        },
        {
          "id": "get-initial-membership",
          "accessProfile": "registry-operator",
          "claims": {
            "principal": "synthetic-history-operator",
            "purpose": "history-maintenance",
            "scopes": [
              "history-maintain"
            ]
          },
          "request": {
            "type": "get",
            "recordCapture": "initial-membership"
          },
          "expect": {
            "outcome": "success",
            "status": 200,
            "fields": {
              "subject": "household-schema-001",
              "group": "A",
              "valid-from": "2026-01-01",
              "valid-to": null,
              "source-reference": "schema-initial-membership"
            }
          },
          "recordType": "membership-record"
        },
        {
          "id": "consumer-lists-initial-membership",
          "accessProfile": "eligibility-consumer",
          "claims": {
            "principal": "synthetic-eligibility-consumer",
            "purpose": "eligibility-evaluation",
            "scopes": [
              "eligibility-read"
            ]
          },
          "request": {
            "type": "list"
          },
          "expect": {
            "outcome": "success",
            "status": 200,
            "count": 1
          },
          "recordType": "membership-record"
        },
        {
          "id": "consumer-without-purpose-cannot-list-memberships",
          "accessProfile": "eligibility-consumer",
          "claims": {
            "principal": "synthetic-eligibility-consumer",
            "scopes": [
              "eligibility-read"
            ]
          },
          "request": {
            "type": "list"
          },
          "expect": {
            "outcome": "refusal",
            "status": 404,
            "problemCode": "resource.not_found"
          },
          "recordType": "membership-record"
        }
      ]
    }
  ]
}
