{
  "apiVersion": "id.registrystack.org/formats/breg/module/v1alpha1",
  "kind": "BRegModule",
  "id": "facility-registry-actions-core",
  "version": "0.1.0",
  "recordTypes": [
    {
      "id": "operator",
      "primaryDataset": "facility-registry-actions",
      "route": "operators",
      "mutationMode": "mutable",
      "fields": [
        {
          "id": "operator-code",
          "apiName": "operatorCode",
          "type": "string",
          "required": true,
          "maximumLength": 64,
          "classification": "internal"
        },
        {
          "id": "status",
          "type": "vocabulary-code",
          "vocabulary": "operator-status",
          "required": true,
          "classification": "internal"
        }
      ],
      "constraints": [
        {
          "type": "unique",
          "fields": [
            "operator-code"
          ]
        }
      ]
    },
    {
      "id": "facility",
      "primaryDataset": "facility-registry-actions",
      "route": "facilities",
      "mutationMode": "mutable",
      "fields": [
        {
          "id": "facility-code",
          "apiName": "facilityCode",
          "type": "string",
          "required": true,
          "maximumLength": 64,
          "classification": "internal"
        },
        {
          "id": "label",
          "type": "string",
          "required": true,
          "maximumLength": 200,
          "classification": "internal"
        },
        {
          "id": "owner",
          "type": "string",
          "required": true,
          "maximumLength": 80,
          "classification": "internal"
        }
      ],
      "constraints": [
        {
          "type": "unique",
          "fields": [
            "facility-code"
          ]
        }
      ],
      "hooks": [
        {
          "id": "facility-registered-v1",
          "phase": "after",
          "trigger": "created",
          "projection": [
            "facility-code"
          ],
          "handler": {
            "type": "url",
            "destinationId": "facility-events"
          }
        },
        {
          "id": "facility-owner-changed-v1",
          "phase": "after",
          "trigger": "patched",
          "projection": [
            "facility-code"
          ],
          "when": {
            "type": "fields",
            "changed": [
              "owner"
            ]
          },
          "handler": {
            "type": "url",
            "destinationId": "facility-events"
          }
        }
      ]
    },
    {
      "id": "initial-operator-assignment",
      "primaryDataset": "facility-registry-actions",
      "route": "initial-operator-assignments",
      "mutationMode": "create-only",
      "fields": [
        {
          "id": "facility",
          "type": "reference",
          "target": "facility",
          "required": true,
          "classification": "internal"
        },
        {
          "id": "operator",
          "type": "reference",
          "target": "operator",
          "required": true,
          "classification": "internal"
        }
      ],
      "constraints": [
        {
          "type": "unique",
          "fields": [
            "facility"
          ]
        }
      ],
      "hooks": [
        {
          "id": "initial-operator-assigned-v1",
          "phase": "after",
          "trigger": "created",
          "projection": [
            "facility",
            "operator"
          ],
          "handler": {
            "type": "url",
            "destinationId": "facility-events"
          }
        }
      ]
    }
  ],
  "actions": [
    {
      "id": "register-facility",
      "inputs": [
        {
          "id": "facility-code",
          "apiName": "facilityCode",
          "type": "string",
          "required": true,
          "maximumLength": 64,
          "classification": "internal"
        },
        {
          "id": "label",
          "type": "string",
          "required": true,
          "maximumLength": 200,
          "classification": "internal"
        },
        {
          "id": "owner",
          "type": "string",
          "required": true,
          "maximumLength": 80,
          "classification": "internal"
        },
        {
          "id": "operator",
          "apiName": "operatorId",
          "type": "reference",
          "target": "operator",
          "required": true,
          "classification": "internal"
        }
      ],
      "plan": {
        "type": "fixed",
        "effects": [
          {
            "id": "facility",
            "target": {
              "recordType": "facility"
            },
            "operation": "create",
            "set": {
              "facility-code": {
                "fromInput": "facility-code"
              },
              "label": {
                "fromInput": "label"
              },
              "owner": {
                "fromInput": "owner"
              }
            }
          },
          {
            "id": "initial-assignment",
            "target": {
              "recordType": "initial-operator-assignment"
            },
            "operation": "create",
            "set": {
              "facility": {
                "fromEffect": "facility"
              },
              "operator": {
                "fromInput": "operator"
              }
            }
          }
        ]
      },
      "execution": {
        "mode": "immediate"
      },
      "commitGuards": {
        "targets": [
          {
            "input": "operator",
            "field": "status",
            "equals": "active"
          }
        ]
      }
    },
    {
      "id": "transfer-facility",
      "inputs": [
        {
          "id": "facility",
          "apiName": "facilityId",
          "type": "reference",
          "target": "facility",
          "required": true,
          "classification": "internal"
        },
        {
          "id": "owner",
          "type": "string",
          "required": true,
          "maximumLength": 80,
          "classification": "internal"
        }
      ],
      "plan": {
        "type": "fixed",
        "effects": [
          {
            "id": "facility",
            "target": {
              "fromInput": "facility"
            },
            "operation": "patch",
            "set": {
              "owner": {
                "fromInput": "owner"
              }
            }
          }
        ]
      },
      "execution": {
        "mode": "immediate"
      }
    }
  ]
}
