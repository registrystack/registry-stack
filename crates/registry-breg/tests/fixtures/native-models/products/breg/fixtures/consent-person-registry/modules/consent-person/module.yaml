# Written by `bregctl module add consent --subject person`. The module is
# project-owned from here on: review it, extend it with a local module, or
# edit it and run `bregctl project lock`.
apiVersion: id.registrystack.org/formats/breg/module/v1alpha1
kind: BRegModule
id: consent-person
version: 0.1.0
dependencies: ["consent-person-registry-core"]
recordTypes:
- id: person-privacy-notice
  primaryDataset: consent
  route: person-privacy-notices
  mutationMode: create-only
  classification: public
  fields:
  - {id: notice-version, type: string, maximumLength: 40, required: true, classification: public}
  - {id: language, type: string, maximumLength: 35, required: true, classification: public}
  - {id: title, type: string, maximumLength: 200, required: true, classification: public}
  - {id: text, type: text, maximumLength: 20000, classification: public}
  - {id: text-uri, type: string, maximumLength: 2048, classification: public}
  - {id: controller-name, type: string, maximumLength: 200, required: true, classification: public}
  - {id: controller-contact, type: string, maximumLength: 320, required: true, classification: public}
  - {id: jurisdiction, type: string, maximumLength: 80, required: true, classification: public}
  - {id: legal-basis, type: text, maximumLength: 4000, required: true, classification: public}
  - {id: rights-statement, type: text, maximumLength: 4000, classification: public}
  - {id: rights-uri, type: string, maximumLength: 2048, classification: public}
  - {id: withdrawal-method, type: text, maximumLength: 4000, required: true, classification: public}
  - {id: published-at, type: timestamp, required: true, classification: public}
- id: person-notice-clause
  primaryDataset: consent
  route: person-notice-clauses
  mutationMode: create-only
  classification: public
  fields:
  - {id: notice, type: reference, target: person-privacy-notice, required: true, classification: public}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: public}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: public}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: public}
  - {id: data-life, type: string, maximumLength: 80, classification: public}
  - {id: description, type: text, maximumLength: 4000, required: true, classification: public}
- id: person-consent-link
  primaryDataset: consent
  route: person-consent-links
  mutationMode: mutable
  classification: restricted
  fields:
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: principal, type: string, maximumLength: 255, required: true, classification: restricted}
  - {id: active, type: boolean, required: true, classification: internal}
- id: person-consent-decision
  primaryDataset: consent
  route: person-consent-decisions
  mutationMode: create-only
  classification: restricted
  fields:
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: link, type: reference, target: person-consent-link, classification: internal}
  - {id: notice, type: reference, target: person-privacy-notice, classification: internal}
  - {id: clause, type: reference, target: person-notice-clause, classification: internal}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  - {id: expires-at, type: timestamp, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, required: true, classification: internal}
  - {id: evidence, type: string, maximumLength: 2048, classification: restricted}
  - {id: witness, type: string, maximumLength: 255, classification: restricted}
  - {id: invalidation-reason, type: vocabulary-code, vocabulary: consent-invalidation-reason, classification: internal}
  - {id: source-reference, type: string, maximumLength: 255, classification: internal}
  consentRecord:
    subject: subject
    recipient: recipient
    purpose: purpose
    scope: scope
    decision:
      field: decision
      gives: [given]
      revokes: [refused, withdrawn, invalidated]
      refusals: [refused]
    validity:
      from: effective-at
      until: expires-at
      maximumDurationDays: 365
actions:
- id: give-person-consent
  execution: {mode: immediate}
  consentIssuer: self
  inputs:
  - {id: link, type: reference, target: person-consent-link, required: true, classification: internal}
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: clause, type: reference, target: person-notice-clause, required: true, classification: internal}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [given], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [self-service], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  - {id: expires-at, type: timestamp, classification: internal}
  commitGuards:
    targets:
    - {input: link, field: subject, equalsFromInput: subject}
    - {input: link, field: active, equals: true}
    - {input: clause, field: recipient, equalsFromInput: recipient}
    - {input: clause, field: purpose, equalsFromInput: purpose}
    - {input: clause, field: scope, equalsFromInput: scope}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        link: {fromInput: link}
        subject: {fromInput: subject}
        clause: {fromInput: clause}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
        expires-at: {fromInput: expires-at}
- id: refuse-person-consent
  execution: {mode: immediate}
  consentIssuer: self
  inputs:
  - {id: link, type: reference, target: person-consent-link, required: true, classification: internal}
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: clause, type: reference, target: person-notice-clause, required: true, classification: internal}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [refused], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [self-service], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  commitGuards:
    targets:
    - {input: link, field: subject, equalsFromInput: subject}
    - {input: link, field: active, equals: true}
    - {input: clause, field: recipient, equalsFromInput: recipient}
    - {input: clause, field: purpose, equalsFromInput: purpose}
    - {input: clause, field: scope, equalsFromInput: scope}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        link: {fromInput: link}
        subject: {fromInput: subject}
        clause: {fromInput: clause}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
- id: withdraw-person-consent
  execution: {mode: immediate}
  consentIssuer: self
  inputs:
  - {id: link, type: reference, target: person-consent-link, required: true, classification: internal}
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: clause, type: reference, target: person-notice-clause, required: true, classification: internal}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [withdrawn], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [self-service], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  commitGuards:
    targets:
    - {input: link, field: subject, equalsFromInput: subject}
    - {input: link, field: active, equals: true}
    - {input: clause, field: recipient, equalsFromInput: recipient}
    - {input: clause, field: purpose, equalsFromInput: purpose}
    - {input: clause, field: scope, equalsFromInput: scope}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        link: {fromInput: link}
        subject: {fromInput: subject}
        clause: {fromInput: clause}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
- id: record-person-consent-assisted
  execution: {mode: immediate}
  consentIssuer: steward
  inputs:
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: clause, type: reference, target: person-notice-clause, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [given, refused, withdrawn], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [assisted], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  - {id: expires-at, type: timestamp, classification: internal}
  - {id: evidence, type: string, maximumLength: 2048, required: true, classification: restricted}
  - {id: witness, type: string, maximumLength: 255, classification: restricted}
  commitGuards:
    targets:
    - {input: clause, field: recipient, equalsFromInput: recipient}
    - {input: clause, field: purpose, equalsFromInput: purpose}
    - {input: clause, field: scope, equalsFromInput: scope}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        subject: {fromInput: subject}
        clause: {fromInput: clause}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
        expires-at: {fromInput: expires-at}
        evidence: {fromInput: evidence}
        witness: {fromInput: witness}
- id: invalidate-person-consent
  execution: {mode: immediate}
  consentIssuer: steward
  inputs:
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [invalidated], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [steward-review], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  - {id: invalidation-reason, type: vocabulary-code, vocabulary: consent-invalidation-reason, required: true, classification: internal}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        subject: {fromInput: subject}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
        invalidation-reason: {fromInput: invalidation-reason}
- id: import-person-consent
  execution: {mode: immediate}
  consentIssuer: steward
  inputs:
  - {id: subject, type: reference, target: person, required: true, classification: restricted}
  - {id: recipient, type: vocabulary-code, vocabulary: registry-recipients, required: true, classification: internal}
  - {id: purpose, type: vocabulary-code, vocabulary: data-use-purpose, required: true, classification: internal}
  - {id: scope, type: vocabulary-code, vocabulary: registry-consent-scopes, required: true, classification: internal}
  - {id: decision, type: vocabulary-code, vocabulary: consent-decision, values: [given, refused, withdrawn, invalidated], required: true, classification: internal}
  - {id: channel, type: vocabulary-code, vocabulary: consent-channel, values: [import], required: true, classification: internal}
  - {id: effective-at, type: timestamp, required: true, classification: internal}
  - {id: expires-at, type: timestamp, classification: internal}
  - {id: source-reference, type: string, maximumLength: 255, required: true, classification: internal}
  - {id: evidence, type: string, maximumLength: 2048, classification: restricted}
  plan:
    type: fixed
    effects:
    - id: decision
      target: {recordType: person-consent-decision}
      operation: create
      set:
        subject: {fromInput: subject}
        recipient: {fromInput: recipient}
        purpose: {fromInput: purpose}
        scope: {fromInput: scope}
        decision: {fromInput: decision}
        channel: {fromInput: channel}
        effective-at: {fromInput: effective-at}
        expires-at: {fromInput: expires-at}
        source-reference: {fromInput: source-reference}
        evidence: {fromInput: evidence}
