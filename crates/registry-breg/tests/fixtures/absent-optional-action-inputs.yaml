apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry: {id: absent-optional-action-inputs, version: "1", defaultLanguage: en, canonicalBaseIri: https://absent-optional-action-inputs.example.test}
entities:
  - id: entry
    primaryDataset: test-dataset
    route: entries
    mutationMode: mutable
    fields:
      - {id: label, type: string, maxLength: 40, required: true, classification: internal}
      - {id: note, type: string, maxLength: 80, required: false, classification: internal}
      - {id: status, type: string, maxLength: 20, required: false, classification: internal}
actions:
  - id: create-entry
    inputs:
      - {id: label, type: string, maxLength: 40, required: true, classification: internal}
      - {id: note, type: string, maxLength: 80, required: false, classification: internal}
    effects:
      - id: created
        target: {entity: entry}
        operation: create
        set: {label: {fromField: label}, note: {fromField: note}}
  - id: update-entry
    inputs:
      - {id: entry, apiName: entryId, type: reference, target: entry, required: true, classification: internal}
      - {id: status, type: string, maxLength: 20, required: true, classification: internal}
      - {id: note, type: string, maxLength: 80, required: false, classification: internal}
    effects:
      - id: updated
        target: {fromField: entry}
        operation: patch
        set: {status: {fromField: status}, note: {fromField: note}}
accessProfiles:
  - id: registrar
    default: true
    principalClaim: registry_principal
    permissions:
      - action: create-entry
        operations: [invoke]
        targets: [{entity: entry, rowBoundaries: []}]
        results: [created]
      - action: update-entry
        operations: [invoke]
        targets: [{entity: entry, rowBoundaries: []}]
        results: [updated]
