apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: widget-lifecycle
    steps:
      - id: create-widget
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          type: create
          data: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
        expect:
          outcome: success
          status: 201
          fields: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
        capture: first-widget
      - id: get-widget
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request: {type: get, recordCapture: first-widget}
        expect:
          outcome: success
          status: 200
          fields: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
      - id: list-widgets
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request: {type: list}
        expect:
          outcome: success
          status: 200
          count: 1
          members:
            - recordCapture: first-widget
              fields: {label: first, quantity: 1}
      - id: patch-widget
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          type: patch
          recordCapture: first-widget
          etagCapture: first-widget
          changes:
            - {field: note, value: revised}
        expect:
          outcome: success
          status: 200
          fields: {jurisdiction: zone-a, label: first, note: revised, quantity: 1}
        capture: revised-widget
      - id: batch-create-widgets
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          type: batch
          items:
            - {type: create, data: {jurisdiction: zone-a, label: second, quantity: 2}}
            - {type: create, data: {jurisdiction: zone-a, label: third, quantity: 3}}
        expect: {outcome: success, status: 200, count: 2}
      - id: concealed-without-purpose
        recordType: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          directClaims: {jurisdiction: zone-a}
        request: {type: get, recordCapture: revised-widget}
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
