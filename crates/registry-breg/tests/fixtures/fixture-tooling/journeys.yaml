apiVersion: registry.registrystack.org/breg-journeys/v1
journeys:
  - id: widget-lifecycle
    steps:
      - id: create-widget
        entity: widget
        accessProfile: operator
        claims: &operator_claims
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          operation: create
          data: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
        expect:
          outcome: success
          status: 201
          fields: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
        capture: first-widget
      - id: get-widget
        entity: widget
        accessProfile: operator
        claims: *operator_claims
        request: {operation: get, recordRef: first-widget}
        expect:
          outcome: success
          status: 200
          fields: {jurisdiction: zone-a, label: first, note: initial, quantity: 1}
      - id: list-widgets
        entity: widget
        accessProfile: operator
        claims: *operator_claims
        request: {operation: list}
        expect: {outcome: success, status: 200, count: 1}
      - id: patch-widget
        entity: widget
        accessProfile: operator
        claims: *operator_claims
        request:
          operation: patch
          recordRef: first-widget
          etagRef: first-widget
          changes:
            - {field: note, value: revised}
        expect:
          outcome: success
          status: 200
          fields: {jurisdiction: zone-a, label: first, note: revised, quantity: 1}
        capture: revised-widget
      - id: batch-create-widgets
        entity: widget
        accessProfile: operator
        claims: *operator_claims
        request:
          operation: batch
          items:
            - {operation: create, data: {jurisdiction: zone-a, label: second, quantity: 2}}
            - {operation: create, data: {jurisdiction: zone-a, label: third, quantity: 3}}
        expect: {outcome: success, status: 200, count: 2}
      - id: concealed-without-purpose
        entity: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          directClaims: {jurisdiction: zone-a}
        request: {operation: get, recordRef: revised-widget}
        expect:
          outcome: refusal
          status: 404
          problemCode: resource.not_found
