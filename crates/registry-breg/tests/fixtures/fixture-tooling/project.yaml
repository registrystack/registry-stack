apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project:
  id: fixture-registry
  canonicalBaseIri: https://fixture.invalid
  version: 1.0.0
  defaultLanguage: en
package:
  sourceRevision: fixture-project-source
manifestProjection:
  accessProfile: operator
  classificationCeiling: public
  catalog:
    baseUrl: https://fixture.invalid
    title: Fixture Registry
    publisher: {id: fixture-registry-authority, name: Fixture Publisher}
  publicService: {id: fixture-registry-service, title: Fixture Registry}
  datasets:
    - id: fixture-registry
      title: Fixture Dataset
      owner: Fixture Publisher
      status: active
  dataServices:
    - id: fixture-registry-data-service
      title: Fixture Registry
      endpointUrl: https://fixture.invalid
      servesDatasets: [fixture-registry]
  distributions: []
modules:
  - id: fixture-core
    version: 1.0.0
    digest: MODULE_DIGEST
entities:
  - id: widget
    primaryDataset: fixture-registry
    route: widgets
    mutationMode: mutable
    classification: public
    batch:
      maximumItems: 4
      maximumBytes: 16384
    fields:
      - {id: jurisdiction, type: string, maximumLength: 32, required: true, classification: public}
      - {id: label, type: string, maximumLength: 128, required: true, classification: public}
      - {id: note, type: string, maximumLength: 128, classification: public}
      - {id: quantity, type: int64, required: true, classification: public}
    constraints:
      - {type: unique, fields: [label]}
accessProfiles:
  - id: operator
    default: true
    principalClaim: registry_principal
    requiredScopes: unrestricted
    requiredPurposes: [case-management]
    permissions:
      entities:
        - entity: widget
          operations: [create, get, list, patch, batch]
          readableFields: [jurisdiction, label, note, quantity]
          writableFields: [jurisdiction, label, note, quantity]
          rowBoundaries:
            - {field: jurisdiction, claim: jurisdiction, operator: equals}
