apiVersion: id.registrystack.org/formats/breg/journeys/v1
kind: BRegJourneys
journeys:
  - id: terminal-failure
    steps:
      - id: create-terminal-record
        entity: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          type: create
          data: {jurisdiction: zone-a, label: terminal-first, quantity: 4}
        expect:
          outcome: success
          status: 201
          fields: {jurisdiction: zone-a, label: terminal-first, quantity: 4}
      - id: duplicate-terminal-record
        entity: widget
        accessProfile: operator
        claims:
          principal: fixture-operator
          purpose: case-management
          directClaims: {jurisdiction: zone-a}
        request:
          type: create
          data: {jurisdiction: zone-a, label: terminal-first, quantity: 5}
        expect:
          outcome: success
          status: 201
          fields: {jurisdiction: zone-a, label: terminal-first, quantity: 5}
