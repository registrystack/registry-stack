apiVersion: registry.registrystack.org/v1alpha1
kind: RegistryProject
registry: {id: optional-action-input, version: "1", defaultLanguage: en, canonicalBaseIri: https://optional-action-input.example.test}
entities:
  - id: entry
    primaryDataset: test-dataset
    route: entries
    mutationMode: mutable
    fields:
      - {id: label, type: string, maxLength: 40, required: false, classification: internal}
actions:
  - id: create-entry
    inputs:
      - {id: label, apiName: displayLabel, type: string, maxLength: 40, required: false, classification: internal}
    effects:
      - id: created
        target: {entity: entry}
        operation: create
        set: {label: {fromField: label}}
accessProfiles:
  - id: registrar
    default: true
    principalClaim: registry_principal
    permissions:
      - action: create-entry
        operations: [invoke]
        targets: [{entity: entry, rowBoundaries: []}]
        results: [created]
