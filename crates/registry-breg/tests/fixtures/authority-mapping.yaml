apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project: {id: authority-mapping, version: "1", defaultLanguage: en, canonicalBaseIri: https://authority.example.test}
entities:
  - id: asset
    primaryDataset: test-dataset
    route: assets
    mutationMode: mutable
    changeControl: {requiredFor: [patch]}
    classification: internal
    fields:
      - {id: label, type: string, maximumLength: 32, required: true, classification: internal}
    selectorProfiles:
      - id: label
        fields: [label]
    constraints:
      - {type: unique, fields: [label]}
  - id: correction
    primaryDataset: test-dataset
    route: corrections
    mutationMode: mutable
    classification: internal
    fields:
      - {id: asset, type: reference, target: asset, required: true, classification: internal}
      - {id: label, type: string, maximumLength: 32, required: true, classification: internal}
    changeRequest:
      effects:
        - id: relabel
          target: {fromField: asset}
          operation: patch
          set: {label: {fromField: label}}
      review:
        type: required
        authority: casework-main
        policyId: correction-review
      onApproved: {mode: manual}
accessProfiles:
  - id: operator
    default: true
    principalClaim: registry_principal
    requiredScopes: unrestricted
    permissions:
      entities:
        - entity: asset
          operations: [get, lookup]
          readableFields: [label]
          rowBoundaries: unrestricted
          lookups:
            - selector: label
              valueOrigin: verified-claim
              claimMapping: {label: lookup_label}
          requestPresence:
            - requestType: correction
              rowBoundaries: [{field: label, claim: presence_label, operator: equals}]
  - id: reviewer
    default: true
    principalClaim: registry_principal
    requiredScopes: unrestricted
    permissions:
      entities:
        - entity: correction
          operations: [get, submit-request, apply-request]
          readableFields: [asset, label]
          rowBoundaries: unrestricted
          applyTargets:
            - entity: asset
              rowBoundaries: [{field: label, claim: apply_label, operator: equals}]
