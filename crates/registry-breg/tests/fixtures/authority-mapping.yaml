apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
project: {id: authority-mapping, version: "1", defaultLanguage: en, canonicalBaseIri: https://authority.example.test}
datasets: [{id: test-dataset}]
recordTypes:
  - id: asset
    primaryDataset: test-dataset
    route: assets
    mutationMode: mutable
    mutationPolicy: {patch: proposal-required}
    classification: internal
    fields:
      - {id: label, type: string, maximumLength: 32, required: true, classification: internal}
    selectorProfiles:
      - id: label
        fields: [label]
    constraints:
      - {type: unique, fields: [label]}
actions:
  - id: correction
    execution:
      mode: proposal
      proposal:
        review: {type: none}
        application: {mode: manual}
        retention: {mode: retain}
    inputs:
      - {id: asset, type: reference, target: asset, required: true, classification: internal}
      - {id: label, type: string, maximumLength: 32, required: true, classification: internal}
    plan:
      type: fixed
      effects:
        - id: relabel
          target: {fromInput: asset}
          operation: patch
          set: {label: {fromInput: label}}
accessProfiles:
  - id: operator
    default: true
    principalClaim: registry_principal
    requiredScopes: unrestricted
    permissions:
      records:
        - recordType: asset
          operations: [get, lookup]
          readableFields: [label]
          rowBoundaries: [{field: label, claim: presence_label, operator: equals}]
          lookups:
            - selector: label
              valueOrigin: verified-claim
              claimMapping: {label: lookup_label}
  - id: reviewer
    default: true
    principalClaim: registry_principal
    requiredScopes: unrestricted
    permissions:
      actions:
        - action: correction
          operations: [start]
          targets:
            - recordType: asset
              rowBoundaries: [{field: label, claim: apply_label, operator: equals}]
      proposals:
        - action: correction
          operations: [get, edit, submit, apply]
          ownership: caller
          readableInputs: [asset, label]
          targets:
            - recordType: asset
              rowBoundaries: [{field: label, claim: apply_label, operator: equals}]
