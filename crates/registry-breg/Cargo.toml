[package]
name = "registry-breg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain-neutral compiled base registry engine and runtime."
repository.workspace = true
publish = false
readme = "README.md"

[[bin]]
name = "breg"
path = "src/main.rs"
required-features = ["runtime"]

# Measures the binary, image, and dependency footprint of the platform WASM
# executor. Nothing but an operator running the measurement ever runs it;
# `required-features` keeps it out of builds that do not carry the `wasm`
# feature it exists to weigh.
[[example]]
name = "wasm-footprint-probe"
required-features = ["wasm"]

