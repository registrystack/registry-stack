[lints]
workspace = true

[features]
default = ["wasm"]
runtime = [
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:clap",
    "dep:chacha20poly1305",
    "dep:deadpool-postgres",
    "dep:getrandom",
    "dep:hex",
    "dep:hmac",
    "dep:ipnet",
    "dep:jsonwebtoken",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:registry-platform-audit",
    "dep:registry-platform-authcommon",
    "dep:registry-platform-buildinfo",
    "dep:registry-platform-config",
    "dep:registry-platform-crypto",
    "registry-platform-crypto/transit",
    "registry-platform-hooks/postgres",
    "dep:registry-platform-httpsec",
    "dep:registry-platform-httputil",
    "dep:registry-platform-oidc",
    "dep:registry-review-client",
    "dep:rustls",
    "dep:rustix",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zeroize",
]
postgres-test = ["runtime", "dep:tower", "registry-platform-httputil/test-support"]
postgres-tls-test = ["runtime"]
schema = ["dep:schemars", "registry-platform-hooks/schema"]
tooling = ["dep:tempfile", "dep:tower"]
wasm = ["registry-platform-script/wasm"]

[dependencies]
chrono.workspace = true
registry-evidence-client.workspace = true
registry-evidence-verifier.workspace = true
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
quick-xml = { version = "0.42", optional = true }
reqwest = { workspace = true, optional = true }
registry-platform-canonical-json.workspace = true
registry-manifest-core.workspace = true
registry-platform-audit = { workspace = true, optional = true }
registry-platform-authcommon = { workspace = true, optional = true }
registry-platform-buildinfo = { workspace = true, optional = true }
registry-platform-config = { workspace = true, optional = true }
registry-platform-crypto = { workspace = true, optional = true }
registry-platform-hooks.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"], optional = true }
registry-platform-httputil = { workspace = true, optional = true }
registry-platform-oidc = { workspace = true, optional = true }
registry-review-client = { workspace = true, optional = true }
registry-platform-script.workspace = true
jsonschema.workspace = true
pg_query.workspace = true
rhai = { workspace = true, features = ["internals"] }
rustls = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
