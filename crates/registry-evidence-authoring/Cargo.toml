[package]
name = "registry-evidence-authoring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Evidence authoring form: the model an adopter writes and the checks it must satisfy."
repository.workspace = true
publish = false

# The generator for the committed authoring-form schemas. It is an example
# rather than a binary because nothing but the drift gate and an author
# regenerating the artifact ever runs it, and because `schemars` is optional:
# `required-features` is what keeps a default build of this crate free of it.
[[example]]
name = "authoring-schema"
required-features = ["schema"]

[lints]
workspace = true

[features]
# Off by default: only a caller that publishes a machine-readable description
# of the authoring form pays for `schemars`.
schema = ["dep:schemars"]
# Off by default: in-memory authoring project fixtures for this crate's own
# tests and for adopter tooling tests that need one without restating it.
testing = []

[dependencies]
anyhow.workspace = true
rhai.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
url.workspace = true

[dev-dependencies]
# The parity test compiles the generated schema and runs the corpus through it,
# because a claim that the schema and the checks agree is worth only as much as
# the validator that proves it. Test-only: no shipped code here validates JSON.
jsonschema.workspace = true
