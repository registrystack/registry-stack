[package]
name = "registry-evidence-oid4vci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wallet-facing delivery front end that hands Evidence credentials to a holder over OID4VCI."
repository.workspace = true
publish = false

[[bin]]
name = "evidence-oid4vci"
path = "src/main.rs"

# One storage contract, run against the memory backend always and against
# PostgreSQL when the `postgres-test` feature names a disposable server.
[[test]]
name = "store_contract"
path = "tests/store_contract.rs"

[lints]
workspace = true

[features]
schema = [
  "dep:schemars",
  "registry-platform-audit/schema",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]
# Enables the PostgreSQL half of the storage contract. It requires
# EVIDENCE_OID4VCI_TEST_DATABASE_URL to name a disposable PostgreSQL server.
postgres-test = []

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
registry-evidence-client.workspace = true
registry-evidence-verifier.workspace = true
registry-platform-audit.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto.workspace = true
registry-platform-httputil.workspace = true
registry-platform-oidc.workspace = true
registry-platform-sdjwt.workspace = true
registry-platform-yaml.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum-test.workspace = true
ed25519-dalek.workspace = true
jsonschema.workspace = true
p256.workspace = true
registry-thunderid-tooling.workspace = true
reqwest.workspace = true
tempfile.workspace = true
uuid.workspace = true
