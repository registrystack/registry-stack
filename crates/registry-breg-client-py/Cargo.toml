[package]
name = "registry-breg-client-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python binding for the Base Registry Engine client, via PyO3."
readme = "README.md"
repository.workspace = true
publish = false

[lib]
name = "registry_breg_client"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
# Keep the Rust SDK name distinct from this extension's Python module name.
# Cargo passes both crates to Rustdoc, so sharing a name makes doctests ambiguous.
breg-client-sdk = { package = "registry-breg-client", path = "../registry-breg-client", version = "0.26.0" }
registry-platform-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
