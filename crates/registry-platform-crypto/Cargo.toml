[package]
name = "registry-platform-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
transit = ["dep:reqwest"]
# CMS signed data, certificate chains and RFC 3161 timestamps for document
# signatures (PAdES); off unless a product signs documents.
cms-signing = ["dep:cms", "dep:der", "dep:x509-cert"]
# The `document_signature::test_support` PKI and timestamp responder, for
# consumers' tests only; never enable it in a production build.
test-support = ["cms-signing", "dep:rcgen"]
# Compact JWE (ECDH-ES, P-256, AES-GCM) decryption.
jwe = []
# Test-only compact JWE encryption, so a service can simulate a wallet in its tests.
jwe-test-support = ["jwe"]
# XChaCha20-Poly1305 sealing with random 192-bit nonces.
xchacha-seal = ["dep:chacha20poly1305"]

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
cms = { workspace = true, optional = true }
der = { workspace = true, optional = true }
ed25519-dalek.workspace = true
hmac.workspace = true
p256.workspace = true
pkcs1.workspace = true
pkcs8.workspace = true
rcgen = { workspace = true, optional = true }
registry-platform-canonical-json.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
x509-cert = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
rcgen.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
