[package]
name = "registry-platform-authcommon"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The refusal recorder: the counter, the bounded log line and `record_refusal!`.
# Off by default so client crates that reach this crate through
# `registry-platform-httputil` do not gain the metrics crate.
refusal-recorder = ["dep:registry-platform-metrics", "dep:tracing"]

[dependencies]
base64.workspace = true
futures.workspace = true
registry-platform-crypto.workspace = true
registry-platform-metrics = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
