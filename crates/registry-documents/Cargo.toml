[package]
name = "registry-documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Stack Document Store HTTP service and PostgreSQL runtime."
repository.workspace = true
publish = false

[[bin]]
name = "documents"
path = "src/main.rs"

[[test]]
name = "postgres_startup"
path = "tests/postgres_startup.rs"
required-features = ["postgres-test"]

[features]
default = []
postgres-test = []
schema = [
  "dep:schemars",
  "registry-documents-core/schema",
  "registry-platform-audit/schema",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
registry-documents-core.workspace = true
registry-platform-audit.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-yaml.workspace = true
rustls.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema.workspace = true
registry-documents-client.workspace = true
reqwest.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
tower.workspace = true
url.workspace = true
