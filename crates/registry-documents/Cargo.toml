[package]
name = "registry-documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Stack Document Store HTTP service and PostgreSQL runtime."
repository.workspace = true
publish = false

[[bin]]
name = "documents"
path = "src/main.rs"

[[test]]
name = "postgres_startup"
path = "tests/postgres_startup.rs"
required-features = ["postgres-test"]

[[test]]
name = "postgres_documents"
path = "tests/postgres_documents.rs"
required-features = ["postgres-test"]

[[test]]
name = "postgres_s3"
path = "tests/postgres_s3.rs"
required-features = ["postgres-test"]

[features]
default = []
postgres-test = []
schema = [
  "dep:schemars",
  "registry-documents-core/schema",
  "registry-platform-audit/schema",
  "registry-platform-config/schema",
  "registry-platform-yaml/schema",
]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
futures.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
registry-documents-core.workspace = true
registry-platform-audit.workspace = true
registry-platform-authcommon.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-canonical-json.workspace = true
registry-platform-config.workspace = true
registry-platform-dispatch = { workspace = true, features = ["postgres"] }
registry-platform-objectstore.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-oidc.workspace = true
registry-platform-yaml.workspace = true
rustls.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
jsonschema.workspace = true
registry-documents-client.workspace = true
reqwest.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
url.workspace = true
