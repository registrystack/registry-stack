[package]
name = "registry-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Stack Adapter governed facade, write custody, and audit journal."
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "adapter"
path = "src/main.rs"

[features]
# Gates the suites that need a disposable database; test-postgres.sh runs
# them and a plain cargo test run never silently skips them. Also enables
# the platform's pinned-loopback HTTPS test profile and the TLS suites
# that drive it (tests/egress_tls_wiring.rs), the way registry-breg gates
# its equivalent loopback TLS lane.
postgres-test = [
    "registry-adapter-engine/postgres-test",
    "registry-platform-httputil/test-support",
]
# The governed-ingestion job sources (CONCEPT.md sections 17.1 and 17.2),
# each off by default: `cargo build -p registry-adapter` compiles neither.
# Cargo unifies features across one build, so a build that includes
# registry-adapterctl (which turns both on), a workspace build among them,
# compiles both into the facade binary too. `job-file` gates the file source runtime, the pollEnrich read,
# and the CSV and JSONL decoders; `job-postgres` gates the read-only
# postgres send component. A job whose source needs an ungated component
# refuses at compile under adapter.job.component-unavailable.
job-file = ["registry-adapter-engine/job-file"]
job-postgres = ["registry-adapter-engine/job-postgres"]
schema = [
    "dep:schemars",
    "registry-adapter-core/schema",
    "registry-payment-protocol/schema",
    "registry-payment-simulator-connector/schema",
    "registry-payment-mifos-connector/schema",
    "registry-platform-yaml/schema",
]

[dependencies]
# The continuation cursor codec (CONCEPT.md section 8.11.2): XChaCha20-Poly1305
# with its zeroize feature, so the cipher wipes its copy of the key on drop.
base64.workspace = true
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
getrandom.workspace = true
registry-platform-canonical-json.workspace = true
sha2.workspace = true
zeroize.workspace = true
deadpool-postgres.workspace = true
http.workspace = true
time.workspace = true
tokio.workspace = true
serde_json.workspace = true
url.workspace = true
tokio-postgres.workspace = true
registry-adapter-core.workspace = true
registry-adapter-engine.workspace = true
registry-payment-protocol.workspace = true
registry-payment-simulator-connector.workspace = true
registry-payment-mifos-connector.workspace = true
registry-breg-client.workspace = true
uuid = { workspace = true, features = ["serde"] }
schemars = { workspace = true, optional = true }
async-trait.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-crypto = { workspace = true, features = ["transit"] }
registry-platform-httputil.workspace = true
registry-platform-script.workspace = true
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-oidc.workspace = true
registry-platform-yaml.workspace = true
axum.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
registry-platform-authcommon.workspace = true
rustls.workspace = true
rhai.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The live postgres-source tests iterate the driver's row stream over
# the seam, test-only, never a runtime dependency.
futures.workspace = true
jsonschema.workspace = true
proptest.workspace = true
# The loopback TLS doubles of tests/egress_tls_wiring.rs: a locally
# terminated certificate and acceptor, test-only, never a runtime
# dependency.
rcgen.workspace = true
tokio-rustls.workspace = true
registry-platform-testing.workspace = true
tempfile.workspace = true
serde_norway.workspace = true
