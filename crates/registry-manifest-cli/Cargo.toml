[package]
name = "registry-manifest-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["registry", "metadata", "manifest", "cli", "publish"]
categories = ["command-line-utilities", "encoding"]
publish = false

[lints]
workspace = true

[features]
schema = [
  "dep:schemars",
  "registry-manifest-core/schema",
  "registry-platform-yaml/schema",
]

[[bin]]
name = "registry-manifest"
path = "src/main.rs"

[[example]]
name = "manifest-schema"
required-features = ["schema"]

[dependencies]
registry-manifest-core = { workspace = true }
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-yaml.workspace = true
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
