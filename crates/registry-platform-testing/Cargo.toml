[package]
name = "registry-platform-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["test-utils"]
test-utils = []
# An in-process OAuth authorization server for tests; see `TestAuthorizationServer`.
test-authorization-server = ["test-utils", "dep:sha2", "dep:url", "dep:uuid"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
jsonwebtoken.workspace = true
registry-platform-audit = { workspace = true }
registry-platform-crypto = { workspace = true }
registry-platform-httpsec = { workspace = true, features = ["server"] }
registry-platform-httputil = { workspace = true }
registry-platform-oidc = { workspace = true }
reqwest.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
wiremock.workspace = true

[dev-dependencies]
tempfile.workspace = true
