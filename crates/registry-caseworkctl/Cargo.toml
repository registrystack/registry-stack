[package]
name = "registry-caseworkctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry Casework adopter and local operator tooling."
repository.workspace = true
publish = false

[[bin]]
name = "caseworkctl"
path = "src/main.rs"

[features]
default = []
postgres-test = ["registry-casework/postgres-test"]
schema = [
    "dep:schemars",
    "registry-casework-breg/schema",
    "registry-casework-core/schema",
    "registry-casework/schema",
    "registry-platform-yaml/schema",
]

[lints]
workspace = true

[dependencies]
registry-cli-report.workspace = true
anyhow.workspace = true
clap.workspace = true
jsonschema.workspace = true
registry-platform-buildinfo.workspace = true
registry-platform-config.workspace = true
registry-platform-yaml.workspace = true
registry-rstack-dev.workspace = true
registry-cli-api.workspace = true
registry-thunderid-tooling.workspace = true
registry-casework-breg.workspace = true
registry-casework-core.workspace = true
registry-casework.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
registry-breg.workspace = true
tokio-postgres.workspace = true
