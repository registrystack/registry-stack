apiVersion: registry.registrystack.org/casework/v1alpha1
kind: CaseworkProject
casework:
  id: professional-review
  version: "1"
accessProfiles:
  - id: staff
    principalClaim: registry_principal
    requiredScopes: [casework:staff]
    role: staff
  - id: supervisor
    principalClaim: registry_principal
    requiredScopes: [casework:supervisor]
    role: supervisor
  - id: administrator
    principalClaim: registry_principal
    requiredScopes: [casework:admin]
    role: administrator
  - id: integration-requester
    principalClaim: registry_principal
    requiredScopes: [casework:reviews:request]
    role: requester
sources:
  - id: professional-licences
    adapter: breg
    description: sources/professional-licences.json
    requests:
      - entity: scope-correction
        queue: corrections
        contextProjection:
          - record
          - licensed-activities
          - authorization-conditions
          - supporting-reference
        target:
          id: first-review-response
          after: {elapsed: PT48H}
queues:
  - id: corrections
    label: Licence corrections
reviewKinds:
  - id: scope-correction
    version: "1"
    purpose: approval
    contextStrategy: source
    stages:
      - id: review
        queue: corrections
        decidingProfiles: [staff]
        # The person who submitted the change request in the registry cannot
        # claim, be assigned, or decide its review.
        excludeInitiator: true
        requiredApprovals: 1
    outcomes:
      # A reviewer can send the request back to its submitter, who revises
      # and resubmits it for a fresh review.
      - id: changes-requested
        label: Request changes
        settlement: changes_requested
        reasonRequired: true
    retention:
      terminalDays: 30
      accountabilityDays: 365
    displaySchema:
      # The projected source fields a caller-filtered read may disclose,
      # under their API names. All are optional: the source omits any field
      # the reading caller cannot see. Each property restates the source
      # schema of the professional-licences starter registry, including its
      # example licensed-activities vocabulary. For your own registry, copy
      # each projected field's schema from `bregctl explain change-requests`:
      # a disclosure this schema rejects hides the review task from every
      # reviewer, so `caseworkctl check` and `source add` refuse a property,
      # type, or enum value the imported source description proves it rejects.
      type: object
      additionalProperties: false
      properties:
        record: {type: string, format: uuid}
        licensedActivities:
          type: array
          items:
            type: string
            # Starter vocabulary: replace with your registry's values.
            enum:
              - example-assessment
              - example-advisory-services
              - example-practical-services
          minItems: 1
          maxItems: 3
          uniqueItems: true
          x-registry-maxBytes: 512
        authorizationConditions: {type: string, minLength: 0, maxLength: 500}
        supportingReference: {type: string, minLength: 1, maxLength: 500}
reviewProducers:
  - id: registry-breg
    profile: integration-requester
    issuer: http://127.0.0.1:8091
    subject: professional-review-breg
    # BReg names the submitting person with its own issuer and the value of
    # its principal claim, the same `registry_principal` claim these
    # profiles read.
    trustedInitiatorIssuer: http://127.0.0.1:8091
    sourceNamespaces: [professional-licences]
    kinds: [scope-correction]
    recoveryDays: 7
