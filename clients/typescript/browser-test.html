<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Registry TypeScript client smoke test</title>
<p id="status" role="status">Running browser smoke test</p>
<script type="module">
  import { bregFacilityDocumentsCaseworkEvidence, allPages } from './dist/browser.js'
  const status = document.querySelector('#status')
  try {
    const client = bregFacilityDocumentsCaseworkEvidence.createRegistryClient({
      baseUrl: location.origin,
      fetch: async (url, options) => {
        if (url.pathname !== '/v1/records/facilities' ||
            options.redirect !== 'manual' || options.credentials !== 'same-origin' ||
            options.headers.get('authorization') !== null ||
            options.headers.get('registry-client') !== 'page') {
          throw new Error('Unexpected request')
        }
        return Response.json({
          items: [],
          meta: {
            registryIdentifier: 'local-facilities',
            datasetIdentifier: 'facilities',
            recordTypeIdentifier: 'facility',
          },
          pageInfo: { nextCursor: null },
        })
      },
    })
    const contacts = await allPages(cursor => client.records_facility_listPage({}, cursor))
    if (contacts.length !== 0) throw new Error('Unexpected page')
    status.textContent = 'Passed'
  } catch (error) {
    status.textContent = 'Failed'
    throw error
  }
</script>
</html>
