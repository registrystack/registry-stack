apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thunderid
  namespace: registry-identity-qualification
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: identity.registry-qualification.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thunderid-service
                port:
                  number: 8090
  tls:
    - hosts:
        - identity.registry-qualification.test
      secretName: registry-identity-tls
