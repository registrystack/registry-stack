{{- if and .Values.appKit.enabled .Values.appKit.serve }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-stack.appKitName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-kit
  {{- with .Values.appKit.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.appKit.service.type }}
  selector:
    {{- include "registry-stack.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "app-kit") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.appKit.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
