{{- if and .Values.breg.enabled .Values.breg.serve }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-stack.bregName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: breg
  {{- with .Values.breg.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.breg.service.type }}
  selector:
    {{- include "registry-stack.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "breg") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.breg.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
