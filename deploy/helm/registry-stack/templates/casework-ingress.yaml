{{- if and .Values.casework.enabled .Values.casework.serve .Values.casework.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "registry-stack.caseworkName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: casework
  {{- with .Values.casework.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.casework.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.casework.ingress.host | quote }}
      secretName: {{ .Values.casework.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.casework.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.casework.ingress.path }}
            pathType: {{ .Values.casework.ingress.pathType }}
            backend:
              service:
                name: {{ include "registry-stack.caseworkName" . }}
                port:
                  name: http
{{- end }}
