{{- if and .Values.breg.enabled .Values.breg.serve .Values.breg.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "registry-stack.bregName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: breg
spec:
  podSelector:
    matchLabels:
      {{- include "registry-stack.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "breg") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.breg.networkPolicy.ingress }}
  ingress:
    - from:
      {{- range .Values.breg.networkPolicy.ingress }}
        - {{- toYaml . | nindent 10 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  {{- else }}
  ingress: []
  {{- end }}
  {{- if or .Values.breg.networkPolicy.dns.enabled .Values.breg.networkPolicy.dependencyEgress }}
  egress:
    {{- if .Values.breg.networkPolicy.dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.breg.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.breg.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.breg.networkPolicy.dependencyEgress }}
    - to:
        - {{- toYaml .to | nindent 10 }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
---
{{- end }}
