apiVersion: v1
kind: Secret
metadata:
  name: registry-seaweedfs-s3-config-bootstrap
type: Opaque
stringData:
  seaweedfs_s3_config: |-
    {
      "identities": [
        {
          "name": "registry-breg-bootstrap",
          "credentials": [
            {
              "accessKey": "${BREG_S3_BOOTSTRAP_ACCESS_KEY_ID}",
              "secretKey": "${BREG_S3_BOOTSTRAP_SECRET_ACCESS_KEY}"
            }
          ],
          "actions": ["Admin:registry-breg-attachments"]
        },
        {
          "name": "registry-breg",
          "credentials": [
            {
              "accessKey": "${BREG_S3_ACCESS_KEY_ID}",
              "secretKey": "${BREG_S3_SECRET_ACCESS_KEY}"
            }
          ],
          "actions": [
            "Read:registry-breg-attachments",
            "Write:registry-breg-attachments"
          ]
        }
      ]
    }
